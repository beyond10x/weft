commands:
  # § 13 lines 529-532: an engine is registered with its version before an offering runs on it.
  - name: weft.catalog.RegisterEngine
    naming:
      display: Register an engine
    input:
      - {name: name, type: String}
      - {name: version, type: String}
      - {name: kinds, type: List<weft.catalog.OfferingKind>}
    outcomes:
      - name: registered
        creates: weft.catalog.Engine
        instance: engine_id
        sets:
          name: input.name
          version: input.version
          kinds: input.kinds
        emits: [weft.catalog.EngineRegistered]
        payload:
          weft.catalog.EngineRegistered:
            engine_id: {generated: true}
            name: input.name
            version: input.version

  # § 13 lines 529-532. Refused while anything still runs on the engine.
  - name: weft.catalog.RetireEngine
    naming:
      display: Retire an engine
    input:
      - {name: engine_id, type: weft.shared.EngineId}
    outcomes:
      - name: no-such-engine
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: offering-on-engine
        when_related:
          entity: weft.catalog.Offering
          where: {all: ["engine_id == input.engine_id", "state == Published"]}
          exists: true
        error: weft.catalog.EngineInUse
      - name: instance-on-engine
        when_related:
          entity: weft.catalog.ServiceInstance
          where: {all: ["engine_id == input.engine_id", "state != Gone"]}
          exists: true
        error: weft.catalog.EngineInUse
      - name: retired
        moves: weft.catalog.Engine.retire
        instance: engine_id
        emits: [weft.catalog.EngineRetired]
        payload:
          weft.catalog.EngineRetired:
            engine_id: input.engine_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 lines 514-526: a ClusterOperator publishes an offering of one kind, run by one engine.
  - name: weft.catalog.PublishOffering
    naming:
      display: Publish an offering
    input:
      - {name: name, type: String}
      - {name: kind, type: weft.catalog.OfferingKind}
      - {name: summary, type: String}
      - {name: engine_id, type: weft.shared.EngineId}
    outcomes:
      - name: no-such-engine
        when_related: {via: input.engine_id, exists: false}
        error: weft.catalog.EngineNotFound
      - name: engine-retired
        when_related: {via: input.engine_id, predicate: state == Retired}
        error: weft.catalog.EngineUnavailable
      # Written one disjunct per OfferingKind variant: ess 0.99.2 synthesis finds no engine row
      # for `not exists k in kinds: k == input.kind` beside the row-set guard `name-taken`, so
      # `published`, and every route through an offering, had no scenario. Same meaning as the
      # one-line form SwapOfferingEngine keeps. A new OfferingKind variant needs a disjunct here.
      - name: engine-wrong-kind
        when_related:
          via: input.engine_id
          predicate:
            any:
              - all: [input.kind == queue, {not: {exists: {in: kinds, as: k, that: k == queue}}}]
              - all: [input.kind == stream, {not: {exists: {in: kinds, as: k, that: k == stream}}}]
              - all: [input.kind == cache, {not: {exists: {in: kinds, as: k, that: k == cache}}}]
              - all: [input.kind == kv, {not: {exists: {in: kinds, as: k, that: k == kv}}}]
              - all: [input.kind == sql, {not: {exists: {in: kinds, as: k, that: k == sql}}}]
              - all: [input.kind == object-store, {not: {exists: {in: kinds, as: k, that: k == object-store}}}]
              - all: [input.kind == search, {not: {exists: {in: kinds, as: k, that: k == search}}}]
              - all: [input.kind == vector, {not: {exists: {in: kinds, as: k, that: k == vector}}}]
              - all: [input.kind == scheduler, {not: {exists: {in: kinds, as: k, that: k == scheduler}}}]
              - all: [input.kind == model-endpoint, {not: {exists: {in: kinds, as: k, that: k == model-endpoint}}}]
              - all: [input.kind == sso, {not: {exists: {in: kinds, as: k, that: k == sso}}}]
        error: weft.catalog.EngineWrongKind
      - name: name-taken
        when_related:
          entity: weft.catalog.Offering
          where: name == input.name
          exists: true
        error: weft.catalog.OfferingNameTaken
      - name: published
        creates: weft.catalog.Offering
        instance: offering_id
        sets:
          name: input.name
          kind: input.kind
          summary: input.summary
          engine_id: input.engine_id
        emits: [weft.catalog.OfferingPublished]
        payload:
          weft.catalog.OfferingPublished:
            offering_id: {generated: true}
            name: input.name
            kind: input.kind

  # § 13 lines 531-532: "An engine can be swapped without a change of the offering's API." New
  # service instances run on the new engine; live ones move through UpgradeServiceInstanceEngine.
  - name: weft.catalog.SwapOfferingEngine
    naming:
      display: Swap the engine behind an offering
    input:
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: engine_id, type: weft.shared.EngineId}
      # The offering's kind, stated by the caller so both rows can be checked against it: the
      # offering's stored kind (kind-mismatch) and the engine's kinds (engine-wrong-kind). A guard
      # here reads one row at a time.
      - {name: kind, type: weft.catalog.OfferingKind}
    outcomes:
      - name: no-such-offering
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: offering-retired
        when_subject: {predicate: state == Retired}
        error: weft.catalog.StateConflict
      - name: kind-mismatch
        when_subject: {predicate: kind != input.kind}
        error: weft.catalog.KindMismatch
      - name: no-such-engine
        when_related: {via: input.engine_id, exists: false}
        error: weft.catalog.EngineNotFound
      - name: engine-retired
        when_related: {via: input.engine_id, predicate: state == Retired}
        error: weft.catalog.EngineUnavailable
      - name: engine-wrong-kind
        when_related:
          via: input.engine_id
          predicate: {not: {exists: {in: kinds, as: k, that: k == input.kind}}}
        error: weft.catalog.EngineWrongKind
      - name: swapped
        updates: weft.catalog.Offering
        instance: offering_id
        sets:
          engine_id: input.engine_id
        emits: [weft.catalog.OfferingEngineSwapped]
        payload:
          weft.catalog.OfferingEngineSwapped:
            offering_id: input.offering_id
            engine_id: input.engine_id

  # § 13 lines 514-515 (brief: a ClusterOperator retires offerings; the sketch names no actor).
  - name: weft.catalog.RetireOffering
    naming:
      display: Retire an offering
    input:
      - {name: offering_id, type: weft.shared.OfferingId}
    outcomes:
      - name: no-such-offering
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: retired
        moves: weft.catalog.Offering.retire
        instance: offering_id
        emits: [weft.catalog.OfferingRetired]
        payload:
          weft.catalog.OfferingRetired:
            offering_id: input.offering_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 lines 527-528: a size tier of an offering.
  - name: weft.catalog.AddOfferingPlan
    naming:
      display: Add a plan to an offering
    input:
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: name, type: String}
      - {name: limits, type: List<weft.shared.ResourceAmount>}
      - {name: durability, type: weft.catalog.Durability}
      - {name: replicas, type: Integer}
    outcomes:
      - name: invalid-replicas
        when: replicas < 1
        error: weft.catalog.InvalidReplicas
      - name: no-such-offering
        when_related: {via: input.offering_id, exists: false}
        error: weft.catalog.OfferingNotFound
      - name: offering-retired
        when_related: {via: input.offering_id, predicate: state == Retired}
        error: weft.catalog.OfferingUnavailable
      # § 13 line 518: "cache: key-value with expiry, no durability promise".
      - name: durable-cache
        when_related:
          via: input.offering_id
          predicate: {all: [kind == cache, input.durability == Durable]}
        error: weft.catalog.DurableCache
      - name: added
        creates: weft.catalog.OfferingPlan
        instance: plan_id
        sets:
          offering_id: input.offering_id
          name: input.name
          limits: input.limits
          durability: input.durability
          replicas: input.replicas
        emits: [weft.catalog.PlanAdded]
        payload:
          weft.catalog.PlanAdded:
            plan_id: {generated: true}
            offering_id: input.offering_id
            name: input.name
            durability: input.durability

  # § 13 lines 527-528. A retired plan takes no new service instances; live ones keep it.
  - name: weft.catalog.RetireOfferingPlan
    naming:
      display: Retire a plan
    input:
      - {name: plan_id, type: weft.shared.OfferingPlanId}
    outcomes:
      - name: no-such-plan
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: retired
        moves: weft.catalog.OfferingPlan.retire
        instance: plan_id
        emits: [weft.catalog.PlanRetired]
        payload:
          weft.catalog.PlanRetired:
            plan_id: input.plan_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 lines 510-512 and 533-535: take a ready service from weft by name, in an account or one
  # of its formations. Lines 541-543: it runs as a system-owned formation, whose id is minted here.
  - name: weft.catalog.ProvisionServiceInstance
    naming:
      display: Provision a service instance
    input:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: Optional<weft.shared.FormationId>}
      - {name: name, type: String}
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: plan_id, type: weft.shared.OfferingPlanId}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
    outcomes:
      # hardening pass 1 D3: the instance is provisioned only in the account the caller acts in;
      # another account answers as a missing record.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.catalog.NotFound
      - name: no-such-offering
        when_related: {via: input.offering_id, exists: false}
        error: weft.catalog.OfferingNotFound
      - name: no-such-plan
        when_related: {via: input.plan_id, exists: false}
        error: weft.catalog.PlanNotFound
      # Nothing crosses accounts (§ 1 lines 139-140): a formation of another account is refused.
      # The formation's account is `weft.formations.Formation.account_id`; both formation guards
      # read the formation only when one is named.
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.catalog.FormationNotFound
      # hardening pass 1 disclosure (catalog.yaml:1135): a formation of another account answers
      # as a missing one, right after the existence check, so its existence is not told.
      - name: formation-outside-account
        when_related: {via: input.formation_id, predicate: account_id != input.account_id}
        error: weft.catalog.FormationNotFound
      - name: offering-retired
        when_related: {via: input.offering_id, predicate: state == Retired}
        error: weft.catalog.OfferingUnavailable
      - name: plan-retired
        when_related: {via: input.plan_id, predicate: state == Retired}
        error: weft.catalog.PlanUnavailable
      - name: plan-of-other-offering
        when_related: {via: input.plan_id, predicate: offering_id != input.offering_id}
        error: weft.catalog.PlanNotOfOffering
      - name: name-taken
        when_related:
          entity: weft.catalog.ServiceInstance
          where: {all: ["account_id == input.account_id", "name == input.name", "state != Gone"]}
          exists: true
        error: weft.catalog.ServiceNameTaken
      # § 1 lines 137-138 and § 12 line 477: quotas are checked at every level of the tree.
      # Kept external: the facts are weft's (`weft.accounts.Quota` per account and class, usage in
      # `metering`), but the check sums each limit against the quota of the account and of every
      # account above it, a walk up the parent chain no guard form reads. Same as
      # `weft.claims.DeclareClaim` and `weft.resources`.
      - name: quota-exceeded
        external: the plan's limits do not fit the remaining quota of the account or a parent
        error: weft.catalog.QuotaExceeded
      - name: provisioning
        creates: weft.catalog.ServiceInstance
        instance: service_instance_id
        sets:
          account_id: input.account_id
          formation_id: input.formation_id
          name: input.name
          offering_id: input.offering_id
          kind: {related: {via: input.offering_id, field: kind}}
          plan_id: input.plan_id
          durability: {related: {via: input.plan_id, field: durability}}
          engine_id: {related: {via: input.offering_id, field: engine_id}}
          system_formation_id: {generated: true}
          sleep_policy: input.sleep_policy
        emits: [weft.catalog.ServiceInstanceProvisioning]
        payload:
          weft.catalog.ServiceInstanceProvisioning:
            service_instance_id: {generated: true}
            account_id: input.account_id
            offering_id: input.offering_id
            plan_id: input.plan_id
            system_formation_id: {generated: true}

  # § 13 lines 527-528 and 534-535 "updating": move a live instance to another plan of its own
  # offering.
  # UNMAPPED: a durable instance moved to an ephemeral plan loses its durability promise and its
  # data's backups stop. Refusing it needs the stored `durability` and the new plan's
  # `durability` in one guard; a guard here reads one row at a time. Not declared. Open question
  # for the owner (refuse it, or allow it with a confirmation) and for ESS.
  - name: weft.catalog.ChangeServicePlan
    naming:
      display: Change a service instance's plan
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      # The instance's offering, stated by the caller so the instance (offering-mismatch) and the
      # plan (plan-of-other-offering) are each checked against it.
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: plan_id, type: weft.shared.OfferingPlanId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.catalog.NotFound
      # hardening pass 1 D3: only an instance of the account the caller acts in changes plan;
      # another account's instance answers as a missing one, before its offering is told.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.catalog.NotFound
      - name: offering-mismatch
        when_subject: {predicate: offering_id != input.offering_id}
        error: weft.catalog.OfferingMismatch
      - name: no-such-plan
        when_related: {via: input.plan_id, exists: false}
        error: weft.catalog.PlanNotFound
      - name: plan-retired
        when_related: {via: input.plan_id, predicate: state == Retired}
        error: weft.catalog.PlanUnavailable
      - name: plan-of-other-offering
        when_related: {via: input.plan_id, predicate: offering_id != input.offering_id}
        error: weft.catalog.PlanNotOfOffering
      # Kept external: a walk up the account tree, as at ProvisionServiceInstance.
      - name: quota-exceeded
        external: the new plan's limits do not fit the remaining quota of the account or a parent
        error: weft.catalog.QuotaExceeded
      - name: updating
        moves: weft.catalog.ServiceInstance.update
        instance: service_instance_id
        sets:
          plan_id: input.plan_id
          durability: {related: {via: input.plan_id, field: durability}}
        emits: [weft.catalog.ServiceInstanceUpdating]
        payload:
          weft.catalog.ServiceInstanceUpdating:
            service_instance_id: input.service_instance_id
            plan_id: input.plan_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 4 "Sleep and wake" (lines 274-301): set or clear when a service instance sleeps. Absent: it
  # never sleeps.
  - name: weft.catalog.SetServiceSleepPolicy
    naming:
      display: Set a service instance's sleep policy
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.catalog.NotFound
      # hardening pass 1 D3: only an instance of the account the caller acts in; another
      # account's instance answers as a missing one, before its state is told.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.catalog.NotFound
      - name: gone
        when_subject: {predicate: {state: [Deprovisioning, Gone]}}
        error: weft.catalog.StateConflict
      - name: set
        updates: weft.catalog.ServiceInstance
        instance: service_instance_id
        sets:
          sleep_policy: input.sleep_policy
        emits: [weft.catalog.ServiceSleepPolicySet]
        payload:
          weft.catalog.ServiceSleepPolicySet:
            service_instance_id: input.service_instance_id
            sleep_policy: input.sleep_policy

  # § 13 lines 529-532: a live instance moved to another engine of its kind, after the offering's
  # engine was swapped. The offering's API does not change, so no binding changes.
  # OPEN: whether live instances move to a swapped engine on their own (a rollout the control
  # plane runs) or only when a ClusterOperator moves each; the smallest answer is this command.
  - name: weft.catalog.MoveServiceInstanceEngine
    naming:
      display: Move a service instance to another engine
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: engine_id, type: weft.shared.EngineId}
      # Stated by the caller so the instance (kind-mismatch) and the engine (engine-wrong-kind)
      # are each checked against it.
      - {name: kind, type: weft.catalog.OfferingKind}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: kind-mismatch
        when_subject: {predicate: kind != input.kind}
        error: weft.catalog.KindMismatch
      - name: no-such-engine
        when_related: {via: input.engine_id, exists: false}
        error: weft.catalog.EngineNotFound
      - name: engine-retired
        when_related: {via: input.engine_id, predicate: state == Retired}
        error: weft.catalog.EngineUnavailable
      - name: engine-wrong-kind
        when_related:
          via: input.engine_id
          predicate: {not: {exists: {in: kinds, as: k, that: k == input.kind}}}
        error: weft.catalog.EngineWrongKind
      - name: updating
        moves: weft.catalog.ServiceInstance.update
        instance: service_instance_id
        sets:
          engine_id: input.engine_id
        emits: [weft.catalog.ServiceInstanceEngineMoved]
        payload:
          weft.catalog.ServiceInstanceEngineMoved:
            service_instance_id: input.service_instance_id
            engine_id: input.engine_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 lines 534-535 "ready": the control plane reports the instance's system formation
  # running and serving, after provisioning, an update or a recovery.
  # OPEN: which system actor reports a service instance's health; the sketch names none for the
  # catalog (Translator writes the formation, NodeAgent observes its instances).
  - name: weft.catalog.ReportServiceInstanceReady
    naming:
      display: Report a service instance ready
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: ready
        moves: weft.catalog.ServiceInstance.become_ready
        instance: service_instance_id
        sets:
          degraded_reason: {cleared: true}
        emits: [weft.catalog.ServiceInstanceReady]
        payload:
          weft.catalog.ServiceInstanceReady:
            service_instance_id: input.service_instance_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 lines 534-535 "degraded". A failed provisioning is reported here too.
  # OPEN: whether a provisioning that fails ends the instance (Gone) or leaves it Degraded for
  # the user to deprovision; the smallest answer keeps it, Degraded, with the reason.
  - name: weft.catalog.ReportServiceInstanceDegraded
    naming:
      display: Report a service instance degraded
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: reason, type: String}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: degraded
        moves: weft.catalog.ServiceInstance.degrade
        instance: service_instance_id
        sets:
          degraded_reason: input.reason
        emits: [weft.catalog.ServiceInstanceDegraded]
        payload:
          weft.catalog.ServiceInstanceDegraded:
            service_instance_id: input.service_instance_id
            reason: input.reason
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 lines 534-535 "deprovisioning". Refused while a binding still gives a component access:
  # unbind first, so no component loses a service it is bound to without a record of it.
  # OPEN: what happens to an instance's backups when it is deprovisioned; the smallest answer
  # keeps them (no command here deletes a backup).
  - name: weft.catalog.DeprovisionServiceInstance
    naming:
      display: Deprovision a service instance
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.catalog.NotFound
      # UNMAPPED (hardening pass 1 D3): the caller tie `when_subject: {predicate: account_id !=
      # caller.account_id}` is refused beside the `still-bound` row set (ess 0.99.2,
      # ESS-COMMAND-009: one kind of related row per command), and a caller value is compared only
      # in `when:` or `when_subject:`. Not declared; the account check stays weft-api's. Open
      # question for ESS.
      - name: still-bound
        when_related:
          entity: weft.catalog.ServiceBinding
          where: {all: ["service_instance_id == input.service_instance_id", "state == Active"]}
          exists: true
        error: weft.catalog.StillBound
      - name: deprovisioning
        moves: weft.catalog.ServiceInstance.deprovision
        instance: service_instance_id
        emits: [weft.catalog.ServiceInstanceDeprovisioning]
        payload:
          weft.catalog.ServiceInstanceDeprovisioning:
            service_instance_id: input.service_instance_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 lines 534-535 "gone": the system formation is removed and its data erased.
  - name: weft.catalog.ReportServiceInstanceGone
    naming:
      display: Report a service instance gone
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: gone
        moves: weft.catalog.ServiceInstance.remove
        instance: service_instance_id
        emits: [weft.catalog.ServiceInstanceGone]
        payload:
          weft.catalog.ServiceInstanceGone:
            service_instance_id: input.service_instance_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 lines 536-539: give one component access to a service instance in one mode. Links to
  # service instances follow the same default deny as links between components (§ 3 lines
  # 165-166): this binding is the only thing that opens one.
  # OPEN: whether `admin` needs a higher role than the other modes; the access domain authorizes
  # every management call by role (§ 2 line 154), and the sketch does not set one for it.
  - name: weft.catalog.BindService
    naming:
      display: Bind a component to a service instance
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      # The service instance's account, stated by the caller so the instance (account-mismatch)
      # and the component's formation (cross-account) are each checked against it: a guard reads
      # one row at a time.
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: mode, type: weft.catalog.BindingMode}
    outcomes:
      # hardening pass 1 D3: the stated account is the account the caller acts in; with
      # account-mismatch and cross-account below, the instance and the formation are both of it.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.catalog.NotFound
      - name: no-such-instance
        when_related: {via: input.service_instance_id, exists: false}
        error: weft.catalog.ServiceInstanceNotFound
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.catalog.FormationNotFound
      # hardening pass 1 disclosure (catalog.yaml:1424): an instance of another account answers
      # as a missing one, ahead of every state check (was AccountMismatch). ESS answers every
      # existence check before any predicate, so it cannot sit directly after no-such-instance.
      - name: account-mismatch
        when_related: {via: input.service_instance_id, predicate: account_id != input.account_id}
        error: weft.catalog.ServiceInstanceNotFound
      # § 1 lines 139-140: nothing crosses accounts unless an Export names it. An Export names an
      # endpoint (`weft.formations.Export.endpoint_id`), never a service instance, so a component
      # of another account is always refused. With account-mismatch above, the stated account is
      # the instance's.
      # hardening pass 1 disclosure (catalog.yaml:1431): a formation of another account answers as
      # a missing one, right after the existence check (was CrossAccount).
      - name: cross-account
        when_related: {via: input.formation_id, predicate: account_id != input.account_id}
        error: weft.catalog.FormationNotFound
      - name: instance-unavailable
        when_related:
          via: input.service_instance_id
          predicate: {state: [Deprovisioning, Gone]}
        error: weft.catalog.ServiceInstanceUnavailable
      - name: outside-scope
        when_related:
          via: input.service_instance_id
          predicate: {all: ["defined(formation_id)", "formation_id != input.formation_id"]}
        error: weft.catalog.OutsideServiceScope
      - name: already-bound
        when_related:
          entity: weft.catalog.ServiceBinding
          where:
            all:
              - "service_instance_id == input.service_instance_id"
              - "formation_id == input.formation_id"
              - "component == input.component"
              - "mode == input.mode"
              - "state == Active"
          exists: true
        error: weft.catalog.AlreadyBound
      # Each offering's API is its own ESS system (lines 544-545); that system says which modes it
      # has (a sql database has no publish, a queue no read). Kept external: that system is outside
      # weft's specification, and no field here records an offering's modes.
      - name: mode-not-offered
        external: the offering's API has no operation of this mode
        error: weft.catalog.ModeNotOffered
      - name: bound
        creates: weft.catalog.ServiceBinding
        instance: binding_id
        sets:
          service_instance_id: input.service_instance_id
          formation_id: input.formation_id
          component: input.component
          mode: input.mode
        emits: [weft.catalog.ServiceBound]
        payload:
          weft.catalog.ServiceBound:
            binding_id: {generated: true}
            service_instance_id: input.service_instance_id
            formation_id: input.formation_id
            component: input.component
            mode: input.mode

  # § 13 lines 536-539: end a component's access.
  - name: weft.catalog.UnbindService
    naming:
      display: Unbind a component from a service instance
    input:
      - {name: binding_id, type: weft.shared.ServiceBindingId}
      # hardening pass 1 D3: the account the binding's service instance belongs to, stated by the
      # caller so it is checked against the caller (not-callers-account) and against the instance
      # (instance-of-other-account): a binding row carries no account of its own.
      - {name: account_id, type: weft.shared.AccountId}
    outcomes:
      # hardening pass 1 D3: only a binding in the account the caller acts in is revoked; another
      # account's answers as a missing one.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.catalog.NotFound
      - name: no-such-binding
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: instance-of-other-account
        when_related:
          entity: weft.catalog.ServiceInstance
          where: {all: ["service_instance_id == subject.service_instance_id", "account_id != input.account_id"]}
          exists: true
        error: weft.catalog.NotFound
      - name: revoked
        moves: weft.catalog.ServiceBinding.revoke
        instance: binding_id
        emits: [weft.catalog.ServiceUnbound]
        payload:
          weft.catalog.ServiceUnbound:
            binding_id: input.binding_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 lines 536-539: "no binding, no access". The data plane asks before it lets a caller's
  # workload identity use a service instance; the answer is no unless an active binding of the
  # mode names the caller's component.
  # OPEN: how the caller's workload identity (§ 8 line 425) is resolved to its formation and
  # component; the identity domain does that, and this command takes the resolved parts.
  - name: weft.catalog.CheckServiceAccess
    naming:
      display: Check a component's access to a service instance
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: mode, type: weft.catalog.BindingMode}
    # Reads the bindings only (one kind of related row per command). An unknown instance has no
    # binding and a gone one none active (DeprovisionServiceInstance refuses while bound), so both
    # are `not-bound`.
    # UNMAPPED: refusing a bound instance that is still Provisioning needs the instance's state
    # beside the binding row set; ESS 0.99.2 refuses both on one command (`unsupported_construct`).
    # Not declared; the data plane has no route to an instance that is not serving.
    outcomes:
      - name: not-bound
        when_related:
          entity: weft.catalog.ServiceBinding
          where:
            all:
              - "service_instance_id == input.service_instance_id"
              - "formation_id == input.formation_id"
              - "component == input.component"
              - "mode == input.mode"
              - "state == Active"
          exists: false
        error: weft.catalog.NotBound
      - name: allowed
        accepts: nothing

  # § 13 line 540: back up a durable service instance. A non-durable one is refused by name.
  # OPEN: whether a Degraded instance may be backed up; the smallest safe answer allows Ready and
  # Degraded (a backup of a failing instance is when it is most wanted) and refuses the rest.
  - name: weft.catalog.BackupServiceInstance
    naming:
      display: Back up a service instance
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      # hardening pass 1 D3: the service instance's account, stated by the caller so it is checked
      # against the caller (not-callers-account) and against the instance (instance-foreign); a
      # guard compares the caller with an input or the subject only, and this command has none.
      - {name: account_id, type: weft.shared.AccountId}
    outcomes:
      # hardening pass 1 D3: only in the account the caller acts in.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.catalog.NotFound
      - name: no-such-instance
        when_related: {via: input.service_instance_id, exists: false}
        error: weft.catalog.ServiceInstanceNotFound
      # hardening pass 1 D3: an instance of another account answers as a missing one, before its
      # durability or state is told.
      - name: instance-foreign
        when_related: {via: input.service_instance_id, predicate: account_id != input.account_id}
        error: weft.catalog.ServiceInstanceNotFound
      - name: not-durable
        when_related: {via: input.service_instance_id, predicate: durability == Ephemeral}
        error: weft.catalog.NotDurable
      - name: instance-unavailable
        when_related:
          via: input.service_instance_id
          predicate: {state: [Provisioning, Updating, Deprovisioning, Gone]}
        error: weft.catalog.ServiceInstanceUnavailable
      - name: taking
        creates: weft.catalog.Backup
        instance: backup_id
        sets:
          service_instance_id: input.service_instance_id
          account_id: {related: {via: input.service_instance_id, field: account_id}}
        emits: [weft.catalog.BackupStarted]
        payload:
          weft.catalog.BackupStarted:
            backup_id: {generated: true}
            service_instance_id: input.service_instance_id

  # § 13 line 540. The control plane reports the backup written.
  - name: weft.catalog.ReportBackupCompleted
    naming:
      display: Report a backup completed
    input:
      - {name: backup_id, type: weft.shared.BackupId}
    outcomes:
      - name: no-such-backup
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: completed
        moves: weft.catalog.Backup.complete
        instance: backup_id
        emits: [weft.catalog.BackupCompleted]
        payload:
          weft.catalog.BackupCompleted:
            backup_id: input.backup_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 line 540.
  - name: weft.catalog.ReportBackupFailed
    naming:
      display: Report a backup failed
    input:
      - {name: backup_id, type: weft.shared.BackupId}
      - {name: reason, type: String}
    outcomes:
      - name: no-such-backup
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: failed
        moves: weft.catalog.Backup.fail
        instance: backup_id
        sets:
          failure_reason: input.reason
        emits: [weft.catalog.BackupFailed]
        payload:
          weft.catalog.BackupFailed:
            backup_id: input.backup_id
            reason: input.reason
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 line 540: write a completed backup back into its service instance.
  # OPEN: restoring a backup into another instance (a clone, or a copy to another account) is
  # not in the sketch. The smallest safe answer allows only the instance the backup was taken
  # from, so no data crosses instances or accounts through a restore.
  # OPEN: whether a running restore takes the instance out of Ready (to Updating); the smallest
  # answer leaves its state and refuses a second restore while one runs.
  - name: weft.catalog.RestoreServiceInstance
    naming:
      display: Restore a service instance from a backup
    input:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: backup_id, type: weft.shared.BackupId}
      # hardening pass 1 D3: the service instance's account, stated by the caller so it is checked
      # against the caller (not-callers-account) and against the instance (instance-foreign); a
      # guard compares the caller with an input or the subject only, and this command has none.
      - {name: account_id, type: weft.shared.AccountId}
    outcomes:
      # hardening pass 1 D3: only in the account the caller acts in.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.catalog.NotFound
      - name: no-such-instance
        when_related: {via: input.service_instance_id, exists: false}
        error: weft.catalog.ServiceInstanceNotFound
      - name: no-such-backup
        when_related: {via: input.backup_id, exists: false}
        error: weft.catalog.BackupNotFound
      # hardening pass 1 D3: an instance of another account answers as a missing one, before its
      # durability or state is told (after every existence check: ESS answers those first).
      - name: instance-foreign
        when_related: {via: input.service_instance_id, predicate: account_id != input.account_id}
        error: weft.catalog.ServiceInstanceNotFound
      # hardening pass 1 disclosure (catalog.yaml:1640): a backup of another instance answers as a
      # missing one, before its state is told (was ForeignBackup).
      - name: foreign-backup
        when_related: {via: input.backup_id, predicate: service_instance_id != input.service_instance_id}
        error: weft.catalog.BackupNotFound
      - name: not-durable
        when_related: {via: input.service_instance_id, predicate: durability == Ephemeral}
        error: weft.catalog.NotDurable
      - name: instance-unavailable
        when_related:
          via: input.service_instance_id
          predicate: {state: [Provisioning, Updating, Deprovisioning, Gone]}
        error: weft.catalog.ServiceInstanceUnavailable
      - name: backup-not-completed
        when_related: {via: input.backup_id, predicate: {state: [Taking, Failed]}}
        error: weft.catalog.BackupNotCompleted
      - name: restore-running
        when_related:
          entity: weft.catalog.Restore
          where: {all: ["service_instance_id == input.service_instance_id", "state == Restoring"]}
          exists: true
        error: weft.catalog.RestoreInProgress
      - name: restoring
        creates: weft.catalog.Restore
        instance: restore_id
        sets:
          service_instance_id: input.service_instance_id
          backup_id: input.backup_id
        emits: [weft.catalog.RestoreStarted]
        payload:
          weft.catalog.RestoreStarted:
            restore_id: {generated: true}
            service_instance_id: input.service_instance_id
            backup_id: input.backup_id

  # § 13 line 540.
  - name: weft.catalog.ReportRestoreCompleted
    naming:
      display: Report a restore completed
    input:
      - {name: restore_id, type: weft.shared.RestoreId}
    outcomes:
      - name: no-such-restore
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: completed
        moves: weft.catalog.Restore.complete
        instance: restore_id
        emits: [weft.catalog.RestoreCompleted]
        payload:
          weft.catalog.RestoreCompleted:
            restore_id: input.restore_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 line 540.
  - name: weft.catalog.ReportRestoreFailed
    naming:
      display: Report a restore failed
    input:
      - {name: restore_id, type: weft.shared.RestoreId}
      - {name: reason, type: String}
    outcomes:
      - name: no-such-restore
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: failed
        moves: weft.catalog.Restore.fail
        instance: restore_id
        sets:
          failure_reason: input.reason
        emits: [weft.catalog.RestoreFailed]
        payload:
          weft.catalog.RestoreFailed:
            restore_id: input.restore_id
            reason: input.reason
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 Products lines 561-562, Publisher: the cluster operator first; third parties later.
  - name: weft.catalog.RegisterPublisher
    naming:
      display: Register a publisher
    input:
      - {name: name, type: String}
    outcomes:
      - name: registered
        creates: weft.catalog.Publisher
        instance: publisher_id
        sets:
          name: input.name
        emits: [weft.catalog.PublisherRegistered]
        payload:
          weft.catalog.PublisherRegistered:
            publisher_id: {generated: true}
            name: input.name

  # § 13 Products lines 561-562, Publisher.
  - name: weft.catalog.RetirePublisher
    naming:
      display: Retire a publisher
    input:
      - {name: publisher_id, type: weft.shared.PublisherId}
    outcomes:
      - name: no-such-publisher
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: retired
        moves: weft.catalog.Publisher.retire
        instance: publisher_id
        emits: [weft.catalog.PublisherRetired]
        payload:
          weft.catalog.PublisherRetired:
            publisher_id: input.publisher_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 Products lines 549-555, Product: a packaged application in the catalog.
  - name: weft.catalog.PublishProduct
    naming:
      display: Publish a product
    input:
      - {name: publisher_id, type: weft.shared.PublisherId}
      - {name: name, type: String}
      - {name: summary, type: String}
    outcomes:
      - name: no-such-publisher
        when_related: {via: input.publisher_id, exists: false}
        error: weft.catalog.PublisherNotFound
      - name: publisher-retired
        when_related: {via: input.publisher_id, predicate: state == Retired}
        error: weft.catalog.PublisherUnavailable
      - name: name-taken
        when_related:
          entity: weft.catalog.Product
          where: name == input.name
          exists: true
        error: weft.catalog.ProductNameTaken
      - name: published
        creates: weft.catalog.Product
        instance: product_id
        sets:
          publisher_id: input.publisher_id
          name: input.name
          summary: input.summary
        emits: [weft.catalog.ProductPublished]
        payload:
          weft.catalog.ProductPublished:
            product_id: {generated: true}
            publisher_id: input.publisher_id
            name: input.name

  # § 13 Products lines 549-555, Product. A withdrawn product takes no new installation; live ones
  # keep running.
  - name: weft.catalog.WithdrawProduct
    naming:
      display: Withdraw a product
    input:
      - {name: product_id, type: weft.shared.ProductId}
    outcomes:
      - name: no-such-product
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: withdrawn
        moves: weft.catalog.Product.withdraw
        instance: product_id
        emits: [weft.catalog.ProductWithdrawn]
        payload:
          weft.catalog.ProductWithdrawn:
            product_id: input.product_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 Products lines 556-557, ProductVersion: immutable; names its deployment source, its
  # parameters with a schema, and the offerings and resource classes it needs.
  # OPEN: whether the deployment source must exist and translate before a version is published
  # (a check in `deployments`); the smallest answer leaves it to the install's deploy, which
  # stops on a refused object (§ 5 Translation, lines 347-361).
  - name: weft.catalog.PublishProductVersion
    naming:
      display: Publish a product version
    input:
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version, type: String}
      - {name: source_id, type: weft.shared.DeploymentSourceId}
      - {name: parameters, type: List<weft.catalog.ProductParameter>}
      - {name: required_offerings, type: List<weft.shared.OfferingId>}
      - {name: required_resource_classes, type: List<weft.shared.ResourceClassName>}
    outcomes:
      - name: no-such-product
        when_related: {via: input.product_id, exists: false}
        error: weft.catalog.ProductNotFound
      - name: product-withdrawn
        when_related: {via: input.product_id, predicate: state == Withdrawn}
        error: weft.catalog.ProductUnavailable
      - name: version-taken
        when_related:
          entity: weft.catalog.ProductVersion
          where: {all: ["product_id == input.product_id", "version == input.version"]}
          exists: true
        error: weft.catalog.ProductVersionTaken
      # UNMAPPED: `when_related: {via: input.required_offerings, exists: false}` says this in the
      # model, but ESS 0.99.2 refuses a list-of-references guard beside another related-row guard
      # on one command (`conflicting_declaration`), and the product guards above are kept. Decided
      # outside the specification, refused by name. Open question for ESS.
      # Kept external (rechecked 2026-11-26 on ess 0.99.2: the list guard beside the product
      # guards is still `conflicting_declaration`, "a command guarding on a list of references
      # reads no other related row in this cut").
      - name: no-such-offering
        external: an offering the version requires does not exist
        error: weft.catalog.RequiredOfferingNotFound
      - name: published
        creates: weft.catalog.ProductVersion
        instance: version_id
        sets:
          product_id: input.product_id
          version: input.version
          source_id: input.source_id
          parameters: input.parameters
          required_offerings: input.required_offerings
          required_resource_classes: input.required_resource_classes
        emits: [weft.catalog.ProductVersionPublished]
        payload:
          weft.catalog.ProductVersionPublished:
            version_id: {generated: true}
            product_id: input.product_id
            version: input.version
            source_id: input.source_id

  # § 13 Products lines 556-557, ProductVersion. Withdrawing changes no field (the version stays
  # immutable).
  - name: weft.catalog.WithdrawProductVersion
    naming:
      display: Withdraw a product version
    input:
      - {name: version_id, type: weft.shared.ProductVersionId}
    outcomes:
      - name: no-such-version
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: withdrawn
        moves: weft.catalog.ProductVersion.withdraw
        instance: version_id
        emits: [weft.catalog.ProductVersionWithdrawn]
        payload:
          weft.catalog.ProductVersionWithdrawn:
            version_id: input.version_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 Products lines 558-560, Installation: enable a product version in an account with
  # parameter values. It creates a formation through `deployments`, whose id is minted here.
  - name: weft.catalog.InstallProduct
    naming:
      display: Install a product
    input:
      - {name: account_id, type: weft.shared.AccountId}
      # The version's product, stated by the caller so the product (withdrawn) and the version
      # (of another product) are each checked against it.
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version_id, type: weft.shared.ProductVersionId}
      - {name: parameter_values, type: List<weft.catalog.ParameterValue>}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
    outcomes:
      # hardening pass 1 D3: the product is installed only in the account the caller acts in;
      # another account answers as a missing record.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.catalog.NotFound
      - name: no-such-product
        when_related: {via: input.product_id, exists: false}
        error: weft.catalog.ProductNotFound
      - name: no-such-version
        when_related: {via: input.version_id, exists: false}
        error: weft.catalog.ProductVersionNotFound
      - name: product-withdrawn
        when_related: {via: input.product_id, predicate: state == Withdrawn}
        error: weft.catalog.ProductUnavailable
      - name: version-withdrawn
        when_related: {via: input.version_id, predicate: state == Withdrawn}
        error: weft.catalog.ProductVersionUnavailable
      - name: version-of-other-product
        when_related: {via: input.version_id, predicate: product_id != input.product_id}
        error: weft.catalog.VersionNotOfProduct
      - name: missing-parameter
        when_related:
          via: input.version_id
          predicate:
            exists:
              in: parameters
              as: p
              that:
                all:
                  - p.required == true
                  - not: {exists: {in: input.parameter_values, as: v, that: v.name == p.name}}
        error: weft.catalog.MissingParameter
      - name: unknown-parameter
        when_related:
          via: input.version_id
          predicate:
            exists:
              in: input.parameter_values
              as: v
              that:
                not: {exists: {in: parameters, as: p, that: p.name == v.name}}
        error: weft.catalog.UnknownParameter
      # A JSON Schema evaluation of each value; no guard form evaluates a schema.
      - name: invalid-parameter-value
        external: a parameter value does not satisfy its parameter's schema
        error: weft.catalog.InvalidParameterValue
      # UNMAPPED: the offerings the version requires are a list stored on the version row; a
      # guard reading each of them is a second hop (version, then each offering), which no guard
      # form here reads. Decided outside the specification, refused by name.
      - name: required-offering-unavailable
        external: an offering the version requires is retired or not offered on this cluster
        error: weft.catalog.RequiredOfferingUnavailable
      # § 1 lines 137-138 and § 12 line 477: the version's resource classes and the formation's
      # claims fit the quota. Kept external: a walk up the account tree, as at
      # ProvisionServiceInstance.
      - name: quota-exceeded
        external: the installation's formation does not fit the remaining quota of the account or a parent
        error: weft.catalog.QuotaExceeded
      - name: installing
        creates: weft.catalog.Installation
        instance: installation_id
        sets:
          account_id: input.account_id
          product_id: input.product_id
          version_id: input.version_id
          parameter_values: input.parameter_values
          formation_id: {generated: true}
          sleep_policy: input.sleep_policy
        emits: [weft.catalog.InstallationStarted]
        payload:
          weft.catalog.InstallationStarted:
            installation_id: {generated: true}
            account_id: input.account_id
            product_id: input.product_id
            version_id: input.version_id
            formation_id: {generated: true}

  # § 13 Products lines 558-560, Installation: "upgrade moves it to a newer version". New
  # parameter values are given whole, checked against the new version as at install.
  # UNMAPPED: "newer" needs the installed version's order beside the new version's; a guard here
  # reads the new version's row only, and a version carries no order (`version` is free text).
  # Not declared. Open question for the owner: is a version ordered (semver, a sequence), and is
  # a move to an older version (a rollback) allowed?
  - name: weft.catalog.UpgradeInstallation
    naming:
      display: Upgrade an installation
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version_id, type: weft.shared.ProductVersionId}
      - {name: parameter_values, type: List<weft.catalog.ParameterValue>}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.catalog.NotFound
      # hardening pass 1 D3: only an installation of the account the caller acts in is upgraded;
      # another account's answers as a missing one, before its product is told.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.catalog.NotFound
      - name: product-mismatch
        when_subject: {predicate: product_id != input.product_id}
        error: weft.catalog.ProductMismatch
      - name: no-such-version
        when_related: {via: input.version_id, exists: false}
        error: weft.catalog.ProductVersionNotFound
      - name: version-withdrawn
        when_related: {via: input.version_id, predicate: state == Withdrawn}
        error: weft.catalog.ProductVersionUnavailable
      - name: version-of-other-product
        when_related: {via: input.version_id, predicate: product_id != input.product_id}
        error: weft.catalog.VersionNotOfProduct
      - name: missing-parameter
        when_related:
          via: input.version_id
          predicate:
            exists:
              in: parameters
              as: p
              that:
                all:
                  - p.required == true
                  - not: {exists: {in: input.parameter_values, as: v, that: v.name == p.name}}
        error: weft.catalog.MissingParameter
      - name: unknown-parameter
        when_related:
          via: input.version_id
          predicate:
            exists:
              in: input.parameter_values
              as: v
              that:
                not: {exists: {in: parameters, as: p, that: p.name == v.name}}
        error: weft.catalog.UnknownParameter
      # Kept external, as at InstallProduct: no guard form evaluates a JSON Schema.
      - name: invalid-parameter-value
        external: a parameter value does not satisfy its parameter's schema
        error: weft.catalog.InvalidParameterValue
      # Kept external, as at InstallProduct: a second hop (version, then each listed offering).
      - name: required-offering-unavailable
        external: an offering the new version requires is retired or not offered on this cluster
        error: weft.catalog.RequiredOfferingUnavailable
      # Kept external: a walk up the account tree, as at ProvisionServiceInstance.
      - name: quota-exceeded
        external: the upgraded formation does not fit the remaining quota of the account or a parent
        error: weft.catalog.QuotaExceeded
      - name: upgrading
        moves: weft.catalog.Installation.upgrade
        instance: installation_id
        sets:
          version_id: input.version_id
          parameter_values: input.parameter_values
          failure_reason: {cleared: true}
        emits: [weft.catalog.InstallationUpgrading]
        payload:
          weft.catalog.InstallationUpgrading:
            installation_id: input.installation_id
            version_id: input.version_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 4 "Sleep and wake" (lines 274-301): set or clear when an installation's formation sleeps.
  - name: weft.catalog.SetInstallationSleepPolicy
    naming:
      display: Set an installation's sleep policy
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.catalog.NotFound
      # hardening pass 1 D3: only an installation of the account the caller acts in; another
      # account's answers as a missing one, before its state is told.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.catalog.NotFound
      - name: uninstalled
        when_subject: {predicate: {state: [Uninstalling, Uninstalled]}}
        error: weft.catalog.StateConflict
      - name: set
        updates: weft.catalog.Installation
        instance: installation_id
        sets:
          sleep_policy: input.sleep_policy
        emits: [weft.catalog.InstallationSleepPolicySet]
        payload:
          weft.catalog.InstallationSleepPolicySet:
            installation_id: input.installation_id
            sleep_policy: input.sleep_policy

  # § 13 Products lines 558-560, Installation: the control plane reports the formation deployed.
  - name: weft.catalog.ReportInstallationInstalled
    naming:
      display: Report an installation installed
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: installed
        moves: weft.catalog.Installation.finish
        instance: installation_id
        emits: [weft.catalog.InstallationInstalled]
        payload:
          weft.catalog.InstallationInstalled:
            installation_id: input.installation_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 Products lines 558-560, Installation: the deploy of the formation did not succeed.
  - name: weft.catalog.ReportInstallationFailed
    naming:
      display: Report an installation failed
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: reason, type: String}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: failed
        moves: weft.catalog.Installation.fail
        instance: installation_id
        sets:
          failure_reason: input.reason
        emits: [weft.catalog.InstallationFailed]
        payload:
          weft.catalog.InstallationFailed:
            installation_id: input.installation_id
            reason: input.reason
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 Products lines 558-560, Installation: "uninstall removes the formation".
  # OPEN: whether uninstall keeps the formation's volumes and data (as a backup) or erases them;
  # the sketch says the formation is removed. The smallest answer erases nothing here and leaves
  # the formation's removal to `deployments`.
  - name: weft.catalog.UninstallProduct
    naming:
      display: Uninstall a product
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.catalog.NotFound
      # hardening pass 1 D3: only an installation of the account the caller acts in is
      # uninstalled; another account's answers as a missing one, before its state is told.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.catalog.NotFound
      - name: uninstalling
        moves: weft.catalog.Installation.uninstall
        instance: installation_id
        emits: [weft.catalog.InstallationUninstalling]
        payload:
          weft.catalog.InstallationUninstalling:
            installation_id: input.installation_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

  # § 13 Products lines 558-560, Installation: the control plane reports the formation removed.
  - name: weft.catalog.ReportInstallationUninstalled
    naming:
      display: Report an installation uninstalled
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.catalog.NotFound
      - name: uninstalled
        moves: weft.catalog.Installation.remove
        instance: installation_id
        emits: [weft.catalog.InstallationUninstalled]
        payload:
          weft.catalog.InstallationUninstalled:
            installation_id: input.installation_id
      - name: wrong-state
        wrong_state: true
        error: weft.catalog.StateConflict

# Views. A tenant's view of an offering or a service instance shows the offering's API by kind
# and never the engine (§ 13 lines 529-532: "the user sees the offering's API, never the engine's"):
# no tenant view below has an `engine_id` or a `system_formation_id`. The views marked
# "operator" are the ClusterOperator's.
views:
  # § 13 lines 514-526 Offering: what a tenant can take by name.
  - name: weft.catalog.OfferingCatalog
    source: weft.catalog.Offering
    consistency: read_your_writes
    filter: state == Published
    fields:
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: name, type: String}
      - {name: kind, type: weft.catalog.OfferingKind}
      - {name: summary, type: String}

  # § 13 lines 527-528 OfferingPlan: the size tiers of one offering. Prices are metering's.
  - name: weft.catalog.OfferingPlans
    source: weft.catalog.OfferingPlan
    consistency: read_your_writes
    params:
      - {name: offering_id, type: weft.shared.OfferingId}
    filter: offering_id == param.offering_id
    fields:
      - {name: plan_id, type: weft.shared.OfferingPlanId}
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: name, type: String}
      - {name: limits, type: List<weft.shared.ResourceAmount>}
      - {name: durability, type: weft.catalog.Durability}
      - {name: replicas, type: Integer}
      - {name: state, type: weft.catalog.OfferingPlan.State}

  # § 13 lines 529-532 Engine (operator).
  - name: weft.catalog.EngineList
    source: weft.catalog.Engine
    consistency: read_your_writes
    fields:
      - {name: engine_id, type: weft.shared.EngineId}
      - {name: name, type: String}
      - {name: version, type: String}
      - {name: kinds, type: List<weft.catalog.OfferingKind>}
      - {name: state, type: weft.catalog.Engine.State}

  # § 13 lines 514-532 Offering and Engine (operator): which engine runs each offering.
  - name: weft.catalog.OfferingEngines
    source: weft.catalog.Offering
    consistency: read_your_writes
    fields:
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: name, type: String}
      - {name: kind, type: weft.catalog.OfferingKind}
      - {name: engine_id, type: weft.shared.EngineId}
      - {name: state, type: weft.catalog.Offering.State}

  # § 13 lines 533-535 ServiceInstance: the service instances of one account.
  - name: weft.catalog.ServiceInstanceList
    source: weft.catalog.ServiceInstance
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter: account_id == param.account_id
    fields:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: Optional<weft.shared.FormationId>}
      - {name: name, type: String}
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: kind, type: weft.catalog.OfferingKind}
      - {name: plan_id, type: weft.shared.OfferingPlanId}
      - {name: durability, type: weft.catalog.Durability}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: state, type: weft.catalog.ServiceInstance.State}

  # § 13 lines 533-535 ServiceInstance: one service instance, with why it is degraded.
  # OPEN: the degraded reason is free text written by the control plane; whether it may name the
  # engine is not stated. The smallest answer: it is written for the tenant and names no engine.
  - name: weft.catalog.ServiceInstanceDetail
    source: weft.catalog.ServiceInstance
    consistency: read_your_writes
    params:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
    filter: service_instance_id == param.service_instance_id
    fields:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: Optional<weft.shared.FormationId>}
      - {name: name, type: String}
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: kind, type: weft.catalog.OfferingKind}
      - {name: plan_id, type: weft.shared.OfferingPlanId}
      - {name: durability, type: weft.catalog.Durability}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: degraded_reason, type: Optional<String>}
      - {name: state, type: weft.catalog.ServiceInstance.State}

  # § 13 lines 529-543 ServiceInstance, Engine and "weft runs on weft" (operator): where each
  # instance runs.
  - name: weft.catalog.ServiceInstancePlacement
    source: weft.catalog.ServiceInstance
    consistency: read_your_writes
    fields:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: kind, type: weft.catalog.OfferingKind}
      - {name: engine_id, type: weft.shared.EngineId}
      - {name: system_formation_id, type: weft.shared.FormationId}
      - {name: state, type: weft.catalog.ServiceInstance.State}

  # § 13 lines 536-539 ServiceBinding: who may use one service instance, in which mode.
  - name: weft.catalog.ServiceBindingList
    source: weft.catalog.ServiceBinding
    consistency: read_your_writes
    params:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
    filter: service_instance_id == param.service_instance_id
    fields:
      - {name: binding_id, type: weft.shared.ServiceBindingId}
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: mode, type: weft.catalog.BindingMode}
      - {name: state, type: weft.catalog.ServiceBinding.State}

  # § 13 lines 536-539 ServiceBinding: the service instances the components of one formation are
  # bound to.
  - name: weft.catalog.FormationServiceBindings
    source: weft.catalog.ServiceBinding
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: binding_id, type: weft.shared.ServiceBindingId}
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: mode, type: weft.catalog.BindingMode}
      - {name: state, type: weft.catalog.ServiceBinding.State}

  # § 13 line 540 Backup: the backups of one service instance.
  - name: weft.catalog.BackupList
    source: weft.catalog.Backup
    consistency: read_your_writes
    params:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
    filter: service_instance_id == param.service_instance_id
    fields:
      - {name: backup_id, type: weft.shared.BackupId}
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: failure_reason, type: Optional<String>}
      - {name: state, type: weft.catalog.Backup.State}

  # § 13 line 540 Restore: the restores into one service instance.
  - name: weft.catalog.RestoreList
    source: weft.catalog.Restore
    consistency: read_your_writes
    params:
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
    filter: service_instance_id == param.service_instance_id
    fields:
      - {name: restore_id, type: weft.shared.RestoreId}
      - {name: service_instance_id, type: weft.shared.ServiceInstanceId}
      - {name: backup_id, type: weft.shared.BackupId}
      - {name: failure_reason, type: Optional<String>}
      - {name: state, type: weft.catalog.Restore.State}

  # § 13 Products lines 561-562, Publisher.
  - name: weft.catalog.PublisherList
    source: weft.catalog.Publisher
    consistency: read_your_writes
    fields:
      - {name: publisher_id, type: weft.shared.PublisherId}
      - {name: name, type: String}
      - {name: state, type: weft.catalog.Publisher.State}

  # § 13 Products lines 549-555, Product: what a tenant can install.
  - name: weft.catalog.ProductCatalog
    source: weft.catalog.Product
    consistency: read_your_writes
    filter: state == Published
    fields:
      - {name: product_id, type: weft.shared.ProductId}
      - {name: publisher_id, type: weft.shared.PublisherId}
      - {name: name, type: String}
      - {name: summary, type: String}

  # § 13 Products lines 556-557, ProductVersion: the versions of one product, with what each needs.
  - name: weft.catalog.ProductVersions
    source: weft.catalog.ProductVersion
    consistency: read_your_writes
    params:
      - {name: product_id, type: weft.shared.ProductId}
    filter: product_id == param.product_id
    fields:
      - {name: version_id, type: weft.shared.ProductVersionId}
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version, type: String}
      - {name: source_id, type: weft.shared.DeploymentSourceId}
      - {name: parameters, type: List<weft.catalog.ProductParameter>}
      - {name: required_offerings, type: List<weft.shared.OfferingId>}
      - {name: required_resource_classes, type: List<weft.shared.ResourceClassName>}
      - {name: state, type: weft.catalog.ProductVersion.State}

  # § 13 Products lines 558-560, Installation: the installations of one account.
  - name: weft.catalog.InstallationList
    source: weft.catalog.Installation
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter: account_id == param.account_id
    fields:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version_id, type: weft.shared.ProductVersionId}
      - {name: parameter_values, type: List<weft.catalog.ParameterValue>}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: failure_reason, type: Optional<String>}
      - {name: state, type: weft.catalog.Installation.State}
