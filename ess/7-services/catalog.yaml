# Catalog: managed services weft provides by name. Source: docs/domain-sketch.md § 13 "Catalog
# (managed services)" (lines 508-562), with § Structure (lines 26-127) for actors and planes.
#
# Not in this domain: the data-plane API of each offering (the queue's enqueue and ack, the
# stream's append and replay, the cache's get and set, ...). Each offering's API is its own ESS
# system (future `offerings/<kind>/ess/`, sketch lines 544-545), and its SDKs are generated from
# that system. This domain holds only what the management and control planes record: offerings,
# their plans and engines, provisioned service instances, the bindings that let a component use
# one, and backups and restores.
#
# Price is not here: an OfferingPlan's price lives in `metering`'s PriceList and
# PricingAssignment (sketch § 12, lines 478 and 503-504), keyed by the plan.
domain: weft.catalog

summary: >-
  Managed services weft provides by name: offerings and their plans, the engines behind them,
  service instances provisioned in an account or formation, the bindings through which a
  component uses one, and backups and restores of durable ones.

naming:
  wire: weft
  display: Catalog

types:
  # § 13 lines 556-557: a product version's parameters "with a schema". One declared parameter:
  # its name, whether an installation must give it, and the JSON Schema its value must satisfy.
  # OPEN: secret parameters. The smallest safe answer: parameter values are non-secret, like a
  # formation's Config (§ 3 lines 173-175); a product that needs a secret gets it through a secret
  # grant of its formation (§ 7), never as a parameter value stored here.
  - name: weft.catalog.ProductParameter
    kind: struct
    fields:
      - name: name
        type: String
      - name: required
        type: Boolean
      - name: schema
        type: Json

  # § 13 lines 558-559: one parameter value of an installation.
  - name: weft.catalog.ParameterValue
    kind: struct
    fields:
      - name: name
        type: String
      - name: value
        type: Json

  # § 13 lines 514-526: the kinds of managed service.
  - name: weft.catalog.OfferingKind
    kind: enum
    variants:
      - queue
      - stream
      - cache
      - kv
      - sql
      # Buckets stay in `weft.resources` (integration decision 2026-11-26); where the object-store
      # offering needs one, it names it by `weft.shared.BucketId`. No field here does yet.
      - object-store
      - search
      - vector
      - scheduler
      - model-endpoint
      # Single sign-on a customer configures for its own users (identity provider connections,
      # applications, user directory). Those are operations of the sso offering's own ESS system,
      # not of this domain.
      - sso

  # § 4 "Sleep and wake" (lines 274-301): a service instance or an installation may sleep when
  # idle. Only the policy is recorded here, as `weft.shared.SleepPolicy` (`idle_after`, `kind`:
  # `Stop` or `Suspend`); the sleep state machine (ServiceState asleep, waking, awake,
  # draining-to-sleep) and every wake are `weft.workloads`'. Absent: it never sleeps.

  # § 13 lines 527-528 "durability": cache promises none (line 518).
  # OPEN: whether durability has more levels than these two (replicated, off-site); the smallest
  # answer is a yes/no promise.
  - name: weft.catalog.Durability
    kind: enum
    variants: [Ephemeral, Durable]

  # § 13 lines 536-537: what a binding lets a component do with a service instance.
  - name: weft.catalog.BindingMode
    kind: enum
    variants: [publish, consume, read, write, admin]

  # § 13 lines 527-528 "limits": a plan's limits are `weft.shared.ResourceAmount` values.
  # OPEN: the sketch does not list what a plan limits. The smallest answer reuses the generic
  # resource model (§ 6): an amount of a resource class (memory, volume, bandwidth, rate, ...),
  # the same shape a Claim has.

entities:
  # § 13 lines 529-532 Engine: the versioned implementation behind an offering (NATS JetStream
  # behind queue and stream). Internal: only the ClusterOperator's views show it.
  - name: weft.catalog.Engine
    naming:
      summary: A versioned implementation behind one or more offering kinds; never shown to tenants.
    identity:
      name: engine_id
      type: weft.shared.EngineId
    fields:
      - name: name
        type: String
      - name: version
        type: String
      # The offering kinds this engine can serve (JetStream: queue and stream).
      - name: kinds
        type: List<weft.catalog.OfferingKind>
    # OPEN: the sketch gives no engine lifecycle. Smallest answer: registered, then retired once
    # no published offering and no live service instance runs on it.
    lifecycle:
      initial: Registered
      states: [Registered, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Registered]
          to: Retired

  # § 13 lines 514-526 Offering: a kind of managed service with a simplified API of its own. A
  # ClusterOperator publishes and retires it (brief; the sketch names no actor for it).
  - name: weft.catalog.Offering
    naming:
      summary: A kind of managed service weft provides by name, with an API of its own.
    identity:
      name: offering_id
      type: weft.shared.OfferingId
    fields:
      - name: name
        type: String
      - name: kind
        type: weft.catalog.OfferingKind
      - name: summary
        type: String
      # § 13 lines 531-532: the engine new service instances of this offering run on. Swapping
      # it keeps the offering's API.
      - name: engine_id
        type: weft.shared.EngineId
    relations:
      - name: engine
        kind: references
        target: weft.catalog.Engine
        cardinality: one
        via: engine_id
    # OPEN: what happens to live service instances when their offering is retired. Smallest
    # answer: they keep running; only new provisioning is refused.
    lifecycle:
      initial: Published
      states: [Published, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Published]
          to: Retired

  # § 13 lines 527-528 OfferingPlan: a size tier of an offering (limits, durability, replicas).
  # Its price is metering's (§ 12 lines 478 and 503-504), not a field here.
  - name: weft.catalog.OfferingPlan
    naming:
      summary: A size tier of an offering - its limits, durability and replicas.
    identity:
      name: plan_id
      type: weft.shared.OfferingPlanId
    fields:
      - name: offering_id
        type: weft.shared.OfferingId
      - name: name
        type: String
      - name: limits
        type: List<weft.shared.ResourceAmount>
      - name: durability
        type: weft.catalog.Durability
      - name: replicas
        type: Integer
    relations:
      # UNMAPPED: whether an offering owns its plans (a plan has no meaning without it) or only
      # references them is not stated; `references` is taken because no command deletes either
      # and an offering is retired, never removed. Open question for the owner.
      - name: offering
        kind: references
        target: weft.catalog.Offering
        cardinality: one
        via: offering_id
    # OPEN: the sketch gives no plan lifecycle. Smallest answer: offered, then retired; a retired
    # plan takes no new service instances.
    lifecycle:
      initial: Offered
      states: [Offered, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Offered]
          to: Retired

  # § 13 lines 533-535 ServiceInstance: one provisioned offering in an account or a formation.
  # § 13 lines 541-543: it runs as components of a formation the system owns, on the same nodes,
  # with the same isolation and metering; that formation is named by `system_formation_id`.
  - name: weft.catalog.ServiceInstance
    naming:
      summary: One provisioned offering in an account or a formation, run as a system-owned formation.
    identity:
      name: service_instance_id
      type: weft.shared.ServiceInstanceId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      # Present when the instance belongs to one formation of the account (lines 533-534 "or a
      # formation"); absent when it belongs to the account as a whole.
      - name: formation_id
        type: Optional<weft.shared.FormationId>
      - name: name
        type: String
      - name: offering_id
        type: weft.shared.OfferingId
      # The offering's kind, copied at provisioning; users see the offering's API by kind.
      - name: kind
        type: weft.catalog.OfferingKind
      - name: plan_id
        type: weft.shared.OfferingPlanId
      # The plan's durability, copied when the plan is set; decides backup and restore.
      - name: durability
        type: weft.catalog.Durability
      # Internal (lines 530-531): the engine this instance runs on. No tenant view shows it.
      - name: engine_id
        type: weft.shared.EngineId
      # Lines 541-543: the system-owned formation this instance runs as. Minted at provisioning.
      # OPEN: how that formation is created in `formations` (a translator of `deployments`, or a
      # catalog command of its own); decided in the integration pass.
      - name: system_formation_id
        type: weft.shared.FormationId
      - name: degraded_reason
        type: Optional<String>
      # § 4 "Sleep and wake" (lines 274-301): applied to the components of the system formation.
      # OPEN: whether a plan may forbid sleep (a durable sql that must stay warm) or bound the
      # idle time; the smallest answer lets the instance's owner set it on any plan.
      - name: sleep_policy
        type: Optional<weft.shared.SleepPolicy>
    relations:
      - name: offering
        kind: references
        target: weft.catalog.Offering
        cardinality: one
        via: offering_id
      - name: plan
        kind: references
        target: weft.catalog.OfferingPlan
        cardinality: one
        via: plan_id
      - name: engine
        kind: references
        target: weft.catalog.Engine
        cardinality: one
        via: engine_id
      - name: account
        kind: references
        target: weft.accounts.Account
        cardinality: one
        via: account_id
      - name: formation
        kind: references
        target: weft.formations.Formation
        cardinality: one
        via: formation_id
      # Lines 541-543: the instance runs as this system-owned formation, which lives and goes with
      # the instance. ESS writes `owns` on the owner with `via` on the child, so the instance can
      # own it only if Formation carried a service instance id; it does not, so `references`.
      - name: system_formation
        kind: references
        target: weft.formations.Formation
        cardinality: one
        via: system_formation_id
    # Lines 534-535: provisioning, ready, degraded, updating, deprovisioning, gone.
    lifecycle:
      initial: Provisioning
      states: [Provisioning, Ready, Degraded, Updating, Deprovisioning, Gone]
      terminal: [Gone]
      transitions:
        - name: become_ready
          from: [Provisioning, Degraded, Updating]
          to: Ready
        - name: degrade
          from: [Provisioning, Ready, Updating]
          to: Degraded
        - name: update
          from: [Ready, Degraded]
          to: Updating
        - name: deprovision
          from: [Provisioning, Ready, Degraded, Updating]
          to: Deprovisioning
        - name: remove
          from: [Deprovisioning]
          to: Gone

  # § 13 lines 536-539 ServiceBinding: a component's access to a service instance with a mode.
  # Authenticated by the component's workload identity (§ 8 lines 422-437); it carries no static
  # credential, and no field here holds one. Default deny: a component without an active binding
  # of a mode has no access of that mode (CheckServiceAccess).
  # OPEN: whether a binding is per environment of the component's formation (§ 3 line 176) or
  # for all its environments; the smallest answer binds the component in every environment.
  - name: weft.catalog.ServiceBinding
    naming:
      summary: One component's access to a service instance, in one mode, by workload identity.
    identity:
      name: binding_id
      type: weft.shared.ServiceBindingId
    fields:
      - name: service_instance_id
        type: weft.shared.ServiceInstanceId
      # The component is named by its formation and its name in it (§ 3), the parts of its
      # workload identity (§ 8 line 425) that a binding names.
      - name: formation_id
        type: weft.shared.FormationId
      - name: component
        type: weft.shared.ComponentName
      - name: mode
        type: weft.catalog.BindingMode
    relations:
      - name: service_instance
        kind: references
        target: weft.catalog.ServiceInstance
        cardinality: one
        via: service_instance_id
      - name: formation
        kind: references
        target: weft.formations.Formation
        cardinality: one
        via: formation_id
    lifecycle:
      initial: Active
      states: [Active, Revoked]
      terminal: [Revoked]
      transitions:
        - name: revoke
          from: [Active]
          to: Revoked

  # § 13 line 540 Backup: a copy of a durable service instance's data. Non-durable offerings
  # (cache, and any instance on an ephemeral plan) have none: refused by name.
  # OPEN: retention and deletion of backups; the sketch gives none. The smallest answer keeps
  # every completed backup and declares no delete.
  - name: weft.catalog.Backup
    naming:
      summary: A copy of a durable service instance's data, taken on request.
    identity:
      name: backup_id
      type: weft.shared.BackupId
    fields:
      - name: service_instance_id
        type: weft.shared.ServiceInstanceId
      # The instance's account, copied when the backup is taken, so an account's backups are
      # listed without reading the instance.
      - name: account_id
        type: weft.shared.AccountId
      - name: failure_reason
        type: Optional<String>
    relations:
      - name: service_instance
        kind: references
        target: weft.catalog.ServiceInstance
        cardinality: one
        via: service_instance_id
      - name: account
        kind: references
        target: weft.accounts.Account
        cardinality: one
        via: account_id
    lifecycle:
      initial: Taking
      states: [Taking, Completed, Failed]
      terminal: [Completed, Failed]
      transitions:
        - name: complete
          from: [Taking]
          to: Completed
        - name: fail
          from: [Taking]
          to: Failed

  # § 13 line 540 Restore: a completed backup written back into its service instance.
  - name: weft.catalog.Restore
    naming:
      summary: A completed backup written back into the service instance it was taken from.
    identity:
      name: restore_id
      type: weft.shared.RestoreId
    fields:
      - name: service_instance_id
        type: weft.shared.ServiceInstanceId
      - name: backup_id
        type: weft.shared.BackupId
      - name: failure_reason
        type: Optional<String>
    relations:
      - name: service_instance
        kind: references
        target: weft.catalog.ServiceInstance
        cardinality: one
        via: service_instance_id
      - name: backup
        kind: references
        target: weft.catalog.Backup
        cardinality: one
        via: backup_id
    lifecycle:
      initial: Restoring
      states: [Restoring, Completed, Failed]
      terminal: [Completed, Failed]
      transitions:
        - name: complete
          from: [Restoring]
          to: Completed
        - name: fail
          from: [Restoring]
          to: Failed

  # § 13 lines 561-562 Publisher: who publishes a product; the cluster operator first, third
  # parties later.
  # OPEN: how a third-party publisher is admitted and trusted (identity, review, signing of its
  # deployment sources). Until decided, only a ClusterOperator registers publishers.
  - name: weft.catalog.Publisher
    naming:
      summary: Who publishes products in the catalog; the cluster operator first.
    identity:
      name: publisher_id
      type: weft.shared.PublisherId
    fields:
      - name: name
        type: String
    # OPEN: the sketch gives no publisher lifecycle. Smallest answer: registered, then retired; a
    # retired publisher publishes nothing new, and its products stay installable until withdrawn.
    lifecycle:
      initial: Registered
      states: [Registered, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Registered]
          to: Retired

  # § 13 lines 549-555 Product: a packaged application a customer enables in an account,
  # published as a versioned formation template (example: the beyond10x `slot` build server).
  # Unlike an offering, it runs as the customer's own formation, which the customer sees, scales
  # and pays for per use. Its price is metering's (§ 12 lines 503-504 PricingAssignment), not a
  # field here.
  - name: weft.catalog.Product
    naming:
      summary: A packaged application, published as versioned formation templates, run as the customer's own formation.
    identity:
      name: product_id
      type: weft.shared.ProductId
    fields:
      - name: publisher_id
        type: weft.shared.PublisherId
      - name: name
        type: String
      - name: summary
        type: String
    relations:
      # UNMAPPED: whether a publisher owns its products (a product has no meaning without its
      # publisher) or only references them is not stated; `references` is taken because neither
      # is ever deleted. Open question for the owner.
      - name: publisher
        kind: references
        target: weft.catalog.Publisher
        cardinality: one
        via: publisher_id
    # OPEN: the sketch gives no product lifecycle. Smallest answer: published, then withdrawn; a
    # withdrawn product takes no new installation, and live installations keep running.
    lifecycle:
      initial: Published
      states: [Published, Withdrawn]
      terminal: [Withdrawn]
      transitions:
        - name: withdraw
          from: [Published]
          to: Withdrawn

  # § 13 lines 556-557 ProductVersion: immutable. No command changes its fields; a change is a
  # new version.
  - name: weft.catalog.ProductVersion
    naming:
      summary: One immutable version of a product - its deployment source, parameters and needs.
    identity:
      name: version_id
      type: weft.shared.ProductVersionId
    fields:
      - name: product_id
        type: weft.shared.ProductId
      - name: version
        type: String
      # The formation template: a deployment source of `deployments` (§ 5 lines 312-315).
      - name: source_id
        type: weft.shared.DeploymentSourceId
      - name: parameters
        type: List<weft.catalog.ProductParameter>
      - name: required_offerings
        type: List<weft.shared.OfferingId>
      - name: required_resource_classes
        type: List<weft.shared.ResourceClassName>
    relations:
      # UNMAPPED: whether a product owns its versions or only references them is not stated;
      # `references` is taken because neither is ever deleted. Open question for the owner.
      - name: product
        kind: references
        target: weft.catalog.Product
        cardinality: one
        via: product_id
      - name: offerings
        kind: references
        target: weft.catalog.Offering
        cardinality: many
        via: required_offerings
      - name: source
        kind: references
        target: weft.deployments.DeploymentSource
        cardinality: one
        via: source_id
      - name: resource_classes
        kind: references
        target: weft.inventory.ResourceClass
        cardinality: many
        via: required_resource_classes
    # Immutable fields; the state says only whether new installations may take it.
    # OPEN: the sketch gives no version lifecycle. Smallest answer: published, then withdrawn (a
    # broken or vulnerable version); live installations of it keep running until upgraded.
    lifecycle:
      initial: Published
      states: [Published, Withdrawn]
      terminal: [Withdrawn]
      transitions:
        - name: withdraw
          from: [Published]
          to: Withdrawn

  # § 13 lines 558-560 Installation: a product version enabled in an account with parameter
  # values. It creates a formation through `deployments`, named by `formation_id`.
  - name: weft.catalog.Installation
    naming:
      summary: A product version enabled in an account with parameter values, run as a formation of the account.
    identity:
      name: installation_id
      type: weft.shared.InstallationId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: product_id
        type: weft.shared.ProductId
      - name: version_id
        type: weft.shared.ProductVersionId
      - name: parameter_values
        type: List<weft.catalog.ParameterValue>
      # The customer's formation the installation runs as. Minted at install; `deployments`
      # creates it from the version's deployment source.
      # OPEN: how the formation is created and named (a deploy the control plane issues on the
      # account's behalf, or a translator); decided in the integration pass.
      - name: formation_id
        type: weft.shared.FormationId
      - name: failure_reason
        type: Optional<String>
      # § 4 "Sleep and wake" (lines 274-301): applied to the components of the installation's
      # formation.
      - name: sleep_policy
        type: Optional<weft.shared.SleepPolicy>
    relations:
      - name: product
        kind: references
        target: weft.catalog.Product
        cardinality: one
        via: product_id
      - name: version
        kind: references
        target: weft.catalog.ProductVersion
        cardinality: one
        via: version_id
      - name: account
        kind: references
        target: weft.accounts.Account
        cardinality: one
        via: account_id
      - name: formation
        kind: references
        target: weft.formations.Formation
        cardinality: one
        via: formation_id
    # OPEN: the sketch names install, upgrade and uninstall only. Smallest answer: installing,
    # installed, upgrading, failed (a deploy that did not succeed), uninstalling, uninstalled.
    lifecycle:
      initial: Installing
      states: [Installing, Installed, Upgrading, Failed, Uninstalling, Uninstalled]
      terminal: [Uninstalled]
      transitions:
        - name: finish
          from: [Installing, Upgrading]
          to: Installed
        - name: fail
          from: [Installing, Upgrading]
          to: Failed
        - name: upgrade
          from: [Installed, Failed]
          to: Upgrading
        - name: uninstall
          from: [Installed, Failed]
          to: Uninstalling
        - name: remove
          from: [Uninstalling]
          to: Uninstalled

errors:
  - name: weft.catalog.NotFound
    summary: The addressed record does not exist, and nothing changed.
  - name: weft.catalog.StateConflict
    summary: The addressed record is not in a state this command acts from, and nothing changed.
  - name: weft.catalog.EngineNotFound
    summary: The named engine does not exist.
  - name: weft.catalog.EngineUnavailable
    summary: The named engine is retired and serves nothing new.
  - name: weft.catalog.EngineWrongKind
    summary: The named engine does not serve this offering's kind.
  - name: weft.catalog.EngineInUse
    summary: A published offering or a live service instance still runs on this engine.
  - name: weft.catalog.KindMismatch
    summary: The stated kind is not the offering's kind.
  - name: weft.catalog.OfferingNameTaken
    summary: An offering with this name already exists.
  - name: weft.catalog.OfferingNotFound
    summary: The named offering does not exist.
  - name: weft.catalog.OfferingUnavailable
    summary: The named offering is retired and takes nothing new.
  - name: weft.catalog.InvalidReplicas
    summary: A plan needs at least one replica.
  - name: weft.catalog.DurableCache
    summary: A cache offering makes no durability promise, so it has no durable plan.
  - name: weft.catalog.PlanNotFound
    summary: The named plan does not exist.
  - name: weft.catalog.PlanUnavailable
    summary: The named plan is retired and takes no new service instances.
  - name: weft.catalog.PlanNotOfOffering
    summary: The named plan belongs to another offering.
  - name: weft.catalog.OfferingMismatch
    summary: The stated offering is not the service instance's offering.
  - name: weft.catalog.ServiceNameTaken
    summary: A live service instance with this name already exists in the account.
  - name: weft.catalog.FormationNotFound
    summary: The named formation does not exist.
  - name: weft.catalog.QuotaExceeded
    summary: The plan's limits do not fit the remaining quota of the account or one of its parents.
  - name: weft.catalog.StillBound
    summary: An active binding still gives a component access to this service instance.
  - name: weft.catalog.ServiceInstanceNotFound
    summary: The named service instance does not exist.
  - name: weft.catalog.ServiceInstanceUnavailable
    summary: The named service instance is not serving (provisioning, deprovisioning or gone).
  - name: weft.catalog.OutsideServiceScope
    summary: The service instance belongs to another formation than the component's.
  - name: weft.catalog.ModeNotOffered
    summary: The offering's API has no operation of this binding mode.
  - name: weft.catalog.AlreadyBound
    summary: The component already holds an active binding of this mode to this service instance.
  - name: weft.catalog.NotBound
    summary: The component holds no active binding of this mode to this service instance, so it has no access.
  - name: weft.catalog.NotDurable
    summary: The service instance makes no durability promise (a cache, or an ephemeral plan), so it has no backup or restore.
  - name: weft.catalog.BackupNotFound
    summary: The named backup does not exist.
  - name: weft.catalog.BackupNotCompleted
    summary: The named backup is still being taken or failed, so it cannot be restored.
  - name: weft.catalog.RestoreInProgress
    summary: A restore into this service instance is still running.
  - name: weft.catalog.PublisherNotFound
    summary: The named publisher does not exist.
  - name: weft.catalog.PublisherUnavailable
    summary: The named publisher is retired and publishes nothing new.
  - name: weft.catalog.ProductNameTaken
    summary: A product with this name already exists.
  - name: weft.catalog.ProductNotFound
    summary: The named product does not exist.
  - name: weft.catalog.ProductUnavailable
    summary: The named product is withdrawn and takes no new installation or version.
  - name: weft.catalog.ProductVersionTaken
    summary: The product already has a version with this name; a version never changes.
  - name: weft.catalog.ProductVersionNotFound
    summary: The named product version does not exist.
  - name: weft.catalog.ProductVersionUnavailable
    summary: The named product version is withdrawn and takes no new installation.
  - name: weft.catalog.VersionNotOfProduct
    summary: The named version belongs to another product.
  - name: weft.catalog.ProductMismatch
    summary: The stated product is not the installation's product.
  - name: weft.catalog.RequiredOfferingNotFound
    summary: A required offering the version names does not exist.
  - name: weft.catalog.RequiredOfferingUnavailable
    summary: An offering the version requires is not available (retired, or not offered here).
  - name: weft.catalog.MissingParameter
    summary: A parameter the version requires has no value.
  - name: weft.catalog.UnknownParameter
    summary: A value names a parameter the version does not declare.
  - name: weft.catalog.InvalidParameterValue
    summary: A parameter value does not satisfy the parameter's schema.

events:
  - name: weft.catalog.EngineRegistered
    fields:
      - {name: engine_id, type: weft.shared.EngineId}
      - {name: name, type: String}
      - {name: version, type: String}
  - name: weft.catalog.EngineRetired
