# Catalog: managed services weft provides by name. Source: docs/domain-sketch.md § 13 "Catalog
# (managed services)" (lines 508-562), with § Structure (lines 26-127) for actors and planes.
#
# Not in this domain: the data-plane API of each offering (the queue's enqueue and ack, the
# stream's append and replay, the cache's get and set, ...). Each offering's API is its own ESS
# system (future `offerings/<kind>/ess/`, sketch lines 544-545), and its SDKs are generated from
# that system. This domain holds only what the management and control planes record: offerings,
# their plans and engines, provisioned service instances, the bindings that let a component use
# one, and backups and restores.
#
# Price is not here: an OfferingPlan's price lives in `metering`'s PriceList and
# PricingAssignment (sketch § 12, lines 478 and 503-504), keyed by the plan.
domain: weft.catalog

summary: >-
  Managed services weft provides by name: offerings and their plans, the engines behind them,
  service instances provisioned in an account or formation, the bindings through which a
  component uses one, and backups and restores of durable ones.

naming:
  wire: weft
  display: Catalog

types:
  # § 13 lines 556-557: a product version's parameters "with a schema". One declared parameter:
  # its name, whether an installation must give it, and the JSON Schema its value must satisfy.
  # OPEN: secret parameters. The smallest safe answer: parameter values are non-secret, like a
  # formation's Config (§ 3 lines 173-175); a product that needs a secret gets it through a secret
  # grant of its formation (§ 7), never as a parameter value stored here.
  - name: weft.catalog.ProductParameter
    kind: struct
    fields:
      - name: name
        type: String
      - name: required
        type: Boolean
      - name: schema
        type: Json

  # § 13 lines 558-559: one parameter value of an installation.
  - name: weft.catalog.ParameterValue
    kind: struct
    fields:
      - name: name
        type: String
      - name: value
        type: Json

entities:
  # § 13 lines 529-532 Engine: the versioned implementation behind an offering (NATS JetStream
  # behind queue and stream). Internal: only the ClusterOperator's views show it.
  - name: weft.catalog.Engine
    naming:
      summary: A versioned implementation behind one or more offering kinds; never shown to tenants.
    identity:
      name: engine_id
      type: weft.shared.EngineId
    fields:
      - name: name
        type: String
      - name: version
        type: String
      # The offering kinds this engine can serve (JetStream: queue and stream).
      - name: kinds
        type: List<weft.services.OfferingKind>
    # OPEN: the sketch gives no engine lifecycle. Smallest answer: registered, then retired once
    # no published offering and no live service instance runs on it.
    lifecycle:
      initial: Registered
      states: [Registered, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Registered]
          to: Retired

  # § 13 lines 527-528 OfferingPlan: a size tier of an offering (limits, durability, replicas).
  # Its price is metering's (§ 12 lines 478 and 503-504), not a field here.
  - name: weft.catalog.OfferingPlan
    naming:
      summary: A size tier of an offering - its limits, durability and replicas.
    identity:
      name: plan_id
      type: weft.shared.OfferingPlanId
    fields:
      - name: offering_id
        type: weft.shared.OfferingId
      - name: name
        type: String
      - name: limits
        type: List<weft.shared.ResourceAmount>
      - name: durability
        type: weft.services.Durability
      - name: replicas
        type: Integer
    relations:
      # UNMAPPED: whether an offering owns its plans (a plan has no meaning without it) or only
      # references them is not stated; `references` is taken because no command deletes either
      # and an offering is retired, never removed. Open question for the owner.
      - name: offering
        kind: references
        target: weft.services.Offering
        cardinality: one
        via: offering_id
    # OPEN: the sketch gives no plan lifecycle. Smallest answer: offered, then retired; a retired
    # plan takes no new service instances.
    lifecycle:
      initial: Offered
      states: [Offered, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Offered]
          to: Retired

  # § 13 lines 561-562 Publisher: who publishes a product; the cluster operator first, third
  # parties later.
  # OPEN: how a third-party publisher is admitted and trusted (identity, review, signing of its
  # deployment sources). Until decided, only a ClusterOperator registers publishers.
  - name: weft.catalog.Publisher
    naming:
      summary: Who publishes products in the catalog; the cluster operator first.
    identity:
      name: publisher_id
      type: weft.shared.PublisherId
    fields:
      - name: name
        type: String
    # OPEN: the sketch gives no publisher lifecycle. Smallest answer: registered, then retired; a
    # retired publisher publishes nothing new, and its products stay installable until withdrawn.
    lifecycle:
      initial: Registered
      states: [Registered, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Registered]
          to: Retired

  # § 13 lines 549-555 Product: a packaged application a customer enables in an account,
  # published as a versioned formation template (example: the beyond10x `slot` build server).
  # Unlike an offering, it runs as the customer's own formation, which the customer sees, scales
  # and pays for per use. Its price is metering's (§ 12 lines 503-504 PricingAssignment), not a
  # field here.
  - name: weft.catalog.Product
    naming:
      summary: A packaged application, published as versioned formation templates, run as the customer's own formation.
    identity:
      name: product_id
      type: weft.shared.ProductId
    fields:
      - name: publisher_id
        type: weft.shared.PublisherId
      - name: name
        type: String
      - name: summary
        type: String
    relations:
      # UNMAPPED: whether a publisher owns its products (a product has no meaning without its
      # publisher) or only references them is not stated; `references` is taken because neither
      # is ever deleted. Open question for the owner.
      - name: publisher
        kind: references
        target: weft.catalog.Publisher
        cardinality: one
        via: publisher_id
    # OPEN: the sketch gives no product lifecycle. Smallest answer: published, then withdrawn; a
    # withdrawn product takes no new installation, and live installations keep running.
    lifecycle:
      initial: Published
      states: [Published, Withdrawn]
      terminal: [Withdrawn]
      transitions:
        - name: withdraw
          from: [Published]
          to: Withdrawn

  # § 13 lines 556-557 ProductVersion: immutable. No command changes its fields; a change is a
  # new version.
  - name: weft.catalog.ProductVersion
    naming:
      summary: One immutable version of a product - its deployment source, parameters and needs.
    identity:
      name: version_id
      type: weft.shared.ProductVersionId
    fields:
      - name: product_id
        type: weft.shared.ProductId
      - name: version
        type: String
      # The formation template: a deployment source of `deployments` (§ 5 lines 312-315).
      - name: source_id
        type: weft.shared.DeploymentSourceId
      - name: parameters
        type: List<weft.catalog.ProductParameter>
      - name: required_offerings
        type: List<weft.shared.OfferingId>
      - name: required_resource_classes
        type: List<weft.shared.ResourceClassName>
    relations:
      # UNMAPPED: whether a product owns its versions or only references them is not stated;
      # `references` is taken because neither is ever deleted. Open question for the owner.
      - name: product
        kind: references
        target: weft.catalog.Product
        cardinality: one
        via: product_id
      - name: offerings
        kind: references
        target: weft.services.Offering
        cardinality: many
        via: required_offerings
      - name: source
        kind: references
        target: weft.deployments.DeploymentSource
        cardinality: one
        via: source_id
      - name: resource_classes
        kind: references
        target: weft.inventory.ResourceClass
        cardinality: many
        via: required_resource_classes
    # Immutable fields; the state says only whether new installations may take it.
    # OPEN: the sketch gives no version lifecycle. Smallest answer: published, then withdrawn (a
    # broken or vulnerable version); live installations of it keep running until upgraded.
    lifecycle:
      initial: Published
      states: [Published, Withdrawn]
      terminal: [Withdrawn]
      transitions:
        - name: withdraw
          from: [Published]
          to: Withdrawn

  # § 13 lines 558-560 Installation: a product version enabled in an account with parameter
  # values. It creates a formation through `deployments`, named by `formation_id`.
  - name: weft.catalog.Installation
    naming:
      summary: A product version enabled in an account with parameter values, run as a formation of the account.
    identity:
      name: installation_id
      type: weft.shared.InstallationId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: product_id
        type: weft.shared.ProductId
      - name: version_id
        type: weft.shared.ProductVersionId
      - name: parameter_values
        type: List<weft.catalog.ParameterValue>
      # The customer's formation the installation runs as. Minted at install; `deployments`
      # creates it from the version's deployment source.
      # OPEN: how the formation is created and named (a deploy the control plane issues on the
      # account's behalf, or a translator); decided in the integration pass.
      - name: formation_id
        type: weft.shared.FormationId
      - name: failure_reason
        type: Optional<String>
      # § 4 "Sleep and wake" (lines 274-301): applied to the components of the installation's
      # formation.
      - name: sleep_policy
        type: Optional<weft.shared.SleepPolicy>
    relations:
      - name: product
        kind: references
        target: weft.catalog.Product
        cardinality: one
        via: product_id
      - name: version
        kind: references
        target: weft.catalog.ProductVersion
        cardinality: one
        via: version_id
      - name: account
        kind: references
        target: weft.accounts.Account
        cardinality: one
        via: scope_id
      - name: formation
        kind: references
        target: weft.architecture.Formation
        cardinality: one
        via: formation_id
    # OPEN: the sketch names install, upgrade and uninstall only. Smallest answer: installing,
    # installed, upgrading, failed (a deploy that did not succeed), uninstalling, uninstalled.
    lifecycle:
      initial: Installing
      states: [Installing, Installed, Upgrading, Failed, Uninstalling, Uninstalled]
      terminal: [Uninstalled]
      transitions:
        - name: finish
          from: [Installing, Upgrading]
          to: Installed
        - name: fail
          from: [Installing, Upgrading]
          to: Failed
        - name: upgrade
          from: [Installed, Failed]
          to: Upgrading
        - name: uninstall
          from: [Installed, Failed]
          to: Uninstalling
        - name: remove
          from: [Uninstalling]
          to: Uninstalled

errors:
  - name: weft.catalog.EngineNotFound
    summary: The named engine does not exist.
  - name: weft.catalog.EngineUnavailable
    summary: The named engine is retired and serves nothing new.
  - name: weft.catalog.EngineWrongKind
    summary: The named engine does not serve this offering's kind.
  - name: weft.catalog.EngineInUse
    summary: A published offering or a live service instance still runs on this engine.
  - name: weft.catalog.InvalidReplicas
    summary: A plan needs at least one replica.
  - name: weft.catalog.DurableCache
    summary: A cache offering makes no durability promise, so it has no durable plan.
  - name: weft.catalog.PlanNotFound
    summary: The named plan does not exist.
  - name: weft.catalog.PlanUnavailable
    summary: The named plan is retired and takes no new service instances.
  - name: weft.catalog.PlanNotOfOffering
    summary: The named plan belongs to another offering.
  - name: weft.catalog.PublisherNotFound
    summary: The named publisher does not exist.
  - name: weft.catalog.PublisherUnavailable
    summary: The named publisher is retired and publishes nothing new.
  - name: weft.catalog.ProductNameTaken
    summary: A product with this name already exists.
  - name: weft.catalog.ProductNotFound
    summary: The named product does not exist.
  - name: weft.catalog.ProductUnavailable
    summary: The named product is withdrawn and takes no new installation or version.
  - name: weft.catalog.ProductVersionTaken
    summary: The product already has a version with this name; a version never changes.
  - name: weft.catalog.ProductVersionNotFound
    summary: The named product version does not exist.
  - name: weft.catalog.ProductVersionUnavailable
    summary: The named product version is withdrawn and takes no new installation.
  - name: weft.catalog.VersionNotOfProduct
    summary: The named version belongs to another product.
  - name: weft.catalog.ProductMismatch
    summary: The stated product is not the installation's product.
  - name: weft.catalog.RequiredOfferingNotFound
    summary: A required offering the version names does not exist.
  - name: weft.catalog.RequiredOfferingUnavailable
    summary: An offering the version requires is not available (retired, or not offered here).
  - name: weft.catalog.MissingParameter
    summary: A parameter the version requires has no value.
  - name: weft.catalog.UnknownParameter
    summary: A value names a parameter the version does not declare.
  - name: weft.catalog.InvalidParameterValue
    summary: A parameter value does not satisfy the parameter's schema.

events:
  - name: weft.catalog.EngineRegistered
    fields:
      - {name: engine_id, type: weft.shared.EngineId}
      - {name: name, type: String}
      - {name: version, type: String}
  - name: weft.catalog.EngineRetired
    fields:
      - {name: engine_id, type: weft.shared.EngineId}
  - name: weft.catalog.PlanAdded
    fields:
      - {name: plan_id, type: weft.shared.OfferingPlanId}
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: name, type: String}
      - {name: durability, type: weft.services.Durability}
  - name: weft.catalog.PlanRetired
    fields:
      - {name: plan_id, type: weft.shared.OfferingPlanId}
  - name: weft.catalog.PublisherRegistered
    fields:
      - {name: publisher_id, type: weft.shared.PublisherId}
      - {name: name, type: String}
  - name: weft.catalog.PublisherRetired
    fields:
      - {name: publisher_id, type: weft.shared.PublisherId}
  - name: weft.catalog.ProductPublished
    fields:
      - {name: product_id, type: weft.shared.ProductId}
      - {name: publisher_id, type: weft.shared.PublisherId}
      - {name: name, type: String}
  - name: weft.catalog.ProductWithdrawn
    fields:
      - {name: product_id, type: weft.shared.ProductId}
  - name: weft.catalog.ProductVersionPublished
    fields:
      - {name: version_id, type: weft.shared.ProductVersionId}
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version, type: String}
      - {name: source_id, type: weft.shared.DeploymentSourceId}
  - name: weft.catalog.ProductVersionWithdrawn
    fields:
      - {name: version_id, type: weft.shared.ProductVersionId}
  # Parameter values are not carried in events: they stay on the installation record.
  - name: weft.catalog.InstallationStarted
    fields:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version_id, type: weft.shared.ProductVersionId}
      - {name: formation_id, type: weft.shared.FormationId}
  - name: weft.catalog.InstallationUpgrading
    fields:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: version_id, type: weft.shared.ProductVersionId}
  - name: weft.catalog.InstallationInstalled
    fields:
      - {name: installation_id, type: weft.shared.InstallationId}
  - name: weft.catalog.InstallationFailed
    fields:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: reason, type: String}
  - name: weft.catalog.InstallationUninstalling
    fields:
      - {name: installation_id, type: weft.shared.InstallationId}
  - name: weft.catalog.InstallationUninstalled
    fields:
      - {name: installation_id, type: weft.shared.InstallationId}
  - name: weft.catalog.InstallationSleepPolicySet
    fields:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}

commands:
  # § 13 lines 529-532: an engine is registered with its version before an offering runs on it.
  - name: weft.catalog.RegisterEngine
    naming:
      display: Register an engine
    input:
      - {name: name, type: String}
      - {name: version, type: String}
      - {name: kinds, type: List<weft.services.OfferingKind>}
    outcomes:
      - name: registered
        creates: weft.catalog.Engine
        instance: engine_id
        sets:
          name: input.name
          version: input.version
          kinds: input.kinds
        emits: [weft.catalog.EngineRegistered]
        payload:
          weft.catalog.EngineRegistered:
            engine_id: {generated: true}
            name: input.name
            version: input.version

  # § 13 lines 529-532. Refused while anything still runs on the engine.
  - name: weft.catalog.RetireEngine
    naming:
      display: Retire an engine
    input:
      - {name: engine_id, type: weft.shared.EngineId}
    outcomes:
      - name: no-such-engine
        unknown_instance: true
        error: weft.services.NotFound
      - name: offering-on-engine
        when_related:
          entity: weft.services.Offering
          where: {all: ["engine_id == input.engine_id", "state == Published"]}
          exists: true
        error: weft.catalog.EngineInUse
      - name: instance-on-engine
        when_related:
          entity: weft.services.ServiceInstance
          where: {all: ["engine_id == input.engine_id", "state != Gone"]}
          exists: true
        error: weft.catalog.EngineInUse
      - name: retired
        moves: weft.catalog.Engine.retire
        instance: engine_id
        emits: [weft.catalog.EngineRetired]
        payload:
          weft.catalog.EngineRetired:
            engine_id: input.engine_id
      - name: wrong-state
        wrong_state: true
        error: weft.services.StateConflict

  # § 13 lines 527-528: a size tier of an offering.
  - name: weft.catalog.AddOfferingPlan
    naming:
      display: Add a plan to an offering
    input:
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: name, type: String}
      - {name: limits, type: List<weft.shared.ResourceAmount>}
      - {name: durability, type: weft.services.Durability}
      - {name: replicas, type: Integer}
    outcomes:
      - name: invalid-replicas
        when: replicas < 1
        error: weft.catalog.InvalidReplicas
      - name: no-such-offering
        when_related: {via: input.offering_id, exists: false}
        error: weft.services.OfferingNotFound
      - name: offering-retired
        when_related: {via: input.offering_id, predicate: state == Retired}
        error: weft.services.OfferingUnavailable
      # § 13 line 518: "cache: key-value with expiry, no durability promise".
      - name: durable-cache
        when_related:
          via: input.offering_id
          predicate: {all: [kind == cache, input.durability == Durable]}
        error: weft.catalog.DurableCache
      - name: added
        creates: weft.catalog.OfferingPlan
        instance: plan_id
        sets:
          offering_id: input.offering_id
          name: input.name
          limits: input.limits
          durability: input.durability
          replicas: input.replicas
        emits: [weft.catalog.PlanAdded]
        payload:
          weft.catalog.PlanAdded:
            plan_id: {generated: true}
            offering_id: input.offering_id
            name: input.name
            durability: input.durability

  # § 13 lines 527-528. A retired plan takes no new service instances; live ones keep it.
  - name: weft.catalog.RetireOfferingPlan
    naming:
      display: Retire a plan
    input:
      - {name: plan_id, type: weft.shared.OfferingPlanId}
    outcomes:
      - name: no-such-plan
        unknown_instance: true
        error: weft.services.NotFound
      - name: retired
        moves: weft.catalog.OfferingPlan.retire
        instance: plan_id
        emits: [weft.catalog.PlanRetired]
        payload:
          weft.catalog.PlanRetired:
            plan_id: input.plan_id
      - name: wrong-state
        wrong_state: true
        error: weft.services.StateConflict

  # § 13 Products lines 561-562, Publisher: the cluster operator first; third parties later.
  - name: weft.catalog.RegisterPublisher
    naming:
      display: Register a publisher
    input:
      - {name: name, type: String}
    outcomes:
      - name: registered
        creates: weft.catalog.Publisher
        instance: publisher_id
        sets:
          name: input.name
        emits: [weft.catalog.PublisherRegistered]
        payload:
          weft.catalog.PublisherRegistered:
            publisher_id: {generated: true}
            name: input.name

  # § 13 Products lines 561-562, Publisher.
  - name: weft.catalog.RetirePublisher
    naming:
      display: Retire a publisher
    input:
      - {name: publisher_id, type: weft.shared.PublisherId}
    outcomes:
      - name: no-such-publisher
        unknown_instance: true
        error: weft.services.NotFound
      - name: retired
        moves: weft.catalog.Publisher.retire
        instance: publisher_id
        emits: [weft.catalog.PublisherRetired]
        payload:
          weft.catalog.PublisherRetired:
            publisher_id: input.publisher_id
      - name: wrong-state
        wrong_state: true
        error: weft.services.StateConflict

  # § 13 Products lines 549-555, Product: a packaged application in the catalog.
  - name: weft.catalog.PublishProduct
    naming:
      display: Publish a product
    input:
      - {name: publisher_id, type: weft.shared.PublisherId}
      - {name: name, type: String}
      - {name: summary, type: String}
    outcomes:
      - name: no-such-publisher
        when_related: {via: input.publisher_id, exists: false}
        error: weft.catalog.PublisherNotFound
      - name: publisher-retired
        when_related: {via: input.publisher_id, predicate: state == Retired}
        error: weft.catalog.PublisherUnavailable
      - name: name-taken
        when_related:
          entity: weft.catalog.Product
          where: name == input.name
          exists: true
        error: weft.catalog.ProductNameTaken
      - name: published
        creates: weft.catalog.Product
        instance: product_id
        sets:
          publisher_id: input.publisher_id
          name: input.name
          summary: input.summary
        emits: [weft.catalog.ProductPublished]
        payload:
          weft.catalog.ProductPublished:
            product_id: {generated: true}
            publisher_id: input.publisher_id
            name: input.name

  # § 13 Products lines 549-555, Product. A withdrawn product takes no new installation; live ones
  # keep running.
  - name: weft.catalog.WithdrawProduct
    naming:
      display: Withdraw a product
    input:
      - {name: product_id, type: weft.shared.ProductId}
    outcomes:
      - name: no-such-product
        unknown_instance: true
        error: weft.services.NotFound
      - name: withdrawn
        moves: weft.catalog.Product.withdraw
        instance: product_id
        emits: [weft.catalog.ProductWithdrawn]
        payload:
          weft.catalog.ProductWithdrawn:
            product_id: input.product_id
      - name: wrong-state
        wrong_state: true
        error: weft.services.StateConflict

  # § 13 Products lines 556-557, ProductVersion: immutable; names its deployment source, its
  # parameters with a schema, and the offerings and resource classes it needs.
  # OPEN: whether the deployment source must exist and translate before a version is published
  # (a check in `deployments`); the smallest answer leaves it to the install's deploy, which
  # stops on a refused object (§ 5 Translation, lines 347-361).
  - name: weft.catalog.PublishProductVersion
    naming:
      display: Publish a product version
    input:
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version, type: String}
      - {name: source_id, type: weft.shared.DeploymentSourceId}
      - {name: parameters, type: List<weft.catalog.ProductParameter>}
      - {name: required_offerings, type: List<weft.shared.OfferingId>}
      - {name: required_resource_classes, type: List<weft.shared.ResourceClassName>}
    outcomes:
      - name: no-such-product
        when_related: {via: input.product_id, exists: false}
        error: weft.catalog.ProductNotFound
      - name: product-withdrawn
        when_related: {via: input.product_id, predicate: state == Withdrawn}
        error: weft.catalog.ProductUnavailable
      - name: version-taken
        when_related:
          entity: weft.catalog.ProductVersion
          where: {all: ["product_id == input.product_id", "version == input.version"]}
          exists: true
        error: weft.catalog.ProductVersionTaken
      # UNMAPPED: `when_related: {via: input.required_offerings, exists: false}` says this in the
      # model, but ESS 0.99.2 refuses a list-of-references guard beside another related-row guard
      # on one command (`conflicting_declaration`), and the product guards above are kept. Decided
      # outside the specification, refused by name. Open question for ESS.
      # Kept external (rechecked 2026-11-26 on ess 0.99.2: the list guard beside the product
      # guards is still `conflicting_declaration`, "a command guarding on a list of references
      # reads no other related row in this cut").
      - name: no-such-offering
        external: an offering the version requires does not exist
        error: weft.catalog.RequiredOfferingNotFound
      - name: published
        creates: weft.catalog.ProductVersion
        instance: version_id
        sets:
          product_id: input.product_id
          version: input.version
          source_id: input.source_id
          parameters: input.parameters
          required_offerings: input.required_offerings
          required_resource_classes: input.required_resource_classes
        emits: [weft.catalog.ProductVersionPublished]
        payload:
          weft.catalog.ProductVersionPublished:
            version_id: {generated: true}
            product_id: input.product_id
            version: input.version
            source_id: input.source_id

  # § 13 Products lines 556-557, ProductVersion. Withdrawing changes no field (the version stays
  # immutable).
  - name: weft.catalog.WithdrawProductVersion
    naming:
      display: Withdraw a product version
    input:
      - {name: version_id, type: weft.shared.ProductVersionId}
    outcomes:
      - name: no-such-version
        unknown_instance: true
        error: weft.services.NotFound
      - name: withdrawn
        moves: weft.catalog.ProductVersion.withdraw
        instance: version_id
        emits: [weft.catalog.ProductVersionWithdrawn]
        payload:
          weft.catalog.ProductVersionWithdrawn:
            version_id: input.version_id
      - name: wrong-state
        wrong_state: true
        error: weft.services.StateConflict

  # § 13 Products lines 558-560, Installation: enable a product version in an account with
  # parameter values. It creates a formation through `deployments`, whose id is minted here.
  - name: weft.catalog.InstallProduct
    naming:
      display: Install a product
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
      # The version's product, stated by the caller so the product (withdrawn) and the version
      # (of another product) are each checked against it.
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version_id, type: weft.shared.ProductVersionId}
      - {name: parameter_values, type: List<weft.catalog.ParameterValue>}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
    outcomes:
      # hardening pass 1 D3: the product is installed only in the account the caller acts in;
      # another account answers as a missing record.
      - name: not-callers-account
        when: scope_id != caller.scope_id
        error: weft.services.NotFound
      - name: no-such-product
        when_related: {via: input.product_id, exists: false}
        error: weft.catalog.ProductNotFound
      - name: no-such-version
        when_related: {via: input.version_id, exists: false}
        error: weft.catalog.ProductVersionNotFound
      - name: product-withdrawn
        when_related: {via: input.product_id, predicate: state == Withdrawn}
        error: weft.catalog.ProductUnavailable
      - name: version-withdrawn
        when_related: {via: input.version_id, predicate: state == Withdrawn}
        error: weft.catalog.ProductVersionUnavailable
      - name: version-of-other-product
        when_related: {via: input.version_id, predicate: product_id != input.product_id}
        error: weft.catalog.VersionNotOfProduct
      - name: missing-parameter
        when_related:
          via: input.version_id
          predicate:
            exists:
              in: parameters
              as: p
              that:
                all:
                  - p.required == true
                  - not: {exists: {in: input.parameter_values, as: v, that: v.name == p.name}}
        error: weft.catalog.MissingParameter
      - name: unknown-parameter
        when_related:
          via: input.version_id
          predicate:
            exists:
              in: input.parameter_values
              as: v
              that:
                not: {exists: {in: parameters, as: p, that: p.name == v.name}}
        error: weft.catalog.UnknownParameter
      # A JSON Schema evaluation of each value; no guard form evaluates a schema.
      - name: invalid-parameter-value
        external: a parameter value does not satisfy its parameter's schema
        error: weft.catalog.InvalidParameterValue
      # UNMAPPED: the offerings the version requires are a list stored on the version row; a
      # guard reading each of them is a second hop (version, then each offering), which no guard
      # form here reads. Decided outside the specification, refused by name.
      - name: required-offering-unavailable
        external: an offering the version requires is retired or not offered on this cluster
        error: weft.catalog.RequiredOfferingUnavailable
      # § 1 lines 137-138 and § 12 line 477: the version's resource classes and the formation's
      # claims fit the quota. Kept external: a walk up the account tree, as at
      # ProvisionServiceInstance.
      - name: quota-exceeded
        external: the installation's formation does not fit the remaining quota of the account or a parent
        error: weft.services.QuotaExceeded
      - name: installing
        creates: weft.catalog.Installation
        instance: installation_id
        sets:
          scope_id: input.scope_id
          product_id: input.product_id
          version_id: input.version_id
          parameter_values: input.parameter_values
          formation_id: {generated: true}
          sleep_policy: input.sleep_policy
        emits: [weft.catalog.InstallationStarted]
        payload:
          weft.catalog.InstallationStarted:
            installation_id: {generated: true}
            scope_id: input.scope_id
            product_id: input.product_id
            version_id: input.version_id
            formation_id: {generated: true}

  # § 13 Products lines 558-560, Installation: "upgrade moves it to a newer version". New
  # parameter values are given whole, checked against the new version as at install.
  # UNMAPPED: "newer" needs the installed version's order beside the new version's; a guard here
  # reads the new version's row only, and a version carries no order (`version` is free text).
  # Not declared. Open question for the owner: is a version ordered (semver, a sequence), and is
  # a move to an older version (a rollback) allowed?
  - name: weft.catalog.UpgradeInstallation
    naming:
      display: Upgrade an installation
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version_id, type: weft.shared.ProductVersionId}
      - {name: parameter_values, type: List<weft.catalog.ParameterValue>}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.services.NotFound
      # hardening pass 1 D3: only an installation of the account the caller acts in is upgraded;
      # another account's answers as a missing one, before its product is told.
      - name: not-callers-account
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.services.NotFound
      - name: product-mismatch
        when_subject: {predicate: product_id != input.product_id}
        error: weft.catalog.ProductMismatch
      - name: no-such-version
        when_related: {via: input.version_id, exists: false}
        error: weft.catalog.ProductVersionNotFound
      - name: version-withdrawn
        when_related: {via: input.version_id, predicate: state == Withdrawn}
        error: weft.catalog.ProductVersionUnavailable
      - name: version-of-other-product
        when_related: {via: input.version_id, predicate: product_id != input.product_id}
        error: weft.catalog.VersionNotOfProduct
      - name: missing-parameter
        when_related:
          via: input.version_id
          predicate:
            exists:
              in: parameters
              as: p
              that:
                all:
                  - p.required == true
                  - not: {exists: {in: input.parameter_values, as: v, that: v.name == p.name}}
        error: weft.catalog.MissingParameter
      - name: unknown-parameter
        when_related:
          via: input.version_id
          predicate:
            exists:
              in: input.parameter_values
              as: v
              that:
                not: {exists: {in: parameters, as: p, that: p.name == v.name}}
        error: weft.catalog.UnknownParameter
      # Kept external, as at InstallProduct: no guard form evaluates a JSON Schema.
      - name: invalid-parameter-value
        external: a parameter value does not satisfy its parameter's schema
        error: weft.catalog.InvalidParameterValue
      # Kept external, as at InstallProduct: a second hop (version, then each listed offering).
      - name: required-offering-unavailable
        external: an offering the new version requires is retired or not offered on this cluster
        error: weft.catalog.RequiredOfferingUnavailable
      # Kept external: a walk up the account tree, as at ProvisionServiceInstance.
      - name: quota-exceeded
        external: the upgraded formation does not fit the remaining quota of the account or a parent
        error: weft.services.QuotaExceeded
      - name: upgrading
        moves: weft.catalog.Installation.upgrade
        instance: installation_id
        sets:
          version_id: input.version_id
          parameter_values: input.parameter_values
          failure_reason: {cleared: true}
        emits: [weft.catalog.InstallationUpgrading]
        payload:
          weft.catalog.InstallationUpgrading:
            installation_id: input.installation_id
            version_id: input.version_id
      - name: wrong-state
        wrong_state: true
        error: weft.services.StateConflict

  # § 4 "Sleep and wake" (lines 274-301): set or clear when an installation's formation sleeps.
  - name: weft.catalog.SetInstallationSleepPolicy
    naming:
      display: Set an installation's sleep policy
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.services.NotFound
      # hardening pass 1 D3: only an installation of the account the caller acts in; another
      # account's answers as a missing one, before its state is told.
      - name: not-callers-account
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.services.NotFound
      - name: uninstalled
        when_subject: {predicate: {state: [Uninstalling, Uninstalled]}}
        error: weft.services.StateConflict
      - name: set
        updates: weft.catalog.Installation
        instance: installation_id
        sets:
          sleep_policy: input.sleep_policy
        emits: [weft.catalog.InstallationSleepPolicySet]
        payload:
          weft.catalog.InstallationSleepPolicySet:
            installation_id: input.installation_id
            sleep_policy: input.sleep_policy

  # § 13 Products lines 558-560, Installation: the control plane reports the formation deployed.
  - name: weft.catalog.ReportInstallationInstalled
    naming:
      display: Report an installation installed
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.services.NotFound
      - name: installed
        moves: weft.catalog.Installation.finish
        instance: installation_id
        emits: [weft.catalog.InstallationInstalled]
        payload:
          weft.catalog.InstallationInstalled:
            installation_id: input.installation_id
      - name: wrong-state
        wrong_state: true
        error: weft.services.StateConflict

  # § 13 Products lines 558-560, Installation: the deploy of the formation did not succeed.
  - name: weft.catalog.ReportInstallationFailed
    naming:
      display: Report an installation failed
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: reason, type: String}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.services.NotFound
      - name: failed
        moves: weft.catalog.Installation.fail
        instance: installation_id
        sets:
          failure_reason: input.reason
        emits: [weft.catalog.InstallationFailed]
        payload:
          weft.catalog.InstallationFailed:
            installation_id: input.installation_id
            reason: input.reason
      - name: wrong-state
        wrong_state: true
        error: weft.services.StateConflict

  # § 13 Products lines 558-560, Installation: "uninstall removes the formation".
  # OPEN: whether uninstall keeps the formation's volumes and data (as a backup) or erases them;
  # the sketch says the formation is removed. The smallest answer erases nothing here and leaves
  # the formation's removal to `deployments`.
  - name: weft.catalog.UninstallProduct
    naming:
      display: Uninstall a product
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.services.NotFound
      # hardening pass 1 D3: only an installation of the account the caller acts in is
      # uninstalled; another account's answers as a missing one, before its state is told.
      - name: not-callers-account
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.services.NotFound
      - name: uninstalling
        moves: weft.catalog.Installation.uninstall
        instance: installation_id
        emits: [weft.catalog.InstallationUninstalling]
        payload:
          weft.catalog.InstallationUninstalling:
            installation_id: input.installation_id
      - name: wrong-state
        wrong_state: true
        error: weft.services.StateConflict

  # § 13 Products lines 558-560, Installation: the control plane reports the formation removed.
  - name: weft.catalog.ReportInstallationUninstalled
    naming:
      display: Report an installation uninstalled
    input:
      - {name: installation_id, type: weft.shared.InstallationId}
    outcomes:
      - name: no-such-installation
        unknown_instance: true
        error: weft.services.NotFound
      - name: uninstalled
        moves: weft.catalog.Installation.remove
        instance: installation_id
        emits: [weft.catalog.InstallationUninstalled]
        payload:
          weft.catalog.InstallationUninstalled:
            installation_id: input.installation_id
      - name: wrong-state
        wrong_state: true
        error: weft.services.StateConflict

# Views. A tenant's view of an offering or a service instance shows the offering's API by kind
# and never the engine (§ 13 lines 529-532: "the user sees the offering's API, never the engine's"):
# no tenant view below has an `engine_id` or a `system_formation_id`. The views marked
# "operator" are the ClusterOperator's.
views:
  # § 13 lines 527-528 OfferingPlan: the size tiers of one offering. Prices are metering's.
  - name: weft.catalog.OfferingPlans
    source: weft.catalog.OfferingPlan
    consistency: read_your_writes
    params:
      - {name: offering_id, type: weft.shared.OfferingId}
    filter: offering_id == param.offering_id
    fields:
      - {name: plan_id, type: weft.shared.OfferingPlanId}
      - {name: offering_id, type: weft.shared.OfferingId}
      - {name: name, type: String}
      - {name: limits, type: List<weft.shared.ResourceAmount>}
      - {name: durability, type: weft.services.Durability}
      - {name: replicas, type: Integer}
      - {name: state, type: weft.catalog.OfferingPlan.State}

  # § 13 lines 529-532 Engine (operator).
  - name: weft.catalog.EngineList
    source: weft.catalog.Engine
    consistency: read_your_writes
    fields:
      - {name: engine_id, type: weft.shared.EngineId}
      - {name: name, type: String}
      - {name: version, type: String}
      - {name: kinds, type: List<weft.services.OfferingKind>}
      - {name: state, type: weft.catalog.Engine.State}

  # § 13 Products lines 561-562, Publisher.
  - name: weft.catalog.PublisherList
    source: weft.catalog.Publisher
    consistency: read_your_writes
    fields:
      - {name: publisher_id, type: weft.shared.PublisherId}
      - {name: name, type: String}
      - {name: state, type: weft.catalog.Publisher.State}

  # § 13 Products lines 549-555, Product: what a tenant can install.
  - name: weft.catalog.ProductCatalog
    source: weft.catalog.Product
    consistency: read_your_writes
    filter: state == Published
    fields:
      - {name: product_id, type: weft.shared.ProductId}
      - {name: publisher_id, type: weft.shared.PublisherId}
      - {name: name, type: String}
      - {name: summary, type: String}

  # § 13 Products lines 556-557, ProductVersion: the versions of one product, with what each needs.
  - name: weft.catalog.ProductVersions
    source: weft.catalog.ProductVersion
    consistency: read_your_writes
    params:
      - {name: product_id, type: weft.shared.ProductId}
    filter: product_id == param.product_id
    fields:
      - {name: version_id, type: weft.shared.ProductVersionId}
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version, type: String}
      - {name: source_id, type: weft.shared.DeploymentSourceId}
      - {name: parameters, type: List<weft.catalog.ProductParameter>}
      - {name: required_offerings, type: List<weft.shared.OfferingId>}
      - {name: required_resource_classes, type: List<weft.shared.ResourceClassName>}
      - {name: state, type: weft.catalog.ProductVersion.State}

  # § 13 Products lines 558-560, Installation: the installations of one account.
  - name: weft.catalog.InstallationList
    source: weft.catalog.Installation
    consistency: read_your_writes
    params:
      - {name: scope_id, type: weft.shared.ScopeId}
    filter: scope_id == param.scope_id
    fields:
      - {name: installation_id, type: weft.shared.InstallationId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: product_id, type: weft.shared.ProductId}
      - {name: version_id, type: weft.shared.ProductVersionId}
      - {name: parameter_values, type: List<weft.catalog.ParameterValue>}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: failure_reason, type: Optional<String>}
      - {name: state, type: weft.catalog.Installation.State}
