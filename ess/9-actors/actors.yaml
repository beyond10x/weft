domain: weft.actors

summary: >-
  Every actor of weft and the commands it may run. docs/domain-sketch.md § Structure, Actors.

naming:
  wire: actors
  display: Actors

# Source: docs/domain-sketch.md § Structure "Actors" (lines 103-127) for the actor list, and
# docs/actors-draft.md (2026-11-26) for each actor's commands, per domain.
#
# Not expressible in `may:`, so written as comments only: role and scope limits ("own node only",
# "own login", "Logs kind only", "admin role", the one role an Automation token holds). The
# implementation's authorization check enforces them.
#
# OPEN: read access to views. `may:` takes a view as well as a command (ESS-ACTOR-001: "may invoke
# or read ... a command or a view"), but this pass grants commands only: the draft's "Views:"
# lines cover 4 of 16 domains (accounts, secrets, catalog, metering). Grant views here, for every
# domain, in a later pass?
#
# OPEN: whether the system actors (NodeAgent, Scheduler, Translator, Instance, ManagementApi,
# ReleaseController, ControlPlane) are `system: true` (ess/27): conformance then awaits their
# commands instead of driving them. Not set: the draft does not decide it, and NodeAgent and
# Instance are separate processes with credentials of their own.
#
# Caller attributes (hardening pass 1, D2 and D3; integrator, 2026-11-26). The tenant actors and
# the control-plane actors that act for an account (ControlPlane, ReleaseController, Translator) declare `principal_id`, `tenant_id` and
# `scope_id`. `scope_id` is the account the request acts in: weft-api sets it after it checks
# that the principal holds a role on that account or on an ancestor (sketch line 140, "on an
# account and below"); weft-control sets it to the account of the row it acts on. A guard compares
# it with `==`/`!=` only (ESS caller values, `caller-values.md`). Commands that read none of them
# are unchanged.
# D-d A: `scope_id` is the cloudspec scope of that account; TenantOwner and AccountAdmin, which run
# the account commands of weft.accounts, also declare `account_id`, the account itself, which
# weft-api sets with `scope_id` from the same check.
# OPEN: the owner may prefer the caller to carry the account tree; ESS compares a caller value only by
# equality, so "the account the request acts in" is the form that can be checked.

