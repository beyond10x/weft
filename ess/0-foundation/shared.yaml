  - name: weft.shared.IsolationLevel
    kind: enum
    ordered: true
    variants: [ProcessSandbox, Container, UserKernel, MicroVm]

  - name: weft.shared.AccessMode
    kind: enum
    variants: [SingleUser, Federated]

  - name: weft.shared.Role
    kind: enum
    variants: [viewer, deployer, admin, billing, owner]

  - name: weft.shared.Sharing
    kind: enum
    variants: [Exclusive, SharedReadOnly, SharedReadWrite]

  - name: weft.shared.SleepKind
    kind: enum
    variants: [Stop, Suspend]

  - name: weft.shared.SleepPolicy
    kind: struct
    fields:
      - name: idle_after
        type: Duration
      - name: kind
        type: weft.shared.SleepKind

  - name: weft.shared.ResourceAmount
    kind: struct
    fields:
      - name: resource_class
        type: weft.shared.ResourceClassName
      - name: amount
        type: Integer
    invariants:
      - amount >= 0

  - name: weft.shared.IsolationFacts
    kind: struct
    fields:
      - name: kvm_present
        type: Boolean
      - name: cgroups_delegated
        type: Boolean
      - name: egress_denied
        type: Boolean
      - name: gpu_passthrough
        type: Boolean
      - name: levels
        type: List<weft.shared.IsolationLevel>
