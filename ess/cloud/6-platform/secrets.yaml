# Moved from weft@6798e7d:ess/5-runtime/secrets.yaml.
# Comments are weft's at that commit: "sketch", "section" and "design" cite weft's documents, and
# where a comment says account or tenant, the block reads scope (docs/boundary.md, D1 A).
# Secrets: custody, versions, grants, delivery. Source: docs/domain-sketch.md "7. Secrets"
# (lines 370-383), with "Channels" (line 92-93), "Actors" (lines 95-116), "8. Workload identity"
# (line 396) and "11. Node control" (line 430, `DeliverSecret`).
#
# By construction: the type `weft.secrets.SecretValue` appears in exactly one place, the input of
# `weft.secrets.AddSecretVersion`. No entity field, event field, error field, view field or command
# response carries it. Stored state holds `weft.secrets.SecretValueRef`, a reference into the
# backend (sketch line 378: "Cluster state holds references only").
domain: weft.secrets

summary: >-
  Secret custody: named secrets in a scope, formation or environment scope, their immutable
  versions, the grants that let a workload identity receive one, and the backends that hold the
  values. The record of each delivery to an instance is weft's (D7 A).

naming:
  wire: weft
  display: Secrets

types:
  # Sketch line 452: `weft secret set shop/dev STRIPE_KEY`.
  # OPEN: which characters a secret name admits (environment-variable rules, length bound).
  # weft@6798e7d:ess/5-runtime/secrets.yaml:23
  - name: weft.secrets.SecretName
    kind: newtype
    of: String

  # Sketch line 379: "a value is written once through the API and never returned by it". The only
  # use of this type is the input of AddSecretVersion.
  # OPEN: the largest value a secret may hold, and whether binary values are admitted.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:30
  - name: weft.secrets.SecretValue
    kind: newtype
    of: String

  # Sketch line 378: "Cluster state holds references only". The backend's handle of one stored
  # value, never the value.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:36
  - name: weft.secrets.SecretValueRef
    kind: newtype
    of: String

  # Sketch line 372: "in an account, formation or environment scope".
  # weft@6798e7d:ess/5-runtime/secrets.yaml:41
  - name: weft.secrets.SecretScope
    kind: enum
    variants: [Scope, Formation, Environment]

  # Sketch lines 377-378.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:46
  - name: weft.secrets.SecretBackendKind
    kind: enum
    variants: [ClusterStore, ExternalVault]

  # Sketch line 376: "as a file or an environment variable".
  # weft@6798e7d:ess/5-runtime/secrets.yaml:51
  - name: weft.secrets.DeliveryMode
    kind: enum
    variants: [File, EnvVar]

  # The file path or the environment variable name a grant delivers to.
  # OPEN: which paths are admitted (a fixed secrets directory only?) and which variable names.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:57
  - name: weft.secrets.DeliveryTarget
    kind: newtype
    of: String

  # Sketch lines 373-374: "pins versions or follows `latest`".
  # weft@6798e7d:ess/5-runtime/secrets.yaml:62
  - name: weft.secrets.VersionPin
    kind: enum
    variants: [Latest, Pinned]

entities:
  # Sketch line 377-378: SecretBackend.
  # OPEN: whether backends are per cluster (registered by the ClusterOperator) or an account may
  # bring its own vault. Taken: per cluster, no CloudId field until the cluster domain says how a
  # cluster is addressed.
  # OPEN: how weft authenticates to an external vault. Taken: no credential is stored here; the
  # `address` is a locator only.
  # OPEN: retiring or replacing a backend, and moving values between backends. Not declared.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:74
  - name: weft.secrets.SecretBackend
    naming:
      summary: Where secret values live, the cluster's own encrypted store or an external vault.
    identity:
      name: backend_id
      type: weft.shared.SecretBackendId
    fields:
      - name: name
        type: String
      - name: kind
        type: weft.secrets.SecretBackendKind
      - name: address
        type: Optional<String>
        summary: The external vault's locator; absent for the cluster store. Holds no credential.
    lifecycle:
      initial: Active
      states: [Active]
      terminal: [Active]

  # Sketch line 372: Secret. Formation "owns a secret scope" (line 151); Environment "has its own
  # secrets" (line 167).
  # OPEN: deleting a secret and destroying its values in the backend. Not declared; a compromised
  # value is answered by DisableSecretVersion.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:97
  - name: weft.secrets.Secret
    naming:
      summary: A named value in a scope, formation or environment scope.
    identity:
      name: secret_id
      type: weft.shared.SecretId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: scope
        type: weft.secrets.SecretScope
      - name: formation_id
        type: Optional<weft.shared.FormationId>
        summary: Present for the Formation and Environment scopes, absent for Scope.
      - name: environment_id
        type: Optional<weft.shared.EnvironmentId>
        summary: Present for the Environment scope only.
      - name: name
        type: weft.secrets.SecretName
      - name: backend_id
        type: weft.shared.SecretBackendId
    # The newest version (by `created_at`) is the secret's `latest`; it is read from the versions,
    # not stored here, because the command creating a version cannot also update its secret.
    relations:
      - name: scope_id
        kind: references
        target: weft.scope.Scope
        cardinality: one
        via: scope_id
      - name: formation_id
        kind: references
        target: weft.architecture.Formation
        cardinality: one
        via: formation_id
      - name: environment_id
        kind: references
        target: weft.architecture.Environment
        cardinality: one
        via: environment_id
      - name: backend
        kind: references
        target: weft.secrets.SecretBackend
        cardinality: one
        via: backend_id
      - name: versions
        kind: owns
        target: weft.secrets.SecretVersion
        cardinality: many
        via: secret_id
      - name: grants
        kind: owns
        target: weft.secrets.SecretGrant
        cardinality: many
        via: secret_id
    lifecycle:
      initial: Active
      states: [Active]
      terminal: [Active]

  # Sketch line 373: "SecretVersion: immutable; a rotation adds a version." No command writes a
  # field of a version after it is created; disabling moves its state only.
  # OPEN: whether a disabled version can be enabled again. Taken: no, Disabled is terminal.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:159
  - name: weft.secrets.SecretVersion
    naming:
      summary: One immutable value of a secret, held in the backend and referenced here.
    identity:
      name: version_id
      type: weft.shared.SecretVersionId
    fields:
      - name: secret_id
        type: weft.shared.SecretId
      - name: value_ref
        type: weft.secrets.SecretValueRef
        summary: The backend's handle of the value. No view publishes it.
      - name: created_at
        type: Timestamp
    lifecycle:
      initial: Enabled
      states: [Enabled, Disabled]
      terminal: [Disabled]
      transitions:
        - name: disable
          from: [Enabled]
          to: Disabled

  # Sketch line 375-376: SecretGrant; line 396: "a SecretGrant names identities, not instances".
  # OPEN: whether grants are written by a Deployer directly or derived from a formation revision
  # when a release applies (sketch line 321: "an agent that names no secret gets no secret
  # grant"). Taken: a command; the deployments domain may call it on apply.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:186
  - name: weft.secrets.SecretGrant
    naming:
      summary: Lets one workload identity receive one secret, as a file or an environment variable.
    identity:
      name: grant_id
      type: weft.shared.SecretGrantId
    fields:
      - name: secret_id
        type: weft.shared.SecretId
      - name: identity
        type: weft.shared.WorkloadIdentity
        summary: A component-level workload identity; the instance segment is not part of it.
      - name: mode
        type: weft.secrets.DeliveryMode
      - name: target
        type: weft.secrets.DeliveryTarget
      - name: pin
        type: weft.secrets.VersionPin
      - name: pinned_version_id
        type: Optional<weft.shared.SecretVersionId>
        summary: Present exactly when `pin` is Pinned.
    relations:
      - name: pinned_version
        kind: references
        target: weft.secrets.SecretVersion
        cardinality: one
        via: pinned_version_id
    # Revoke is not named by the sketch; it is the narrowing counterpart of a grant.
    lifecycle:
      initial: Active
      states: [Active, Revoked]
      terminal: [Revoked]
      transitions:
        - name: revoke
          from: [Active]
          to: Revoked

errors:
  # weft@6798e7d:ess/5-runtime/secrets.yaml:280
  - name: weft.secrets.NoSuchBackend
    summary: The named secret backend does not exist, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:282
  - name: weft.secrets.NoSuchSecret
    summary: The named secret does not exist, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:284
  - name: weft.secrets.NoSuchVersion
    summary: The named secret version does not exist, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:286
  - name: weft.secrets.NoSuchGrant
    summary: The named secret grant does not exist, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:288
  - name: weft.secrets.StateConflict
    summary: The addressed record is not in a state this command acts from, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:290
  - name: weft.secrets.BackendNameTaken
    summary: A secret backend with this name exists, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:292
  - name: weft.secrets.BackendAddressMismatch
    summary: >-
      An external vault needs an address and the cluster store takes none, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:295
  - name: weft.secrets.ScopeMismatch
    summary: >-
      The scope and the formation and environment given do not agree, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:298
  - name: weft.secrets.ScopeNotFound
    summary: >-
      The scope, formation or environment named does not exist, or the formation is not of that
      scope, or the environment is not of that formation, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:302
  - name: weft.secrets.SecretNameTaken
    summary: A secret of this name exists in this scope, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:304
  - name: weft.secrets.EmptyValue
    summary: The value is empty, and no version was added.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:306
  - name: weft.secrets.BackendUnavailable
    summary: The backend did not store or return the value, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:310
  - name: weft.secrets.VersionDisabled
    summary: The version is disabled, and nothing was granted or delivered.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:312
  - name: weft.secrets.PinMismatch
    summary: >-
      A pinned grant needs a version and a grant following latest takes none, and nothing changed.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:315
  - name: weft.secrets.IdentityOutsideScope
    summary: >-
      The workload identity does not lie inside the secret's scope, and no grant was written.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:318
  - name: weft.secrets.TargetTaken
    summary: >-
      An active grant already delivers to this file or variable of this identity, and no grant was
      written.

events:
  # weft@6798e7d:ess/5-runtime/secrets.yaml:342
  - name: weft.secrets.SecretBackendRegistered
    fields:
      - {name: backend_id, type: weft.shared.SecretBackendId}
      - {name: name, type: String}
      - {name: kind, type: weft.secrets.SecretBackendKind}

  # weft@6798e7d:ess/5-runtime/secrets.yaml:348
  - name: weft.secrets.SecretCreated
    fields:
      - {name: secret_id, type: weft.shared.SecretId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: scope, type: weft.secrets.SecretScope}
      - {name: name, type: weft.secrets.SecretName}

  # Carries the identifiers only, never the value or its reference (sketch line 383).
  # weft@6798e7d:ess/5-runtime/secrets.yaml:356
  - name: weft.secrets.SecretVersionAdded
    fields:
      - {name: secret_id, type: weft.shared.SecretId}
      - {name: version_id, type: weft.shared.SecretVersionId}

  # weft@6798e7d:ess/5-runtime/secrets.yaml:361
  - name: weft.secrets.SecretVersionDisabled
    fields:
      - {name: version_id, type: weft.shared.SecretVersionId}

  # weft@6798e7d:ess/5-runtime/secrets.yaml:365
  - name: weft.secrets.SecretGranted
    fields:
      - {name: grant_id, type: weft.shared.SecretGrantId}
      - {name: secret_id, type: weft.shared.SecretId}
      - {name: identity, type: weft.shared.WorkloadIdentity}
      - {name: mode, type: weft.secrets.DeliveryMode}
      - {name: pin, type: weft.secrets.VersionPin}

  # weft@6798e7d:ess/5-runtime/secrets.yaml:373
  - name: weft.secrets.SecretGrantRevoked
    fields:
      - {name: grant_id, type: weft.shared.SecretGrantId}

commands:
  # Sketch lines 377-378: SecretBackend.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:388
  - name: weft.secrets.RegisterSecretBackend
    naming:
      display: Register a secret backend
    input:
      - {name: name, type: String}
      - {name: kind, type: weft.secrets.SecretBackendKind}
      - {name: address, type: Optional<String>}
    outcomes:
      - name: vault-without-address
        when: {all: [kind == ExternalVault, {address: {defined: false}}]}
        error: weft.secrets.BackendAddressMismatch
      - name: store-with-address
        when: {all: [kind == ClusterStore, {address: {defined: true}}]}
        error: weft.secrets.BackendAddressMismatch
      - name: name-taken
        when_related:
          entity: weft.secrets.SecretBackend
          where: name == input.name
          exists: true
        error: weft.secrets.BackendNameTaken
      # Kept external: an answer of the vault, a system outside weft.
      - name: unreachable
        external: the external vault does not answer at the address given
        error: weft.secrets.BackendUnavailable
      - name: registered
        creates: weft.secrets.SecretBackend
        instance: backend_id
        sets:
          name: input.name
          kind: input.kind
          address: input.address
        emits: [weft.secrets.SecretBackendRegistered]
        payload:
          weft.secrets.SecretBackendRegistered:
            backend_id: {generated: true}
            name: input.name
            kind: input.kind

  # Sketch line 372: Secret; line 452 `weft secret set shop/dev STRIPE_KEY` declares the secret
  # and writes its first value (AddSecretVersion). Declaring a secret writes no value.
  # OPEN: whether a secret may be created without a backend named, taking an account default.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:429
  - name: weft.secrets.CreateSecret
    naming:
      display: Create a secret
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: scope, type: weft.secrets.SecretScope}
      - {name: formation_id, type: Optional<weft.shared.FormationId>}
      - {name: environment_id, type: Optional<weft.shared.EnvironmentId>}
      - {name: name, type: weft.secrets.SecretName}
      - {name: backend_id, type: weft.shared.SecretBackendId}
    outcomes:
      - name: scope-scope-with-formation
        when: {all: [scope == Scope, {formation_id: {defined: true}}]}
        error: weft.secrets.ScopeMismatch
      - name: scope-scope-with-environment
        when: {all: [scope == Scope, {environment_id: {defined: true}}]}
        error: weft.secrets.ScopeMismatch
      - name: formation-scope-without-formation
        when: {all: [scope == Formation, {formation_id: {defined: false}}]}
        error: weft.secrets.ScopeMismatch
      - name: formation-scope-with-environment
        when: {all: [scope == Formation, {environment_id: {defined: true}}]}
        error: weft.secrets.ScopeMismatch
      - name: environment-scope-without-formation
        when: {all: [scope == Environment, {formation_id: {defined: false}}]}
        error: weft.secrets.ScopeMismatch
      - name: environment-scope-without-environment
        when: {all: [scope == Environment, {environment_id: {defined: false}}]}
        error: weft.secrets.ScopeMismatch
      # hardening pass 1 D3: the account must be the one the request acts in. It reads no row and
      # answers like a missing account, so another account's existence is not disclosed (an input
      # guard answers ahead of every row check in the precedence order).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.secrets.ScopeNotFound
      - name: no-such-backend
        when_related: {via: input.backend_id, exists: false}
        error: weft.secrets.NoSuchBackend
      # The scope must exist and nest: the formation in the account, the environment in the
      # formation. A secret never lands in a scope of another account (isolation, default deny).
      - name: no-such-scope
        when_related: {via: input.scope_id, exists: false}
        error: weft.secrets.ScopeNotFound
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.secrets.ScopeNotFound
      - name: no-such-environment
        when_related: {via: input.environment_id, exists: false}
        error: weft.secrets.ScopeNotFound
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.secrets.ScopeNotFound
      - name: environment-of-other-formation
        when_related: {via: input.environment_id, predicate: formation_id != input.formation_id}
        error: weft.secrets.ScopeNotFound
      # A name is unique within (account, scope, formation, environment). hardening pass 3: the
      # scope guards above fix which of formation and environment are present for each scope, so
      # the selector compares only the fields its scope has, each behind `defined`; ESS 0.99.2
      # reads `==` over an absent Optional as Unknown (was the UNMAPPED note here).
      - name: name-taken
        when_related:
          entity: weft.secrets.Secret
          where:
            all:
              - scope_id == input.scope_id
              - scope == input.scope
              - name == input.name
              - any:
                  - scope == Scope
                  - all: [scope == Formation, defined(formation_id), formation_id == input.formation_id]
                  - all: [scope == Environment, defined(environment_id), environment_id == input.environment_id]
          exists: true
        error: weft.secrets.SecretNameTaken
      - name: created
        creates: weft.secrets.Secret
        instance: secret_id
        sets:
          scope_id: input.scope_id
          scope: input.scope
          formation_id: input.formation_id
          environment_id: input.environment_id
          name: input.name
          backend_id: input.backend_id
        emits: [weft.secrets.SecretCreated]
        payload:
          weft.secrets.SecretCreated:
            secret_id: {generated: true}
            scope_id: input.scope_id
            scope: input.scope
            name: input.name

  # Sketch lines 373 and 379: "a rotation adds a version"; "a value is written once through the
  # API and never returned by it". The first value and every rotation are this command. The only
  # declaration in weft that carries a weft.secrets.SecretValue is its `value` input. It has no
  # response; its event carries identifiers only. The value goes to the secret's backend
  # (`unavailable` refuses when the backend does not store it); the version keeps the reference.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:525
  - name: weft.secrets.AddSecretVersion
    naming:
      display: Add a secret version (set or rotate the value)
    input:
      - {name: secret_id, type: weft.shared.SecretId}
      # hardening pass 1 D3: the account the request acts in, so the secret can be tied to the
      # caller (a Secret is a related row here, and a related row's field is not compared with the
      # caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: value, type: weft.secrets.SecretValue}
    outcomes:
      - name: empty-value
        when: {value: {equals: ""}}
        error: weft.secrets.EmptyValue
      # hardening pass 1 D3: the account must be the one the request acts in; it reads no row and
      # answers like a missing secret (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.secrets.NoSuchSecret
      - name: no-such-secret
        when_related: {via: input.secret_id, exists: false}
        error: weft.secrets.NoSuchSecret
      # hardening pass 1 D3: a secret of another account answers like a missing one.
      - name: secret-of-other-scope
        when_related: {via: input.secret_id, predicate: scope_id != input.scope_id}
        error: weft.secrets.NoSuchSecret
      # Kept external: the backend store or vault holds the value; weft stores only its reference.
      - name: unavailable
        external: the secret's backend does not store the value
        error: weft.secrets.BackendUnavailable
      - name: added
        creates: weft.secrets.SecretVersion
        instance: version_id
        sets:
          secret_id: input.secret_id
          value_ref: {generated: true}
          created_at: {generated: true}
        emits: [weft.secrets.SecretVersionAdded]
        payload:
          weft.secrets.SecretVersionAdded:
            secret_id: input.secret_id
            version_id: {generated: true}

  # Sketch line 373: "a version can be disabled" (brief); a compromised value is answered here.
  # A disabled version is never delivered, and a grant following latest whose newest version is
  # disabled is refused, not served an older value (AGENTS.md: never a silent fallback).
  # OPEN: whether `latest` should skip a disabled newest version. Taken: no, delivery is refused
  # until a new version is added.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:573
  - name: weft.secrets.DisableSecretVersion
    naming:
      display: Disable a secret version
    input:
      - {name: version_id, type: weft.shared.SecretVersionId}
      # hardening pass 1 D3: the account the request acts in; a version holds no account of its
      # own, so it is tied to the caller through its secret.
      - {name: scope_id, type: weft.shared.ScopeId}
    outcomes:
      # hardening pass 1 D3: the account must be the one the request acts in; it reads no row and
      # answers like a missing version (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.secrets.NoSuchVersion
      - name: no-such-version
        unknown_instance: true
        error: weft.secrets.NoSuchVersion
      # hardening pass 1 D3: a version of another account's secret answers like a missing one,
      # before its state is read.
      - name: secret-of-other-scope
        when_related:
          entity: weft.secrets.Secret
          where:
            all:
              - secret_id == subject.secret_id
              - scope_id != input.scope_id
          exists: true
        error: weft.secrets.NoSuchVersion
      - name: disabled
        moves: weft.secrets.SecretVersion.disable
        instance: version_id
        emits: [weft.secrets.SecretVersionDisabled]
        payload:
          weft.secrets.SecretVersionDisabled:
            version_id: input.version_id
      - name: wrong-state
        wrong_state: true
        error: weft.secrets.StateConflict

  # Sketch lines 375-376 and 396: a grant names a workload identity, never an instance; it
  # delivers as a file or an environment variable; it pins a version or follows latest
  # (line 373-374). Default deny: no grant, no delivery (DeliverSecret).
  # weft@6798e7d:ess/5-runtime/secrets.yaml:615
  - name: weft.secrets.GrantSecret
    naming:
      display: Grant a secret to a workload identity
    input:
      - {name: secret_id, type: weft.shared.SecretId}
      # hardening pass 1 D3: the account the request acts in, so the secret can be tied to the
      # caller (a Secret is a related row here).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: identity, type: weft.shared.WorkloadIdentity}
      - {name: mode, type: weft.secrets.DeliveryMode}
      - {name: target, type: weft.secrets.DeliveryTarget}
      - {name: pin, type: weft.secrets.VersionPin}
      - {name: pinned_version_id, type: Optional<weft.shared.SecretVersionId>}
    outcomes:
      - name: pinned-without-version
        when: {all: [pin == Pinned, {pinned_version_id: {defined: false}}]}
        error: weft.secrets.PinMismatch
      - name: latest-with-version
        when: {all: [pin == Latest, {pinned_version_id: {defined: true}}]}
        error: weft.secrets.PinMismatch
      # hardening pass 1 D3: the account must be the one the request acts in; it reads no row and
      # answers like a missing secret (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.secrets.NoSuchSecret
      - name: no-such-secret
        when_related: {via: input.secret_id, exists: false}
        error: weft.secrets.NoSuchSecret
      - name: no-such-version
        when_related: {via: input.pinned_version_id, exists: false}
        error: weft.secrets.NoSuchVersion
      # hardening pass 1 D3: a secret of another account answers like a missing one.
      - name: secret-of-other-scope
        when_related: {via: input.secret_id, predicate: scope_id != input.scope_id}
        error: weft.secrets.NoSuchSecret
      # hardening pass 1 disclosure (GrantSecret pinned_version_id): a version of another secret
      # answers like a missing version, so a caller does not learn that it exists.
      - name: version-of-other-secret
        when_related: {via: input.pinned_version_id, predicate: secret_id != input.secret_id}
        error: weft.secrets.NoSuchVersion
      - name: version-disabled
        when_related: {via: input.pinned_version_id, predicate: state == Disabled}
        error: weft.secrets.VersionDisabled
      - name: target-taken
        when_related:
          entity: weft.secrets.SecretGrant
          where:
            all:
              - identity == input.identity
              - target == input.target
              - state == Active
          exists: true
        error: weft.secrets.TargetTaken
      # Kept external: a grant names a component-level WorkloadIdentity, a string of name segments;
      # no weft record maps it to the secret's account, formation or environment ids, and the
      # account policy the sketch names (section 5, Simulation) is not modelled in a lower domain.
      - name: identity-outside-scope
        external: the workload identity does not lie inside the secret's scope, formation or environment scope, or the scope's policy denies the grant (identity and scopes domains)
        error: weft.secrets.IdentityOutsideScope
      - name: granted
        creates: weft.secrets.SecretGrant
        instance: grant_id
        sets:
          secret_id: input.secret_id
          identity: input.identity
          mode: input.mode
          target: input.target
          pin: input.pin
          pinned_version_id: input.pinned_version_id
        emits: [weft.secrets.SecretGranted]
        payload:
          weft.secrets.SecretGranted:
            grant_id: {generated: true}
            secret_id: input.secret_id
            identity: input.identity
            mode: input.mode
            pin: input.pin

  # Not named by the sketch: the narrowing counterpart of GrantSecret (sketch lines 375-376).
  # A revoked grant delivers nothing to an instance started after it.
  # OPEN: whether revoking a grant also stops or restarts the instances that already hold the value.
  # weft@6798e7d:ess/5-runtime/secrets.yaml:696
  - name: weft.secrets.RevokeSecretGrant
    naming:
      display: Revoke a secret grant
    input:
      - {name: grant_id, type: weft.shared.SecretGrantId}
      # hardening pass 1 D3: the account the request acts in; a grant holds no account of its
      # own, so it is tied to the caller through its secret.
      - {name: scope_id, type: weft.shared.ScopeId}
    outcomes:
      # hardening pass 1 D3: the account must be the one the request acts in; it reads no row and
      # answers like a missing grant (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.secrets.NoSuchGrant
      - name: no-such-grant
        unknown_instance: true
        error: weft.secrets.NoSuchGrant
      # hardening pass 1 D3: a grant of another account's secret answers like a missing one,
      # before its state is read.
      - name: secret-of-other-scope
        when_related:
          entity: weft.secrets.Secret
          where:
            all:
              - secret_id == subject.secret_id
              - scope_id != input.scope_id
          exists: true
        error: weft.secrets.NoSuchGrant
      - name: revoked
        moves: weft.secrets.SecretGrant.revoke
        instance: grant_id
        emits: [weft.secrets.SecretGrantRevoked]
        payload:
          weft.secrets.SecretGrantRevoked:
            grant_id: input.grant_id
      - name: wrong-state
        wrong_state: true
        error: weft.secrets.StateConflict

