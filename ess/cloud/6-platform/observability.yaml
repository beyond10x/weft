# Moved from weft@6798e7d:ess/5-runtime/observability.yaml.
# Comments are weft's at that commit: "sketch", "section" and "design" cite weft's documents, and
# where a comment says account or tenant, the block reads scope (docs/boundary.md, D1 A).
# Observability: log streams, metric series, alert rules and their alerts, notification targets,
# telemetry sinks and the telemetry policy of a formation or environment. Source:
# docs/domain-sketch.md "16. Observability (logs, metrics, traces)" (lines 613-641), with "15.
# Health" (lines 600-611: check results, restarts, backing-off) and "11. Node control" (lines
# 467-477: the node agent reports what it observed) as context.
#
# What this domain records and what it does not.
# - Rows are the metadata of telemetry: which streams, series, rules, alerts, sinks and policies
#   exist, who owns them and in which state they are. Log lines, metric samples and spans are not
#   rows: their volume belongs to a telemetry store, read through the exec channel's `Logs` kind
#   (protocols/exec-channel.yaml) and the store's query API.
#   OPEN: the telemetry store (which engine, where it runs, whether it is a weft-on-weft formation
#   like a catalog offering) and its query API are not decided by the sketch.
# - Kept apart from metering (line 615-617): no price, no usage record, no meter here. Metering
#   (layer 8) may meter the volume of telemetry ingested and stored; it reads this domain, never
#   the other way.
# - Isolation (line 638-639; cloudspec, D1 A): every owned row names its scope; a caller reads
#   only the rows of the scope it acts in (every user view is filtered by
#   `scope_id == param.scope_id`, the caller's scope bound by `weft.actors`). A node-level series
#   names its node and no scope; only the ClusterOperator reads it. Every guard below that crosses
#   a scope refuses; there is no fallback.
domain: weft.observability

summary: >-
  Logs, metrics, alerts and traces of instances, nodes and the control plane itself: which log
  streams, metric series, alert rules, notification targets, telemetry sinks and telemetry
  policies exist, who owns them, and where telemetry is forwarded. A fired alert is weft's
  run-time record (D7 A). docs/domain-sketch.md § 16.

naming:
  wire: observability
  display: Observability

types:
  # Line 620-621: a stream carries "stdout and stderr of one process of one instance, plus weft's
  # own events about the instance". Process: one per process; Events: one per instance, weft's
  # own events (scheduled, started, check failed, restarted, evicted).
  # OPEN: whether stdout and stderr are one stream with a tag per line or two streams. Taken: one
  # stream per process, each line tagged by the store.
  # weft@6798e7d:ess/5-runtime/observability.yaml:39
  - name: weft.observability.LogStreamKind
    kind: enum
    variants: [Process, Events]

  # Line 623 and 636-637: the three signals a sink takes and a policy routes.
  # weft@6798e7d:ess/5-runtime/observability.yaml:44
  - name: weft.observability.Signal
    kind: enum
    variants: [Logs, Metrics, Traces]

  # Line 623: "forward to an outside receiver (OTLP, syslog, a bucket of the account)".
  # weft@6798e7d:ess/5-runtime/observability.yaml:49
  - name: weft.observability.SinkProtocol
    kind: enum
    variants: [Otlp, Syslog, Bucket]

  # Line 626-629: system metrics come from the node agent; custom metrics are pushed by an
  # instance over OTLP.
  # weft@6798e7d:ess/5-runtime/observability.yaml:55
  - name: weft.observability.SeriesSource
    kind: enum
    variants: [System, Custom]

  # Line 630: a series' name, e.g. `cpu_seconds`, `http_requests_total`.
  # OPEN: the naming rule (OpenTelemetry semantic conventions, Prometheus names). Not checked here.
  # weft@6798e7d:ess/5-runtime/observability.yaml:61
  - name: weft.observability.MetricName
    kind: newtype
    of: String

  # Line 631: "a condition over a series and a window". The condition is the series aggregated
  # over the window, compared with a threshold.
  # OPEN: which aggregations. Taken: the four every metrics backend offers.
  # weft@6798e7d:ess/5-runtime/observability.yaml:68
  - name: weft.observability.Aggregation
    kind: enum
    variants: [Average, Minimum, Maximum, Sum]

  # weft@6798e7d:ess/5-runtime/observability.yaml:72
  - name: weft.observability.Comparison
    kind: enum
    variants: [Above, Below]

  # Line 632: "a NotificationTarget (webhook, email, a queue of the catalog)".
  # weft@6798e7d:ess/5-runtime/observability.yaml:77
  - name: weft.observability.NotificationKind
    kind: enum
    variants: [Webhook, Email, CatalogQueue]

entities:
  # Line 620-622: "`LogStream`: stdout and stderr of one process of one instance, plus weft's own
  # events about the instance"; "Retention per account, bounded by the plan".
  # The record is the stream, not its lines. Opened when its process starts (Process) or when the
  # instance is scheduled (Events); closed when the process or the instance ends; expired, with its
  # stored lines dropped, once its retention has passed.
  # weft@6798e7d:ess/5-runtime/observability.yaml:92
  - name: weft.observability.LogStream
    naming:
      summary: >-
        The log of one process of one instance, or the control plane's own events about one instance, with the
        retention its stored lines are kept for.
    identity:
      name: log_stream_id
      type: weft.shared.LogStreamId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: instance_id
        type: weft.shared.InstanceId
      - name: node_id
        type: weft.shared.NodeId
      - name: kind
        type: weft.observability.LogStreamKind
      # The process's name in its workload (weft.workloads.Process.name); absent for Events.
      - name: process
        type: Optional<weft.shared.ProcessName>
      # Days the stored lines are kept after the stream closes. The opener takes it from the
      # telemetry policy of the instance's environment, else of its formation.
      # OPEN: the value when neither has a policy (a cluster default), and whether the sketch's
      # "retention per account" is a third, account-wide level. Taken: the opener's value, bounded
      # below.
      - name: retention_days
        type: Integer
      - name: opened_at
        type: Timestamp
      - name: closed_at
        type: Optional<Timestamp>
      # closed_at plus retention_days.
      - name: retained_until
        type: Optional<Timestamp>
    invariants:
      - retention_days >= 1
      - retention_days <= 365
    relations:
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      - {name: node, kind: references, target: weft.infrastructure.Node, cardinality: one, via: node_id}
    lifecycle:
      initial: Open
      states:
        - {name: Open, summary: Lines are appended and can be read live.}
        - {name: Closed, summary: "The process or instance ended; the stored lines are kept until retained_until."}
        - {name: Expired, summary: Past its retention; the stored lines are dropped.}
      terminal: [Expired]
      transitions:
        - {name: close, from: [Open], to: Closed}
        - {name: expire, from: [Closed], to: Expired}

  # Line 623: "`TelemetrySink`: forward to an outside receiver (OTLP, syslog, a bucket of the
  # account)"; line 636-637: a policy says "which signals go to which sink". A sink belongs to one
  # account and lists the signals it accepts; a policy routes each signal to at most one sink.
  # OPEN: how weft authenticates to an outside receiver (a header token, mutual TLS). A credential
  # would be a reference to a weft.secrets.Secret, never a value; the sketch names none, so no
  # field is written.
  # OPEN: whether forwarding to an outside endpoint passes the formation's egress rules (default
  # deny, section 4) or is weft's own egress. Taken: weft's own, from the control plane.
  # weft@6798e7d:ess/5-runtime/observability.yaml:152
  - name: weft.observability.TelemetrySink
    naming:
      summary: >-
        An outside receiver of one scope's telemetry: an OTLP endpoint, a syslog endpoint or a
        bucket of the scope, for the signals it lists.
    identity:
      name: telemetry_sink_id
      type: weft.shared.TelemetrySinkId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: name
        type: String
      - name: protocol
        type: weft.observability.SinkProtocol
      # OTLP or syslog: the receiver's address (URL or host:port). Absent for Bucket.
      - name: endpoint
        type: Optional<String>
      # Bucket: a bucket of the same account. Absent otherwise.
      - name: bucket_id
        type: Optional<weft.shared.BucketId>
      - name: signals
        type: List<weft.observability.Signal>
      # The last delivery error, while Failing.
      - name: failure_reason
        type: Optional<String>
    invariants:
      - signals.count >= 1
      - any:
          - all: [protocol == Bucket, defined(bucket_id), not defined(endpoint)]
          - all: [protocol != Bucket, defined(endpoint), not defined(bucket_id)]
    relations:
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      - {name: bucket, kind: references, target: weft.resources.Bucket, cardinality: one, via: bucket_id}
    # Brief: configured, active, failing, removed. Configured until the first delivery is
    # confirmed; a failed delivery makes it Failing and a later one Active again.
    # OPEN: whether telemetry is buffered while a sink fails, and for how long. Not decided here.
    lifecycle:
      initial: Configured
      states:
        - {name: Configured, summary: Written; no delivery confirmed yet.}
        - {name: Active, summary: The last delivery succeeded.}
        - {name: Failing, summary: "The last delivery failed; failure_reason says why."}
        - {name: Removed, summary: Takes no telemetry.}
      terminal: [Removed]
      transitions:
        - {name: deliver, from: [Configured, Failing], to: Active}
        - {name: fail, from: [Configured, Active], to: Failing}
        - {name: remove, from: [Configured, Active, Failing], to: Removed}

  # Line 632: "a `NotificationTarget` (webhook, email, a queue of the catalog)". Owned by one
  # account; an alert rule of the same account names it.
  # weft@6798e7d:ess/5-runtime/observability.yaml:204
  - name: weft.observability.NotificationTarget
    naming:
      summary: "Where one scope's alerts are sent: a webhook URL, an email address or a catalog queue."
    identity:
      name: notification_target_id
      type: weft.shared.NotificationTargetId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: name
        type: String
      - name: kind
        type: weft.observability.NotificationKind
      # A webhook URL, an email address, or a catalog queue's address.
      # OPEN: a catalog queue is a weft.services.ServiceInstance (layer 7), which this layer-5
      # domain cannot reference, so its address is kept as a value and whether it names a queue of
      # the same account is checked outside the model (an `external` refusal on
      # AddNotificationTarget). Moving the target, or its queue kind, into the catalog would make
      # that a checked relation.
      # OPEN: how a webhook call is authenticated (a signing secret) and how an email address is
      # confirmed. Not decided by the sketch.
      - name: address
        type: String
    relations:
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: Receives the alerts of the rules that name it.}
        - {name: Removed, summary: Receives nothing.}
      terminal: [Removed]
      transitions:
        - {name: remove, from: [Active], to: Removed}

  # Line 626-630: "System metrics per instance and node: CPU, memory, disk I/O, network in and
  # out, restarts, check results"; "Custom metrics: an instance pushes OTLP to the node-local
  # endpoint, authenticated by its workload identity"; "`MetricSeries` (name, labels, owner
  # account)". The record is the series, not its samples.
  # Isolation (line 638-639, brief): a series of an instance names the instance's account, taken
  # from the instance record, never from the caller; a node-level series names its node and no
  # account, and only the ClusterOperator reads it.
  # OPEN: series at the edge and links (requests, errors, latency, line 627) name a route or a
  # link of a formation, not an instance or a node. Not modelled until the edge's domain is
  # written; they would carry the formation's account and no instance.
  # OPEN: line 630 "`ScaleRule` and `SleepPolicy` read series". Both live in layer 4
  # (weft.workloads), which cannot reference this layer-5 entity; ScaleRule names a
  # weft.workloads.ScaleMetric enum instead. The scaler reads series by name and labels at run
  # time.
  # weft@6798e7d:ess/5-runtime/observability.yaml:252
  - name: weft.observability.MetricSeries
    naming:
      summary: >-
        One metric series, a name with its labels, of one instance (owned by its scope) or of
        one node (owned by no scope); system series come from the node agent, custom ones from
        the instance.
    identity:
      name: metric_series_id
      type: weft.shared.MetricSeriesId
    fields:
      - name: name
        type: weft.observability.MetricName
      - name: labels
        type: Map<String, String>
      - name: source
        type: weft.observability.SeriesSource
      # The node that reports it: the subject of a node-level series, the instance's node
      # otherwise.
      - name: node_id
        type: weft.shared.NodeId
      # Present together: a series of an instance and its owner account.
      - name: instance_id
        type: Optional<weft.shared.InstanceId>
      - name: scope_id
        type: Optional<weft.shared.ScopeId>
      # Line 628-629 "authenticated by its workload identity": the identity document a custom
      # series was first pushed with, as RegisterInstanceSeries checked it; absent when the
      # registration named none (a System series). Kept so the check reads a declared relation.
      - name: identity_document_id
        type: Optional<weft.shared.IdentityDocumentId>
      - name: registered_at
        type: Timestamp
    invariants:
      - any:
          - all: [defined(scope_id), defined(instance_id)]
          - all: [not defined(scope_id), not defined(instance_id), source == System]
    relations:
      - {name: node, kind: references, target: weft.infrastructure.Node, cardinality: one, via: node_id}
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      - {name: identity_document, kind: references, target: weft.identity.IdentityDocument, cardinality: one, via: identity_document_id}
    # OPEN: when a series ends (its instance ended, no sample for a while, its retention passed).
    # Taken: retired by the control plane when its instance ends or its node is removed; its
    # samples stay for the metrics retention of the policy.
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: Takes samples.}
        - {name: Retired, summary: Takes no samples; stored samples stay readable until their retention ends.}
      terminal: [Retired]
      transitions:
        - {name: retire, from: [Active], to: Retired}

  # Line 631: "`AlertRule`: a condition over a series and a window". The condition is: the series
  # aggregated over the window is above (or below) the threshold. A rule belongs to one account
  # and reads only a series of that account.
  # OPEN: whether a rule selects one series (written here) or every series of a name and labels
  # across the instances of a component, which survives a restart; an instance series ends with
  # its instance.
  # OPEN: rules over node-level series for the ClusterOperator. Taken: none; a rule has an account.
  # OPEN: bounds of the window and a "for" duration before firing. Not written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:313
  - name: weft.observability.AlertRule
    naming:
      summary: >-
        A condition over one metric series of a scope, aggregated over a window and compared
        with a threshold, and the target its alerts are sent to.
    identity:
      name: alert_rule_id
      type: weft.shared.AlertRuleId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: name
        type: String
      - name: metric_series_id
        type: weft.shared.MetricSeriesId
      - name: aggregation
        type: weft.observability.Aggregation
      - name: window
        type: Duration
      - name: comparison
        type: weft.observability.Comparison
      - name: threshold
        type: Binary64
      - name: notification_target_id
        type: weft.shared.NotificationTargetId
    relations:
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      - {name: series, kind: references, target: weft.observability.MetricSeries, cardinality: one, via: metric_series_id}
      - {name: target, kind: references, target: weft.observability.NotificationTarget, cardinality: one, via: notification_target_id}
    # OPEN: silencing a rule for a while (disable, enable). Not written; delete and create again.
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: Evaluated over its series.}
        - {name: Deleted, summary: Not evaluated.}
      terminal: [Deleted]
      transitions:
        - {name: delete, from: [Active], to: Deleted}

  # Line 636-637: "`TelemetryPolicy` per formation or environment: sampling (ratio, always on
  # error), retention, which signals go to which sink". Brief: retention per signal.
  # A policy without an environment covers the whole formation; one with an environment covers
  # that environment and wins over the formation's.
  # Line 622 "Retention per account, bounded by the plan": the plan is not a record of any layer
  # this domain may read (plans live in the catalog, layer 7, and metering, layer 8).
  # OPEN: where an account's plan bound on retention is recorded. Taken: a fixed bound of 1 to 365
  # days here, and an `external` refusal for the plan's bound.
  # OPEN: sampling of traces begins at the edge and links (line 635); whether an instance's own
  # spans obey the same ratio is not said.
  # weft@6798e7d:ess/5-runtime/observability.yaml:408
  - name: weft.observability.TelemetryPolicy
    naming:
      summary: >-
        How the telemetry of one formation, or of one of its environments, is sampled, how long
        each signal is kept and which sink each signal is forwarded to.
    identity:
      name: telemetry_policy_id
      type: weft.shared.TelemetryPolicyId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      # cloudspec (layer rule): the formation, or the formation and environment, the policy covers,
      # named by the workload-identity prefix of its components (the formation segment, or the
      # formation and environment segments), not by the composition's ids; a layer-6 block names no
      # layer-9 record. The longer prefix wins over the shorter.
      - name: path
        type: weft.shared.WorkloadIdentity
      # Share of traces kept, 0 to 1.
      - name: trace_sampling_ratio
        type: Binary64
      # "always on error": a trace with an error span is kept whatever the ratio.
      - name: keep_error_traces
        type: Boolean
      - name: logs_retention_days
        type: Integer
      - name: metrics_retention_days
        type: Integer
      - name: traces_retention_days
        type: Integer
      # Absent: the signal is kept in weft and forwarded nowhere.
      - name: logs_sink_id
        type: Optional<weft.shared.TelemetrySinkId>
      - name: metrics_sink_id
        type: Optional<weft.shared.TelemetrySinkId>
      - name: traces_sink_id
        type: Optional<weft.shared.TelemetrySinkId>
    invariants:
      - trace_sampling_ratio >= 0.0
      - trace_sampling_ratio <= 1.0
      - logs_retention_days >= 1
      - logs_retention_days <= 365
      - metrics_retention_days >= 1
      - metrics_retention_days <= 365
      - traces_retention_days >= 1
      - traces_retention_days <= 365
    relations:
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      - {name: logs_sink, kind: references, target: weft.observability.TelemetrySink, cardinality: one, via: logs_sink_id}
      - {name: metrics_sink, kind: references, target: weft.observability.TelemetrySink, cardinality: one, via: metrics_sink_id}
      - {name: traces_sink, kind: references, target: weft.observability.TelemetrySink, cardinality: one, via: traces_sink_id}
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: In force for its formation or environment.}
        - {name: Removed, summary: "Not in force; the formation's policy, or the default, applies."}
      terminal: [Removed]
      transitions:
        - {name: remove, from: [Active], to: Removed}

errors:
  # weft@6798e7d:ess/5-runtime/observability.yaml:468
  - name: weft.observability.NotFound
    summary: The addressed record does not exist, and nothing changed.
  # weft@6798e7d:ess/5-runtime/observability.yaml:470
  - name: weft.observability.StateConflict
    summary: The addressed record is not in a state this command acts from, and nothing changed.
  # weft@6798e7d:ess/5-runtime/observability.yaml:472
  - name: weft.observability.RetentionOutOfBounds
    summary: A retention is outside 1 to 365 days, and nothing changed.
  # weft@6798e7d:ess/5-runtime/observability.yaml:480
  - name: weft.observability.InvalidStreamSource
    summary: >-
      A process stream names no process, or an events stream names one, so no stream was opened.
  # weft@6798e7d:ess/5-runtime/observability.yaml:483
  - name: weft.observability.LogStreamExists
    summary: The instance already has an open stream for this source, so no second one was opened.
  # weft@6798e7d:ess/5-runtime/observability.yaml:485
  - name: weft.observability.NotYetExpired
    summary: The stream's retention has not passed, so its lines were not dropped.
  # weft@6798e7d:ess/5-runtime/observability.yaml:487
  - name: weft.observability.InvalidSinkTarget
    summary: >-
      A bucket sink names no bucket or an endpoint, or an OTLP or syslog sink names no endpoint or
      a bucket, so no sink was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:491
  - name: weft.observability.EmptySignals
    summary: The sink lists no signal, and a sink that takes nothing is not written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:493
  - name: weft.observability.UnknownBucket
    summary: No bucket has this identity, so no sink was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:495
  - name: weft.observability.BucketNotAvailable
    summary: The bucket is not available, so no sink was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:497
  - name: weft.observability.SinkInUse
    summary: An active telemetry policy routes a signal to this sink, so it was not removed.
  # weft@6798e7d:ess/5-runtime/observability.yaml:499
  - name: weft.observability.QueueNotInScope
    summary: The address names no queue of the scope in the catalog, so no target was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:501
  - name: weft.observability.TargetInUse
    summary: An active alert rule names this target, so it was not removed.
  # weft@6798e7d:ess/5-runtime/observability.yaml:503
  - name: weft.observability.IdentityNotValid
    summary: >-
      The identity document is unknown, belongs to another instance, or is expired or revoked, so
      the pushed series was not registered.
  # weft@6798e7d:ess/5-runtime/observability.yaml:507
  - name: weft.observability.SeriesExists
    summary: An active series with this name and these labels already exists, so no second one was registered.
  # weft@6798e7d:ess/5-runtime/observability.yaml:509
  - name: weft.observability.UnknownSeries
    summary: No metric series has this identity, so no rule was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:511
  - name: weft.observability.SeriesNotActive
    summary: The series is retired, so no rule was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:513
  - name: weft.observability.UnknownTarget
    summary: No notification target has this identity, and nothing changed.
  # weft@6798e7d:ess/5-runtime/observability.yaml:515
  - name: weft.observability.TargetRemoved
    summary: The notification target is removed, and nothing changed.
  # weft@6798e7d:ess/5-runtime/observability.yaml:525
  - name: weft.observability.InvalidSamplingRatio
    summary: The trace sampling ratio is outside 0 to 1, so no policy was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:527
  - name: weft.observability.RetentionOverPlan
    summary: A retention exceeds the bound of the scope's plan, so no policy was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:529
  - name: weft.observability.UnknownFormation
    summary: No formation has this identity, so no policy was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:531
  - name: weft.observability.FormationRetired
    summary: The formation is retired, so no policy was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:533
  - name: weft.observability.UnknownEnvironment
    summary: No environment has this identity, so no policy was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:535
  - name: weft.observability.EnvironmentNotInFormation
    summary: The environment belongs to another formation, so no policy was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:537
  - name: weft.observability.TelemetryPolicyExists
    summary: >-
      An active policy already covers this formation or environment, so no second one was written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:540
  - name: weft.observability.UnknownSink
    summary: No telemetry sink has this identity, so the policy was not written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:542
  - name: weft.observability.SinkRemoved
    summary: The telemetry sink is removed, so the policy was not written.
  # weft@6798e7d:ess/5-runtime/observability.yaml:544
  - name: weft.observability.SinkSignalMismatch
