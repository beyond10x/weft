  # (weft@6798e7d:ess/0-foundation/shared.yaml:15) in the moved blocks.
  - name: weft.shared.ScopeId
    kind: newtype
    of: Uuid
  # A caller by value (weft@6798e7d:ess/0-foundation/shared.yaml:18): no block holds a principal
  # entity; a deployment names its callers.
  - name: weft.shared.PrincipalId
    kind: newtype
    of: Uuid
