# Moved from weft@6798e7d:ess/0-foundation/shared.yaml: the identifiers of the moved entities and the
# Comments are weft's at that commit: "sketch", "section" and "design" cite weft's documents, and
# where a comment says account or tenant, the block reads scope (docs/boundary.md, D1 A).
# value types the moved blocks use.
domain: weft.shared

summary: >-
  Identifiers of every entity of the cloud blocks and the value types more than one block uses.
  A block refers to an entity of another block through its identifier here.

naming:
  wire: weft
  display: Shared

