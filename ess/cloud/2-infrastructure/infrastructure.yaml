      - {name: capacity, type: Optional<List<weft.shared.ResourceAmount>>}
      - {name: isolation_facts, type: Optional<weft.shared.IsolationFacts>}
      - {name: observed_at, type: Optional<Timestamp>}
      - {name: state, type: weft.infrastructure.Node.State}

  # Sketch lines 441-443: the nodes of one cluster, for the operator and the scheduler (line 453).
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1415
  - name: weft.infrastructure.CloudNodes
