# Moved from weft@6798e7d:ess/1-infrastructure/infrastructure.yaml.
# Comments are weft's at that commit: "sketch", "section" and "design" cite weft's documents, and
# where a comment says account or tenant, the block reads scope (docs/boundary.md, D1 A).
#
# cloudspec (docs/boundary.md, C3): `Cloud` keeps its name, placement and policy. weft's
# `control_plane` (weft's own control plane, ControlPlaneSpec, ScaleControlPlane) and
# `access_mode` (how the example's users log in) are cut, with the CreateCloud refusals that
# read them. `NodePool.requested_for` (the tenant cluster pool a pool was made for) and its
# guard and view are cut with the tenant clusters (C2). Comments below are weft's.
# Infrastructure (was `weft.cluster` until 2026-11-26): the cloud's own placement, control plane, nodes, node pools, zones and priority classes.
# Sources: docs/domain-sketch.md "9. Cluster" (lines 436-445), "Planes" (lines 54-63),
# "Components" (lines 65-73), "Lowering (how weft itself is deployed)" (lines 576-583), the
# AccessMode of "2. Access" (lines 146-151), and the priority classes of "10. Scheduling" (line 459).
# Every command here is the ClusterOperator's (Actors, line 102), except the two a node issues
# itself: JoinNode and RecordNodeObservation (NodeAgent, line 112). Actors are written by the
# integration pass. The ControlPlane runs the drain of a tenant cluster's dedicated pool
# (DrainNodePool, DrainNode, RemoveNode, DeleteNodePool; ess/components.yaml, hardening pass 4).
domain: weft.infrastructure

summary: >-
  The clouds of an installation: where each is placed and its policy, the nodes that joined it
  with what they observed about themselves, the node pools that make nodes, the zones they fail
  in, and the priority classes the scheduler places and preempts by.

naming:
  wire: weft
  display: Infrastructure

types:
  # Sketch line 439 and Lowering lines 576-583: `local`, `hosts`, `aws`, `kubernetes`. Line 439
  # lists `hosts` with "one VM, one EC2, many EC2"; Lowering adds `aws` as its own placement.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:23
  - name: weft.infrastructure.Placement
    kind: enum
    variants: [Local, Hosts, Aws, Kubernetes]

  # Sketch line 438 "policy". The sketch names no content.
  # OPEN: what the cluster policy holds beyond a minimum isolation level for every workload.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:32
  - name: weft.infrastructure.CloudPolicy
    kind: struct
    fields:
      - name: minimum_isolation
        type: weft.shared.IsolationLevel

  # Sketch line 441: role `control`, `worker` or both.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:49
  - name: weft.infrastructure.NodeRole
    kind: enum
    variants: [Control, Worker, Both]

entities:
  # Sketch line 438: "`Cluster`: name, placement, access mode, policy", with its ControlPlane
  # (line 440).
  # OPEN: the sketch gives a cluster no lifecycle; it is Active from creation and nothing retires
  # it. Whether and how a cluster is decommissioned is not decided.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:68
  - name: weft.infrastructure.Cloud
    naming:
      summary: One cloud, where it is placed, and its policy.
    identity:
      name: cloud_id
      type: weft.shared.CloudId
    fields:
      - name: name
        type: String
      # Fixed at creation: no command moves a cluster to another placement.
      - name: placement
        type: weft.infrastructure.Placement
      - name: policy
        type: weft.infrastructure.CloudPolicy
    lifecycle:
      initial: Active
      states: [Active]
      terminal: [Active]

  # Sketch line 445: "`Zone`: failure domain".
  # OPEN: weft.shared gives a zone only its ZoneName, so a zone name is unique across clusters,
  # not per cluster.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:96
  - name: weft.infrastructure.Zone
    naming:
      summary: A failure domain of one cluster; nodes and node pools sit in exactly one zone.
    identity:
      name: zone
      type: weft.shared.ZoneName
    fields:
      - name: cloud_id
        type: weft.shared.CloudId
    relations:
      # A reference: no command deletes a cluster, so ownership decides nothing yet.
      # OPEN: owns or references, once a cluster can be decommissioned.
      - name: cluster
        kind: references
        target: weft.infrastructure.Cloud
        cardinality: one
        via: cloud_id
    # OPEN: the sketch gives a zone no lifecycle; Retired is the smallest end, taken only when no
    # node or node pool is left in it.
    lifecycle:
      initial: Declared
      states: [Declared, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Declared]
          to: Retired

  # Sketch line 444: "`NodePool`: template for nodes (machine type, image, min/max size)";
  # line 453: "Scale up by asking a NodePool for a node; drain idle nodes"; line 580: "`aws`:
  # NodePools to EC2 launch templates".
  # OPEN: the role (control, worker, both) of the nodes a pool makes; taken as Worker only
  # (ProvisionPoolNode), so a pool never makes a control node.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:129
  - name: weft.infrastructure.NodePool
    naming:
      summary: A template for nodes of one cluster and zone, and the size the pool is asked to hold.
    identity:
      name: node_pool_id
      type: weft.shared.NodePoolId
    fields:
      - name: cloud_id
        type: weft.shared.CloudId
      - name: name
        type: String
      - name: zone
        type: weft.shared.ZoneName
      # The provider's machine type (an EC2 instance type on `aws`). Carried as text.
      - name: machine_type
        type: String
      # The provider's name of the machine image a pool's node boots (an AMI on `aws`), carried
      # as text. Never a weft artifact: artifacts sit in layer 3, and layer 1 names none
      # (integration 2026-11-26).
      - name: image
        type: String
      - name: min_size
        type: Integer
      - name: max_size
        type: Integer
      # The number of nodes the pool is asked to hold; scale requests move it within the bounds.
      - name: desired_size
        type: Integer
    relations:
      - name: cluster
        kind: references
        target: weft.infrastructure.Cloud
        cardinality: one
        via: cloud_id
      - name: in_zone
        kind: references
        target: weft.infrastructure.Zone
        cardinality: one
        via: zone
    invariants:
      - min_size >= 0
      - min_size <= max_size
      - desired_size >= min_size
      - desired_size <= max_size
    # OPEN: the sketch gives a pool no lifecycle; Deleted is the smallest end, taken only when no
    # node of the pool is left. Draining (hardening pass 4, sketch line 462 "drain idle nodes"):
    # the pool is asked for zero nodes and makes none, while its nodes drain and go.
    lifecycle:
      initial: Active
      states: [Active, Draining, Deleted]
      terminal: [Deleted]
      transitions:
        - name: drain
          from: [Active]
          to: Draining
        - name: delete
          from: [Active, Draining]
          to: Deleted

  # Sketch lines 441-443: "`Node`: role `control`, `worker` or both. Lifecycle: provisioning,
  # joining, ready, cordoned, draining, gone. Reports `Capacity` and observed `IsolationFacts`."
  # Lines 462-463: the node agent dials out with mutual TLS.
  # Join: the ClusterOperator provisions a node and receives a one-time join token; the node
  # presents it once, before it expires, and moves to Joining; its first observation makes it
  # Ready. Only a digest-free record is kept here: the token's expiry and whether it was used.
  # The token itself is checked by the implementation (`external:` on JoinNode).
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:202
  - name: weft.infrastructure.Node
    naming:
      summary: One machine of a cluster, its role, its join, and what its node agent observed.
    identity:
      name: node_id
      type: weft.shared.NodeId
    fields:
      - name: cloud_id
        type: weft.shared.CloudId
      - name: zone
        type: weft.shared.ZoneName
      # Absent for a node not made by a pool (a host registered by hand on `hosts`).
      - name: node_pool_id
        type: Optional<weft.shared.NodePoolId>
      - name: role
        type: weft.infrastructure.NodeRole
      - name: join_token_expires_at
        type: Timestamp
      - name: join_token_used
        type: Boolean
      # Absent until the node agent's first observation.
      - name: capacity
        type: Optional<List<weft.shared.ResourceAmount>>
      - name: isolation_facts
        type: Optional<weft.shared.IsolationFacts>
      - name: observed_at
        type: Optional<Timestamp>
    relations:
      - name: cluster
        kind: references
        target: weft.infrastructure.Cloud
        cardinality: one
        via: cloud_id
      - name: in_zone
        kind: references
        target: weft.infrastructure.Zone
        cardinality: one
        via: zone
      - name: pool
        kind: references
        target: weft.infrastructure.NodePool
        cardinality: one
        via: node_pool_id
    lifecycle:
      initial: Provisioning
      states: [Provisioning, Joining, Ready, Cordoned, Draining, Gone]
      terminal: [Gone]
      transitions:
        - name: join
          from: [Provisioning]
          to: Joining
        - name: become_ready
          from: [Joining]
          to: Ready
        - name: cordon
          from: [Ready]
          to: Cordoned
        - name: uncordon
          from: [Cordoned]
          to: Ready
        - name: drain
          from: [Ready, Cordoned]
          to: Draining
        # OPEN: whether a node that lost its session (Ready, Cordoned) can be marked gone without
        # a drain; taken as no: it is drained first, and its instances move when their
        # assignment leases end (line 470).
        - name: remove
          from: [Provisioning, Joining, Draining]
          to: Gone

  # Sketch line 459 (§10 "`Priority` and `Preemption`"). Cluster-wide, set by the
  # ClusterOperator. Moved here from weft.scheduling (integration 2026-11-26) so that
  # weft.workloads.Workload (layer 4) and weft.scheduling (layer 5) both reference it downward;
  # the scheduler reads it and copies its value into each request.
  # OPEN: are priority classes cluster-wide (taken) or per tenant? Per tenant would let a tenant
  # preempt only its own instances.
  # OPEN: the class carries no cloud_id; a name is unique across clusters, like a zone name.
  # "12. Metering", pricing model `spot`: "preemptible capacity at a lower rate; the scheduler
  # may evict it first". Decided in integration (2026-11-26): spot is both a preemptible priority
  # class of the lowest value (here, nothing extra) and a price factor (metering's). The
  # scheduler reads no pricing attribute.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:283
  - name: weft.infrastructure.PriorityClass
    naming:
      summary: A named priority; a higher value is placed first and may preempt a lower one.
    identity:
      name: name
      type: weft.shared.PriorityClassName
    fields:
      - name: value
        type: Integer
      # May a request of this class preempt placements of a lower value.
      - name: preempts
        type: Boolean
      # May a placement of this class be preempted at all. The sketch sets no default; the
      # operator says so per class.
      - name: preemptible
        type: Boolean
      - name: grace_seconds
        type: Integer
    lifecycle:
      initial: Active
      states: [Active, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Active]
          to: Retired

errors:
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:311
  - name: weft.infrastructure.NotFound
    summary: The addressed record does not exist, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:313
  - name: weft.infrastructure.StateConflict
    summary: The addressed record is not in a state this command acts from, and nothing changed.
  # Security default (sketch line 12; line 455 "A workload's minimum is never weakened").
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:331
  - name: weft.infrastructure.IsolationWeakened
    summary: The policy would lower the cluster's minimum isolation level, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:333
  - name: weft.infrastructure.UnknownCloud
    summary: The named cluster does not exist, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:335
  - name: weft.infrastructure.ZoneExists
    summary: A zone of that name already exists, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:337
  - name: weft.infrastructure.UnknownZone
    summary: The named zone does not exist or is retired, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:339
  - name: weft.infrastructure.ZoneInUse
    summary: A node or node pool is still in the zone, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:341
  - name: weft.infrastructure.InvalidPoolSize
    summary: The pool's sizes are negative, its minimum exceeds its maximum, or they exclude its desired size; nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:343
  - name: weft.infrastructure.PoolAtMaxSize
    summary: The pool already holds its maximum size, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:345
  - name: weft.infrastructure.PoolAtMinSize
    summary: The pool already holds its minimum size, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:347
  - name: weft.infrastructure.PoolHasNodes
    summary: A node of the pool is not gone yet, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:349
  - name: weft.infrastructure.UnknownNodePool
    summary: The named node pool does not exist or is deleted, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:351
  - name: weft.infrastructure.InvalidTokenExpiry
    summary: A join token expires in the future and within 24 hours of its issue, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:353
  - name: weft.infrastructure.JoinTokenInvalid
    summary: The join token is not the one issued for the addressed node, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:355
  - name: weft.infrastructure.JoinTokenUsed
    summary: The node's join token was already used, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:357
  - name: weft.infrastructure.JoinTokenExpired
    summary: The node's join token has expired, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:359
  - name: weft.infrastructure.ForeignNode
    summary: The calling node agent is not the addressed node, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:361
  - name: weft.infrastructure.NodeNotJoined
    summary: The node has not joined or is gone, so it reports nothing; nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:363
  - name: weft.infrastructure.NodeNotEmpty
    summary: An instance is still assigned to the draining node, and nothing changed.
  # Sketch line 459 (priority classes, moved from weft.scheduling).
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:366
  - name: weft.infrastructure.PriorityClassExists
    summary: A priority class of that name exists already, and nothing changed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:368
  - name: weft.infrastructure.InvalidGracePeriod
    summary: A grace period in seconds is negative, and nothing changed.

