    fields:
      - {name: cloud_id, type: weft.shared.CloudId}
      - {name: name, type: String}
      - {name: placement, type: weft.infrastructure.Placement}
      - {name: policy, type: weft.infrastructure.CloudPolicy}

  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:381
  - name: weft.infrastructure.CloudPolicySet
    fields:
      - {name: cloud_id, type: weft.shared.CloudId}
      - {name: policy, type: weft.infrastructure.CloudPolicy}

  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:391
  - name: weft.infrastructure.ZoneDeclared
    fields:
      - {name: zone, type: weft.shared.ZoneName}
      - {name: cloud_id, type: weft.shared.CloudId}

  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:396
  - name: weft.infrastructure.ZoneRetired
    fields:
      - {name: zone, type: weft.shared.ZoneName}

  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:400
  - name: weft.infrastructure.NodePoolCreated
    fields:
      - {name: node_pool_id, type: weft.shared.NodePoolId}
      - {name: cloud_id, type: weft.shared.CloudId}
      - {name: name, type: String}
      - {name: zone, type: weft.shared.ZoneName}
      - {name: machine_type, type: String}
      - {name: image, type: String}
      - {name: min_size, type: Integer}
      - {name: max_size, type: Integer}

  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:412
  - name: weft.infrastructure.NodePoolUpdated
    fields:
      - {name: node_pool_id, type: weft.shared.NodePoolId}
      - {name: machine_type, type: String}
      - {name: image, type: String}
      - {name: min_size, type: Integer}
      - {name: max_size, type: Integer}

  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:420
  - name: weft.infrastructure.NodePoolScaleUpRequested
    fields:
      - {name: node_pool_id, type: weft.shared.NodePoolId}
