      - {name: max_size, type: Integer}
      - {name: desired_size, type: Integer}
      - {name: state, type: weft.infrastructure.NodePool.State}

  # Sketch line 462 ("drain idle nodes"), hardening pass 4: gap view of the level step that
  # deletes a draining pool once its nodes are gone (DeleteNodePool answers pool-has-nodes
  # before).
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1376
  - name: weft.infrastructure.DrainingNodePools
    source: weft.infrastructure.NodePool
    consistency: read_your_writes
    filter: state == Draining
    fields:
      - {name: node_pool_id, type: weft.shared.NodePoolId}

  # Sketch lines 441-443 and 462, hardening pass 4: gap view of the level step that drains each
  # node of a draining pool (DrainNode from Ready or Cordoned, RemoveNode from Provisioning,
  # Joining or Draining) until none is left.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1387
  - name: weft.infrastructure.DrainingPoolNodes
    source: weft.infrastructure.Node
    consistency: read_your_writes
    filter: {all: [defined(node_pool_id), node_pool_id.state == Draining, state != Gone]}
    fields:
      - {name: node_id, type: weft.shared.NodeId}
      - {name: node_pool_id, type: Optional<weft.shared.NodePoolId>}
      - {name: state, type: weft.infrastructure.Node.State}

  # Sketch lines 441-443. Every node with its role, observed capacity and isolation facts; no
  # join token is ever shown, only its expiry and whether it was used.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1398
  - name: weft.infrastructure.Nodes
