commands:
  # Sketch line 438 (Cluster), line 440 (ControlPlane), lines 147-151 and 578 (access mode by
  # placement).
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:510
  - name: weft.infrastructure.CreateCloud
    naming:
      display: Create a cloud
    input:
      - {name: name, type: String}
      - {name: placement, type: weft.infrastructure.Placement}
      - {name: policy, type: weft.infrastructure.CloudPolicy}
    outcomes:
      - name: created
        creates: weft.infrastructure.Cloud
        instance: cloud_id
        sets:
          name: input.name
          placement: input.placement
          policy: input.policy
        emits: [weft.infrastructure.CloudCreated]
        payload:
          weft.infrastructure.CloudCreated:
            cloud_id: {generated: true}
            name: input.name
            placement: input.placement
            policy: input.policy

  # Sketch line 438 "policy". The minimum isolation only rises: lowering it is refused, one
  # branch per stored level, because an ordering comparison over an enum is not expressible.
  # OPEN: whether and by what procedure an operator may lower the cluster's minimum isolation.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:563
  - name: weft.infrastructure.SetCloudPolicy
    naming:
      display: Set a cloud's policy
    input:
      - {name: cloud_id, type: weft.shared.CloudId}
      - {name: policy, type: weft.infrastructure.CloudPolicy}
    outcomes:
      - name: no-such-cluster
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: weakened-from-microvm
        when: {policy.minimum_isolation: {in: [UserKernel, Container, ProcessSandbox]}}
        when_subject: {predicate: policy.minimum_isolation == MicroVm}
        error: weft.infrastructure.IsolationWeakened
      - name: weakened-from-user-kernel
        when: {policy.minimum_isolation: {in: [Container, ProcessSandbox]}}
        when_subject: {predicate: policy.minimum_isolation == UserKernel}
        error: weft.infrastructure.IsolationWeakened
      - name: weakened-from-container
        when: {policy.minimum_isolation: {in: [ProcessSandbox]}}
        when_subject: {predicate: policy.minimum_isolation == Container}
        error: weft.infrastructure.IsolationWeakened
      - name: set
        updates: weft.infrastructure.Cloud
        instance: cloud_id
        sets:
          policy: input.policy
        emits: [weft.infrastructure.CloudPolicySet]
        payload:
          weft.infrastructure.CloudPolicySet:
            cloud_id: input.cloud_id
            policy: input.policy

  # Sketch line 445.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:628
  - name: weft.infrastructure.DeclareZone
    naming:
      display: Declare a zone
    input:
      - {name: zone, type: weft.shared.ZoneName}
      - {name: cloud_id, type: weft.shared.CloudId}
    outcomes:
      - name: already-declared
        existing_instance: true
        error: weft.infrastructure.ZoneExists
      - name: unknown-cluster
        when_related: {via: input.cloud_id, exists: false}
        error: weft.infrastructure.UnknownCloud
      - name: declared
        creates: weft.infrastructure.Zone
        instance: zone
        sets:
          cloud_id: input.cloud_id
        emits: [weft.infrastructure.ZoneDeclared]
        payload:
          weft.infrastructure.ZoneDeclared:
            zone: input.zone
            cloud_id: input.cloud_id

  # Sketch line 445. A zone with a live node or an active node pool in it is not retired.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:653
  - name: weft.infrastructure.RetireZone
    naming:
      display: Retire a zone
    input:
      - {name: zone, type: weft.shared.ZoneName}
    outcomes:
      - name: no-such-zone
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: nodes-in-zone
        when_related:
          entity: weft.infrastructure.Node
          where:
            all:
              - zone == input.zone
              - state != Gone
          count: {gte: 1}
        error: weft.infrastructure.ZoneInUse
      - name: pools-in-zone
        when_related:
          entity: weft.infrastructure.NodePool
          where:
            all:
              - zone == input.zone
              - state == Active
          count: {gte: 1}
        error: weft.infrastructure.ZoneInUse
      - name: retired
        moves: weft.infrastructure.Zone.retire
        instance: zone
        emits: [weft.infrastructure.ZoneRetired]
        payload:
          weft.infrastructure.ZoneRetired:
            zone: input.zone
      - name: wrong-state
        wrong_state: true
        error: weft.infrastructure.StateConflict

  # Sketch line 444. A new pool is asked to hold its minimum size. Its cluster is its zone's.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:692
  - name: weft.infrastructure.CreateNodePool
    naming:
      display: Create a node pool
    input:
      - {name: name, type: String}
      - {name: zone, type: weft.shared.ZoneName}
      - {name: machine_type, type: String}
      - {name: image, type: String}
      - {name: min_size, type: Integer}
      - {name: max_size, type: Integer}
    outcomes:
      - name: negative-size
        when: min_size < 0
        error: weft.infrastructure.InvalidPoolSize
      - name: min-above-max
        when: min_size > max_size
        error: weft.infrastructure.InvalidPoolSize
      - name: unknown-zone
        when_related: {via: input.zone, exists: false}
        error: weft.infrastructure.UnknownZone
      - name: zone-retired
        when_related: {via: input.zone, predicate: state == Retired}
        error: weft.infrastructure.UnknownZone
      - name: created
        creates: weft.infrastructure.NodePool
        instance: node_pool_id
        sets:
          cloud_id: {related: {via: input.zone, field: cloud_id}}
          name: input.name
          zone: input.zone
          machine_type: input.machine_type
          image: input.image
          min_size: input.min_size
          max_size: input.max_size
          desired_size: input.min_size
        emits: [weft.infrastructure.NodePoolCreated]
        payload:
          weft.infrastructure.NodePoolCreated:
            node_pool_id: {generated: true}
            cloud_id: {related: {via: input.zone, field: cloud_id}}
            name: input.name
            zone: input.zone
            machine_type: input.machine_type
            image: input.image
            min_size: input.min_size
            max_size: input.max_size

  # Sketch line 444: the template's machine type, image and bounds. Nodes already made keep the
  # machine they were made with.
  # OPEN: whether a changed machine type or image replaces the pool's existing nodes (a rolling
  # replacement) or applies to new nodes only; taken as new nodes only.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:759
  - name: weft.infrastructure.UpdateNodePool
    naming:
      display: Update a node pool
    input:
      - {name: node_pool_id, type: weft.shared.NodePoolId}
      - {name: machine_type, type: String}
      - {name: image, type: String}
      - {name: min_size, type: Integer}
      - {name: max_size, type: Integer}
    outcomes:
      - name: negative-size
        when: min_size < 0
        error: weft.infrastructure.InvalidPoolSize
      - name: min-above-max
        when: min_size > max_size
        error: weft.infrastructure.InvalidPoolSize
      - name: no-such-pool
        unknown_instance: true
        error: weft.infrastructure.NotFound
      # Only an active pool is measured against its bounds; a deleted one answers not-active.
      - name: excludes-desired
        when_subject:
          predicate:
            all:
              - state == Active
              - any:
                  - desired_size < input.min_size
                  - desired_size > input.max_size
        error: weft.infrastructure.InvalidPoolSize
      - name: updated
        when_subject_state: Active
        updates: weft.infrastructure.NodePool
        instance: node_pool_id
        sets:
          machine_type: input.machine_type
          image: input.image
          min_size: input.min_size
          max_size: input.max_size
        emits: [weft.infrastructure.NodePoolUpdated]
        payload:
          weft.infrastructure.NodePoolUpdated:
            node_pool_id: input.node_pool_id
            machine_type: input.machine_type
            image: input.image
            min_size: input.min_size
            max_size: input.max_size
      - name: not-active
        error: weft.infrastructure.StateConflict

  # Sketch line 453: "Scale up by asking a NodePool for a node". One node per request.
  # OPEN: §10 names the Scheduler as the asker; the brief gives this domain to the
  # ClusterOperator only. Which actors may request a scale-up is for the integrator.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:811
  - name: weft.infrastructure.RequestNodePoolScaleUp
    naming:
      display: Ask a node pool for one more node
    input:
      - {name: node_pool_id, type: weft.shared.NodePoolId}
    outcomes:
      - name: no-such-pool
        unknown_instance: true
        error: weft.infrastructure.NotFound
      # Only an active pool is at its maximum; a deleted one answers not-active.
      - name: at-max-size
        when_subject: {predicate: {all: [state == Active, desired_size >= max_size]}}
        error: weft.infrastructure.PoolAtMaxSize
      - name: requested
        when_subject_state: Active
        updates: weft.infrastructure.NodePool
        instance: node_pool_id
        sets:
          desired_size: {increment: 1}
        emits: [weft.infrastructure.NodePoolScaleUpRequested]
        payload:
          weft.infrastructure.NodePoolScaleUpRequested:
            node_pool_id: input.node_pool_id
            desired_size: {expr: "subject.desired_size + 1"}
      - name: not-active
        error: weft.infrastructure.StateConflict

  # Sketch line 453: "drain idle nodes". One node fewer per request; which node goes is the
  # drain of that node (DrainNode, RemoveNode).
  # OPEN: who picks the node to drain when a pool shrinks, and whether the request waits for it.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:841
  - name: weft.infrastructure.RequestNodePoolScaleDown
    naming:
      display: Ask a node pool for one node fewer
    input:
      - {name: node_pool_id, type: weft.shared.NodePoolId}
    outcomes:
      - name: no-such-pool
        unknown_instance: true
        error: weft.infrastructure.NotFound
      # Only an active pool is at its minimum; a deleted one answers not-active.
      - name: at-min-size
        when_subject: {predicate: {all: [state == Active, desired_size <= min_size]}}
        error: weft.infrastructure.PoolAtMinSize
      - name: requested
        when_subject_state: Active
        updates: weft.infrastructure.NodePool
        instance: node_pool_id
        sets:
          desired_size: {expr: "subject.desired_size - 1"}
        emits: [weft.infrastructure.NodePoolScaleDownRequested]
        payload:
          weft.infrastructure.NodePoolScaleDownRequested:
            node_pool_id: input.node_pool_id
            desired_size: {expr: "subject.desired_size - 1"}
      - name: not-active
        error: weft.infrastructure.StateConflict

  # Sketch line 462 ("drain idle nodes"), hardening pass 4: the whole pool drains before it is
  # deleted. It is asked for zero nodes (minimum and desired size 0), makes no new node
  # (ProvisionPoolNode `pool-draining`), and the ControlPlane's level steps on DrainingPoolNodes
  # and DrainingNodePools (ess/components.yaml) drain and remove each node, then delete it.
  # RequestNodePoolScaleDown could not do this: it stops at the pool's minimum and leaves the pool
  # making nodes.
  # OPEN: a Draining pool cannot go back to Active (a tenant re-adding the pool gets a new one).
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:875
  - name: weft.infrastructure.DrainNodePool
    naming:
      display: Drain a node pool
    input:
      - {name: node_pool_id, type: weft.shared.NodePoolId}
    outcomes:
      - name: no-such-pool
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: draining
        moves: weft.infrastructure.NodePool.drain
        instance: node_pool_id
        sets:
          min_size: 0
          desired_size: 0
        emits: [weft.infrastructure.NodePoolDrainStarted]
        payload:
          weft.infrastructure.NodePoolDrainStarted:
            node_pool_id: input.node_pool_id
      - name: wrong-state
        wrong_state: true
        error: weft.infrastructure.StateConflict

  # Sketch line 444. A pool with a node that is not gone is not deleted.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:899
  - name: weft.infrastructure.DeleteNodePool
    naming:
      display: Delete a node pool
    input:
      - {name: node_pool_id, type: weft.shared.NodePoolId}
    outcomes:
      - name: no-such-pool
        unknown_instance: true
        error: weft.infrastructure.NotFound
      # A node without a pool (ProvisionNode) is in no pool: `defined` makes its row not match,
      # where the bare comparison with an absent `node_pool_id` would leave it unknown.
      - name: pool-has-nodes
        when_related:
          entity: weft.infrastructure.Node
          where:
            all:
              - defined(node_pool_id)
              - node_pool_id == input.node_pool_id
              - state != Gone
          count: {gte: 1}
        error: weft.infrastructure.PoolHasNodes
      - name: deleted
        moves: weft.infrastructure.NodePool.delete
        instance: node_pool_id
        emits: [weft.infrastructure.NodePoolDeleted]
        payload:
          weft.infrastructure.NodePoolDeleted:
            node_pool_id: input.node_pool_id
      - name: wrong-state
        wrong_state: true
        error: weft.infrastructure.StateConflict

  # Sketch lines 441-443 (Node, provisioning) and 462-463 (the node dials out). The operator
  # records a machine it brought itself (a host on `hosts`, line 579) and receives its join token
  # once. The node's cluster is its zone's.
  # OPEN: the 24-hour bound on a join token's lifetime is this draft's choice.
  # OPEN: whether a local cluster refuses a second node (line 578: one process is control plane
  # and worker).
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:937
  - name: weft.infrastructure.ProvisionNode
    naming:
      display: Provision a node
    input:
      - {name: zone, type: weft.shared.ZoneName}
      - {name: role, type: weft.infrastructure.NodeRole}
      - {name: join_token_expires_at, type: Timestamp}
    response:
      - {name: node_id, type: weft.shared.NodeId}
      - {name: join_token, type: String}
    outcomes:
      - name: expiry-not-future
        when: join_token_expires_at <= now
        error: weft.infrastructure.InvalidTokenExpiry
      - name: expiry-too-far
        when: join_token_expires_at > now + 24h
        error: weft.infrastructure.InvalidTokenExpiry
      - name: unknown-zone
        when_related: {via: input.zone, exists: false}
        error: weft.infrastructure.UnknownZone
      - name: zone-retired
        when_related: {via: input.zone, predicate: state == Retired}
        error: weft.infrastructure.UnknownZone
      - name: provisioned
        creates: weft.infrastructure.Node
        instance: node_id
        returns: true
        one_time_response: [join_token]
        sets:
          cloud_id: {related: {via: input.zone, field: cloud_id}}
          zone: input.zone
          node_pool_id: {cleared: true}
          role: input.role
          join_token_expires_at: input.join_token_expires_at
          join_token_used: false
          capacity: {cleared: true}
          isolation_facts: {cleared: true}
          observed_at: {cleared: true}
        emits: [weft.infrastructure.NodeProvisioned]
        payload:
          weft.infrastructure.NodeProvisioned:
            node_id: {response: node_id}
            cloud_id: {related: {via: input.zone, field: cloud_id}}
            zone: input.zone
            role: input.role
            join_token_expires_at: input.join_token_expires_at

  # Sketch line 444 (a pool is a template for nodes) and line 453 (a pool is asked for a node).
  # The pool's provider records the machine it made; the node takes the pool's cluster and zone
  # and the role Worker (see the OPEN on NodePool).
  # OPEN: whether a pool node is refused while the pool already holds its desired size of nodes
  # that are not gone (a count compared with a field of another row is not expressible here).
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:989
  - name: weft.infrastructure.ProvisionPoolNode
    naming:
      display: Provision a node of a node pool
    input:
      - {name: node_pool_id, type: weft.shared.NodePoolId}
      - {name: join_token_expires_at, type: Timestamp}
    response:
      - {name: node_id, type: weft.shared.NodeId}
      - {name: join_token, type: String}
    outcomes:
      - name: expiry-not-future
        when: join_token_expires_at <= now
        error: weft.infrastructure.InvalidTokenExpiry
      - name: expiry-too-far
        when: join_token_expires_at > now + 24h
        error: weft.infrastructure.InvalidTokenExpiry
      - name: unknown-pool
        when_related: {via: input.node_pool_id, exists: false}
        error: weft.infrastructure.UnknownNodePool
      - name: pool-deleted
        when_related: {via: input.node_pool_id, predicate: state == Deleted}
        error: weft.infrastructure.UnknownNodePool
      # Hardening pass 4: a draining pool makes no node, so its drain ends.
      - name: pool-draining
        when_related: {via: input.node_pool_id, predicate: state == Draining}
        error: weft.infrastructure.StateConflict
      - name: provisioned
        creates: weft.infrastructure.Node
        instance: node_id
        returns: true
        one_time_response: [join_token]
        sets:
          cloud_id: {related: {via: input.node_pool_id, field: cloud_id}}
          zone: {related: {via: input.node_pool_id, field: zone}}
          node_pool_id: input.node_pool_id
          role: Worker
          join_token_expires_at: input.join_token_expires_at
          join_token_used: false
          capacity: {cleared: true}
          isolation_facts: {cleared: true}
          observed_at: {cleared: true}
        emits: [weft.infrastructure.PoolNodeProvisioned]
        payload:
          weft.infrastructure.PoolNodeProvisioned:
            node_id: {response: node_id}
            cloud_id: {related: {via: input.node_pool_id, field: cloud_id}}
            zone: {related: {via: input.node_pool_id, field: zone}}
            node_pool_id: input.node_pool_id
            join_token_expires_at: input.join_token_expires_at

  # Sketch lines 441-443: a provisioning node whose token expired gets a new one; the old one is
  # void. Returned once.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1041
  - name: weft.infrastructure.IssueJoinToken
    naming:
      display: Issue a node a new join token
    input:
      - {name: node_id, type: weft.shared.NodeId}
      - {name: join_token_expires_at, type: Timestamp}
    response:
      - {name: join_token, type: String}
    outcomes:
      - name: expiry-not-future
        when: join_token_expires_at <= now
        error: weft.infrastructure.InvalidTokenExpiry
      - name: expiry-too-far
        when: join_token_expires_at > now + 24h
        error: weft.infrastructure.InvalidTokenExpiry
      - name: no-such-node
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: issued
        when_subject_state: Provisioning
        updates: weft.infrastructure.Node
        instance: node_id
        returns: true
        one_time_response: [join_token]
        sets:
          join_token_expires_at: input.join_token_expires_at
          join_token_used: false
        emits: [weft.infrastructure.JoinTokenIssued]
        payload:
          weft.infrastructure.JoinTokenIssued:
            node_id: input.node_id
            join_token_expires_at: input.join_token_expires_at
      - name: not-provisioning
        error: weft.infrastructure.StateConflict

  # Sketch lines 441-443 (joining) and 462-463. The node agent presents the token once. The
  # token is checked before the row is read, so a caller without it learns nothing of the node.
  # OPEN: what the joining node presents beside the token to get its mutual-TLS client
  # certificate (a key or a certificate request), and who signs it.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1080
  - name: weft.infrastructure.JoinNode
    naming:
      display: Join a node
    input:
      - {name: node_id, type: weft.shared.NodeId}
      - {name: join_token, type: String}
    outcomes:
      - name: token-invalid
        external: the join token is not the one issued for the addressed node
        before_row: true
        error: weft.infrastructure.JoinTokenInvalid
      - name: no-such-node
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: token-used
        when_subject: {predicate: join_token_used == true}
        error: weft.infrastructure.JoinTokenUsed
      - name: token-expired
        when_subject: {predicate: join_token_expires_at <= now}
        error: weft.infrastructure.JoinTokenExpired
      - name: joined
        moves: weft.infrastructure.Node.join
        instance: node_id
        sets:
          join_token_used: true
        emits: [weft.infrastructure.NodeJoined]
        payload:
          weft.infrastructure.NodeJoined:
            node_id: input.node_id
      - name: wrong-state
        wrong_state: true
        error: weft.infrastructure.StateConflict

  # Sketch lines 442-443 (Capacity, observed IsolationFacts), line 468 ("reports what it
  # observed"). Only the node's own agent reports; the first report makes a joining node Ready.
  # OPEN: whether a report older than the stored `observed_at` is refused as stale.
  # OPEN: whether the nodes domain's NodeObserved (line 466) issues this command, or this domain
  # reads that record.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1118
  - name: weft.infrastructure.RecordNodeObservation
    naming:
      display: Record what a node observed
    input:
      - {name: node_id, type: weft.shared.NodeId}
      - {name: capacity, type: List<weft.shared.ResourceAmount>}
      - {name: isolation_facts, type: weft.shared.IsolationFacts}
      - {name: observed_at, type: Timestamp}
    outcomes:
      - name: foreign-node
        external: the calling node agent's session is not the addressed node's
        before_row: true
        error: weft.infrastructure.ForeignNode
      - name: no-such-node
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: ready
        when_subject_state: Joining
        moves: weft.infrastructure.Node.become_ready
        instance: node_id
        sets:
          capacity: input.capacity
          isolation_facts: input.isolation_facts
          observed_at: input.observed_at
        emits: [weft.infrastructure.NodeReady]
        payload:
          weft.infrastructure.NodeReady:
            node_id: input.node_id
            capacity: input.capacity
            isolation_facts: input.isolation_facts
            observed_at: input.observed_at
      - name: observed
        when_subject_state: [Ready, Cordoned, Draining]
        updates: weft.infrastructure.Node
        instance: node_id
        sets:
          capacity: input.capacity
          isolation_facts: input.isolation_facts
          observed_at: input.observed_at
        emits: [weft.infrastructure.NodeObserved]
        payload:
          weft.infrastructure.NodeObserved:
            node_id: input.node_id
            capacity: input.capacity
            isolation_facts: input.isolation_facts
            observed_at: input.observed_at
      - name: not-joined
        error: weft.infrastructure.NodeNotJoined

  # Sketch line 441 (cordoned): no new instance is placed on it.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1168
  - name: weft.infrastructure.CordonNode
    naming:
      display: Cordon a node
    input:
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-node
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: cordoned
        moves: weft.infrastructure.Node.cordon
        instance: node_id
        emits: [weft.infrastructure.NodeCordoned]
        payload:
          weft.infrastructure.NodeCordoned:
            node_id: input.node_id
      - name: wrong-state
        wrong_state: true
        error: weft.infrastructure.StateConflict

  # Sketch line 441 (cordoned back to ready).
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1189
  - name: weft.infrastructure.UncordonNode
    naming:
      display: Uncordon a node
    input:
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-node
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: uncordoned
        moves: weft.infrastructure.Node.uncordon
        instance: node_id
        emits: [weft.infrastructure.NodeUncordoned]
        payload:
          weft.infrastructure.NodeUncordoned:
            node_id: input.node_id
      - name: wrong-state
        wrong_state: true
        error: weft.infrastructure.StateConflict

  # Sketch line 441 (draining), line 453 ("drain idle nodes"), line 297 (a DisruptionBudget bounds
  # a drain; the workloads domain holds it).
  # OPEN: whether draining the last node of role control or both is refused while the control
  # plane needs it.
  # OPEN: §10 names the Scheduler as draining idle nodes; the brief gives this domain to the
  # ClusterOperator only.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1215
  - name: weft.infrastructure.DrainNode
    naming:
      display: Drain a node
    input:
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-node
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: draining
        moves: weft.infrastructure.Node.drain
        instance: node_id
        emits: [weft.infrastructure.NodeDrainStarted]
        payload:
          weft.infrastructure.NodeDrainStarted:
            node_id: input.node_id
      - name: wrong-state
        wrong_state: true
        error: weft.infrastructure.StateConflict

  # Sketch line 441 (gone). A draining node goes only once no instance is assigned to it; the
  # assignments are the nodes domain's, so that is asked of the implementation.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1237
  - name: weft.infrastructure.RemoveNode
    naming:
      display: Remove a node
    input:
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-node
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: not-empty
        external: an instance is still assigned to the draining node
        when_subject: {predicate: state == Draining}
        error: weft.infrastructure.NodeNotEmpty
      - name: removed
        moves: weft.infrastructure.Node.remove
        instance: node_id
        emits: [weft.infrastructure.NodeGone]
        payload:
          weft.infrastructure.NodeGone:
            node_id: input.node_id
      - name: wrong-state
        wrong_state: true
        error: weft.infrastructure.StateConflict

  # Sketch line 459 (§10 `Priority`). ClusterOperator.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1262
  - name: weft.infrastructure.DefinePriorityClass
    naming:
      display: Define a priority class
    input:
      - {name: name, type: weft.shared.PriorityClassName}
      - {name: value, type: Integer}
      - {name: preempts, type: Boolean}
      - {name: preemptible, type: Boolean}
      - {name: grace_seconds, type: Integer}
    outcomes:
      - name: negative-grace
        when: grace_seconds < 0
        error: weft.infrastructure.InvalidGracePeriod
      - name: exists
        when_related:
          entity: weft.infrastructure.PriorityClass
          where: name == input.name
          exists: true
        error: weft.infrastructure.PriorityClassExists
      - name: defined
        creates: weft.infrastructure.PriorityClass
        instance: name
        sets:
          value: input.value
          preempts: input.preempts
          preemptible: input.preemptible
          grace_seconds: input.grace_seconds
        emits: [weft.infrastructure.PriorityClassDefined]
        payload:
          weft.infrastructure.PriorityClassDefined:
            name: input.name
            value: input.value
            preempts: input.preempts
            preemptible: input.preemptible
            grace_seconds: input.grace_seconds

  # Sketch line 459 (§10 `Priority`). ClusterOperator. A retired class takes no new scheduling
  # request (weft.scheduling.SubmitSchedulingRequest refuses it); placements made under it keep
  # their copied value.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1301
  - name: weft.infrastructure.RetirePriorityClass
    naming:
      display: Retire a priority class
    input:
      - {name: name, type: weft.shared.PriorityClassName}
    outcomes:
      - name: no-such-class
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: retired
        moves: weft.infrastructure.PriorityClass.retire
        instance: name
        emits: [weft.infrastructure.PriorityClassRetired]
        payload:
          weft.infrastructure.PriorityClassRetired:
            name: input.name
      - name: wrong-state
        wrong_state: true
        error: weft.infrastructure.StateConflict

views:
  # Sketch line 438. Every field and the state, unfiltered, so guards and invariants are observed.
  # weft@6798e7d:ess/1-infrastructure/infrastructure.yaml:1323
  - name: weft.infrastructure.Clouds
    source: weft.infrastructure.Cloud
    consistency: read_your_writes
    fields:
      - {name: cloud_id, type: weft.shared.CloudId}
      - {name: name, type: String}
      - {name: placement, type: weft.infrastructure.Placement}
      - {name: policy, type: weft.infrastructure.CloudPolicy}
      - {name: state, type: weft.infrastructure.Cloud.State}

  # Sketch line 445.
