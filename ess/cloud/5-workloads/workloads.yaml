views:
  # Brief focus "Runtime with its minimum isolation".
  # weft@6798e7d:ess/4-applications/workloads.yaml:6018
  - name: weft.workloads.RuntimeList
    source: weft.workloads.Runtime
    consistency: read_your_writes
    fields:
      - {name: runtime_id, type: weft.shared.RuntimeId}
      - {name: name, type: String}
      - {name: version, type: String}
      - {name: package_kinds, type: List<weft.workloads.PackageKind>}
      - {name: minimum_isolation, type: weft.shared.IsolationLevel}
      - {name: state, type: weft.workloads.Runtime.State}

  # Sketch section 4: the workloads of a formation.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6030
  - name: weft.workloads.WorkloadList
    source: weft.workloads.Workload
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: package_kind, type: weft.workloads.PackageKind}
      - {name: shape, type: weft.workloads.ShapeKind}
      - {name: isolation, type: weft.shared.IsolationLevel}
      - {name: state, type: weft.workloads.Workload.State}

  # Sketch section 4: one workload on all three axes.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6048
  - name: weft.workloads.WorkloadDetail
    source: weft.workloads.Workload
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: formation_revision_id, type: weft.shared.FormationRevisionId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: package_kind, type: weft.workloads.PackageKind}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: runtime_id, type: weft.shared.RuntimeId}
      - {name: isolation, type: weft.shared.IsolationLevel}
      - {name: shape, type: weft.workloads.ShapeKind}
      - {name: settings, type: weft.workloads.ShapeSettings}
      - {name: claims, type: List<weft.workloads.ClaimRequest>}
      - {name: processes, type: List<weft.workloads.Process>}
      - {name: restart_policy, type: weft.workloads.RestartPolicy}
      - {name: state, type: weft.workloads.Workload.State}

  # Sketch lines 246-247 and 292-293: a Service with its ServiceState.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6234
  - name: weft.workloads.ServiceDetail
    source: weft.workloads.Service
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: replicas, type: Integer}
      - {name: running_replicas, type: Integer}
      - {name: backoff_until, type: Optional<Timestamp>}
      - {name: scale_rule, type: weft.workloads.ScaleRule}
      - {name: disruption_budget, type: Optional<weft.workloads.DisruptionBudget>}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: wake_deadline, type: Optional<weft.workloads.WakeDeadline>}
      - {name: sleep_snapshots, type: List<weft.shared.SnapshotId>}
      - {name: state, type: weft.workloads.Service.State}

  # The invariants and the guards read these: every service in every state.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6255
  - name: weft.workloads.Services
    source: weft.workloads.Service
    consistency: read_your_writes
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: replicas, type: Integer}
      - {name: running_replicas, type: Integer}
      - {name: backoff_until, type: Optional<Timestamp>}
      - {name: scale_rule, type: weft.workloads.ScaleRule}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: wake_deadline, type: Optional<weft.workloads.WakeDeadline>}
      - {name: state, type: weft.workloads.Service.State}

  # Section 14 R1 (line 585) and R8 (line 592), level form (lines 595-599): the gap view. Every
  # awake or waking service with fewer live instances than its replica count and no backoff
  # running; the controller runs RequestReplica once per row.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6273
  - name: weft.workloads.ServicesBelowScale
    source: weft.workloads.Service
    consistency: read_your_writes
    filter:
      all:
        - running_replicas < replicas
        - not defined(backoff_until)
        - any: [state == Awake, state == Waking]
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: replicas, type: Integer}
      - {name: running_replicas, type: Integer}
      - {name: state, type: weft.workloads.Service.State}

  # Section 14, level form, the other side of the gap: a service scaled in (ScaleService,
  # AutoscaleService) or draining to sleep (BeginSleep sets its count to 0) holds more live
  # instances than its count. The controller stops one live instance of the row's workload
  # (StopInstance, desired Run in InstanceList) per row; its end lowers the count (R2 edge).
  # OPEN: which instance a scale-in stops (the highest replica index, as a Kubernetes
  # StatefulSet; or the newest). Smallest answer: the highest index.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6294
  - name: weft.workloads.ServicesAboveScale
    source: weft.workloads.Service
    consistency: read_your_writes
    filter: running_replicas > replicas
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: replicas, type: Integer}
      - {name: running_replicas, type: Integer}
      - {name: state, type: weft.workloads.Service.State}

  # Section 14 R2 (line 586), time form (lines 600-602): services whose backoff instant passed;
  # the controller runs EndReplicaBackoff once per row.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6307
  - name: weft.workloads.ServiceBackoffsDue
    source: weft.workloads.Service
    consistency: read_your_writes
    filter:
      all:
        - defined(backoff_until)
        - backoff_until <= now
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: backoff_until, type: Optional<Timestamp>}
      - {name: state, type: weft.workloads.Service.State}

  # Sketch lines 286-289: the wakes of a service and how each ended.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6321
  - name: weft.workloads.WakeList
    source: weft.workloads.Wake
    consistency: read_your_writes
    params:
      - {name: service_id, type: weft.shared.ServiceId}
    filter: service_id == param.service_id
    fields:
      - {name: wake_id, type: weft.shared.WakeId}
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: source, type: weft.workloads.WakeSource}
      - {name: deadline_at, type: Timestamp}
      - {name: failure, type: Optional<weft.workloads.WakeFailure>}
      - {name: state, type: weft.workloads.Wake.State}

  # Section 14 R8 (line 592), time form (lines 600-602): held wakes past their deadline; the
  # controller runs MissWake once per row, whose guard refuses a wake before its deadline.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6337
  - name: weft.workloads.WakesOverdue
    source: weft.workloads.Wake
    consistency: read_your_writes
    filter:
      all:
        - state == Waiting
        - deadline_at < now
    fields:
      - {name: wake_id, type: weft.shared.WakeId}
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: deadline_at, type: Timestamp}
      - {name: state, type: weft.workloads.Wake.State}

  # Sketch line 243: one invocation and its result.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6351
  - name: weft.workloads.InvocationDetail
    source: weft.workloads.Invocation
    consistency: read_your_writes
    params:
      - {name: invocation_id, type: weft.shared.InvocationId}
    filter: invocation_id == param.invocation_id
    fields:
      - {name: invocation_id, type: weft.shared.InvocationId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: deadline_at, type: Timestamp}
      - {name: result, type: Optional<Bytes>}
      - {name: failure, type: Optional<String>}
      - {name: instance_id, type: Optional<weft.shared.InstanceId>}
      - {name: schedule_id, type: Optional<weft.shared.ScheduleId>}
      - {name: trigger_id, type: Optional<weft.shared.TriggerId>}
      - {name: state, type: weft.workloads.Invocation.State}

  # Guards read deadline_at: every invocation in every state.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6369
  - name: weft.workloads.Invocations
    source: weft.workloads.Invocation
    consistency: read_your_writes
    fields:
      - {name: invocation_id, type: weft.shared.InvocationId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: deadline_at, type: Timestamp}
      - {name: state, type: weft.workloads.Invocation.State}

  # Sketch lines 244-245: the jobs of a workload.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6379
  - name: weft.workloads.JobList
    source: weft.workloads.Job
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: job_id, type: weft.shared.JobId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: parallelism, type: Integer}
      - {name: gang, type: Boolean}
      - {name: max_retries, type: Integer}
      - {name: retries_used, type: Integer}
      - {name: succeeded_tasks, type: Integer}
      - {name: outputs, type: List<weft.shared.ArtifactDigest>}
      - {name: failure, type: Optional<String>}
      - {name: schedule_id, type: Optional<weft.shared.ScheduleId>}
      - {name: state, type: weft.workloads.Job.State}

  # Invariants and guards read these: every job in every state.
  # weft@6798e7d:ess/4-applications/workloads.yaml:6399
  - name: weft.workloads.Jobs
    source: weft.workloads.Job
