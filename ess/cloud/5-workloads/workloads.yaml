  # Sketch lines 248-249: a Box of a Box-shaped workload, package image or machine (checked by
  # DefineWorkload). A Box is a virtual machine: a workload under any isolation but MicroVm is
  # refused. A box past a quota is refused by name (outcome group `quota`).
  # weft@6798e7d:ess/4-applications/workloads.yaml:4777
  - name: weft.workloads.CreateBox
    naming:
      display: Create a box
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      # Isolation pass 2: the account the request acts in, so the workload can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: size, type: weft.workloads.BoxSize}
      - {name: volume_id, type: Optional<weft.shared.VolumeId>}
      - {name: endpoint_id, type: Optional<weft.shared.EndpointId>}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing workload (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.workloads.WorkloadNotFound
      - name: bad-size
        when:
          any:
            - size.cpus < 1
            - size.memory_mib < 1
            - size.gpus < 0
        error: weft.workloads.InvalidAmount
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      # hardening pass 1 W2: the box mounts only a volume of its workload's account; another
      # account's volume answers like a missing one.
      - name: volume-missing
        when_related: {via: input.volume_id, exists: false}
        error: weft.workloads.NotFound
      # hardening pass 1 W3: the box is reached only through an endpoint of its workload's
      # formation; another formation's endpoint answers like a missing one.
      - name: endpoint-missing
        when_related: {via: input.endpoint_id, exists: false}
        error: weft.workloads.NotFound
      # Isolation pass 2: a workload of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: workload-of-other-scope
        when_related: {via: input.workload_id, predicate: scope_id != input.scope_id}
        error: weft.workloads.WorkloadNotFound
      # hardening pass 1 W2, W3: the ties, after every existence check (ESS precedence).
      - name: volume-foreign
        when: defined(volume_id)
        when_related:
          entity: weft.resources.Volume
          where:
            all:
              - volume_id == input.volume_id
              - not:
                  exists:
                    as: w
                    in: {entity: weft.workloads.Workload}
                    that: {all: [{w.scope_id: {eq: {fact: scope_id}}}, w.workload_id == input.workload_id]}
          exists: true
        error: weft.workloads.NotFound
      - name: endpoint-foreign
        when: defined(endpoint_id)
        when_related:
          entity: weft.edge.Endpoint
          where:
            all:
              - endpoint_id == input.endpoint_id
              - not:
                  exists:
                    as: w
                    in: {entity: weft.workloads.Workload}
                    that: {all: [{w.formation_id: {eq: {fact: formation_id}}}, w.workload_id == input.workload_id]}
          exists: true
        error: weft.workloads.NotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: not-a-box
        when_related: {via: input.workload_id, predicate: shape != Box}
        error: weft.workloads.ShapeMismatch
      - name: not-a-vm
        when_related: {via: input.workload_id, predicate: isolation != MicroVm}
        error: weft.workloads.IsolationBelowMinimum
      - name: created
        creates: weft.workloads.Box
        instance: box_id
        sets:
          workload_id: input.workload_id
          scope_id: {related: {via: input.workload_id, field: scope_id}}
          size: input.size
          volume_id: input.volume_id
          endpoint_id: input.endpoint_id
          cordoned: false
        emits: [weft.workloads.BoxCreated]
        payload:
          weft.workloads.BoxCreated:
            box_id: {generated: true}
            workload_id: input.workload_id
            size: input.size

  # Sketch line 250 "The user starts" a box. Refused while another caller holds a live lease
