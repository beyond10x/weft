  # Sketch lines 244-245; a Schedule's workload starts Jobs too (line 257). A job past a quota is
  # refused by name (outcome group `quota`).
  # weft@6798e7d:ess/4-applications/workloads.yaml:4516
  - name: weft.workloads.SubmitJob
    naming:
      display: Submit a job
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      # Isolation pass 2: the account the request acts in, so the workload can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: parallelism, type: Integer}
      - {name: gang, type: Boolean}
      - {name: max_retries, type: Integer}
      - {name: schedule_id, type: Optional<weft.shared.ScheduleId>}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing workload (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.workloads.WorkloadNotFound
      - name: bad-counts
        when:
          any:
            - parallelism < 1
            - max_retries < 0
        error: weft.workloads.InvalidAmount
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      # hardening pass 1 W6: the schedule a job names as its cause is one of the same workload.
      - name: schedule-missing
        when_related: {via: input.schedule_id, exists: false}
        error: weft.workloads.NotFound
      # Isolation pass 2: a workload of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: workload-of-other-scope
        when_related: {via: input.workload_id, predicate: scope_id != input.scope_id}
        error: weft.workloads.WorkloadNotFound
      - name: schedule-of-other-workload
        when_related: {via: input.schedule_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: not-a-job
        when_related:
          via: input.workload_id
          predicate:
            shape: {none_of: [Job, Schedule]}
        error: weft.workloads.ShapeMismatch
      - name: submitted
        creates: weft.workloads.Job
        instance: job_id
        sets:
          workload_id: input.workload_id
          scope_id: {related: {via: input.workload_id, field: scope_id}}
          parallelism: input.parallelism
          gang: input.gang
          max_retries: input.max_retries
          retries_used: 0
          succeeded_tasks: 0
          outputs: []
          schedule_id: input.schedule_id
        emits: [weft.workloads.JobSubmitted]
        payload:
          weft.workloads.JobSubmitted:
            job_id: {generated: true}
            workload_id: input.workload_id
            parallelism: input.parallelism
            gang: input.gang

  # Sketch line 245 and section 10 line 453: a gang starts with all N tasks bound, or not at all.
