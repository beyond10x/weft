          weft.workloads.SnapshotDeleted:
            snapshot_id: input.snapshot_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 260 "WarmPool"; one per workload. A Box is one machine its user owns and a Daemon
  # runs one instance per node, so neither has a pool. A pool past a quota is refused by name
  # (outcome group `quota`).
  # OPEN: whether a warm instance holds its secrets and identity before it serves (section 7 line
  # "a value reaches an instance only at start"). Smallest answer: it starts like any instance, so
  # it holds them.
  # weft@6798e7d:ess/4-applications/workloads.yaml:5905
  - name: weft.workloads.CreateWarmPool
    naming:
      display: Create a warm pool
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      # Isolation pass 2: the account the request acts in, so the workload can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: size, type: Integer}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing workload (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.workloads.WorkloadNotFound
      - name: negative-size
        when: size < 0
        error: weft.workloads.InvalidAmount
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      # Isolation pass 2: a workload of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: workload-of-other-scope
        when_related: {via: input.workload_id, predicate: scope_id != input.scope_id}
        error: weft.workloads.WorkloadNotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: no-pool-shape
        when_related:
          via: input.workload_id
          predicate:
            shape: [Box, Daemon]
        error: weft.workloads.ShapeMismatch
      - name: exists
        when_related:
          entity: weft.workloads.WarmPool
          where: {all: ["workload_id == input.workload_id", "state == Active"]}
          exists: true
        error: weft.workloads.WarmPoolExists
      - name: created
        creates: weft.workloads.WarmPool
        instance: warm_pool_id
        sets:
          workload_id: input.workload_id
          scope_id: {related: {via: input.workload_id, field: scope_id}}
          size: input.size
        emits: [weft.workloads.WarmPoolCreated]
        payload:
          weft.workloads.WarmPoolCreated:
            warm_pool_id: {generated: true}
            workload_id: input.workload_id
            size: input.size

  # weft@6798e7d:ess/4-applications/workloads.yaml:5960
  - name: weft.workloads.ResizeWarmPool
    naming:
      display: Resize a warm pool
    input:
      - {name: warm_pool_id, type: weft.shared.WarmPoolId}
      - {name: size, type: Integer}
    outcomes:
      - name: negative-size
        when: size < 0
        error: weft.workloads.InvalidAmount
      - name: no-such-pool
        unknown_instance: true
        error: weft.workloads.NotFound
      # Isolation pass 2: only the pool's own account acts on it; another account's pool
      # answers like a missing one, before its state is read.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.workloads.NotFound
      - name: resized
        when_subject_state: Active
        updates: weft.workloads.WarmPool
        instance: warm_pool_id
        sets:
          size: input.size
        emits: [weft.workloads.WarmPoolResized]
        payload:
          weft.workloads.WarmPoolResized:
            warm_pool_id: input.warm_pool_id
            size: input.size
      - name: deleted
        error: weft.workloads.StateConflict

  # weft@6798e7d:ess/4-applications/workloads.yaml:5992
  - name: weft.workloads.DeleteWarmPool
    naming:
      display: Delete a warm pool
    input:
      - {name: warm_pool_id, type: weft.shared.WarmPoolId}
    outcomes:
      - name: no-such-pool
        unknown_instance: true
        error: weft.workloads.NotFound
      # Isolation pass 2: only the pool's own account acts on it; another account's pool
      # answers like a missing one, before its state is read.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.workloads.NotFound
      - name: deleted
