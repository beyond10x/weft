        when: kind == Http
        error: weft.workloads.NotOnBorder
      - name: created
        creates: weft.workloads.Trigger
        instance: trigger_id
        sets:
          workload_id: input.workload_id
          scope_id: {related: {via: input.workload_id, field: scope_id}}
          kind: input.kind
          source: input.source
        emits: [weft.workloads.TriggerCreated]
