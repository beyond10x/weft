  - name: weft.workloads.StartJob
    naming:
      display: Start a job
    input:
      - {name: job_id, type: weft.shared.JobId}
      - {name: bound_tasks, type: Integer}
    outcomes:
      - name: none-bound
        when: bound_tasks < 1
        error: weft.workloads.InvalidAmount
      - name: no-such-job
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: gang-incomplete
        when_subject:
          predicate:
            all:
              - gang == true
              - parallelism != input.bound_tasks
        error: weft.workloads.GangIncomplete
      - name: too-many
        when_subject: {predicate: parallelism < input.bound_tasks}
        error: weft.workloads.InvalidAmount
      - name: started
        moves: weft.workloads.Job.start
        instance: job_id
        emits: [weft.workloads.JobStarted]
        payload:
          weft.workloads.JobStarted:
            job_id: input.job_id
            bound_tasks: input.bound_tasks
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 245: a task of the array succeeded.
  # weft@6798e7d:ess/4-applications/workloads.yaml:4622
  - name: weft.workloads.RecordTaskSucceeded
    naming:
      display: Record a task succeeded
    input:
      - {name: job_id, type: weft.shared.JobId}
      - {name: task_index, type: Integer}
    outcomes:
      - name: negative-index
        when: task_index < 0
        error: weft.workloads.InvalidAmount
      - name: no-such-job
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: index-out-of-range
        when_subject: {predicate: parallelism <= input.task_index}
        error: weft.workloads.InvalidAmount
      - name: recorded
        when_subject_state: Running
        updates: weft.workloads.Job
        instance: job_id
        sets:
          succeeded_tasks: {increment: 1}
        emits: [weft.workloads.TaskSucceeded]
        payload:
          weft.workloads.TaskSucceeded:
            job_id: input.job_id
            task_index: input.task_index
      - name: not-running
        error: weft.workloads.StateConflict

  # Sketch line 244: "retries". A retry past the job's limit is refused; the job then fails.
  # weft@6798e7d:ess/4-applications/workloads.yaml:4653
  - name: weft.workloads.RetryTask
    naming:
      display: Retry a task
    input:
      - {name: job_id, type: weft.shared.JobId}
      - {name: task_index, type: Integer}
      - {name: reason, type: String}
    outcomes:
      - name: negative-index
        when: task_index < 0
        error: weft.workloads.InvalidAmount
      - name: no-such-job
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: index-out-of-range
        when_subject: {predicate: parallelism <= input.task_index}
        error: weft.workloads.InvalidAmount
      - name: exhausted
        when_subject: {predicate: retries_used >= max_retries}
        error: weft.workloads.RetriesExhausted
      - name: retried
        when_subject_state: Running
        updates: weft.workloads.Job
        instance: job_id
        sets:
          retries_used: {increment: 1}
        emits: [weft.workloads.TaskRetried]
        payload:
          weft.workloads.TaskRetried:
            job_id: input.job_id
            task_index: input.task_index
            reason: input.reason
      - name: not-running
        error: weft.workloads.StateConflict

  # Sketch line 244: "runs to completion ... writes outputs". Every task succeeded; the outputs are
  # registered artifacts (sketch line 238: a training job writes a model Artifact).
  # weft@6798e7d:ess/4-applications/workloads.yaml:4690
  - name: weft.workloads.CompleteJob
    naming:
      display: Complete a job
    input:
      - {name: job_id, type: weft.shared.JobId}
      - {name: outputs, type: List<weft.shared.ArtifactDigest>}
    outcomes:
      - name: no-such-job
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: outstanding
        when_subject: {predicate: succeeded_tasks < parallelism}
        error: weft.workloads.TasksOutstanding
      # Every output is a row of weft.artifacts (layer 3), through the relation `output_artifacts`.
      - name: unknown-output
        when_related: {via: input.outputs, exists: false}
        error: weft.workloads.ArtifactNotFound
      # OPEN (hardening pass 1, CompleteJob): every output should be an artifact of the job's
      # workload's account. Not expressible in ess 0.99.2: the row-set guard over the outputs
      # cannot stand beside the `when_subject` guard `outstanding` in one command.
      - name: succeeded
        moves: weft.workloads.Job.succeed
        instance: job_id
        sets:
          outputs: input.outputs
        emits: [weft.workloads.JobSucceeded]
        payload:
          weft.workloads.JobSucceeded:
            job_id: input.job_id
            outputs: input.outputs
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

