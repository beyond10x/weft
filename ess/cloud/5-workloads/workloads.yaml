      display: Acquire a box lease
    input:
      - {name: box_id, type: weft.shared.BoxId}
      # hardening pass 1 D2: the lease holder is the caller, not a request input.
      - {name: lease_nonce, type: String}
      - {name: expires_at, type: Timestamp}
    outcomes:
      - name: expiry-past
        when: expires_at < now
        error: weft.workloads.DeadlineInPast
      - name: empty-nonce
        when: lease_nonce == ""
