views:
  # Section 3, `Formation`.
  # weft@6798e7d:ess/4-applications/formations.yaml:2453
  - name: weft.architecture.Formations
    source: weft.architecture.Formation
    consistency: read_your_writes
    params:
      - {name: scope_id, type: weft.shared.ScopeId}
    filter: scope_id == param.scope_id
    fields:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: name, type: weft.architecture.FormationName}
      - {name: internal_domain, type: String}
      - {name: quota_slice, type: List<weft.shared.ResourceAmount>}
      - {name: state, type: weft.architecture.Formation.State}

  # Section 3, `FormationRevision`: the revisions of one formation, for `weft.deployments` to pick from.
  # weft@6798e7d:ess/4-applications/formations.yaml:2473
  - name: weft.architecture.FormationRevisions
    source: weft.architecture.FormationRevision
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: revision_id, type: weft.shared.FormationRevisionId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: number, type: Integer}
      - {name: document_digest, type: weft.shared.ArtifactDigest}

  # Section 3, `Environment`.
  # weft@6798e7d:ess/4-applications/formations.yaml:2486
  - name: weft.architecture.Environments
    source: weft.architecture.Environment
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.architecture.EnvironmentName}
      - {name: quota_slice, type: List<weft.shared.ResourceAmount>}
      - {name: state, type: weft.architecture.Environment.State}

  # Formation topology (section 3 and its "Topology as data"): components, links and border. A view
  # reads one source entity, so the topology is the three views FormationComponents,
  # FormationLinks and FormationBorder, all filtered by the formation.
  # weft@6798e7d:ess/4-applications/formations.yaml:2502
  - name: weft.architecture.FormationComponents
    source: weft.architecture.Component
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.shared.ComponentName}
      - {name: internal_name, type: weft.architecture.InternalName}
      - {name: on_border, type: Boolean}

  # Topology: links, with both ends by name (the example's `links:`).
  # weft@6798e7d:ess/4-applications/formations.yaml:2516
  - name: weft.architecture.FormationLinks
    source: weft.architecture.Link
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: link_id, type: weft.shared.LinkId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: caller_component_id, type: weft.shared.ComponentId}
      - name: caller_name
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: caller_component_id, field: name}}
      - {name: target_component_id, type: weft.shared.ComponentId}
      - name: target_name
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: target_component_id, field: name}}
      - {name: protocol, type: weft.architecture.LinkProtocol}
      - {name: port, type: weft.edge.Port}

  # Reachability of a component, inside (section 3, `Link` and `InternalName`): every component that
  # may call it, on which protocol and port. No row, no reach.
  # weft@6798e7d:ess/4-applications/formations.yaml:2590
  - name: weft.architecture.ComponentCallers
    source: weft.architecture.Link
    consistency: read_your_writes
    params:
      - {name: component_id, type: weft.shared.ComponentId}
    filter: target_component_id == param.component_id
    fields:
      - {name: link_id, type: weft.shared.LinkId}
      - {name: caller_component_id, type: weft.shared.ComponentId}
      - name: caller_name
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: caller_component_id, field: name}}
      - {name: protocol, type: weft.architecture.LinkProtocol}
      - {name: port, type: weft.edge.Port}
  # cloudspec (layer rule): moved here from weft.edge with weft.architecture.Route.
  # Topology: the border's routes, with the endpoint's host and the component's name (section 3,
  # `Border`). The border's components are FormationComponents rows with `on_border`.
  # weft@6798e7d:ess/4-applications/formations.yaml:2538
  - name: weft.architecture.FormationBorder
    source: weft.architecture.Route
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: route_id, type: weft.shared.RouteId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - name: host
        type: Optional<weft.edge.Host>
        field: {related: {via: endpoint_id, field: host}}
      - {name: path, type: String}
      - {name: component_id, type: weft.shared.ComponentId}
      - name: component_name
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: component_id, field: name}}
      - {name: port, type: weft.edge.Port}

  # cloudspec (layer rule): moved here from weft.edge with weft.architecture.Route.
  # Reachability of a component, from outside (section 3, `Border`): every host and path
  # routed to it. No row, not reachable from outside.
  # weft@6798e7d:ess/4-applications/formations.yaml:2607
  - name: weft.architecture.ComponentRoutes
    source: weft.architecture.Route
    consistency: read_your_writes
    params:
      - {name: component_id, type: weft.shared.ComponentId}
    filter: component_id == param.component_id
    fields:
      - {name: route_id, type: weft.shared.RouteId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - name: host
        type: Optional<weft.edge.Host>
        field: {related: {via: endpoint_id, field: host}}
      - {name: path, type: String}
      - {name: port, type: weft.edge.Port}

  # Sketch section 4: the workloads of a formation (weft's workloads.WorkloadList by formation).
  # cloudspec (layer rule): the composition's record of which workload realizes which component in
  # which revision and environment; weft.workloads.WorkloadList lists the workloads of a scope.
  - name: weft.architecture.FormationWorkloads
    source: weft.architecture.ComponentWorkload
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: component_workload_id, type: weft.shared.ComponentWorkloadId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: formation_revision_id, type: weft.shared.FormationRevisionId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component_id, type: weft.shared.ComponentId}
      - name: component
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: component_id, field: name}}
      - {name: workload_id, type: weft.shared.WorkloadId}

  # Section 3, `Config`.
  # weft@6798e7d:ess/4-applications/formations.yaml:2623
  - name: weft.architecture.Configs
    source: weft.architecture.Config
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: config_id, type: weft.shared.ConfigId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.architecture.ConfigName}
      - {name: data, type: "Map<String, String>"}

  # Section 3, `Config`: which component mounts which config, and how.
  # weft@6798e7d:ess/4-applications/formations.yaml:2636
  - name: weft.architecture.ConfigMounts
    source: weft.architecture.ConfigMount
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: mount_id, type: weft.shared.ConfigMountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: config_id, type: weft.shared.ConfigId}
      - {name: kind, type: weft.architecture.MountKind}
      - {name: target, type: String}

  # Section 3, `Environment`: an environment's config values.
  # weft@6798e7d:ess/4-applications/formations.yaml:2651
  - name: weft.architecture.ConfigOverrides
    source: weft.architecture.ConfigOverride
    consistency: read_your_writes
    params:
      - {name: environment_id, type: weft.shared.EnvironmentId}
    filter: environment_id == param.environment_id
    fields:
      - {name: override_id, type: weft.shared.ConfigOverrideId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: config_id, type: weft.shared.ConfigId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: data, type: "Map<String, String>"}

  # Section 3, `Environment`: an environment's scale settings.
  # weft@6798e7d:ess/4-applications/formations.yaml:2665
  - name: weft.architecture.ScaleSettings
    source: weft.architecture.ScaleSetting
    consistency: read_your_writes
    params:
      - {name: environment_id, type: weft.shared.EnvironmentId}
    filter: environment_id == param.environment_id
    fields:
      - {name: scale_setting_id, type: weft.shared.ScaleSettingId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: min_replicas, type: Integer}
      - {name: max_replicas, type: Integer}
