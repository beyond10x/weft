    input:
      - {name: formation_id, type: weft.shared.FormationId}
      # Isolation pass 2: the account the request acts in, so the formation can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: component_id, type: weft.shared.ComponentId}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing formation (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      - name: unknown-component
        unknown_instance: true
        error: weft.architecture.NoSuchComponent
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.architecture.NoSuchComponent
      # Isolation pass 2: a formation of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchComponent
      - name: routed
        when_related:
          entity: weft.architecture.Route
          where: component_id == input.component_id
          exists: true
        error: weft.architecture.RoutesRemain
      - name: unbordered
        updates: weft.architecture.Component
        instance: component_id
        sets:
          on_border: false
        emits: [weft.architecture.ComponentUnbordered]
        payload:
          weft.architecture.ComponentUnbordered:
            component_id: input.component_id
            formation_id: input.formation_id

  # Section 3, `Link`; the example's `links:` (`gateway -> orders`). Allows the caller to
  # resolve and call the target on one protocol and port; nothing else is allowed between them.
  # Both components must be of this formation (a foreign component answers as not found, so its
  # existence is not disclosed).
  # OPEN: whether a link to a port the target's workload does not serve is refused here, or by
  # the simulation of `weft.deployments` (section 5 "Releases", `Simulation`). Taken: by the simulation.
  # weft@6798e7d:ess/4-applications/formations.yaml:1398
  - name: weft.architecture.AddLink
    naming:
      display: Allow a link
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      # Scope isolation (story blocks-scope-isolation): the scope the request acts in, so the
      # row can be tied to the caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: caller_component_id, type: weft.shared.ComponentId}
      - {name: target_component_id, type: weft.shared.ComponentId}
      - {name: protocol, type: weft.architecture.LinkProtocol}
      - {name: port, type: weft.edge.Port}
      - {name: data, type: Optional<weft.architecture.DataDirection>}
    outcomes:
      # Scope isolation: the scope must be the caller's; it reads no row and answers like a
      # missing row (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      - name: no-such-caller
        when_related: {via: input.caller_component_id, exists: false}
        error: weft.architecture.NoSuchComponent
      - name: no-such-target
        when_related: {via: input.target_component_id, exists: false}
        error: weft.architecture.NoSuchComponent
      # Scope isolation: a row of another scope answers like a missing one, after the existence
      # checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: foreign-caller
        when_related: {via: input.caller_component_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchComponent
      - name: foreign-target
        when_related: {via: input.target_component_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchComponent
      - name: exists
        when_related:
          entity: weft.architecture.Link
          where:
            all:
              - caller_component_id == input.caller_component_id
              - target_component_id == input.target_component_id
              - protocol == input.protocol
              - port == input.port
              - data == input.data
          exists: true
        error: weft.architecture.LinkExists
      - name: added
        creates: weft.architecture.Link
        instance: link_id
        sets:
          formation_id: input.formation_id
          caller_component_id: input.caller_component_id
          target_component_id: input.target_component_id
          protocol: input.protocol
          port: input.port
          data: input.data
        emits: [weft.architecture.LinkAdded]
        payload:
          weft.architecture.LinkAdded:
            link_id: {generated: true}
            formation_id: input.formation_id
            caller_component_id: input.caller_component_id
            target_component_id: input.target_component_id
            protocol: input.protocol
            port: input.port

  # Section 3, `Link`: "Components without a link cannot reach each other": removing the link
