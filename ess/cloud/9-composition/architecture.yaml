        error: weft.architecture.NoSuchFormation
      - name: bad-bounds
        when:
          any:
            - min_replicas < 0
            - max_replicas < 1
            - min_replicas > max_replicas
        error: weft.architecture.InvalidScaleBounds
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      - name: unknown-scale-setting
        unknown_instance: true
        error: weft.architecture.NoSuchScaleSetting
      - name: no-such-scale-setting
        when_related: {via: input.scale_setting_id, exists: false}
        error: weft.architecture.NoSuchScaleSetting
      # Isolation pass 2: a formation of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: foreign-scale-setting
        when_related: {via: input.scale_setting_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchScaleSetting
      - name: over-quota
        external: the maximum replicas times the component's claims exceed the environment's quota slice
        error: weft.architecture.QuotaExceeded
      - name: changed
        updates: weft.architecture.ScaleSetting
        instance: scale_setting_id
        sets:
          min_replicas: input.min_replicas
          max_replicas: input.max_replicas
        emits: [weft.architecture.ScaleChanged]
        payload:
          weft.architecture.ScaleChanged:
            scale_setting_id: input.scale_setting_id
            formation_id: input.formation_id
            min_replicas: input.min_replicas
            max_replicas: input.max_replicas

  # Section 3, `Environment`. Without a setting the component scales by its workload's own ScaleRule.
  # weft@6798e7d:ess/4-applications/formations.yaml:2407
  - name: weft.architecture.RemoveScale
    naming:
      display: Remove a component's scale in an environment
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      # Isolation pass 2: the account the request acts in, so the formation can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: scale_setting_id, type: weft.shared.ScaleSettingId}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing formation (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      - name: unknown-scale-setting
        unknown_instance: true
        error: weft.architecture.NoSuchScaleSetting
      - name: no-such-scale-setting
        when_related: {via: input.scale_setting_id, exists: false}
        error: weft.architecture.NoSuchScaleSetting
      # Isolation pass 2: a formation of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: foreign-scale-setting
        when_related: {via: input.scale_setting_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchScaleSetting
      - name: removed
