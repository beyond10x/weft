        error: weft.architecture.FormationStateConflict
      - name: foreign-route
        when_related: {via: input.route_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchRoute
      - name: removed
        deletes: weft.architecture.Route
        instance: route_id
        emits: [weft.architecture.RouteRemoved]
        payload:
          weft.architecture.RouteRemoved:
            route_id: input.route_id
            formation_id: input.formation_id

  # Sketch lines 205-211 and section 3: a workload is one of the formation's components, applied
  # to one environment at one revision. cloudspec (layer rule): the refusals of weft's
  # DefineWorkload that read the composition (a formation, environment or revision of another
  # scope or another formation, a component the formation does not have, a retired formation or
  # environment) move here; weft.workloads.DefineWorkload defines the workload in its scope, and
  # this command ties it to the component. A new revision assigns the workload that replaces the
  # old one.
  # OPEN: whether the workload's component name must equal the component's name; a guard here
  # reads one related row at a time, so the two names are not compared.
  - name: weft.architecture.AssignWorkload
    naming:
      display: Assign a workload to a component
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      # Isolation pass 2: the scope the request acts in, so the formation and the workload can be
      # tied to the caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: formation_revision_id, type: weft.shared.FormationRevisionId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: workload_id, type: weft.shared.WorkloadId}
    outcomes:
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      # hardening pass 1 W1 (weft's DefineWorkload): the formation, its environment and its
      # revision are the scope's, so a workload never joins another scope's formation. Missing and
      # foreign answer alike; every existence check answers before every predicate.
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      - name: no-such-environment
        when_related: {via: input.environment_id, exists: false}
        error: weft.architecture.NoSuchEnvironment
      - name: no-such-revision
        when_related: {via: input.formation_revision_id, exists: false}
        error: weft.architecture.NoSuchRevision
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.architecture.NoSuchComponent
      - name: no-such-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.architecture.NoSuchWorkload
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: environment-of-other-formation
        when_related: {via: input.environment_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchEnvironment
      - name: revision-of-other-formation
        when_related: {via: input.formation_revision_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchRevision
      - name: component-of-other-formation
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchComponent
      - name: workload-of-other-scope
        when_related: {via: input.workload_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchWorkload
      # A retired formation or environment takes no new workload (a retired formation takes no
      # edit and no commit). After the foreign checks, so another scope's state is not read.
      - name: formation-retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: environment-retired
        when_related: {via: input.environment_id, predicate: state == Retired}
        error: weft.architecture.EnvironmentStateConflict
      - name: already-assigned
        when_related:
          entity: weft.architecture.ComponentWorkload
          where:
            all:
              - formation_revision_id == input.formation_revision_id
              - environment_id == input.environment_id
              - component_id == input.component_id
          exists: true
        error: weft.architecture.WorkloadAlreadyAssigned
      - name: assigned
        creates: weft.architecture.ComponentWorkload
        instance: component_workload_id
        sets:
          formation_id: input.formation_id
          formation_revision_id: input.formation_revision_id
          environment_id: input.environment_id
          component_id: input.component_id
          workload_id: input.workload_id
        emits: [weft.architecture.WorkloadAssigned]
        payload:
          weft.architecture.WorkloadAssigned:
            component_workload_id: {generated: true}
            formation_id: input.formation_id
            formation_revision_id: input.formation_revision_id
            environment_id: input.environment_id
            component_id: input.component_id
            workload_id: input.workload_id

