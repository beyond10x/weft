commands:
  # Section 3, `Formation`. A new formation holds no component and an empty quota slice.
  # weft@6798e7d:ess/4-applications/formations.yaml:740
  - name: weft.architecture.CreateFormation
    naming:
      display: Create a formation
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: name, type: weft.architecture.FormationName}
      # Section 10 line 456, the formation's zone rules (see Formation.zones). Empty: any zone.
      - {name: zones, type: List<weft.shared.ZoneName>}
      # story:scope-parity (see Formation.parity). Empty: none.
      - {name: parity, type: List<weft.architecture.Parity>}
    outcomes:
      - name: no-such-scope
        external: the scope does not exist or is closed
        before_row: true
        error: weft.architecture.NoSuchScope
      # hardening pass 1 D3: the formation is created only in the account the request acts in;
      # another account answers as a missing one, so its existence is not disclosed.
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchScope
      - name: parity-form
        when:
          exists:
            in: parity
            as: x
            that:
              any:
                - x.scopes.count < 2
                - x.facts.count == 0
        error: weft.architecture.ParityForm
      - name: name-taken
        when_related:
          entity: weft.architecture.Formation
          where:
            all:
              - scope_id == input.scope_id
              - name == input.name
          exists: true
        error: weft.architecture.FormationNameTaken
      - name: created
        creates: weft.architecture.Formation
        instance: formation_id
        sets:
          scope_id: input.scope_id
          name: input.name
          internal_domain: {generated: true}
          quota_slice: []
          zones: input.zones
          parity: input.parity
        emits: [weft.architecture.FormationCreated]
        payload:
          weft.architecture.FormationCreated:
            formation_id: {generated: true}
            scope_id: input.scope_id
            name: input.name

  # Section 3, `Formation` "a quota slice"; section 1, `Quota`: "A child's quota is at most its
  # parent's remaining quota". The account's remaining quota is `weft.accounts`', so the check is
  # external.
  # weft@6798e7d:ess/4-applications/formations.yaml:807
  - name: weft.architecture.SetFormationQuota
    naming:
      display: Set a formation's quota slice
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: quota_slice, type: List<weft.shared.ResourceAmount>}
    outcomes:
      # Was the `amount >= 0` invariant of the local QuotaAmount type, before the shared
      # ResourceAmount replaced it.
      - name: negative-amount
        when:
          exists: {in: quota_slice, as: q, that: q.amount < 0}
        error: weft.architecture.NegativeQuotaAmount
      - name: no-such-formation
        unknown_instance: true
        error: weft.architecture.NoSuchFormation
      # hardening pass 1 D3: a formation of another account answers as a missing one, before its
      # state is read.
      - name: not-callers-formation
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_subject: {predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: over-quota
        external: the slice exceeds the scope's remaining quota of a resource class
        error: weft.architecture.QuotaExceeded
      - name: set
        updates: weft.architecture.Formation
        instance: formation_id
        sets:
          quota_slice: input.quota_slice
        emits: [weft.architecture.FormationQuotaSet]
        payload:
          weft.architecture.FormationQuotaSet:
            formation_id: input.formation_id
            quota_slice: input.quota_slice

  # OPEN: the sketch names no removal of a formation. Taken: retire, refused while any release of
  # it is live (`weft.deployments` decides, so the check is external).
  # weft@6798e7d:ess/4-applications/formations.yaml:847
  - name: weft.architecture.RetireFormation
    naming:
      display: Retire a formation
    input:
      - {name: formation_id, type: weft.shared.FormationId}
    outcomes:
      - name: no-such-formation
        unknown_instance: true
        error: weft.architecture.NoSuchFormation
      # hardening pass 1 D3: a formation of another account answers as a missing one, before its
      # releases or its state are read.
      - name: not-callers-formation
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: releases-live
        external: a release of this formation is live
        error: weft.architecture.ReleasesLive
      - name: retired
        moves: weft.architecture.Formation.retire
        instance: formation_id
        emits: [weft.architecture.FormationRetired]
        payload:
          weft.architecture.FormationRetired:
            formation_id: input.formation_id
      - name: wrong-state
        wrong_state: true
        error: weft.architecture.FormationStateConflict

  # Section 3, `FormationRevision`, and "Topology as data": "an edit and a new revision": freeze the formation's current
  # document. A translation of section 5 "Translation" commits through this command and records
  # the revision id on its own row.
  # OPEN: whether a commit with no change since the last revision records a second revision.
  # Taken: yes; the digest shows they are equal.
  # weft@6798e7d:ess/4-applications/formations.yaml:880
  - name: weft.architecture.CommitRevision
    naming:
      display: Commit a formation revision
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      # Isolation pass 2: the account the request acts in, so the formation can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing formation (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      # Isolation pass 2: a formation of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: empty
        when_related:
          entity: weft.architecture.Component
          where: formation_id == input.formation_id
          exists: false
        error: weft.architecture.EmptyFormation
      - name: committed
        creates: weft.architecture.FormationRevision
        instance: revision_id
        sets:
          formation_id: input.formation_id
          number: {generated: true}
          document_digest: {generated: true}
        emits: [weft.architecture.RevisionCommitted]
        payload:
          weft.architecture.RevisionCommitted:
            revision_id: {generated: true}
            formation_id: input.formation_id
            number: {generated: true}
            document_digest: {generated: true}

  # Section 3, `Environment`.
  # weft@6798e7d:ess/4-applications/formations.yaml:927
  - name: weft.architecture.CreateEnvironment
    naming:
      display: Create an environment
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      # Isolation pass 2: the account the request acts in, so the formation can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: name, type: weft.architecture.EnvironmentName}
      # Design ci-cd-support § Security: production is marked when the environment is made.
      - {name: protected, type: Boolean}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing formation (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      # Isolation pass 2: a formation of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: name-taken
        when_related:
          entity: weft.architecture.Environment
          where:
            all:
              - formation_id == input.formation_id
              - name == input.name
          exists: true
        error: weft.architecture.EnvironmentNameTaken
      - name: created
        creates: weft.architecture.Environment
        instance: environment_id
        sets:
          formation_id: input.formation_id
          scope_id: {related: {via: input.formation_id, field: scope_id}}
          name: input.name
          quota_slice: []
          origin: Manual
          protected: input.protected
          source_repository: {cleared: true}
          pull_request: {cleared: true}
          expires_at: {cleared: true}
        emits: [weft.architecture.EnvironmentCreated]
        payload:
          weft.architecture.EnvironmentCreated:
            environment_id: {generated: true}
            formation_id: input.formation_id
            name: input.name

  # Section 3, `Environment`: "its own ... quotas". An environment's slice is at most what the
  # formation's slice has left after the other environments (section 1, `Quota`); the sum over
  # environments is not a guard ESS states here, so the check is external.
  # weft@6798e7d:ess/4-applications/formations.yaml:987
  - name: weft.architecture.SetEnvironmentQuota
    naming:
      display: Set an environment's quota slice
    input:
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: quota_slice, type: List<weft.shared.ResourceAmount>}
    outcomes:
      # Was the `amount >= 0` invariant of the local QuotaAmount type.
      - name: negative-amount
        when:
          exists: {in: quota_slice, as: q, that: q.amount < 0}
        error: weft.architecture.NegativeQuotaAmount
      - name: no-such-environment
        unknown_instance: true
        error: weft.architecture.NoSuchEnvironment
      # Isolation pass 2: only the environment's own account acts on it; another account's
      # environment answers like a missing one, before its state is read.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.architecture.NoSuchEnvironment
      - name: retired
        when_subject: {predicate: state == Retired}
        error: weft.architecture.EnvironmentStateConflict
      - name: over-quota
        external: the slice exceeds what the formation's slice has left after its other environments
        error: weft.architecture.QuotaExceeded
      - name: set
        updates: weft.architecture.Environment
        instance: environment_id
        sets:
          quota_slice: input.quota_slice
        emits: [weft.architecture.EnvironmentQuotaSet]
        payload:
          weft.architecture.EnvironmentQuotaSet:
            environment_id: input.environment_id
            quota_slice: input.quota_slice

  # Design ci-cd-support § Stage 1.3: "`weft deploy --preview` from a pull-request job creates
  # or updates it". A preview is never protected. Its name is `pr-<number>`, chosen by the CLI.
  # OPEN: a sleep policy by default (design § Stage 1.3) is the workloads' scale setting, not set
  # here. Taken: the CLI sets it after the create.
  # weft@6798e7d:ess/4-applications/formations.yaml:1028
  - name: weft.architecture.CreatePreviewEnvironment
    naming:
      display: Create a preview environment for a pull request
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      # Isolation pass 2: the account the request acts in, so the formation can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: name, type: weft.architecture.EnvironmentName}
      - {name: source_repository, type: String}
      - {name: pull_request, type: Integer}
      - {name: expires_at, type: Timestamp}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing formation (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      # Isolation pass 2: a formation of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: name-taken
        when_related:
          entity: weft.architecture.Environment
          where:
            all:
              - formation_id == input.formation_id
              - name == input.name
          exists: true
        error: weft.architecture.EnvironmentNameTaken
      - name: created
        creates: weft.architecture.Environment
        instance: environment_id
        sets:
          formation_id: input.formation_id
          scope_id: {related: {via: input.formation_id, field: scope_id}}
          name: input.name
          quota_slice: []
          origin: PullRequest
          protected: false
          source_repository: input.source_repository
          pull_request: input.pull_request
          expires_at: input.expires_at
        emits: [weft.architecture.EnvironmentCreated]
        payload:
          weft.architecture.EnvironmentCreated:
            environment_id: {generated: true}
            formation_id: input.formation_id
            name: input.name

  # Design ci-cd-support § Stage 1.3: "closing the pull request (forge webhook, stage 2) or the
  # expiry retires it". Time form (sketch § 14): a system actor calls it for each preview past its
  # expiry. Only previews end this way; the releases-live check of RetireEnvironment does not
  # apply: an expired preview's release ends with it.
  # OPEN: the pull-request-closed webhook calls RetireEnvironment (no edge domain yet, sketch § 14).
  # weft@6798e7d:ess/4-applications/formations.yaml:1091
  - name: weft.architecture.ExpirePreviewEnvironment
    naming:
      display: Retire a preview environment past its expiry
    input:
      - {name: environment_id, type: weft.shared.EnvironmentId}
    outcomes:
      - name: no-such-environment
        unknown_instance: true
        error: weft.architecture.NoSuchEnvironment
      - name: not-a-preview
        when_subject:
          predicate: origin == Manual
        error: weft.architecture.EnvironmentStateConflict
      - name: not-yet
        when_subject:
          predicate: expires_at > now
        error: weft.architecture.EnvironmentStateConflict
      - name: expired
        moves: weft.architecture.Environment.retire
        instance: environment_id
        emits: [weft.architecture.EnvironmentRetired]
        payload:
          weft.architecture.EnvironmentRetired:
            environment_id: input.environment_id
      - name: wrong-state
        wrong_state: true
        error: weft.architecture.EnvironmentStateConflict

  # OPEN: the sketch names no removal of an environment. Taken: retire, refused while a release
  # to it is live (`weft.deployments`, external).
  # weft@6798e7d:ess/4-applications/formations.yaml:1121
  - name: weft.architecture.RetireEnvironment
    naming:
      display: Retire an environment
    input:
      - {name: environment_id, type: weft.shared.EnvironmentId}
    outcomes:
      # Releases are `weft.deployments`' (layer 6, section 5 "Releases"): a higher layer, so no
      # guard here may read them, and the check stays external.
      # `before_row: true` (soundness pass, 2026-11-26): a release names an environment that
      # exists and is Active (this command refuses to retire one while a release is live), so for
      # an unknown or retired id the fact is false and answering it first changes no reply. Set so
      # the injected scenario does not depend on arranging an Environment: ESS 0.99.2 cannot arrange
      # one (CreateEnvironment's `name-taken` row set beside its `via` guards) and sent the injected
      # scenario to an id no row has, which the interpreted target answered `no-such-environment`.
      # OPEN: confirm with the owner that the external answers before the existence check.
      # OPEN (isolation pass 2): answering first, it also answers before not-callers-account, so
      # another account's environment with a live release answers ReleasesLive, not
      # NoSuchEnvironment. Does the soundness reason above outweigh that disclosure?
      - name: releases-live
        external: a release to this environment is live
        before_row: true
        error: weft.architecture.ReleasesLive
      - name: no-such-environment
        unknown_instance: true
        error: weft.architecture.NoSuchEnvironment
      # Isolation pass 2: only the environment's own account acts on it; another account's
      # environment answers like a missing one, before its state is read.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.architecture.NoSuchEnvironment
      - name: retired
        moves: weft.architecture.Environment.retire
        instance: environment_id
        emits: [weft.architecture.EnvironmentRetired]
        payload:
          weft.architecture.EnvironmentRetired:
            environment_id: input.environment_id
      - name: wrong-state
        wrong_state: true
        error: weft.architecture.EnvironmentStateConflict

  # Section 3, `Component`; the example's `components:`. The component starts internal: not on the border,
  # reached by no link. Its InternalName (section 3, `InternalName`) is minted as `<name>.<formation>.internal`.
  # weft@6798e7d:ess/4-applications/formations.yaml:1164
  - name: weft.architecture.AddComponent
    naming:
      display: Add a component
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      # Isolation pass 2: the account the request acts in, so the formation can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: name, type: weft.shared.ComponentName}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing formation (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      # Isolation pass 2: a formation of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: name-taken
        when_related:
          entity: weft.architecture.Component
          where:
            all:
              - formation_id == input.formation_id
              - name == input.name
          exists: true
        error: weft.architecture.ComponentNameTaken
      - name: added
        creates: weft.architecture.Component
        instance: component_id
        sets:
          formation_id: input.formation_id
          name: input.name
          internal_name: {generated: true}
          on_border: false
        emits: [weft.architecture.ComponentAdded]
        payload:
          weft.architecture.ComponentAdded:
            component_id: {generated: true}
            formation_id: input.formation_id
            name: input.name
            internal_name: {generated: true}

  # Section 3, "Topology as data": "splitting a component is an edit". A component still named by a link,
  # route, mount or scale setting is refused: those go first, so no access outlives an edit by
  # accident.
  # weft@6798e7d:ess/4-applications/formations.yaml:1218
  - name: weft.architecture.RemoveComponent
    naming:
      display: Remove a component
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      # Isolation pass 2: the account the request acts in, so the formation can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: component_id, type: weft.shared.ComponentId}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing formation (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      # weft-sim, 2026-11-26: the interpreter answers an unknown subject id before any guard and,
      # with no `unknown_instance` outcome, with a refusal no outcome declares. `unknown-<x>` is
      # that answer, here and in every command of this file that updates, moves or deletes the
      # row its input names. `no-such-<x>` stays: ESS 0.99.2 requires it for the `foreign-<x>`
      # guard that reads the row through `via` (ESS-COMMAND-005); `when_subject` cannot replace
      # that guard beside a row set (ESS-COMMAND-009) or after `no-such-formation`
      # (ESS-COMMAND-004).
      - name: unknown-component
        unknown_instance: true
        error: weft.architecture.NoSuchComponent
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.architecture.NoSuchComponent
      # Isolation pass 2: a formation of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchComponent
      # A link names the component as its caller (`linked`) or as its target (`linked-as-target`).
      # Two row sets with one equality each, not one with `any:`: synthesis scopes a row set only
      # by an equality with the input (soundness pass, 2026-11-26).
      - name: linked
        when_related:
          entity: weft.architecture.Link
          where: caller_component_id == input.component_id
          exists: true
        error: weft.architecture.ComponentInUse
      - name: linked-as-target
        when_related:
          entity: weft.architecture.Link
          where: target_component_id == input.component_id
          exists: true
        error: weft.architecture.ComponentInUse
      - name: routed
        when_related:
          entity: weft.architecture.Route
          where: component_id == input.component_id
          exists: true
        error: weft.architecture.ComponentInUse
      - name: mounted
        when_related:
          entity: weft.architecture.ConfigMount
          where: component_id == input.component_id
          exists: true
        error: weft.architecture.ComponentInUse
      - name: scaled
        when_related:
          entity: weft.architecture.ScaleSetting
          where: component_id == input.component_id
          exists: true
        error: weft.architecture.ComponentInUse
      - name: removed
        deletes: weft.architecture.Component
        instance: component_id
        emits: [weft.architecture.ComponentRemoved]
        payload:
          weft.architecture.ComponentRemoved:
            component_id: input.component_id
            formation_id: input.formation_id

  # Section 3, `Border`, and the example's `border: [gateway]`: put a component on the
  # border. This widens access, so it is its own command; a route to the component still needs
  # AddRoute.
  # weft@6798e7d:ess/4-applications/formations.yaml:1305
  - name: weft.architecture.AddToBorder
    naming:
      display: Put a component on the border
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      # Scope isolation (story blocks-scope-isolation): the scope the request acts in, so the
      # row can be tied to the caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: component_id, type: weft.shared.ComponentId}
    outcomes:
      # Scope isolation: the scope must be the caller's; it reads no row and answers like a
      # missing row (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      - name: unknown-component
        unknown_instance: true
        error: weft.architecture.NoSuchComponent
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.architecture.NoSuchComponent
      # Scope isolation: a row of another scope answers like a missing one, after the existence
      # checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchComponent
      - name: bordered
        updates: weft.architecture.Component
        instance: component_id
        sets:
          on_border: true
        emits: [weft.architecture.ComponentBordered]
        payload:
          weft.architecture.ComponentBordered:
            component_id: input.component_id
            formation_id: input.formation_id

  # Section 3, `Border`: "Everything else is internal": take a component off the border. Refused
