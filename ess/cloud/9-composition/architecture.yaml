# Moved from weft@6798e7d: ess/4-applications/formations.yaml.
# Comments are weft's at that commit: "sketch", "section" and "design" cite weft's documents, and
# where a comment says account or tenant, the block reads scope (docs/boundary.md, D1 A).
domain: weft.architecture

summary: >-
  The architecture as data: formations of components with their allowed links, border, config
  and scale settings, the environments they run in, frozen into immutable revisions.

naming:
  wire: weft
  display: Architecture

types:
  # Identities of rows only this domain addresses. Other domains name a component by
  # (weft.shared.FormationId, weft.shared.ComponentName).

  # Section 3, `Formation`: "named"; the "Topology as data" example's `formation: shop`.
  # weft@6798e7d:ess/4-applications/formations.yaml:28
  - name: weft.architecture.FormationName
    kind: newtype
    of: String
  # Section 3, `Environment`: "a named target of the same formation (`dev`, `staging`, `prod`)".
  # OPEN: whether environment names are a closed set. Taken: any name; dev, staging, prod are
  # examples.
  # weft@6798e7d:ess/4-applications/formations.yaml:34
  - name: weft.architecture.EnvironmentName
    kind: newtype
    of: String
  # Section 3, `InternalName`: "a DNS name inside the formation's private network
  # (`orders.shop.internal`)".
  # weft@6798e7d:ess/4-applications/formations.yaml:39
  - name: weft.architecture.InternalName
    kind: newtype
    of: String
  # weft@6798e7d:ess/4-applications/formations.yaml:46
  - name: weft.architecture.ConfigName
    kind: newtype
    of: String
  # OPEN: the sketch names a link's protocol but no list. Taken: the four below, and Ssh
  # (story:data-links, new in cloudspec): a closed list.
  # weft@6798e7d:ess/4-applications/formations.yaml:58
  - name: weft.architecture.LinkProtocol
    kind: enum
    variants: [Http, Grpc, Tcp, Udp, Ssh]

  # New in cloudspec (story:data-links): the way a link moves a named data set (its `carries`),
  # seen from the caller: `Push` copies from the caller to the target, `Pull` from the target to the
  # caller, `Both` either way.
  - name: weft.architecture.DataDirection
    kind: enum
    variants: [Push, Pull, Both]

  # New in cloudspec (story:scope-parity): a parity constraint between scopes of an architecture,
  # design-time: work moves between them only when each named fact (a toolchain's commit, its
  # targets, the version of another toolchain) has the same value in every one of them. Checking
  # the facts at run time is the runtime's. At least two scopes and one fact.
  - name: weft.architecture.Parity
    kind: struct
    fields:
      - name: scopes
        type: List<weft.shared.ScopeId>
      - name: facts
        type: List<String>

  # Section 3, `Formation` "a quota slice" and `Environment` "its own ... quotas": a list of
  # weft.shared.ResourceAmount, one amount of one resource class (section 6). The shared type
  # carries no `amount >= 0`; the entities and the commands that set a slice hold it.

  # Section 3, `Config`: "mounted into components as files or environment variables".
  # weft@6798e7d:ess/4-applications/formations.yaml:67
  - name: weft.architecture.MountKind
    kind: enum
    variants: [File, Env]

  # Design ci-cd-support § Stage 1.3: "an `Environment` gets an origin (`manual`, `pull-request`)".
  # weft@6798e7d:ess/4-applications/formations.yaml:72
  - name: weft.architecture.EnvironmentOrigin
    kind: enum
    variants: [Manual, PullRequest]

entities:
  # Section 3: "`Formation`: named, inside one account. Owns a private network, a secret
  # scope and a quota slice."
  # weft@6798e7d:ess/4-applications/formations.yaml:79
  - name: weft.architecture.Formation
    naming:
      summary: A named set of components inside one scope, with its private network, secret scope and quota slice.
    identity:
      name: formation_id
      type: weft.shared.FormationId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: name
        type: weft.architecture.FormationName
      # The private network's DNS domain, `<formation>.internal` (section 3, `InternalName`: `orders.shop.internal`).
      # OPEN: the private network's address range and how it is allocated; taken: the
      # implementation mints the domain, and the network is the implicit claim of section 4 "Claims".
      - name: internal_domain
        type: String
      # The formation itself is the secret scope of section 7, `Secret` ("formation ... scope");
      # `weft.secrets` keys its secrets by this formation's id, so no field is stored here.
      - name: quota_slice
        type: List<weft.shared.ResourceAmount>
      # Section 10 line 456 (the scheduler's input: "formation's zone rules"); docs/open-questions.md
      # "workloads loops" (wave 4, decided): the zones the formation's instances may run in, given
      # at creation. Empty: any zone. weft.workloads.InstanceCreated carries it to the scheduler.
      # OPEN: no command changes it after creation, and CreateFormation does not refuse a name no
      # weft.infrastructure.Zone declares (a `when_related: {via: input.zones, exists: false}` guard with
      # an error of its own would); the scheduler meets such a zone as one with no node.
      - name: zones
        type: List<weft.shared.ZoneName>
      # story:scope-parity: the parity constraints between the scopes its parts run in. Empty: none.
      - name: parity
        type: List<weft.architecture.Parity>
      # cloudspec (C2): weft's `cluster_id` (the tenant cluster the formation deploys into) is
      # cut; tenant clusters are the multi-tenant example's.
    invariants:
      - forall: {in: quota_slice, as: q, that: q.amount >= 0}
    # OPEN: the sketch gives the formation no lifecycle. Taken: Active until retired; a retired
    # formation takes no edit and no commit.
    lifecycle:
      initial: Active
      states: [Active, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Active]
          to: Retired
    # Every row below is part of the formation's document ("Topology as data": "The formation document is the
    # topology"), so the formation owns each of them.
    relations:
      # Section 3: "named, inside one account". The account (layer 2, `weft.accounts`) stands on
      # its own and outlives the link: references.
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      # Section 10 line 456: a zone (layer 1, `weft.infrastructure`) stands on its own: references.
      - {name: allowed_zones, kind: references, target: weft.infrastructure.Zone, cardinality: many, via: zones}
      - {name: revisions, kind: owns, target: weft.architecture.FormationRevision, cardinality: many, via: formation_id}
      - {name: environments, kind: owns, target: weft.architecture.Environment, cardinality: many, via: formation_id}
      - {name: components, kind: owns, target: weft.architecture.Component, cardinality: many, via: formation_id}
      - {name: links, kind: owns, target: weft.architecture.Link, cardinality: many, via: formation_id}
      - {name: routes, kind: owns, target: weft.architecture.Route, cardinality: many, via: formation_id}
      - {name: component_workloads, kind: owns, target: weft.architecture.ComponentWorkload, cardinality: many, via: formation_id}
      - {name: configs, kind: owns, target: weft.architecture.Config, cardinality: many, via: formation_id}
      - {name: config_mounts, kind: owns, target: weft.architecture.ConfigMount, cardinality: many, via: formation_id}
      - {name: config_overrides, kind: owns, target: weft.architecture.ConfigOverride, cardinality: many, via: formation_id}
      - {name: scale_settings, kind: owns, target: weft.architecture.ScaleSetting, cardinality: many, via: formation_id}

  # Section 3: "`FormationRevision`: immutable snapshot of the formation's document."
  # Section 5 "Translation" has a Translation produce one; the Translation (`weft.deployments`)
  # names the revision it produced, so the revision stores no reference back to it.
  # weft@6798e7d:ess/4-applications/formations.yaml:146
  - name: weft.architecture.FormationRevision
    naming:
      summary: An immutable snapshot of a formation's document; releases apply revisions.
    identity:
      name: revision_id
      type: weft.shared.FormationRevisionId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      # 1 for the first revision of a formation, one more for each next. Minted by the
      # implementation.
      - name: number
        type: Integer
      # Digest of the canonical document the revision froze: components, links, border, config,
      # environments. Section 5 "Translation", "Deterministic": the same source gives the same revision byte for byte.
      # OPEN: the canonical serialization of the document; taken: the implementation mints the
      # digest over it.
      - name: document_digest
        type: weft.shared.ArtifactDigest
    invariants:
      - number >= 1
    # Integration 2: the frozen document is a content-addressed artifact (layer 3,
    # `weft.artifacts`). It stands on its own and outlives the revision: references.
    relations:
      - {name: document, kind: references, target: weft.artifacts.Artifact, cardinality: one, via: document_digest}
    # Immutable: one state, no transition, no command that updates or deletes it.
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # Section 3: "`Environment`: a named target of the same formation (`dev`,
  # `staging`, `prod`). Each has its own secrets, config values, quotas and scale settings."
  # Its secrets are `weft.secrets`' (section 7, `Secret`, environment scope), keyed by its id. Its
  # config values are ConfigOverride rows, its scale settings ScaleSetting rows.
  # weft@6798e7d:ess/4-applications/formations.yaml:181
  - name: weft.architecture.Environment
    naming:
      summary: A named target of a formation, with its own config values, quota slice and scale settings.
    identity:
      name: environment_id
      type: weft.shared.EnvironmentId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      # Isolation pass 2: the formation's account, copied at create, so a command on the
      # environment ties it to the caller's account without a second hop.
      - name: scope_id
        type: weft.shared.ScopeId
      - name: name
        type: weft.architecture.EnvironmentName
      - name: quota_slice
        type: List<weft.shared.ResourceAmount>
      # Design ci-cd-support § Stage 1.3 and § Security ("a rule for a production environment
      # requires a protected ref"): who made the environment and whether it is production.
      - name: origin
        type: weft.architecture.EnvironmentOrigin
      - name: protected
        type: Boolean
      # A preview's source: the repository and pull request it was made for, and when it ends.
      # Absent for a manual environment.
      - name: source_repository
        type: Optional<String>
      - name: pull_request
        type: Optional<Integer>
      - name: expires_at
        type: Optional<Timestamp>
    relations:
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
    invariants:
      - forall: {in: quota_slice, as: q, that: q.amount >= 0}
    # OPEN: the sketch gives an environment no lifecycle. Taken: Active until retired, like the
    # formation.
    lifecycle:
      initial: Active
      states: [Active, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Active]
          to: Retired

  # Section 3: "`Component`: one workload inside the formation (section 4)." Its package,
  # shape and claims are `weft.workloads`', which names it by (formation_id, name); the name is
  # unique in the formation (CreateComponent refuses a second).
  # Line 159-161: "`InternalName`: each component has a DNS name inside the formation's private
  # network (`orders.shop.internal`)": `internal_name`, `<name>.<formation>.internal`.
  # Lines 155-158: a component with `on_border` is part of the formation's Border; every other
  # component is internal.
  # weft@6798e7d:ess/4-applications/formations.yaml:234
  - name: weft.architecture.Component
    naming:
      summary: One workload inside a formation, with its internal DNS name and whether it is on the border.
    identity:
      name: component_id
      type: weft.shared.ComponentId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: name
        type: weft.shared.ComponentName
      - name: internal_name
        type: weft.architecture.InternalName
      - name: on_border
        type: Boolean
    # OPEN: the sketch gives a component no lifecycle. Taken: one state; RemoveComponent deletes
    # the row and refuses while a link, route, mount or scale setting names it.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3: "`Link`: an allowed call from one component to another (protocol,
  # port). Components without a link cannot reach each other." Section 3, `InternalName`: a Link is also what
  # lets the caller resolve the target's InternalName. Default deny: no row, no reach.
  # OPEN: whether a link may cross formations (or accounts, through an `Export` below).
  # Taken: no; both components are of the link's formation.
  # weft@6798e7d:ess/4-applications/formations.yaml:261
  - name: weft.architecture.Link
    naming:
      summary: An allowed call from a caller component to a target component of the same formation, on one protocol and port.
    identity:
      name: link_id
      type: weft.shared.LinkId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: caller_component_id
        type: weft.shared.ComponentId
      - name: target_component_id
        type: weft.shared.ComponentId
      - name: protocol
        type: weft.architecture.LinkProtocol
      - name: port
        type: weft.edge.Port
      # story:data-links: absent on a link that moves no data set.
      - name: data
        type: Optional<weft.architecture.DataDirection>
    relations:
      - {name: caller, kind: references, target: weft.architecture.Component, cardinality: one, via: caller_component_id}
      - {name: target, kind: references, target: weft.architecture.Component, cardinality: one, via: target_component_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3, `Border`: "`Route`s (host and path to a component and port; what a Kubernetes
  # Ingress says)". The host is the endpoint's. cloudspec (layer rule): moved here from
  # weft.edge (layer 7). A route sends traffic to a component of the formation, which only the
  # composition knows; the route names the endpoint of the edge, the edge names no route.
  # weft@6798e7d:ess/4-applications/formations.yaml:361
  - name: weft.architecture.Route
    naming:
      summary: Host and path of a public endpoint, sent to one border component on one port.
    identity:
      name: route_id
      type: weft.shared.RouteId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: endpoint_id
        type: weft.shared.EndpointId
      # A path prefix such as `/api`. OPEN: prefix or exact match; taken: prefix.
      - name: path
        type: String
      - name: component_id
        type: weft.shared.ComponentId
      - name: port
        type: weft.edge.Port
    relations:
      - {name: endpoint, kind: references, target: weft.edge.Endpoint, cardinality: one, via: endpoint_id}
      - {name: component, kind: references, target: weft.architecture.Component, cardinality: one, via: component_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Sketch lines 205-211 and section 3 line 164: one Workload is one component of one formation
  # revision applied to one environment. cloudspec (layer rule): the composition records that
  # fact. weft's Workload carried formation_id, formation_revision_id, environment_id and the
  # component name; weft.workloads (layer 5) must not know the composition, so the workload
  # carries only its scope, its component name and its workload identity, and this row ties it to
  # the component, revision and environment it realizes.
  - name: weft.architecture.ComponentWorkload
    naming:
      summary: The workload that realizes one component of one revision of a formation in one of its environments.
    identity:
      name: component_workload_id
      type: weft.shared.ComponentWorkloadId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: formation_revision_id
        type: weft.shared.FormationRevisionId
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: component_id
        type: weft.shared.ComponentId
      - name: workload_id
        type: weft.shared.WorkloadId
    relations:
      - {name: formation_revision, kind: references, target: weft.architecture.FormationRevision, cardinality: one, via: formation_revision_id}
      - {name: environment, kind: references, target: weft.architecture.Environment, cardinality: one, via: environment_id}
      - {name: component, kind: references, target: weft.architecture.Component, cardinality: one, via: component_id}
      - {name: workload, kind: references, target: weft.workloads.Workload, cardinality: one, via: workload_id}
    lifecycle:
      initial: Assigned
      states: [Assigned]
      terminal: [Assigned]

  # Section 3: "`Config`: named non-secret data (files, key-value pairs) of the
  # formation ... What a Kubernetes ConfigMap says." `data` maps a key (or a file name) to its
  # text.
  # OPEN: how a secret value written into a Config is kept out (section 5 "Deployment sources", `kubernetes`, sends Secret
  # values to custody). Taken: Config is declared non-secret; nothing here inspects its values.
  # weft@6798e7d:ess/4-applications/formations.yaml:392
  - name: weft.architecture.Config
    naming:
      summary: Named non-secret data of a formation, as keys or files.
    identity:
      name: config_id
      type: weft.shared.ConfigId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: name
        type: weft.architecture.ConfigName
      - name: data
        type: Map<String, String>
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3, `Config`: "mounted into components as files or environment variables". For
  # `File`, `target` is the directory the keys appear in as files; for `Env`, the prefix of the
  # variable names.
  # weft@6798e7d:ess/4-applications/formations.yaml:413
  - name: weft.architecture.ConfigMount
    naming:
      summary: One config mounted into one component, as files or as environment variables.
    identity:
      name: mount_id
      type: weft.shared.ConfigMountId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: component_id
        type: weft.shared.ComponentId
      - name: config_id
        type: weft.shared.ConfigId
      - name: kind
        type: weft.architecture.MountKind
      - name: target
        type: String
    relations:
      - {name: component, kind: references, target: weft.architecture.Component, cardinality: one, via: component_id}
      - {name: config, kind: references, target: weft.architecture.Config, cardinality: one, via: config_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3, `Environment`: each environment has "its own ... config values": the data of one config
  # in one environment, replacing the config's own data there.
  # OPEN: replace the config's data whole or merge key by key. Taken: replace.
  # weft@6798e7d:ess/4-applications/formations.yaml:441
  - name: weft.architecture.ConfigOverride
    naming:
      summary: The values one config takes in one environment.
    identity:
      name: override_id
      type: weft.shared.ConfigOverrideId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: config_id
        type: weft.shared.ConfigId
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: data
        type: Map<String, String>
    relations:
      - {name: config, kind: references, target: weft.architecture.Config, cardinality: one, via: config_id}
      - {name: environment, kind: references, target: weft.architecture.Environment, cardinality: one, via: environment_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3, `Environment`: each environment has "its own ... scale settings": the replica bounds of
  # one component in one environment. The metric that moves replicas between them is the
  # ScaleRule of `weft.workloads` (section 4 "Inside one instance").
  # weft@6798e7d:ess/4-applications/formations.yaml:467
  - name: weft.architecture.ScaleSetting
    naming:
      summary: The replica bounds of one component in one environment.
    identity:
      name: scale_setting_id
      type: weft.shared.ScaleSettingId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: component_id
        type: weft.shared.ComponentId
      - name: min_replicas
        type: Integer
      - name: max_replicas
        type: Integer
    invariants:
      - min_replicas >= 0
      - max_replicas >= 1
    relations:
      - {name: environment, kind: references, target: weft.architecture.Environment, cardinality: one, via: environment_id}
      - {name: component, kind: references, target: weft.architecture.Component, cardinality: one, via: component_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

errors:
  # weft@6798e7d:ess/4-applications/formations.yaml:496
  - name: weft.architecture.NoSuchFormation
    summary: No formation has this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:498
  - name: weft.architecture.FormationStateConflict
    summary: The formation is retired, so it takes no edit, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:502
  - name: weft.architecture.NoSuchScope
    summary: The scope does not exist or is closed, and nothing was created.
  # weft@6798e7d:ess/4-applications/formations.yaml:504
  - name: weft.architecture.FormationNameTaken
    summary: The scope already has a formation of this name, and nothing was created.
  # weft@6798e7d:ess/4-applications/formations.yaml:506
  - name: weft.architecture.QuotaExceeded
    summary: The slice asked for exceeds the quota its parent has left, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:508
  - name: weft.architecture.NegativeQuotaAmount
    summary: The slice asked for holds an amount below zero, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:510
  - name: weft.architecture.ReleasesLive
    summary: A release of this formation or environment is live, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:512
  - name: weft.architecture.NoSuchEnvironment
    summary: No environment of this formation has this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:514
  - name: weft.architecture.EnvironmentStateConflict
    summary: The environment is retired, so it takes no edit, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:516
  - name: weft.architecture.EnvironmentNameTaken
    summary: The formation already has an environment of this name, and nothing was created.
  # weft@6798e7d:ess/4-applications/formations.yaml:518
  - name: weft.architecture.NoSuchComponent
    summary: No component of this formation has this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:520
  - name: weft.architecture.ComponentNameTaken
    summary: The formation already has a component of this name, and nothing was created.
  # weft@6798e7d:ess/4-applications/formations.yaml:522
  - name: weft.architecture.ComponentInUse
    summary: A link, route, config mount or scale setting still names the component, and nothing was removed.
  # weft@6798e7d:ess/4-applications/formations.yaml:524
  - name: weft.architecture.NoSuchLink
    summary: No link of this formation has this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:526
  - name: weft.architecture.LinkExists
    summary: The formation already allows this call on this protocol and port, and nothing was created.
  # weft@6798e7d:ess/4-applications/formations.yaml:530
  - name: weft.architecture.RoutesRemain
    summary: A route still names this component or endpoint, and nothing changed.
  # cloudspec (layer rule): the route errors moved here from weft.edge with weft.architecture.Route.
  # weft@6798e7d:ess/4-applications/formations.yaml:528
  - name: weft.architecture.NotOnBorder
    summary: The component is not on the formation's border, so no route may reach it, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:534
  - name: weft.architecture.NoSuchEndpoint
    summary: No endpoint of the formation's scope has this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:554
  - name: weft.architecture.NoSuchRoute
    summary: No route of this formation has this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:556
  - name: weft.architecture.RouteExists
    summary: The endpoint already routes this path, and nothing was created.
  # cloudspec (layer rule): the refusals of weft's DefineWorkload that read the composition, for
  # weft.architecture.AssignWorkload.
  - name: weft.architecture.NoSuchRevision
    summary: No revision of this formation has this id, and nothing changed.
  - name: weft.architecture.NoSuchWorkload
    summary: No workload of the formation's scope has this id, and nothing changed.
  - name: weft.architecture.WorkloadAlreadyAssigned
    summary: A workload is already assigned to this component in this revision and environment, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:558
  - name: weft.architecture.NoSuchConfig
    summary: No config of this formation has this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:560
  - name: weft.architecture.ConfigNameTaken
    summary: The formation already has a config of this name, and nothing was created.
  # weft@6798e7d:ess/4-applications/formations.yaml:562
  - name: weft.architecture.ConfigInUse
    summary: A mount or an environment's values still name the config, and nothing was removed.
  # weft@6798e7d:ess/4-applications/formations.yaml:564
  - name: weft.architecture.NoSuchMount
    summary: No config mount of this formation has this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:566
  - name: weft.architecture.MountExists
    summary: The component already mounts this config, and nothing was created.
  # weft@6798e7d:ess/4-applications/formations.yaml:568
  - name: weft.architecture.NoSuchOverride
    summary: No environment values of this formation have this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:570
  - name: weft.architecture.OverrideExists
    summary: The environment already has values for this config, and nothing was created.
  # weft@6798e7d:ess/4-applications/formations.yaml:572
  - name: weft.architecture.NoSuchScaleSetting
    summary: No scale setting of this formation has this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:574
  - name: weft.architecture.ScaleSettingExists
    summary: The environment already has a scale setting for this component, and nothing was created.
  # weft@6798e7d:ess/4-applications/formations.yaml:576
  - name: weft.architecture.InvalidScaleBounds
    summary: The minimum replicas exceed the maximum, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:578
  - name: weft.architecture.EmptyFormation
    summary: The formation has no component, so no revision was recorded.
  - name: weft.architecture.ParityForm
    summary: A parity names fewer than two scopes or no fact, and nothing was created.

