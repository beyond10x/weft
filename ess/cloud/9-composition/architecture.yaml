  # Section 3, `Border`: "host and path to a component and port". Only a component on the
  # border may be routed to (section 3, `Border`: "Everything else is internal"). cloudspec (layer
  # rule): moved here from weft.edge with weft.architecture.Route; the endpoint is an endpoint of
  # the edge in the formation's scope (weft: of the formation).
  # weft@6798e7d:ess/4-applications/formations.yaml:1760
  - name: weft.architecture.AddRoute
    naming:
      display: Add a route
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: path, type: String}
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: port, type: weft.edge.Port}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      - name: no-such-endpoint
        when_related: {via: input.endpoint_id, exists: false}
        error: weft.architecture.NoSuchEndpoint
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.architecture.NoSuchComponent
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      # An endpoint of another scope than the formation's answers like a missing one.
      - name: foreign-endpoint
        when_related:
          entity: weft.edge.Endpoint
          where:
            all:
              - endpoint_id == input.endpoint_id
              - not:
                  exists:
                    as: f
                    in: {entity: weft.architecture.Formation}
                    that: {all: [{f.scope_id: {eq: {fact: scope_id}}}, f.formation_id == input.formation_id]}
          exists: true
        error: weft.architecture.NoSuchEndpoint
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchComponent
      - name: not-on-border
        when_related: {via: input.component_id, predicate: on_border == false}
        error: weft.architecture.NotOnBorder
      - name: exists
        when_related:
          entity: weft.architecture.Route
          where:
            all:
              - endpoint_id == input.endpoint_id
              - path == input.path
          exists: true
        error: weft.architecture.RouteExists
      - name: added
        creates: weft.architecture.Route
        instance: route_id
        sets:
          formation_id: input.formation_id
          endpoint_id: input.endpoint_id
          path: input.path
          component_id: input.component_id
          port: input.port
        emits: [weft.architecture.RouteAdded]
        payload:
          weft.architecture.RouteAdded:
            route_id: {generated: true}
            formation_id: input.formation_id
            endpoint_id: input.endpoint_id
            path: input.path
            component_id: input.component_id
            port: input.port

  # Section 3, `Border`. cloudspec (layer rule): moved here from weft.edge.
  # weft@6798e7d:ess/4-applications/formations.yaml:1820
