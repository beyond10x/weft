        when: scope_id != caller.scope_id
        error: weft.architecture.NoSuchFormation
      - name: bad-bounds
        when:
          any:
            - min_replicas < 0
            - max_replicas < 1
            - min_replicas > max_replicas
        error: weft.architecture.InvalidScaleBounds
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.architecture.NoSuchFormation
      - name: no-such-environment
        when_related: {via: input.environment_id, exists: false}
        error: weft.architecture.NoSuchEnvironment
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.architecture.NoSuchComponent
      # Isolation pass 2: a formation of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: formation-of-other-scope
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.architecture.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.architecture.FormationStateConflict
      - name: foreign-environment
        when_related: {via: input.environment_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchEnvironment
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.architecture.NoSuchComponent
      - name: environment-retired
        when_related: {via: input.environment_id, predicate: state == Retired}
        error: weft.architecture.EnvironmentStateConflict
      - name: exists
        when_related:
          entity: weft.architecture.ScaleSetting
          where:
            all:
              - environment_id == input.environment_id
              - component_id == input.component_id
          exists: true
        error: weft.architecture.ScaleSettingExists
      - name: over-quota
        external: the maximum replicas times the component's claims exceed the environment's quota slice
        error: weft.architecture.QuotaExceeded
      - name: set
        creates: weft.architecture.ScaleSetting
        instance: scale_setting_id
        sets:
          formation_id: input.formation_id
          environment_id: input.environment_id
          component_id: input.component_id
          min_replicas: input.min_replicas
          max_replicas: input.max_replicas
        emits: [weft.architecture.ScaleSet]
        payload:
          weft.architecture.ScaleSet:
            scale_setting_id: {generated: true}
            formation_id: input.formation_id
            environment_id: input.environment_id
            component_id: input.component_id
            min_replicas: input.min_replicas
            max_replicas: input.max_replicas

  # Section 3, `Environment`.
  # weft@6798e7d:ess/4-applications/formations.yaml:2345
  - name: weft.architecture.ChangeScale
    naming:
      display: Change a component's scale in an environment
    input:
