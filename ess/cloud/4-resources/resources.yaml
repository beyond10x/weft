commands:
  # Brief (Volume) and section 6 line 401 `volume`: create an empty volume.
  # Soundness pass (2026-11-26): the restore from a snapshot moved to RestoreVolume. With the
  # snapshot guards here, synthesis (ess 0.99.2) could arrange no VolumeSnapshot row for any branch
  # of this command (a snapshot needs a volume, which needed this command: a cycle), so no volume
  # could be created in any scenario, and every volume scenario of this domain and of weft.claims
  # was refused. OPEN: owner to confirm the split (one create command with an optional
  # `source_snapshot_id` before, two commands now).
  # weft@6798e7d:ess/3-resources/resources.yaml:361
  - name: weft.resources.CreateVolume
    naming:
      display: Create a volume
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: size_bytes, type: Integer}
      - {name: zone, type: weft.shared.ZoneName}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
    outcomes:
      # hardening pass 1 D3: the volume is created only in the account the request acts in.
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.resources.NotFound
      - name: invalid-size
        when: size_bytes <= 0
        error: weft.resources.InvalidAmount
      # Usage against the quota is weft.metering's check (layer 8, above this one; see the OPEN on
      # weft.accounts.Quota): weft.accounts stores limits only, so this stays an external refusal.
      - name: quota-exceeded
        external: the size would exceed the storage quota of the scope
        error: weft.resources.QuotaExceeded
      - name: created
        creates: weft.resources.Volume
        instance: volume_id
        sets:
          scope_id: input.scope_id
          size_bytes: input.size_bytes
          zone: input.zone
          node_id: input.node_id
        emits: [weft.resources.VolumeCreated]
        payload:
          weft.resources.VolumeCreated:
            volume_id: {generated: true}
            scope_id: input.scope_id
            size_bytes: input.size_bytes
            zone: input.zone
            node_id: input.node_id

  # Brief (Volume, VolumeSnapshot) and section 6 line 401 `volume`, `snapshot`: create a volume
  # restored from a snapshot of the same account and zone. Split from CreateVolume in the
  # soundness pass (2026-11-26); see there.
  # weft@6798e7d:ess/3-resources/resources.yaml:402
  - name: weft.resources.RestoreVolume
    naming:
      display: Restore a volume from a snapshot
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: size_bytes, type: Integer}
      - {name: zone, type: weft.shared.ZoneName}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: source_snapshot_id, type: weft.shared.VolumeSnapshotId}
    outcomes:
      # hardening pass 1 D3: the volume is restored only in the account the request acts in.
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.resources.NotFound
      - name: invalid-size
        when: size_bytes <= 0
        error: weft.resources.InvalidAmount
      - name: snapshot-missing
        when_related: {via: input.source_snapshot_id, exists: false}
        error: weft.resources.UnitNotFound
      # hardening pass 1 disclosure (resources.yaml:411): another account's snapshot answers like a
      # missing one, before its state, zone or size is checked.
      - name: snapshot-foreign
        when_related: {via: input.source_snapshot_id, predicate: scope_id != input.scope_id}
        error: weft.resources.UnitNotFound
      - name: snapshot-unavailable
        when_related:
          via: input.source_snapshot_id
          predicate:
            any:
              - state != Ready
              - zone != input.zone
        error: weft.resources.UnitNotAvailable
      - name: too-small
        when_related: {via: input.source_snapshot_id, predicate: size_bytes > input.size_bytes}
        error: weft.resources.VolumeTooSmall
      # Usage against the quota is weft.metering's check (layer 8, above this one; see the OPEN on
      # weft.accounts.Quota): weft.accounts stores limits only, so this stays an external refusal.
      - name: quota-exceeded
        external: the size would exceed the storage quota of the scope
        error: weft.resources.QuotaExceeded
      - name: restored
        creates: weft.resources.Volume
        instance: volume_id
        sets:
          scope_id: input.scope_id
          size_bytes: input.size_bytes
          zone: input.zone
          node_id: input.node_id
          source_snapshot_id: input.source_snapshot_id
        emits: [weft.resources.VolumeRestored]
        payload:
          weft.resources.VolumeRestored:
            volume_id: {generated: true}
            scope_id: input.scope_id
            size_bytes: input.size_bytes
            zone: input.zone
            node_id: input.node_id
            source_snapshot_id: input.source_snapshot_id

  # Brief (Volume lifecycle). See the OPEN on Volume for who provisions it.
  # weft@6798e7d:ess/3-resources/resources.yaml:463
  - name: weft.resources.ReportVolumeProvisioned
    naming:
      display: Report a volume provisioned
    input:
      - {name: volume_id, type: weft.shared.VolumeId}
      - {name: result, type: weft.resources.ProvisionResult}
      - {name: reason, type: Optional<String>}
    outcomes:
      - name: no-such-volume
        unknown_instance: true
        error: weft.resources.NotFound
      - name: failed
        when: result == Failed
        moves: weft.resources.Volume.fail
        instance: volume_id
        emits: [weft.resources.VolumeFailed]
        payload:
          weft.resources.VolumeFailed:
            volume_id: input.volume_id
            reason: input.reason
      - name: provisioned
        moves: weft.resources.Volume.provisioned
        instance: volume_id
        emits: [weft.resources.VolumeProvisioned]
        payload:
          weft.resources.VolumeProvisioned:
            volume_id: input.volume_id
      - name: wrong-state
        wrong_state: true
        error: weft.resources.StateConflict

  # Brief (Volume lifecycle). A volume a claim still names is not deleted.
  # weft@6798e7d:ess/3-resources/resources.yaml:495
  - name: weft.resources.DeleteVolume
    naming:
      display: Delete a volume
    input:
      - {name: volume_id, type: weft.shared.VolumeId}
    outcomes:
      - name: no-such-volume
        unknown_instance: true
        error: weft.resources.NotFound
      # hardening pass 1 D3: another account's volume answers like a missing one, before its state.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.resources.NotFound
      # A volume with a writer is Attached: weft.claims.CommitVolumeWriter moves it there and
      # weft.claims.ReleaseBinding back, so this part of "in use" is the stored state.
      - name: has-writer
        when_subject:
          predicate: state == Attached
        error: weft.resources.UnitInUse
      # The rest of "in use" is not on the volume: a read-only binding leaves it Available, and a
      # Pending claim naming it moves nothing here. Both are rows of weft.claims (layer 5, above
      # this one), which this domain cannot read, so that part is an external refusal.
      - name: in-use
        external: a claim of weft.claims that is not Released, or an Active read-only binding, names the volume
        error: weft.resources.UnitInUse
      - name: deleted
        moves: weft.resources.Volume.delete
        instance: volume_id
        emits: [weft.resources.VolumeDeleted]
        payload:
          weft.resources.VolumeDeleted:
            volume_id: input.volume_id
      - name: wrong-state
        wrong_state: true
        error: weft.resources.StateConflict

  # Brief (VolumeSnapshot) and section 6 line 401 `snapshot`.
  # OPEN: may a volume with a writer be snapshotted (crash-consistent), or only one without a
  # writer? Taken: only an Available volume (no writer); an Attached one is refused.
  # weft@6798e7d:ess/3-resources/resources.yaml:534
  - name: weft.resources.SnapshotVolume
    naming:
      display: Snapshot a volume
    input:
      - {name: volume_id, type: weft.shared.VolumeId}
      - {name: scope_id, type: weft.shared.ScopeId}
    outcomes:
      # hardening pass 1 D3: the snapshot is taken only in the account the request acts in.
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.resources.NotFound
      - name: volume-missing
        when_related: {via: input.volume_id, exists: false}
        error: weft.resources.UnitNotFound
      # hardening pass 1 disclosure (resources.yaml:527): another account's volume answers like a
      # missing one, before its state is checked.
      - name: volume-foreign
        when_related: {via: input.volume_id, predicate: scope_id != input.scope_id}
        error: weft.resources.UnitNotFound
      - name: volume-unavailable
        when_related: {via: input.volume_id, predicate: state != Available}
        error: weft.resources.UnitNotAvailable
      # Usage against the quota is weft.metering's check (layer 8, above this one; see the OPEN on
      # weft.accounts.Quota): weft.accounts stores limits only, so this stays an external refusal.
      - name: quota-exceeded
        external: the snapshot would exceed the storage quota of the scope
        error: weft.resources.QuotaExceeded
      - name: requested
        creates: weft.resources.VolumeSnapshot
        instance: volume_snapshot_id
        sets:
          scope_id: input.scope_id
          volume_id: input.volume_id
          size_bytes: {related: {via: input.volume_id, field: size_bytes}}
          zone: {related: {via: input.volume_id, field: zone}}
        emits: [weft.resources.VolumeSnapshotRequested]
        payload:
          weft.resources.VolumeSnapshotRequested:
            volume_snapshot_id: {generated: true}
            volume_id: input.volume_id
            scope_id: input.scope_id

  # Brief (VolumeSnapshot). Reported by the provisioner, as for volumes.
  # weft@6798e7d:ess/3-resources/resources.yaml:577
  - name: weft.resources.ReportVolumeSnapshotTaken
    naming:
      display: Report a volume snapshot taken
    input:
      - {name: volume_snapshot_id, type: weft.shared.VolumeSnapshotId}
      - {name: result, type: weft.resources.ProvisionResult}
      - {name: reason, type: Optional<String>}
    outcomes:
      - name: no-such-snapshot
        unknown_instance: true
        error: weft.resources.NotFound
      - name: failed
        when: result == Failed
        moves: weft.resources.VolumeSnapshot.fail
        instance: volume_snapshot_id
        emits: [weft.resources.VolumeSnapshotFailed]
        payload:
          weft.resources.VolumeSnapshotFailed:
            volume_snapshot_id: input.volume_snapshot_id
            reason: input.reason
      - name: ready
        moves: weft.resources.VolumeSnapshot.ready
        instance: volume_snapshot_id
        emits: [weft.resources.VolumeSnapshotReady]
        payload:
          weft.resources.VolumeSnapshotReady:
            volume_snapshot_id: input.volume_snapshot_id
      - name: wrong-state
        wrong_state: true
        error: weft.resources.StateConflict

  # Brief (VolumeSnapshot). A volume restored from it keeps its own data; the snapshot can go.
  # weft@6798e7d:ess/3-resources/resources.yaml:609
  - name: weft.resources.DeleteVolumeSnapshot
    naming:
      display: Delete a volume snapshot
    input:
      - {name: volume_snapshot_id, type: weft.shared.VolumeSnapshotId}
    outcomes:
      - name: no-such-snapshot
        unknown_instance: true
        error: weft.resources.NotFound
      # hardening pass 1 D3: another account's snapshot answers like a missing one, before its state.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.resources.NotFound
      - name: deleted
        moves: weft.resources.VolumeSnapshot.delete
        instance: volume_snapshot_id
        emits: [weft.resources.VolumeSnapshotDeleted]
        payload:
          weft.resources.VolumeSnapshotDeleted:
            volume_snapshot_id: input.volume_snapshot_id
      - name: wrong-state
        wrong_state: true
        error: weft.resources.StateConflict

  # Brief (Filesystem) and section 6 line 401 `filesystem`.
  # weft@6798e7d:ess/3-resources/resources.yaml:634
  - name: weft.resources.CreateFilesystem
    naming:
      display: Create a filesystem
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: size_bytes, type: Integer}
      - {name: zone, type: weft.shared.ZoneName}
    outcomes:
      # hardening pass 1 D3: the filesystem is created only in the account the request acts in.
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.resources.NotFound
      - name: invalid-size
        when: size_bytes <= 0
        error: weft.resources.InvalidAmount
      # Usage against the quota is weft.metering's check (layer 8, above this one; see the OPEN on
      # weft.accounts.Quota): weft.accounts stores limits only, so this stays an external refusal.
      - name: quota-exceeded
        external: the size would exceed the storage quota of the scope
        error: weft.resources.QuotaExceeded
      - name: created
        creates: weft.resources.Filesystem
        instance: filesystem_id
        sets:
          scope_id: input.scope_id
          size_bytes: input.size_bytes
          zone: input.zone
        emits: [weft.resources.FilesystemCreated]
        payload:
          weft.resources.FilesystemCreated:
            filesystem_id: {generated: true}
            scope_id: input.scope_id
            size_bytes: input.size_bytes
            zone: input.zone

  # Brief (Filesystem). Reported by the provisioner, as for volumes.
  # weft@6798e7d:ess/3-resources/resources.yaml:670
  - name: weft.resources.ReportFilesystemProvisioned
    naming:
      display: Report a filesystem provisioned
    input:
      - {name: filesystem_id, type: weft.shared.FilesystemId}
      - {name: result, type: weft.resources.ProvisionResult}
      - {name: reason, type: Optional<String>}
    outcomes:
      - name: no-such-filesystem
        unknown_instance: true
        error: weft.resources.NotFound
      - name: failed
        when: result == Failed
        moves: weft.resources.Filesystem.fail
        instance: filesystem_id
        emits: [weft.resources.FilesystemFailed]
        payload:
          weft.resources.FilesystemFailed:
            filesystem_id: input.filesystem_id
            reason: input.reason
      - name: provisioned
        moves: weft.resources.Filesystem.provisioned
        instance: filesystem_id
        emits: [weft.resources.FilesystemProvisioned]
        payload:
          weft.resources.FilesystemProvisioned:
            filesystem_id: input.filesystem_id
      - name: wrong-state
        wrong_state: true
        error: weft.resources.StateConflict

  # Brief (Filesystem). A filesystem a claim still names is not deleted.
  # weft@6798e7d:ess/3-resources/resources.yaml:702
  - name: weft.resources.DeleteFilesystem
    naming:
      display: Delete a filesystem
    input:
      - {name: filesystem_id, type: weft.shared.FilesystemId}
    outcomes:
      - name: no-such-filesystem
        unknown_instance: true
        error: weft.resources.NotFound
      # hardening pass 1 D3: another account's filesystem answers like a missing one, before its
      # use or state.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.resources.NotFound
      # Claims are weft.claims (layer 5), and no state of this unit records them (weft.claims moves
      # only Volume rows), so the check is an external refusal.
      - name: in-use
        external: a claim of weft.claims that is not Released names the filesystem
        error: weft.resources.UnitInUse
      - name: deleted
        moves: weft.resources.Filesystem.delete
        instance: filesystem_id
        emits: [weft.resources.FilesystemDeleted]
        payload:
          weft.resources.FilesystemDeleted:
            filesystem_id: input.filesystem_id
      - name: wrong-state
        wrong_state: true
        error: weft.resources.StateConflict

  # Brief (Bucket) and section 6 line 401 `bucket`.
  # weft@6798e7d:ess/3-resources/resources.yaml:733
  - name: weft.resources.CreateBucket
    naming:
      display: Create a bucket
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: name, type: String}
    outcomes:
      # hardening pass 1 D3: the bucket is created only in the account the request acts in.
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.resources.NotFound
      # OPEN (hardening pass 1, disclosure): bucket names are unique in the cluster (see Bucket),
      # so this refusal tells any caller that some account holds the name. Kept: an address must
      # never name two accounts' buckets. Owner to confirm.
      - name: name-taken
        when_related:
          entity: weft.resources.Bucket
          where:
            all:
              - name == input.name
              - state != Deleted
          exists: true
        error: weft.resources.BucketNameTaken
      # Usage against the quota is weft.metering's check (layer 8, above this one; see the OPEN on
      # weft.accounts.Quota): weft.accounts stores limits only, so this stays an external refusal.
      - name: quota-exceeded
        external: another bucket would exceed the storage quota of the scope
        error: weft.resources.QuotaExceeded
      - name: created
        creates: weft.resources.Bucket
        instance: bucket_id
        sets:
          scope_id: input.scope_id
          name: input.name
        emits: [weft.resources.BucketCreated]
        payload:
          weft.resources.BucketCreated:
            bucket_id: {generated: true}
            scope_id: input.scope_id
            name: input.name

  # Brief (Bucket). Reported by the provisioner, as for volumes.
  # weft@6798e7d:ess/3-resources/resources.yaml:775
  - name: weft.resources.ReportBucketProvisioned
    naming:
      display: Report a bucket provisioned
    input:
      - {name: bucket_id, type: weft.shared.BucketId}
      - {name: result, type: weft.resources.ProvisionResult}
      - {name: reason, type: Optional<String>}
    outcomes:
