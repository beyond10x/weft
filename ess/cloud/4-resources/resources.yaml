# Moved from weft@6798e7d:ess/3-resources/resources.yaml.
# Comments are weft's at that commit: "sketch", "section" and "design" cite weft's documents, and
# where a comment says account or tenant, the block reads scope (docs/boundary.md, D1 A).
# Resources: the tenant-owned storage units a claim is bound to. Source: docs/domain-sketch.md
# section 6 "Resources" (lines 382-405).
# ResourceClass and Device are operator-owned and live in weft.inventory (layer 1,
# docs/layers.md "Splits the graph shows"). Claim and Binding name an instance or a component and
# live in weft.claims (layer 5, runtime): they moved there on 2026-11-26 because Claim.holder
# pointed up to layer 4. weft.claims names the units of this file through weft.shared.VolumeId,
# FilesystemId and BucketId and moves Volume rows (attach, detach) itself; this file names
# nothing of weft.claims. A volume with a writer is Attached (a stored state DeleteVolume reads);
# every other check that a unit is still claimed is an external refusal.
#
# Decisions this file takes:
# - Storage classes with concrete units get entities: Volume, Filesystem, Bucket,
#   VolumeSnapshot. Compute devices (gpu, gpu-slice, accelerator, interconnect) are
#   weft.inventory.Device. `cpu`, `memory`, `scratch` and `cache` are amounts on a node and need
#   no unit record.
#   OPEN: is the `cache` class (section 6 line 401) node-local scratch for caching, or the
#   catalog's `cache` offering (section 13 line 518)? Taken: a node-local amount.
# - Network, security and limit classes: see weft.claims.
# UNMAPPED: the sketch says nothing about ownership between these records. Every relation in this
# file is `references` (no record is deleted; each ends in a terminal state). Owner to confirm,
# in particular VolumeSnapshot -> Volume, which could be `owns`.
domain: weft.resources

summary: >-
  The scope-owned storage units: volumes, filesystems, buckets and volume snapshots.

naming:
  wire: weft
  display: Resources

types:
  # What a provisioner reports for a storage unit it was asked to create.
  # weft@6798e7d:ess/3-resources/resources.yaml:33
  - name: weft.resources.ProvisionResult
    kind: enum
    variants: [Ready, Failed]

entities:
  # Brief (Volume) and section 6 line 401 `volume`: persistent, bound to a zone or to one node,
  # one writer at a time. Lifetime independent (section 6 line 393): it outlives instances.
  # OPEN: what provisions a zone volume (a storage backend of the cluster, or the node agent of
  # the node it first attaches to)? Taken: the provisioner reports through
  # ReportVolumeProvisioned, issued by the NodeAgent actor.
  # OPEN: may read-only readers stay attached while a writer attaches? Taken: no; a writer
  # attaches only to a volume with no binding, and a reader only to one without a writer.
  # Brief: one writer. The writer is a weft.claims.Binding (layer 5), which names this volume; the
  # volume does not name its writer (that would point up), it is Attached while the writer holds
  # it. weft.claims.CommitVolumeWriter attaches it and weft.claims.ReleaseBinding detaches it.
  # weft@6798e7d:ess/3-resources/resources.yaml:48
  - name: weft.resources.Volume
    naming:
      summary: A persistent block volume of one scope, bound to a zone or one node, with at most one writer.
    identity:
      name: volume_id
      type: weft.shared.VolumeId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: size_bytes
        type: Integer
      - name: zone
        type: weft.shared.ZoneName
      # Set for a node-bound volume (scope node-local).
      - name: node_id
        type: Optional<weft.shared.NodeId>
      - name: source_snapshot_id
        type: Optional<weft.shared.VolumeSnapshotId>
    invariants:
      - size_bytes > 0
    relations:
      - name: scope
        kind: references
        target: weft.scope.Scope
        cardinality: one
        via: scope_id
      - name: zone
        kind: references
        target: weft.infrastructure.Zone
        cardinality: one
        via: zone
      - name: node
        kind: references
        target: weft.infrastructure.Node
        cardinality: one
        via: node_id
      - name: source_snapshot
        kind: references
        target: weft.resources.VolumeSnapshot
        cardinality: one
        via: source_snapshot_id
    lifecycle:
      initial: Provisioning
      states:
        - {name: Provisioning, summary: Being created; not attachable.}
        - {name: Available, summary: Created and without a writer.}
        - {name: Attached, summary: Written by exactly one exclusive binding.}
        - {name: Failed, summary: Could not be created.}
        - {name: Deleted, summary: Removed with its data.}
      terminal: [Deleted]
      transitions:
        - {name: provisioned, from: [Provisioning], to: Available}
        - {name: fail, from: [Provisioning], to: Failed}
        - {name: attach, from: [Available], to: Attached}
        - {name: detach, from: [Attached], to: Available}
        - {name: delete, from: [Available, Failed], to: Deleted}

  # Brief (VolumeSnapshot) and section 6 line 401 `snapshot`: a point-in-time copy of a volume, in
  # the volume's account and zone; a new volume can be restored from it.
  # weft@6798e7d:ess/3-resources/resources.yaml:107
  - name: weft.resources.VolumeSnapshot
    naming:
      summary: A point-in-time copy of a volume, from which a new volume of the same scope can be created.
    identity:
      name: volume_snapshot_id
      type: weft.shared.VolumeSnapshotId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: volume_id
        type: weft.shared.VolumeId
      - name: size_bytes
        type: Integer
      - name: zone
        type: weft.shared.ZoneName
    relations:
      - name: scope
        kind: references
        target: weft.scope.Scope
        cardinality: one
        via: scope_id
      - name: zone
        kind: references
        target: weft.infrastructure.Zone
        cardinality: one
        via: zone
      - name: volume
        kind: references
        target: weft.resources.Volume
        cardinality: one
        via: volume_id
    lifecycle:
      initial: Pending
      states:
        - {name: Pending, summary: Being taken.}
        - {name: Ready, summary: Complete; a volume can be restored from it.}
        - {name: Failed, summary: Could not be taken.}
        - {name: Deleted, summary: Removed.}
      terminal: [Deleted]
      transitions:
        - {name: ready, from: [Pending], to: Ready}
        - {name: fail, from: [Pending], to: Failed}
        - {name: delete, from: [Ready, Failed], to: Deleted}

  # Brief (Filesystem) and section 6 line 401 `filesystem`: a shared filesystem of one account
  # in one zone; several claims may read and write it at once.
  # OPEN: is a filesystem zone-scoped or cluster-scoped? Taken: zone.
  # OPEN: sketch Open points (lines 630-631) leave the home of `filesystem` (resources or the
  # catalog's `object-store`) to the integration pass. Taken: modelled here until then.
  # weft@6798e7d:ess/3-resources/resources.yaml:156
  - name: weft.resources.Filesystem
    naming:
      summary: A shared filesystem of one scope in one zone, mountable by several holders at once.
    identity:
      name: filesystem_id
      type: weft.shared.FilesystemId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: size_bytes
        type: Integer
      - name: zone
        type: weft.shared.ZoneName
    invariants:
      - size_bytes > 0
    relations:
      - name: scope
        kind: references
        target: weft.scope.Scope
        cardinality: one
        via: scope_id
      - name: zone
        kind: references
        target: weft.infrastructure.Zone
        cardinality: one
        via: zone
    lifecycle:
      initial: Provisioning
      states:
        - {name: Provisioning, summary: Being created.}
        - {name: Available, summary: Created and mountable.}
        - {name: Failed, summary: Could not be created.}
        - {name: Deleted, summary: Removed with its data.}
      terminal: [Deleted]
      transitions:
        - {name: provisioned, from: [Provisioning], to: Available}
        - {name: fail, from: [Provisioning], to: Failed}
        - {name: delete, from: [Available, Failed], to: Deleted}

  # Brief (Bucket) and section 6 line 401 `bucket`: an object store bucket of one account,
  # reachable from the whole cluster.
  # OPEN: is a bucket name unique in the cluster or in the account? Taken: in the cluster, so an
  # address never names two accounts' buckets.
  # The sketch contradicts itself: section 13 line 521 says the catalog's `object-store`
  # "moves `bucket` out of resources", section 6 line 401 lists `bucket` here, and Open points
  # (lines 630-631) leave the home to the integration pass. Decided in the integration pass
  # (2026-11-26, caller's decision): buckets stay here; the catalog's object-store offering refers
  # to a bucket by weft.shared.BucketId.
  # weft@6798e7d:ess/3-resources/resources.yaml:204
  - name: weft.resources.Bucket
    naming:
      summary: An object storage bucket of one scope, reachable from the whole cluster.
    identity:
      name: bucket_id
      type: weft.shared.BucketId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: name
        type: String
    relations:
      - name: scope
        kind: references
        target: weft.scope.Scope
        cardinality: one
        via: scope_id
    lifecycle:
      initial: Provisioning
      states:
        - {name: Provisioning, summary: Being created.}
        - {name: Available, summary: Created and usable.}
        - {name: Failed, summary: Could not be created.}
        - {name: Deleted, summary: Removed with its objects.}
      terminal: [Deleted]
      transitions:
        - {name: provisioned, from: [Provisioning], to: Available}
        - {name: fail, from: [Provisioning], to: Failed}
        - {name: delete, from: [Available, Failed], to: Deleted}

errors:
  # hardening pass 1 D3: also answers when the request names an account other than the caller's,
  # or a record of another account, so a foreign record and a missing one answer the same.
  # weft@6798e7d:ess/3-resources/resources.yaml:237
  - name: weft.resources.NotFound
    summary: The addressed record does not exist in the scope the request acts in, and nothing changed.
  # weft@6798e7d:ess/3-resources/resources.yaml:239
  - name: weft.resources.StateConflict
    summary: The addressed record is not in a state this command acts from, and nothing changed.
  # weft@6798e7d:ess/3-resources/resources.yaml:241
  - name: weft.resources.InvalidAmount
    summary: The amount is not a positive number.
  # weft@6798e7d:ess/3-resources/resources.yaml:243
  - name: weft.resources.QuotaExceeded
    summary: The claim would exceed the quota of the scope.
  # hardening pass 1 disclosure (resources.yaml:411): also answers for a unit of another account,
  # which replaced weft.resources.ForeignResource, so another account's unit and a missing one
  # answer the same.
  # weft@6798e7d:ess/3-resources/resources.yaml:248
  - name: weft.resources.UnitNotFound
    summary: The volume or snapshot the request names does not exist in the scope the request acts in.
  # weft@6798e7d:ess/3-resources/resources.yaml:250
  - name: weft.resources.UnitNotAvailable
    summary: The unit the request names is not in a usable state.
  # weft@6798e7d:ess/3-resources/resources.yaml:252
  - name: weft.resources.VolumeTooSmall
    summary: The volume would be smaller than the snapshot it is restored from.
  # weft@6798e7d:ess/3-resources/resources.yaml:254
  - name: weft.resources.UnitInUse
    summary: Claims or bindings still use the unit, so it is not deleted.
  # weft@6798e7d:ess/3-resources/resources.yaml:256
  - name: weft.resources.BucketNameTaken
    summary: A bucket of this name exists in the cluster.
  # weft@6798e7d:ess/3-resources/resources.yaml:258
  - name: weft.resources.BucketNotEmpty
    summary: The bucket still holds objects, so it is not deleted.

events:
  # weft@6798e7d:ess/3-resources/resources.yaml:262
  - name: weft.resources.VolumeCreated
    fields:
      - {name: volume_id, type: weft.shared.VolumeId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: size_bytes, type: Integer}
      - {name: zone, type: weft.shared.ZoneName}
      - {name: node_id, type: Optional<weft.shared.NodeId>}

  # Soundness pass (2026-11-26): the restored volume's event, emitted by RestoreVolume. It took
  # `source_snapshot_id` from VolumeCreated, which CreateVolume can no longer fill (ESS has no
  # payload source for an absent value).
  # weft@6798e7d:ess/3-resources/resources.yaml:273
  - name: weft.resources.VolumeRestored
    fields:
      - {name: volume_id, type: weft.shared.VolumeId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: size_bytes, type: Integer}
      - {name: zone, type: weft.shared.ZoneName}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: source_snapshot_id, type: weft.shared.VolumeSnapshotId}

  # weft@6798e7d:ess/3-resources/resources.yaml:282
  - name: weft.resources.VolumeProvisioned
    fields:
      - {name: volume_id, type: weft.shared.VolumeId}

  # weft@6798e7d:ess/3-resources/resources.yaml:286
  - name: weft.resources.VolumeFailed
    fields:
      - {name: volume_id, type: weft.shared.VolumeId}
      - {name: reason, type: Optional<String>}

  # weft@6798e7d:ess/3-resources/resources.yaml:291
  - name: weft.resources.VolumeDeleted
    fields:
      - {name: volume_id, type: weft.shared.VolumeId}

  # weft@6798e7d:ess/3-resources/resources.yaml:295
  - name: weft.resources.VolumeSnapshotRequested
    fields:
      - {name: volume_snapshot_id, type: weft.shared.VolumeSnapshotId}
      - {name: volume_id, type: weft.shared.VolumeId}
      - {name: scope_id, type: weft.shared.ScopeId}

  # weft@6798e7d:ess/3-resources/resources.yaml:301
  - name: weft.resources.VolumeSnapshotReady
    fields:
      - {name: volume_snapshot_id, type: weft.shared.VolumeSnapshotId}

  # weft@6798e7d:ess/3-resources/resources.yaml:305
  - name: weft.resources.VolumeSnapshotFailed
    fields:
      - {name: volume_snapshot_id, type: weft.shared.VolumeSnapshotId}
      - {name: reason, type: Optional<String>}

  # weft@6798e7d:ess/3-resources/resources.yaml:310
  - name: weft.resources.VolumeSnapshotDeleted
    fields:
      - {name: volume_snapshot_id, type: weft.shared.VolumeSnapshotId}

  # weft@6798e7d:ess/3-resources/resources.yaml:314
  - name: weft.resources.FilesystemCreated
    fields:
      - {name: filesystem_id, type: weft.shared.FilesystemId}
      - {name: scope_id, type: weft.shared.ScopeId}
