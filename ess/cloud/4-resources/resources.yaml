        unknown_instance: true
        error: weft.resources.NotFound
      - name: failed
        when: result == Failed
        moves: weft.resources.Bucket.fail
        instance: bucket_id
        emits: [weft.resources.BucketFailed]
        payload:
          weft.resources.BucketFailed:
            bucket_id: input.bucket_id
            reason: input.reason
      - name: provisioned
        moves: weft.resources.Bucket.provisioned
        instance: bucket_id
        emits: [weft.resources.BucketProvisioned]
        payload:
          weft.resources.BucketProvisioned:
            bucket_id: input.bucket_id
      - name: wrong-state
        wrong_state: true
        error: weft.resources.StateConflict

  # Brief (Bucket). A bucket a claim still names, or one that holds objects, is not deleted.
  # OPEN: should deleting a bucket remove its objects? Taken: no; a bucket with objects is refused.
  # weft@6798e7d:ess/3-resources/resources.yaml:808
  - name: weft.resources.DeleteBucket
    naming:
      display: Delete a bucket
    input:
      - {name: bucket_id, type: weft.shared.BucketId}
    outcomes:
      - name: no-such-bucket
        unknown_instance: true
        error: weft.resources.NotFound
      # hardening pass 1 D3: another account's bucket answers like a missing one, before its use,
      # contents or state.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.resources.NotFound
      # Claims are weft.claims (layer 5), and no state of this unit records them (weft.claims moves
      # only Volume rows), so the check is an external refusal.
      - name: in-use
        external: a claim of weft.claims that is not Released names the bucket
        error: weft.resources.UnitInUse
      - name: not-empty
        # The objects are data in the object store, which weft does not model as rows.
        external: the object store still holds objects in the bucket
        error: weft.resources.BucketNotEmpty
      - name: deleted
        moves: weft.resources.Bucket.delete
        instance: bucket_id
        emits: [weft.resources.BucketDeleted]
        payload:
          weft.resources.BucketDeleted:
            bucket_id: input.bucket_id
      - name: wrong-state
        wrong_state: true
        error: weft.resources.StateConflict

