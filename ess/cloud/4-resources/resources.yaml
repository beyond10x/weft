      - {name: zone, type: weft.shared.ZoneName}

  # weft@6798e7d:ess/3-resources/resources.yaml:321
  - name: weft.resources.FilesystemProvisioned
    fields:
      - {name: filesystem_id, type: weft.shared.FilesystemId}

  # weft@6798e7d:ess/3-resources/resources.yaml:325
  - name: weft.resources.FilesystemFailed
    fields:
      - {name: filesystem_id, type: weft.shared.FilesystemId}
