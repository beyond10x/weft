# New in cloudspec (docs/boundary.md, decision D1 A); no weft source. Every owned entity of the
# blocks above carries `scope_id`, and every guard that ties a request to its owner compares it
# with `caller.scope_id`. A deployment maps its own boundary onto a scope: a Kubernetes namespace,
# a vendor account or project, an account of a multi-tenant product.
domain: weft.scope

summary: >-
  The ownership and isolation boundary: every owned row names one scope, a request acts in one
  scope, and instances of different scopes never share a kernel.

naming:
  wire: weft
  display: Scope

types:
  # story:scope-placement: how long a scope may hold a leased machine of a pool, in whole hours.
  - name: weft.scope.Lease
    kind: struct
    fields:
      - name: max_hours
        type: Integer
  # story:scope-placement: where a scope may run, declared at design time; the placement decision
  # within it is a run-time record of the runtime (D7 A). Exactly one of `host` (a named host, a
  # node of layer 2 or a machine the runtime knows by name) and `pool` (a node pool of layer 2 by
  # name, whose machines are leased); `lease` only with `pool`.
  - name: weft.scope.Placement
    kind: struct
    fields:
      - name: host
        type: Optional<String>
      - name: pool
        type: Optional<String>
      - name: lease
        type: Optional<weft.scope.Lease>

entities:
  - name: weft.scope.Scope
    naming:
      summary: One ownership and isolation boundary; rows of a scope are invisible to a caller acting in another.
    identity:
      name: scope_id
      type: weft.shared.ScopeId
    fields:
      - name: name
        type: String
      - name: placement
        type: Optional<weft.scope.Placement>
    lifecycle:
      initial: Open
      states:
        - {name: Open, summary: Rows may be created in the scope.}
        - {name: Closed, summary: The scope takes no new rows; what it owns is removed by the commands bound to its close.}
      terminal: [Closed]
      transitions:
        - {name: close, from: [Open], to: Closed}

errors:
  - name: weft.scope.NotFound
    summary: No scope has this identifier, and nothing changed.
  - name: weft.scope.StateConflict
    summary: The scope is not in a state this command acts from, and nothing changed.
  - name: weft.scope.ScopeNameTaken
    summary: An open scope already has this name, and nothing was created.
  - name: weft.scope.PlacementForm
    summary: The placement names both a host and a pool, neither, a lease without a pool, or a lease of less than one hour, and nothing was created.

events:
  - name: weft.scope.ScopeOpened
    fields:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: name, type: String}
  - name: weft.scope.ScopeClosed
    fields:
      - {name: scope_id, type: weft.shared.ScopeId}

commands:
  - name: weft.scope.OpenScope
    naming:
      display: Open a scope
    input:
      - {name: name, type: String}
      - {name: placement, type: Optional<weft.scope.Placement>}
    response:
      - {name: scope_id, type: weft.shared.ScopeId}
    outcomes:
      - name: placement-form
        when:
          all:
            - defined(placement)
            - any:
                - all: [defined(placement.host), defined(placement.pool)]
                - all: [not defined(placement.host), not defined(placement.pool)]
                - all: [defined(placement.host), defined(placement.lease)]
                - all: [defined(placement.lease), placement.lease.max_hours < 1]
        error: weft.scope.PlacementForm
      - name: name-taken
        when_related:
          entity: weft.scope.Scope
          where:
            all:
              - name == input.name
              - state == Open
          exists: true
        error: weft.scope.ScopeNameTaken
      - name: opened
        creates: weft.scope.Scope
        instance: scope_id
        returns: true
        sets:
          name: input.name
          placement: input.placement
        emits: [weft.scope.ScopeOpened]
        payload:
          weft.scope.ScopeOpened:
            scope_id: {response: scope_id}
            name: input.name

  - name: weft.scope.CloseScope
    naming:
      display: Close a scope
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
    outcomes:
      - name: no-such-scope
        unknown_instance: true
        error: weft.scope.NotFound
      - name: closed
        moves: weft.scope.Scope.close
        instance: scope_id
        emits: [weft.scope.ScopeClosed]
        payload:
          weft.scope.ScopeClosed:
            scope_id: input.scope_id
      - name: wrong-state
        wrong_state: true
        error: weft.scope.StateConflict

views:
  - name: weft.scope.Scopes
    source: weft.scope.Scope
    consistency: read_your_writes
    fields:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: name, type: String}
      - {name: state, type: weft.scope.Scope.State}
