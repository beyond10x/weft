commands:
  # Section 5 "Translator: registered per source kind and version"; "A new source kind arrives
  # as a new translator".
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1068
  - name: weft.deployments.RegisterTranslator
    naming:
      display: Register a translator
    input:
      - {name: source_kind, type: weft.deployments.SourceKind}
      - {name: source_format_version, type: weft.deployments.SourceFormatVersion}
      - {name: translator_version, type: weft.deployments.TranslatorVersion}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
    outcomes:
      - name: exists
        when_related:
          entity: weft.deployments.Translator
          where:
            all:
              - source_kind == input.source_kind
              - source_format_version == input.source_format_version
              - translator_version == input.translator_version
          exists: true
        error: weft.deployments.TranslatorExists
      - name: registered
        creates: weft.deployments.Translator
        instance: translator_id
        sets:
          source_kind: input.source_kind
          source_format_version: input.source_format_version
          translator_version: input.translator_version
          artifact_digest: input.artifact_digest
          registered_at: {generated: true}
        emits: [weft.deployments.TranslatorRegistered]
        payload:
          weft.deployments.TranslatorRegistered:
            translator_id: {generated: true}
            source_kind: input.source_kind
            source_format_version: input.source_format_version
            translator_version: input.translator_version

  # Section 5 "Translator" (OPEN lifecycle, see the entity).
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1105
  - name: weft.deployments.RetireTranslator
    naming:
      display: Retire a translator
    input:
      - {name: translator_id, type: weft.shared.TranslatorId}
    outcomes:
      - name: no-such-translator
        unknown_instance: true
        error: weft.deployments.NotFound
      - name: retired
        moves: weft.deployments.Translator.retire
        instance: translator_id
        emits: [weft.deployments.TranslatorRetired]
        payload:
          weft.deployments.TranslatorRetired:
            translator_id: input.translator_id
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "A user deploys a DeploymentSource"; CLI `weft deploy shop.yaml`,
  # `weft deploy chart/ --values prod.yaml`, `weft deploy system.yaml`.
  # The role binding itself is checked by the management API's authorization (section 2: "every
  # management call is authorized against RoleBindings"), which sets caller.scope_id; this
  # command ties the account, the formation and each values file's environment to it.
  # The submitter is the caller (hardening pass 1 D2): the request no longer names it.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1131
  - name: weft.deployments.SubmitDeploymentSource
    naming:
      display: Submit a deployment source
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: kind, type: weft.deployments.SourceKind}
      - {name: format_version, type: weft.deployments.SourceFormatVersion}
      - {name: source_digest, type: weft.deployments.SourceDigest}
      - {name: helm_values, type: List<weft.deployments.HelmValues>}
      - {name: embedded_in, type: Optional<weft.deployments.EmbeddingPlace>}
      # Section 5 "Translator: registered per source kind and version": the translator the caller
      # means to translate this source with, the same choice TranslateSource takes (the CLI picks
      # the newest registered one for the kind and format version). Checked here by its row, so a
      # source no registered translator reads is refused at submit. A cloudspec source is read
      # unchanged and names none (translator-not-allowed); every other kind names one
      # (translator-required).
      - {name: translator_id, type: Optional<weft.shared.TranslatorId>}
      # cloudspec only: the submission's `digests` (docs/layers.md § 11), both required for kind
      # Cloudspec and refused for every other kind.
      - {name: architecture_digest, type: Optional<weft.deployments.SourceDigest>}
      - {name: binding_digest, type: Optional<weft.deployments.SourceDigest>}
    outcomes:
      # hardening pass 1 D3: the account must be the one the request acts in; another account
      # answers like a missing row, so it is not disclosed.
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.deployments.NotFound
      - name: values-not-helm
        when:
          all:
            - kind != Helm
            - helm_values.count > 0
        error: weft.deployments.ValuesOnlyForHelm
      - name: not-a-spec-source
        when:
          all:
            - embedded_in: {defined: true}
            - kind: {in: [Weft, Compose, Helm, Kubernetes]}
        error: weft.deployments.NotASpecSource
      # Input guards on the kind: they read no row, so they answer before the translator's row is
      # read, and an absent translator_id (kind Cloudspec) reads no row at all.
      - name: translator-required
        when:
          all:
            - kind != Cloudspec
            - translator_id: {defined: false}
        error: weft.deployments.TranslatorRequired
      - name: translator-not-allowed
        when:
          all:
            - kind == Cloudspec
            - translator_id: {defined: true}
        error: weft.deployments.TranslatorNotAllowed
      - name: digests-required
        when:
          all:
            - kind == Cloudspec
            - any:
                - architecture_digest: {defined: false}
                - binding_digest: {defined: false}
        error: weft.deployments.DigestsRequired
      - name: digests-not-cloudspec
        when:
          all:
            - kind != Cloudspec
            - any:
                - architecture_digest: {defined: true}
                - binding_digest: {defined: true}
        error: weft.deployments.DigestsOnlyForCloudspec
      # hardening pass 1 W4: a source of one account is never filed under another account's
      # formation (TranslateSource copies the formation into the translation, and every plan and
      # release follows it). A foreign formation answers like a missing one.
      - name: formation-missing
        when_related: {via: input.formation_id, exists: false}
        error: weft.deployments.NotFound
      # The translator is read by the row the input names, not as a row set over every
      # translator: ESS 0.99.2 synthesis does not arrange a row-set guard's rows on a creating
      # command used as a scenario prefix (beyond10x/ess#642), which left every later outcome of
      # this domain without a scenario.
      - name: no-translator
        when_related: {via: input.translator_id, exists: false}
        error: weft.deployments.NoTranslator
      # hardening pass 1 W4 (see formation-missing).
      - name: formation-foreign
        when_related: {via: input.formation_id, predicate: scope_id != input.scope_id}
        error: weft.deployments.NotFound
      - name: translator-not-for-source
        when_related:
          via: input.translator_id
          predicate:
            any:
              - state != Registered
              - source_kind != input.kind
              - source_format_version != input.format_version
        error: weft.deployments.NoTranslator
      # hardening pass 1 W8: every values file names an environment of the source's formation, so
      # TranslateSource (no-values-for-environment) cannot render the chart with another
      # formation's environment. A foreign environment answers like a missing one.
      # OPEN: a row set on this creating command may meet beyond10x/ess#642 (rows of a prefix
      # step's row-set guard not arranged); the integrator's synthesis run decides whether it stays.
      - name: values-environment-foreign
        when_related:
          entity: weft.architecture.Formation
          where:
            all:
              - formation_id == input.formation_id
              - exists:
                  in: input.helm_values
                  as: v
                  that:
                    not:
                      exists:
                        in: {entity: weft.architecture.Environment}
                        as: e
                        that: {all: [e.environment_id == v.environment_id, e.formation_id == formation_id]}
          exists: true
        error: weft.deployments.NotFound
      - name: submitted
        creates: weft.deployments.DeploymentSource
        instance: source_id
        sets:
          scope_id: input.scope_id
          formation_id: input.formation_id
          kind: input.kind
          format_version: input.format_version
          source_digest: input.source_digest
          helm_values: input.helm_values
          embedded_in: input.embedded_in
          architecture_digest: input.architecture_digest
          binding_digest: input.binding_digest
          # hardening pass 1 D2: the submitter is the authenticated caller, not a request field.
          submitted_by: {caller: principal_id}
          submitted_at: {generated: true}
        emits: [weft.deployments.SourceSubmitted]
        payload:
          weft.deployments.SourceSubmitted:
            source_id: {generated: true}
            scope_id: input.scope_id
            formation_id: input.formation_id
            kind: input.kind
            source_digest: input.source_digest

  # Section 5 "Deployment sources" (OPEN lifecycle, see the entity).
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1237
  - name: weft.deployments.WithdrawDeploymentSource
    naming:
      display: Withdraw a deployment source
    input:
      - {name: source_id, type: weft.shared.DeploymentSourceId}
    outcomes:
      - name: no-such-source
        unknown_instance: true
        error: weft.deployments.NotFound
      # hardening pass 1 D3: a source of another account than the one the request acts in answers
      # like a missing one, before its state is read.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.deployments.NotFound
      - name: withdrawn
        moves: weft.deployments.DeploymentSource.withdraw
        instance: source_id
        emits: [weft.deployments.SourceWithdrawn]
        payload:
          weft.deployments.SourceWithdrawn:
            source_id: input.source_id
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "Translation: source digest + translator version -> FormationRevision +
  # CoverageReport"; "Helm: rendered with its values, then read as kubernetes". The request names
  # the source kind and format version it means; both are checked against the source and the
  # translator, so the translator reads the source's kind and version. The digest, formation and
  # translator version are copied from the rows (no command changes them), so the translation
  # records exactly the bytes and the translator that ran. (The request named them too, compared
  # field by field: the refusals got no scenario and made synthesis of this command take minutes
  # in ESS 0.99.2.)
  # OPEN: whether the caller picks the translator or weft picks the newest registered one for the
  # kind and format version. Taken: the caller names it (the CLI picks the newest).
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1272
  - name: weft.deployments.TranslateSource
    naming:
      display: Translate a deployment source
    input:
      - {name: source_id, type: weft.shared.DeploymentSourceId}
      # Isolation pass 2: the account the request acts in, so the source can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: source_kind, type: weft.deployments.SourceKind}
      - {name: source_format_version, type: weft.deployments.SourceFormatVersion}
      - {name: translator_id, type: weft.shared.TranslatorId}
      - {name: environment_id, type: Optional<weft.shared.EnvironmentId>}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing source (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.deployments.NotFound
      - name: environment-required
        when:
          all:
            - source_kind == Helm
            - environment_id: {defined: false}
        error: weft.deployments.EnvironmentRequired
      - name: environment-not-helm
        when:
          all:
            - source_kind != Helm
            - environment_id: {defined: true}
        error: weft.deployments.ValuesOnlyForHelm
      - name: no-such-source
        when_related: {via: input.source_id, exists: false}
        error: weft.deployments.NotFound
      - name: no-such-translator
        when_related: {via: input.translator_id, exists: false}
        error: weft.deployments.NotFound
      # Isolation pass 2: a source of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: source-of-other-scope
        when_related: {via: input.source_id, predicate: scope_id != input.scope_id}
        error: weft.deployments.NotFound
      - name: source-withdrawn
        when_related: {via: input.source_id, predicate: state == Withdrawn}
        error: weft.deployments.SourceIsWithdrawn
      - name: translator-retired
        when_related: {via: input.translator_id, predicate: state == Retired}
        error: weft.deployments.TranslatorIsRetired
      - name: source-mismatch
        when_related:
          via: input.source_id
          predicate:
            any:
              - kind != input.source_kind
              - format_version != input.source_format_version
        error: weft.deployments.SourceMismatch
      - name: translator-mismatch
        when_related:
          via: input.translator_id
          predicate:
            any:
              - source_kind != input.source_kind
              - source_format_version != input.source_format_version
        error: weft.deployments.TranslatorMismatch
      - name: no-values-for-environment
        when_related:
          via: input.source_id
          predicate:
            all:
              - kind == Helm
              - not:
                  exists:
                    in: helm_values
                    as: v
                    that: v.environment_id == input.environment_id
        error: weft.deployments.NoValuesForEnvironment
      # UNMAPPED: the refusal of a second translation of one source by one translator for one
      # environment (error AlreadyTranslated, a row set over Translation) is not declared. ESS
      # 0.99.2 synthesis arranges no row beside a row-set guard when another guard of the command
      # compares a required field of a related row with the input (source-mismatch,
      # translator-mismatch): every outcome of this command and every later step of the domain went
      # without a scenario. The comparisons are what makes the translator read the source's kind
      # and version, so they stay. A repeated request makes a second translation of the same
      # revision (the translator is deterministic). Open question for ESS (strict beside-row search
      # in synthesize/related_guard.rs) and for the owner: whether the refusal is wanted back once
      # ESS arranges it.
      - name: requested
        creates: weft.deployments.Translation
        instance: translation_id
        sets:
          source_id: input.source_id
          scope_id: {related: {via: input.source_id, field: scope_id}}
          formation_id: {related: {via: input.source_id, field: formation_id}}
          source_digest: {related: {via: input.source_id, field: source_digest}}
          translator_id: input.translator_id
          translator_version: {related: {via: input.translator_id, field: translator_version}}
          environment_id: input.environment_id
          requested_at: {generated: true}
        emits: [weft.deployments.TranslationRequested]
        payload:
          weft.deployments.TranslationRequested:
            translation_id: {generated: true}
            source_id: input.source_id
            source_digest: {related: {via: input.source_id, field: source_digest}}
            translator_id: input.translator_id
            translator_version: {related: {via: input.translator_id, field: translator_version}}
            environment_id: input.environment_id

  # Section 5 "CoverageReport: every object of the source with its outcome: mapped (to which
  # formation element), mapped with loss (what was dropped), or refused (the named reason)."
  # Issued by the Translator actor while the translation runs.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1382
  - name: weft.deployments.RecordCoverageEntry
    naming:
      display: Record one source object's coverage
    input:
      - {name: translation_id, type: weft.shared.TranslationId}
      # Scope isolation (story blocks-scope-isolation): the scope the request acts in, so the
      # row can be tied to the caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: object, type: weft.deployments.SourceObject}
      - {name: kubernetes_kind, type: Optional<weft.deployments.KubernetesKind>}
      - {name: outcome, type: weft.deployments.CoverageOutcome}
      - {name: element, type: weft.deployments.FormationElementKind}
      - {name: element_name, type: Optional<String>}
      - {name: lost, type: Optional<String>}
      - {name: refusal, type: Optional<weft.deployments.RefusalReason>}
    outcomes:
      # Scope isolation: the scope must be the caller's; it reads no row and answers like a
      # missing row (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.deployments.NotFound
      - name: refusal-unnamed
        when:
          all:
            - outcome == Refused
            - refusal: {defined: false}
        error: weft.deployments.RefusalUnnamed
      - name: loss-unnamed
        when:
          all:
            - outcome == MappedWithLoss
            - lost: {defined: false}
        error: weft.deployments.LossUnnamed
      - name: element-missing
        when:
          all:
            - outcome: {in: [Mapped, MappedWithLoss]}
            - element == Nothing
        error: weft.deployments.ElementMissing
      # Security default: a kind refused or OPEN in the checklist is never reported as mapped.
      - name: kind-not-mappable
        when:
          all:
            - outcome: {in: [Mapped, MappedWithLoss]}
            - kubernetes_kind.disposition: {in: [Refused, Open]}
        error: weft.deployments.KindNotMappable
      - name: no-such-translation
        when_related: {via: input.translation_id, exists: false}
        error: weft.deployments.NotFound
      # Scope isolation: a row of another scope answers like a missing one, after the existence
      # checks and before its state is read.
      - name: translation-of-other-scope
        when_related: {via: input.translation_id, predicate: scope_id != input.scope_id}
        error: weft.deployments.NotFound
      - name: translation-closed
        when_related: {via: input.translation_id, predicate: state != Requested}
        error: weft.deployments.TranslationClosed
      - name: recorded
        creates: weft.deployments.CoverageEntry
        instance: entry_id
        sets:
          translation_id: input.translation_id
          object: input.object
          kubernetes_kind: input.kubernetes_kind
          outcome: input.outcome
          element: input.element
          element_name: input.element_name
          lost: input.lost
          refusal: input.refusal
        emits: [weft.deployments.CoverageEntryRecorded]
        payload:
          weft.deployments.CoverageEntryRecorded:
            entry_id: {generated: true}
            translation_id: input.translation_id
            object: input.object
            outcome: input.outcome
            refusal: input.refusal

  # Section 5 "Translation: ... -> FormationRevision + CoverageReport". The translator ends a
  # translation with no refused object by naming the revision it wrote.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1449
  - name: weft.deployments.CompleteTranslation
    naming:
      display: Complete a translation
    input:
      - {name: translation_id, type: weft.shared.TranslationId}
      - {name: formation_revision_id, type: weft.shared.FormationRevisionId}
    outcomes:
      - name: no-such-translation
        unknown_instance: true
        error: weft.deployments.NotFound
      # hardening pass 1 (CompleteTranslation formation_revision_id): the revision a translator
      # names is a revision of the translation's own formation, never another formation's.
      - name: no-such-revision
        when_related: {via: input.formation_revision_id, exists: false}
        error: weft.deployments.NotFound
      - name: revision-of-other-formation
        when_related:
          entity: weft.architecture.FormationRevision
          where:
            all:
              - revision_id == input.formation_revision_id
              - formation_id != subject.formation_id
          exists: true
        error: weft.deployments.TranslationMismatch
      - name: has-refused-objects
        when_related:
          entity: weft.deployments.CoverageEntry
          where:
            all:
              - translation_id == input.translation_id
              - outcome == Refused
          exists: true
        error: weft.deployments.HasRefusedObjects
      # Scope isolation (story blocks-scope-isolation): a translation of another scope than the
      # caller's answers like a missing one. External: ESS 0.99.2 refuses a when_subject guard
      # beside the row-set guards above (ESS-COMMAND-009), and an external guard comes after them.
      - name: not-callers-scope
        external: the translation is of another scope than the caller's
        error: weft.deployments.NotFound
      - name: translated
        moves: weft.deployments.Translation.complete
        instance: translation_id
        sets:
          formation_revision_id: input.formation_revision_id
          completed_at: {generated: true}
        emits: [weft.deployments.SourceTranslated]
        payload:
          weft.deployments.SourceTranslated:
            translation_id: input.translation_id
            formation_revision_id: input.formation_revision_id
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "A deploy with a refused object stops." The translator ends a translation that
  # holds at least one refused object; it writes no revision. The translator names one refused
  # entry of the translation's report as the reason. (A row set over CoverageEntry here left
  # every scenario that passes through a refused translation without a witness in ESS 0.99.2:
  # a prefix step's row-set refusal is not arranged, beyond10x/ess#642.)
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1502
  - name: weft.deployments.RefuseTranslation
    naming:
      display: Refuse a translation
    input:
      - {name: translation_id, type: weft.shared.TranslationId}
      - {name: entry_id, type: weft.shared.CoverageEntryId}
    outcomes:
      - name: no-such-translation
        unknown_instance: true
        error: weft.deployments.NotFound
      # Scope isolation (story blocks-scope-isolation): a translation of another scope than the
      # caller's answers like a missing one, before its state is read.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.deployments.NotFound
      - name: no-refused-object
        when_related: {via: input.entry_id, exists: false}
        error: weft.deployments.NoRefusedObject
      - name: entry-not-refused
        when_related:
          via: input.entry_id
          predicate:
            any:
              - translation_id != input.translation_id
              - outcome != Refused
        error: weft.deployments.NoRefusedObject
      - name: refused
        moves: weft.deployments.Translation.refuse
        instance: translation_id
        sets:
          completed_at: {generated: true}
        emits: [weft.deployments.TranslationRefused]
        payload:
          weft.deployments.TranslationRefused:
            translation_id: input.translation_id
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "Translator" (OPEN: the sketch says nothing of a translator that fails; taken: the
  # translation ends Failed with the translator's message, and a new request may run again).
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1538
  - name: weft.deployments.FailTranslation
    naming:
      display: Record a failed translation
    input:
      - {name: translation_id, type: weft.shared.TranslationId}
      - {name: failure, type: String}
    outcomes:
      - name: no-such-translation
        unknown_instance: true
        error: weft.deployments.NotFound
      # Scope isolation (story blocks-scope-isolation): a translation of another scope than the
      # caller's answers like a missing one, before its state is read.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.deployments.NotFound
      - name: failed
        moves: weft.deployments.Translation.fail
        instance: translation_id
        sets:
          failure: input.failure
          completed_at: {generated: true}
        emits: [weft.deployments.TranslationFailed]
        payload:
          weft.deployments.TranslationFailed:
            translation_id: input.translation_id
            failure: input.failure
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "Plan: the diff between the live release and a new revision, plus a simulation,
  # shown before apply"; "A deploy with a refused object stops." CLI `weft plan`, and the first
  # step of `weft deploy`. The formation is the translation's, copied from its row (the request
  # named it too, compared beside the revision: that refusal got no scenario in ESS 0.99.2).
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1567
  - name: weft.deployments.CreatePlan
    naming:
      display: Plan a revision for an environment
    input:
      - {name: translation_id, type: weft.shared.TranslationId}
      # Isolation pass 2: the account the request acts in, so the translation can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: formation_revision_id, type: weft.shared.FormationRevisionId}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing translation (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.deployments.NotFound
      - name: no-such-translation
        when_related: {via: input.translation_id, exists: false}
        error: weft.deployments.NotFound
      # hardening pass 1 W4: the environment must exist (see environment-foreign).
      - name: no-such-environment
        when_related: {via: input.environment_id, exists: false}
        error: weft.deployments.NotFound
      # Isolation pass 2: a translation of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: translation-of-other-scope
        when_related: {via: input.translation_id, predicate: scope_id != input.scope_id}
        error: weft.deployments.NotFound
      # hardening pass 1 disclosure (CreatePlan translation_id): the revision tie answers before
      # any state of the translation, with the not-found error, so a translation of another
      # formation discloses neither its existence nor its state to a caller who does not hold its
      # revision. A translation that holds no revision yet (Requested, Refused, Failed) still
      # answers its state below.
      - name: translation-mismatch
        when_related:
          via: input.translation_id
          predicate:
            all:
              - formation_revision_id: {defined: true}
              - formation_revision_id != input.formation_revision_id
        error: weft.deployments.NotFound
      # hardening pass 1 W4: a plan's environment is an environment of the translation's
      # formation, so no plan (and no release) of one formation targets another formation's or
      # another account's environment. A foreign environment answers like a missing one.
      # OPEN: an earlier row set over CoverageEntry beside translation-mismatch left this command
      # without scenarios in ESS 0.99.2; the integrator's synthesis run decides whether this stays.
      - name: environment-foreign
        when_related:
          entity: weft.architecture.Environment
          where:
            all:
              - environment_id == input.environment_id
              - not:
                  exists:
                    in: {entity: weft.deployments.Translation}
                    as: t
                    that: {all: [t.translation_id == input.translation_id, t.formation_id == formation_id]}
          exists: true
        error: weft.deployments.NotFound
      # The goalpost's stop: any refused object in the coverage report stops the deploy. Read as
      # the translation's state: a translation is Refused exactly when its report holds a refused
      # object (RefuseTranslation requires one, CompleteTranslation refuses with one, and a closed
      # translation takes no new entry). A row set over CoverageEntry here left the command without
      # scenarios beside translation-mismatch (ESS 0.99.2, see TranslateSource).
      - name: deploy-refused
        when_related: {via: input.translation_id, predicate: state == Refused}
        error: weft.deployments.DeployRefused
      - name: not-translated
        when_related: {via: input.translation_id, predicate: state != Translated}
        error: weft.deployments.TranslationNotReady
      - name: values-for-other-environment
        when_related:
          via: input.translation_id
          predicate:
            all:
              - environment_id: {defined: true}
              - environment_id != input.environment_id
        error: weft.deployments.ValuesForOtherEnvironment
      - name: created
        creates: weft.deployments.Plan
        instance: plan_id
        sets:
          scope_id: {related: {via: input.translation_id, field: scope_id}}
          formation_id: {related: {via: input.translation_id, field: formation_id}}
          environment_id: input.environment_id
          formation_revision_id: input.formation_revision_id
          translation_id: input.translation_id
          # hardening pass 1 D2: the creator is the authenticated caller, not a request field.
          created_by: {caller: principal_id}
          created_at: {generated: true}
        emits: [weft.deployments.PlanCreated]
        payload:
          weft.deployments.PlanCreated:
            plan_id: {generated: true}
            environment_id: input.environment_id
            formation_revision_id: input.formation_revision_id

  # docs/layers.md § 11: a cloudspec source is read unchanged, with no translator and no
  # translation. The implementation copies the submitted architecture into a new revision of the
  # source's formation (its document digest is the source's architecture_digest) and plans it for
  # the environment; the plan names the source, so it traces to both digests.
  # UNMAPPED: the FormationRevision row itself. One outcome creates one record (here the plan), and
  # no command of weft.architecture (layer 9) may name a source of this layer, so the revision id
  # is minted by the implementation, as CommitRevision mints its document digest. Open question for
  # the integrator: a creation of the revision that a conformance step can observe.
  - name: weft.deployments.PlanFromSource
    naming:
      display: Plan a cloudspec source for an environment
    input:
      - {name: source_id, type: weft.shared.DeploymentSourceId}
      # The account the request acts in, so the source can be tied to the caller (a related row is
      # not compared with the caller directly), as in CreatePlan.
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
    outcomes:
      # The account must be the one the request acts in; it reads no row and answers like a
      # missing source.
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.deployments.NotFound
      - name: no-such-source
        when_related: {via: input.source_id, exists: false}
        error: weft.deployments.NotFound
      - name: no-such-environment
        when_related: {via: input.environment_id, exists: false}
        error: weft.deployments.NotFound
      # A source of another account answers like a missing one, after the existence checks and
      # before its kind or state is read.
      - name: source-of-other-scope
        when_related: {via: input.source_id, predicate: scope_id != input.scope_id}
        error: weft.deployments.NotFound
      - name: source-not-cloudspec
        when_related: {via: input.source_id, predicate: kind != Cloudspec}
        error: weft.deployments.SourceNotCloudspec
      - name: source-withdrawn
        when_related: {via: input.source_id, predicate: state == Withdrawn}
        error: weft.deployments.SourceIsWithdrawn
      # A plan's environment is an environment of the source's formation, so no plan of one
      # formation targets another formation's or another account's environment. A foreign
      # environment answers like a missing one (CreatePlan environment-foreign).
      - name: environment-foreign
        when_related:
          entity: weft.architecture.Environment
          where:
            all:
              - environment_id == input.environment_id
              - not:
                  exists:
                    in: {entity: weft.deployments.DeploymentSource}
                    as: s
                    that: {all: [s.source_id == input.source_id, s.formation_id == formation_id]}
          exists: true
        error: weft.deployments.NotFound
      - name: planned
        creates: weft.deployments.Plan
        instance: plan_id
        sets:
          scope_id: {related: {via: input.source_id, field: scope_id}}
          formation_id: {related: {via: input.source_id, field: formation_id}}
          environment_id: input.environment_id
          formation_revision_id: {generated: true}
          source_id: input.source_id
          created_by: {caller: principal_id}
          created_at: {generated: true}
        emits: [weft.deployments.PlanCreated]
        payload:
          weft.deployments.PlanCreated:
            plan_id: {generated: true}
            environment_id: input.environment_id
            formation_revision_id: {generated: true}

  # Section 5 "Simulation: a release checked without running it: placement, policy,
  # reachability. Result: pass, or a list of named violations." The control plane records the
  # diff and the simulation of a plan. Secret values never appear: a violation names a secret.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1730
  - name: weft.deployments.RecordPlanResult
    naming:
      display: Record a plan's diff and simulation
    input:
      - {name: plan_id, type: weft.shared.PlanId}
      - {name: live_release_id, type: Optional<weft.shared.ReleaseId>}
      - {name: diff, type: weft.deployments.PlanDiff}
      - {name: simulation, type: weft.deployments.Simulation}
    outcomes:
      - name: no-such-plan
        unknown_instance: true
        error: weft.deployments.NotFound
      # Scope isolation (story blocks-scope-isolation): a plan of another scope than the
      # caller's answers like a missing one, before its state is read.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.deployments.NotFound
      - name: blocked
        when: simulation.violations.count > 0
        moves: weft.deployments.Plan.block
        instance: plan_id
        sets:
          live_release_id: input.live_release_id
          diff: input.diff
          simulation: input.simulation
        emits: [weft.deployments.PlanBlocked]
        payload:
          weft.deployments.PlanBlocked:
            plan_id: input.plan_id
            violations: input.simulation.violations
      - name: passed
        moves: weft.deployments.Plan.pass
        instance: plan_id
        sets:
          live_release_id: input.live_release_id
          diff: input.diff
          simulation: input.simulation
        emits: [weft.deployments.PlanSimulated]
        payload:
          weft.deployments.PlanSimulated:
            plan_id: input.plan_id
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "Plan ... shown before apply": the user's "ask" step of `weft deploy` answered no.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:1782
  - name: weft.deployments.DiscardPlan
    naming:
      display: Discard a plan
    input:
      - {name: plan_id, type: weft.shared.PlanId}
    outcomes:
      - name: no-such-plan
        unknown_instance: true
        error: weft.deployments.NotFound
      # Isolation pass 2: only the plan's own account acts on it; another account's plan
      # answers like a missing one, before its state is read.
      - name: not-callers-scope
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.deployments.NotFound
      - name: discarded
        moves: weft.deployments.Plan.discard
        instance: plan_id
        emits: [weft.deployments.PlanDiscarded]
        payload:
          weft.deployments.PlanDiscarded:
            plan_id: input.plan_id
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

views:
  # Section 5 "Translator: registered per source kind and version".
  # weft@6798e7d:ess/6-delivery/deployments.yaml:2541
  - name: weft.deployments.Translators
    source: weft.deployments.Translator
    consistency: read_your_writes
    fields:
      - {name: translator_id, type: weft.shared.TranslatorId}
      - {name: source_kind, type: weft.deployments.SourceKind}
      - {name: source_format_version, type: weft.deployments.SourceFormatVersion}
      - {name: translator_version, type: weft.deployments.TranslatorVersion}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: registered_at, type: Timestamp}
      - {name: state, type: weft.deployments.Translator.State}

  # Section 5 "Deployment sources", per account.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:2554
  - name: weft.deployments.DeploymentSources
    source: weft.deployments.DeploymentSource
    consistency: read_your_writes
    params:
      - {name: scope_id, type: weft.shared.ScopeId}
    filter: scope_id == param.scope_id
    fields:
      - {name: source_id, type: weft.shared.DeploymentSourceId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: kind, type: weft.deployments.SourceKind}
      - {name: format_version, type: weft.deployments.SourceFormatVersion}
      - {name: source_digest, type: weft.deployments.SourceDigest}
      - {name: helm_values, type: List<weft.deployments.HelmValues>}
      - {name: embedded_in, type: Optional<weft.deployments.EmbeddingPlace>}
      - {name: architecture_digest, type: Optional<weft.deployments.SourceDigest>}
      - {name: binding_digest, type: Optional<weft.deployments.SourceDigest>}
      - {name: submitted_by, type: weft.shared.PrincipalId}
      - {name: submitted_at, type: Timestamp}
      - {name: state, type: weft.deployments.DeploymentSource.State}

  # Section 5 "Translation", per source.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:2574
  - name: weft.deployments.Translations
    source: weft.deployments.Translation
    consistency: read_your_writes
    params:
      - {name: source_id, type: weft.shared.DeploymentSourceId}
    filter: source_id == param.source_id
    fields:
      - {name: translation_id, type: weft.shared.TranslationId}
      - {name: source_id, type: weft.shared.DeploymentSourceId}
      - {name: source_digest, type: weft.deployments.SourceDigest}
      - {name: translator_id, type: weft.shared.TranslatorId}
      - {name: translator_version, type: weft.deployments.TranslatorVersion}
      - {name: environment_id, type: Optional<weft.shared.EnvironmentId>}
      - {name: formation_revision_id, type: Optional<weft.shared.FormationRevisionId>}
      - {name: failure, type: Optional<String>}
      - {name: requested_at, type: Timestamp}
      - {name: completed_at, type: Optional<Timestamp>}
      - {name: state, type: weft.deployments.Translation.State}

  # Section 5 "CoverageReport: every object of the source with its outcome". Shown by
  # `weft plan` and by a stopped `weft deploy`.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:2595
  - name: weft.deployments.CoverageReport
    source: weft.deployments.CoverageEntry
    consistency: read_your_writes
    params:
      - {name: translation_id, type: weft.shared.TranslationId}
    filter: translation_id == param.translation_id
    fields:
      - {name: entry_id, type: weft.shared.CoverageEntryId}
      - {name: translation_id, type: weft.shared.TranslationId}
      - {name: object, type: weft.deployments.SourceObject}
      - {name: kubernetes_kind, type: Optional<weft.deployments.KubernetesKind>}
      - {name: outcome, type: weft.deployments.CoverageOutcome}
      - {name: element, type: weft.deployments.FormationElementKind}
      - {name: element_name, type: Optional<String>}
      - {name: lost, type: Optional<String>}
      - {name: refusal, type: Optional<weft.deployments.RefusalReason>}
      - {name: state, type: weft.deployments.CoverageEntry.State}

  # Section 5 goalpost: "the Helm chart of a Kubernetes SaaS product deploys and runs on weft
  # unchanged". Per translation, how many objects of each Kubernetes kind mapped, mapped with
  # loss or were refused: the goalpost holds for a chart when no row has outcome Refused.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:2616
  - name: weft.deployments.KubernetesCoverage
    source: weft.deployments.CoverageEntry
    consistency: read_your_writes
    params:
      - {name: translation_id, type: weft.shared.TranslationId}
    filter: translation_id == param.translation_id
    group_by: [kubernetes_kind, outcome]
    fields:
      - {name: kubernetes_kind, type: Optional<weft.deployments.KubernetesKind>}
      - {name: outcome, type: weft.deployments.CoverageOutcome}
      - name: objects
        type: Integer
        aggregate: {count: {}}

  # Section 5 "Plan ... shown before apply"; CLI `weft plan shop.yaml --env prod`.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:2631
  - name: weft.deployments.Plans
    source: weft.deployments.Plan
    consistency: read_your_writes
    params:
      - {name: environment_id, type: weft.shared.EnvironmentId}
    filter: environment_id == param.environment_id
    fields:
      - {name: plan_id, type: weft.shared.PlanId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: formation_revision_id, type: weft.shared.FormationRevisionId}
      - {name: translation_id, type: Optional<weft.shared.TranslationId>}
      - {name: source_id, type: Optional<weft.shared.DeploymentSourceId>}
      - {name: live_release_id, type: Optional<weft.shared.ReleaseId>}
      - {name: diff, type: Optional<weft.deployments.PlanDiff>}
      - {name: simulation, type: Optional<weft.deployments.Simulation>}
      - {name: created_by, type: weft.shared.PrincipalId}
      - {name: created_at, type: Timestamp}
      - {name: state, type: weft.deployments.Plan.State}
