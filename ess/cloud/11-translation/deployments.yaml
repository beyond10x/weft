# Moved from weft@6798e7d:ess/6-delivery/deployments.yaml.
# Comments are weft's at that commit: "sketch", "section" and "design" cite weft's documents, and
# where a comment says account or tenant, the block reads scope (docs/boundary.md, D1 A).
# Deployments: what a user deploys, how weft translates it into a FormationRevision, and how a
# revision reaches an environment as a release. Source: docs/domain-sketch.md section
# "5. Deployments" (all of it), with "Goals, in order" items 2 to 5 and "Ecosystem formats".
#
# Goalpost (sketch, section 5, the owner, 2026-11-26): the Helm chart of a Kubernetes SaaS product
# deploys and runs on weft unchanged. The enum weft.deployments.KubernetesKind carries, per
# object kind the sketch lists, whether it maps, is refused or is OPEN, so a coverage report
# answers the goalpost per chart.
domain: weft.deployments

summary: >-
  Deployment sources (weft, Compose, Helm, Kubernetes, ESS system, agent, cloudspec), their
  deterministic translation into formation revisions with a coverage report, and plans of a
  revision for an environment, with simulation. Releases, their steps, rollbacks and drift are
  weft's run-time records (D7 A).

naming:
  wire: weft
  display: Deployments

types:
  # Local identities. The sketch names these nouns only inside section 5; no other domain refers
  # to them, so they are not in weft.shared.

  # Section 5 "Deployment sources": the kinds. Sketch spelling in the comment.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:26
  - name: weft.deployments.SourceKind
    kind: enum
    variants:
      - Weft        # weft: weft's own formation document (section 3)
      - Compose     # compose: a Docker Compose file
      - Helm        # helm: a Helm chart + values, rendered, then read as kubernetes
      - Kubernetes  # kubernetes: a set of Kubernetes manifests
      - EssSystem   # ess-system: an ESS system.yaml
      - Agent       # agent: an agent document (a runtime and a task, both by digest)
      - Training    # training (later): a model program + corpus + data pipeline
      - Cloudspec   # cloudspec: a cloudspec-weft-submission/1 document (architecture, binding, coverage)

  # Section 5 "Translation": "source digest". The content digest of the source's bytes (for
  # helm: the chart archive). Values files are digested apart (HelmValues).
  # weft@6798e7d:ess/6-delivery/deployments.yaml:39
  - name: weft.deployments.SourceDigest
    kind: newtype
    of: String

  # Section 5 "Translator: registered per source kind and version". The version of the source
  # format the translator reads (Compose spec, Helm chart API, an agent document format, ess/37 ...).
  # weft@6798e7d:ess/6-delivery/deployments.yaml:45
  - name: weft.deployments.SourceFormatVersion
    kind: newtype
    of: String

  # Section 5 "Translation: source digest + translator version".
  # weft@6798e7d:ess/6-delivery/deployments.yaml:50
  - name: weft.deployments.TranslatorVersion
    kind: newtype
    of: String

  # Section 5 brief: "a helm source carries values per environment" (`--values prod.yaml`).
  # Only the values file's digest is held here; its bytes are part of the source upload.
  # OPEN: a values file that holds secret values (a common chart habit): refused, moved to
  # secret custody, or allowed? Smallest safe answer taken: the translator reports each such
  # value as a refused object (RefusalReason SecretValueInValues), so no value enters a revision.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:59
  - name: weft.deployments.HelmValues
    kind: struct
    fields:
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: values_digest
        type: weft.deployments.SourceDigest

  # Section 5 "A spec source can also be one component's package ...; then its translation
  # becomes a sub-formation in that place."
  # weft@6798e7d:ess/6-delivery/deployments.yaml:69
  - name: weft.deployments.EmbeddingPlace
    kind: struct
    fields:
      - name: parent_source_id
        type: weft.shared.DeploymentSourceId
      - name: component
        type: weft.shared.ComponentName

  # Section 5 "CoverageReport: every object of the source with its outcome: mapped (to which
  # formation element), mapped with loss (what was dropped), or refused (the named reason)."
  # weft@6798e7d:ess/6-delivery/deployments.yaml:79
  - name: weft.deployments.CoverageOutcome
    kind: enum
    variants: [Mapped, MappedWithLoss, Refused]

  # Section 5, the elements a source object maps to (sections 3, 4, 6, 7, 8). The element of the
  # FormationRevision a coverage entry names.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:85
  - name: weft.deployments.FormationElementKind
    kind: enum
    variants:
      - Component           # section 3/4: one workload
      - ServiceShape        # section 4 Shape: Service
      - StatefulService     # section 4 Shape: Service, stateful
      - DaemonShape         # section 4 Shape: Daemon
      - JobShape            # section 4 Shape: Job
      - ScheduleShape       # section 4 Shape: Schedule
      - Process             # section 4 "Inside one instance"
      - Check               # section 4 Check
      - InternalName        # section 3 InternalName
      - Link                # section 3 Link
      - BorderRoute         # section 3 Border Route
      - Config              # section 3 Config
      - SecretReference     # section 7 Secret; the value goes to secret custody, never here
      - VolumeClaim         # section 6 volume claim
      - ResourceClaim       # section 6 Claim (cpu, memory, gpu)
      - WorkloadIdentity    # section 8 workload identity
      - ScaleRule           # section 4 ScaleRule
      - DisruptionBudget    # section 4 DisruptionBudget
      - ReleaseStep         # section 5 ReleaseStep (Helm hooks)
      - SubFormation        # section 5: a spec source embedded as one component's package
      - Nothing             # a refused object maps to no element

  # Section 5 "kubernetes" list, as the goalpost's checklist: per kind, whether it maps, is
  # refused, or is OPEN in the sketch. A kind marked Open is refused until it is decided
  # (security default: deny). A kind the sketch does not list is Unlisted, refused by name.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:113
  - name: weft.deployments.KindDisposition
    kind: enum
    variants: [Maps, Refused, Open]

  # weft@6798e7d:ess/6-delivery/deployments.yaml:117
  - name: weft.deployments.KubernetesKind
    kind: enum
    attributes:
      - {name: disposition, type: weft.deployments.KindDisposition}
      - {name: element, type: weft.deployments.FormationElementKind}
    variants:
      # "Deployment -> Service shape; StatefulSet -> stateful Service; DaemonSet -> Daemon;
      # Job -> Job; CronJob -> Schedule."
      - {name: Deployment, attributes: {disposition: Maps, element: ServiceShape}}
      - {name: StatefulSet, attributes: {disposition: Maps, element: StatefulService}}
      - {name: DaemonSet, attributes: {disposition: Maps, element: DaemonShape}}
      - {name: Job, attributes: {disposition: Maps, element: JobShape}}
      - {name: CronJob, attributes: {disposition: Maps, element: ScheduleShape}}
      # "Pod containers -> Processes; probes -> Checks." A bare Pod is not listed as a kind.
      # OPEN: a bare Pod manifest (no controller): map to a Service of one replica, or refuse?
      # Smallest safe answer taken: Open, so refused.
      - {name: Pod, attributes: {disposition: Open, element: Nothing}}
      # "Service -> InternalName + Link targets; Ingress -> Border Routes."
      - {name: Service, attributes: {disposition: Maps, element: InternalName}}
      - {name: Ingress, attributes: {disposition: Maps, element: BorderRoute}}
      # "ConfigMap -> Config; Secret -> Secret (values go to secret custody, never into the
      # formation document)."
      - {name: ConfigMap, attributes: {disposition: Maps, element: Config}}
      # OPEN: how a Secret manifest's value reaches secret custody (section 7: "a value is
      # written once through the API"): does the translator write it, or must the deployer set
      # it before apply? Taken: the revision holds a reference only; this domain never handles
      # the value, and a missing value is the secrets domain's refusal at delivery.
      - {name: Secret, attributes: {disposition: Maps, element: SecretReference}}
      # "PersistentVolumeClaim -> volume claim; resource limits and nvidia.com/gpu -> claims."
      - {name: PersistentVolumeClaim, attributes: {disposition: Maps, element: VolumeClaim}}
      # "ServiceAccount -> workload identity; HorizontalPodAutoscaler -> ScaleRule;
      # PodDisruptionBudget -> DisruptionBudget; NetworkPolicy -> Links."
      - {name: ServiceAccount, attributes: {disposition: Maps, element: WorkloadIdentity}}
      - {name: HorizontalPodAutoscaler, attributes: {disposition: Maps, element: ScaleRule}}
      - {name: PodDisruptionBudget, attributes: {disposition: Maps, element: DisruptionBudget}}
      - {name: NetworkPolicy, attributes: {disposition: Maps, element: Link}}
      # "# OPEN: custom resources (CRDs) and operators, and workloads that call the Kubernetes
      # API." The kinds below carry that OPEN point: refused until decided.
      - {name: CustomResourceDefinition, attributes: {disposition: Open, element: Nothing}}
      - {name: CustomResource, attributes: {disposition: Open, element: Nothing}}
      - {name: Role, attributes: {disposition: Open, element: Nothing}}
      - {name: RoleBinding, attributes: {disposition: Open, element: Nothing}}
      - {name: ClusterRole, attributes: {disposition: Open, element: Nothing}}
      - {name: ClusterRoleBinding, attributes: {disposition: Open, element: Nothing}}
      # Any kind the sketch does not list (Namespace, PersistentVolume, StorageClass, webhook
      # configurations, ...). OPEN: which further kinds common SaaS charts need.
      - {name: Unlisted, attributes: {disposition: Refused, element: Nothing}}

  # Section 5 "Refused by name: privileged pods, host paths, host network, kernel capabilities
  # beyond the isolation level", and the OPEN kinds above. A refusal is always one of these names.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:167
  - name: weft.deployments.RefusalReason
    kind: enum
    variants:
      - PrivilegedPod            # securityContext.privileged
      - HostPath                 # a hostPath volume
      - HostNetwork              # hostNetwork: true
      # OPEN: hostPID / hostIPC are not named by the sketch; taken as refused like host network.
      - HostNamespace
      - KernelCapability         # a capability beyond the workload's isolation level
      - CustomResource           # OPEN in the sketch: CRDs, custom resources, operators
      - KubernetesApiAccess      # OPEN in the sketch: a workload that calls the Kubernetes API
      - BarePod                  # OPEN (see KubernetesKind Pod)
      - UnlistedKind             # a Kubernetes kind the sketch does not list
      - SecretValueInValues      # OPEN (see HelmValues): a secret value in a values file
      - UnsupportedConstruct     # any other source construct the translator cannot represent

  # Section 5 "every object of the source": how a coverage entry names one source object. `kind`
  # is the source's own word (a Compose `services` entry, a Kubernetes `Deployment`); `path` is
  # the file and position inside the source (a rendered template for helm).
  # weft@6798e7d:ess/6-delivery/deployments.yaml:186
  - name: weft.deployments.SourceObject
    kind: struct
    fields:
      - name: kind
        type: String
      - name: name
        type: String
      - name: path
        type: String

  # Section 5 "Plan: the diff between the live release and a new revision".
  # OPEN: the diff's granularity (components only, or every link, route, claim and config key).
  # Smallest answer taken: component names added, changed and removed.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:220
  - name: weft.deployments.PlanDiff
    kind: struct
    fields:
      - name: added
        type: List<weft.shared.ComponentName>
      - name: changed
        type: List<weft.shared.ComponentName>
      - name: removed
        type: List<weft.shared.ComponentName>

  # Section 5 "Simulation": the three checks.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:231
  - name: weft.deployments.SimulationCheck
    kind: enum
    variants: [Placement, Policy, Reachability]

  # Section 5 "Result: pass, or a list of named violations." The names, one per rule the sketch
  # states for each check.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:237
  - name: weft.deployments.ViolationName
    kind: enum
    variants:
      - ExceedsCapacity       # placement: an instance does not fit the cluster's capacity
      - ExceedsQuota          # placement: an instance does not fit the account's quota
      - NoMatchingResource    # placement: no node offers a claimed resource class
      - LinkNotAllowed        # policy: a link the account's policy refuses
      - EgressNotAllowed      # policy: an egress the account's policy refuses
      - SecretGrantNotAllowed # policy: a secret grant the account's policy refuses
      - UnreachableComponent  # reachability: a link's target cannot be reached
      - UnintendedExposure    # reachability: a component reachable from outside not on the border

  # A violation names the check, the rule and the subject by name only: "a value never appears in
  # logs, plans, simulations or events" (section 7), so a secret is named, never shown.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:251
  - name: weft.deployments.Violation
    kind: struct
    fields:
      - name: check
        type: weft.deployments.SimulationCheck
      - name: name
        type: weft.deployments.ViolationName
      - name: component
        type: Optional<weft.shared.ComponentName>
      - name: subject
        type: String

  # Section 5 "reachability: which component can reach which, inside and outside". An absent
  # side is outside the formation.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:265
  - name: weft.deployments.ReachabilityEdge
    kind: struct
    fields:
      - name: caller
        type: Optional<weft.shared.ComponentName>
      - name: callee
        type: Optional<weft.shared.ComponentName>

  # Section 5 "Simulation: a release checked without running it ... Result: pass, or a list of
  # named violations." Held on the Plan it checks: the sketch has no simulation without a plan.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:275
  - name: weft.deployments.Simulation
    kind: struct
    fields:
      - name: reachability
        type: List<weft.deployments.ReachabilityEdge>
      - name: violations
        type: List<weft.deployments.Violation>

entities:
  # Section 5 "Translation": "Translator: registered per source kind and version." "A new source
  # kind arrives as a new translator, not as a change to the scheduler or the node agent."
  # weft@6798e7d:ess/6-delivery/deployments.yaml:297
  - name: weft.deployments.Translator
    naming:
      summary: A registered translator of one source kind and source format version.
    identity:
      name: translator_id
      type: weft.shared.TranslatorId
    fields:
      - name: source_kind
        type: weft.deployments.SourceKind
      - name: source_format_version
        type: weft.deployments.SourceFormatVersion
      - name: translator_version
        type: weft.deployments.TranslatorVersion
      # OPEN: how a translator's artifact is identified and verified (signed like a package,
      # section 4?). Taken: its artifact digest is recorded.
      - name: artifact_digest
        type: weft.shared.ArtifactDigest
      - name: registered_at
        type: Timestamp
    relations:
      - {name: artifact, kind: references, target: weft.artifacts.Artifact, cardinality: one, via: artifact_digest}
    # OPEN: the sketch gives no translator lifecycle. Taken: registered until retired; a retired
    # translator translates nothing new, and its translations stay readable.
    lifecycle:
      initial: Registered
      states: [Registered, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Registered]
          to: Retired

  # Section 5 "Deployment sources": "A user deploys a DeploymentSource: a document weft
  # translates into a FormationRevision."
  # weft@6798e7d:ess/6-delivery/deployments.yaml:331
  - name: weft.deployments.DeploymentSource
    naming:
      summary: A document a user deploys, by kind and content digest, that the cloud translates.
    identity:
      name: source_id
      type: weft.shared.DeploymentSourceId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      # The formation the translation becomes a revision of (section 3: a formation is named
      # inside one account).
      - name: formation_id
        type: weft.shared.FormationId
      - name: kind
        type: weft.deployments.SourceKind
      - name: format_version
        type: weft.deployments.SourceFormatVersion
      - name: source_digest
        type: weft.deployments.SourceDigest
      # helm only: the values files per environment (`--values prod.yaml`).
      - name: helm_values
        type: List<weft.deployments.HelmValues>
      # A spec source embedded as one component's package of another source.
      - name: embedded_in
        type: Optional<weft.deployments.EmbeddingPlace>
      # cloudspec only: the submission's `digests` (docs/layers.md § 11), the sha256 of the
      # canonical JSON of its `architecture` and of its `binding` (`null` included). Set for kind
      # Cloudspec and absent for every other kind (SubmitDeploymentSource), so a plan made from the
      # source (PlanFromSource) traces to both.
      - name: architecture_digest
        type: Optional<weft.deployments.SourceDigest>
      - name: binding_digest
        type: Optional<weft.deployments.SourceDigest>
      - name: submitted_by
        type: weft.shared.PrincipalId
      - name: submitted_at
        type: Timestamp
    relations:
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      - {name: formation, kind: references, target: weft.architecture.Formation, cardinality: one, via: formation_id}
    # UNMAPPED: embedded_in.parent_source_id names another DeploymentSource; a relation through a
    # member of an Optional struct is not a relation entry this file found. Open question for the
    # integrator: flatten it into a field `parent_source_id` with a `references` relation.
    # OPEN: the sketch gives no source lifecycle. Taken: submitted until withdrawn; a withdrawn
    # source is not translated again, and its translations and releases stay.
    lifecycle:
      initial: Submitted
      states: [Submitted, Withdrawn]
      terminal: [Withdrawn]
      transitions:
        - name: withdraw
          from: [Submitted]
          to: Withdrawn

  # Section 5 "Translation: source digest + translator version -> FormationRevision +
  # CoverageReport." "Deterministic: the same source and translator version give the same
  # revision, byte for byte."
  # UNMAPPED: byte-for-byte determinism is a property of the translator's output, which lives in
  # the formations domain (the revision's document); this file can only key a translation by
  # source, translator and environment (TranslateSource answers AlreadyTranslated). Open question
  # for the integrator: a check that compares the revision digests of two translations.
  # UNMAPPED: "A translator cannot grant more than the source declares: an agent that names no
  # secret gets no secret grant." The grants are part of the FormationRevision (formations,
  # secrets domains); nothing in this domain sees them. Open question for the integrator.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:388
  - name: weft.deployments.Translation
    naming:
      summary: One translation of a source by a translator into a formation revision.
    identity:
      name: translation_id
      type: weft.shared.TranslationId
    fields:
      - name: source_id
        type: weft.shared.DeploymentSourceId
      # Isolation pass 2: the source's account, copied so a plan ties the translation to the
      # caller's account without a second hop.
      - name: scope_id
        type: weft.shared.ScopeId
      # The source's formation, copied so a plan is checked against it.
      - name: formation_id
        type: weft.shared.FormationId
      - name: source_digest
        type: weft.deployments.SourceDigest
      - name: translator_id
        type: weft.shared.TranslatorId
      - name: translator_version
        type: weft.deployments.TranslatorVersion
      # helm only: the environment whose values file the chart was rendered with.
      - name: environment_id
        type: Optional<weft.shared.EnvironmentId>
      # Set when the translation completes. OPEN: whether a translation with a refused object
      # still writes a revision. Taken: no; a refused translation has no revision to deploy.
      - name: formation_revision_id
        type: Optional<weft.shared.FormationRevisionId>
      - name: failure
        type: Optional<String>
      - name: requested_at
        type: Timestamp
      - name: completed_at
        type: Optional<Timestamp>
    relations:
      - name: source
        kind: references
        target: weft.deployments.DeploymentSource
        cardinality: one
        via: source_id
      - name: translator
        kind: references
        target: weft.deployments.Translator
        cardinality: one
        via: translator_id
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      - {name: formation, kind: references, target: weft.architecture.Formation, cardinality: one, via: formation_id}
      - {name: environment, kind: references, target: weft.architecture.Environment, cardinality: one, via: environment_id}
      # The revision this translation produced. formations.FormationRevision stores no
      # translation_id (docs/layers.md, cycle 3): this field is the only link between the two.
      - {name: formation_revision, kind: references, target: weft.architecture.FormationRevision, cardinality: one, via: formation_revision_id}
      # The CoverageReport of this translation: an entry has no meaning without it.
      - name: coverage
        kind: owns
        target: weft.deployments.CoverageEntry
        cardinality: many
        via: translation_id
    # OPEN: the sketch names no translation states. Taken: Requested while the translator runs;
    # Translated (every object mapped, with or without loss); Refused (at least one object
    # refused: "a deploy with a refused object stops"); Failed (the translator itself failed).
    lifecycle:
      initial: Requested
      states: [Requested, Translated, Refused, Failed]
      terminal: [Translated, Refused, Failed]
      transitions:
        - name: complete
          from: [Requested]
          to: Translated
        - name: refuse
          from: [Requested]
          to: Refused
        - name: fail
          from: [Requested]
          to: Failed

  # Section 5 "CoverageReport: every object of the source with its outcome: mapped (to which
  # formation element), mapped with loss (what was dropped), or refused (the named reason)."
  # The report of a translation is the set of its entries (view CoverageReport).
  # weft@6798e7d:ess/6-delivery/deployments.yaml:467
  - name: weft.deployments.CoverageEntry
    naming:
      summary: The outcome of one source object in one translation.
    identity:
      name: entry_id
      type: weft.shared.CoverageEntryId
    fields:
      - name: translation_id
        type: weft.shared.TranslationId
      - name: object
        type: weft.deployments.SourceObject
      # helm and kubernetes sources: the object's kind as the goalpost checklist names it.
      - name: kubernetes_kind
        type: Optional<weft.deployments.KubernetesKind>
      - name: outcome
        type: weft.deployments.CoverageOutcome
      - name: element
        type: weft.deployments.FormationElementKind
      # The element's name in the revision (a component, a link, a route ...).
      - name: element_name
        type: Optional<String>
      # MappedWithLoss: what was dropped.
      - name: lost
        type: Optional<String>
      # Refused: the named reason.
      - name: refusal
        type: Optional<weft.deployments.RefusalReason>
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # Section 5 "Releases": "Plan: the diff between the live release and a new revision, plus a
  # simulation, shown before apply." CLI `weft plan shop.yaml --env prod`; `weft deploy` is
  # "plan, simulate, ask, apply".
  # weft@6798e7d:ess/6-delivery/deployments.yaml:502
  - name: weft.deployments.Plan
    naming:
      summary: The diff and simulation of one revision against an environment's live release.
    identity:
      name: plan_id
      type: weft.shared.PlanId
    fields:
      # Isolation pass 2: the account of the translation or the release it was made from.
      - name: scope_id
        type: weft.shared.ScopeId
      - name: formation_id
        type: weft.shared.FormationId
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: formation_revision_id
        type: weft.shared.FormationRevisionId
      # A plan of a new revision names its translation (CreatePlan). cloudspec (D7 A): weft's plan
      # of a rollback (rollback_of, PlanRollback) names a release, a run-time record of weft.
      - name: translation_id
        type: Optional<weft.shared.TranslationId>
      # A plan of a cloudspec source names the source (PlanFromSource) and no translation: the
      # revision was copied from the source's architecture with no translator. FormationRevision
      # (layer 9) cannot name a source of this layer, so this field, beside formation_revision_id,
      # is the link from the revision to its source and the source's two digests.
      - name: source_id
        type: Optional<weft.shared.DeploymentSourceId>
      # The release the diff was taken against; absent for the first release of an environment.
      - name: live_release_id
        type: Optional<weft.shared.ReleaseId>
      - name: diff
        type: Optional<weft.deployments.PlanDiff>
      - name: simulation
        type: Optional<weft.deployments.Simulation>
      - name: created_by
        type: weft.shared.PrincipalId
      - name: created_at
        type: Timestamp
    relations:
      - name: translation
        kind: references
        target: weft.deployments.Translation
        cardinality: one
        via: translation_id
      - {name: source, kind: references, target: weft.deployments.DeploymentSource, cardinality: one, via: source_id}
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      - {name: formation, kind: references, target: weft.architecture.Formation, cardinality: one, via: formation_id}
      - {name: environment, kind: references, target: weft.architecture.Environment, cardinality: one, via: environment_id}
      - {name: formation_revision, kind: references, target: weft.architecture.FormationRevision, cardinality: one, via: formation_revision_id}
    # OPEN: the sketch names no plan states. Taken: Simulating until the control plane records
    # the diff and simulation; Ready (simulation passed) or Blocked (named violations);
    # Discarded by the user. Applying a Ready plan creates its release; the plan stays Ready, and
    # a second release of it does not start (StartRelease already-applied).
    # OPEN: a plan whose environment got a new live release after the plan was made (a stale
    # diff). Taken: not detected here; the integrator decides whether ApplyPlan re-simulates.
    lifecycle:
      initial: Simulating
      states: [Simulating, Ready, Blocked, Discarded]
      terminal: [Discarded]
      transitions:
        - name: pass
          from: [Simulating]
          to: Ready
        - name: block
          from: [Simulating]
          to: Blocked
        - name: discard
          from: [Simulating, Ready, Blocked]
          to: Discarded

errors:
  # weft@6798e7d:ess/6-delivery/deployments.yaml:792
  - name: weft.deployments.NotFound
    summary: The addressed record does not exist, and nothing changed.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:794
  - name: weft.deployments.StateConflict
    summary: The addressed record is not in a state this command acts from, and nothing changed.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:796
  - name: weft.deployments.TranslatorExists
    summary: A translator of this source kind, format version and translator version is registered.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:798
  - name: weft.deployments.NoTranslator
    summary: >-
      No registered translator reads this source kind and format version, so the cloud cannot
      translate it (training sources, until their translator exists).
  # weft@6798e7d:ess/6-delivery/deployments.yaml:802
  - name: weft.deployments.ValuesOnlyForHelm
    summary: Values per environment were given for a source that is not a helm chart.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:804
  - name: weft.deployments.NotASpecSource
    summary: >-
      Only a spec source (ess-system, agent, training) can be one component's package; a
      weft, compose, helm or kubernetes source cannot be embedded.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:808
  - name: weft.deployments.SourceIsWithdrawn
    summary: The source was withdrawn, so it is not translated again.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:810
  - name: weft.deployments.TranslatorIsRetired
    summary: The translator is retired, so it translates nothing new.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:812
  - name: weft.deployments.SourceMismatch
    summary: >-
      The source's kind, format version, digest or formation is not what the request names, so the
      translation would not be of the bytes the caller meant.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:816
  - name: weft.deployments.TranslatorMismatch
    summary: The translator's source kind, format version or version is not what the request names.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:818
  - name: weft.deployments.EnvironmentRequired
    summary: A helm chart is rendered with one environment's values, and the request names none.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:820
  - name: weft.deployments.NoValuesForEnvironment
    summary: The helm source holds no values file for the named environment.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:822
  - name: weft.deployments.AlreadyTranslated
    summary: >-
      This source was already translated by this translator for this environment; the same input
      gives the same revision, so the existing translation is the answer.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:826
  - name: weft.deployments.TranslationClosed
    summary: The translation is no longer running, so its coverage report is not changed.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:828
  - name: weft.deployments.RefusalUnnamed
    summary: A refused object must name its refusal reason.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:830
  - name: weft.deployments.LossUnnamed
    summary: An object mapped with loss must say what was dropped.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:832
  - name: weft.deployments.ElementMissing
    summary: A mapped object must name the formation element it maps to.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:834
  - name: weft.deployments.KindNotMappable
    summary: >-
      The Kubernetes kind is refused or OPEN in the translator's checklist, so a translator cannot report it
      as mapped.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:838
  - name: weft.deployments.HasRefusedObjects
    summary: The coverage report holds a refused object, so the translation does not complete.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:840
  - name: weft.deployments.NoRefusedObject
    summary: The coverage report holds no refused object, so the translation is not refused.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:842
  - name: weft.deployments.DeployRefused
    summary: >-
      The translation's coverage report holds a refused object, so the deploy stops; the
      report names each refused object and its reason.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:846
  - name: weft.deployments.TranslationNotReady
    summary: The translation has not completed, so there is no revision to plan.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:848
  - name: weft.deployments.TranslationMismatch
    summary: The translation's formation or revision is not what the request names.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:850
  - name: weft.deployments.ValuesForOtherEnvironment
    summary: The helm chart was rendered with another environment's values.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:858
  - name: weft.deployments.PlanMismatch
    summary: The plan's environment is not what the request names.
  # weft@6798e7d:ess/6-delivery/deployments.yaml:906
  - name: weft.deployments.NoStepToReapply
    summary: The drift names no release step, so there is nothing to re-apply; it is escalated.
  - name: weft.deployments.TranslatorRequired
    summary: >-
      A source of any kind but cloudspec is translated, and the request names no translator for
      it.
  - name: weft.deployments.TranslatorNotAllowed
    summary: >-
      A cloudspec source is read unchanged and never translated, and the request names a
      translator for it.
  - name: weft.deployments.DigestsRequired
    summary: >-
      A cloudspec source records the digests of its architecture and its binding, and the request
      leaves one out.
  - name: weft.deployments.DigestsOnlyForCloudspec
    summary: An architecture or binding digest was given for a source that is not a cloudspec submission.
  - name: weft.deployments.SourceNotCloudspec
    summary: >-
      Only a cloudspec source is planned without a translation; a source of another kind is
      translated first (TranslateSource, CreatePlan).

