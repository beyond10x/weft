# Moved from weft@6798e7d: ess/4-applications/formations.yaml, ess/5-runtime/edge.yaml.
# Comments are weft's at that commit: "sketch", "section" and "design" cite weft's documents, and
# where a comment says account or tenant, the block reads scope (docs/boundary.md, D1 A).
domain: weft.edge

summary: >-
  The public entry points: endpoints (a public host of a scope, optionally serving one box) and
  the certificate of each endpoint. The routes that send a host and path to a component of a
  formation are the composition's (weft.architecture.Route).

naming:
  wire: weft
  display: Edge

types:
  # Section 3, `Border`: "host and path"; a public DNS host name.
  # weft@6798e7d:ess/4-applications/formations.yaml:43
  - name: weft.edge.Host
    kind: newtype
    of: String

  # Section 3, `Link` "(protocol, port)" and `Border` "a component and port".
  # weft@6798e7d:ess/4-applications/formations.yaml:51
  - name: weft.edge.Port
    kind: newtype
    of: Integer
    invariants:
      - value >= 1
      - value <= 65535

entities:

  # Section 3: "`Border`: the components reachable from outside the formation, with
  # their public `Endpoint`s". An Endpoint is one public host. cloudspec (layer rule): an endpoint
  # belongs to a scope, the boundary that shows it controls the host; the formation whose border
  # uses it names it from layer 9 (weft.architecture.Route.endpoint_id), so this block names no
  # formation. A box (sketch lines 248-254: "cordon takes it out of its endpoint's traffic") is
  # served by the endpoint that names it in `box_id`; the box does not name its endpoint.
  # OPEN: whether each environment gets its own hosts. Taken: an endpoint belongs to the scope;
  # per-environment hosts are left to `weft.deployments`.
  # weft@6798e7d:ess/4-applications/formations.yaml:290
  - name: weft.edge.Endpoint
    naming:
      summary: A public host name of a scope, used by a formation's border or serving one box.
    identity:
      name: endpoint_id
      type: weft.shared.EndpointId
    fields:
      - name: scope_id
        type: weft.shared.ScopeId
      - name: host
        type: weft.edge.Host
      - name: box_id
        type: Optional<weft.shared.BoxId>
    relations:
      - {name: scope, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      - {name: box, kind: references, target: weft.workloads.Box, cardinality: one, via: box_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # § 3 `Border` (public `Endpoint`s); § 14 "# OPEN: an `edge` domain for routes, held wake requests
  # and certificates". One certificate per public endpoint at a time.
  # OPEN: the issuer (ACME, a cluster CA, a certificate the account uploads) and its challenge are
  # not decided; the edge records only what the issuer answered.
  # weft@6798e7d:ess/5-runtime/edge.yaml:155
  - name: weft.edge.EdgeCertificate
    naming:
      summary: The certificate of one public endpoint, and how long it is valid.
    identity:
      name: certificate_id
      type: weft.shared.EdgeCertificateId
    fields:
      - name: endpoint_id
        type: weft.shared.EndpointId
      # cloudspec (layer rule): the endpoint's scope, in place of weft's formation_id.
      - name: scope_id
        type: weft.shared.ScopeId
      - name: host
        type: weft.edge.Host
      # The issuer's `notAfter`; absent until issued.
      - name: not_after
        type: Optional<Timestamp>
      - name: failure
        type: Optional<String>
    relations:
      - name: endpoint
        kind: references
        target: weft.edge.Endpoint
        cardinality: one
        via: endpoint_id
      - name: scope
        kind: references
        target: weft.scope.Scope
        cardinality: one
        via: scope_id
    lifecycle:
      initial: Requested
      states:
        - {name: Requested, summary: The edge asked the issuer for a certificate of the host.}
        - {name: Issued, summary: The edge holds a valid certificate and serves the host over TLS.}
        - {name: Failed, summary: The issuer refused; the host is not served over TLS.}
        - {name: Retired, summary: The endpoint was removed.}
      terminal: [Retired]
      transitions:
        - name: issue
          from: [Requested]
          to: Issued
        - name: fail
          from: [Requested]
          to: Failed
        - name: request_again
          from: [Failed]
          to: Requested
        - name: retire
          from: [Requested, Issued, Failed]
          to: Retired

errors:
  # cloudspec (layer rule): an endpoint belongs to a scope (weft's NoSuchFormation).
  # weft@6798e7d:ess/4-applications/formations.yaml:496
  - name: weft.edge.NoSuchScope
    summary: No scope has this id, or it is not the scope the request acts in, and nothing changed.
  # cloudspec (layer rule): weft's FormationStateConflict, for the endpoint's scope.
  # weft@6798e7d:ess/4-applications/formations.yaml:498
  - name: weft.edge.ScopeStateConflict
    summary: The scope is closed, so it takes no new endpoint, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:534
  - name: weft.edge.NoSuchEndpoint
    summary: No endpoint of this scope has this id, and nothing changed.
  # weft@6798e7d:ess/4-applications/formations.yaml:536
  - name: weft.edge.HostTaken
    summary: Another endpoint already holds this host, and nothing was created.
  # weft@6798e7d:ess/4-applications/formations.yaml:538
  - name: weft.edge.HostNotVerified
    summary: The scope has not shown that it controls this host, and nothing was created.
  # cloudspec: the box an endpoint serves is missing or of another scope.
  - name: weft.edge.NoSuchBox
    summary: No box of this scope has this id, and nothing was created.
  # weft@6798e7d:ess/5-runtime/edge.yaml:233
  - name: weft.edge.EndpointNotFound
    summary: No public endpoint has this identifier, and no certificate is requested.
  # weft@6798e7d:ess/5-runtime/edge.yaml:235
  - name: weft.edge.CertificateExists
    summary: The endpoint already has a certificate requested or issued, and nothing changed.
  # weft@6798e7d:ess/5-runtime/edge.yaml:237
  - name: weft.edge.CertificateNotFound
    summary: No certificate has this identifier, and nothing changed.
  # weft@6798e7d:ess/5-runtime/edge.yaml:239
  - name: weft.edge.NotAfterInPast
    summary: The certificate's end of validity already passed, so it is not recorded as issued.
  # weft@6798e7d:ess/5-runtime/edge.yaml:241
  - name: weft.edge.CertificateStateConflict
    summary: The certificate is in a state that does not take this step, and nothing changed.

events:
  # weft@6798e7d:ess/4-applications/formations.yaml:642
  - name: weft.edge.EndpointAdded
    fields:
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: host, type: weft.edge.Host}
  # weft@6798e7d:ess/4-applications/formations.yaml:647
  - name: weft.edge.EndpointRemoved
    fields:
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: scope_id, type: weft.shared.ScopeId}

  # weft@6798e7d:ess/5-runtime/edge.yaml:277
  - name: weft.edge.CertificateRequested
    fields:
      - {name: certificate_id, type: weft.shared.EdgeCertificateId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: host, type: weft.edge.Host}

  # weft@6798e7d:ess/5-runtime/edge.yaml:283
  - name: weft.edge.CertificateIssued
    fields:
      - {name: certificate_id, type: weft.shared.EdgeCertificateId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: not_after, type: Timestamp}

  # weft@6798e7d:ess/5-runtime/edge.yaml:289
  - name: weft.edge.CertificateRenewed
    fields:
      - {name: certificate_id, type: weft.shared.EdgeCertificateId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: not_after, type: Timestamp}

  # weft@6798e7d:ess/5-runtime/edge.yaml:295
  - name: weft.edge.CertificateFailed
    fields:
      - {name: certificate_id, type: weft.shared.EdgeCertificateId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: reason, type: String}

  # weft@6798e7d:ess/5-runtime/edge.yaml:301
  - name: weft.edge.CertificateRetired
    fields:
      - {name: certificate_id, type: weft.shared.EdgeCertificateId}
      - {name: endpoint_id, type: weft.shared.EndpointId}

commands:

  # Section 3, `Border`: "their public `Endpoint`s". A host is held by one endpoint in the
  # cluster. The account must have shown it controls the host.
  # cloudspec (layer rule): the endpoint is created in a scope, not in a formation; a formation's
  # route names it (weft.architecture.AddRoute). A box it serves is named here: the edge attaches
  # to the box, the box does not name its endpoint (weft's CreateBox endpoint_id).
  # OPEN: how an account proves it controls a host (DNS record, delegated zone) and which domain
  # keeps that proof. Taken: external check, refused by default.
  # weft@6798e7d:ess/4-applications/formations.yaml:1506
  - name: weft.edge.AddEndpoint
    naming:
      display: Add a public endpoint
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: host, type: weft.edge.Host}
      - {name: box_id, type: Optional<weft.shared.BoxId>}
    outcomes:
      # Isolation pass 2: the scope must be the one the request acts in; another answers like a
      # missing one (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.edge.NoSuchScope
      - name: no-such-scope
        when_related: {via: input.scope_id, exists: false}
        error: weft.edge.NoSuchScope
      - name: box-missing
        when_related: {via: input.box_id, exists: false}
        error: weft.edge.NoSuchBox
      - name: scope-closed
        when_related: {via: input.scope_id, predicate: state == Closed}
        error: weft.edge.ScopeStateConflict
      # hardening pass 1 W3: a box is reached only through an endpoint of its own scope; another
      # scope's box answers like a missing one.
      - name: box-foreign
        when_related: {via: input.box_id, predicate: scope_id != input.scope_id}
        error: weft.edge.NoSuchBox
      - name: host-taken
        when_related:
          entity: weft.edge.Endpoint
          where: host == input.host
          exists: true
        error: weft.edge.HostTaken
      - name: host-not-verified
        external: the scope has not shown that it controls the host
        error: weft.edge.HostNotVerified
      - name: added
        creates: weft.edge.Endpoint
        instance: endpoint_id
        sets:
          scope_id: input.scope_id
          host: input.host
          box_id: input.box_id
        emits: [weft.edge.EndpointAdded]
        payload:
          weft.edge.EndpointAdded:
            endpoint_id: {generated: true}
            scope_id: input.scope_id
            host: input.host

  # Section 3, `Border`. cloudspec (layer rule): weft refused while a route still used the
  # endpoint; routes are the composition's (weft.architecture.Route, layer 9), which this block
  # does not read. A route whose endpoint is gone is the composition's to repair (OPEN).
  # weft@6798e7d:ess/4-applications/formations.yaml:1542
  - name: weft.edge.RemoveEndpoint
    naming:
      display: Remove a public endpoint
    input:
      # Isolation pass 2: the scope the request acts in, so the endpoint can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
    outcomes:
      # Isolation pass 2: the scope must be the one the request acts in; it reads no row and
      # answers like a missing endpoint (an input guard answers ahead of every row check).
      - name: not-callers-scope
        when: scope_id != caller.scope_id
        error: weft.edge.NoSuchEndpoint
      - name: unknown-endpoint
        unknown_instance: true
        error: weft.edge.NoSuchEndpoint
      - name: no-such-endpoint
        when_related: {via: input.endpoint_id, exists: false}
        error: weft.edge.NoSuchEndpoint
      # Isolation pass 2: an endpoint of another scope answers like a missing one.
      - name: foreign-endpoint
        when_related: {via: input.endpoint_id, predicate: scope_id != input.scope_id}
        error: weft.edge.NoSuchEndpoint
      # cloudspec: weft's `exported` (an active weft.formations.Export names the endpoint) is cut;
      # exports between accounts are the multi-tenant example's.
      - name: removed
        deletes: weft.edge.Endpoint
        instance: endpoint_id
        emits: [weft.edge.EndpointRemoved]
        payload:
          weft.edge.EndpointRemoved:
            endpoint_id: input.endpoint_id
            scope_id: input.scope_id

  # § 3 `Border`: a public endpoint is served over TLS. Bound to EndpointAdded.
  # weft@6798e7d:ess/5-runtime/edge.yaml:565
  - name: weft.edge.RequestCertificate
    naming:
      display: Request the certificate of a public endpoint
    input:
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: host, type: weft.edge.Host}
    outcomes:
      - name: no-such-endpoint
        when_related: {via: input.endpoint_id, exists: false}
        error: weft.edge.EndpointNotFound
      - name: already-requested
        when_related:
          entity: weft.edge.EdgeCertificate
          where: {all: [endpoint_id == input.endpoint_id, state != Retired]}
          exists: true
        error: weft.edge.CertificateExists
      - name: requested
        creates: weft.edge.EdgeCertificate
        instance: certificate_id
        sets:
          endpoint_id: input.endpoint_id
          scope_id: input.scope_id
          host: input.host
        emits: [weft.edge.CertificateRequested]
        payload:
          weft.edge.CertificateRequested:
            certificate_id: {generated: true}
            endpoint_id: input.endpoint_id
            host: input.host

  # The issuer answered with a certificate: first issue (Requested) or a renewal (Issued). The
  # end of validity is the issuer's, not the edge's clock.
  # weft@6798e7d:ess/5-runtime/edge.yaml:598
  - name: weft.edge.RecordCertificateIssued
    naming:
      display: Record an issued certificate
    input:
      - {name: certificate_id, type: weft.shared.EdgeCertificateId}
      - {name: not_after, type: Timestamp}
    outcomes:
      - name: not-after-past
        when: not_after < now
        error: weft.edge.NotAfterInPast
      - name: no-such-certificate
        unknown_instance: true
        error: weft.edge.CertificateNotFound
      - name: issued
        when_subject_state: Requested
        moves: weft.edge.EdgeCertificate.issue
        instance: certificate_id
        sets:
          not_after: input.not_after
        emits: [weft.edge.CertificateIssued]
        payload:
          weft.edge.CertificateIssued:
            certificate_id: input.certificate_id
            endpoint_id: {subject: endpoint_id}
            not_after: input.not_after
      - name: renewed
        when_subject_state: Issued
        updates: weft.edge.EdgeCertificate
        instance: certificate_id
        sets:
          not_after: input.not_after
        emits: [weft.edge.CertificateRenewed]
        payload:
          weft.edge.CertificateRenewed:
            certificate_id: input.certificate_id
            endpoint_id: {subject: endpoint_id}
            not_after: input.not_after
      - name: other-state
        error: weft.edge.CertificateStateConflict

  # The issuer refused. The endpoint is not served over TLS until a retry is issued.
  # weft@6798e7d:ess/5-runtime/edge.yaml:639
  - name: weft.edge.RecordCertificateFailed
    naming:
      display: Record a refused certificate
    input:
      - {name: certificate_id, type: weft.shared.EdgeCertificateId}
      - {name: reason, type: String}
    outcomes:
      - name: no-such-certificate
        unknown_instance: true
        error: weft.edge.CertificateNotFound
      - name: failed
        moves: weft.edge.EdgeCertificate.fail
        instance: certificate_id
        sets:
          failure: input.reason
        emits: [weft.edge.CertificateFailed]
        payload:
          weft.edge.CertificateFailed:
            certificate_id: input.certificate_id
            endpoint_id: {subject: endpoint_id}
            reason: input.reason
      - name: other-state
        wrong_state: true
        error: weft.edge.CertificateStateConflict

  # OPEN: when a refused certificate is asked for again (a backoff, the account's fix of its DNS).
  # Taken: EdgeGateway decides; the row returns to Requested.
  # weft@6798e7d:ess/5-runtime/edge.yaml:666
  - name: weft.edge.RetryCertificate
    naming:
      display: Ask for a refused certificate again
    input:
      - {name: certificate_id, type: weft.shared.EdgeCertificateId}
    outcomes:
      - name: no-such-certificate
        unknown_instance: true
        error: weft.edge.CertificateNotFound
      - name: requested-again
        moves: weft.edge.EdgeCertificate.request_again
        instance: certificate_id
        emits: [weft.edge.CertificateRequested]
        payload:
          weft.edge.CertificateRequested:
            certificate_id: input.certificate_id
            endpoint_id: {subject: endpoint_id}
            host: {subject: host}
      - name: other-state
        wrong_state: true
        error: weft.edge.CertificateStateConflict

  # § 3: a removed endpoint is served no more. Bound to EndpointRemoved.
  # weft@6798e7d:ess/5-runtime/edge.yaml:689
  - name: weft.edge.RetireEndpointCertificates
    naming:
      display: Retire the certificates of a removed endpoint
    input:
      - {name: endpoint_id, type: weft.shared.EndpointId}
    outcomes:
      - name: no-certificate
        when_related:
          entity: weft.edge.EdgeCertificate
          where: {all: [endpoint_id == input.endpoint_id, state != Retired]}
          exists: false
        error: weft.edge.CertificateNotFound
      - name: retired
        moves: weft.edge.EdgeCertificate.retire
        instances:
          where: {all: [endpoint_id == input.endpoint_id, state != Retired]}
        emits:
          - {event: weft.edge.CertificateRetired, each: changed}
        payload:
          weft.edge.CertificateRetired:
            certificate_id: {changed: certificate_id}
            endpoint_id: input.endpoint_id

views:

  # Section 3, `Border`: the public hosts of a scope (cloudspec, layer rule: of a scope, not of a
  # formation; a formation's hosts are weft.architecture.FormationBorder).
  # weft@6798e7d:ess/4-applications/formations.yaml:2559
  - name: weft.edge.Endpoints
    source: weft.edge.Endpoint
    consistency: read_your_writes
    params:
      - {name: scope_id, type: weft.shared.ScopeId}
    filter: scope_id == param.scope_id
    fields:
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: host, type: weft.edge.Host}

  # § 3 `Border`: the certificate of each public endpoint.
  # weft@6798e7d:ess/5-runtime/edge.yaml:767
  - name: weft.edge.Certificates
    source: weft.edge.EdgeCertificate
    consistency: read_your_writes
    fields:
      - {name: certificate_id, type: weft.shared.EdgeCertificateId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: host, type: weft.edge.Host}
      - {name: not_after, type: Optional<Timestamp>}
      - {name: failure, type: Optional<String>}
      - {name: state, type: weft.edge.EdgeCertificate.State}
