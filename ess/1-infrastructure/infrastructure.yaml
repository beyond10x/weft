# Infrastructure (was `weft.cluster` until 2026-11-26): the cloud's own placement, control plane, nodes, node pools, zones and priority classes.
# Sources: docs/domain-sketch.md "9. Cluster" (lines 436-445), "Planes" (lines 54-63),
# "Components" (lines 65-73), "Lowering (how weft itself is deployed)" (lines 576-583), the
# AccessMode of "2. Access" (lines 146-151), and the priority classes of "10. Scheduling" (line 459).
# Every command here is the ClusterOperator's (Actors, line 102), except the two a node issues
# itself: JoinNode and RecordNodeObservation (NodeAgent, line 112). Actors are written by the
# integration pass. The ControlPlane runs the drain of a tenant cluster's dedicated pool
# (DrainNodePool, DrainNode, RemoveNode, DeleteNodePool; ess/components.yaml, hardening pass 4).
domain: weft.infrastructure


types:
  # Sketch line 440: "management API, scheduler, state store. 1 or 3 replicas." Held as a value
  # of its Cluster: one control plane per cluster, nothing refers to it on its own. Named
  # ControlPlaneSpec so it does not clash with the system actor ControlPlane (integration
  # 2026-11-26).
  - name: weft.infrastructure.ControlPlaneSpec
    kind: struct
    fields:
      - name: replicas
        type: Integer

errors:
  - name: weft.infrastructure.PoolAlreadyRequested
    summary: A node pool for this requested cluster pool exists already, and nothing changed.
  # Sketch lines 147-148: `single-user` is the local placement; a single-user API without login
  # beyond one host would open the cluster to anyone who reaches it.
  - name: weft.infrastructure.SingleUserOutsideLocal
    summary: Single-user access is only for the local placement, and nothing changed.
  # Sketch line 578: "`local`: ... single-user access".
  - name: weft.infrastructure.LocalNeedsSingleUser
    summary: The local placement takes single-user access only, and nothing changed.
  # Sketch line 440: "1 or 3 replicas".
  - name: weft.infrastructure.InvalidReplicaCount
    summary: A control plane runs 1 or 3 replicas, and nothing changed.
  # Sketch line 578: "`local`: one process is control plane and worker".
  - name: weft.infrastructure.LocalHasOneReplica
    summary: A local cluster runs its control plane in one process, and nothing changed.
events:
  - name: weft.infrastructure.ControlPlaneScaled
    fields:
      - {name: cloud_id, type: weft.shared.CloudId}
      - {name: control_plane, type: weft.infrastructure.ControlPlaneSpec}

commands:
  # Sketch line 440: "1 or 3 replicas"; line 578: a local cluster is one process.
  # OPEN: whether a move to 3 replicas is refused while the cluster has fewer than 3 nodes of
  # role control or both.
  - name: weft.infrastructure.ScaleControlPlane
    naming:
      display: Scale a cloud's control plane
    input:
      - {name: cloud_id, type: weft.shared.CloudId}
      - {name: control_plane, type: weft.infrastructure.ControlPlaneSpec}
    outcomes:
      - name: invalid-replica-count
        when: {control_plane.replicas: {none_of: [1, 3]}}
        error: weft.infrastructure.InvalidReplicaCount
      - name: no-such-cluster
        unknown_instance: true
        error: weft.infrastructure.NotFound
      - name: local-has-one-replica
        when: {control_plane.replicas: 3}
        when_subject: {predicate: placement == Local}
        error: weft.infrastructure.LocalHasOneReplica
      - name: scaled
        updates: weft.infrastructure.Cloud
        instance: cloud_id
        sets:
          control_plane: input.control_plane
        emits: [weft.infrastructure.ControlPlaneScaled]
        payload:
          weft.infrastructure.ControlPlaneScaled:
            cloud_id: input.cloud_id
            control_plane: input.control_plane

views:
  # Sketch line 453, hardening pass 4: the live pools made for a tenant cluster's dedicated pool.
  # The ControlPlane joins it with weft.cluster.UnlinkedClusterNodePools on
  # requested_for == cluster_node_pool_id (level step in ess/components.yaml).
  - name: weft.infrastructure.TenantNodePools
    source: weft.infrastructure.NodePool
    consistency: read_your_writes
    filter: {all: [defined(requested_for), state == Active]}
    fields:
      - {name: node_pool_id, type: weft.shared.NodePoolId}
      - {name: requested_for, type: Optional<Uuid>}
      - {name: zone, type: weft.shared.ZoneName}
