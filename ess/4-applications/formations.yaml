# Formations: the deployable unit of weft. Source: docs/domain-sketch.md section 3 "Formation (the
# outer frame)". Releases, plans, simulation and drift are `weft.deployments`
# (section 5); a component's package, shape and claims are `weft.workloads` (section 4).
#
# Model: a formation holds one editable topology (components, links, border, config, environments)
# as rows of this domain. "Changing the border, adding a link or splitting a component is an edit
# and a new revision" ("Topology as data"): each edit changes a row, and CommitRevision freezes the current
# topology into an immutable FormationRevision.
# OPEN: the sketch does not say whether the topology is edited row by row (this file) or only
# replaced as a whole document. Taken: rows, so that link and border rules are guards over typed
# rows; a whole document arrives as a translation (section 5) that writes the same rows.
domain: weft.formations

summary: >-
  Exports: one formation of an account offers an endpoint to another account by name, until it
  is revoked. Formations, their components, links, revisions and environments are declared in
  weft.architecture (the vendored blocks).

naming:
  wire: weft
  display: Formations

types:
  # Identities of rows only this domain addresses. Other domains name a component by
  # (weft.shared.FormationId, weft.shared.ComponentName).

entities:
  # Section 1 "Accounts", sketch lines 139-140: "Nothing crosses accounts unless an `Export` names
  # it (an endpoint shared to another account)." The endpoint is this domain's (section 3,
  # `Border`), so the export sits beside it; the accounts are `weft.accounts`', named by
  # weft.shared.ScopeId and weft.shared.TenantId.
  # OPEN: whether an export may cross tenants. Taken: no; both accounts belong to one tenant,
  # and a cross-tenant export is refused.
  # OPEN: whether the receiving account must accept an export. Taken: no; an export only lets
  # the receiving account's workloads reach the endpoint, and their own links still declare it
  # (sketch line 12).
  # OPEN: whether one export names one receiving account only or that account and the accounts
  # below it. Taken: that account only.
  # Integration 2 (decided): RemoveEndpoint refuses while an active export names the endpoint
  # (`ExportsRemain`), so no active export outlives its endpoint. A revoked export is a record
  # and keeps the endpoint's id after the endpoint is gone: the endpoint is referenced, not owner.
  # While Export was `weft.accounts`', closing either account revoked it. Taken in wave 4 (the
  # brief's answer to "Account close vs active exports", docs/open-questions.md): the close
  # proceeds, and RevokeAccountExports, bound to `weft.accounts.AccountClosed`, revokes every
  # active export from or to the account (R6, § 14 line 590).
  # OPEN: confirm with the owner that the close proceeds rather than being refused while active
  # exports remain; between the close and the binding's delivery an export of a closed account is
  # still Active.
  - name: weft.formations.Export
    naming:
      summary: One endpoint of one account shared to one other account of the same tenant.
    identity:
      name: export_id
      type: weft.shared.ExportId
    fields:
      - name: tenant_id
        type: weft.shared.TenantId
      - name: endpoint_id
        type: weft.shared.EndpointId
      - name: from_account_id
        type: weft.shared.ScopeId
        summary: The account the endpoint belongs to.
      - name: to_account_id
        type: weft.shared.ScopeId
        summary: The account whose workloads may reach the endpoint.
    # The tenant and both accounts are `weft.accounts`' (layer 2) and stand on their own.
    relations:
      - {name: endpoint, kind: references, target: weft.edge.Endpoint, cardinality: one, via: endpoint_id}
      - {name: tenant, kind: references, target: weft.accounts.Tenant, cardinality: one, via: tenant_id}
      - {name: from_account, kind: references, target: weft.scope.Scope, cardinality: one, via: from_account_id}
      - {name: to_account, kind: references, target: weft.scope.Scope, cardinality: one, via: to_account_id}
    lifecycle:
      initial: Active
      states: [Active, Revoked]
      terminal: [Revoked]
      transitions:
        - name: revoke
          from: [Active]
          to: Revoked

errors:
  - name: weft.formations.NoSuchCluster
    summary: The cluster does not exist, was deleted, or belongs to another account; nothing was created.
  - name: weft.formations.ExportsRemain
    summary: An active export still shares this endpoint with another account, and nothing was removed.
  - name: weft.formations.SelfExport
    summary: An export names the same account on both sides; nothing was exported.
  - name: weft.formations.ExportExists
    summary: This endpoint is already exported to this account, and nothing was exported.
  - name: weft.formations.EndpointNotInAccount
    summary: The endpoint does not belong to the exporting account, so nothing was exported.
  - name: weft.formations.ExportNotPermitted
    summary: The caller holds no role on the exporting account that may export, so nothing crossed accounts.
  - name: weft.formations.ExportNotFound
    summary: No export has this identifier, and nothing changed.
  - name: weft.formations.ExportNotActive
    summary: The export is revoked already, and nothing changed.
  - name: weft.formations.AccountNotClosed
    summary: The account does not exist or is still open, so no export was revoked.
events:
  - name: weft.formations.ExportCreated
    fields:
      - {name: export_id, type: weft.shared.ExportId}
      - {name: tenant_id, type: weft.shared.TenantId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: from_account_id, type: weft.shared.ScopeId}
      - {name: to_account_id, type: weft.shared.ScopeId}
  - name: weft.formations.ExportRevoked
    fields:
      - {name: export_id, type: weft.shared.ExportId}
  # One per RevokeAccountExports; each export it revoked also gets its own ExportRevoked.
  - name: weft.formations.AccountExportsRevoked
    fields:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: revoked, type: Integer}
commands:
  # Section 1 "Accounts", sketch lines 139-140: an Export names one endpoint shared to another
  # account. Exporting widens access to the endpoint, so it is refused unless both accounts are
  # open and in the caller's tenant, the endpoint is the exporting account's, and the caller may
  # export. `tenant_id` is the tenant both accounts must belong to; each is checked against it.
  # The accounts are `weft.accounts`' rows; this domain holds only their identifiers, so every
  # check on them is external, as in CreateFormation.
  - name: weft.formations.CreateExport
    naming:
      display: Export an endpoint to another account
    input:
      - {name: tenant_id, type: weft.shared.TenantId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: from_account_id, type: weft.shared.ScopeId}
      - {name: to_account_id, type: weft.shared.ScopeId}
    outcomes:
      - name: same-account
        when: from_account_id == to_account_id
        error: weft.formations.SelfExport
      - name: no-such-from-account
        external: the exporting account does not exist or is closed
        before_row: true
        error: weft.architecture.NoSuchScope
      # hardening pass 1 D3: the exporting account is the account the request acts in; another
      # account answers as a missing one.
      - name: from-not-callers-account
        when: from_account_id != caller.scope_id
        error: weft.architecture.NoSuchScope
      # hardening pass 1 D3: the tenant named is the caller's; another tenant answers as a
      # missing account.
      - name: not-callers-tenant
        when: tenant_id != caller.tenant_id
        error: weft.architecture.NoSuchScope
      # hardening pass 1 disclosure (formations.yaml:1440): was CrossTenantExport, which told the
      # caller that an account of another tenant exists; now it answers as a missing account.
      - name: from-other-tenant
        external: the exporting account does not belong to the tenant named
        before_row: true
        error: weft.architecture.NoSuchScope
      - name: no-such-to-account
        external: the receiving account does not exist or is closed
        before_row: true
        error: weft.architecture.NoSuchScope
      # hardening pass 1 disclosure (formations.yaml:1444): was CrossTenantExport, which told the
      # caller that an account of another tenant exists; now it answers as a missing account.
      - name: to-other-tenant
        external: the receiving account does not belong to the tenant named
        before_row: true
        error: weft.architecture.NoSuchScope
      # The endpoint's formation names its account; the account check reads two rows and the
      # account is `weft.accounts`', so it stays external. A missing endpoint answers the same.
      # hardening pass 1 disclosure: moved before `already-exported` and answered before the rows
      # (`before_row`, like the account checks above), so the active exports of another account's
      # endpoint are not read out before the ownership refusal.
      - name: endpoint-not-in-account
        external: the endpoint does not belong to a formation of the exporting account
        before_row: true
        error: weft.formations.EndpointNotInAccount
      - name: already-exported
        when_related:
          entity: weft.formations.Export
          where:
            all:
              - endpoint_id == input.endpoint_id
              - to_account_id == input.to_account_id
              - state == Active
          exists: true
        error: weft.formations.ExportExists
      # OPEN: which role may export. Taken: owner, and admin of the exporting account or an
      # account above it; deployer may not.
      - name: export-not-permitted
        external: the caller holds no role on the exporting account or above it that may export
        error: weft.formations.ExportNotPermitted
      - name: exported
        creates: weft.formations.Export
        instance: export_id
        sets:
          tenant_id: input.tenant_id
          endpoint_id: input.endpoint_id
          from_account_id: input.from_account_id
          to_account_id: input.to_account_id
        emits: [weft.formations.ExportCreated]
        payload:
          weft.formations.ExportCreated:
            export_id: {generated: true}
            tenant_id: input.tenant_id
            endpoint_id: input.endpoint_id
            from_account_id: input.from_account_id
            to_account_id: input.to_account_id

  # Section 1 "Accounts", sketch lines 139-140. Revoking an export narrows access and is never
  # refused for that.
  - name: weft.formations.RevokeExport
    naming:
      display: Revoke an export
    input:
      - {name: export_id, type: weft.shared.ExportId}
    outcomes:
      - name: no-such-export
        unknown_instance: true
        error: weft.formations.ExportNotFound
      # hardening pass 1 D3: only the exporting account revokes its export; an export of another
      # account answers as a missing one, before its state is read.
      # OPEN: whether the receiving account may revoke an export into it. Taken: no (deny by
      # default).
      - name: not-callers-export
        when_subject: {predicate: from_account_id != caller.scope_id}
        error: weft.formations.ExportNotFound
      - name: revoked
        moves: weft.formations.Export.revoke
        instance: export_id
        emits: [weft.formations.ExportRevoked]
        payload:
          weft.formations.ExportRevoked:
            export_id: input.export_id
      - name: wrong-state
        wrong_state: true
        error: weft.formations.ExportNotActive

  # Sketch § 14 line 590, R6: "account closed -> its exports revoked". Sketch lines 139-140: an
  # export names two accounts, and closing either one ends it. Decided (wave 4, open question
  # "Account close vs active exports" in docs/open-questions.md): the close proceeds and this
  # cascade revokes every active export from or to the account, invoked by one binding on
  # weft.accounts.AccountClosed (scope_id). Many-rows form: `instances:` selects the rows.
  # Only a closed account's exports are revoked this way; an open account's exports are revoked
  # one by one with RevokeExport. A repeated delivery finds no active export and revokes none.
  - name: weft.formations.RevokeAccountExports
    naming:
      display: Revoke every export of a closed account
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
    outcomes:
      - name: no-such-account
        when_related: {via: input.scope_id, exists: false}
        error: weft.formations.AccountNotClosed
      - name: account-open
        when_related: {via: input.scope_id, predicate: state != Closed}
        error: weft.formations.AccountNotClosed
      - name: revoked
        moves: weft.formations.Export.revoke
        instances:
          where:
            all:
              - any:
                  - from_account_id == input.scope_id
                  - to_account_id == input.scope_id
              - state == Active
        emits:
          - weft.formations.AccountExportsRevoked
          - {event: weft.formations.ExportRevoked, each: changed}
        payload:
          weft.formations.AccountExportsRevoked:
            scope_id: input.scope_id
            revoked: {count: changed}
          weft.formations.ExportRevoked:
            export_id: {changed: export_id}

views:
  # Section 1 "Accounts", sketch lines 139-140: the exports of one account, out of it and into it.
  - name: weft.formations.AccountExports
    source: weft.formations.Export
    consistency: read_your_writes
    params:
      - {name: scope_id, type: weft.shared.ScopeId}
    filter:
      any:
        - from_account_id == param.scope_id
        - to_account_id == param.scope_id
    fields:
      - {name: export_id, type: weft.shared.ExportId}
      - {name: tenant_id, type: weft.shared.TenantId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: from_account_id, type: weft.shared.ScopeId}
      - {name: to_account_id, type: weft.shared.ScopeId}
      - {name: state, type: weft.formations.Export.State}
