  - name: weft.formations.ConfigOverrideSet
    fields:
      - {name: override_id, type: weft.shared.ConfigOverrideId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: config_id, type: weft.shared.ConfigId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
  - name: weft.formations.ConfigOverrideChanged
    fields:
      - {name: override_id, type: weft.shared.ConfigOverrideId}
      - {name: formation_id, type: weft.shared.FormationId}
  - name: weft.formations.ConfigOverrideRemoved
    fields:
      - {name: override_id, type: weft.shared.ConfigOverrideId}
      - {name: formation_id, type: weft.shared.FormationId}
  - name: weft.formations.ScaleSet
    fields:
      - {name: scale_setting_id, type: weft.shared.ScaleSettingId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: min_replicas, type: Integer}
      - {name: max_replicas, type: Integer}
  - name: weft.formations.ScaleChanged
    fields:
      - {name: scale_setting_id, type: weft.shared.ScaleSettingId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: min_replicas, type: Integer}
      - {name: max_replicas, type: Integer}
  - name: weft.formations.ScaleRemoved
    fields:
      - {name: scale_setting_id, type: weft.shared.ScaleSettingId}
      - {name: formation_id, type: weft.shared.FormationId}

commands:
  # Section 3, `Formation`. A new formation holds no component and an empty quota slice.
  - name: weft.formations.CreateFormation
    naming:
      display: Create a formation
    input:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: name, type: weft.formations.FormationName}
      # Section 10 line 456, the formation's zone rules (see Formation.zones). Empty: any zone.
      - {name: zones, type: List<weft.shared.ZoneName>}
      # design:tenant-clusters step 3: the cluster to deploy into.
      - {name: cluster_id, type: weft.shared.ClusterId}
    outcomes:
      - name: no-such-account
        external: the account does not exist or is closed
        before_row: true
        error: weft.formations.NoSuchAccount
      # hardening pass 1 D3: the formation is created only in the account the request acts in;
      # another account answers as a missing one, so its existence is not disclosed.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.formations.NoSuchAccount
      # design:tenant-clusters step 3: a deleted cluster and another account's cluster answer as a
      # missing one. The default cluster (no account) takes every account.
      - name: no-such-cluster
        when_related: {via: input.cluster_id, exists: false}
        error: weft.formations.NoSuchCluster
      - name: cluster-deleted
        when_related: {via: input.cluster_id, predicate: state == Deleted}
        error: weft.formations.NoSuchCluster
      - name: cluster-of-other-account
        when_related:
          entity: weft.cluster.Cluster
          where:
            all:
              - cluster_id == input.cluster_id
              - defined(account_id)
              - account_id != input.account_id
          exists: true
        error: weft.formations.NoSuchCluster
      - name: name-taken
        when_related:
          entity: weft.formations.Formation
          where:
            all:
              - account_id == input.account_id
              - name == input.name
          exists: true
        error: weft.formations.FormationNameTaken
      - name: created
        creates: weft.formations.Formation
        instance: formation_id
        sets:
          account_id: input.account_id
          name: input.name
          internal_domain: {generated: true}
          quota_slice: []
          zones: input.zones
          cluster_id: input.cluster_id
        emits: [weft.formations.FormationCreated]
        payload:
          weft.formations.FormationCreated:
            formation_id: {generated: true}
            account_id: input.account_id
            name: input.name

  # Section 3, `Formation` "a quota slice"; section 1, `Quota`: "A child's quota is at most its
  # parent's remaining quota". The account's remaining quota is `weft.accounts`', so the check is
  # external.
  - name: weft.formations.SetFormationQuota
    naming:
      display: Set a formation's quota slice
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: quota_slice, type: List<weft.shared.ResourceAmount>}
    outcomes:
      # Was the `amount >= 0` invariant of the local QuotaAmount type, before the shared
      # ResourceAmount replaced it.
      - name: negative-amount
        when:
          exists: {in: quota_slice, as: q, that: q.amount < 0}
        error: weft.formations.NegativeQuotaAmount
      - name: no-such-formation
        unknown_instance: true
        error: weft.formations.NoSuchFormation
      # hardening pass 1 D3: a formation of another account answers as a missing one, before its
      # state is read.
      - name: not-callers-formation
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.formations.NoSuchFormation
      - name: retired
        when_subject: {predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: over-quota
        external: the slice exceeds the account's remaining quota of a resource class
        error: weft.formations.QuotaExceeded
      - name: set
        updates: weft.formations.Formation
        instance: formation_id
        sets:
          quota_slice: input.quota_slice
        emits: [weft.formations.FormationQuotaSet]
        payload:
          weft.formations.FormationQuotaSet:
            formation_id: input.formation_id
            quota_slice: input.quota_slice

  # OPEN: the sketch names no removal of a formation. Taken: retire, refused while any release of
  # it is live (`weft.deployments` decides, so the check is external).
  - name: weft.formations.RetireFormation
    naming:
      display: Retire a formation
    input:
      - {name: formation_id, type: weft.shared.FormationId}
    outcomes:
      - name: no-such-formation
        unknown_instance: true
        error: weft.formations.NoSuchFormation
      # hardening pass 1 D3: a formation of another account answers as a missing one, before its
      # releases or its state are read.
      - name: not-callers-formation
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.formations.NoSuchFormation
      - name: releases-live
        external: a release of this formation is live
        error: weft.formations.ReleasesLive
      - name: retired
        moves: weft.formations.Formation.retire
        instance: formation_id
        emits: [weft.formations.FormationRetired]
        payload:
          weft.formations.FormationRetired:
            formation_id: input.formation_id
      - name: wrong-state
        wrong_state: true
        error: weft.formations.FormationStateConflict

  # Section 3, `FormationRevision`, and "Topology as data": "an edit and a new revision": freeze the formation's current
  # document. A translation of section 5 "Translation" commits through this command and records
  # the revision id on its own row.
  # OPEN: whether a commit with no change since the last revision records a second revision.
  # Taken: yes; the digest shows they are equal.
  - name: weft.formations.CommitRevision
    naming:
      display: Commit a formation revision
    input:
      - {name: formation_id, type: weft.shared.FormationId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: empty
        when_related:
          entity: weft.formations.Component
          where: formation_id == input.formation_id
          exists: false
        error: weft.formations.EmptyFormation
      - name: committed
        creates: weft.formations.FormationRevision
        instance: revision_id
        sets:
          formation_id: input.formation_id
          number: {generated: true}
          document_digest: {generated: true}
        emits: [weft.formations.RevisionCommitted]
        payload:
          weft.formations.RevisionCommitted:
            revision_id: {generated: true}
            formation_id: input.formation_id
            number: {generated: true}
            document_digest: {generated: true}

  # Section 3, `Environment`.
  - name: weft.formations.CreateEnvironment
    naming:
      display: Create an environment
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.formations.EnvironmentName}
      # Design ci-cd-support § Security: production is marked when the environment is made.
      - {name: protected, type: Boolean}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: name-taken
        when_related:
          entity: weft.formations.Environment
          where:
            all:
              - formation_id == input.formation_id
              - name == input.name
          exists: true
        error: weft.formations.EnvironmentNameTaken
      - name: created
        creates: weft.formations.Environment
        instance: environment_id
        sets:
          formation_id: input.formation_id
          name: input.name
          quota_slice: []
          origin: Manual
          protected: input.protected
          source_repository: {cleared: true}
          pull_request: {cleared: true}
          expires_at: {cleared: true}
        emits: [weft.formations.EnvironmentCreated]
        payload:
          weft.formations.EnvironmentCreated:
            environment_id: {generated: true}
            formation_id: input.formation_id
            name: input.name

  # Section 3, `Environment`: "its own ... quotas". An environment's slice is at most what the
  # formation's slice has left after the other environments (section 1, `Quota`); the sum over
  # environments is not a guard ESS states here, so the check is external.
  - name: weft.formations.SetEnvironmentQuota
    naming:
      display: Set an environment's quota slice
    input:
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: quota_slice, type: List<weft.shared.ResourceAmount>}
    outcomes:
      # Was the `amount >= 0` invariant of the local QuotaAmount type.
      - name: negative-amount
        when:
          exists: {in: quota_slice, as: q, that: q.amount < 0}
        error: weft.formations.NegativeQuotaAmount
      - name: no-such-environment
        unknown_instance: true
        error: weft.formations.NoSuchEnvironment
      - name: retired
        when_subject: {predicate: state == Retired}
        error: weft.formations.EnvironmentStateConflict
      - name: over-quota
        external: the slice exceeds what the formation's slice has left after its other environments
        error: weft.formations.QuotaExceeded
      - name: set
        updates: weft.formations.Environment
        instance: environment_id
        sets:
          quota_slice: input.quota_slice
        emits: [weft.formations.EnvironmentQuotaSet]
        payload:
          weft.formations.EnvironmentQuotaSet:
            environment_id: input.environment_id
            quota_slice: input.quota_slice

  # Design ci-cd-support § Stage 1.3: "`weft deploy --preview` from a pull-request job creates
  # or updates it". A preview is never protected. Its name is `pr-<number>`, chosen by the CLI.
  # OPEN: a sleep policy by default (design § Stage 1.3) is the workloads' scale setting, not set
  # here. Taken: the CLI sets it after the create.
  - name: weft.formations.CreatePreviewEnvironment
    naming:
      display: Create a preview environment for a pull request
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.formations.EnvironmentName}
      - {name: source_repository, type: String}
      - {name: pull_request, type: Integer}
      - {name: expires_at, type: Timestamp}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: name-taken
        when_related:
          entity: weft.formations.Environment
          where:
            all:
              - formation_id == input.formation_id
              - name == input.name
          exists: true
        error: weft.formations.EnvironmentNameTaken
      - name: created
        creates: weft.formations.Environment
        instance: environment_id
        sets:
          formation_id: input.formation_id
          name: input.name
          quota_slice: []
          origin: PullRequest
          protected: false
          source_repository: input.source_repository
          pull_request: input.pull_request
          expires_at: input.expires_at
        emits: [weft.formations.EnvironmentCreated]
        payload:
          weft.formations.EnvironmentCreated:
            environment_id: {generated: true}
            formation_id: input.formation_id
            name: input.name

  # Design ci-cd-support § Stage 1.3: "closing the pull request (forge webhook, stage 2) or the
  # expiry retires it". Time form (sketch § 14): a system actor calls it for each preview past its
  # expiry. Only previews end this way; the releases-live check of RetireEnvironment does not
  # apply: an expired preview's release ends with it.
  # OPEN: the pull-request-closed webhook calls RetireEnvironment (no edge domain yet, sketch § 14).
  - name: weft.formations.ExpirePreviewEnvironment
    naming:
      display: Retire a preview environment past its expiry
    input:
      - {name: environment_id, type: weft.shared.EnvironmentId}
    outcomes:
      - name: no-such-environment
        unknown_instance: true
        error: weft.formations.NoSuchEnvironment
      - name: not-a-preview
        when_subject:
          predicate: origin == Manual
        error: weft.formations.EnvironmentStateConflict
      - name: not-yet
        when_subject:
          predicate: expires_at > now
        error: weft.formations.EnvironmentStateConflict
      - name: expired
        moves: weft.formations.Environment.retire
        instance: environment_id
        emits: [weft.formations.EnvironmentRetired]
        payload:
          weft.formations.EnvironmentRetired:
            environment_id: input.environment_id
      - name: wrong-state
        wrong_state: true
        error: weft.formations.EnvironmentStateConflict

  # OPEN: the sketch names no removal of an environment. Taken: retire, refused while a release
  # to it is live (`weft.deployments`, external).
  - name: weft.formations.RetireEnvironment
    naming:
      display: Retire an environment
    input:
      - {name: environment_id, type: weft.shared.EnvironmentId}
    outcomes:
      # Releases are `weft.deployments`' (layer 6, section 5 "Releases"): a higher layer, so no
      # guard here may read them, and the check stays external.
      # `before_row: true` (soundness pass, 2026-11-26): a release names an environment that
      # exists and is Active (this command refuses to retire one while a release is live), so for
      # an unknown or retired id the fact is false and answering it first changes no reply. Set so
      # the injected scenario does not depend on arranging an Environment: ESS 0.99.2 cannot arrange
      # one (CreateEnvironment's `name-taken` row set beside its `via` guards) and sent the injected
      # scenario to an id no row has, which the interpreted target answered `no-such-environment`.
      # OPEN: confirm with the owner that the external answers before the existence check.
      - name: releases-live
        external: a release to this environment is live
        before_row: true
        error: weft.formations.ReleasesLive
      - name: no-such-environment
        unknown_instance: true
        error: weft.formations.NoSuchEnvironment
      - name: retired
        moves: weft.formations.Environment.retire
        instance: environment_id
        emits: [weft.formations.EnvironmentRetired]
        payload:
          weft.formations.EnvironmentRetired:
            environment_id: input.environment_id
      - name: wrong-state
        wrong_state: true
        error: weft.formations.EnvironmentStateConflict

  # Section 3, `Component`; the example's `components:`. The component starts internal: not on the border,
  # reached by no link. Its InternalName (section 3, `InternalName`) is minted as `<name>.<formation>.internal`.
  - name: weft.formations.AddComponent
    naming:
      display: Add a component
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.shared.ComponentName}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: name-taken
        when_related:
          entity: weft.formations.Component
          where:
            all:
              - formation_id == input.formation_id
              - name == input.name
          exists: true
        error: weft.formations.ComponentNameTaken
      - name: added
        creates: weft.formations.Component
        instance: component_id
        sets:
          formation_id: input.formation_id
          name: input.name
          internal_name: {generated: true}
          on_border: false
        emits: [weft.formations.ComponentAdded]
        payload:
          weft.formations.ComponentAdded:
            component_id: {generated: true}
            formation_id: input.formation_id
            name: input.name
            internal_name: {generated: true}

  # Section 3, "Topology as data": "splitting a component is an edit". A component still named by a link,
  # route, mount or scale setting is refused: those go first, so no access outlives an edit by
  # accident.
  - name: weft.formations.RemoveComponent
    naming:
      display: Remove a component
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: component_id, type: weft.shared.ComponentId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      # weft-sim, 2026-11-26: the interpreter answers an unknown subject id before any guard and,
      # with no `unknown_instance` outcome, with a refusal no outcome declares. `unknown-<x>` is
      # that answer, here and in every command of this file that updates, moves or deletes the
      # row its input names. `no-such-<x>` stays: ESS 0.99.2 requires it for the `foreign-<x>`
      # guard that reads the row through `via` (ESS-COMMAND-005); `when_subject` cannot replace
      # that guard beside a row set (ESS-COMMAND-009) or after `no-such-formation`
      # (ESS-COMMAND-004).
      - name: unknown-component
        unknown_instance: true
        error: weft.formations.NoSuchComponent
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.formations.NoSuchComponent
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchComponent
      # A link names the component as its caller (`linked`) or as its target (`linked-as-target`).
      # Two row sets with one equality each, not one with `any:`: synthesis scopes a row set only
      # by an equality with the input (soundness pass, 2026-11-26).
      - name: linked
        when_related:
          entity: weft.formations.Link
          where: caller_component_id == input.component_id
          exists: true
        error: weft.formations.ComponentInUse
      - name: linked-as-target
        when_related:
          entity: weft.formations.Link
          where: target_component_id == input.component_id
          exists: true
        error: weft.formations.ComponentInUse
      - name: routed
        when_related:
          entity: weft.formations.Route
          where: component_id == input.component_id
          exists: true
        error: weft.formations.ComponentInUse
      - name: mounted
        when_related:
          entity: weft.formations.ConfigMount
          where: component_id == input.component_id
          exists: true
        error: weft.formations.ComponentInUse
      - name: scaled
        when_related:
          entity: weft.formations.ScaleSetting
          where: component_id == input.component_id
          exists: true
        error: weft.formations.ComponentInUse
      - name: removed
        deletes: weft.formations.Component
        instance: component_id
        emits: [weft.formations.ComponentRemoved]
        payload:
          weft.formations.ComponentRemoved:
            component_id: input.component_id
            formation_id: input.formation_id

  # Section 3, `Border`, and the example's `border: [gateway]`: put a component on the
  # border. This widens access, so it is its own command; a route to the component still needs
  # AddRoute.
  - name: weft.formations.AddToBorder
    naming:
      display: Put a component on the border
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: component_id, type: weft.shared.ComponentId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-component
        unknown_instance: true
        error: weft.formations.NoSuchComponent
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.formations.NoSuchComponent
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchComponent
      - name: bordered
        updates: weft.formations.Component
        instance: component_id
        sets:
          on_border: true
        emits: [weft.formations.ComponentBordered]
        payload:
          weft.formations.ComponentBordered:
            component_id: input.component_id
            formation_id: input.formation_id

  # Section 3, `Border`: "Everything else is internal": take a component off the border. Refused
  # while a route still sends traffic to it.
  - name: weft.formations.RemoveFromBorder
    naming:
      display: Take a component off the border
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: component_id, type: weft.shared.ComponentId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-component
        unknown_instance: true
        error: weft.formations.NoSuchComponent
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.formations.NoSuchComponent
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchComponent
      - name: routed
        when_related:
          entity: weft.formations.Route
          where: component_id == input.component_id
          exists: true
        error: weft.formations.RoutesRemain
      - name: unbordered
        updates: weft.formations.Component
        instance: component_id
        sets:
          on_border: false
        emits: [weft.formations.ComponentUnbordered]
        payload:
          weft.formations.ComponentUnbordered:
            component_id: input.component_id
            formation_id: input.formation_id

  # Section 3, `Link`; the example's `links:` (`gateway -> orders`). Allows the caller to
  # resolve and call the target on one protocol and port; nothing else is allowed between them.
  # Both components must be of this formation (a foreign component answers as not found, so its
  # existence is not disclosed).
  # OPEN: whether a link to a port the target's workload does not serve is refused here, or by
  # the simulation of `weft.deployments` (section 5 "Releases", `Simulation`). Taken: by the simulation.
  - name: weft.formations.AddLink
    naming:
      display: Allow a link
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: caller_component_id, type: weft.shared.ComponentId}
      - {name: target_component_id, type: weft.shared.ComponentId}
      - {name: protocol, type: weft.formations.LinkProtocol}
      - {name: port, type: weft.formations.Port}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: no-such-caller
        when_related: {via: input.caller_component_id, exists: false}
        error: weft.formations.NoSuchComponent
      - name: no-such-target
        when_related: {via: input.target_component_id, exists: false}
        error: weft.formations.NoSuchComponent
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-caller
        when_related: {via: input.caller_component_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchComponent
      - name: foreign-target
        when_related: {via: input.target_component_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchComponent
      - name: exists
        when_related:
          entity: weft.formations.Link
          where:
            all:
              - caller_component_id == input.caller_component_id
              - target_component_id == input.target_component_id
              - protocol == input.protocol
              - port == input.port
          exists: true
        error: weft.formations.LinkExists
      - name: added
        creates: weft.formations.Link
        instance: link_id
        sets:
          formation_id: input.formation_id
          caller_component_id: input.caller_component_id
          target_component_id: input.target_component_id
          protocol: input.protocol
          port: input.port
        emits: [weft.formations.LinkAdded]
        payload:
          weft.formations.LinkAdded:
            link_id: {generated: true}
            formation_id: input.formation_id
            caller_component_id: input.caller_component_id
            target_component_id: input.target_component_id
            protocol: input.protocol
            port: input.port

  # Section 3, `Link`: "Components without a link cannot reach each other": removing the link
  # takes the reach away.
  - name: weft.formations.RemoveLink
    naming:
      display: Remove a link
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: link_id, type: weft.shared.LinkId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-link
        unknown_instance: true
        error: weft.formations.NoSuchLink
      - name: no-such-link
        when_related: {via: input.link_id, exists: false}
        error: weft.formations.NoSuchLink
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-link
        when_related: {via: input.link_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchLink
      - name: removed
        deletes: weft.formations.Link
        instance: link_id
        emits: [weft.formations.LinkRemoved]
        payload:
          weft.formations.LinkRemoved:
            link_id: input.link_id
            formation_id: input.formation_id

  # Section 3, `Border`: "their public `Endpoint`s". A host is held by one endpoint in the
  # cluster. The account must have shown it controls the host.
  # OPEN: how an account proves it controls a host (DNS record, delegated zone) and which domain
  # keeps that proof. Taken: external check, refused by default.
  - name: weft.formations.AddEndpoint
    naming:
      display: Add a public endpoint
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: host, type: weft.formations.Host}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: host-taken
        when_related:
          entity: weft.formations.Endpoint
          where: host == input.host
          exists: true
        error: weft.formations.HostTaken
      - name: host-not-verified
        external: the formation's account has not shown that it controls the host
        error: weft.formations.HostNotVerified
      - name: added
        creates: weft.formations.Endpoint
        instance: endpoint_id
        sets:
          formation_id: input.formation_id
          host: input.host
        emits: [weft.formations.EndpointAdded]
        payload:
          weft.formations.EndpointAdded:
            endpoint_id: {generated: true}
            formation_id: input.formation_id
            host: input.host

  # Section 3, `Border`. Refused while a route or an active export still uses the endpoint.
  - name: weft.formations.RemoveEndpoint
    naming:
      display: Remove a public endpoint
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-endpoint
        unknown_instance: true
        error: weft.formations.NoSuchEndpoint
      - name: no-such-endpoint
        when_related: {via: input.endpoint_id, exists: false}
        error: weft.formations.NoSuchEndpoint
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-endpoint
        when_related: {via: input.endpoint_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchEndpoint
      - name: routed
        when_related:
          entity: weft.formations.Route
          where: endpoint_id == input.endpoint_id
          exists: true
        error: weft.formations.RoutesRemain
      # Integration 2 (decided): an active export names the endpoint; revoke it first.
      - name: exported
        when_related:
          entity: weft.formations.Export
          where:
            all:
              - endpoint_id == input.endpoint_id
              - state == Active
          exists: true
        error: weft.formations.ExportsRemain
      - name: removed
        deletes: weft.formations.Endpoint
        instance: endpoint_id
        emits: [weft.formations.EndpointRemoved]
        payload:
          weft.formations.EndpointRemoved:
            endpoint_id: input.endpoint_id
            formation_id: input.formation_id

  # Section 1 "Accounts", sketch lines 139-140: an Export names one endpoint shared to another
  # account. Exporting widens access to the endpoint, so it is refused unless both accounts are
  # open and in the caller's tenant, the endpoint is the exporting account's, and the caller may
  # export. `tenant_id` is the tenant both accounts must belong to; each is checked against it.
  # The accounts are `weft.accounts`' rows; this domain holds only their identifiers, so every
  # check on them is external, as in CreateFormation.
  - name: weft.formations.CreateExport
    naming:
      display: Export an endpoint to another account
    input:
      - {name: tenant_id, type: weft.shared.TenantId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: from_account_id, type: weft.shared.AccountId}
      - {name: to_account_id, type: weft.shared.AccountId}
    outcomes:
      - name: same-account
        when: from_account_id == to_account_id
        error: weft.formations.SelfExport
      - name: no-such-from-account
        external: the exporting account does not exist or is closed
        before_row: true
        error: weft.formations.NoSuchAccount
      # hardening pass 1 D3: the exporting account is the account the request acts in; another
      # account answers as a missing one.
      - name: from-not-callers-account
        when: from_account_id != caller.account_id
        error: weft.formations.NoSuchAccount
      # hardening pass 1 D3: the tenant named is the caller's; another tenant answers as a
      # missing account.
      - name: not-callers-tenant
        when: tenant_id != caller.tenant_id
        error: weft.formations.NoSuchAccount
      # hardening pass 1 disclosure (formations.yaml:1440): was CrossTenantExport, which told the
      # caller that an account of another tenant exists; now it answers as a missing account.
      - name: from-other-tenant
        external: the exporting account does not belong to the tenant named
        before_row: true
        error: weft.formations.NoSuchAccount
      - name: no-such-to-account
        external: the receiving account does not exist or is closed
        before_row: true
        error: weft.formations.NoSuchAccount
      # hardening pass 1 disclosure (formations.yaml:1444): was CrossTenantExport, which told the
      # caller that an account of another tenant exists; now it answers as a missing account.
      - name: to-other-tenant
        external: the receiving account does not belong to the tenant named
        before_row: true
        error: weft.formations.NoSuchAccount
      # The endpoint's formation names its account; the account check reads two rows and the
      # account is `weft.accounts`', so it stays external. A missing endpoint answers the same.
      # hardening pass 1 disclosure: moved before `already-exported` and answered before the rows
      # (`before_row`, like the account checks above), so the active exports of another account's
      # endpoint are not read out before the ownership refusal.
      - name: endpoint-not-in-account
        external: the endpoint does not belong to a formation of the exporting account
        before_row: true
        error: weft.formations.EndpointNotInAccount
      - name: already-exported
        when_related:
          entity: weft.formations.Export
          where:
            all:
              - endpoint_id == input.endpoint_id
              - to_account_id == input.to_account_id
              - state == Active
          exists: true
        error: weft.formations.ExportExists
      # OPEN: which role may export. Taken: owner, and admin of the exporting account or an
      # account above it; deployer may not.
      - name: export-not-permitted
        external: the caller holds no role on the exporting account or above it that may export
        error: weft.formations.ExportNotPermitted
      - name: exported
        creates: weft.formations.Export
        instance: export_id
        sets:
          tenant_id: input.tenant_id
          endpoint_id: input.endpoint_id
          from_account_id: input.from_account_id
          to_account_id: input.to_account_id
        emits: [weft.formations.ExportCreated]
        payload:
          weft.formations.ExportCreated:
            export_id: {generated: true}
            tenant_id: input.tenant_id
            endpoint_id: input.endpoint_id
            from_account_id: input.from_account_id
            to_account_id: input.to_account_id

  # Section 1 "Accounts", sketch lines 139-140. Revoking an export narrows access and is never
  # refused for that.
  - name: weft.formations.RevokeExport
    naming:
      display: Revoke an export
    input:
      - {name: export_id, type: weft.shared.ExportId}
    outcomes:
      - name: no-such-export
        unknown_instance: true
        error: weft.formations.ExportNotFound
      # hardening pass 1 D3: only the exporting account revokes its export; an export of another
      # account answers as a missing one, before its state is read.
      # OPEN: whether the receiving account may revoke an export into it. Taken: no (deny by
      # default).
      - name: not-callers-export
        when_subject: {predicate: from_account_id != caller.account_id}
        error: weft.formations.ExportNotFound
      - name: revoked
        moves: weft.formations.Export.revoke
        instance: export_id
        emits: [weft.formations.ExportRevoked]
        payload:
          weft.formations.ExportRevoked:
            export_id: input.export_id
      - name: wrong-state
        wrong_state: true
        error: weft.formations.ExportNotActive

  # Sketch § 14 line 590, R6: "account closed -> its exports revoked". Sketch lines 139-140: an
  # export names two accounts, and closing either one ends it. Decided (wave 4, open question
  # "Account close vs active exports" in docs/open-questions.md): the close proceeds and this
  # cascade revokes every active export from or to the account, invoked by one binding on
  # weft.accounts.AccountClosed (account_id). Many-rows form: `instances:` selects the rows.
  # Only a closed account's exports are revoked this way; an open account's exports are revoked
  # one by one with RevokeExport. A repeated delivery finds no active export and revokes none.
  - name: weft.formations.RevokeAccountExports
    naming:
      display: Revoke every export of a closed account
    input:
      - {name: account_id, type: weft.shared.AccountId}
    outcomes:
      - name: no-such-account
        when_related: {via: input.account_id, exists: false}
        error: weft.formations.AccountNotClosed
      - name: account-open
        when_related: {via: input.account_id, predicate: state != Closed}
        error: weft.formations.AccountNotClosed
      - name: revoked
        moves: weft.formations.Export.revoke
        instances:
          where:
            all:
              - any:
                  - from_account_id == input.account_id
                  - to_account_id == input.account_id
              - state == Active
        emits:
          - weft.formations.AccountExportsRevoked
          - {event: weft.formations.ExportRevoked, each: changed}
        payload:
          weft.formations.AccountExportsRevoked:
            account_id: input.account_id
            revoked: {count: changed}
          weft.formations.ExportRevoked:
            export_id: {changed: export_id}

  # Section 3, `Border`: "host and path to a component and port". Only a component on the
  # border may be routed to (section 3, `Border`: "Everything else is internal").
  - name: weft.formations.AddRoute
    naming:
      display: Add a route
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: path, type: String}
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: port, type: weft.formations.Port}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: no-such-endpoint
        when_related: {via: input.endpoint_id, exists: false}
        error: weft.formations.NoSuchEndpoint
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.formations.NoSuchComponent
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-endpoint
        when_related: {via: input.endpoint_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchEndpoint
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchComponent
      - name: not-on-border
        when_related: {via: input.component_id, predicate: on_border == false}
        error: weft.formations.NotOnBorder
      - name: exists
        when_related:
          entity: weft.formations.Route
          where:
            all:
              - endpoint_id == input.endpoint_id
              - path == input.path
          exists: true
        error: weft.formations.RouteExists
      - name: added
        creates: weft.formations.Route
        instance: route_id
        sets:
          formation_id: input.formation_id
          endpoint_id: input.endpoint_id
          path: input.path
          component_id: input.component_id
          port: input.port
        emits: [weft.formations.RouteAdded]
        payload:
          weft.formations.RouteAdded:
            route_id: {generated: true}
            formation_id: input.formation_id
            endpoint_id: input.endpoint_id
            path: input.path
            component_id: input.component_id
            port: input.port

  # Section 3, `Border`.
  - name: weft.formations.RemoveRoute
    naming:
      display: Remove a route
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: route_id, type: weft.shared.RouteId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-route
        unknown_instance: true
        error: weft.formations.NoSuchRoute
      - name: no-such-route
        when_related: {via: input.route_id, exists: false}
        error: weft.formations.NoSuchRoute
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-route
        when_related: {via: input.route_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchRoute
      - name: removed
        deletes: weft.formations.Route
        instance: route_id
        emits: [weft.formations.RouteRemoved]
        payload:
          weft.formations.RouteRemoved:
            route_id: input.route_id
            formation_id: input.formation_id

  # Section 3, `Config`.
  - name: weft.formations.CreateConfig
    naming:
      display: Create a config
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.formations.ConfigName}
      - {name: data, type: "Map<String, String>"}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: name-taken
        when_related:
          entity: weft.formations.Config
          where:
            all:
              - formation_id == input.formation_id
              - name == input.name
          exists: true
        error: weft.formations.ConfigNameTaken
      - name: created
        creates: weft.formations.Config
        instance: config_id
        sets:
          formation_id: input.formation_id
          name: input.name
          data: input.data
        emits: [weft.formations.ConfigCreated]
        payload:
          weft.formations.ConfigCreated:
            config_id: {generated: true}
            formation_id: input.formation_id
            name: input.name

  # Section 3, `Config`: replace a config's data.
  - name: weft.formations.ChangeConfig
    naming:
      display: Change a config's data
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: config_id, type: weft.shared.ConfigId}
      - {name: data, type: "Map<String, String>"}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-config
        unknown_instance: true
        error: weft.formations.NoSuchConfig
      - name: no-such-config
        when_related: {via: input.config_id, exists: false}
        error: weft.formations.NoSuchConfig
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-config
        when_related: {via: input.config_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchConfig
      - name: changed
        updates: weft.formations.Config
        instance: config_id
        sets:
          data: input.data
        emits: [weft.formations.ConfigChanged]
        payload:
          weft.formations.ConfigChanged:
            config_id: input.config_id
            formation_id: input.formation_id

  # Section 3, `Config`. Refused while a mount or an environment's values name the config.
  - name: weft.formations.RemoveConfig
    naming:
      display: Remove a config
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: config_id, type: weft.shared.ConfigId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-config
        unknown_instance: true
        error: weft.formations.NoSuchConfig
      - name: no-such-config
        when_related: {via: input.config_id, exists: false}
        error: weft.formations.NoSuchConfig
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-config
        when_related: {via: input.config_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchConfig
      - name: mounted
        when_related:
          entity: weft.formations.ConfigMount
          where: config_id == input.config_id
          exists: true
        error: weft.formations.ConfigInUse
      - name: overridden
        when_related:
          entity: weft.formations.ConfigOverride
          where: config_id == input.config_id
          exists: true
        error: weft.formations.ConfigInUse
      - name: removed
        deletes: weft.formations.Config
        instance: config_id
        emits: [weft.formations.ConfigRemoved]
        payload:
          weft.formations.ConfigRemoved:
            config_id: input.config_id
            formation_id: input.formation_id

  # Section 3, `Config` "mounted into components as files or environment variables".
  # A component receives only the configs mounted into it (default deny).
  - name: weft.formations.MountConfig
    naming:
      display: Mount a config into a component
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: config_id, type: weft.shared.ConfigId}
      - {name: kind, type: weft.formations.MountKind}
      - {name: target, type: String}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.formations.NoSuchComponent
      - name: no-such-config
        when_related: {via: input.config_id, exists: false}
        error: weft.formations.NoSuchConfig
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchComponent
      - name: foreign-config
        when_related: {via: input.config_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchConfig
      - name: exists
        when_related:
          entity: weft.formations.ConfigMount
          where:
            all:
              - component_id == input.component_id
              - config_id == input.config_id
          exists: true
        error: weft.formations.MountExists
      - name: mounted
        creates: weft.formations.ConfigMount
        instance: mount_id
        sets:
          formation_id: input.formation_id
          component_id: input.component_id
          config_id: input.config_id
          kind: input.kind
          target: input.target
        emits: [weft.formations.ConfigMounted]
        payload:
          weft.formations.ConfigMounted:
            mount_id: {generated: true}
            formation_id: input.formation_id
            component_id: input.component_id
            config_id: input.config_id
            kind: input.kind
            target: input.target

  # Section 3, `Config`.
  - name: weft.formations.UnmountConfig
    naming:
      display: Unmount a config
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: mount_id, type: weft.shared.ConfigMountId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-mount
        unknown_instance: true
        error: weft.formations.NoSuchMount
      - name: no-such-mount
        when_related: {via: input.mount_id, exists: false}
        error: weft.formations.NoSuchMount
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-mount
        when_related: {via: input.mount_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchMount
      - name: unmounted
        deletes: weft.formations.ConfigMount
        instance: mount_id
        emits: [weft.formations.ConfigUnmounted]
        payload:
          weft.formations.ConfigUnmounted:
            mount_id: input.mount_id
            formation_id: input.formation_id

  # Section 3, `Environment` "its own ... config values": one config's values in one environment.
  - name: weft.formations.SetConfigOverride
    naming:
      display: Set a config's values for an environment
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: config_id, type: weft.shared.ConfigId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: data, type: "Map<String, String>"}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: no-such-config
        when_related: {via: input.config_id, exists: false}
        error: weft.formations.NoSuchConfig
      - name: no-such-environment
        when_related: {via: input.environment_id, exists: false}
        error: weft.formations.NoSuchEnvironment
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-config
        when_related: {via: input.config_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchConfig
      - name: foreign-environment
        when_related: {via: input.environment_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchEnvironment
      - name: environment-retired
        when_related: {via: input.environment_id, predicate: state == Retired}
        error: weft.formations.EnvironmentStateConflict
      - name: exists
        when_related:
          entity: weft.formations.ConfigOverride
          where:
            all:
              - config_id == input.config_id
              - environment_id == input.environment_id
          exists: true
        error: weft.formations.OverrideExists
      - name: set
        creates: weft.formations.ConfigOverride
        instance: override_id
        sets:
          formation_id: input.formation_id
          config_id: input.config_id
          environment_id: input.environment_id
          data: input.data
        emits: [weft.formations.ConfigOverrideSet]
        payload:
          weft.formations.ConfigOverrideSet:
            override_id: {generated: true}
            formation_id: input.formation_id
            config_id: input.config_id
            environment_id: input.environment_id

  # Section 3, `Environment`.
  - name: weft.formations.ChangeConfigOverride
    naming:
      display: Change a config's values for an environment
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: override_id, type: weft.shared.ConfigOverrideId}
      - {name: data, type: "Map<String, String>"}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-override
        unknown_instance: true
        error: weft.formations.NoSuchOverride
      - name: no-such-override
        when_related: {via: input.override_id, exists: false}
        error: weft.formations.NoSuchOverride
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-override
        when_related: {via: input.override_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchOverride
      - name: changed
        updates: weft.formations.ConfigOverride
        instance: override_id
        sets:
          data: input.data
        emits: [weft.formations.ConfigOverrideChanged]
        payload:
          weft.formations.ConfigOverrideChanged:
            override_id: input.override_id
            formation_id: input.formation_id

  # Section 3, `Environment`. Without its values the environment reads the config's own data.
  - name: weft.formations.RemoveConfigOverride
    naming:
      display: Remove a config's values for an environment
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: override_id, type: weft.shared.ConfigOverrideId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-override
        unknown_instance: true
        error: weft.formations.NoSuchOverride
      - name: no-such-override
        when_related: {via: input.override_id, exists: false}
        error: weft.formations.NoSuchOverride
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-override
        when_related: {via: input.override_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchOverride
      - name: removed
        deletes: weft.formations.ConfigOverride
        instance: override_id
        emits: [weft.formations.ConfigOverrideRemoved]
        payload:
          weft.formations.ConfigOverrideRemoved:
            override_id: input.override_id
            formation_id: input.formation_id

  # Section 3, `Environment` "its own ... scale settings". Replicas times the component's claims must
  # fit the environment's quota slice; the claims are `weft.workloads`', so that check is
  # external.
  - name: weft.formations.SetScale
    naming:
      display: Set a component's scale in an environment
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: min_replicas, type: Integer}
      - {name: max_replicas, type: Integer}
    outcomes:
      - name: bad-bounds
        when:
          any:
            - min_replicas < 0
            - max_replicas < 1
            - min_replicas > max_replicas
        error: weft.formations.InvalidScaleBounds
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: no-such-environment
        when_related: {via: input.environment_id, exists: false}
        error: weft.formations.NoSuchEnvironment
      - name: no-such-component
        when_related: {via: input.component_id, exists: false}
        error: weft.formations.NoSuchComponent
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-environment
        when_related: {via: input.environment_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchEnvironment
      - name: foreign-component
        when_related: {via: input.component_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchComponent
      - name: environment-retired
        when_related: {via: input.environment_id, predicate: state == Retired}
        error: weft.formations.EnvironmentStateConflict
      - name: exists
        when_related:
          entity: weft.formations.ScaleSetting
          where:
            all:
              - environment_id == input.environment_id
              - component_id == input.component_id
          exists: true
        error: weft.formations.ScaleSettingExists
      - name: over-quota
        external: the maximum replicas times the component's claims exceed the environment's quota slice
        error: weft.formations.QuotaExceeded
      - name: set
        creates: weft.formations.ScaleSetting
        instance: scale_setting_id
        sets:
          formation_id: input.formation_id
          environment_id: input.environment_id
          component_id: input.component_id
          min_replicas: input.min_replicas
          max_replicas: input.max_replicas
        emits: [weft.formations.ScaleSet]
        payload:
          weft.formations.ScaleSet:
            scale_setting_id: {generated: true}
            formation_id: input.formation_id
            environment_id: input.environment_id
            component_id: input.component_id
            min_replicas: input.min_replicas
            max_replicas: input.max_replicas

  # Section 3, `Environment`.
  - name: weft.formations.ChangeScale
    naming:
      display: Change a component's scale in an environment
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: scale_setting_id, type: weft.shared.ScaleSettingId}
      - {name: min_replicas, type: Integer}
      - {name: max_replicas, type: Integer}
    outcomes:
      - name: bad-bounds
        when:
          any:
            - min_replicas < 0
            - max_replicas < 1
            - min_replicas > max_replicas
        error: weft.formations.InvalidScaleBounds
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-scale-setting
        unknown_instance: true
        error: weft.formations.NoSuchScaleSetting
      - name: no-such-scale-setting
        when_related: {via: input.scale_setting_id, exists: false}
        error: weft.formations.NoSuchScaleSetting
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-scale-setting
        when_related: {via: input.scale_setting_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchScaleSetting
      - name: over-quota
        external: the maximum replicas times the component's claims exceed the environment's quota slice
        error: weft.formations.QuotaExceeded
      - name: changed
        updates: weft.formations.ScaleSetting
        instance: scale_setting_id
        sets:
          min_replicas: input.min_replicas
          max_replicas: input.max_replicas
        emits: [weft.formations.ScaleChanged]
        payload:
          weft.formations.ScaleChanged:
            scale_setting_id: input.scale_setting_id
            formation_id: input.formation_id
            min_replicas: input.min_replicas
            max_replicas: input.max_replicas

  # Section 3, `Environment`. Without a setting the component scales by its workload's own ScaleRule.
  - name: weft.formations.RemoveScale
    naming:
      display: Remove a component's scale in an environment
    input:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: scale_setting_id, type: weft.shared.ScaleSettingId}
    outcomes:
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.formations.NoSuchFormation
      - name: unknown-scale-setting
        unknown_instance: true
        error: weft.formations.NoSuchScaleSetting
      - name: no-such-scale-setting
        when_related: {via: input.scale_setting_id, exists: false}
        error: weft.formations.NoSuchScaleSetting
      - name: retired
        when_related: {via: input.formation_id, predicate: state == Retired}
        error: weft.formations.FormationStateConflict
      - name: foreign-scale-setting
        when_related: {via: input.scale_setting_id, predicate: formation_id != input.formation_id}
        error: weft.formations.NoSuchScaleSetting
      - name: removed
        deletes: weft.formations.ScaleSetting
        instance: scale_setting_id
        emits: [weft.formations.ScaleRemoved]
        payload:
          weft.formations.ScaleRemoved:
            scale_setting_id: input.scale_setting_id
            formation_id: input.formation_id

views:
  # Section 3, `Formation`.
  - name: weft.formations.Formations
    source: weft.formations.Formation
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter: account_id == param.account_id
    fields:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: name, type: weft.formations.FormationName}
      - {name: internal_domain, type: String}
      - {name: quota_slice, type: List<weft.shared.ResourceAmount>}
      # Sketch line 46 (`cluster`: "tenant clusters an account creates and deploys formations
      # into"), design:tenant-clusters step 3: the cluster the formation deploys into, so a reader
      # checks a placement against the formation's own cluster rather than the copy on
      # scheduling.SchedulingRequest (weft-sim full setup, 2026-11-26).
      - {name: cluster_id, type: weft.shared.ClusterId}
      - {name: state, type: weft.formations.Formation.State}

  # Section 3, `FormationRevision`: the revisions of one formation, for `weft.deployments` to pick from.
  - name: weft.formations.FormationRevisions
    source: weft.formations.FormationRevision
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: revision_id, type: weft.shared.FormationRevisionId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: number, type: Integer}
      - {name: document_digest, type: weft.shared.ArtifactDigest}

  # Section 3, `Environment`.
  - name: weft.formations.Environments
    source: weft.formations.Environment
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.formations.EnvironmentName}
      - {name: quota_slice, type: List<weft.shared.ResourceAmount>}
      - {name: state, type: weft.formations.Environment.State}

  # Formation topology (section 3 and its "Topology as data"): components, links and border. A view
  # reads one source entity, so the topology is the three views FormationComponents,
  # FormationLinks and FormationBorder, all filtered by the formation.
  - name: weft.formations.FormationComponents
    source: weft.formations.Component
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.shared.ComponentName}
      - {name: internal_name, type: weft.formations.InternalName}
      - {name: on_border, type: Boolean}

  # Topology: links, with both ends by name (the example's `links:`).
  - name: weft.formations.FormationLinks
    source: weft.formations.Link
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: link_id, type: weft.shared.LinkId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: caller_component_id, type: weft.shared.ComponentId}
      - name: caller_name
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: caller_component_id, field: name}}
      - {name: target_component_id, type: weft.shared.ComponentId}
      - name: target_name
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: target_component_id, field: name}}
      - {name: protocol, type: weft.formations.LinkProtocol}
      - {name: port, type: weft.formations.Port}

  # Topology: the border's routes, with the endpoint's host and the component's name (section 3,
  # `Border`). The border's components are FormationComponents rows with `on_border`.
  - name: weft.formations.FormationBorder
    source: weft.formations.Route
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: route_id, type: weft.shared.RouteId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - name: host
        type: Optional<weft.formations.Host>
        field: {related: {via: endpoint_id, field: host}}
      - {name: path, type: String}
      - {name: component_id, type: weft.shared.ComponentId}
      - name: component_name
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: component_id, field: name}}
      - {name: port, type: weft.formations.Port}

  # Section 3, `Border`: the formation's public hosts.
  - name: weft.formations.Endpoints
    source: weft.formations.Endpoint
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: host, type: weft.formations.Host}

  # Section 1 "Accounts", sketch lines 139-140: the exports of one account, out of it and into it.
  - name: weft.formations.AccountExports
    source: weft.formations.Export
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter:
      any:
        - from_account_id == param.account_id
        - to_account_id == param.account_id
    fields:
      - {name: export_id, type: weft.shared.ExportId}
      - {name: tenant_id, type: weft.shared.TenantId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: from_account_id, type: weft.shared.AccountId}
      - {name: to_account_id, type: weft.shared.AccountId}
      - {name: state, type: weft.formations.Export.State}

  # Reachability of a component, inside (section 3, `Link` and `InternalName`): every component that
  # may call it, on which protocol and port. No row, no reach.
  - name: weft.formations.ComponentCallers
    source: weft.formations.Link
    consistency: read_your_writes
    params:
      - {name: component_id, type: weft.shared.ComponentId}
    filter: target_component_id == param.component_id
    fields:
      - {name: link_id, type: weft.shared.LinkId}
      - {name: caller_component_id, type: weft.shared.ComponentId}
      - name: caller_name
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: caller_component_id, field: name}}
      - {name: protocol, type: weft.formations.LinkProtocol}
      - {name: port, type: weft.formations.Port}

  # Reachability of a component, from outside (section 3, `Border`): every host and path
  # routed to it. No row, not reachable from outside.
  - name: weft.formations.ComponentRoutes
    source: weft.formations.Route
    consistency: read_your_writes
    params:
      - {name: component_id, type: weft.shared.ComponentId}
    filter: component_id == param.component_id
    fields:
      - {name: route_id, type: weft.shared.RouteId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - name: host
        type: Optional<weft.formations.Host>
        field: {related: {via: endpoint_id, field: host}}
      - {name: path, type: String}
      - {name: port, type: weft.formations.Port}

  # Section 3, `Config`.
  - name: weft.formations.Configs
    source: weft.formations.Config
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: config_id, type: weft.shared.ConfigId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.formations.ConfigName}
      - {name: data, type: "Map<String, String>"}

  # Section 3, `Config`: which component mounts which config, and how.
  - name: weft.formations.ConfigMounts
    source: weft.formations.ConfigMount
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: mount_id, type: weft.shared.ConfigMountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: config_id, type: weft.shared.ConfigId}
      - {name: kind, type: weft.formations.MountKind}
      - {name: target, type: String}

  # Section 3, `Environment`: an environment's config values.
  - name: weft.formations.ConfigOverrides
    source: weft.formations.ConfigOverride
    consistency: read_your_writes
    params:
      - {name: environment_id, type: weft.shared.EnvironmentId}
    filter: environment_id == param.environment_id
    fields:
      - {name: override_id, type: weft.shared.ConfigOverrideId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: config_id, type: weft.shared.ConfigId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: data, type: "Map<String, String>"}

  # Section 3, `Environment`: an environment's scale settings.
  - name: weft.formations.ScaleSettings
    source: weft.formations.ScaleSetting
    consistency: read_your_writes
    params:
      - {name: environment_id, type: weft.shared.EnvironmentId}
    filter: environment_id == param.environment_id
    fields:
      - {name: scale_setting_id, type: weft.shared.ScaleSettingId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: min_replicas, type: Integer}
      - {name: max_replicas, type: Integer}
