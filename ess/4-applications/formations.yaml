# Formations: the deployable unit of weft. Source: docs/domain-sketch.md section 3 "Formation (the
# outer frame)". Releases, plans, simulation and drift are `weft.deployments`
# (section 5); a component's package, shape and claims are `weft.workloads` (section 4).
#
# Model: a formation holds one editable topology (components, links, border, config, environments)
# as rows of this domain. "Changing the border, adding a link or splitting a component is an edit
# and a new revision" ("Topology as data"): each edit changes a row, and CommitRevision freezes the current
# topology into an immutable FormationRevision.
# OPEN: the sketch does not say whether the topology is edited row by row (this file) or only
# replaced as a whole document. Taken: rows, so that link and border rules are guards over typed
# rows; a whole document arrives as a translation (section 5) that writes the same rows.
domain: weft.formations

summary: >-
  Formations: a set of components that belong together inside one account, their allowed links,
  their border to the outside, their config and their environments, frozen into immutable
  revisions.

naming:
  wire: weft
  display: Formations

types:
  # Identities of rows only this domain addresses. Other domains name a component by
  # (weft.shared.FormationId, weft.shared.ComponentName).

  # Section 3, `Formation`: "named"; the "Topology as data" example's `formation: shop`.
  - name: weft.formations.FormationName
    kind: newtype
    of: String
  # Section 3, `Environment`: "a named target of the same formation (`dev`, `staging`, `prod`)".
  # OPEN: whether environment names are a closed set. Taken: any name; dev, staging, prod are
  # examples.
  - name: weft.formations.EnvironmentName
    kind: newtype
    of: String
  # Section 3, `InternalName`: "a DNS name inside the formation's private network
  # (`orders.shop.internal`)".
  - name: weft.formations.InternalName
    kind: newtype
    of: String
  # Section 3, `Border`: "host and path"; a public DNS host name.
  - name: weft.formations.Host
    kind: newtype
    of: String
  - name: weft.formations.ConfigName
    kind: newtype
    of: String

  # Section 3, `Link` "(protocol, port)" and `Border` "a component and port".
  - name: weft.formations.Port
    kind: newtype
    of: Integer
    invariants:
      - value >= 1
      - value <= 65535
  # OPEN: the sketch names a link's protocol but no list. Taken: the four below.
  - name: weft.formations.LinkProtocol
    kind: enum
    variants: [Http, Grpc, Tcp, Udp]

  # Section 3, `Formation` "a quota slice" and `Environment` "its own ... quotas": a list of
  # weft.shared.ResourceAmount, one amount of one resource class (section 6). The shared type
  # carries no `amount >= 0`; the entities and the commands that set a slice hold it.

  # Section 3, `Config`: "mounted into components as files or environment variables".
  - name: weft.formations.MountKind
    kind: enum
    variants: [File, Env]

  # Design ci-cd-support § Stage 1.3: "an `Environment` gets an origin (`manual`, `pull-request`)".
  - name: weft.formations.EnvironmentOrigin
    kind: enum
    variants: [Manual, PullRequest]

entities:
  # Section 3: "`Formation`: named, inside one account. Owns a private network, a secret
  # scope and a quota slice."
  - name: weft.formations.Formation
    naming:
      summary: A named set of components inside one account, with its private network, secret scope and quota slice.
    identity:
      name: formation_id
      type: weft.shared.FormationId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: name
        type: weft.formations.FormationName
      # The private network's DNS domain, `<formation>.internal` (section 3, `InternalName`: `orders.shop.internal`).
      # OPEN: the private network's address range and how it is allocated; taken: the
      # implementation mints the domain, and the network is the implicit claim of section 4 "Claims".
      - name: internal_domain
        type: String
      # The formation itself is the secret scope of section 7, `Secret` ("formation ... scope");
      # `weft.secrets` keys its secrets by this formation's id, so no field is stored here.
      - name: quota_slice
        type: List<weft.shared.ResourceAmount>
      # Section 10 line 456 (the scheduler's input: "formation's zone rules"); docs/open-questions.md
      # "workloads loops" (wave 4, decided): the zones the formation's instances may run in, given
      # at creation. Empty: any zone. weft.workloads.InstanceCreated carries it to the scheduler.
      # OPEN: no command changes it after creation, and CreateFormation does not refuse a name no
      # weft.infrastructure.Zone declares (a `when_related: {via: input.zones, exists: false}` guard with
      # an error of its own would); the scheduler meets such a zone as one with no node.
      - name: zones
        type: List<weft.shared.ZoneName>
      # design:tenant-clusters step 3 (integrator, 2026-11-26): the tenant cluster the formation
      # deploys into; the CLI fills the cloud's default cluster. Fixed at creation.
      - name: cluster_id
        type: weft.shared.ClusterId
    invariants:
      - forall: {in: quota_slice, as: q, that: q.amount >= 0}
    # OPEN: the sketch gives the formation no lifecycle. Taken: Active until retired; a retired
    # formation takes no edit and no commit.
    lifecycle:
      initial: Active
      states: [Active, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Active]
          to: Retired
    # Every row below is part of the formation's document ("Topology as data": "The formation document is the
    # topology"), so the formation owns each of them.
    relations:
      # Section 3: "named, inside one account". The account (layer 2, `weft.accounts`) stands on
      # its own and outlives the link: references.
      - {name: account, kind: references, target: weft.accounts.Account, cardinality: one, via: account_id}
      - {name: cluster, kind: references, target: weft.cluster.Cluster, cardinality: one, via: cluster_id}
      # Section 10 line 456: a zone (layer 1, `weft.infrastructure`) stands on its own: references.
      - {name: allowed_zones, kind: references, target: weft.infrastructure.Zone, cardinality: many, via: zones}
      - {name: revisions, kind: owns, target: weft.formations.FormationRevision, cardinality: many, via: formation_id}
      - {name: environments, kind: owns, target: weft.formations.Environment, cardinality: many, via: formation_id}
      - {name: components, kind: owns, target: weft.formations.Component, cardinality: many, via: formation_id}
      - {name: links, kind: owns, target: weft.formations.Link, cardinality: many, via: formation_id}
      - {name: endpoints, kind: owns, target: weft.formations.Endpoint, cardinality: many, via: formation_id}
      - {name: routes, kind: owns, target: weft.formations.Route, cardinality: many, via: formation_id}
      - {name: configs, kind: owns, target: weft.formations.Config, cardinality: many, via: formation_id}
      - {name: config_mounts, kind: owns, target: weft.formations.ConfigMount, cardinality: many, via: formation_id}
      - {name: config_overrides, kind: owns, target: weft.formations.ConfigOverride, cardinality: many, via: formation_id}
      - {name: scale_settings, kind: owns, target: weft.formations.ScaleSetting, cardinality: many, via: formation_id}

  # Section 3: "`FormationRevision`: immutable snapshot of the formation's document."
  # Section 5 "Translation" has a Translation produce one; the Translation (`weft.deployments`)
  # names the revision it produced, so the revision stores no reference back to it.
  - name: weft.formations.FormationRevision
    naming:
      summary: An immutable snapshot of a formation's document; releases apply revisions.
    identity:
      name: revision_id
      type: weft.shared.FormationRevisionId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      # 1 for the first revision of a formation, one more for each next. Minted by the
      # implementation.
      - name: number
        type: Integer
      # Digest of the canonical document the revision froze: components, links, border, config,
      # environments. Section 5 "Translation", "Deterministic": the same source gives the same revision byte for byte.
      # OPEN: the canonical serialization of the document; taken: the implementation mints the
      # digest over it.
      - name: document_digest
        type: weft.shared.ArtifactDigest
    invariants:
      - number >= 1
    # Integration 2: the frozen document is a content-addressed artifact (layer 3,
    # `weft.artifacts`). It stands on its own and outlives the revision: references.
    relations:
      - {name: document, kind: references, target: weft.artifacts.Artifact, cardinality: one, via: document_digest}
    # Immutable: one state, no transition, no command that updates or deletes it.
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # Section 3: "`Environment`: a named target of the same formation (`dev`,
  # `staging`, `prod`). Each has its own secrets, config values, quotas and scale settings."
  # Its secrets are `weft.secrets`' (section 7, `Secret`, environment scope), keyed by its id. Its
  # config values are ConfigOverride rows, its scale settings ScaleSetting rows.
  - name: weft.formations.Environment
    naming:
      summary: A named target of a formation, with its own config values, quota slice and scale settings.
    identity:
      name: environment_id
      type: weft.shared.EnvironmentId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: name
        type: weft.formations.EnvironmentName
      - name: quota_slice
        type: List<weft.shared.ResourceAmount>
      # Design ci-cd-support § Stage 1.3 and § Security ("a rule for a production environment
      # requires a protected ref"): who made the environment and whether it is production.
      - name: origin
        type: weft.formations.EnvironmentOrigin
      - name: protected
        type: Boolean
      # A preview's source: the repository and pull request it was made for, and when it ends.
      # Absent for a manual environment.
      - name: source_repository
        type: Optional<String>
      - name: pull_request
        type: Optional<Integer>
      - name: expires_at
        type: Optional<Timestamp>
    invariants:
      - forall: {in: quota_slice, as: q, that: q.amount >= 0}
    # OPEN: the sketch gives an environment no lifecycle. Taken: Active until retired, like the
    # formation.
    lifecycle:
      initial: Active
      states: [Active, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Active]
          to: Retired

  # Section 3: "`Component`: one workload inside the formation (section 4)." Its package,
  # shape and claims are `weft.workloads`', which names it by (formation_id, name); the name is
  # unique in the formation (CreateComponent refuses a second).
  # Line 159-161: "`InternalName`: each component has a DNS name inside the formation's private
  # network (`orders.shop.internal`)": `internal_name`, `<name>.<formation>.internal`.
  # Lines 155-158: a component with `on_border` is part of the formation's Border; every other
  # component is internal.
  - name: weft.formations.Component
    naming:
      summary: One workload inside a formation, with its internal DNS name and whether it is on the border.
    identity:
      name: component_id
      type: weft.shared.ComponentId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: name
        type: weft.shared.ComponentName
      - name: internal_name
        type: weft.formations.InternalName
      - name: on_border
        type: Boolean
    # OPEN: the sketch gives a component no lifecycle. Taken: one state; RemoveComponent deletes
    # the row and refuses while a link, route, mount or scale setting names it.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3: "`Link`: an allowed call from one component to another (protocol,
  # port). Components without a link cannot reach each other." Section 3, `InternalName`: a Link is also what
  # lets the caller resolve the target's InternalName. Default deny: no row, no reach.
  # OPEN: whether a link may cross formations (or accounts, through an `Export` below).
  # Taken: no; both components are of the link's formation.
  - name: weft.formations.Link
    naming:
      summary: An allowed call from a caller component to a target component of the same formation, on one protocol and port.
    identity:
      name: link_id
      type: weft.shared.LinkId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: caller_component_id
        type: weft.shared.ComponentId
      - name: target_component_id
        type: weft.shared.ComponentId
      - name: protocol
        type: weft.formations.LinkProtocol
      - name: port
        type: weft.formations.Port
    relations:
      - {name: caller, kind: references, target: weft.formations.Component, cardinality: one, via: caller_component_id}
      - {name: target, kind: references, target: weft.formations.Component, cardinality: one, via: target_component_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3: "`Border`: the components reachable from outside the formation, with
  # their public `Endpoint`s". An Endpoint is one public host of the formation.
  # OPEN: whether each environment gets its own hosts. Taken: an endpoint belongs to the formation;
  # per-environment hosts are left to `weft.deployments`.
  - name: weft.formations.Endpoint
    naming:
      summary: A public host name at the formation's border.
    identity:
      name: endpoint_id
      type: weft.shared.EndpointId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: host
        type: weft.formations.Host
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 1 "Accounts", sketch lines 139-140: "Nothing crosses accounts unless an `Export` names
  # it (an endpoint shared to another account)." The endpoint is this domain's (section 3,
  # `Border`), so the export sits beside it; the accounts are `weft.accounts`', named by
  # weft.shared.AccountId and weft.shared.TenantId.
  # OPEN: whether an export may cross tenants. Taken: no; both accounts belong to one tenant,
  # and a cross-tenant export is refused.
  # OPEN: whether the receiving account must accept an export. Taken: no; an export only lets
  # the receiving account's workloads reach the endpoint, and their own links still declare it
  # (sketch line 12).
  # OPEN: whether one export names one receiving account only or that account and the accounts
  # below it. Taken: that account only.
  # Integration 2 (decided): RemoveEndpoint refuses while an active export names the endpoint
  # (`ExportsRemain`), so no active export outlives its endpoint. A revoked export is a record
  # and keeps the endpoint's id after the endpoint is gone: the endpoint is referenced, not owner.
  # While Export was `weft.accounts`', closing either account revoked it. Taken in wave 4 (the
  # brief's answer to "Account close vs active exports", docs/open-questions.md): the close
  # proceeds, and RevokeAccountExports, bound to `weft.accounts.AccountClosed`, revokes every
  # active export from or to the account (R6, § 14 line 590).
  # OPEN: confirm with the owner that the close proceeds rather than being refused while active
  # exports remain; between the close and the binding's delivery an export of a closed account is
  # still Active.
  - name: weft.formations.Export
    naming:
      summary: One endpoint of one account shared to one other account of the same tenant.
    identity:
      name: export_id
      type: weft.shared.ExportId
    fields:
      - name: tenant_id
        type: weft.shared.TenantId
      - name: endpoint_id
        type: weft.shared.EndpointId
      - name: from_account_id
        type: weft.shared.AccountId
        summary: The account the endpoint belongs to.
      - name: to_account_id
        type: weft.shared.AccountId
        summary: The account whose workloads may reach the endpoint.
    # The tenant and both accounts are `weft.accounts`' (layer 2) and stand on their own.
    relations:
      - {name: endpoint, kind: references, target: weft.formations.Endpoint, cardinality: one, via: endpoint_id}
      - {name: tenant, kind: references, target: weft.accounts.Tenant, cardinality: one, via: tenant_id}
      - {name: from_account, kind: references, target: weft.accounts.Account, cardinality: one, via: from_account_id}
      - {name: to_account, kind: references, target: weft.accounts.Account, cardinality: one, via: to_account_id}
    lifecycle:
      initial: Active
      states: [Active, Revoked]
      terminal: [Revoked]
      transitions:
        - name: revoke
          from: [Active]
          to: Revoked

  # Section 3, `Border`: "`Route`s (host and path to a component and port; what a Kubernetes
  # Ingress says)". The host is the endpoint's.
  - name: weft.formations.Route
    naming:
      summary: Host and path of a public endpoint, sent to one border component on one port.
    identity:
      name: route_id
      type: weft.shared.RouteId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: endpoint_id
        type: weft.shared.EndpointId
      # A path prefix such as `/api`. OPEN: prefix or exact match; taken: prefix.
      - name: path
        type: String
      - name: component_id
        type: weft.shared.ComponentId
      - name: port
        type: weft.formations.Port
    relations:
      - {name: endpoint, kind: references, target: weft.formations.Endpoint, cardinality: one, via: endpoint_id}
      - {name: component, kind: references, target: weft.formations.Component, cardinality: one, via: component_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3: "`Config`: named non-secret data (files, key-value pairs) of the
  # formation ... What a Kubernetes ConfigMap says." `data` maps a key (or a file name) to its
  # text.
  # OPEN: how a secret value written into a Config is kept out (section 5 "Deployment sources", `kubernetes`, sends Secret
  # values to custody). Taken: Config is declared non-secret; nothing here inspects its values.
  - name: weft.formations.Config
    naming:
      summary: Named non-secret data of a formation, as keys or files.
    identity:
      name: config_id
      type: weft.shared.ConfigId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: name
        type: weft.formations.ConfigName
      - name: data
        type: Map<String, String>
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3, `Config`: "mounted into components as files or environment variables". For
  # `File`, `target` is the directory the keys appear in as files; for `Env`, the prefix of the
  # variable names.
  - name: weft.formations.ConfigMount
    naming:
      summary: One config mounted into one component, as files or as environment variables.
    identity:
      name: mount_id
      type: weft.shared.ConfigMountId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: component_id
        type: weft.shared.ComponentId
      - name: config_id
        type: weft.shared.ConfigId
      - name: kind
        type: weft.formations.MountKind
      - name: target
        type: String
    relations:
      - {name: component, kind: references, target: weft.formations.Component, cardinality: one, via: component_id}
      - {name: config, kind: references, target: weft.formations.Config, cardinality: one, via: config_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3, `Environment`: each environment has "its own ... config values": the data of one config
  # in one environment, replacing the config's own data there.
  # OPEN: replace the config's data whole or merge key by key. Taken: replace.
  - name: weft.formations.ConfigOverride
    naming:
      summary: The values one config takes in one environment.
    identity:
      name: override_id
      type: weft.shared.ConfigOverrideId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: config_id
        type: weft.shared.ConfigId
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: data
        type: Map<String, String>
    relations:
      - {name: config, kind: references, target: weft.formations.Config, cardinality: one, via: config_id}
      - {name: environment, kind: references, target: weft.formations.Environment, cardinality: one, via: environment_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Section 3, `Environment`: each environment has "its own ... scale settings": the replica bounds of
  # one component in one environment. The metric that moves replicas between them is the
  # ScaleRule of `weft.workloads` (section 4 "Inside one instance").
  - name: weft.formations.ScaleSetting
    naming:
      summary: The replica bounds of one component in one environment.
    identity:
      name: scale_setting_id
      type: weft.shared.ScaleSettingId
    fields:
      - name: formation_id
        type: weft.shared.FormationId
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: component_id
        type: weft.shared.ComponentId
      - name: min_replicas
        type: Integer
      - name: max_replicas
        type: Integer
    invariants:
      - min_replicas >= 0
      - max_replicas >= 1
    relations:
      - {name: environment, kind: references, target: weft.formations.Environment, cardinality: one, via: environment_id}
      - {name: component, kind: references, target: weft.formations.Component, cardinality: one, via: component_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

errors:
  - name: weft.formations.NoSuchFormation
    summary: No formation has this id, and nothing changed.
  - name: weft.formations.FormationStateConflict
    summary: The formation is retired, so it takes no edit, and nothing changed.
  - name: weft.formations.NoSuchCluster
    summary: The cluster does not exist, was deleted, or belongs to another account; nothing was created.
  - name: weft.formations.NoSuchAccount
    summary: The account does not exist or is closed, and nothing was created.
  - name: weft.formations.FormationNameTaken
    summary: The account already has a formation of this name, and nothing was created.
  - name: weft.formations.QuotaExceeded
    summary: The slice asked for exceeds the quota its parent has left, and nothing changed.
  - name: weft.formations.NegativeQuotaAmount
    summary: The slice asked for holds an amount below zero, and nothing changed.
  - name: weft.formations.ReleasesLive
    summary: A release of this formation or environment is live, and nothing changed.
  - name: weft.formations.NoSuchEnvironment
    summary: No environment of this formation has this id, and nothing changed.
  - name: weft.formations.EnvironmentStateConflict
    summary: The environment is retired, so it takes no edit, and nothing changed.
  - name: weft.formations.EnvironmentNameTaken
    summary: The formation already has an environment of this name, and nothing was created.
  - name: weft.formations.NoSuchComponent
    summary: No component of this formation has this id, and nothing changed.
  - name: weft.formations.ComponentNameTaken
    summary: The formation already has a component of this name, and nothing was created.
  - name: weft.formations.ComponentInUse
    summary: A link, route, config mount or scale setting still names the component, and nothing was removed.
  - name: weft.formations.NoSuchLink
    summary: No link of this formation has this id, and nothing changed.
  - name: weft.formations.LinkExists
    summary: The formation already allows this call on this protocol and port, and nothing was created.
  - name: weft.formations.NotOnBorder
    summary: The component is not on the formation's border, so no route may reach it, and nothing changed.
  - name: weft.formations.RoutesRemain
    summary: A route still names this component or endpoint, and nothing changed.
  - name: weft.formations.ExportsRemain
    summary: An active export still shares this endpoint with another account, and nothing was removed.
  - name: weft.formations.NoSuchEndpoint
    summary: No endpoint of this formation has this id, and nothing changed.
  - name: weft.formations.HostTaken
    summary: Another endpoint already holds this host, and nothing was created.
  - name: weft.formations.HostNotVerified
    summary: The account has not shown that it controls this host, and nothing was created.
  - name: weft.formations.SelfExport
    summary: An export names the same account on both sides; nothing was exported.
  - name: weft.formations.ExportExists
    summary: This endpoint is already exported to this account, and nothing was exported.
  - name: weft.formations.EndpointNotInAccount
    summary: The endpoint does not belong to the exporting account, so nothing was exported.
  - name: weft.formations.ExportNotPermitted
    summary: The caller holds no role on the exporting account that may export, so nothing crossed accounts.
  - name: weft.formations.ExportNotFound
    summary: No export has this identifier, and nothing changed.
  - name: weft.formations.ExportNotActive
    summary: The export is revoked already, and nothing changed.
  - name: weft.formations.AccountNotClosed
    summary: The account does not exist or is still open, so no export was revoked.
  - name: weft.formations.NoSuchRoute
    summary: No route of this formation has this id, and nothing changed.
  - name: weft.formations.RouteExists
    summary: The endpoint already routes this path, and nothing was created.
  - name: weft.formations.NoSuchConfig
    summary: No config of this formation has this id, and nothing changed.
  - name: weft.formations.ConfigNameTaken
    summary: The formation already has a config of this name, and nothing was created.
  - name: weft.formations.ConfigInUse
    summary: A mount or an environment's values still name the config, and nothing was removed.
  - name: weft.formations.NoSuchMount
    summary: No config mount of this formation has this id, and nothing changed.
  - name: weft.formations.MountExists
    summary: The component already mounts this config, and nothing was created.
  - name: weft.formations.NoSuchOverride
    summary: No environment values of this formation have this id, and nothing changed.
  - name: weft.formations.OverrideExists
    summary: The environment already has values for this config, and nothing was created.
  - name: weft.formations.NoSuchScaleSetting
    summary: No scale setting of this formation has this id, and nothing changed.
  - name: weft.formations.ScaleSettingExists
    summary: The environment already has a scale setting for this component, and nothing was created.
  - name: weft.formations.InvalidScaleBounds
    summary: The minimum replicas exceed the maximum, and nothing changed.
  - name: weft.formations.EmptyFormation
    summary: The formation has no component, so no revision was recorded.

events:
  - name: weft.formations.FormationCreated
    fields:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: name, type: weft.formations.FormationName}
  - name: weft.formations.FormationQuotaSet
    fields:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: quota_slice, type: List<weft.shared.ResourceAmount>}
  - name: weft.formations.FormationRetired
    fields:
      - {name: formation_id, type: weft.shared.FormationId}
  - name: weft.formations.RevisionCommitted
    fields:
      - {name: revision_id, type: weft.shared.FormationRevisionId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: number, type: Integer}
      - {name: document_digest, type: weft.shared.ArtifactDigest}
  - name: weft.formations.EnvironmentCreated
    fields:
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.formations.EnvironmentName}
  - name: weft.formations.EnvironmentQuotaSet
    fields:
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: quota_slice, type: List<weft.shared.ResourceAmount>}
  - name: weft.formations.EnvironmentRetired
    fields:
      - {name: environment_id, type: weft.shared.EnvironmentId}
  - name: weft.formations.ComponentAdded
    fields:
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: name, type: weft.shared.ComponentName}
      - {name: internal_name, type: weft.formations.InternalName}
  - name: weft.formations.ComponentRemoved
    fields:
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: formation_id, type: weft.shared.FormationId}
  - name: weft.formations.ComponentBordered
    fields:
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: formation_id, type: weft.shared.FormationId}
  - name: weft.formations.ComponentUnbordered
    fields:
      - {name: component_id, type: weft.shared.ComponentId}
      - {name: formation_id, type: weft.shared.FormationId}
  - name: weft.formations.LinkAdded
    fields:
      - {name: link_id, type: weft.shared.LinkId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: caller_component_id, type: weft.shared.ComponentId}
      - {name: target_component_id, type: weft.shared.ComponentId}
      - {name: protocol, type: weft.formations.LinkProtocol}
      - {name: port, type: weft.formations.Port}
  - name: weft.formations.LinkRemoved
    fields:
      - {name: link_id, type: weft.shared.LinkId}
      - {name: formation_id, type: weft.shared.FormationId}
  - name: weft.formations.EndpointAdded
    fields:
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: host, type: weft.formations.Host}
  - name: weft.formations.EndpointRemoved
    fields:
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: formation_id, type: weft.shared.FormationId}
  - name: weft.formations.ExportCreated
    fields:
      - {name: export_id, type: weft.shared.ExportId}
      - {name: tenant_id, type: weft.shared.TenantId}
      - {name: endpoint_id, type: weft.shared.EndpointId}
      - {name: from_account_id, type: weft.shared.AccountId}
      - {name: to_account_id, type: weft.shared.AccountId}
  - name: weft.formations.ExportRevoked
    fields:
      - {name: export_id, type: weft.shared.ExportId}
  # One per RevokeAccountExports; each export it revoked also gets its own ExportRevoked.
  - name: weft.formations.AccountExportsRevoked
    fields:
      - {name: account_id, type: weft.shared.AccountId}
