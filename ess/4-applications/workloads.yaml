commands:
  # Brief focus "Runtime with its minimum isolation"; section 10 lines 456-458.
  - name: weft.workloads.RegisterRuntime
    naming:
      display: Register a runtime
    input:
      - {name: name, type: String}
      - {name: version, type: String}
      - {name: package_kinds, type: List<weft.workloads.PackageKind>}
      - {name: minimum_isolation, type: weft.shared.IsolationLevel}
    outcomes:
      - name: no-kinds
        when: package_kinds.count == 0
        error: weft.workloads.InvalidAmount
      - name: registered
        creates: weft.workloads.Runtime
        instance: runtime_id
        sets:
          name: input.name
          version: input.version
          package_kinds: input.package_kinds
          minimum_isolation: input.minimum_isolation
        emits: [weft.workloads.RuntimeRegistered]
        payload:
          weft.workloads.RuntimeRegistered:
            runtime_id: {generated: true}
            name: input.name
            version: input.version
            minimum_isolation: input.minimum_isolation

  # No command lowers a runtime's minimum isolation (section 10 line 457: "never weakened"); a
  # weaker runtime is a new registration.
  - name: weft.workloads.RetireRuntime
    naming:
      display: Retire a runtime
    input:
      - {name: runtime_id, type: weft.shared.RuntimeId}
    outcomes:
      - name: no-such-runtime
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: retired
        moves: weft.workloads.Runtime.retire
        instance: runtime_id
        emits: [weft.workloads.RuntimeRetired]
        payload:
          weft.workloads.RuntimeRetired:
            runtime_id: input.runtime_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict


  # Sketch lines 205-305: a component's package, shape and claims. Refusals: a spec kind (lines
  # 230-231), a Box of another package kind (lines 248-249), no main process (lines 264-266), an
  # artifact that is missing, revoked, of another kind or of another account (lines 215-216;
  # section 1 lines 139-140), a runtime that is missing, retired, does not run the kind, or whose
  # minimum isolation the workload's is below (section 10 lines 456-458).
  # OPEN: which actor defines a workload: the deployments domain applies a release (section 5);
  # the sketch's actor list has no controller. Smallest answer: the release apply, as Deployer.
  # OPEN: "untrusted code default to microvm" (section 10 line 458): which kinds are untrusted. The
  # caller (CLI, translator) fills in MicroVm when the user names no isolation; nothing here
  # weakens it.
  # OPEN: the shape and the tag of `settings` must agree; the predicate language reads no union
  # tag, so the implementation checks it.
  - name: weft.workloads.DefineWorkload
    naming:
      display: Define a workload
    input:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: formation_revision_id, type: weft.shared.FormationRevisionId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: package_kind, type: weft.workloads.PackageKind}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: runtime_id, type: weft.shared.RuntimeId}
      - {name: isolation, type: weft.shared.IsolationLevel}
      - {name: shape, type: weft.workloads.ShapeKind}
      - {name: settings, type: weft.workloads.ShapeSettings}
      - {name: claims, type: List<weft.workloads.ClaimRequest>}
      - {name: processes, type: List<weft.workloads.Process>}
      - {name: restart_policy, type: weft.workloads.RestartPolicy}
      # Section 10 line 459: the workload's priority class (see Workload.priority).
      - {name: priority, type: weft.shared.PriorityClassName}
    outcomes:
      # hardening pass 1 D3: a workload is defined only in the account the request acts in;
      # another account answers like a missing one.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.workloads.NotFound
      - name: spec-kind
        when:
          package_kind: [EssSystem, Agent, Training, Graph]
        error: weft.workloads.SpecKindNotRunnable
      - name: box-package
        when:
          all:
            - shape == Box
            - package_kind: {none_of: [Image, Machine]}
        error: weft.workloads.BoxPackageKind
      # "No Main process": an empty list, or a list none of whose processes is Main. The read of
      # `processes.0` is implied by the quantifier (the first process is not Main either) and
      # changes no answer; it gives synthesis a first process to vary beside the runtime's kind
      # and isolation. With the quantifier alone ess 0.99.2 finds no input for `defined` (three
      # leaves at once: processes, package_kind, isolation; reported as an ESS gap 2026-11-26).
      - name: no-main
        when:
          any:
            - processes.count == 0
            - all:
                - processes.0.role != Main
                - not:
                    exists: {in: processes, as: p, that: p.role == Main}
        error: weft.workloads.NoMainProcess
      # Section 15 "Health": a check names what its kind needs, and its lengths and thresholds
      # are positive (the same bounds as the Check type's invariants, answered by name here).
      - name: invalid-check
        when:
          exists:
            in: processes
            as: p
            that:
              exists:
                in: p.checks
                as: c
                that:
                  any:
                    - all: [c.kind == Http, not defined(c.port)]
                    - all: [c.kind == Tcp, not defined(c.port)]
                    - all: [c.kind == Grpc, not defined(c.port)]
                    - all: [c.kind == Http, not defined(c.path)]
                    - all: [c.kind == Command, not defined(c.command)]
                    - all: [defined(c.port), c.port < 1]
                    - all: [defined(c.port), c.port > 65535]
                    - c.initial_delay_seconds < 0
                    - c.period_seconds < 1
                    - c.timeout_seconds < 1
                    - c.failure_threshold < 1
                    - c.success_threshold < 1
        error: weft.workloads.InvalidCheck
      # Section 15 "Health": the backoff is positive, its cap at least its initial wait, and N
      # and the window are positive.
      - name: invalid-restart-policy
        when:
          any:
            - restart_policy.backoff_initial_seconds < 1
            - restart_policy.backoff_max_seconds < restart_policy.backoff_initial_seconds
            - restart_policy.backoff_limit < 1
            - restart_policy.backoff_window_seconds < 1
        error: weft.workloads.InvalidRestartPolicy
      # hardening pass 1 W1: the formation, its environment and its revision are the account's,
      # so a workload never joins another account's formation (and its identity never matches
      # that formation's exchange policies). Missing and foreign answer alike; every existence
      # check answers before every predicate (ESS precedence), so the ties follow `no-runtime`.
      - name: formation-missing
        when_related: {via: input.formation_id, exists: false}
        error: weft.workloads.NotFound
      - name: environment-missing
        when_related: {via: input.environment_id, exists: false}
        error: weft.workloads.NotFound
      - name: revision-missing
        when_related: {via: input.formation_revision_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-runtime
        when_related: {via: input.runtime_id, exists: false}
        error: weft.workloads.RuntimeNotFound
      - name: formation-foreign
        when_related: {via: input.formation_id, predicate: account_id != input.account_id}
        error: weft.workloads.NotFound
      - name: environment-foreign
        when_related: {via: input.environment_id, predicate: formation_id != input.formation_id}
        error: weft.workloads.NotFound
      - name: revision-foreign
        when_related: {via: input.formation_revision_id, predicate: formation_id != input.formation_id}
        error: weft.workloads.NotFound
      - name: runtime-retired
        when_related: {via: input.runtime_id, predicate: state == Retired}
        error: weft.workloads.RuntimeIsRetired
      - name: runtime-kind
        when_related:
          via: input.runtime_id
          predicate:
            not:
              exists: {in: package_kinds, as: k, that: k == input.package_kind}
        error: weft.workloads.RuntimeKindUnsupported
      # IsolationLevel is ordered (shared.yaml), but a guard does not order enum variants, so the
      # weaker levels are listed for each minimum.
      - name: below-runtime-isolation
        when_related:
          via: input.runtime_id
          predicate:
            any:
              - all: [minimum_isolation == MicroVm, input.isolation != MicroVm]
              - all:
                  - minimum_isolation == UserKernel
                  - input.isolation != MicroVm
                  - input.isolation != UserKernel
              - all: [minimum_isolation == Container, input.isolation == ProcessSandbox]
        error: weft.workloads.IsolationBelowMinimum
      # The artifact is held by the artifacts domain (weft.artifacts); an external check answers
      # after every check on this domain's own records.
      # Kept external, though the fact is a row of weft.artifacts (layer 3): with these four as
      # `when_related` guards on input.artifact_digest (validated: `kind != input.package_kind`
      # compares the two enums by variant), every scenario that arranges a Workload must also
      # arrange its Artifact, and synthesis of this domain's subset ran 40 minutes without an end
      # (a probe: 16 GB after 4 minutes; 142 s with them external; soundness pass 2026-11-26).
      # Reported as an ESS gap.
      - name: no-artifact
        external: the artifacts domain has no artifact with this digest
        error: weft.workloads.ArtifactNotFound
      # hardening pass 1 disclosure: another account's artifact answers like a missing one, and
      # before its revocation is read.
      - name: artifact-foreign
        external: the artifacts domain finds the artifact registered to another account
        error: weft.workloads.ArtifactNotFound
      - name: artifact-revoked
        external: the artifacts domain finds the artifact revoked
        error: weft.workloads.ArtifactIsRevoked
      - name: artifact-kind
        external: the artifacts domain finds the artifact of a kind other than the package kind
        error: weft.workloads.ArtifactKindMismatch
      - name: defined
        creates: weft.workloads.Workload
        instance: workload_id
        sets:
          account_id: input.account_id
          formation_id: input.formation_id
          formation_revision_id: input.formation_revision_id
          environment_id: input.environment_id
          component: input.component
          package_kind: input.package_kind
          artifact_digest: input.artifact_digest
          runtime_id: input.runtime_id
          isolation: input.isolation
          shape: input.shape
          settings: input.settings
          claims: input.claims
          processes: input.processes
          restart_policy: input.restart_policy
          priority: input.priority
        emits: [weft.workloads.WorkloadDefined]
        payload:
          weft.workloads.WorkloadDefined:
            workload_id: {generated: true}
            account_id: input.account_id
            formation_id: input.formation_id
            environment_id: input.environment_id
            component: input.component
            package_kind: input.package_kind
            artifact_digest: input.artifact_digest
            shape: input.shape
            isolation: input.isolation

  # Sketch lines 205-211; a new revision retires the workload it replaces (OPEN on Workload).
  - name: weft.workloads.RetireWorkload
    naming:
      display: Retire a workload
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
    outcomes:
      - name: no-such-workload
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the workload's own account acts on it; another account's workload
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: retired
        moves: weft.workloads.Workload.retire
        instance: workload_id
        emits: [weft.workloads.WorkloadRetired]
        payload:
          weft.workloads.WorkloadRetired:
            workload_id: input.workload_id
        # The workload's Service record retires with it.
        affects:
          - entity: weft.workloads.Service
            where: {all: ["workload_id == input.workload_id", "state != Retired"]}
            moves: weft.workloads.Service.retire
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 259: an Instance of a workload. Section 10 line 451: the scheduler's input is
  # "instance, claims, minimum isolation"; the instance carries its workload's minimum.
  # OPEN: which actor creates instances for replicas, tasks, daemons and warm pools: the actor
  # list (lines 111-115) has no controller. Smallest answer: Scheduler.
  - name: weft.workloads.CreateInstance
    naming:
      display: Create an instance
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: job_id, type: Optional<weft.shared.JobId>}
      - {name: task_index, type: Optional<Integer>}
      - {name: invocation_id, type: Optional<weft.shared.InvocationId>}
      - {name: box_id, type: Optional<weft.shared.BoxId>}
      - {name: session_id, type: Optional<weft.shared.SessionId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: warm_pool_id, type: Optional<weft.shared.WarmPoolId>}
      # Section 14 R1 (line 585): the Service whose replica this is, as ReplicaRequested names it.
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
    outcomes:
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      # The record that made the instance exists and belongs to the same workload, or nothing is
      # created.
      - name: no-job
        when_related: {via: input.job_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-invocation
        when_related: {via: input.invocation_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-box
        when_related: {via: input.box_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-session
        when_related: {via: input.session_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-warm-pool
        when_related: {via: input.warm_pool_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-service
        when_related: {via: input.service_id, exists: false}
        error: weft.workloads.ServiceNotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: foreign-job
        when_related: {via: input.job_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: foreign-invocation
        when_related: {via: input.invocation_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: foreign-box
        when_related: {via: input.box_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: foreign-session
        when_related: {via: input.session_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: foreign-warm-pool
        when_related: {via: input.warm_pool_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: foreign-service
        when_related: {via: input.service_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      # Section 14 R1: a replica index of a service runs at most once at a time, so a ReplicaRequested
      # delivered twice creates one instance (the binding drops this answer).
      # hardening pass 4: only a replica's request (service and index given) is checked, and only
      # instances with both fields are compared; ESS 0.99.2 reads `==` over an absent Optional as
      # Unknown.
      - name: replica-live
        when:
          all: [defined(service_id), defined(replica_index)]
        when_related:
          entity: weft.workloads.Instance
          where:
            all:
              - defined(service_id)
              - defined(replica_index)
              - service_id == input.service_id
              - replica_index == input.replica_index
              - any: [state == Pending, state == Scheduled, state == Starting, state == Running, state == Paused]
          exists: true
        error: weft.workloads.ReplicaLive
      - name: created
        creates: weft.workloads.Instance
        instance: instance_id
        sets:
          workload_id: input.workload_id
          account_id: {related: {via: input.workload_id, field: account_id}}
          artifact_digest: {related: {via: input.workload_id, field: artifact_digest}}
          minimum_isolation: {related: {via: input.workload_id, field: isolation}}
          job_id: input.job_id
          task_index: input.task_index
          invocation_id: input.invocation_id
          box_id: input.box_id
          session_id: input.session_id
          replica_index: input.replica_index
          service_id: input.service_id
          replica_counted_out: false
          warm_pool_id: input.warm_pool_id
          desired: Run
          ready: false
          health: Unknown
          processes: {related: {via: input.workload_id, field: processes}}
          restart_policy: {related: {via: input.workload_id, field: restart_policy}}
          restarts: 0
          restarts_in_window: 0
        emits: [weft.workloads.InstanceCreated]
        payload:
          weft.workloads.InstanceCreated:
            instance_id: {generated: true}
            workload_id: input.workload_id
            minimum_isolation: {related: {via: input.workload_id, field: isolation}}
            account_id: {related: {via: input.workload_id, field: account_id}}
            formation_id: {related: {via: input.workload_id, field: formation_id}}
            claims: {related: {via: input.workload_id, field: claims}}
            service_id: input.service_id
            replica_index: input.replica_index
            job_id: input.job_id
            zones: {related: {via: [input.workload_id, formation_id], field: zones}}
            priority: {related: {via: input.workload_id, field: priority}}

  # Section 10 lines 451-452 (input and output of scheduling) and lines 456-458: an instance is
  # never placed under an isolation weaker than its minimum. This is the refusal the brief names:
  # a command that would run a workload below its minimum isolation.
  - name: weft.workloads.ScheduleInstance
    naming:
      display: Schedule an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: isolation, type: weft.shared.IsolationLevel}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: below-minimum-isolation
        when_subject:
          predicate:
            any:
              - all: [minimum_isolation == MicroVm, input.isolation != MicroVm]
              - all:
                  - minimum_isolation == UserKernel
                  - input.isolation != MicroVm
                  - input.isolation != UserKernel
              - all: [minimum_isolation == Container, input.isolation == ProcessSandbox]
        error: weft.workloads.IsolationBelowMinimum
      - name: scheduled
        moves: weft.workloads.Instance.schedule
        instance: instance_id
        sets:
          node_id: input.node_id
          isolation: input.isolation
        emits: [weft.workloads.InstanceScheduled]
        payload:
          weft.workloads.InstanceScheduled:
            instance_id: input.instance_id
            node_id: input.node_id
            isolation: input.isolation
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 215-216: "verified by the node before start". The node verified the signature of
  # the artifact it fetched; a digest other than the instance's, or a revoked artifact, starts
  # nothing.
  - name: weft.workloads.RecordArtifactVerified
    naming:
      display: Record a verified artifact
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 4: an instance not placed has no node, so no node's report about it is
      # taken (WrongNode); ESS 0.99.2 reads `!=` over an absent Optional as Unknown. The same form
      # holds for every `wrong-node` of this file.
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: digest-mismatch
        when_subject: {predicate: artifact_digest != input.artifact_digest}
        error: weft.workloads.ArtifactDigestMismatch
      # The artifact's row of weft.artifacts (layer 3), through the relation `artifact`.
      - name: no-artifact
        when_related: {via: input.artifact_digest, exists: false}
        error: weft.workloads.ArtifactNotFound
      - name: revoked
        when_related: {via: input.artifact_digest, predicate: state == Revoked}
        error: weft.workloads.ArtifactIsRevoked
      # Section 15 "Health": unknown -> starting, as the processes start.
      - name: starting
        moves: weft.workloads.Instance.start
        instance: instance_id
        sets:
          health: Starting
        emits: [weft.workloads.InstanceStarting, weft.workloads.InstanceHealthStarting]
        payload:
          weft.workloads.InstanceStarting:
            instance_id: input.instance_id
            artifact_digest: input.artifact_digest
          weft.workloads.InstanceHealthStarting:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 215-216: the node's signature check failed; the instance fails without starting.
  - name: weft.workloads.RecordArtifactRejected
    naming:
      display: Record a rejected artifact
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: reason, type: String}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: rejected
        when_subject_state: Scheduled
        moves: weft.workloads.Instance.fail
        instance: instance_id
        sets:
          failure_reason: input.reason
        emits: [weft.workloads.InstanceFailed]
        payload:
          weft.workloads.InstanceFailed:
            instance_id: input.instance_id
            reason: input.reason
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
            restart: false
      - name: other-state
        error: weft.workloads.StateConflict

  # Section 4 "Inside one instance": every `startup` check passed. Section 15 "Health": the
  # startup check comes before `ready` and `alive` are considered. An instance whose processes
  # declare no `ready` check is Ready as it runs (nothing else would make it ready); otherwise its
  # health stays Starting until the ready check reaches its threshold (RecordCheckResult).
  - name: weft.workloads.RecordInstanceRunning
    naming:
      display: Record an instance running
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: running-ready
        when_subject:
          predicate:
            all:
              - state == Starting
              - health == Starting
              - not:
                  exists:
                    in: processes
                    as: p
                    that:
                      exists: {in: p.checks, as: c, that: c.role == Ready}
        moves: weft.workloads.Instance.run
        instance: instance_id
        sets:
          health: Ready
          ready: true
        emits: [weft.workloads.InstanceRunning, weft.workloads.InstanceReady]
        payload:
          weft.workloads.InstanceRunning:
            instance_id: input.instance_id
          weft.workloads.InstanceReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: running
        moves: weft.workloads.Instance.run
        instance: instance_id
        emits: [weft.workloads.InstanceRunning]
        payload:
          weft.workloads.InstanceRunning:
            instance_id: input.instance_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Section 4 "Inside one instance" (`Check`) and section 15 "Health": a check result, the
  # failure count against the threshold. The node runs the probes and counts consecutive equal
  # results of one check (`consecutive`, this one included); the threshold is read from the
  # instance's own copy of its processes. A result changes health only when the count reaches the
  # check's threshold:
  # - `ready` passing `success_threshold` times: Starting or NotReady -> Ready (InstanceReady);
  # - `ready` failing `failure_threshold` times: Starting or Ready -> NotReady (InstanceNotReady);
  # - `alive` failing `failure_threshold` times: AliveCheckFailed; the node restarts the process
  #   (section 14 R9, node-local) and records it with RecordProcessRestarted;
  # - `startup` failing `failure_threshold` times: StartupCheckFailed; the node restarts it too.
  # Every other result is recorded (CheckObserved) and changes nothing. A `ready` or `alive`
  # result before the startup checks passed (run state Starting) is refused (section 15: the
  # startup check comes first). While the instance is backing off a ready result moves nothing.
  # OPEN: with several processes that each have a `ready` check, the instance follows the last
  # check that reached its threshold; Kubernetes holds a Pod ready only when every container is.
  # Per-check state would need an entity per check. Smallest answer: one `ready` check per
  # instance, as most workloads have.
  - name: weft.workloads.RecordCheckResult
    naming:
      display: Record a check result
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: process, type: String}
      - {name: role, type: weft.workloads.CheckRole}
      - {name: passed, type: Boolean}
      - {name: consecutive, type: Integer}
    outcomes:
      - name: invalid-count
        when: consecutive < 1
        error: weft.workloads.InvalidCount
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: check-not-declared
        when_subject:
          predicate:
            not:
              exists:
                in: processes
                as: p
                that:
                  all:
                    - p.name == input.process
                    - exists: {in: p.checks, as: c, that: c.role == input.role}
        error: weft.workloads.CheckNotDeclared
      - name: startup-pending
        when: role != Startup
        when_subject: {predicate: state == Starting}
        error: weft.workloads.StartupPending
      - name: ready-reached
        when:
          all: [role == Ready, passed == true]
        when_subject:
          predicate:
            all:
              - state == Running
              - health: [Starting, NotReady]
              - exists:
                  in: processes
                  as: p
                  that:
                    all:
                      - p.name == input.process
                      - exists:
                          in: p.checks
                          as: c
                          that:
                            all: [c.role == Ready, input.consecutive >= c.success_threshold]
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          health: Ready
          ready: true
        emits: [weft.workloads.CheckObserved, weft.workloads.InstanceReady]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
          weft.workloads.InstanceReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: ready-lost
        when:
          all: [role == Ready, passed == false]
        when_subject:
          predicate:
            all:
              - state == Running
              - health: [Starting, Ready]
              - exists:
                  in: processes
                  as: p
                  that:
                    all:
                      - p.name == input.process
                      - exists:
                          in: p.checks
                          as: c
                          that:
                            all: [c.role == Ready, input.consecutive >= c.failure_threshold]
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          health: NotReady
          ready: false
        emits: [weft.workloads.CheckObserved, weft.workloads.InstanceNotReady]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
          weft.workloads.InstanceNotReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      # Section 14 R9 (line 593): past its threshold under `never` the node restarts nothing and
      # reports the instance failed (RecordProcessRestarted refuses `never`).
      - name: alive-failed-no-restart
        when:
          all: [role == Alive, passed == false]
        when_subject:
          predicate:
            all:
              - state == Running
              - restart_policy.mode == Never
              - exists:
                  in: processes
                  as: p
                  that:
                    all:
                      - p.name == input.process
                      - exists:
                          in: p.checks
                          as: c
                          that:
                            all: [c.role == Alive, input.consecutive >= c.failure_threshold]
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.CheckObserved, weft.workloads.AliveCheckFailed]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
          weft.workloads.AliveCheckFailed:
            instance_id: input.instance_id
            process: input.process
            consecutive_failures: input.consecutive
            node_id: input.node_id
            workload_id: {subject: workload_id}
            restart: false
      - name: alive-failed
        when:
          all: [role == Alive, passed == false]
        when_subject:
          predicate:
            all:
              - state == Running
              - exists:
                  in: processes
                  as: p
                  that:
                    all:
                      - p.name == input.process
                      - exists:
                          in: p.checks
                          as: c
                          that:
                            all: [c.role == Alive, input.consecutive >= c.failure_threshold]
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.CheckObserved, weft.workloads.AliveCheckFailed]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
          weft.workloads.AliveCheckFailed:
            instance_id: input.instance_id
            process: input.process
            consecutive_failures: input.consecutive
            node_id: input.node_id
            workload_id: {subject: workload_id}
            restart: true
      - name: startup-failed
        when:
          all: [role == Startup, passed == false]
        when_subject:
          predicate:
            all:
              - state == Starting
              - exists:
                  in: processes
                  as: p
                  that:
                    all:
                      - p.name == input.process
                      - exists:
                          in: p.checks
                          as: c
                          that:
                            all: [c.role == Startup, input.consecutive >= c.failure_threshold]
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.CheckObserved, weft.workloads.StartupCheckFailed]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
          weft.workloads.StartupCheckFailed:
            instance_id: input.instance_id
            process: input.process
            consecutive_failures: input.consecutive
      - name: observed
        when_subject: {predicate: {state: [Starting, Running]}}
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.CheckObserved]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
      - name: other-state
        error: weft.workloads.StateConflict

  # Section 4 "Inside one instance" (`alive`: "restart when it fails"; RestartPolicy "with a
  # backoff"), section 14 R9 ("alive check failed past its threshold -> process restart
  # (node-local, recorded)") and section 15 "Health" ("Restart backoff: exponential with a cap;
  # past N restarts in a window the instance is `backing-off`"). The node applies the policy and
  # reports each restart with the wait it took (`backoff_seconds`) and its count of restarts in
  # the policy's window (`restarts_in_window`, this one included). The control plane checks the
  # wait against the policy's bounds and the count against its limit. A restart takes the
  # instance out of traffic: health Starting, or BackingOff once the count passes the limit.
  # OPEN: whether a restart of a `sidecar` process takes the whole instance out of traffic.
  # Smallest answer: yes, as a Kubernetes Pod is unready while any container restarts.
  # OPEN: the backoff's exact value for the n-th restart (initial * 2^(n-1), capped) is not
  # checked here: the guard language has no power function. Only its bounds are.
  - name: weft.workloads.RecordProcessRestarted
    naming:
      display: Record a process restart
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: process, type: String}
      - {name: reason, type: weft.workloads.RestartReason}
      - {name: restarts_in_window, type: Integer}
      - {name: backoff_seconds, type: Integer}
    outcomes:
      - name: invalid-count
        when: restarts_in_window < 1
        error: weft.workloads.InvalidCount
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: no-such-process
        when_subject:
          predicate:
            not:
              exists: {in: processes, as: p, that: p.name == input.process}
        error: weft.workloads.ProcessNotDeclared
      - name: restart-never
        when_subject: {predicate: restart_policy.mode == Never}
        error: weft.workloads.RestartNotAllowed
      - name: count-above-total
        when_subject: {predicate: input.restarts_in_window > restarts + 1}
        error: weft.workloads.InvalidCount
      - name: backoff-out-of-range
        when_subject:
          predicate:
            any:
              - input.backoff_seconds < restart_policy.backoff_initial_seconds
              - input.backoff_seconds > restart_policy.backoff_max_seconds
        error: weft.workloads.BackoffOutOfRange
      # Past N restarts in the window: the instance enters BackingOff (CrashLoopBackOff).
      - name: backing-off
        when_subject:
          predicate:
            all:
              - state: [Starting, Running]
              - health: {none_of: [BackingOff]}
              - input.restarts_in_window > restart_policy.backoff_limit
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          restarts: {increment: 1}
          restarts_in_window: input.restarts_in_window
          backoff_seconds: input.backoff_seconds
          health: BackingOff
          ready: false
        emits: [weft.workloads.ProcessRestarted, weft.workloads.InstanceBackingOff]
        payload:
          weft.workloads.ProcessRestarted:
            instance_id: input.instance_id
            process: input.process
            reason: input.reason
            restarts: {expr: "subject.restarts + 1"}
            restarts_in_window: input.restarts_in_window
            backoff_seconds: input.backoff_seconds
          weft.workloads.InstanceBackingOff:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
            process: input.process
            restarts_in_window: input.restarts_in_window
            backoff_seconds: input.backoff_seconds
      # Already backing off: the restart is recorded; health stays BackingOff.
      - name: restarted-backing-off
        when_subject:
          predicate:
            all:
              - state: [Starting, Running]
              - health == BackingOff
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          restarts: {increment: 1}
          restarts_in_window: input.restarts_in_window
          backoff_seconds: input.backoff_seconds
          ready: false
        emits: [weft.workloads.ProcessRestarted]
        payload:
          weft.workloads.ProcessRestarted:
            instance_id: input.instance_id
            process: input.process
            reason: input.reason
            restarts: {expr: "subject.restarts + 1"}
            restarts_in_window: input.restarts_in_window
            backoff_seconds: input.backoff_seconds
      - name: restarted
        when_subject: {predicate: {state: [Starting, Running]}}
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          restarts: {increment: 1}
          restarts_in_window: input.restarts_in_window
          backoff_seconds: input.backoff_seconds
          health: Starting
          ready: false
        emits: [weft.workloads.ProcessRestarted, weft.workloads.InstanceHealthStarting]
        payload:
          weft.workloads.ProcessRestarted:
            instance_id: input.instance_id
            process: input.process
            reason: input.reason
            restarts: {expr: "subject.restarts + 1"}
            restarts_in_window: input.restarts_in_window
            backoff_seconds: input.backoff_seconds
          weft.workloads.InstanceHealthStarting:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: other-state
        error: weft.workloads.StateConflict

  # Section 15 "Health": "past N restarts in a window the instance is `backing-off` ... leaving
  # it on a successful start". The node reports a restarted process started: its startup check
  # passed, or it has none. A backing-off instance leaves BackingOff (InstanceBackoffEnded). In
  # a Running instance whose processes declare no `ready` check, health goes straight to Ready
  # (nothing else would make it ready); otherwise the ready check moves it (RecordCheckResult).
  - name: weft.workloads.RecordProcessStarted
    naming:
      display: Record a restarted process started
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: process, type: String}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: no-such-process
        when_subject:
          predicate:
            not:
              exists: {in: processes, as: p, that: p.name == input.process}
        error: weft.workloads.ProcessNotDeclared
      - name: backoff-ended-ready
        when_subject:
          predicate:
            all:
              - state == Running
              - health == BackingOff
              - not:
                  exists:
                    in: processes
                    as: p
                    that:
                      exists: {in: p.checks, as: c, that: c.role == Ready}
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          health: Ready
          ready: true
        emits: [weft.workloads.InstanceBackoffEnded, weft.workloads.InstanceReady]
        payload:
          weft.workloads.InstanceBackoffEnded:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
            process: input.process
          weft.workloads.InstanceReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: backoff-ended
        when_subject:
          predicate:
            all:
              - state: [Starting, Running]
              - health == BackingOff
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          health: Starting
        emits: [weft.workloads.InstanceBackoffEnded]
        payload:
          weft.workloads.InstanceBackoffEnded:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
            process: input.process
      - name: started-ready
        when_subject:
          predicate:
            all:
              - state == Running
              - health == Starting
              - not:
                  exists:
                    in: processes
                    as: p
                    that:
                      exists: {in: p.checks, as: c, that: c.role == Ready}
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          health: Ready
          ready: true
        emits: [weft.workloads.ProcessStarted, weft.workloads.InstanceReady]
        payload:
          weft.workloads.ProcessStarted:
            instance_id: input.instance_id
            process: input.process
          weft.workloads.InstanceReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: started
        when_subject: {predicate: {state: [Starting, Running]}}
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.ProcessStarted]
        payload:
          weft.workloads.ProcessStarted:
            instance_id: input.instance_id
            process: input.process
      - name: other-state
        error: weft.workloads.StateConflict

  # Section 11 line 466 `Pause`; the node reports the instance paused. Section 15 "Health": a
  # paused instance gets no traffic, so its health is NotReady (InstanceNotReady, no process).
  - name: weft.workloads.RecordInstancePaused
    naming:
      display: Record an instance paused
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: paused
        moves: weft.workloads.Instance.pause
        instance: instance_id
        sets:
          ready: false
          health: NotReady
        emits: [weft.workloads.InstancePaused, weft.workloads.InstanceNotReady]
        payload:
          weft.workloads.InstancePaused:
            instance_id: input.instance_id
          weft.workloads.InstanceNotReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.RecordInstanceResumed
    naming:
      display: Record an instance resumed
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      # Section 15 "Health": a resumed instance with no `ready` check is Ready at once; any other
      # is Starting until its ready check reaches its threshold.
      - name: resumed-ready
        when_subject:
          predicate:
            all:
              - state == Paused
              - not:
                  exists:
                    in: processes
                    as: p
                    that:
                      exists: {in: p.checks, as: c, that: c.role == Ready}
        moves: weft.workloads.Instance.resume
        instance: instance_id
        sets:
          health: Ready
          ready: true
        emits: [weft.workloads.InstanceResumed, weft.workloads.InstanceReady]
        payload:
          weft.workloads.InstanceResumed:
            instance_id: input.instance_id
          weft.workloads.InstanceReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: resumed
        moves: weft.workloads.Instance.resume
        instance: instance_id
        sets:
          health: Starting
        emits: [weft.workloads.InstanceResumed, weft.workloads.InstanceHealthStarting]
        payload:
          weft.workloads.InstanceResumed:
            instance_id: input.instance_id
          weft.workloads.InstanceHealthStarting:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # The instance's processes ended. A zero exit, or an exit the owner asked for, is Exited; the
  # node reports any other end as RecordInstanceFailed.
  - name: weft.workloads.RecordInstanceExited
    naming:
      display: Record an instance exited
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: exit_code, type: Integer}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      # Section 4 line 269 and section 14 R2: `always` restarts an exit the owner did not ask for.
      - name: exited-restart
        when_subject:
          predicate:
            all: [restart_policy.mode == Always, desired != Stop]
        moves: weft.workloads.Instance.exit
        instance: instance_id
        sets:
          exit_code: input.exit_code
          ready: false
          health: Unknown
        emits: [weft.workloads.InstanceExited]
        payload:
          weft.workloads.InstanceExited:
            instance_id: input.instance_id
            exit_code: input.exit_code
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
            restart: true
      - name: exited
        moves: weft.workloads.Instance.exit
        instance: instance_id
        sets:
          exit_code: input.exit_code
          ready: false
          health: Unknown
        emits: [weft.workloads.InstanceExited]
        payload:
          weft.workloads.InstanceExited:
            instance_id: input.instance_id
            exit_code: input.exit_code
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
            restart: false
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.RecordInstanceFailed
    naming:
      display: Record an instance failed
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: exit_code, type: Optional<Integer>}
      - {name: reason, type: String}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      # Section 4 line 269 and section 14 R2: `on-failure` and `always` restart a failure the owner
      # did not ask for.
      - name: failed-restart
        when_subject:
          predicate:
            all: [restart_policy.mode != Never, desired != Stop]
        moves: weft.workloads.Instance.fail
        instance: instance_id
        sets:
          exit_code: input.exit_code
          failure_reason: input.reason
          ready: false
          health: Unknown
        emits: [weft.workloads.InstanceFailed]
        payload:
          weft.workloads.InstanceFailed:
            instance_id: input.instance_id
            reason: input.reason
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
            restart: true
      - name: failed
        moves: weft.workloads.Instance.fail
        instance: instance_id
        sets:
          exit_code: input.exit_code
          failure_reason: input.reason
          ready: false
          health: Unknown
        emits: [weft.workloads.InstanceFailed]
        payload:
          weft.workloads.InstanceFailed:
            instance_id: input.instance_id
            reason: input.reason
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
            restart: false
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Section 10 line 454 (preemption), section 9 line 444 (draining), section 11 line 471 (a lost
  # node's instances). A drain respects the workload's DisruptionBudget (sketch lines 299-300);
  # the count of replicas already down is the scheduler's to read.
  - name: weft.workloads.EvictInstance
    naming:
      display: Evict an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: reason, type: weft.workloads.EvictionReason}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      # Kept external: the replicas of the workload down at once, counted against the stored
      # DisruptionBudget; a row-set count compares only with a literal (docs/ess-gaps.md 6).
      - name: over-budget
        external: >-
          a drain would take more replicas of the workload down at once than its DisruptionBudget
          allows
        when_subject: {predicate: state != Pending}
        error: weft.workloads.DisruptionBudgetExceeded
      - name: evicted
        moves: weft.workloads.Instance.evict
        instance: instance_id
        sets:
          eviction_reason: input.reason
          ready: false
          health: Unknown
        emits: [weft.workloads.InstanceEvicted]
        payload:
          weft.workloads.InstanceEvicted:
            instance_id: input.instance_id
            reason: input.reason
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Section 11 line 466 `Stop`; actor list line 106. A pending instance no node holds is withdrawn
  # at once; any other live instance is asked to stop and the node reports its exit.
  - name: weft.workloads.StopInstance
    naming:
      display: Stop an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: withdrawn
        when_subject_state: Pending
        moves: weft.workloads.Instance.withdraw
        instance: instance_id
        sets:
          desired: Stop
        emits: [weft.workloads.InstanceWithdrawn]
        payload:
          weft.workloads.InstanceWithdrawn:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
      - name: stop-asked
        when_subject_state: [Scheduled, Starting, Running, Paused]
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          desired: Stop
        emits: [weft.workloads.InstanceDesiredSet]
        payload:
          weft.workloads.InstanceDesiredSet:
            instance_id: input.instance_id
            desired: Stop
      - name: ended
        error: weft.workloads.StateConflict

  # Section 14 R6 (line 590, "account closed -> ... instances stopped"), many-rows form (lines
  # 603-604): one command whose outcome moves every matching row, invoked by one binding on
  # weft.accounts.AccountClosed (account_id -> account_id). Every live instance of the account,
  # pending ones included, is asked to stop (desired Stop), as StopInstance does for one; a node
  # stops its running ones and reports each end (R2 edge). A pending instance no node holds is
  # withdrawn by the level step on PendingStopsToWithdraw (StopInstance per row): an outcome over
  # a set of rows carries no second effect (ESS-COMMAND-009), so the move to Exited cannot sit
  # here beside the update. Refused while the account is open: closing is the accounts domain's
  # decision (deny by default).
  # OPEN: the account's boxes, sessions, jobs, schedules, triggers, warm pools and workloads keep
  # their own states; whether the closing also destroys, closes, cancels, deletes or retires them
  # is not said, and CreateInstance does not refuse a closed account. Smallest answer: their
  # instances stop here and the services retire (RetireAccountServices); the records stay as
  # history.
  - name: weft.workloads.StopAccountInstances
    naming:
      display: Stop every instance of a closed account
    input:
      - {name: account_id, type: weft.shared.AccountId}
    outcomes:
      - name: no-account
        when_related: {via: input.account_id, exists: false}
        error: weft.workloads.NotFound
      - name: account-open
        when_related: {via: input.account_id, predicate: state != Closed}
        error: weft.workloads.AccountNotClosed
      - name: stopped
        updates: weft.workloads.Instance
        instances:
          where:
            all:
              - account_id == input.account_id
              - any: [state == Pending, state == Scheduled, state == Starting, state == Running, state == Paused]
        sets:
          desired: Stop
        emits: [weft.workloads.AccountInstancesStopped]
        payload:
          weft.workloads.AccountInstancesStopped:
            account_id: input.account_id
            stopped: {count: changed}

  # Section 14 R6 (line 590) with R1 (line 585), many-rows form: a closed account's services
  # retire, so the level loop (ServicesBelowScale) requests no replica of them again and the
  # instances StopAccountInstances stops stay stopped. A second binding on
  # weft.accounts.AccountClosed (account_id -> account_id).
  - name: weft.workloads.RetireAccountServices
    naming:
      display: Retire every service of a closed account
    input:
      - {name: account_id, type: weft.shared.AccountId}
    outcomes:
      - name: no-account
        when_related: {via: input.account_id, exists: false}
        error: weft.workloads.NotFound
      - name: account-open
        when_related: {via: input.account_id, predicate: state != Closed}
        error: weft.workloads.AccountNotClosed
      - name: retired
        moves: weft.workloads.Service.retire
        instances:
          where:
            all:
              - account_id == input.account_id
              - state != Retired
        emits: [weft.workloads.AccountServicesRetired]
        payload:
          weft.workloads.AccountServicesRetired:
            account_id: input.account_id
            retired: {count: changed}

  # Section 11 line 466 `Pause`.
  - name: weft.workloads.PauseInstance
    naming:
      display: Pause an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the instance's own account acts on it; another account's instance
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: pause-asked
        when_subject_state: Running
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          desired: Pause
        emits: [weft.workloads.InstanceDesiredSet]
        payload:
          weft.workloads.InstanceDesiredSet:
            instance_id: input.instance_id
            desired: Pause
      - name: not-running
        error: weft.workloads.StateConflict

  - name: weft.workloads.ResumeInstance
    naming:
      display: Resume an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the instance's own account acts on it; another account's instance
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: resume-asked
        when_subject_state: Paused
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          desired: Run
        emits: [weft.workloads.InstanceDesiredSet]
        payload:
          weft.workloads.InstanceDesiredSet:
            instance_id: input.instance_id
            desired: Run
      - name: not-paused
        error: weft.workloads.StateConflict

  # Actor list line 106 "execs"; sketch lines 250-251 (a Box is exec'd into). The exec stream is
  # protocols/exec-channel.yaml; this command authorizes it and writes the audit record.
  # OPEN: whether an exec needs its own role beyond Deployer (it reaches the workload's secrets
  # in memory). Smallest safe answer: Deployer only, on a running instance only.
  - name: weft.workloads.OpenExec
    naming:
      display: Open an exec into an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      # hardening pass 1 D2: the principal who opens the exec is the caller, not a request input.
      - {name: command, type: List<String>}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the instance's own account acts on it; another account's instance
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: opened
        when_subject_state: Running
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.ExecOpened]
        payload:
          weft.workloads.ExecOpened:
            instance_id: input.instance_id
            principal_id: {caller: principal_id}
            command: input.command
      - name: not-running
        error: weft.workloads.StateConflict

  # Sketch lines 246-247 and 270-272: a Service-shaped workload's replicas, bounds, budget and
  # sleep. A `min` of 0 needs a SleepPolicy, and a SleepPolicy needs a `min` of 0 (line 281).
  # OPEN: line 272 allows `min: 0` "for a Service that answers requests"; what marks a Service as
  # answering requests (a Border route, a link, a queue trigger) is not said. Smallest answer: any
  # Service may set it, and it sleeps only under its SleepPolicy.
  - name: weft.workloads.DefineService
    naming:
      display: Define a service
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: replicas, type: Integer}
      - {name: scale_rule, type: weft.workloads.ScaleRule}
      - {name: disruption_budget, type: Optional<weft.workloads.DisruptionBudget>}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: wake_deadline, type: Optional<weft.workloads.WakeDeadline>}
    outcomes:
      - name: bad-bounds
        when:
          any:
            - scale_rule.min_replicas < 0
            - scale_rule.max_replicas < scale_rule.min_replicas
            - replicas < scale_rule.min_replicas
            - replicas > scale_rule.max_replicas
        error: weft.workloads.InvalidAmount
      - name: sleep-needs-policy
        when:
          all:
            - scale_rule.min_replicas == 0
            - not defined(sleep_policy)
        error: weft.workloads.SleepPolicyRequired
      - name: policy-needs-min-zero
        when:
          all:
            - scale_rule.min_replicas > 0
            - defined(sleep_policy)
        error: weft.workloads.SleepPolicyRequiresMinZero
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: not-a-service
        when_related: {via: input.workload_id, predicate: shape != Service}
        error: weft.workloads.ShapeMismatch
      - name: exists
        when_related:
          entity: weft.workloads.Service
          where: workload_id == input.workload_id
          exists: true
        error: weft.workloads.ServiceExists
      - name: defined
        creates: weft.workloads.Service
        instance: service_id
        sets:
          workload_id: input.workload_id
          account_id: {related: {via: input.workload_id, field: account_id}}
          replicas: input.replicas
          running_replicas: 0
          scale_rule: input.scale_rule
          disruption_budget: input.disruption_budget
          sleep_policy: input.sleep_policy
          wake_deadline: input.wake_deadline
          sleep_snapshots: []
        emits: [weft.workloads.ServiceDefined]
        payload:
          weft.workloads.ServiceDefined:
            service_id: {generated: true}
            workload_id: input.workload_id
            replicas: input.replicas
            scale_rule: input.scale_rule

  # Sketch line 246 "scales between bounds"; actor list line 106 "Deployer: ... scales". A scale
  # past a quota is refused by name (outcome group `quota`) and the service keeps its size.
  - name: weft.workloads.ScaleService
    naming:
      display: Scale a service
    input:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: replicas, type: Integer}
    outcomes:
      - name: negative-replicas
        when: replicas < 0
        error: weft.workloads.InvalidAmount
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the service's own account acts on it; another account's service
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: below-bounds
        when_subject: {predicate: scale_rule.min_replicas > input.replicas}
        error: weft.workloads.ReplicasOutOfBounds
      - name: above-bounds
        when_subject: {predicate: scale_rule.max_replicas < input.replicas}
        error: weft.workloads.ReplicasOutOfBounds
      - name: scaled
        when_subject_state: Awake
        updates: weft.workloads.Service
        instance: service_id
        sets:
          replicas: input.replicas
        emits: [weft.workloads.ServiceScaled]
        payload:
          weft.workloads.ServiceScaled:
            service_id: input.service_id
            replicas: input.replicas
      - name: not-awake
        error: weft.workloads.StateConflict

  # Section 14 R1 (line 585): "rollout step started -> the workload's desired replica count set";
  # line 574: desired state is what a release wrote. Invoked by the binding on
  # weft.deployments.ReleaseStepStarted (kind Rollout), which carries workload_id and replicas but
  # no service_id. The level step (ServicesBelowScale, ServicesAboveScale) then fills the gap.
  # The rows are addressed by workload: a workload has at most one Service (DefineService,
  # outcome `exists`), so the set effect over `workload_id == input.workload_id` changes the
  # single Service row; the guards before it refuse by name when that row is missing, out of
  # bounds or not Awake, so the set never changes zero rows silently.
  # Same rules as ScaleService: bounds of the ScaleRule, Awake only (sleep and wake own the count
  # otherwise).
  - name: weft.workloads.SetWorkloadReplicas
    naming:
      display: Set a workload's replica count
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: replicas, type: Integer}
    outcomes:
      - name: negative-replicas
        when: replicas < 0
        error: weft.workloads.InvalidAmount
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: not-a-service
        when_related: {via: input.workload_id, predicate: shape != Service}
        error: weft.workloads.ShapeMismatch
      - name: no-service
        when_related:
          entity: weft.workloads.Service
          where:
            all:
              - workload_id == input.workload_id
              - state != Retired
          exists: false
        error: weft.workloads.ServiceNotFound
      - name: below-bounds
        when_related:
          entity: weft.workloads.Service
          where:
            all:
              - workload_id == input.workload_id
              - scale_rule.min_replicas > input.replicas
          exists: true
        error: weft.workloads.ReplicasOutOfBounds
      - name: above-bounds
        when_related:
          entity: weft.workloads.Service
          where:
            all:
              - workload_id == input.workload_id
              - scale_rule.max_replicas < input.replicas
          exists: true
        error: weft.workloads.ReplicasOutOfBounds
      - name: not-awake
        when_related:
          entity: weft.workloads.Service
          where:
            all:
              - workload_id == input.workload_id
              - state != Awake
          exists: true
        error: weft.workloads.StateConflict
      - name: set
        updates: weft.workloads.Service
        instances:
          where:
            all:
              - workload_id == input.workload_id
              - state == Awake
        sets:
          replicas: input.replicas
        emits:
          - {event: weft.workloads.ServiceScaled, each: changed}
        payload:
          weft.workloads.ServiceScaled:
            service_id: {changed: service_id}
            replicas: input.replicas

  # Sketch lines 297-298: "Autoscaling out uses ScaleRule; a scale step that exceeds a quota or
  # budget is refused by name and the service stays at its current size". Scaling in to zero is
  # the sleep path (BeginSleep), so a step here keeps at least one replica.
  # OPEN: which actor reads the ScaleRule's metric and issues the step (an autoscaler of the
  # control plane; the actor list has none). Smallest answer: Scheduler.
  - name: weft.workloads.AutoscaleService
    naming:
      display: Autoscale a service
    input:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: replicas, type: Integer}
      - {name: metric_value, type: Integer}
    outcomes:
      - name: below-one
        when: replicas < 1
        error: weft.workloads.InvalidAmount
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: below-bounds
        when_subject: {predicate: scale_rule.min_replicas > input.replicas}
        error: weft.workloads.ReplicasOutOfBounds
      - name: above-bounds
        when_subject: {predicate: scale_rule.max_replicas < input.replicas}
        error: weft.workloads.ReplicasOutOfBounds
      # Kept external: the spending budget is a fact of weft.metering (layer 8), above this layer.
      - name: over-budget
        external: the scale step would take the account past its spending budget
        when_subject: {predicate: replicas < input.replicas}
        error: weft.workloads.BudgetExceeded
      - name: scaled
        when_subject_state: Awake
        updates: weft.workloads.Service
        instance: service_id
        sets:
          replicas: input.replicas
        emits: [weft.workloads.ServiceScaled]
        payload:
          weft.workloads.ServiceScaled:
            service_id: input.service_id
            replicas: input.replicas
      - name: not-awake
        error: weft.workloads.StateConflict

  # Sketch lines 270-272: "replica bounds and the metric that moves them"; `min: 0` allowed.
  - name: weft.workloads.SetScaleRule
    naming:
      display: Set a scale rule
    input:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: scale_rule, type: weft.workloads.ScaleRule}
    outcomes:
      - name: bad-bounds
        when:
          any:
            - scale_rule.min_replicas < 0
            - scale_rule.max_replicas < scale_rule.min_replicas
        error: weft.workloads.InvalidAmount
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the service's own account acts on it; another account's service
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: sleep-needs-policy
        when_subject:
          predicate:
            all:
              - not defined(sleep_policy)
              - input.scale_rule.min_replicas == 0
        error: weft.workloads.SleepPolicyRequired
      - name: policy-needs-min-zero
        when_subject:
          predicate:
            all:
              - defined(sleep_policy)
              - input.scale_rule.min_replicas > 0
        error: weft.workloads.SleepPolicyRequiresMinZero
      - name: replicas-outside
        when_subject:
          predicate:
            any:
              - replicas < input.scale_rule.min_replicas
              - replicas > input.scale_rule.max_replicas
        error: weft.workloads.ReplicasOutOfBounds
      - name: set
        when_subject_state: [Awake, DrainingToSleep, Asleep, Waking]
        updates: weft.workloads.Service
        instance: service_id
        sets:
          scale_rule: input.scale_rule
        emits: [weft.workloads.ScaleRuleSet]
        payload:
          weft.workloads.ScaleRuleSet:
            service_id: input.service_id
            scale_rule: input.scale_rule
      - name: retired
        error: weft.workloads.StateConflict

  # Sketch lines 299-300: "at most N replicas down at once for a drain or a rollout".
  - name: weft.workloads.SetDisruptionBudget
    naming:
      display: Set a disruption budget
    input:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: disruption_budget, type: weft.workloads.DisruptionBudget}
    outcomes:
      - name: bad-budget
        when: disruption_budget.max_unavailable < 0
        error: weft.workloads.InvalidAmount
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the service's own account acts on it; another account's service
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: set
        when_subject_state: [Awake, DrainingToSleep, Asleep, Waking]
        updates: weft.workloads.Service
        instance: service_id
        sets:
          disruption_budget: input.disruption_budget
        emits: [weft.workloads.DisruptionBudgetSet]
        payload:
          weft.workloads.DisruptionBudgetSet:
            service_id: input.service_id
            disruption_budget: input.disruption_budget
      - name: retired
        error: weft.workloads.StateConflict

  # Sketch lines 281-285: a SleepPolicy on a Service whose ScaleRule has `min` 0. Absent clears it,
  # allowed only while `min` is above 0.
  - name: weft.workloads.SetSleepPolicy
    naming:
      display: Set a sleep policy
    input:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: wake_deadline, type: Optional<weft.workloads.WakeDeadline>}
    outcomes:
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the service's own account acts on it; another account's service
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: needs-min-zero
        when_subject:
          predicate:
            all:
              - scale_rule.min_replicas > 0
              - defined(input.sleep_policy)
        error: weft.workloads.SleepPolicyRequiresMinZero
      - name: still-needed
        when_subject:
          predicate:
            all:
              - scale_rule.min_replicas == 0
              - not defined(input.sleep_policy)
        error: weft.workloads.SleepPolicyRequired
      - name: set
        when_subject_state: [Awake, DrainingToSleep, Asleep, Waking]
        updates: weft.workloads.Service
        instance: service_id
        sets:
          sleep_policy: input.sleep_policy
          wake_deadline: input.wake_deadline
        emits: [weft.workloads.SleepPolicySet]
        payload:
          weft.workloads.SleepPolicySet:
            service_id: input.service_id
            sleep_policy: input.sleep_policy
            wake_deadline: input.wake_deadline
      - name: retired
        error: weft.workloads.StateConflict

  # Sketch lines 281-282: no request for the policy's idle time; the instances drain.
  # OPEN: which actor sees the idle time pass (the edge and the links count requests). Smallest
  # answer: Scheduler, as for autoscaling.
  - name: weft.workloads.BeginSleep
    naming:
      display: Begin sleep
    input:
      - {name: service_id, type: weft.shared.ServiceId}
    outcomes:
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: no-policy
        when_subject: {predicate: not defined(sleep_policy)}
        error: weft.workloads.SleepPolicyRequired
      # Section 14 level form: the desired count drops to 0, so ServicesAboveScale lists the
      # service until every instance ended (the drain).
      - name: draining
        moves: weft.workloads.Service.begin_sleep
        instance: service_id
        sets:
          replicas: 0
        emits: [weft.workloads.ServiceDrainingToSleep]
        payload:
          weft.workloads.ServiceDrainingToSleep:
            service_id: input.service_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 283-285 and 294-295: every instance ended (`stop`) or was snapshotted and freed
  # (`suspend`); replicas read zero.
  - name: weft.workloads.RecordServiceAsleep
    naming:
      display: Record a service asleep
    input:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: sleep_snapshots, type: List<weft.shared.SnapshotId>}
    outcomes:
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: suspend-without-snapshots
        when_subject:
          predicate:
            all:
              - defined(sleep_policy)
              - sleep_policy.kind == Suspend
              - input.sleep_snapshots.count == 0
        error: weft.workloads.SnapshotsMissing
      # Sketch line 285: asleep means zero instances; the live count says whether the drain ended.
      - name: instances-live
        when_subject: {predicate: running_replicas > 0}
        error: weft.workloads.ReplicasStillLive
      # hardening pass 1 (RecordServiceAsleep): every sleep snapshot exists, so a wake never
      # restores a snapshot that is not there.
      # OPEN: every sleep snapshot should be one of the service's own workload. Not expressible in
      # ess 0.99.2: a row-set guard over the snapshots cannot stand beside the `when_subject`
      # guards above in one command.
      - name: unknown-snapshot
        when_related: {via: input.sleep_snapshots, exists: false}
        error: weft.workloads.NotFound
      - name: asleep
        moves: weft.workloads.Service.sleep
        instance: service_id
        sets:
          replicas: 0
          sleep_snapshots: input.sleep_snapshots
        emits: [weft.workloads.ServiceAsleep]
        payload:
          weft.workloads.ServiceAsleep:
            service_id: input.service_id
            sleep_snapshots: input.sleep_snapshots
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 286-291: `Wake`. The edge or a link holds the first request and asks for an
  # instance; a queue message, a schedule or `weft wake` also wake. The wake is recorded and held
  # until the service is awake (served) or its deadline passes (missed). A wake of an awake service
  # is served at once. StartWaking then moves the service.
  # OPEN: the edge, a link, a queue and a schedule are components, not actors of the sketch's
  # list (lines 98-115). Smallest answer: Deployer and Automation for `explicit`, Scheduler for
  # the other sources.
  - name: weft.workloads.WakeService
    naming:
      display: Wake a service
    input:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: source, type: weft.workloads.WakeSource}
      # The time of the request plus the Service's WakeDeadline, computed by the caller.
      - {name: deadline_at, type: Timestamp}
    outcomes:
      - name: deadline-past
        when: deadline_at < now
        error: weft.workloads.DeadlineInPast
      - name: no-service
        when_related: {via: input.service_id, exists: false}
        error: weft.workloads.ServiceNotFound
      - name: retired
        when_related: {via: input.service_id, predicate: state == Retired}
        error: weft.workloads.StateConflict
      - name: already-awake
        when_related: {via: input.service_id, predicate: state == Awake}
        creates: weft.workloads.Wake
        into: Served
        instance: wake_id
        sets:
          service_id: input.service_id
          source: input.source
          deadline_at: input.deadline_at
        emits: [weft.workloads.WakeRequested]
        payload:
          weft.workloads.WakeRequested:
            wake_id: {generated: true}
            service_id: input.service_id
            source: input.source
            deadline_at: input.deadline_at
      - name: held
        creates: weft.workloads.Wake
        instance: wake_id
        sets:
          service_id: input.service_id
          source: input.source
          deadline_at: input.deadline_at
        emits: [weft.workloads.WakeRequested]
        payload:
          weft.workloads.WakeRequested:
            wake_id: {generated: true}
            service_id: input.service_id
            source: input.source
            deadline_at: input.deadline_at

  # Sketch lines 286-287: "asks for an instance". An asleep service starts waking; a service
  # draining to sleep stays awake. A wake past a quota is refused by name (outcome group `quota`)
  # and the service stays at its current size (lines 297-298); its held wakes then miss their
  # deadline with a named answer.
  # OPEN: which actor turns a recorded wake into a waking service. Smallest answer: Scheduler.
  - name: weft.workloads.StartWaking
    naming:
      display: Start waking a service
    input:
      - {name: service_id, type: weft.shared.ServiceId}
    outcomes:
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      # Section 14 R8 (line 592), level form: a wake asks for one instance (sketch line 278: "the
      # first request wakes them; load then scales them out"); a ScaleRule whose maximum is 0
      # never runs one.
      - name: cannot-run
        when_subject: {predicate: scale_rule.max_replicas < 1}
        error: weft.workloads.ReplicasOutOfBounds
      - name: waking
        when_subject_state: Asleep
        moves: weft.workloads.Service.wake
        instance: service_id
        sets:
          replicas: 1
        emits: [weft.workloads.ServiceWaking]
        payload:
          weft.workloads.ServiceWaking:
            service_id: input.service_id
            workload_id: {subject: workload_id}
            replicas: 1
      # BeginSleep set the count to 0; the cancelled drain asks for one instance again.
      - name: sleep-cancelled
        when_subject_state: DrainingToSleep
        moves: weft.workloads.Service.cancel_sleep
        instance: service_id
        sets:
          replicas: 1
        emits: [weft.workloads.ServiceSleepCancelled]
        payload:
          weft.workloads.ServiceSleepCancelled:
            service_id: input.service_id
      - name: already
        when_subject_state: [Waking, Awake]
        preserves: weft.workloads.Service
        instance: service_id
      - name: retired
        error: weft.workloads.StateConflict

  # Sketch lines 286-287: "forwards the request when one is ready". Every waiting wake of the
  # service is served.
  # OPEN: which actor reports the first ready instance of a waking service (the control plane
  # from a NodeAgent's check result). Smallest answer: Scheduler.
  - name: weft.workloads.RecordServiceAwake
    naming:
      display: Record a service awake
    input:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: replicas, type: Integer}
    outcomes:
      - name: below-one
        when: replicas < 1
        error: weft.workloads.InvalidAmount
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: awake
        moves: weft.workloads.Service.awaken
        instance: service_id
        sets:
          replicas: input.replicas
        emits: [weft.workloads.ServiceAwake]
        payload:
          weft.workloads.ServiceAwake:
            service_id: input.service_id
            replicas: input.replicas
        affects:
          - entity: weft.workloads.Wake
            where: {all: ["service_id == input.service_id", "state == Waiting"]}
            moves: weft.workloads.Wake.serve
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 288-289: past its WakeDeadline the held request fails with a named answer,
  # never silence. Refused before the deadline.
  - name: weft.workloads.MissWake
    naming:
      display: Miss a wake deadline
    input:
      - {name: wake_id, type: weft.shared.WakeId}
    outcomes:
      - name: no-such-wake
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: not-yet
        when_subject: {predicate: deadline_at > now}
        error: weft.workloads.DeadlineNotReached
      - name: missed
        moves: weft.workloads.Wake.miss
        instance: wake_id
        sets:
          failure: DeadlineMissed
        emits: [weft.workloads.WakeMissed]
        payload:
          weft.workloads.WakeMissed:
            wake_id: input.wake_id
            failure: DeadlineMissed
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Section 14 R1 (line 585) in the level form (lines 595-599): the controller reads the gap view
  # ServicesBelowScale and runs this once per row; ReplicaRequested then becomes CreateInstance by
  # a binding. The count rises here, on the Service row, because CreateInstance creates its subject
  # and so carries no set effect on the Service (ESS-COMMAND-009). A release reaches this loop
  # through DefineService and SetWorkloadReplicas (R1 edge): its Service rows are the desired
  # state, no fan-out of the release event is needed. The controller picks the index: the lowest
  # index below `replicas` that InstanceList shows no live instance for (a stateful replica keeps
  # its name, sketch line 247).
  # OPEN: which actor runs it: section 14 line 576 names ReleaseController and Scheduler.
  # Smallest answer: Scheduler, as for CreateInstance.
  # OPEN: two requests for one index before the first CreateInstance lands both pass here; the
  # second CreateInstance answers `replica-live` and the count stays one too high until something
  # lowers it. Smallest answer: the controller requests one replica per service at a time and
  # waits for InstanceCreated or the refusal; should the binding of the refusal invoke a command
  # that gives the count back?
  # OPEN: Daemon (one instance per matching node), Job tasks and WarmPool size are desired counts
  # of their own with no level loop here yet (Job has RetryTask, edge form).
  - name: weft.workloads.RequestReplica
    naming:
      display: Request a replica
    input:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: replica_index, type: Integer}
    outcomes:
      - name: negative-index
        when: replica_index < 0
        error: weft.workloads.InvalidAmount
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: index-above-count
        when_subject: {predicate: input.replica_index >= replicas}
        error: weft.workloads.ReplicasOutOfBounds
      - name: at-scale
        when_subject: {predicate: running_replicas >= replicas}
        error: weft.workloads.ServiceAtScale
      - name: backing-off
        when_subject: {predicate: defined(backoff_until)}
        error: weft.workloads.ReplicaBackoffActive
      # A live index is refused by CreateInstance (`replica-live`): one command reads one kind of
      # related row (ESS-COMMAND-009), and this one reads its subject.
      - name: requested
        when_subject_state: [Awake, Waking]
        updates: weft.workloads.Service
        instance: service_id
        sets:
          running_replicas: {increment: 1}
        emits: [weft.workloads.ReplicaRequested]
        payload:
          weft.workloads.ReplicaRequested:
            service_id: input.service_id
            workload_id: {subject: workload_id}
            replica_index: input.replica_index
      - name: not-scaling
        error: weft.workloads.StateConflict

  # Section 14 R2 and R3 (lines 586-587), edge form: an ended instance of a service (InstanceExited,
  # InstanceFailed, InstanceEvicted, InstanceWithdrawn with `service_id` present) leaves the
  # service's live count, once: the instance is marked counted out, and a second delivery is
  # refused (`already-counted`, harmless to drop). The gap view then shows the service again and
  # the level loop requests the replacement (R2, R3). With `backoff` (the event's `restart`) the
  # service backs off first (section 15 "Restart backoff"): `backoff_until` is the
  # implementation's clock plus the wait of the workload's RestartPolicy (ESS has no timer and
  # `now` is not a value, so the instant is generated; the exact wait is the OPEN on
  # RecordProcessRestarted).
  # Bindings (four, one per end event, each `where: [defined(event.service_id)]`):
  # InstanceExited and InstanceFailed map `backoff: event.restart`; InstanceEvicted and
  # InstanceWithdrawn map `backoff: false`; all map service_id and instance_id.
  # OPEN: a Service whose RestartPolicy is `never` or `on-failure`: the level loop replaces every
  # ended replica, so the policy decides only the backoff (`restart` false: no wait). Kubernetes
  # admits only `Always` for a Deployment's Pods. Smallest answer: as written.
  # OPEN: a replica whose artifact the node rejected (RecordArtifactRejected, `restart` false) is
  # replaced at once and rejected again, a loop without a wait. Smallest answer: the InstanceFailed
  # binding maps `backoff: true` for every failure, not `event.restart`.
  # OPEN: an instance of another shape (Box, Session, Daemon, Invocation) whose end says
  # `restart: true` has no command here that makes its replacement; R2 is written for Service
  # replicas (level) and Job tasks (RetryTask) only.
  - name: weft.workloads.RecordReplicaEnded
    naming:
      display: Record a replica ended
    input:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: backoff, type: Boolean}
    outcomes:
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: count-empty
        when_subject: {predicate: running_replicas < 1}
        error: weft.workloads.InvalidCount
      - name: no-instance
        when_related: {via: input.instance_id, exists: false}
        error: weft.workloads.NotFound
      - name: other-service
        when_related: {via: input.instance_id, predicate: {any: [not defined(service_id), service_id != input.service_id]}}
        error: weft.workloads.ForeignOwner
      - name: instance-live
        when_related:
          via: input.instance_id
          predicate: {any: [state == Pending, state == Scheduled, state == Starting, state == Running, state == Paused]}
        error: weft.workloads.StateConflict
      - name: already-counted
        when_related: {via: input.instance_id, predicate: replica_counted_out == true}
        error: weft.workloads.StateConflict
      - name: ended-backing-off
        when: backoff == true
        updates: weft.workloads.Service
        instance: service_id
        sets:
          running_replicas: {increment: -1}
          backoff_until: {generated: true, present: true}
        emits: [weft.workloads.ReplicaEnded]
        payload:
          weft.workloads.ReplicaEnded:
            service_id: input.service_id
            instance_id: input.instance_id
            backoff: input.backoff
        affects:
          - entity: weft.workloads.Instance
            where: instance_id == input.instance_id
            sets:
              replica_counted_out: true
      - name: ended
        updates: weft.workloads.Service
        instance: service_id
        sets:
          running_replicas: {increment: -1}
        emits: [weft.workloads.ReplicaEnded]
        payload:
          weft.workloads.ReplicaEnded:
            service_id: input.service_id
            instance_id: input.instance_id
            backoff: input.backoff
        affects:
          - entity: weft.workloads.Instance
            where: instance_id == input.instance_id
            sets:
              replica_counted_out: true

  # Section 14 R2 (line 586) in the time form (line 600-602): the controller reads
  # ServiceBackoffsDue and runs this per row once `backoff_until` passed; the guard on `now` is the
  # rule, the actor's clock the trigger.
  # OPEN: which actor runs it. Smallest answer: Scheduler.
  - name: weft.workloads.EndReplicaBackoff
    naming:
      display: End a replica backoff
    input:
      - {name: service_id, type: weft.shared.ServiceId}
    outcomes:
      - name: no-such-service
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: not-backing-off
        when_subject: {predicate: not defined(backoff_until)}
        error: weft.workloads.StateConflict
      - name: not-yet
        when_subject: {predicate: backoff_until > now}
        error: weft.workloads.DeadlineNotReached
      - name: ended
        updates: weft.workloads.Service
        instance: service_id
        sets:
          backoff_until: {cleared: true}
        emits: [weft.workloads.ReplicaBackoffEnded]
        payload:
          weft.workloads.ReplicaBackoffEnded:
            service_id: input.service_id

  # Sketch line 243: one call, one result, a deadline. CLI section: `weft invoke shop/orders`. A
  # Schedule's workload starts Invocations too (line 257). An invocation past a quota is refused by
  # name (outcome group `quota`).
  - name: weft.workloads.Invoke
    naming:
      display: Invoke a workload
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: request, type: Bytes}
      # The time of the call plus the shape's deadline, computed by the caller.
      - {name: deadline_at, type: Timestamp}
      - {name: schedule_id, type: Optional<weft.shared.ScheduleId>}
      - {name: trigger_id, type: Optional<weft.shared.TriggerId>}
    outcomes:
      - name: deadline-past
        when: deadline_at < now
        error: weft.workloads.DeadlineInPast
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      # hardening pass 1 W6: the schedule or trigger an invocation names as its cause is one of
      # the same workload.
      - name: schedule-missing
        when_related: {via: input.schedule_id, exists: false}
        error: weft.workloads.NotFound
      - name: trigger-missing
        when_related: {via: input.trigger_id, exists: false}
        error: weft.workloads.NotFound
      - name: schedule-of-other-workload
        when_related: {via: input.schedule_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: trigger-of-other-workload
        when_related: {via: input.trigger_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: not-invocable
        when_related:
          via: input.workload_id
          predicate:
            shape: {none_of: [Invocation, Schedule]}
        error: weft.workloads.ShapeMismatch
      - name: accepted
        creates: weft.workloads.Invocation
        instance: invocation_id
        sets:
          workload_id: input.workload_id
          deadline_at: input.deadline_at
          request: input.request
          schedule_id: input.schedule_id
          trigger_id: input.trigger_id
        emits: [weft.workloads.InvocationAccepted]
        payload:
          weft.workloads.InvocationAccepted:
            invocation_id: {generated: true}
            workload_id: input.workload_id
            deadline_at: input.deadline_at

  # Sketch line 243. The instance that runs the call (a warm one, or one created for it). An
  # instance of another workload never serves the call: both records must name the workload.
  # OPEN: which actor records the start (the control plane routing the call, or the NodeAgent
  # running it). Smallest answer: NodeAgent.
  - name: weft.workloads.RecordInvocationStarted
    naming:
      display: Record an invocation started
    input:
      - {name: invocation_id, type: weft.shared.InvocationId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: no-such-invocation
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: past-deadline
        when_subject: {predicate: deadline_at < now}
        error: weft.workloads.DeadlinePassed
      - name: other-workload
        when_subject: {predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: no-instance
        when_related: {via: input.instance_id, exists: false}
        error: weft.workloads.NotFound
      - name: foreign-instance
        when_related: {via: input.instance_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: instance-not-running
        when_related: {via: input.instance_id, predicate: state != Running}
        error: weft.workloads.StateConflict
      - name: started
        moves: weft.workloads.Invocation.start
        instance: invocation_id
        sets:
          instance_id: input.instance_id
        emits: [weft.workloads.InvocationStarted]
        payload:
          weft.workloads.InvocationStarted:
            invocation_id: input.invocation_id
            instance_id: input.instance_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 243: "one result". A result after the deadline is refused; the record times out.
  - name: weft.workloads.CompleteInvocation
    naming:
      display: Complete an invocation
    input:
      - {name: invocation_id, type: weft.shared.InvocationId}
      - {name: result, type: Bytes}
    outcomes:
      - name: no-such-invocation
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: past-deadline
        when_subject: {predicate: deadline_at < now}
        error: weft.workloads.DeadlinePassed
      - name: succeeded
        moves: weft.workloads.Invocation.succeed
        instance: invocation_id
        sets:
          result: input.result
        emits: [weft.workloads.InvocationSucceeded]
        payload:
          weft.workloads.InvocationSucceeded:
            invocation_id: input.invocation_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.FailInvocation
    naming:
      display: Fail an invocation
    input:
      - {name: invocation_id, type: weft.shared.InvocationId}
      - {name: failure, type: String}
    outcomes:
      - name: no-such-invocation
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: failed
        moves: weft.workloads.Invocation.fail
        instance: invocation_id
        sets:
          failure: input.failure
        emits: [weft.workloads.InvocationFailed]
        payload:
          weft.workloads.InvocationFailed:
            invocation_id: input.invocation_id
            failure: input.failure
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 243: "a deadline". Refused before the deadline.
  - name: weft.workloads.ExpireInvocation
    naming:
      display: Expire an invocation
    input:
      - {name: invocation_id, type: weft.shared.InvocationId}
    outcomes:
      - name: no-such-invocation
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: not-yet
        when_subject: {predicate: deadline_at > now}
        error: weft.workloads.DeadlineNotReached
      - name: timed-out
        moves: weft.workloads.Invocation.time_out
        instance: invocation_id
        emits: [weft.workloads.InvocationTimedOut]
        payload:
          weft.workloads.InvocationTimedOut:
            invocation_id: input.invocation_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 244-245; a Schedule's workload starts Jobs too (line 257). A job past a quota is
  # refused by name (outcome group `quota`).
  - name: weft.workloads.SubmitJob
    naming:
      display: Submit a job
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: parallelism, type: Integer}
      - {name: gang, type: Boolean}
      - {name: max_retries, type: Integer}
      - {name: schedule_id, type: Optional<weft.shared.ScheduleId>}
    outcomes:
      - name: bad-counts
        when:
          any:
            - parallelism < 1
            - max_retries < 0
        error: weft.workloads.InvalidAmount
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      # hardening pass 1 W6: the schedule a job names as its cause is one of the same workload.
      - name: schedule-missing
        when_related: {via: input.schedule_id, exists: false}
        error: weft.workloads.NotFound
      - name: schedule-of-other-workload
        when_related: {via: input.schedule_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: not-a-job
        when_related:
          via: input.workload_id
          predicate:
            shape: {none_of: [Job, Schedule]}
        error: weft.workloads.ShapeMismatch
      - name: submitted
        creates: weft.workloads.Job
        instance: job_id
        sets:
          workload_id: input.workload_id
          parallelism: input.parallelism
          gang: input.gang
          max_retries: input.max_retries
          retries_used: 0
          succeeded_tasks: 0
          outputs: []
          schedule_id: input.schedule_id
        emits: [weft.workloads.JobSubmitted]
        payload:
          weft.workloads.JobSubmitted:
            job_id: {generated: true}
            workload_id: input.workload_id
            parallelism: input.parallelism
            gang: input.gang

  # Sketch line 245 and section 10 line 453: a gang starts with all N tasks bound, or not at all.
  - name: weft.workloads.StartJob
    naming:
      display: Start a job
    input:
      - {name: job_id, type: weft.shared.JobId}
      - {name: bound_tasks, type: Integer}
    outcomes:
      - name: none-bound
        when: bound_tasks < 1
        error: weft.workloads.InvalidAmount
      - name: no-such-job
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: gang-incomplete
        when_subject:
          predicate:
            all:
              - gang == true
              - parallelism != input.bound_tasks
        error: weft.workloads.GangIncomplete
      - name: too-many
        when_subject: {predicate: parallelism < input.bound_tasks}
        error: weft.workloads.InvalidAmount
      - name: started
        moves: weft.workloads.Job.start
        instance: job_id
        emits: [weft.workloads.JobStarted]
        payload:
          weft.workloads.JobStarted:
            job_id: input.job_id
            bound_tasks: input.bound_tasks
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 245: a task of the array succeeded.
  - name: weft.workloads.RecordTaskSucceeded
    naming:
      display: Record a task succeeded
    input:
      - {name: job_id, type: weft.shared.JobId}
      - {name: task_index, type: Integer}
    outcomes:
      - name: negative-index
        when: task_index < 0
        error: weft.workloads.InvalidAmount
      - name: no-such-job
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: index-out-of-range
        when_subject: {predicate: parallelism <= input.task_index}
        error: weft.workloads.InvalidAmount
      - name: recorded
        when_subject_state: Running
        updates: weft.workloads.Job
        instance: job_id
        sets:
          succeeded_tasks: {increment: 1}
        emits: [weft.workloads.TaskSucceeded]
        payload:
          weft.workloads.TaskSucceeded:
            job_id: input.job_id
            task_index: input.task_index
      - name: not-running
        error: weft.workloads.StateConflict

  # Sketch line 244: "retries". A retry past the job's limit is refused; the job then fails.
  - name: weft.workloads.RetryTask
    naming:
      display: Retry a task
    input:
      - {name: job_id, type: weft.shared.JobId}
      - {name: task_index, type: Integer}
      - {name: reason, type: String}
    outcomes:
      - name: negative-index
        when: task_index < 0
        error: weft.workloads.InvalidAmount
      - name: no-such-job
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: index-out-of-range
        when_subject: {predicate: parallelism <= input.task_index}
        error: weft.workloads.InvalidAmount
      - name: exhausted
        when_subject: {predicate: retries_used >= max_retries}
        error: weft.workloads.RetriesExhausted
      - name: retried
        when_subject_state: Running
        updates: weft.workloads.Job
        instance: job_id
        sets:
          retries_used: {increment: 1}
        emits: [weft.workloads.TaskRetried]
        payload:
          weft.workloads.TaskRetried:
            job_id: input.job_id
            task_index: input.task_index
            reason: input.reason
      - name: not-running
        error: weft.workloads.StateConflict

  # Sketch line 244: "runs to completion ... writes outputs". Every task succeeded; the outputs are
  # registered artifacts (sketch line 238: a training job writes a model Artifact).
  - name: weft.workloads.CompleteJob
    naming:
      display: Complete a job
    input:
      - {name: job_id, type: weft.shared.JobId}
      - {name: outputs, type: List<weft.shared.ArtifactDigest>}
    outcomes:
      - name: no-such-job
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: outstanding
        when_subject: {predicate: succeeded_tasks < parallelism}
        error: weft.workloads.TasksOutstanding
      # Every output is a row of weft.artifacts (layer 3), through the relation `output_artifacts`.
      - name: unknown-output
        when_related: {via: input.outputs, exists: false}
        error: weft.workloads.ArtifactNotFound
      # OPEN (hardening pass 1, CompleteJob): every output should be an artifact of the job's
      # workload's account. Not expressible in ess 0.99.2: the row-set guard over the outputs
      # cannot stand beside the `when_subject` guard `outstanding` in one command.
      - name: succeeded
        moves: weft.workloads.Job.succeed
        instance: job_id
        sets:
          outputs: input.outputs
        emits: [weft.workloads.JobSucceeded]
        payload:
          weft.workloads.JobSucceeded:
            job_id: input.job_id
            outputs: input.outputs
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # A task failed with no retry left, or a gang lost a task.
  - name: weft.workloads.FailJob
    naming:
      display: Fail a job
    input:
      - {name: job_id, type: weft.shared.JobId}
      - {name: failure, type: String}
    outcomes:
      - name: no-such-job
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: failed
        moves: weft.workloads.Job.fail
        instance: job_id
        sets:
          failure: input.failure
        emits: [weft.workloads.JobFailed]
        payload:
          weft.workloads.JobFailed:
            job_id: input.job_id
            failure: input.failure
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.CancelJob
    naming:
      display: Cancel a job
    input:
      - {name: job_id, type: weft.shared.JobId}
    outcomes:
      - name: no-such-job
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: cancelled
        moves: weft.workloads.Job.cancel
        instance: job_id
        emits: [weft.workloads.JobCancelled]
        payload:
          weft.workloads.JobCancelled:
            job_id: input.job_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 248-249: a Box of a Box-shaped workload, package image or machine (checked by
  # DefineWorkload). A Box is a virtual machine: a workload under any isolation but MicroVm is
  # refused. A box past a quota is refused by name (outcome group `quota`).
  - name: weft.workloads.CreateBox
    naming:
      display: Create a box
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: size, type: weft.workloads.BoxSize}
      - {name: volume_id, type: Optional<weft.shared.VolumeId>}
      - {name: endpoint_id, type: Optional<weft.shared.EndpointId>}
    outcomes:
      - name: bad-size
        when:
          any:
            - size.cpus < 1
            - size.memory_mib < 1
            - size.gpus < 0
        error: weft.workloads.InvalidAmount
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      # hardening pass 1 W2: the box mounts only a volume of its workload's account; another
      # account's volume answers like a missing one.
      - name: volume-missing
        when_related: {via: input.volume_id, exists: false}
        error: weft.workloads.NotFound
      # hardening pass 1 W3: the box is reached only through an endpoint of its workload's
      # formation; another formation's endpoint answers like a missing one.
      - name: endpoint-missing
        when_related: {via: input.endpoint_id, exists: false}
        error: weft.workloads.NotFound
      # hardening pass 1 W2, W3: the ties, after every existence check (ESS precedence).
      - name: volume-foreign
        when: defined(volume_id)
        when_related:
          entity: weft.resources.Volume
          where:
            all:
              - volume_id == input.volume_id
              - not:
                  exists:
                    as: w
                    in: {entity: weft.workloads.Workload}
                    that: {all: [{w.account_id: {eq: {fact: account_id}}}, w.workload_id == input.workload_id]}
          exists: true
        error: weft.workloads.NotFound
      - name: endpoint-foreign
        when: defined(endpoint_id)
        when_related:
          entity: weft.formations.Endpoint
          where:
            all:
              - endpoint_id == input.endpoint_id
              - not:
                  exists:
                    as: w
                    in: {entity: weft.workloads.Workload}
                    that: {all: [{w.formation_id: {eq: {fact: formation_id}}}, w.workload_id == input.workload_id]}
          exists: true
        error: weft.workloads.NotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: not-a-box
        when_related: {via: input.workload_id, predicate: shape != Box}
        error: weft.workloads.ShapeMismatch
      - name: not-a-vm
        when_related: {via: input.workload_id, predicate: isolation != MicroVm}
        error: weft.workloads.IsolationBelowMinimum
      - name: created
        creates: weft.workloads.Box
        instance: box_id
        sets:
          workload_id: input.workload_id
          account_id: {related: {via: input.workload_id, field: account_id}}
          size: input.size
          volume_id: input.volume_id
          endpoint_id: input.endpoint_id
          cordoned: false
        emits: [weft.workloads.BoxCreated]
        payload:
          weft.workloads.BoxCreated:
            box_id: {generated: true}
            workload_id: input.workload_id
            size: input.size

  # Sketch line 250 "The user starts" a box. Refused while another caller holds a live lease
  # (lines 251-252); a start past a quota is refused by name (outcome group `quota`).
  - name: weft.workloads.StartBox
    naming:
      display: Start a box
    input:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: lease_nonce, type: Optional<String>}
    outcomes:
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the box's own account acts on it; another account's box
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: leased
        when_subject:
          predicate:
            any:
              - all: [defined(lease_expires_at), lease_expires_at > now, not defined(input.lease_nonce)]
              - all: [defined(lease_expires_at), lease_expires_at > now, any: [not defined(lease_nonce), lease_nonce != input.lease_nonce]]
        error: weft.workloads.LeaseHeld
      - name: starting
        moves: weft.workloads.Box.start
        instance: box_id
        emits: [weft.workloads.BoxStarting]
        payload:
          weft.workloads.BoxStarting:
            box_id: input.box_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # The node reports the box's instance running (section 11 line 470).
  - name: weft.workloads.RecordBoxStarted
    naming:
      display: Record a box started
    input:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: no-instance
        when_related: {via: input.instance_id, exists: false}
        error: weft.workloads.NotFound
      - name: foreign-instance
        when_related: {via: input.instance_id, predicate: {any: [not defined(box_id), box_id != input.box_id]}}
        error: weft.workloads.ForeignOwner
      - name: started
        moves: weft.workloads.Box.started
        instance: box_id
        sets:
          instance_id: input.instance_id
        emits: [weft.workloads.BoxStarted]
        payload:
          weft.workloads.BoxStarted:
            box_id: input.box_id
            instance_id: input.instance_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 250 "stops"; refused under another caller's live lease.
  - name: weft.workloads.StopBox
    naming:
      display: Stop a box
    input:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: lease_nonce, type: Optional<String>}
    outcomes:
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the box's own account acts on it; another account's box
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: leased
        when_subject:
          predicate:
            any:
              - all: [defined(lease_expires_at), lease_expires_at > now, not defined(input.lease_nonce)]
              - all: [defined(lease_expires_at), lease_expires_at > now, any: [not defined(lease_nonce), lease_nonce != input.lease_nonce]]
        error: weft.workloads.LeaseHeld
      - name: stopping
        moves: weft.workloads.Box.stop
        instance: box_id
        emits: [weft.workloads.BoxStopping]
        payload:
          weft.workloads.BoxStopping:
            box_id: input.box_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # The node reports the box's instance ended; the volume stays (line 251).
  - name: weft.workloads.RecordBoxStopped
    naming:
      display: Record a box stopped
    input:
      - {name: box_id, type: weft.shared.BoxId}
    outcomes:
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: stopped
        moves: weft.workloads.Box.stopped
        instance: box_id
        sets:
          instance_id: {cleared: true}
        emits: [weft.workloads.BoxStopped]
        payload:
          weft.workloads.BoxStopped:
            box_id: input.box_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 250 "suspends"; refused under another caller's live lease.
  - name: weft.workloads.SuspendBox
    naming:
      display: Suspend a box
    input:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: lease_nonce, type: Optional<String>}
    outcomes:
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the box's own account acts on it; another account's box
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: leased
        when_subject:
          predicate:
            any:
              - all: [defined(lease_expires_at), lease_expires_at > now, not defined(input.lease_nonce)]
              - all: [defined(lease_expires_at), lease_expires_at > now, any: [not defined(lease_nonce), lease_nonce != input.lease_nonce]]
        error: weft.workloads.LeaseHeld
      - name: suspended
        moves: weft.workloads.Box.suspend
        instance: box_id
        emits: [weft.workloads.BoxSuspended]
        payload:
          weft.workloads.BoxSuspended:
            box_id: input.box_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 251 "resizes it". OPEN: whether a started box resizes in place (Fly restarts it).
  # Smallest answer: only a created or stopped box resizes. A resize past a quota is refused by
  # name (outcome group `quota`).
  - name: weft.workloads.ResizeBox
    naming:
      display: Resize a box
    input:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: size, type: weft.workloads.BoxSize}
      - {name: lease_nonce, type: Optional<String>}
    outcomes:
      - name: bad-size
        when:
          any:
            - size.cpus < 1
            - size.memory_mib < 1
            - size.gpus < 0
        error: weft.workloads.InvalidAmount
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the box's own account acts on it; another account's box
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: leased
        when_subject:
          predicate:
            any:
              - all: [defined(lease_expires_at), lease_expires_at > now, not defined(input.lease_nonce)]
              - all: [defined(lease_expires_at), lease_expires_at > now, any: [not defined(lease_nonce), lease_nonce != input.lease_nonce]]
        error: weft.workloads.LeaseHeld
      - name: resized
        when_subject_state: [Created, Stopped]
        updates: weft.workloads.Box
        instance: box_id
        sets:
          size: input.size
        emits: [weft.workloads.BoxResized]
        payload:
          weft.workloads.BoxResized:
            box_id: input.box_id
            size: input.size
      - name: not-stopped
        error: weft.workloads.StateConflict

  # Sketch line 250 "destroyed". A started box is stopped first. Refused under another caller's
  # live lease.
  - name: weft.workloads.DestroyBox
    naming:
      display: Destroy a box
    input:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: lease_nonce, type: Optional<String>}
    outcomes:
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the box's own account acts on it; another account's box
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: leased
        when_subject:
          predicate:
            any:
              - all: [defined(lease_expires_at), lease_expires_at > now, not defined(input.lease_nonce)]
              - all: [defined(lease_expires_at), lease_expires_at > now, any: [not defined(lease_nonce), lease_nonce != input.lease_nonce]]
        error: weft.workloads.LeaseHeld
      - name: destroyed
        moves: weft.workloads.Box.destroy
        instance: box_id
        emits: [weft.workloads.BoxDestroyed]
        payload:
          weft.workloads.BoxDestroyed:
            box_id: input.box_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 251-252: "A lease gives one caller exclusive update rights for a time". The caller
  # chooses the nonce and presents it on every update while the lease lives.
  # OPEN: the longest lease a caller may take. Smallest answer: the caller names the expiry; a lease
  # in the past is refused.
  - name: weft.workloads.AcquireBoxLease
    naming:
      display: Acquire a box lease
    input:
      - {name: box_id, type: weft.shared.BoxId}
      # hardening pass 1 D2: the lease holder is the caller, not a request input.
      - {name: lease_nonce, type: String}
      - {name: expires_at, type: Timestamp}
    outcomes:
      - name: expiry-past
        when: expires_at < now
        error: weft.workloads.DeadlineInPast
      - name: empty-nonce
        when: lease_nonce == ""
        error: weft.workloads.InvalidAmount
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the box's own account acts on it; another account's box
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: held
        when_subject: {predicate: {all: [defined(lease_expires_at), lease_expires_at > now]}}
        error: weft.workloads.LeaseHeld
      - name: acquired
        when_subject_state: [Created, Starting, Started, Stopping, Stopped, Suspended]
        updates: weft.workloads.Box
        instance: box_id
        sets:
          lease_holder: {caller: principal_id}
          lease_nonce: input.lease_nonce
          lease_expires_at: input.expires_at
        emits: [weft.workloads.BoxLeaseAcquired]
        payload:
          weft.workloads.BoxLeaseAcquired:
            box_id: input.box_id
            holder: {caller: principal_id}
            expires_at: input.expires_at
      - name: destroyed
        error: weft.workloads.StateConflict

  # Sketch lines 251-252: the holder gives the lease back.
  - name: weft.workloads.ReleaseBoxLease
    naming:
      display: Release a box lease
    input:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: lease_nonce, type: String}
    outcomes:
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the box's own account acts on it; another account's box
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: not-held
        when_subject:
          predicate:
            any:
              - not defined(lease_nonce)
              - lease_nonce != input.lease_nonce
        error: weft.workloads.LeaseNotHeld
      - name: released
        when_subject_state: [Created, Starting, Started, Stopping, Stopped, Suspended]
        updates: weft.workloads.Box
        instance: box_id
        sets:
          lease_holder: {cleared: true}
          lease_nonce: {cleared: true}
          lease_expires_at: {cleared: true}
        emits: [weft.workloads.BoxLeaseReleased]
        payload:
          weft.workloads.BoxLeaseReleased:
            box_id: input.box_id
      - name: destroyed
        error: weft.workloads.StateConflict

  # Sketch lines 252-253: "cordon takes it out of its endpoint's traffic".
  - name: weft.workloads.CordonBox
    naming:
      display: Cordon a box
    input:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: lease_nonce, type: Optional<String>}
    outcomes:
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the box's own account acts on it; another account's box
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: leased
        when_subject:
          predicate:
            any:
              - all: [defined(lease_expires_at), lease_expires_at > now, not defined(input.lease_nonce)]
              - all: [defined(lease_expires_at), lease_expires_at > now, any: [not defined(lease_nonce), lease_nonce != input.lease_nonce]]
        error: weft.workloads.LeaseHeld
      - name: cordoned
        when_subject_state: [Created, Starting, Started, Stopping, Stopped, Suspended]
        updates: weft.workloads.Box
        instance: box_id
        sets:
          cordoned: true
        emits: [weft.workloads.BoxCordoned]
        payload:
          weft.workloads.BoxCordoned:
            box_id: input.box_id
      - name: destroyed
        error: weft.workloads.StateConflict

  - name: weft.workloads.UncordonBox
    naming:
      display: Uncordon a box
    input:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: lease_nonce, type: Optional<String>}
    outcomes:
      - name: no-such-box
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the box's own account acts on it; another account's box
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: leased
        when_subject:
          predicate:
            any:
              - all: [defined(lease_expires_at), lease_expires_at > now, not defined(input.lease_nonce)]
              - all: [defined(lease_expires_at), lease_expires_at > now, any: [not defined(lease_nonce), lease_nonce != input.lease_nonce]]
        error: weft.workloads.LeaseHeld
      - name: uncordoned
        when_subject_state: [Created, Starting, Started, Stopping, Stopped, Suspended]
        updates: weft.workloads.Box
        instance: box_id
        sets:
          cordoned: false
        emits: [weft.workloads.BoxUncordoned]
        payload:
          weft.workloads.BoxUncordoned:
            box_id: input.box_id
      - name: destroyed
        error: weft.workloads.StateConflict

  # Sketch line 255: a Session of a Session-shaped workload, opened by one principal. A session past
  # a quota is refused by name (outcome group `quota`).
  - name: weft.workloads.OpenSession
    naming:
      display: Open a session
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: kind, type: weft.workloads.SessionKind}
      # hardening pass 1 D2: the session's owner is the caller, not a request input.
    outcomes:
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: not-a-session
        when_related: {via: input.workload_id, predicate: shape != Session}
        error: weft.workloads.ShapeMismatch
      - name: opened
        creates: weft.workloads.Session
        instance: session_id
        sets:
          workload_id: input.workload_id
          kind: input.kind
          principal_id: {caller: principal_id}
          attached: true
        emits: [weft.workloads.SessionOpened]
        payload:
          weft.workloads.SessionOpened:
            session_id: {generated: true}
            workload_id: input.workload_id
            kind: input.kind
            principal_id: {caller: principal_id}

  # Sketch line 255 "attached". The stream itself is protocols/exec-channel.yaml (attach).
  - name: weft.workloads.AttachSession
    naming:
      display: Attach to a session
    input:
      - {name: session_id, type: weft.shared.SessionId}
      # hardening pass 1 D2: the principal is the caller, not a request input.
    outcomes:
      - name: no-such-session
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: not-owner
        when_subject: {predicate: principal_id != caller.principal_id}
        error: weft.workloads.NotSessionOwner
      - name: attached
        when_subject_state: Open
        updates: weft.workloads.Session
        instance: session_id
        sets:
          attached: true
        emits: [weft.workloads.SessionAttached]
        payload:
          weft.workloads.SessionAttached:
            session_id: input.session_id
            principal_id: {caller: principal_id}
      - name: closed
        error: weft.workloads.StateConflict

  - name: weft.workloads.DetachSession
    naming:
      display: Detach from a session
    input:
      - {name: session_id, type: weft.shared.SessionId}
      # hardening pass 1 D2: the principal is the caller, not a request input.
    outcomes:
      - name: no-such-session
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: not-owner
        when_subject: {predicate: principal_id != caller.principal_id}
        error: weft.workloads.NotSessionOwner
      - name: detached
        when_subject_state: Open
        updates: weft.workloads.Session
        instance: session_id
        sets:
          attached: false
        emits: [weft.workloads.SessionDetached]
        payload:
          weft.workloads.SessionDetached:
            session_id: input.session_id
      - name: closed
        error: weft.workloads.StateConflict

  # Sketch line 255. Closed by its owner, or by the control plane after the shape's idle timeout
  # (OPEN on SessionSettings).
  - name: weft.workloads.CloseSession
    naming:
      display: Close a session
    input:
      - {name: session_id, type: weft.shared.SessionId}
    outcomes:
      - name: no-such-session
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D2: "closed by its owner" (comment above); the session holds no account,
      # so its owner is the only tie to the caller. The control plane's idle close has no actor.
      - name: not-owner
        when_subject: {predicate: principal_id != caller.principal_id}
        error: weft.workloads.NotSessionOwner
      - name: closed
        moves: weft.workloads.Session.close
        instance: session_id
        sets:
          attached: false
        emits: [weft.workloads.SessionClosed]
        payload:
          weft.workloads.SessionClosed:
            session_id: input.session_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 257: the live record of a Schedule-shaped workload; one per workload.
  - name: weft.workloads.CreateSchedule
    naming:
      display: Create a schedule
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
    outcomes:
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: not-a-schedule
        when_related: {via: input.workload_id, predicate: shape != Schedule}
        error: weft.workloads.ShapeMismatch
      - name: exists
        when_related:
          entity: weft.workloads.Schedule
          where: workload_id == input.workload_id
          exists: true
        error: weft.workloads.ScheduleExists
      - name: created
        creates: weft.workloads.Schedule
        instance: schedule_id
        sets:
          workload_id: input.workload_id
        emits: [weft.workloads.ScheduleCreated]
        payload:
          weft.workloads.ScheduleCreated:
            schedule_id: {generated: true}
            workload_id: input.workload_id

  # Sketch line 257 "starts an Invocation or Job on a calendar rule": the rule came due. The
  # Invocation or Job is started by Invoke or SubmitJob with this schedule's id.
  # OPEN: which actor reads the calendar. Smallest answer: Scheduler.
  - name: weft.workloads.RecordScheduleFired
    naming:
      display: Record a schedule fired
    input:
      - {name: schedule_id, type: weft.shared.ScheduleId}
      - {name: fired_at, type: Timestamp}
    outcomes:
      - name: no-such-schedule
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: fired
        when_subject_state: Active
        updates: weft.workloads.Schedule
        instance: schedule_id
        sets:
          last_fired_at: input.fired_at
        emits: [weft.workloads.ScheduleFired]
        payload:
          weft.workloads.ScheduleFired:
            schedule_id: input.schedule_id
            fired_at: input.fired_at
      - name: not-active
        error: weft.workloads.StateConflict

  - name: weft.workloads.PauseSchedule
    naming:
      display: Pause a schedule
    input:
      - {name: schedule_id, type: weft.shared.ScheduleId}
    outcomes:
      - name: no-such-schedule
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: paused
        moves: weft.workloads.Schedule.pause
        instance: schedule_id
        emits: [weft.workloads.SchedulePaused]
        payload:
          weft.workloads.SchedulePaused:
            schedule_id: input.schedule_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.ResumeSchedule
    naming:
      display: Resume a schedule
    input:
      - {name: schedule_id, type: weft.shared.ScheduleId}
    outcomes:
      - name: no-such-schedule
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: resumed
        moves: weft.workloads.Schedule.resume
        instance: schedule_id
        emits: [weft.workloads.ScheduleResumed]
        payload:
          weft.workloads.ScheduleResumed:
            schedule_id: input.schedule_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.DeleteSchedule
    naming:
      display: Delete a schedule
    input:
      - {name: schedule_id, type: weft.shared.ScheduleId}
    outcomes:
      - name: no-such-schedule
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: deleted
        moves: weft.workloads.Schedule.delete
        instance: schedule_id
        emits: [weft.workloads.ScheduleDeleted]
        payload:
          weft.workloads.ScheduleDeleted:
            schedule_id: input.schedule_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 259-260: a Trigger of a workload. An HTTP trigger does not make an internal
  # component reachable: its component must already be on the formation's Border (section 3), a
  # fact of the formations domain.
  - name: weft.workloads.CreateTrigger
    naming:
      display: Create a trigger
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: kind, type: weft.workloads.TriggerKind}
      - {name: source, type: String}
    outcomes:
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      # Kept external: the Border is weft.formations.Component.on_border, found by the workload's
      # formation_id and component name; a guard reads a row by an input identity or by a row
      # set over input values, not by two fields of another related row.
      - name: not-on-border
        external: the workload's component is not on its formation's Border
        when: kind == Http
        error: weft.workloads.NotOnBorder
      - name: created
        creates: weft.workloads.Trigger
        instance: trigger_id
        sets:
          workload_id: input.workload_id
          kind: input.kind
          source: input.source
        emits: [weft.workloads.TriggerCreated]
        payload:
          weft.workloads.TriggerCreated:
            trigger_id: {generated: true}
            workload_id: input.workload_id
            kind: input.kind
            source: input.source

  - name: weft.workloads.DisableTrigger
    naming:
      display: Disable a trigger
    input:
      - {name: trigger_id, type: weft.shared.TriggerId}
    outcomes:
      - name: no-such-trigger
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: disabled
        moves: weft.workloads.Trigger.disable
        instance: trigger_id
        emits: [weft.workloads.TriggerDisabled]
        payload:
          weft.workloads.TriggerDisabled:
            trigger_id: input.trigger_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.EnableTrigger
    naming:
      display: Enable a trigger
    input:
      - {name: trigger_id, type: weft.shared.TriggerId}
    outcomes:
      - name: no-such-trigger
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: enabled
        moves: weft.workloads.Trigger.enable
        instance: trigger_id
        emits: [weft.workloads.TriggerEnabled]
        payload:
          weft.workloads.TriggerEnabled:
            trigger_id: input.trigger_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.DeleteTrigger
    naming:
      display: Delete a trigger
    input:
      - {name: trigger_id, type: weft.shared.TriggerId}
    outcomes:
      - name: no-such-trigger
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: deleted
        moves: weft.workloads.Trigger.delete
        instance: trigger_id
        emits: [weft.workloads.TriggerDeleted]
        payload:
          weft.workloads.TriggerDeleted:
            trigger_id: input.trigger_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 260 "freeze" an instance; section 11 line 466 `Snapshot`; lines 284-285 a
  # `suspend` sleep snapshots each instance. Only a running or paused instance is frozen. Storage
  # past a quota is refused by name (outcome group `quota`).
  - name: weft.workloads.TakeSnapshot
    naming:
      display: Take a snapshot
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: no-instance
        when_related: {via: input.instance_id, exists: false}
        error: weft.workloads.NotFound
      - name: not-live
        when_related:
          via: input.instance_id
          predicate:
            state: {none_of: [Running, Paused]}
        error: weft.workloads.StateConflict
      - name: taking
        creates: weft.workloads.Snapshot
        instance: snapshot_id
        sets:
          instance_id: input.instance_id
          workload_id: {related: {via: input.instance_id, field: workload_id}}
          account_id: {related: {via: input.instance_id, field: account_id}}
        emits: [weft.workloads.SnapshotRequested]
        payload:
          weft.workloads.SnapshotRequested:
            snapshot_id: {generated: true}
            instance_id: input.instance_id

  # The node reports the snapshot written as a content-addressed artifact (sketch lines 215-216).
  - name: weft.workloads.RecordSnapshotTaken
    naming:
      display: Record a snapshot taken
    input:
      - {name: snapshot_id, type: weft.shared.SnapshotId}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
    outcomes:
      - name: no-such-snapshot
        unknown_instance: true
        error: weft.workloads.NotFound
      # The artifact the node wrote is a row of weft.artifacts (layer 3), relation `artifact`.
      - name: no-artifact
        when_related: {via: input.artifact_digest, exists: false}
        error: weft.workloads.ArtifactNotFound
      # hardening pass 1 (RecordSnapshotTaken): a node never points a snapshot at another
      # account's artifact, so a restore never reads another account's bytes.
      - name: artifact-foreign
        when_related:
          entity: weft.artifacts.Artifact
          where: {all: [artifact_digest == input.artifact_digest, account_id != subject.account_id]}
          exists: true
        error: weft.workloads.ArtifactForeignAccount
      - name: ready
        moves: weft.workloads.Snapshot.ready
        instance: snapshot_id
        sets:
          artifact_digest: input.artifact_digest
        emits: [weft.workloads.SnapshotReady]
        payload:
          weft.workloads.SnapshotReady:
            snapshot_id: input.snapshot_id
            artifact_digest: input.artifact_digest
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.RecordSnapshotFailed
    naming:
      display: Record a snapshot failed
    input:
      - {name: snapshot_id, type: weft.shared.SnapshotId}
      - {name: failure, type: String}
    outcomes:
      - name: no-such-snapshot
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: failed
        moves: weft.workloads.Snapshot.fail
        instance: snapshot_id
        sets:
          failure: input.failure
        emits: [weft.workloads.SnapshotFailed]
        payload:
          weft.workloads.SnapshotFailed:
            snapshot_id: input.snapshot_id
            failure: input.failure
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 260 "restore an instance"; lines 284-285 a wake restores the snapshot. A new
  # instance of the same workload starts from it; another workload is refused by name. Restoring
  # past a quota is refused by name (outcome group `quota`).
  - name: weft.workloads.RestoreSnapshot
    naming:
      display: Restore a snapshot
    input:
      - {name: snapshot_id, type: weft.shared.SnapshotId}
      - {name: workload_id, type: weft.shared.WorkloadId}
    outcomes:
      - name: no-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      # hardening pass 1 disclosure: a snapshot of another account than the workload's answers
      # like a missing one, and before its state is read.
      - name: snapshot-foreign
        when_related:
          entity: weft.workloads.Snapshot
          where:
            all:
              - snapshot_id == input.snapshot_id
              - not:
                  exists:
                    as: w
                    in: {entity: weft.workloads.Workload}
                    that: {all: [{w.account_id: {eq: {fact: account_id}}}, w.workload_id == input.workload_id]}
          exists: true
        error: weft.workloads.NotFound
      # hardening pass 1 disclosure: the ownership refusal answers before the snapshot's state.
      - name: other-workload
        when_related: {via: input.snapshot_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.SnapshotOtherWorkload
      - name: not-ready
        when_related: {via: input.snapshot_id, predicate: state != Ready}
        error: weft.workloads.SnapshotNotReady
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: restored
        creates: weft.workloads.Instance
        instance: instance_id
        sets:
          workload_id: input.workload_id
          account_id: {related: {via: input.workload_id, field: account_id}}
          artifact_digest: {related: {via: input.workload_id, field: artifact_digest}}
          minimum_isolation: {related: {via: input.workload_id, field: isolation}}
          restored_from: input.snapshot_id
          desired: Run
          ready: false
          health: Unknown
          processes: {related: {via: input.workload_id, field: processes}}
          restart_policy: {related: {via: input.workload_id, field: restart_policy}}
          restarts: 0
          restarts_in_window: 0
        emits: [weft.workloads.SnapshotRestored]
        payload:
          weft.workloads.SnapshotRestored:
            snapshot_id: input.snapshot_id
            instance_id: {generated: true}

  - name: weft.workloads.DeleteSnapshot
    naming:
      display: Delete a snapshot
    input:
      - {name: snapshot_id, type: weft.shared.SnapshotId}
    outcomes:
      - name: no-such-snapshot
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the snapshot's own account acts on it; another account's snapshot
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.workloads.NotFound
      - name: deleted
        moves: weft.workloads.Snapshot.delete
        instance: snapshot_id
        emits: [weft.workloads.SnapshotDeleted]
        payload:
          weft.workloads.SnapshotDeleted:
            snapshot_id: input.snapshot_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch line 260 "WarmPool"; one per workload. A Box is one machine its user owns and a Daemon
  # runs one instance per node, so neither has a pool. A pool past a quota is refused by name
  # (outcome group `quota`).
  # OPEN: whether a warm instance holds its secrets and identity before it serves (section 7 line
  # "a value reaches an instance only at start"). Smallest answer: it starts like any instance, so
  # it holds them.
  - name: weft.workloads.CreateWarmPool
    naming:
      display: Create a warm pool
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: size, type: Integer}
    outcomes:
      - name: negative-size
        when: size < 0
        error: weft.workloads.InvalidAmount
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: no-pool-shape
        when_related:
          via: input.workload_id
          predicate:
            shape: [Box, Daemon]
        error: weft.workloads.ShapeMismatch
      - name: exists
        when_related:
          entity: weft.workloads.WarmPool
          where: {all: ["workload_id == input.workload_id", "state == Active"]}
          exists: true
        error: weft.workloads.WarmPoolExists
      - name: created
        creates: weft.workloads.WarmPool
        instance: warm_pool_id
        sets:
          workload_id: input.workload_id
          size: input.size
        emits: [weft.workloads.WarmPoolCreated]
        payload:
          weft.workloads.WarmPoolCreated:
            warm_pool_id: {generated: true}
            workload_id: input.workload_id
            size: input.size

  - name: weft.workloads.ResizeWarmPool
    naming:
      display: Resize a warm pool
    input:
      - {name: warm_pool_id, type: weft.shared.WarmPoolId}
      - {name: size, type: Integer}
    outcomes:
      - name: negative-size
        when: size < 0
        error: weft.workloads.InvalidAmount
      - name: no-such-pool
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: resized
        when_subject_state: Active
        updates: weft.workloads.WarmPool
        instance: warm_pool_id
        sets:
          size: input.size
        emits: [weft.workloads.WarmPoolResized]
        payload:
          weft.workloads.WarmPoolResized:
            warm_pool_id: input.warm_pool_id
            size: input.size
      - name: deleted
        error: weft.workloads.StateConflict

  - name: weft.workloads.DeleteWarmPool
    naming:
      display: Delete a warm pool
    input:
      - {name: warm_pool_id, type: weft.shared.WarmPoolId}
    outcomes:
      - name: no-such-pool
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: deleted
        moves: weft.workloads.WarmPool.delete
        instance: warm_pool_id
        emits: [weft.workloads.WarmPoolDeleted]
        payload:
          weft.workloads.WarmPoolDeleted:
            warm_pool_id: input.warm_pool_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict
views:
  # Brief focus "Runtime with its minimum isolation".
  - name: weft.workloads.RuntimeList
    source: weft.workloads.Runtime
    consistency: read_your_writes
    fields:
      - {name: runtime_id, type: weft.shared.RuntimeId}
      - {name: name, type: String}
      - {name: version, type: String}
      - {name: package_kinds, type: List<weft.workloads.PackageKind>}
      - {name: minimum_isolation, type: weft.shared.IsolationLevel}
      - {name: state, type: weft.workloads.Runtime.State}

  # Sketch section 4: the workloads of a formation.
  - name: weft.workloads.WorkloadList
    source: weft.workloads.Workload
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
    filter: formation_id == param.formation_id
    fields:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: package_kind, type: weft.workloads.PackageKind}
      - {name: shape, type: weft.workloads.ShapeKind}
      - {name: isolation, type: weft.shared.IsolationLevel}
      - {name: state, type: weft.workloads.Workload.State}

  # Sketch section 4: one workload on all three axes.
  - name: weft.workloads.WorkloadDetail
    source: weft.workloads.Workload
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: formation_revision_id, type: weft.shared.FormationRevisionId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: package_kind, type: weft.workloads.PackageKind}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: runtime_id, type: weft.shared.RuntimeId}
      - {name: isolation, type: weft.shared.IsolationLevel}
      - {name: shape, type: weft.workloads.ShapeKind}
      - {name: settings, type: weft.workloads.ShapeSettings}
      - {name: claims, type: List<weft.workloads.ClaimRequest>}
      - {name: processes, type: List<weft.workloads.Process>}
      - {name: restart_policy, type: weft.workloads.RestartPolicy}
      - {name: state, type: weft.workloads.Workload.State}

  # Sketch line 259: the instances of one workload.
  - name: weft.workloads.InstanceList
    source: weft.workloads.Instance
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: isolation, type: Optional<weft.shared.IsolationLevel>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: desired, type: weft.workloads.DesiredRun}
      - {name: ready, type: Boolean}
      - {name: health, type: weft.workloads.InstanceHealth}
      - {name: restarts, type: Integer}
      - {name: state, type: weft.workloads.Instance.State}

  # Sketch line 259: one instance.
  - name: weft.workloads.InstanceDetail
    source: weft.workloads.Instance
    consistency: read_your_writes
    params:
      - {name: instance_id, type: weft.shared.InstanceId}
    filter: instance_id == param.instance_id
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: minimum_isolation, type: weft.shared.IsolationLevel}
      - {name: isolation, type: Optional<weft.shared.IsolationLevel>}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: job_id, type: Optional<weft.shared.JobId>}
      - {name: task_index, type: Optional<Integer>}
      - {name: invocation_id, type: Optional<weft.shared.InvocationId>}
      - {name: box_id, type: Optional<weft.shared.BoxId>}
      - {name: session_id, type: Optional<weft.shared.SessionId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_counted_out, type: Boolean}
      - {name: warm_pool_id, type: Optional<weft.shared.WarmPoolId>}
      - {name: restored_from, type: Optional<weft.shared.SnapshotId>}
      - {name: desired, type: weft.workloads.DesiredRun}
      - {name: ready, type: Boolean}
      - {name: health, type: weft.workloads.InstanceHealth}
      - {name: processes, type: List<weft.workloads.Process>}
      - {name: restart_policy, type: weft.workloads.RestartPolicy}
      - {name: restarts, type: Integer}
      - {name: restarts_in_window, type: Integer}
      - {name: backoff_seconds, type: Optional<Integer>}
      - {name: exit_code, type: Optional<Integer>}
      - {name: failure_reason, type: Optional<String>}
      - {name: eviction_reason, type: Optional<weft.workloads.EvictionReason>}
      - {name: state, type: weft.workloads.Instance.State}

  # Section 11 lines 466-470: what a node runs. The node agent reads its assignments from here.
  - name: weft.workloads.NodeInstances
    source: weft.workloads.Instance
    consistency: read_your_writes
    params:
      - {name: node_id, type: weft.shared.NodeId}
    filter: node_id == param.node_id
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: isolation, type: Optional<weft.shared.IsolationLevel>}
      - {name: desired, type: weft.workloads.DesiredRun}
      - {name: state, type: weft.workloads.Instance.State}

  # The invariants read restarts and restarts_in_window; the isolation guard reads
  # minimum_isolation and node_id; the health guards read health, processes and restart_policy:
  # this view holds every instance in every state.
  - name: weft.workloads.Instances
    source: weft.workloads.Instance
    consistency: read_your_writes
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: replica_counted_out, type: Boolean}
      - {name: desired, type: weft.workloads.DesiredRun}
      - {name: minimum_isolation, type: weft.shared.IsolationLevel}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: restarts, type: Integer}
      - {name: restarts_in_window, type: Integer}
      - {name: health, type: weft.workloads.InstanceHealth}
      - {name: processes, type: List<weft.workloads.Process>}
      - {name: restart_policy, type: weft.workloads.RestartPolicy}
      - {name: state, type: weft.workloads.Instance.State}

  # Section 14 R6 (line 590), level form: pending instances asked to stop (StopAccountInstances);
  # no node holds them, so the controller withdraws each with StopInstance.
  # OPEN: which actor runs it. Smallest answer: Scheduler, which holds StopInstance's level step
  # for ServicesAboveScale too.
  - name: weft.workloads.PendingStopsToWithdraw
    source: weft.workloads.Instance
    consistency: read_your_writes
    filter:
      all:
        - state == Pending
        - desired == Stop
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: desired, type: weft.workloads.DesiredRun}
      - {name: state, type: weft.workloads.Instance.State}

  # Section 15 "Health": "Readiness gates traffic: an edge route, a link and a service binding
  # forward only to ready instances. A rollout step waits for the new instances to be ready
  # before it ends the old ones." The ready instances of one workload (a Service's workload, the
  # new workload of a rollout step): running and Ready. The edge, links, service bindings and the
  # deployments domain read this view; this domain only provides it.
  - name: weft.workloads.ReadyInstances
    source: weft.workloads.Instance
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter:
      all:
        - workload_id == param.workload_id
        - state == Running
        - health == Ready
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: replica_index, type: Optional<Integer>}

  # Section 15 "Health", read by component: an edge route and a link name a component of a
  # formation in an environment (section 3), not a workload. The ready instances of every
  # workload of that component, through the instance's workload (one hop).
  - name: weft.workloads.ComponentReadyInstances
    source: weft.workloads.Instance
    consistency: read_your_writes
    params:
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
    filter:
      all:
        - workload_id.formation_id == param.formation_id
        - workload_id.environment_id == param.environment_id
        - workload_id.component == param.component
        - state == Running
        - health == Ready
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: replica_index, type: Optional<Integer>}
      - name: component
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: workload_id, field: component}}

  # Sketch lines 246-247 and 292-293: a Service with its ServiceState.
  - name: weft.workloads.ServiceDetail
    source: weft.workloads.Service
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: replicas, type: Integer}
      - {name: running_replicas, type: Integer}
      - {name: backoff_until, type: Optional<Timestamp>}
      - {name: scale_rule, type: weft.workloads.ScaleRule}
      - {name: disruption_budget, type: Optional<weft.workloads.DisruptionBudget>}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: wake_deadline, type: Optional<weft.workloads.WakeDeadline>}
      - {name: sleep_snapshots, type: List<weft.shared.SnapshotId>}
      - {name: state, type: weft.workloads.Service.State}

  # The invariants and the guards read these: every service in every state.
  - name: weft.workloads.Services
    source: weft.workloads.Service
    consistency: read_your_writes
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: replicas, type: Integer}
      - {name: running_replicas, type: Integer}
      - {name: backoff_until, type: Optional<Timestamp>}
      - {name: scale_rule, type: weft.workloads.ScaleRule}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: wake_deadline, type: Optional<weft.workloads.WakeDeadline>}
      - {name: state, type: weft.workloads.Service.State}

  # Section 14 R1 (line 585) and R8 (line 592), level form (lines 595-599): the gap view. Every
  # awake or waking service with fewer live instances than its replica count and no backoff
  # running; the controller runs RequestReplica once per row.
  - name: weft.workloads.ServicesBelowScale
    source: weft.workloads.Service
    consistency: read_your_writes
    filter:
      all:
        - running_replicas < replicas
        - not defined(backoff_until)
        - any: [state == Awake, state == Waking]
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: replicas, type: Integer}
      - {name: running_replicas, type: Integer}
      - {name: state, type: weft.workloads.Service.State}

  # Section 14, level form, the other side of the gap: a service scaled in (ScaleService,
  # AutoscaleService) or draining to sleep (BeginSleep sets its count to 0) holds more live
  # instances than its count. The controller stops one live instance of the row's workload
  # (StopInstance, desired Run in InstanceList) per row; its end lowers the count (R2 edge).
  # OPEN: which instance a scale-in stops (the highest replica index, as a Kubernetes
  # StatefulSet; or the newest). Smallest answer: the highest index.
  - name: weft.workloads.ServicesAboveScale
    source: weft.workloads.Service
    consistency: read_your_writes
    filter: running_replicas > replicas
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: replicas, type: Integer}
      - {name: running_replicas, type: Integer}
      - {name: state, type: weft.workloads.Service.State}

  # Section 14 R2 (line 586), time form (lines 600-602): services whose backoff instant passed;
  # the controller runs EndReplicaBackoff once per row.
  - name: weft.workloads.ServiceBackoffsDue
    source: weft.workloads.Service
    consistency: read_your_writes
    filter:
      all:
        - defined(backoff_until)
        - backoff_until <= now
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: backoff_until, type: Optional<Timestamp>}
      - {name: state, type: weft.workloads.Service.State}

  # Sketch lines 286-289: the wakes of a service and how each ended.
  - name: weft.workloads.WakeList
    source: weft.workloads.Wake
    consistency: read_your_writes
    params:
      - {name: service_id, type: weft.shared.ServiceId}
    filter: service_id == param.service_id
    fields:
      - {name: wake_id, type: weft.shared.WakeId}
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: source, type: weft.workloads.WakeSource}
      - {name: deadline_at, type: Timestamp}
      - {name: failure, type: Optional<weft.workloads.WakeFailure>}
      - {name: state, type: weft.workloads.Wake.State}

  # Section 14 R8 (line 592), time form (lines 600-602): held wakes past their deadline; the
  # controller runs MissWake once per row, whose guard refuses a wake before its deadline.
  - name: weft.workloads.WakesOverdue
    source: weft.workloads.Wake
    consistency: read_your_writes
    filter:
      all:
        - state == Waiting
        - deadline_at < now
    fields:
      - {name: wake_id, type: weft.shared.WakeId}
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: deadline_at, type: Timestamp}
      - {name: state, type: weft.workloads.Wake.State}

  # Sketch line 243: one invocation and its result.
  - name: weft.workloads.InvocationDetail
    source: weft.workloads.Invocation
    consistency: read_your_writes
    params:
      - {name: invocation_id, type: weft.shared.InvocationId}
    filter: invocation_id == param.invocation_id
    fields:
      - {name: invocation_id, type: weft.shared.InvocationId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: deadline_at, type: Timestamp}
      - {name: result, type: Optional<Bytes>}
      - {name: failure, type: Optional<String>}
      - {name: instance_id, type: Optional<weft.shared.InstanceId>}
      - {name: schedule_id, type: Optional<weft.shared.ScheduleId>}
      - {name: trigger_id, type: Optional<weft.shared.TriggerId>}
      - {name: state, type: weft.workloads.Invocation.State}

  # Guards read deadline_at: every invocation in every state.
  - name: weft.workloads.Invocations
    source: weft.workloads.Invocation
    consistency: read_your_writes
    fields:
      - {name: invocation_id, type: weft.shared.InvocationId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: deadline_at, type: Timestamp}
      - {name: state, type: weft.workloads.Invocation.State}

  # Sketch lines 244-245: the jobs of a workload.
  - name: weft.workloads.JobList
    source: weft.workloads.Job
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: job_id, type: weft.shared.JobId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: parallelism, type: Integer}
      - {name: gang, type: Boolean}
      - {name: max_retries, type: Integer}
      - {name: retries_used, type: Integer}
      - {name: succeeded_tasks, type: Integer}
      - {name: outputs, type: List<weft.shared.ArtifactDigest>}
      - {name: failure, type: Optional<String>}
      - {name: schedule_id, type: Optional<weft.shared.ScheduleId>}
      - {name: state, type: weft.workloads.Job.State}

  # Invariants and guards read these: every job in every state.
  - name: weft.workloads.Jobs
    source: weft.workloads.Job
    consistency: read_your_writes
    fields:
      - {name: job_id, type: weft.shared.JobId}
      - {name: parallelism, type: Integer}
      - {name: gang, type: Boolean}
      - {name: max_retries, type: Integer}
      - {name: retries_used, type: Integer}
      - {name: succeeded_tasks, type: Integer}
      - {name: state, type: weft.workloads.Job.State}

  # Sketch lines 248-254: the boxes of an account. The lease nonce is never shown.
  - name: weft.workloads.BoxList
    source: weft.workloads.Box
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter: account_id == param.account_id
    fields:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: size, type: weft.workloads.BoxSize}
      - {name: cordoned, type: Boolean}
      - {name: lease_holder, type: Optional<weft.shared.PrincipalId>}
      - {name: lease_expires_at, type: Optional<Timestamp>}
      - {name: state, type: weft.workloads.Box.State}

  # Sketch lines 248-254: one box. The lease nonce is never shown.
  - name: weft.workloads.BoxDetail
    source: weft.workloads.Box
    consistency: read_your_writes
    params:
      - {name: box_id, type: weft.shared.BoxId}
    filter: box_id == param.box_id
    fields:
      - {name: box_id, type: weft.shared.BoxId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: size, type: weft.workloads.BoxSize}
      - {name: volume_id, type: Optional<weft.shared.VolumeId>}
      - {name: endpoint_id, type: Optional<weft.shared.EndpointId>}
      - {name: instance_id, type: Optional<weft.shared.InstanceId>}
      - {name: cordoned, type: Boolean}
      - {name: lease_holder, type: Optional<weft.shared.PrincipalId>}
      - {name: lease_expires_at, type: Optional<Timestamp>}
      - {name: state, type: weft.workloads.Box.State}

  # Sketch line 255: the sessions of a workload.
  - name: weft.workloads.SessionList
    source: weft.workloads.Session
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: session_id, type: weft.shared.SessionId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: kind, type: weft.workloads.SessionKind}
      - {name: principal_id, type: weft.shared.PrincipalId}
      - {name: attached, type: Boolean}
      - {name: state, type: weft.workloads.Session.State}

  # Sketch line 257: the schedules of a workload.
  - name: weft.workloads.ScheduleList
    source: weft.workloads.Schedule
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: schedule_id, type: weft.shared.ScheduleId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: last_fired_at, type: Optional<Timestamp>}
      - {name: state, type: weft.workloads.Schedule.State}

  # Sketch lines 259-260: the triggers of a workload.
  - name: weft.workloads.TriggerList
    source: weft.workloads.Trigger
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: trigger_id, type: weft.shared.TriggerId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: kind, type: weft.workloads.TriggerKind}
      - {name: source, type: String}
      - {name: state, type: weft.workloads.Trigger.State}

  # Sketch line 260: the snapshots of a workload.
  - name: weft.workloads.SnapshotList
    source: weft.workloads.Snapshot
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: snapshot_id, type: weft.shared.SnapshotId}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: artifact_digest, type: Optional<weft.shared.ArtifactDigest>}
      - {name: failure, type: Optional<String>}
      - {name: state, type: weft.workloads.Snapshot.State}

  # Sketch line 260: the warm pools of a workload.
  - name: weft.workloads.WarmPoolList
    source: weft.workloads.WarmPool
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: warm_pool_id, type: weft.shared.WarmPoolId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: size, type: Integer}
      - {name: state, type: weft.workloads.WarmPool.State}

  # The invariant reads size: every warm pool in every state.
  - name: weft.workloads.WarmPools
    source: weft.workloads.WarmPool
    consistency: read_your_writes
    fields:
      - {name: warm_pool_id, type: weft.shared.WarmPoolId}
      - {name: size, type: Integer}
      - {name: state, type: weft.workloads.WarmPool.State}

outcome_groups:
  # Section 1 line 137 (quotas per account and resource class) and line 11 ("quotas at every
  # level"); "Sleep and wake" lines 297-298: a step past a quota is refused by name and the service
  # stays at its current size. Every command that makes an instance, adds replicas, enlarges a box
  # or a pool, or stores a snapshot asks the account tree's quota (accounts and metering domains).
  - name: quota
    commands:
      - weft.workloads.DefineWorkload
      - weft.workloads.CreateInstance
      - weft.workloads.DefineService
      - weft.workloads.ScaleService
      - weft.workloads.AutoscaleService
      - weft.workloads.StartWaking
      - weft.workloads.Invoke
      - weft.workloads.SubmitJob
      - weft.workloads.CreateBox
      - weft.workloads.StartBox
      - weft.workloads.ResizeBox
      - weft.workloads.OpenSession
      - weft.workloads.TakeSnapshot
      - weft.workloads.RestoreSnapshot
      - weft.workloads.CreateWarmPool
      - weft.workloads.ResizeWarmPool
    outcomes:
      # Kept external: the quota of the account and of every account above it, against the sum of
      # what the step adds; a guard reads one related row and walks no account tree, and compares
      # a row-set count only with a literal (docs/ess-gaps.md 6 and 8).
      - name: over-quota
        external: the step would take the account, or an account above it, past its quota for a resource class
        error: weft.workloads.QuotaExceeded
