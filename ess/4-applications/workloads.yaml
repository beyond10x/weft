# Workloads: the package, shape and claims of one component, and what runs from them: instances,
# invocations, jobs, boxes, sessions, schedules, triggers, snapshots and warm pools. Source:
# docs/domain-sketch.md section "4. Workload (one component)" (lines 205-305), with the isolation
# levels of section "10. Scheduling" (lines 449-460) and the node verbs of section "11. Node
# control" (lines 462-472).
domain: weft.workloads

summary: >-
  The workload of one component on three independent axes (package, shape, claims), the signed
  artifacts and runtimes it runs on, and every running copy of it: instances, invocations, jobs,
  boxes, sessions, schedules, triggers, snapshots and warm pools.

naming:
  wire: weft
  display: Workloads

types:
  # Identifiers of this domain's entities that shared.yaml does not hold (reported to the
  # integrator; local until another domain needs one).

  # Sketch lines 213-239: plain kinds run as they are; spec kinds are translated (section 5).
  - name: weft.workloads.PackageKind
    kind: enum
    variants:
      - Snippet
      - Bundle
      - Wasm
      - Image
      - Process
      - Machine
      - Model
      - Browser
      - Build
      - EssSystem
      - Agent
      # Sketch line 237: "training (later)".
      - Training
      - Graph

  # Sketch lines 241-257: the shapes.
  - name: weft.workloads.ShapeKind
    kind: enum
    variants: [Invocation, Job, Service, Box, Session, Daemon, Schedule]

  # Sketch line 243: "one call, one result, a deadline".
  - name: weft.workloads.InvocationSettings
    kind: struct
    fields:
      - name: deadline
        type: Duration

  # Sketch lines 244-245: "runs to completion, retries, writes outputs. parallelism, gang".
  - name: weft.workloads.JobSettings
    kind: struct
    fields:
      - name: parallelism
        type: Integer
      - name: gang
        type: Boolean
      - name: max_retries
        type: Integer
      - name: backoff
        type: Duration

  # Sketch lines 246-247: "stateful: each replica keeps a stable name and its own volume". The
  # replica count, its ScaleRule and DisruptionBudget are fields of the Workload, so a scale
  # command can change them.
  - name: weft.workloads.ServiceSettings
    kind: struct
    fields:
      - name: stateful
        type: Boolean

  # Sketch lines 248-254: a Box takes package image or machine; its size is what a resize changes.
  - name: weft.workloads.BoxSettings
    kind: struct
    fields:
      - name: size
        type: weft.workloads.BoxSize

  # Sketch line 255: "interactive and attached (terminal, notebook, agent sandbox)".
  - name: weft.workloads.SessionKind
    kind: enum
    variants: [Terminal, Notebook, AgentSandbox]

  - name: weft.workloads.SessionSettings
    kind: struct
    fields:
      - name: kind
        type: weft.workloads.SessionKind
      # OPEN: how long a detached session lives before it is closed. Smallest safe answer: the
      # deployer names it; nothing runs unbounded.
      - name: idle_timeout
        type: Duration

  # Sketch line 256: "one instance per matching node". The match is on node labels.
  # OPEN: what a daemon matches nodes by (labels of the cluster domain's Node or NodePool).
  - name: weft.workloads.DaemonSettings
    kind: struct
    fields:
      - name: node_selector
        type: Map<String, String>

  # Sketch line 257: "starts an Invocation or Job on a calendar rule".
  - name: weft.workloads.ScheduledShape
    kind: enum
    variants: [Invocation, Job]

  - name: weft.workloads.ScheduleSettings
    kind: struct
    fields:
      # OPEN: the syntax of a calendar rule (cron, as a Kubernetes CronJob; or RFC 5545 RRULE).
      - name: calendar
        type: String
      - name: timezone
        type: String
      - name: starts
        type: weft.workloads.ScheduledShape
      - name: invocation
        type: Optional<weft.workloads.InvocationSettings>
      - name: job
        type: Optional<weft.workloads.JobSettings>

  # The settings of the one shape a workload has; the tag is the shape.
  - name: weft.workloads.ShapeSettings
    kind: union
    tag: shape
    variants:
      invocation: weft.workloads.InvocationSettings
      job: weft.workloads.JobSettings
      service: weft.workloads.ServiceSettings
      box: weft.workloads.BoxSettings
      session: weft.workloads.SessionSettings
      daemon: weft.workloads.DaemonSettings
      schedule: weft.workloads.ScheduleSettings

  # Sketch lines 302-305 and section 6 line 395: a claim names a resource class and an amount.
  # The claim's `sharing` (exclusive, shared read-only, shared read-write) is an attribute of
  # section 6, typed `weft.shared.Sharing`. Absent: the class's default sharing.
  - name: weft.workloads.ClaimRequest
    kind: struct
    fields:
      - name: name
        type: String
      - name: class
        type: weft.shared.ResourceClassName
      - name: amount
        type: Integer
      - name: sharing
        type: Optional<weft.shared.Sharing>
      # Sketch line 196: `gpu: { model: nvidia-h100, count: 1 }`: attributes a bound unit must have.
      - name: selector
        type: Map<String, String>

  # Sketch lines 264-266: process roles.
  - name: weft.workloads.ProcessRole
    kind: enum
    variants: [Main, Init, Sidecar]

  # Sketch lines 267-268: check roles and kinds.
  - name: weft.workloads.CheckRole
    kind: enum
    variants: [Startup, Ready, Alive]

  # Section 15 "Health": "kinds HTTP, TCP, command, gRPC".
  - name: weft.workloads.CheckKind
    kind: enum
    variants: [Http, Tcp, Command, Grpc]

  # Section 4 "Inside one instance" (`Check`: "a health probe of a process") and section 15
  # "Health": "period, timeout, initial delay, failure and success thresholds". The node runs the
  # probe: it waits `initial_delay_seconds` after the process starts, then probes every
  # `period_seconds`, each probe ending after `timeout_seconds`. A check changes health only after
  # `failure_threshold` consecutive failures or `success_threshold` consecutive successes.
  # Lengths are whole seconds in an Integer (as `grace_seconds` in scheduling): ESS does not order
  # a Duration, so "positive" is checkable only on a number.
  # What each kind needs (port, path, command) and the bounds below are refused at DefineWorkload
  # by name (`InvalidCheck`). The bounds are invariants of the rows that store a check (Workload,
  # Instance), not of this type: an invariant of the type refuses the input before any branch, so
  # the named answer could never be given (soundness pass 2026-11-26).
  # OPEN: may `timeout_seconds` exceed `period_seconds` (Kubernetes allows it)? Smallest answer:
  # allowed.
  # OPEN: must `success_threshold` be 1 for `startup` and `alive` (Kubernetes requires it)?
  # Smallest answer: not required; the node reads it as written.
  - name: weft.workloads.Check
    kind: struct
    fields:
      - name: role
        type: weft.workloads.CheckRole
      - name: kind
        type: weft.workloads.CheckKind
      # Http, Tcp and Grpc probe this port of the instance.
      - name: port
        type: Optional<Integer>
      # Http: the request path.
      - name: path
        type: Optional<String>
      # Command: run inside the process; exit 0 passes.
      - name: command
        type: Optional<List<String>>
      # Grpc: the service name the gRPC health protocol asks about; absent asks for the server.
      - name: service
        type: Optional<String>
      - name: initial_delay_seconds
        type: Integer
      - name: period_seconds
        type: Integer
      - name: timeout_seconds
        type: Integer
      - name: failure_threshold
        type: Integer
      - name: success_threshold
        type: Integer

  # Section 15 "Health": "Instance health, separate from its run state: unknown -> starting ->
  # ready / not-ready", and "past N restarts in a window the instance is `backing-off`".
  # Held as a field of Instance, not a second lifecycle: an ESS entity has one lifecycle, and a
  # second entity per instance would need its own identity and a create beside CreateInstance.
  # Every command that changes it guards the value it leaves and emits a named event
  # (InstanceHealthStarting, InstanceReady, InstanceNotReady, InstanceBackingOff,
  # InstanceBackoffEnded). An instance that ends (Exited, Failed, Evicted) goes back to Unknown:
  # no node observes it any more, and its run-state event (InstanceExited, InstanceFailed,
  # InstanceEvicted) is the event of that change.
  - name: weft.workloads.InstanceHealth
    kind: enum
    variants:
      - Unknown
      - Starting
      - Ready
      - {name: NotReady, wire: not-ready}
      - {name: BackingOff, wire: backing-off}

  # Sketch lines 264-266: "an instance runs one or more processes that share its network and
  # volumes". Environment values here are non-secret; a secret reaches a process only through a
  # grant of the secrets domain (section 7), never through this map.
  - name: weft.workloads.Process
    kind: struct
    fields:
      - name: name
        type: String
      - name: role
        type: weft.workloads.ProcessRole
      # Absent: the workload's own package. A Kubernetes Pod's containers each name an image.
      - name: artifact_digest
        type: Optional<weft.shared.ArtifactDigest>
      - name: command
        type: List<String>
      - name: environment
        type: Map<String, String>
      - name: checks
        type: List<weft.workloads.Check>

  # Sketch line 269: "never, on failure, always; with a backoff".
  - name: weft.workloads.RestartMode
    kind: enum
    variants: [Never, OnFailure, Always]

  # Section 4 and section 15: why the node restarted a process: it ended (under OnFailure or
  # Always), or its startup or alive check failed past its threshold.
  - name: weft.workloads.RestartReason
    kind: enum
    variants: [Exited, StartupCheckFailed, AliveCheckFailed]

  # Section 15 "Health": "Restart backoff: exponential with a cap; past N restarts in a window the
  # instance is `backing-off`". The node waits `backoff_initial_seconds` before the first restart
  # and doubles the wait for each further restart in the window, never past
  # `backoff_max_seconds`. More than `backoff_limit` restarts within `backoff_window_seconds`
  # puts the instance in `BackingOff`.
  # OPEN: the factor of "exponential" is not named. Smallest answer: 2 (Kubernetes), fixed.
  # OPEN: defaults of N and the window are not named. Kubernetes: 10 s initial, 300 s cap; the
  # translator or CLI fills them in.
  # The bounds are refused at DefineWorkload by name (`InvalidRestartPolicy`) and are invariants
  # of the rows that store a policy (Workload, Instance), not of this type (see Check).
  - name: weft.workloads.RestartPolicy
    kind: struct
    fields:
      - name: mode
        type: weft.workloads.RestartMode
      - name: backoff_initial_seconds
        type: Integer
      - name: backoff_max_seconds
        type: Integer
      - name: backoff_limit
        type: Integer
      - name: backoff_window_seconds
        type: Integer

  # Sketch lines 270-271: "the metric that moves them (CPU, requests, queue length)".
  - name: weft.workloads.ScaleMetric
    kind: enum
    variants: [Cpu, Requests, QueueLength]

  - name: weft.workloads.ScaleRule
    kind: struct
    fields:
      - name: min_replicas
        type: Integer
      - name: max_replicas
        type: Integer
      - name: metric
        type: weft.workloads.ScaleMetric
      - name: target
        type: Integer

  # Sketch lines 299-300: "at most N replicas down at once for a drain or a rollout".
  - name: weft.workloads.DisruptionBudget
    kind: struct
    fields:
      - name: max_unavailable
        type: Integer

  # The size a Box runs at (sketch line 251 "resizes it"; Fly Machines `guest`).
  - name: weft.workloads.BoxSize
    kind: struct
    fields:
      - name: cpus
        type: Integer
      - name: memory_mib
        type: Integer
      - name: gpus
        type: Integer

  # Why an instance left a node against its will (section 10 line 454 preemption; section 9 line
  # 444 draining).
  - name: weft.workloads.EvictionReason
    kind: enum
    variants: [Preemption, Drain, NodeLost]

  # What the owner asked of an instance; the node reports what it observed (section 11 line 470).
  - name: weft.workloads.DesiredRun
    kind: enum
    variants: [Run, Pause, Stop]

  # Sketch lines 259-260: Trigger. OPEN: the sketch names Trigger without its kinds. Smallest answer:
  # an HTTP route, a queue, an event of another component, a manual call.
  - name: weft.workloads.TriggerKind
    kind: enum
    variants: [Http, Queue, Event, Manual]

  # Sketch "Sleep and wake", lines 281-285: the SleepPolicy (idle time, sleep kind `Stop` or
  # `Suspend`) is `weft.shared.SleepPolicy`. The WakeDeadline is not part of it (line 288 names it
  # beside the policy); a Service holds it as its own field.

  # Sketch lines 286-289: "The caller waits up to a WakeDeadline".
  - name: weft.workloads.WakeDeadline
    kind: newtype
    of: Duration

  # Sketch lines 286-291: the edge (`weft-edge`) or a link holds the first request; a queue
  # message, a schedule or an explicit `weft wake` also wake.
  - name: weft.workloads.WakeSource
    kind: enum
    variants: [EdgeRequest, LinkRequest, QueueMessage, Schedule, Explicit]

  # Sketch lines 288-289: "past it, the request fails with a named answer, never silence".
  - name: weft.workloads.WakeFailure
    kind: enum
    variants: [DeadlineMissed]
entities:
  # Focus of this domain's brief: a runtime runs some package kinds and has a minimum isolation
  # (section 10 lines 456-458: "A workload's minimum is never weakened"). Sketch line 224 "a
  # serving runtime", line 235 "an agent runtime".
  - name: weft.workloads.Runtime
    naming:
      summary: What runs packages of some kinds on a node, and the weakest isolation it may run under.
    identity:
      name: runtime_id
      type: weft.shared.RuntimeId
    fields:
      - name: name
        type: String
      - name: version
        type: String
      - name: package_kinds
        type: List<weft.workloads.PackageKind>
      - name: minimum_isolation
        type: weft.shared.IsolationLevel
    lifecycle:
      initial: Registered
      states: [Registered, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Registered]
          to: Retired


  # Sketch lines 205-211: "Three independent axes: Package, Shape, Claims", for one component (section
  # 3 line 164). One Workload is one component of one formation revision applied to one
  # environment.
  # OPEN: whether a workload belongs to a FormationRevision (immutable) or to the live release of an
  # environment. Smallest answer: both identifiers are stored; a new revision defines a new
  # workload and retires the old one.
  - name: weft.workloads.Workload
    naming:
      summary: The package, shape and claims of one component, and how its instances run.
    identity:
      name: workload_id
      type: weft.shared.WorkloadId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: formation_id
        type: weft.shared.FormationId
      - name: formation_revision_id
        type: weft.shared.FormationRevisionId
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: component
        type: weft.shared.ComponentName
      # Axis 1, Package (sketch lines 213-226): a plain kind only. A spec kind is translated into
      # plain components before anything here holds it (sketch lines 230-231).
      - name: package_kind
        type: weft.workloads.PackageKind
      - name: artifact_digest
        type: weft.shared.ArtifactDigest
      - name: runtime_id
        type: weft.shared.RuntimeId
      # The workload's own minimum isolation: at least its runtime's, never weakened (section 10
      # lines 456-458).
      - name: isolation
        type: weft.shared.IsolationLevel
      # Axis 2, Shape (sketch lines 241-257).
      - name: shape
        type: weft.workloads.ShapeKind
      - name: settings
        type: weft.workloads.ShapeSettings
      # Axis 3, Claims (sketch lines 302-305): by reference to resource classes of section 6.
      - name: claims
        type: List<weft.workloads.ClaimRequest>
      # Sketch lines 262-272 and 299-300: inside one instance.
      - name: processes
        type: List<weft.workloads.Process>
      - name: restart_policy
        type: weft.workloads.RestartPolicy
      # Section 10 line 459 ("`Priority` and `Preemption`"); docs/open-questions.md "workloads
      # loops" (wave 4, decided): the workload names its priority class, given at definition, and
      # weft.workloads.InstanceCreated carries it to the scheduler. The class is
      # weft.infrastructure.PriorityClass (layer 1; moved there in integration 2026-11-26), relation
      # `priority_class` below. weft.scheduling.SubmitSchedulingRequest refuses an unknown or
      # retired one.
      # OPEN: DefineWorkload does not check the class yet; a guard on `input.priority` (unknown,
      # retired) would refuse it at definition instead of at the first instance.
      - name: priority
        type: weft.shared.PriorityClassName
    relations:
      - name: runtime
        kind: references
        target: weft.workloads.Runtime
        cardinality: one
        via: runtime_id
      - name: priority_class
        kind: references
        target: weft.infrastructure.PriorityClass
        cardinality: one
        via: priority
      - name: account
        kind: references
        target: weft.accounts.Account
        cardinality: one
        via: account_id
      - name: formation
        kind: references
        target: weft.formations.Formation
        cardinality: one
        via: formation_id
      - name: formation_revision
        kind: references
        target: weft.formations.FormationRevision
        cardinality: one
        via: formation_revision_id
      - name: environment
        kind: references
        target: weft.formations.Environment
        cardinality: one
        via: environment_id
      - name: artifact
        kind: references
        target: weft.artifacts.Artifact
        cardinality: one
        via: artifact_digest
    # Section 15 "Health": the bounds of a check and of the restart backoff, refused at
    # DefineWorkload by name (InvalidCheck, InvalidRestartPolicy).
    invariants:
      - restart_policy.backoff_initial_seconds >= 1
      - restart_policy.backoff_max_seconds >= restart_policy.backoff_initial_seconds
      - restart_policy.backoff_limit >= 1
      - restart_policy.backoff_window_seconds >= 1
      - not:
          exists:
            in: processes
            as: p
            that:
              exists:
                in: p.checks
                as: c
                that:
                  any:
                    - c.initial_delay_seconds < 0
                    - c.period_seconds < 1
                    - c.timeout_seconds < 1
                    - c.failure_threshold < 1
                    - c.success_threshold < 1
    lifecycle:
      initial: Defined
      states: [Defined, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Defined]
          to: Retired

  # Sketch line 259: "Instance (one running copy on one node)". States: pending, scheduled,
  # starting, running, paused, exited, failed, evicted (brief focus of this domain; section 10
  # line 454 preemption, section 11 lines 466-471 the node's verbs and observations). The node
  # reports what it observed (line 470): every move past Scheduled is a NodeAgent observation.
  - name: weft.workloads.Instance
    naming:
      summary: One running copy of a workload on one node.
    identity:
      name: instance_id
      type: weft.shared.InstanceId
    fields:
      - name: workload_id
        type: weft.shared.WorkloadId
      - name: account_id
        type: weft.shared.AccountId
      - name: artifact_digest
        type: weft.shared.ArtifactDigest
      # Copied from the workload at create; no command lowers it (section 10 lines 456-458).
      - name: minimum_isolation
        type: weft.shared.IsolationLevel
      # The isolation the node runs it under, set when it is scheduled.
      - name: isolation
        type: Optional<weft.shared.IsolationLevel>
      - name: node_id
        type: Optional<weft.shared.NodeId>
      # What made this instance: at most one of these is present.
      - name: job_id
        type: Optional<weft.shared.JobId>
      - name: task_index
        type: Optional<Integer>
      - name: invocation_id
        type: Optional<weft.shared.InvocationId>
      - name: box_id
        type: Optional<weft.shared.BoxId>
      - name: session_id
        type: Optional<weft.shared.SessionId>
      # Sketch line 247: a stateful Service replica keeps a stable name.
      - name: replica_index
        type: Optional<Integer>
      # Section 14 R1 (line 585): the Service whose replica this is; its live count holds this
      # instance until RecordReplicaEnded counts it out (`replica_counted_out`).
      - name: service_id
        type: Optional<weft.shared.ServiceId>
      - name: replica_counted_out
        type: Boolean
      - name: warm_pool_id
        type: Optional<weft.shared.WarmPoolId>
      # Sketch line 260: "Snapshot (freeze and restore an instance)".
      - name: restored_from
        type: Optional<weft.shared.SnapshotId>
      - name: desired
        type: weft.workloads.DesiredRun
      # Section 4 "Inside one instance": `ready` (gets traffic). True exactly when `health` is
      # Ready; kept beside it for the views that read it.
      - name: ready
        type: Boolean
      # Section 15 "Health": "Instance health, separate from its run state". Unknown at create.
      - name: health
        type: weft.workloads.InstanceHealth
      # Copied from the workload at create, as minimum_isolation is: the check and restart guards
      # read the thresholds and the backoff from the instance's own row.
      - name: processes
        type: List<weft.workloads.Process>
      - name: restart_policy
        type: weft.workloads.RestartPolicy
      # Section 4: process restarts under the RestartPolicy, counted over the instance's life.
      - name: restarts
        type: Integer
      # Section 15: restarts within the policy's window, as the node counted them at the last
      # restart (a window is a span of time; ESS orders no Duration, so the node counts it).
      - name: restarts_in_window
        type: Integer
      # Section 15: the wait before the last restart, exponential with a cap.
      - name: backoff_seconds
        type: Optional<Integer>
      - name: exit_code
        type: Optional<Integer>
      - name: failure_reason
        type: Optional<String>
      - name: eviction_reason
        type: Optional<weft.workloads.EvictionReason>
    # No command of this domain deletes an instance or the record that made it; each stands on its
    # own as history, so every link is `references`.
    # OPEN: whether a Job, Box, Session or WarmPool owns its instances (a delete of the owner takes
    # them) is not said; no source here settles owns against references.
    relations:
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
      - name: job
        kind: references
        target: weft.workloads.Job
        cardinality: one
        via: job_id
      - name: invocation
        kind: references
        target: weft.workloads.Invocation
        cardinality: one
        via: invocation_id
      - name: box
        kind: references
        target: weft.workloads.Box
        cardinality: one
        via: box_id
      - name: session
        kind: references
        target: weft.workloads.Session
        cardinality: one
        via: session_id
      - name: warm_pool
        kind: references
        target: weft.workloads.WarmPool
        cardinality: one
        via: warm_pool_id
      - name: service
        kind: references
        target: weft.workloads.Service
        cardinality: one
        via: service_id
      - name: snapshot
        kind: references
        target: weft.workloads.Snapshot
        cardinality: one
        via: restored_from
      - name: account
        kind: references
        target: weft.accounts.Account
        cardinality: one
        via: account_id
      - name: artifact
        kind: references
        target: weft.artifacts.Artifact
        cardinality: one
        via: artifact_digest
      # The node the instance is scheduled on (section 11 line 470); absent while pending.
      - name: node
        kind: references
        target: weft.infrastructure.Node
        cardinality: one
        via: node_id
    invariants:
      - restarts >= 0
      - restarts_in_window >= 0
      - restarts_in_window <= restarts
      # The bounds of the copied checks and restart backoff, as on Workload.
      - restart_policy.backoff_initial_seconds >= 1
      - restart_policy.backoff_max_seconds >= restart_policy.backoff_initial_seconds
      - restart_policy.backoff_limit >= 1
      - restart_policy.backoff_window_seconds >= 1
      - not:
          exists:
            in: processes
            as: p
            that:
              exists:
                in: p.checks
                as: c
                that:
                  any:
                    - c.initial_delay_seconds < 0
                    - c.period_seconds < 1
                    - c.timeout_seconds < 1
                    - c.failure_threshold < 1
                    - c.success_threshold < 1
      # Section 15: `ready` (gets traffic) holds exactly when health is Ready.
      - any:
          - all: [ready == true, health == Ready]
          - all: [ready == false, health != Ready]
    lifecycle:
      initial: Pending
      states: [Pending, Scheduled, Starting, Running, Paused, Exited, Failed, Evicted]
      terminal: [Exited, Failed, Evicted]
      transitions:
        - name: schedule
          from: [Pending]
          to: Scheduled
        - name: start
          from: [Scheduled]
          to: Starting
          summary: The node verified the artifact's signature and starts the processes.
        - name: run
          from: [Starting]
          to: Running
          summary: Every startup check passed.
        - name: pause
          from: [Running]
          to: Paused
        - name: resume
          from: [Paused]
          to: Running
        - name: exit
          from: [Starting, Running, Paused]
          to: Exited
        - name: withdraw
          from: [Pending]
          to: Exited
          summary: Stopped before any node held it.
        - name: fail
          from: [Scheduled, Starting, Running, Paused]
          to: Failed
        - name: evict
          from: [Scheduled, Starting, Running, Paused]
          to: Evicted

  # Sketch line 246: "Service: long-running, N replicas, scales between bounds", with its ScaleRule
  # (lines 270-272), DisruptionBudget (lines 299-300) and SleepPolicy (lines 281-285). Its
  # lifecycle is the sketch's `ServiceState` (lines 292-293): asleep, waking, awake,
  # draining-to-sleep. A Service that never sleeps stays Awake.
  - name: weft.workloads.Service
    naming:
      summary: The live replica count of a Service-shaped workload, its scale bounds and its sleep.
    identity:
      name: service_id
      type: weft.shared.ServiceId
    fields:
      - name: workload_id
        type: weft.shared.WorkloadId
      # Copied from the workload at define, so a command can select an account's services
      # (section 14 R6, line 590) without a second hop.
      - name: account_id
        type: weft.shared.AccountId
      # Desired state (section 14 lines 573-574, a `ScaleSetting`): the replica count a user, a
      # release or the autoscaler wrote.
      - name: replicas
        type: Integer
      # Observed state kept on the same row (section 14 lines 595-597, level form): the instances
      # of this service that were requested and have not ended (Pending through Paused). Raised by
      # RequestReplica, lowered by RecordReplicaEnded. A create carries no set effect and a set
      # effect carries no increment (ESS-COMMAND-009, probed on ess 0.99.2), so CreateInstance and
      # the instance-end commands cannot keep it themselves; the two Service commands do, by edge.
      - name: running_replicas
        type: Integer
      # Section 15 "Restart backoff" and section 14 R2 (line 586, "with backoff"): no replacement
      # replica is requested before this instant. Present while the service backs off.
      - name: backoff_until
        type: Optional<Timestamp>
      - name: scale_rule
        type: weft.workloads.ScaleRule
      - name: disruption_budget
        type: Optional<weft.workloads.DisruptionBudget>
      # Sketch line 281: present exactly when the ScaleRule allows `min: 0`.
      - name: sleep_policy
        type: Optional<weft.shared.SleepPolicy>
      # Sketch lines 286-289: how long a caller waits for a wake; set with the SleepPolicy.
      - name: wake_deadline
        type: Optional<weft.workloads.WakeDeadline>
      # Sketch lines 284-285: what a `suspend` sleep took; the next wake restores it.
      - name: sleep_snapshots
        type: List<weft.shared.SnapshotId>
    relations:
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
      - name: sleep_snapshot_records
        kind: references
        target: weft.workloads.Snapshot
        cardinality: many
        via: sleep_snapshots
      - name: account
        kind: references
        target: weft.accounts.Account
        cardinality: one
        via: account_id
    invariants:
      - replicas >= 0
      - running_replicas >= 0
    lifecycle:
      initial: Awake
      states:
        - Awake
        - {name: DrainingToSleep, wire: draining-to-sleep}
        - Asleep
        - Waking
        - Retired
      terminal: [Retired]
      transitions:
        - name: begin_sleep
          from: [Awake]
          to: DrainingToSleep
          summary: No request arrived for the SleepPolicy's idle time; instances drain.
        - name: sleep
          from: [DrainingToSleep]
          to: Asleep
          summary: Every instance ended or was snapshotted; compute meters read zero.
        - name: cancel_sleep
          from: [DrainingToSleep]
          to: Awake
          summary: A wake arrived while the instances drained.
        - name: wake
          from: [Asleep]
          to: Waking
        - name: awaken
          from: [Waking]
          to: Awake
          summary: An instance is ready; held requests are forwarded.
        - name: retire
          from: [Awake, DrainingToSleep, Asleep, Waking]
          to: Retired

  # Sketch lines 286-291: one wake of a Service. Every wake ends Served or Missed: a request held
  # past its WakeDeadline fails with a named answer, never silence (lines 288-289).
  - name: weft.workloads.Wake
    naming:
      summary: One request to wake a sleeping Service, held until an instance is ready or its deadline passes.
    identity:
      name: wake_id
      type: weft.shared.WakeId
    fields:
      - name: service_id
        type: weft.shared.ServiceId
      - name: source
        type: weft.workloads.WakeSource
      # The instant the caller stops waiting: the time of the wake plus the WakeDeadline.
      - name: deadline_at
        type: Timestamp
      - name: failure
        type: Optional<weft.workloads.WakeFailure>
    relations:
      - name: service
        kind: references
        target: weft.workloads.Service
        cardinality: one
        via: service_id
    lifecycle:
      initial: Waiting
      states: [Waiting, Served, Missed]
      terminal: [Served, Missed]
      transitions:
        - name: serve
          from: [Waiting]
          to: Served
        - name: miss
          from: [Waiting]
          to: Missed

  # Sketch line 243: "Invocation: one call, one result, a deadline".
  - name: weft.workloads.Invocation
    naming:
      summary: One call of a workload with one result, answered before its deadline or timed out.
    identity:
      name: invocation_id
      type: weft.shared.InvocationId
    fields:
      - name: workload_id
        type: weft.shared.WorkloadId
      - name: deadline_at
        type: Timestamp
      # OPEN: how large a request and a result may be, and whether a large one travels as an
      # artifact. Smallest answer: bytes inline, bounded by the API.
      - name: request
        type: Bytes
      - name: result
        type: Optional<Bytes>
      - name: failure
        type: Optional<String>
      - name: instance_id
        type: Optional<weft.shared.InstanceId>
      - name: schedule_id
        type: Optional<weft.shared.ScheduleId>
      - name: trigger_id
        type: Optional<weft.shared.TriggerId>
    relations:
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
      - name: instance
        kind: references
        target: weft.workloads.Instance
        cardinality: one
        via: instance_id
      - name: schedule
        kind: references
        target: weft.workloads.Schedule
        cardinality: one
        via: schedule_id
      - name: trigger
        kind: references
        target: weft.workloads.Trigger
        cardinality: one
        via: trigger_id
    lifecycle:
      initial: Accepted
      states: [Accepted, Running, Succeeded, Failed, TimedOut]
      terminal: [Succeeded, Failed, TimedOut]
      transitions:
        - name: start
          from: [Accepted]
          to: Running
        - name: succeed
          from: [Running]
          to: Succeeded
        - name: fail
          from: [Running]
          to: Failed
        - name: time_out
          from: [Accepted, Running]
          to: TimedOut

  # Sketch lines 244-245: "Job: runs to completion, retries, writes outputs. parallelism (array of
  # N tasks), gang (all N start together or none)". Section 10 line 453: "Gang: all tasks of a gang
  # bound, or none". Line 237-238: a training package becomes a gang Job on GPUs.
  - name: weft.workloads.Job
    naming:
      summary: A run to completion of N tasks of a workload, with retries and output artifacts.
    identity:
      name: job_id
      type: weft.shared.JobId
    fields:
      - name: workload_id
        type: weft.shared.WorkloadId
      - name: parallelism
        type: Integer
      - name: gang
        type: Boolean
      - name: max_retries
        type: Integer
      - name: retries_used
        type: Integer
      - name: succeeded_tasks
        type: Integer
      - name: outputs
        type: List<weft.shared.ArtifactDigest>
      - name: failure
        type: Optional<String>
      - name: schedule_id
        type: Optional<weft.shared.ScheduleId>
    relations:
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
      - name: schedule
        kind: references
        target: weft.workloads.Schedule
        cardinality: one
        via: schedule_id
      # Sketch line 244 "writes outputs": the artifacts the job wrote.
      - name: output_artifacts
        kind: references
        target: weft.artifacts.Artifact
        cardinality: many
        via: outputs
    invariants:
      - parallelism >= 1
      - max_retries >= 0
      - retries_used >= 0
      - succeeded_tasks >= 0
    lifecycle:
      initial: Pending
      states: [Pending, Running, Succeeded, Failed, Cancelled]
      terminal: [Succeeded, Failed, Cancelled]
      transitions:
        - name: start
          from: [Pending]
          to: Running
        - name: succeed
          from: [Running]
          to: Succeeded
        - name: fail
          from: [Running]
          to: Failed
        - name: cancel
          from: [Pending, Running]
          to: Cancelled

  # Sketch lines 248-254: "Box: one virtual machine the user owns, like a Fly Machine. Package image
  # or machine. Lifecycle: created, starting, started, stopping, stopped, suspended, destroyed. The
  # user starts, stops, suspends, execs into it and resizes it. Its volume stays across stops. A
  # lease gives one caller exclusive update rights for a time; cordon takes it out of its
  # endpoint's traffic." A Box is a virtual machine, so it runs under MicroVm only.
  - name: weft.workloads.Box
    naming:
      summary: One virtual machine a user owns, started, stopped, suspended and resized on request.
    identity:
      name: box_id
      type: weft.shared.BoxId
    fields:
      - name: workload_id
        type: weft.shared.WorkloadId
      - name: account_id
        type: weft.shared.AccountId
      - name: size
        type: weft.workloads.BoxSize
      # Sketch line 251: "Its volume stays across stops".
      - name: volume_id
        type: Optional<weft.shared.VolumeId>
      - name: endpoint_id
        type: Optional<weft.shared.EndpointId>
      # The instance that runs the box while it is starting, started or stopping.
      - name: instance_id
        type: Optional<weft.shared.InstanceId>
      - name: cordoned
        type: Boolean
      # Sketch lines 251-252: the lease. The nonce is chosen by the caller that acquires it and is
      # never shown by a view.
      - name: lease_holder
        type: Optional<weft.shared.PrincipalId>
      - name: lease_nonce
        type: Optional<String>
      - name: lease_expires_at
        type: Optional<Timestamp>
    relations:
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
      - name: instance
        kind: references
        target: weft.workloads.Instance
        cardinality: one
        via: instance_id
      - name: account
        kind: references
        target: weft.accounts.Account
        cardinality: one
        via: account_id
      # Sketch line 251: "Its volume stays across stops". OPEN: whether destroying the box deletes
      # its volume (owns) is not said; references until decided.
      - name: volume
        kind: references
        target: weft.resources.Volume
        cardinality: one
        via: volume_id
      - name: endpoint
        kind: references
        target: weft.formations.Endpoint
        cardinality: one
        via: endpoint_id
      - name: lease_principal
        kind: references
        target: weft.accounts.Principal
        cardinality: one
        via: lease_holder
    lifecycle:
      initial: Created
      states: [Created, Starting, Started, Stopping, Stopped, Suspended, Destroyed]
      terminal: [Destroyed]
      transitions:
        - name: start
          from: [Created, Stopped, Suspended]
          to: Starting
        - name: started
          from: [Starting]
          to: Started
        - name: stop
          from: [Started]
          to: Stopping
        - name: stopped
          from: [Starting, Stopping]
          to: Stopped
        # OPEN: the sketch names no "suspending" state (Fly Machines has one). Smallest answer: the
        # record moves at the request; the node suspends the instance.
        - name: suspend
          from: [Started]
          to: Suspended
        - name: destroy
          from: [Created, Stopped, Suspended]
          to: Destroyed

  # Sketch line 255: "Session: interactive and attached (terminal, notebook, agent sandbox)".
  - name: weft.workloads.Session
    naming:
      summary: An interactive workload a principal attaches to and detaches from.
    identity:
      name: session_id
      type: weft.shared.SessionId
    fields:
      - name: workload_id
        type: weft.shared.WorkloadId
      - name: kind
        type: weft.workloads.SessionKind
      # The principal that opened it; only it attaches.
      - name: principal_id
        type: weft.shared.PrincipalId
      - name: attached
        type: Boolean
    relations:
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
      - name: principal
        kind: references
        target: weft.accounts.Principal
        cardinality: one
        via: principal_id
    lifecycle:
      initial: Open
      states: [Open, Closed]
      terminal: [Closed]
      transitions:
        - name: close
          from: [Open]
          to: Closed

  # Sketch line 257: "Schedule: starts an Invocation or Job on a calendar rule". The rule is the
  # workload's ScheduleSettings; this record is its live state.
  - name: weft.workloads.Schedule
    naming:
      summary: The live state of a Schedule-shaped workload (active or paused) and when it last fired.
    identity:
      name: schedule_id
      type: weft.shared.ScheduleId
    fields:
      - name: workload_id
        type: weft.shared.WorkloadId
      - name: last_fired_at
        type: Optional<Timestamp>
    relations:
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
    lifecycle:
      initial: Active
      states: [Active, Paused, Deleted]
      terminal: [Deleted]
      transitions:
        - name: pause
          from: [Active]
          to: Paused
        - name: resume
          from: [Paused]
          to: Active
        - name: delete
          from: [Active, Paused]
          to: Deleted

  # Sketch lines 259-260: "Shared by all shapes: Trigger".
  - name: weft.workloads.Trigger
    naming:
      summary: What starts work of a workload from outside it (a route, a queue, an event, a manual call).
    identity:
      name: trigger_id
      type: weft.shared.TriggerId
    fields:
      - name: workload_id
        type: weft.shared.WorkloadId
      - name: kind
        type: weft.workloads.TriggerKind
      # The route, queue or event name the trigger listens on.
      - name: source
        type: String
    relations:
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
    lifecycle:
      initial: Enabled
      states: [Enabled, Disabled, Deleted]
      terminal: [Deleted]
      transitions:
        - name: disable
          from: [Enabled]
          to: Disabled
        - name: enable
          from: [Disabled]
          to: Enabled
        - name: delete
          from: [Enabled, Disabled]
          to: Deleted

  # Sketch line 260: "Snapshot (freeze and restore an instance)"; section 11 line 466 `Snapshot`.
  # A snapshot holds the instance's memory, and with it what was delivered to it (section 7): it
  # restores only into its own workload.
  - name: weft.workloads.Snapshot
    naming:
      summary: A frozen copy of one instance, restorable into a new instance of the same workload.
    identity:
      name: snapshot_id
      type: weft.shared.SnapshotId
    fields:
      - name: instance_id
        type: weft.shared.InstanceId
      - name: workload_id
        type: weft.shared.WorkloadId
      - name: account_id
        type: weft.shared.AccountId
      - name: artifact_digest
        type: Optional<weft.shared.ArtifactDigest>
      - name: failure
        type: Optional<String>
    relations:
      - name: instance
        kind: references
        target: weft.workloads.Instance
        cardinality: one
        via: instance_id
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
      - name: account
        kind: references
        target: weft.accounts.Account
        cardinality: one
        via: account_id
      - name: artifact
        kind: references
        target: weft.artifacts.Artifact
        cardinality: one
        via: artifact_digest
    lifecycle:
      initial: Taking
      states: [Taking, Ready, Failed, Deleted]
      terminal: [Failed, Deleted]
      transitions:
        - name: ready
          from: [Taking]
          to: Ready
        - name: fail
          from: [Taking]
          to: Failed
        - name: delete
          from: [Ready]
          to: Deleted

  # Sketch line 260: "WarmPool": instances started ahead of demand. A warm instance belongs to one
  # workload and serves no other.
  - name: weft.workloads.WarmPool
    naming:
      summary: Instances of one workload kept started ahead of demand.
    identity:
      name: warm_pool_id
      type: weft.shared.WarmPoolId
    fields:
      - name: workload_id
        type: weft.shared.WorkloadId
      - name: size
        type: Integer
    relations:
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
    invariants:
      - size >= 0
    lifecycle:
      initial: Active
      states: [Active, Deleted]
      terminal: [Deleted]
      transitions:
        - name: delete
          from: [Active]
          to: Deleted
errors:
  - name: weft.workloads.NotFound
    summary: The addressed record does not exist, and nothing changed.
  - name: weft.workloads.StateConflict
    summary: The addressed record is not in a state this command acts from, and nothing changed.
  - name: weft.workloads.InvalidAmount
    summary: A count, size or bound is out of range (not positive, or a minimum above its maximum).
  # The artifact refusals below answer for facts the artifacts domain holds (weft.artifacts).
  - name: weft.workloads.ArtifactNotFound
    summary: No artifact with this digest is registered.
  - name: weft.workloads.ArtifactIsRevoked
    summary: The artifact was revoked; nothing new runs from it.
  - name: weft.workloads.ArtifactForeignAccount
    summary: The artifact belongs to another account; nothing crosses accounts without an export.
  - name: weft.workloads.ArtifactKindMismatch
    summary: The artifact's package kind is not the kind the workload declares.
  - name: weft.workloads.RuntimeNotFound
    summary: No runtime with this identifier is registered.
  - name: weft.workloads.RuntimeIsRetired
    summary: The runtime is retired; nothing new runs on it.
  - name: weft.workloads.RuntimeKindUnsupported
    summary: The runtime does not run packages of this kind.
  - name: weft.workloads.IsolationBelowMinimum
    summary: >-
      The command would run the workload under an isolation level weaker than its runtime's or its
      own minimum; a minimum is never weakened.

  - name: weft.workloads.SpecKindNotRunnable
    summary: >-
      The package is a spec kind (ess-system, agent, training, graph); a translator turns it into
      plain components first, and nothing runs it as it is.
  - name: weft.workloads.NoMainProcess
    summary: The workload names no process with the role main.
  - name: weft.workloads.BoxPackageKind
    summary: A Box runs a package of kind image or machine only.
  - name: weft.workloads.ShapeMismatch
    summary: The command acts on one shape, and the workload has another.
  - name: weft.workloads.WorkloadNotFound
    summary: No workload with this identifier exists.
  - name: weft.workloads.WorkloadIsRetired
    summary: The workload is retired; nothing new starts from it.
  - name: weft.workloads.ReplicasOutOfBounds
    summary: The replica count lies outside the bounds of the workload's ScaleRule.
  - name: weft.workloads.QuotaExceeded
    summary: >-
      The command would take the account, or an account above it, past its quota for a resource
      class.
  - name: weft.workloads.ArtifactDigestMismatch
    summary: The node reports a digest other than the one the instance runs; nothing starts.
  - name: weft.workloads.WrongNode
    summary: The reporting node is not the node the instance is scheduled on.
  - name: weft.workloads.DisruptionBudgetExceeded
    summary: >-
      The eviction would take more replicas of the workload down at once than its DisruptionBudget
      allows.
  - name: weft.workloads.ServiceExists
    summary: The workload already has its Service record.
  - name: weft.workloads.ServiceNotFound
    summary: No Service with this identifier exists.
  - name: weft.workloads.SleepPolicyRequired
    summary: A ScaleRule with `min` 0 needs a SleepPolicy, and the Service has none.
  - name: weft.workloads.SleepPolicyRequiresMinZero
    summary: A SleepPolicy is allowed only on a Service whose ScaleRule has `min` 0.
  - name: weft.workloads.SnapshotsMissing
    summary: A `suspend` sleep names no snapshot to restore on the next wake.
  - name: weft.workloads.BudgetExceeded
    summary: >-
      The scale step would take the account past a spending budget (section 6 limit class
      `budget`); the service stays at its current size.
  - name: weft.workloads.DeadlineInPast
    summary: The deadline lies in the past.
  - name: weft.workloads.DeadlineNotReached
    summary: The deadline has not passed yet.
  - name: weft.workloads.DeadlinePassed
    summary: The deadline has passed; the result is not accepted and the record times out.
  - name: weft.workloads.GangIncomplete
    summary: A gang job starts only when all of its tasks are bound; fewer were.
  - name: weft.workloads.RetriesExhausted
    summary: The job has used every retry it may.
  - name: weft.workloads.TasksOutstanding
    summary: Not every task of the job has succeeded yet.
  - name: weft.workloads.LeaseHeld
    summary: Another caller holds a live lease on the box; only the lease's nonce updates it.
  - name: weft.workloads.LeaseNotHeld
    summary: The nonce does not match the box's lease, or the box has none.
  - name: weft.workloads.ForeignOwner
    summary: >-
      The named record (job, invocation, box, session, warm pool, instance) belongs to another
      workload.
  - name: weft.workloads.NotSessionOwner
    summary: Only the principal that opened the session attaches to it.
  - name: weft.workloads.SnapshotNotReady
    summary: The snapshot is not Ready.
  - name: weft.workloads.SnapshotOtherWorkload
    summary: >-
      A snapshot restores only into the workload it was taken from; its memory holds what was
      delivered to that workload.
  - name: weft.workloads.ScheduleExists
    summary: The workload already has its Schedule record.
  - name: weft.workloads.WarmPoolExists
    summary: The workload already has a warm pool.
  - name: weft.workloads.NotOnBorder
    summary: >-
      An HTTP trigger needs its component on the formation's Border; this one is internal, and a
      trigger does not widen its reach.

  # Section 15 "Health".
  - name: weft.workloads.InvalidCheck
    summary: >-
      A check lacks what its kind needs (a port for HTTP, TCP and gRPC, a path for HTTP, a command
      for command), names a port outside 1 to 65535, or holds a length or threshold out of range.
  - name: weft.workloads.InvalidRestartPolicy
    summary: >-
      A restart policy holds a backoff that is not positive, a cap below its initial wait, or a
      limit or window that is not positive.
  - name: weft.workloads.CheckNotDeclared
    summary: The instance's process declares no check of this role; the result is not recorded.
  - name: weft.workloads.StartupPending
    summary: >-
      The instance's startup checks have not passed; a ready or alive result is not considered
      before them.
  - name: weft.workloads.InvalidCount
    summary: >-
      A reported count of consecutive results or of restarts in the window is below 1, or above
      the instance's total.
  - name: weft.workloads.BackoffOutOfRange
    summary: >-
      The reported wait before a restart is below the restart policy's initial backoff or above its
      cap.
  - name: weft.workloads.ProcessNotDeclared
    summary: The instance runs no process of this name; nothing is recorded.
  - name: weft.workloads.RestartNotAllowed
    summary: >-
      The restart policy is `never`; the node reports the instance failed instead of restarting a
      process.

  # Section 14 "Reconciliation": the refusals of the level and time steps.
  - name: weft.workloads.ReplicaLive
    summary: A live instance of the service already holds this replica index; nothing is created.
  - name: weft.workloads.ServiceAtScale
    summary: >-
      The service already has as many live instances as its replica count asks for; no replica is
      requested.
  - name: weft.workloads.AccountNotClosed
    summary: The account is open; only a closed account's instances are stopped all at once.
  - name: weft.workloads.ReplicasStillLive
    summary: >-
      Instances of the service are still live; it is asleep only once every one of them ended.
  - name: weft.workloads.ReplicaBackoffActive
    summary: >-
      The service is backing off after a replica ended under its restart policy; no replica is
      requested until the backoff ends.
events:
  - name: weft.workloads.RuntimeRegistered
    fields:
      - {name: runtime_id, type: weft.shared.RuntimeId}
      - {name: name, type: String}
      - {name: version, type: String}
      - {name: minimum_isolation, type: weft.shared.IsolationLevel}

  - name: weft.workloads.RuntimeRetired
    fields:
      - {name: runtime_id, type: weft.shared.RuntimeId}


  - name: weft.workloads.WorkloadDefined
    fields:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: package_kind, type: weft.workloads.PackageKind}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: shape, type: weft.workloads.ShapeKind}
      - {name: isolation, type: weft.shared.IsolationLevel}

  - name: weft.workloads.WorkloadRetired
    fields:
      - {name: workload_id, type: weft.shared.WorkloadId}

  # Section 10 line 456 (the scheduler's input: "instance, claims, minimum isolation, formation's
  # zone rules") and section 14 R1 (line 585): carries the fields of
  # weft.scheduling.SubmitSchedulingRequest this domain holds, so a binding maps them (edge form).
  # `job_id` lets a binding skip a gang Job's member (scheduling: "a gang member is not submitted
  # by that binding").
  # `zones` is weft.formations.Formation.zones, read through [workload_id, formation_id], and
  # `priority` is Workload.priority (docs/open-questions.md "workloads loops", wave 4, decided).
  - name: weft.workloads.InstanceCreated
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: minimum_isolation, type: weft.shared.IsolationLevel}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: claims, type: List<weft.workloads.ClaimRequest>}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: job_id, type: Optional<weft.shared.JobId>}
      - {name: zones, type: List<weft.shared.ZoneName>}
      - {name: priority, type: weft.shared.PriorityClassName}

  - name: weft.workloads.InstanceScheduled
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: isolation, type: weft.shared.IsolationLevel}

  - name: weft.workloads.InstanceStarting
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}

  - name: weft.workloads.InstanceRunning
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}

  - name: weft.workloads.CheckObserved
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: process, type: String}
      - {name: role, type: weft.workloads.CheckRole}
      - {name: passed, type: Boolean}

  # Section 15 "Health": "`alive` failing past its threshold restarts the process", recorded
  # with its count, the restarts in the window and the wait before it.
  - name: weft.workloads.ProcessRestarted
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: process, type: String}
      - {name: reason, type: weft.workloads.RestartReason}
      - {name: restarts, type: Integer}
      - {name: restarts_in_window, type: Integer}
      - {name: backoff_seconds, type: Integer}

  # Section 15 "Health": one event for every health transition, so the reconciliation bindings
  # (section 14, R2 and R9) and the readers of readiness (edge routes, links, service bindings,
  # a rollout step) react to it.

  # Health moved to Starting: the processes started (Unknown), a process restarted, or a paused
  # instance resumed.
  - name: weft.workloads.InstanceHealthStarting
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}

  # Health moved to Ready: the instance gets traffic.
  - name: weft.workloads.InstanceReady
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}

  # Health moved to NotReady: the instance gets no traffic. A failing ready check or a pause
  # caused it; the CheckObserved or InstancePaused emitted beside it says which.
  - name: weft.workloads.InstanceNotReady
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}

  # A startup check failed `failure_threshold` times in a row: the node restarts the process.
  - name: weft.workloads.StartupCheckFailed
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: process, type: String}
      - {name: consecutive_failures, type: Integer}

  # Section 14 R9: an alive check failed `failure_threshold` times in a row: the node restarts the
  # process (node-local) and records it with RecordProcessRestarted. RecordCheckResult emits it
  # only once the count reached the check's threshold, so it already means "past its threshold";
  # no second event is needed. `restart` is false under the RestartPolicy `never`.
  # The restart record (RecordProcessRestarted) also needs `restarts_in_window` and
  # `backoff_seconds`: the node's own count and wait (section 15), which no event of the control
  # plane holds. So R9 stays node-local: weft-node receives this event, restarts, and reports.
  - name: weft.workloads.AliveCheckFailed
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: process, type: String}
      - {name: consecutive_failures, type: Integer}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: restart, type: Boolean}

  # Section 15: "past N restarts in a window the instance is `backing-off` (what Kubernetes calls
  # CrashLoopBackOff) and the event is named".
  - name: weft.workloads.InstanceBackingOff
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: process, type: String}
      - {name: restarts_in_window, type: Integer}
      - {name: backoff_seconds, type: Integer}

  # Section 15: a restarted process started successfully; the instance leaves `backing-off` and
  # its health is Starting again.
  - name: weft.workloads.InstanceBackoffEnded
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: process, type: String}

  # A restarted process started successfully while the instance was not backing off.
  - name: weft.workloads.ProcessStarted
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: process, type: String}

  - name: weft.workloads.InstancePaused
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}

  - name: weft.workloads.InstanceResumed
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}

  # Section 14 R2 (line 586): every instance end names the workload, the service and the replica
  # index, so a binding maps it to RecordReplicaEnded (filter `defined(event.service_id)`), and
  # `restart` is the RestartPolicy's answer for this end: `Always` restarts an exit, `OnFailure`
  # and `Always` restart a failure, and nothing restarts an instance its owner asked to stop
  # (desired Stop) or one whose artifact the node rejected.
  - name: weft.workloads.InstanceExited
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: exit_code, type: Integer}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: restart, type: Boolean}

  - name: weft.workloads.InstanceWithdrawn
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}

  - name: weft.workloads.InstanceFailed
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: reason, type: String}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: restart, type: Boolean}

  # Section 14 R3 (line 587): an evicted replica is replaced through its service's count.
  - name: weft.workloads.InstanceEvicted
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: reason, type: weft.workloads.EvictionReason}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}

  # Section 14 R6 (line 590): the live instances of a closed account asked to stop, counted.
  - name: weft.workloads.AccountInstancesStopped
    fields:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: stopped, type: Integer}

  # Section 14 R6 (line 590): the services of a closed account retired, counted.
  - name: weft.workloads.AccountServicesRetired
    fields:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: retired, type: Integer}

  - name: weft.workloads.InstanceDesiredSet
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: desired, type: weft.workloads.DesiredRun}

  # An audit record of every exec into an instance (actor list line 106 "execs"; the stream
  # itself is protocols/exec-channel.yaml).
  - name: weft.workloads.ExecOpened
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: principal_id, type: weft.shared.PrincipalId}
      - {name: command, type: List<String>}

  - name: weft.workloads.ServiceDefined
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: replicas, type: Integer}
      - {name: scale_rule, type: weft.workloads.ScaleRule}

  - name: weft.workloads.ServiceScaled
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: replicas, type: Integer}

  - name: weft.workloads.ScaleRuleSet
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: scale_rule, type: weft.workloads.ScaleRule}

  - name: weft.workloads.DisruptionBudgetSet
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: disruption_budget, type: weft.workloads.DisruptionBudget}

  - name: weft.workloads.SleepPolicySet
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: sleep_policy, type: Optional<weft.shared.SleepPolicy>}
      - {name: wake_deadline, type: Optional<weft.workloads.WakeDeadline>}

  - name: weft.workloads.ServiceDrainingToSleep
    fields:
      - {name: service_id, type: weft.shared.ServiceId}

  # Sketch lines 294-295: from here compute meters read zero; storage is still metered.
  - name: weft.workloads.ServiceAsleep
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: sleep_snapshots, type: List<weft.shared.SnapshotId>}

  - name: weft.workloads.WakeRequested
    fields:
      - {name: wake_id, type: weft.shared.WakeId}
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: source, type: weft.workloads.WakeSource}
      - {name: deadline_at, type: Timestamp}

  - name: weft.workloads.ServiceAwake
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: replicas, type: Integer}

  # Sketch lines 288-289: the named answer a held request fails with.
  - name: weft.workloads.WakeMissed
    fields:
      - {name: wake_id, type: weft.shared.WakeId}
      - {name: failure, type: weft.workloads.WakeFailure}

  # Section 14 R8 (line 592): the waking service and the count it wakes to. The instance itself
  # comes from the level loop (ServicesBelowScale, RequestReplica), not from this event.
  - name: weft.workloads.ServiceWaking
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: replicas, type: Integer}

  - name: weft.workloads.ServiceSleepCancelled
    fields:
      - {name: service_id, type: weft.shared.ServiceId}

  # Section 14 R1 (line 585, level form): one replica of a service below its count is requested;
  # a binding maps it to CreateInstance (workload_id, service_id, replica_index).
  - name: weft.workloads.ReplicaRequested
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: replica_index, type: Integer}

  # Section 14 R2 and R3 (lines 586-587): an ended instance left its service's live count;
  # `backoff` says whether the service now backs off before the next replica.
  - name: weft.workloads.ReplicaEnded
    fields:
      - {name: service_id, type: weft.shared.ServiceId}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: backoff, type: Boolean}

  # Section 14 R2 (line 586, time form): the service's backoff passed; replicas are requested again.
  - name: weft.workloads.ReplicaBackoffEnded
    fields:
      - {name: service_id, type: weft.shared.ServiceId}

  - name: weft.workloads.InvocationAccepted
    fields:
      - {name: invocation_id, type: weft.shared.InvocationId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: deadline_at, type: Timestamp}

  - name: weft.workloads.InvocationStarted
    fields:
      - {name: invocation_id, type: weft.shared.InvocationId}
