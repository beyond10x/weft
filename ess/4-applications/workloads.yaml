# Workloads: the package, shape and claims of one component, and what runs from them: instances,
# invocations, jobs, boxes, sessions, schedules, triggers, snapshots and warm pools. Source:
# docs/domain-sketch.md section "4. Workload (one component)" (lines 205-305), with the isolation
# levels of section "10. Scheduling" (lines 449-460) and the node verbs of section "11. Node
# control" (lines 462-472).
domain: weft.workloads


types:
  # Identifiers of this domain's entities that shared.yaml does not hold (reported to the
  # integrator; local until another domain needs one).

  # Section 15 "Health": "Instance health, separate from its run state: unknown -> starting ->
  # ready / not-ready", and "past N restarts in a window the instance is `backing-off`".
  # Held as a field of Instance, not a second lifecycle: an ESS entity has one lifecycle, and a
  # second entity per instance would need its own identity and a create beside CreateInstance.
  # Every command that changes it guards the value it leaves and emits a named event
  # (InstanceHealthStarting, InstanceReady, InstanceNotReady, InstanceBackingOff,
  # InstanceBackoffEnded). An instance that ends (Exited, Failed, Evicted) goes back to Unknown:
  # no node observes it any more, and its run-state event (InstanceExited, InstanceFailed,
  # InstanceEvicted) is the event of that change.
  - name: weft.workloads.InstanceHealth
    kind: enum
    variants:
      - Unknown
      - Starting
      - Ready
      - {name: NotReady, wire: not-ready}
      - {name: BackingOff, wire: backing-off}

  # Section 4 and section 15: why the node restarted a process: it ended (under OnFailure or
  # Always), or its startup or alive check failed past its threshold.
  - name: weft.workloads.RestartReason
    kind: enum
    variants: [Exited, StartupCheckFailed, AliveCheckFailed]

  # Why an instance left a node against its will (section 10 line 454 preemption; section 9 line
  # 444 draining).
  - name: weft.workloads.EvictionReason
    kind: enum
    variants: [Preemption, Drain, NodeLost]

  # What the owner asked of an instance; the node reports what it observed (section 11 line 470).
  - name: weft.workloads.DesiredRun
    kind: enum
    variants: [Run, Pause, Stop]

entities:
  # Sketch line 259: "Instance (one running copy on one node)". States: pending, scheduled,
  # starting, running, paused, exited, failed, evicted (brief focus of this domain; section 10
  # line 454 preemption, section 11 lines 466-471 the node's verbs and observations). The node
  # reports what it observed (line 470): every move past Scheduled is a NodeAgent observation.
  - name: weft.workloads.Instance
    naming:
      summary: One running copy of a workload on one node.
    identity:
      name: instance_id
      type: weft.shared.InstanceId
    fields:
      - name: workload_id
        type: weft.shared.WorkloadId
      - name: scope_id
        type: weft.shared.ScopeId
      - name: artifact_digest
        type: weft.shared.ArtifactDigest
      # Copied from the workload at create; no command lowers it (section 10 lines 456-458).
      - name: minimum_isolation
        type: weft.shared.IsolationLevel
      # The isolation the node runs it under, set when it is scheduled.
      - name: isolation
        type: Optional<weft.shared.IsolationLevel>
      - name: node_id
        type: Optional<weft.shared.NodeId>
      # What made this instance: at most one of these is present.
      - name: job_id
        type: Optional<weft.shared.JobId>
      - name: task_index
        type: Optional<Integer>
      - name: invocation_id
        type: Optional<weft.shared.InvocationId>
      - name: box_id
        type: Optional<weft.shared.BoxId>
      - name: session_id
        type: Optional<weft.shared.SessionId>
      # Sketch line 247: a stateful Service replica keeps a stable name.
      - name: replica_index
        type: Optional<Integer>
      # Section 14 R1 (line 585): the Service whose replica this is; its live count holds this
      # instance until RecordReplicaEnded counts it out (`replica_counted_out`).
      - name: service_id
        type: Optional<weft.shared.ServiceId>
      - name: replica_counted_out
        type: Boolean
      - name: warm_pool_id
        type: Optional<weft.shared.WarmPoolId>
      # Sketch line 260: "Snapshot (freeze and restore an instance)".
      - name: restored_from
        type: Optional<weft.shared.SnapshotId>
      - name: desired
        type: weft.workloads.DesiredRun
      # Section 4 "Inside one instance": `ready` (gets traffic). True exactly when `health` is
      # Ready; kept beside it for the views that read it.
      - name: ready
        type: Boolean
      # Section 15 "Health": "Instance health, separate from its run state". Unknown at create.
      - name: health
        type: weft.workloads.InstanceHealth
      # Copied from the workload at create, as minimum_isolation is: the check and restart guards
      # read the thresholds and the backoff from the instance's own row.
      - name: processes
        type: List<weft.workloads.Process>
      - name: restart_policy
        type: weft.workloads.RestartPolicy
      # Section 4: process restarts under the RestartPolicy over the instance's life: the most restarts
      # any one of its processes made, as its node counts them (node.LocalProcess.restarts). A
      # maximum, so a repeated report of one restart changes nothing (hardening pass 7).
      - name: restarts
        type: Integer
      # Section 15: restarts within the policy's window, as the node counted them at the last
      # restart (a window is a span of time; ESS orders no Duration, so the node counts it).
      - name: restarts_in_window
        type: Integer
      # Section 15: the wait before the last restart, exponential with a cap.
      - name: backoff_seconds
        type: Optional<Integer>
      - name: exit_code
        type: Optional<Integer>
      - name: failure_reason
        type: Optional<String>
      - name: eviction_reason
        type: Optional<weft.workloads.EvictionReason>
    # No command of this domain deletes an instance or the record that made it; each stands on its
    # own as history, so every link is `references`.
    # OPEN: whether a Job, Box, Session or WarmPool owns its instances (a delete of the owner takes
    # them) is not said; no source here settles owns against references.
    relations:
      - name: workload
        kind: references
        target: weft.workloads.Workload
        cardinality: one
        via: workload_id
      - name: job
        kind: references
        target: weft.workloads.Job
        cardinality: one
        via: job_id
      - name: invocation
        kind: references
        target: weft.workloads.Invocation
        cardinality: one
        via: invocation_id
      - name: box
        kind: references
        target: weft.workloads.Box
        cardinality: one
        via: box_id
      - name: session
        kind: references
        target: weft.workloads.Session
        cardinality: one
        via: session_id
      - name: warm_pool
        kind: references
        target: weft.workloads.WarmPool
        cardinality: one
        via: warm_pool_id
      - name: service
        kind: references
        target: weft.workloads.Service
        cardinality: one
        via: service_id
      - name: snapshot
        kind: references
        target: weft.workloads.Snapshot
        cardinality: one
        via: restored_from
      - name: account
        kind: references
        target: weft.scope.Scope
        cardinality: one
        via: scope_id
      - name: artifact
        kind: references
        target: weft.artifacts.Artifact
        cardinality: one
        via: artifact_digest
      # The node the instance is scheduled on (section 11 line 470); absent while pending.
      - name: node
        kind: references
        target: weft.infrastructure.Node
        cardinality: one
        via: node_id
    invariants:
      - restarts >= 0
      - restarts_in_window >= 0
      - restarts_in_window <= restarts
      # The bounds of the copied checks and restart backoff, as on Workload.
      - restart_policy.backoff_initial_seconds >= 1
      - restart_policy.backoff_max_seconds >= restart_policy.backoff_initial_seconds
      - restart_policy.backoff_limit >= 1
      - restart_policy.backoff_window_seconds >= 1
      - not:
          exists:
            in: processes
            as: p
            that:
              exists:
                in: p.checks
                as: c
                that:
                  any:
                    - c.initial_delay_seconds < 0
                    - c.period_seconds < 1
                    - c.timeout_seconds < 1
                    - c.failure_threshold < 1
                    - c.success_threshold < 1
      # Section 15: `ready` (gets traffic) holds exactly when health is Ready.
      - any:
          - all: [ready == true, health == Ready]
          - all: [ready == false, health != Ready]
    lifecycle:
      initial: Pending
      states: [Pending, Scheduled, Starting, Running, Paused, Exited, Failed, Evicted]
      terminal: [Exited, Failed, Evicted]
      transitions:
        - name: schedule
          from: [Pending]
          to: Scheduled
        - name: start
          from: [Scheduled]
          to: Starting
          summary: The node verified the artifact's signature and starts the processes.
        - name: run
          from: [Starting]
          to: Running
          summary: Every startup check passed.
        - name: pause
          from: [Running]
          to: Paused
        - name: resume
          from: [Paused]
          to: Running
        - name: exit
          from: [Starting, Running, Paused]
          to: Exited
        - name: withdraw
          from: [Pending]
          to: Exited
          summary: Stopped before any node held it.
        - name: fail
          from: [Scheduled, Starting, Running, Paused]
          to: Failed
        - name: evict
          from: [Scheduled, Starting, Running, Paused]
          to: Evicted

errors:
  - name: weft.workloads.ArtifactDigestMismatch
    summary: The node reports a digest other than the one the instance runs; nothing starts.
  - name: weft.workloads.WrongNode
    summary: The reporting node is not the node the instance is scheduled on.
  - name: weft.workloads.DisruptionBudgetExceeded
    summary: >-
      The eviction would take more replicas of the workload down at once than its DisruptionBudget
      allows.
  - name: weft.workloads.SnapshotNotReady
    summary: The snapshot is not Ready.
  - name: weft.workloads.SnapshotOtherWorkload
    summary: >-
      A snapshot restores only into the workload it was taken from; its memory holds what was
      delivered to that workload.
  - name: weft.workloads.CheckNotDeclared
    summary: The instance's process declares no check of this role; the result is not recorded.
  - name: weft.workloads.StartupPending
    summary: >-
      The instance's startup checks have not passed; a ready or alive result is not considered
      before them.
  - name: weft.workloads.BackoffOutOfRange
    summary: >-
      The reported wait before a restart is below the restart policy's initial backoff or above its
      cap.
  - name: weft.workloads.ProcessNotDeclared
    summary: The instance runs no process of this name; nothing is recorded.
  - name: weft.workloads.RestartNotAllowed
    summary: >-
      The restart policy is `never`; the node reports the instance failed instead of restarting a
      process.

  # Section 14 "Reconciliation": the refusals of the level and time steps.
  - name: weft.workloads.ReplicaLive
    summary: A live instance of the service already holds this replica index; nothing is created.
events:
  # Section 10 line 456 (the scheduler's input: "instance, claims, minimum isolation, formation's
  # zone rules") and section 14 R1 (line 585): carries the fields of
  # weft.scheduling.SubmitSchedulingRequest this domain holds, so a binding maps them (edge form).
  # `job_id` lets a binding skip a gang Job's member (scheduling: "a gang member is not submitted
  # by that binding").
  # `priority` is Workload.priority (docs/open-questions.md "workloads loops", wave 4, decided).
  # story:cloud-blocks-layer-refactor-pin (cloudspec layer rule): the workload names no formation,
  # so the event carries the workload's component-level `identity` in place of `formation_id`.
  # `zones` is weft.architecture.Formation.zones of the formation weft.architecture.ComponentWorkload
  # assigns the workload to (empty, any zone, for a workload no formation assigns). No related
  # path reaches it from the workload (the assignment names the workload, not the other way), so
  # CreateInstance's payload marks it generated and the implementation reads it.
  - name: weft.workloads.InstanceCreated
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: minimum_isolation, type: weft.shared.IsolationLevel}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: identity, type: weft.shared.WorkloadIdentity}
      - {name: claims, type: List<weft.workloads.ClaimRequest>}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: job_id, type: Optional<weft.shared.JobId>}
      - {name: zones, type: List<weft.shared.ZoneName>}
      - {name: priority, type: weft.shared.PriorityClassName}

  - name: weft.workloads.InstanceScheduled
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: isolation, type: weft.shared.IsolationLevel}

  - name: weft.workloads.InstanceStarting
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}

  - name: weft.workloads.InstanceRunning
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}

  - name: weft.workloads.CheckObserved
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: process, type: weft.shared.ProcessName}
      - {name: role, type: weft.workloads.CheckRole}
      - {name: passed, type: Boolean}

  # Section 15 "Health": "`alive` failing past its threshold restarts the process", recorded
  # with its count, the restarts in the window and the wait before it.
  - name: weft.workloads.ProcessRestarted
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: process, type: weft.shared.ProcessName}
      - {name: reason, type: weft.workloads.RestartReason}
      - {name: restarts, type: Integer}
      - {name: restarts_in_window, type: Integer}
      - {name: backoff_seconds, type: Integer}

  # Section 15 "Health": one event for every health transition, so the reconciliation bindings
  # (section 14, R2 and R9) and the readers of readiness (edge routes, links, service bindings,
  # a rollout step) react to it.

  # Health moved to Starting: the processes started (Unknown), a process restarted, or a paused
  # instance resumed.
  - name: weft.workloads.InstanceHealthStarting
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}

  # Health moved to Ready: the instance gets traffic.
  - name: weft.workloads.InstanceReady
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}

  # Health moved to NotReady: the instance gets no traffic. A failing ready check or a pause
  # caused it; the CheckObserved or InstancePaused emitted beside it says which.
  - name: weft.workloads.InstanceNotReady
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}

  # A startup check failed `failure_threshold` times in a row: the node restarts the process.
  - name: weft.workloads.StartupCheckFailed
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: process, type: weft.shared.ProcessName}
      - {name: consecutive_failures, type: Integer}

  # Section 14 R9: an alive check failed `failure_threshold` times in a row: the node restarts the
  # process (node-local) and records it with RecordProcessRestarted. RecordCheckResult emits it
  # only once the count reached the check's threshold, so it already means "past its threshold";
  # no second event is needed. `restart` is false under the RestartPolicy `never`.
  # The restart record (RecordProcessRestarted) also needs `restarts_in_window` and
  # `backoff_seconds`: the node's own count and wait (section 15), which no event of the control
  # plane holds. So R9 stays node-local: weft-node receives this event, restarts, and reports.
  - name: weft.workloads.AliveCheckFailed
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: process, type: weft.shared.ProcessName}
      - {name: consecutive_failures, type: Integer}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: restart, type: Boolean}

  # Section 15: "past N restarts in a window the instance is `backing-off` (what Kubernetes calls
  # CrashLoopBackOff) and the event is named".
  - name: weft.workloads.InstanceBackingOff
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: process, type: weft.shared.ProcessName}
      - {name: restarts_in_window, type: Integer}
      - {name: backoff_seconds, type: Integer}

  # Section 15: a restarted process started successfully; the instance leaves `backing-off` and
  # its health is Starting again.
  - name: weft.workloads.InstanceBackoffEnded
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: process, type: weft.shared.ProcessName}

  # A restarted process started successfully while the instance was not backing off.
  - name: weft.workloads.ProcessStarted
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: process, type: weft.shared.ProcessName}

  - name: weft.workloads.InstancePaused
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}

  - name: weft.workloads.InstanceResumed
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}

  # Section 14 R2 (line 586): every instance end names the workload, the service and the replica
  # index, so a binding maps it to RecordReplicaEnded (filter `defined(event.service_id)`), and
  # `restart` is the RestartPolicy's answer for this end: `Always` restarts an exit, `OnFailure`
  # and `Always` restart a failure, and nothing restarts an instance its owner asked to stop
  # (desired Stop) or one whose artifact the node rejected.
  - name: weft.workloads.InstanceExited
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: exit_code, type: Integer}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: restart, type: Boolean}

  - name: weft.workloads.InstanceWithdrawn
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}

  - name: weft.workloads.InstanceFailed
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: reason, type: String}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: restart, type: Boolean}

  # Section 14 R3 (line 587): an evicted replica is replaced through its service's count.
  - name: weft.workloads.InstanceEvicted
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: reason, type: weft.workloads.EvictionReason}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}

  # Section 14 R6 (line 590): the live instances of a closed account asked to stop, counted.
  - name: weft.workloads.AccountInstancesStopped
    fields:
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: stopped, type: Integer}

  - name: weft.workloads.InstanceDesiredSet
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: desired, type: weft.workloads.DesiredRun}

  # An audit record of every exec into an instance (actor list line 106 "execs"; the stream
  # itself is protocols/exec-channel.yaml).
  - name: weft.workloads.ExecOpened
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: principal_id, type: weft.shared.PrincipalId}
      - {name: command, type: List<String>}

  - name: weft.workloads.SnapshotRestored
    fields:
      - {name: snapshot_id, type: weft.shared.SnapshotId}
      - {name: instance_id, type: weft.shared.InstanceId}

commands:
  # Sketch line 259: an Instance of a workload. Section 10 line 451: the scheduler's input is
  # "instance, claims, minimum isolation"; the instance carries its workload's minimum.
  # OPEN: which actor creates instances for replicas, tasks, daemons and warm pools: the actor
  # list (lines 111-115) has no controller. Smallest answer: Scheduler.
  - name: weft.workloads.CreateInstance
    naming:
      display: Create an instance
    input:
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: job_id, type: Optional<weft.shared.JobId>}
      - {name: task_index, type: Optional<Integer>}
      - {name: invocation_id, type: Optional<weft.shared.InvocationId>}
      - {name: box_id, type: Optional<weft.shared.BoxId>}
      - {name: session_id, type: Optional<weft.shared.SessionId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: warm_pool_id, type: Optional<weft.shared.WarmPoolId>}
      # Section 14 R1 (line 585): the Service whose replica this is, as ReplicaRequested names it.
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
    outcomes:
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      # The record that made the instance exists and belongs to the same workload, or nothing is
      # created.
      - name: no-job
        when_related: {via: input.job_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-invocation
        when_related: {via: input.invocation_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-box
        when_related: {via: input.box_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-session
        when_related: {via: input.session_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-warm-pool
        when_related: {via: input.warm_pool_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-service
        when_related: {via: input.service_id, exists: false}
        error: weft.workloads.ServiceNotFound
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: foreign-job
        when_related: {via: input.job_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: foreign-invocation
        when_related: {via: input.invocation_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: foreign-box
        when_related: {via: input.box_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: foreign-session
        when_related: {via: input.session_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: foreign-warm-pool
        when_related: {via: input.warm_pool_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      - name: foreign-service
        when_related: {via: input.service_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.ForeignOwner
      # Section 14 R1: a replica index of a service runs at most once at a time, so a ReplicaRequested
      # delivered twice creates one instance (the binding drops this answer).
      # hardening pass 4: only a replica's request (service and index given) is checked, and only
      # instances with both fields are compared; ESS 0.99.2 reads `==` over an absent Optional as
      # Unknown.
      - name: replica-live
        when:
          all: [defined(service_id), defined(replica_index)]
        when_related:
          entity: weft.workloads.Instance
          where:
            all:
              - defined(service_id)
              - defined(replica_index)
              - service_id == input.service_id
              - replica_index == input.replica_index
              - any: [state == Pending, state == Scheduled, state == Starting, state == Running, state == Paused]
          exists: true
        error: weft.workloads.ReplicaLive
      - name: created
        creates: weft.workloads.Instance
        instance: instance_id
        sets:
          workload_id: input.workload_id
          scope_id: {related: {via: input.workload_id, field: scope_id}}
          artifact_digest: {related: {via: input.workload_id, field: artifact_digest}}
          minimum_isolation: {related: {via: input.workload_id, field: isolation}}
          job_id: input.job_id
          task_index: input.task_index
          invocation_id: input.invocation_id
          box_id: input.box_id
          session_id: input.session_id
          replica_index: input.replica_index
          service_id: input.service_id
          replica_counted_out: false
          warm_pool_id: input.warm_pool_id
          desired: Run
          ready: false
          health: Unknown
          processes: {related: {via: input.workload_id, field: processes}}
          restart_policy: {related: {via: input.workload_id, field: restart_policy}}
          restarts: 0
          restarts_in_window: 0
        emits: [weft.workloads.InstanceCreated]
        payload:
          weft.workloads.InstanceCreated:
            instance_id: {generated: true}
            workload_id: input.workload_id
            minimum_isolation: {related: {via: input.workload_id, field: isolation}}
            scope_id: {related: {via: input.workload_id, field: scope_id}}
            identity: {related: {via: input.workload_id, field: identity}}
            claims: {related: {via: input.workload_id, field: claims}}
            service_id: input.service_id
            replica_index: input.replica_index
            job_id: input.job_id
            zones: {generated: true}
            priority: {related: {via: input.workload_id, field: priority}}

  # Section 10 lines 451-452 (input and output of scheduling) and lines 456-458: an instance is
  # never placed under an isolation weaker than its minimum. This is the refusal the brief names:
  # a command that would run a workload below its minimum isolation. cloudspec's `None` (no
  # sandbox) is the weakest level, below ProcessSandbox, as in DefineWorkload below-runtime-isolation.
  - name: weft.workloads.ScheduleInstance
    naming:
      display: Schedule an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: isolation, type: weft.shared.IsolationLevel}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: below-minimum-isolation
        when_subject:
          predicate:
            any:
              - all: [minimum_isolation == MicroVm, input.isolation != MicroVm]
              - all:
                  - minimum_isolation == UserKernel
                  - input.isolation != MicroVm
                  - input.isolation != UserKernel
              - all:
                  - minimum_isolation == Container
                  - input.isolation: {in: [ProcessSandbox, None]}
              - all: [minimum_isolation == ProcessSandbox, input.isolation == None]
        error: weft.workloads.IsolationBelowMinimum
      - name: scheduled
        moves: weft.workloads.Instance.schedule
        instance: instance_id
        sets:
          node_id: input.node_id
          isolation: input.isolation
        emits: [weft.workloads.InstanceScheduled]
        payload:
          weft.workloads.InstanceScheduled:
            instance_id: input.instance_id
            node_id: input.node_id
            isolation: input.isolation
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 215-216: "verified by the node before start". The node verified the signature of
  # the artifact it fetched; a digest other than the instance's, or a revoked artifact, starts
  # nothing.
  - name: weft.workloads.RecordArtifactVerified
    naming:
      display: Record a verified artifact
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 4: an instance not placed has no node, so no node's report about it is
      # taken (WrongNode); ESS 0.99.2 reads `!=` over an absent Optional as Unknown. The same form
      # holds for every `wrong-node` of this file.
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: digest-mismatch
        when_subject: {predicate: artifact_digest != input.artifact_digest}
        error: weft.workloads.ArtifactDigestMismatch
      # The artifact's row of weft.artifacts (layer 3), through the relation `artifact`.
      - name: no-artifact
        when_related: {via: input.artifact_digest, exists: false}
        error: weft.workloads.ArtifactNotFound
      - name: revoked
        when_related: {via: input.artifact_digest, predicate: state == Revoked}
        error: weft.workloads.ArtifactIsRevoked
      # Section 15 "Health": unknown -> starting, as the processes start.
      - name: starting
        moves: weft.workloads.Instance.start
        instance: instance_id
        sets:
          health: Starting
        emits: [weft.workloads.InstanceStarting, weft.workloads.InstanceHealthStarting]
        payload:
          weft.workloads.InstanceStarting:
            instance_id: input.instance_id
            artifact_digest: input.artifact_digest
          weft.workloads.InstanceHealthStarting:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Sketch lines 215-216: the node's signature check failed; the instance fails without starting.
  - name: weft.workloads.RecordArtifactRejected
    naming:
      display: Record a rejected artifact
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: reason, type: String}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: rejected
        when_subject_state: Scheduled
        moves: weft.workloads.Instance.fail
        instance: instance_id
        sets:
          failure_reason: input.reason
        emits: [weft.workloads.InstanceFailed]
        payload:
          weft.workloads.InstanceFailed:
            instance_id: input.instance_id
            reason: input.reason
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
            restart: false
      - name: other-state
        error: weft.workloads.StateConflict

  # Section 4 "Inside one instance": every `startup` check passed. Section 15 "Health": the
  # startup check comes before `ready` and `alive` are considered. An instance whose processes
  # declare no `ready` check is Ready as it runs (nothing else would make it ready); otherwise its
  # health stays Starting until the ready check reaches its threshold (RecordCheckResult).
  - name: weft.workloads.RecordInstanceRunning
    naming:
      display: Record an instance running
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: running-ready
        when_subject:
          predicate:
            all:
              - state == Starting
              - health == Starting
              - not:
                  exists:
                    in: processes
                    as: p
                    that:
                      exists: {in: p.checks, as: c, that: c.role == Ready}
        moves: weft.workloads.Instance.run
        instance: instance_id
        sets:
          health: Ready
          ready: true
        emits: [weft.workloads.InstanceRunning, weft.workloads.InstanceReady]
        payload:
          weft.workloads.InstanceRunning:
            instance_id: input.instance_id
          weft.workloads.InstanceReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: running
        moves: weft.workloads.Instance.run
        instance: instance_id
        emits: [weft.workloads.InstanceRunning]
        payload:
          weft.workloads.InstanceRunning:
            instance_id: input.instance_id
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Section 4 "Inside one instance" (`Check`) and section 15 "Health": a check result, the
  # failure count against the threshold. The node runs the probes and counts consecutive equal
  # results of one check (`consecutive`, this one included); the threshold is read from the
  # instance's own copy of its processes. A result changes health only when the count reaches the
  # check's threshold:
  # - `ready` passing `success_threshold` times: Starting or NotReady -> Ready (InstanceReady);
  # - `ready` failing `failure_threshold` times: Starting or Ready -> NotReady (InstanceNotReady);
  # - `alive` failing `failure_threshold` times: AliveCheckFailed; the node restarts the process
  #   (section 14 R9, node-local) and records it with RecordProcessRestarted;
  # - `startup` failing `failure_threshold` times: StartupCheckFailed; the node restarts it too.
  # Every other result is recorded (CheckObserved) and changes nothing. A `ready` or `alive`
  # result before the startup checks passed (run state Starting) is refused (section 15: the
  # startup check comes first). While the instance is backing off a ready result moves nothing.
  # OPEN: with several processes that each have a `ready` check, the instance follows the last
  # check that reached its threshold; Kubernetes holds a Pod ready only when every container is.
  # Per-check state would need an entity per check. Smallest answer: one `ready` check per
  # instance, as most workloads have.
  - name: weft.workloads.RecordCheckResult
    naming:
      display: Record a check result
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: process, type: weft.shared.ProcessName}
      - {name: role, type: weft.workloads.CheckRole}
      - {name: passed, type: Boolean}
      - {name: consecutive, type: Integer}
    outcomes:
      - name: invalid-count
        when: consecutive < 1
        error: weft.workloads.InvalidCount
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: check-not-declared
        when_subject:
          predicate:
            not:
              exists:
                in: processes
                as: p
                that:
                  all:
                    - p.name == input.process
                    - exists: {in: p.checks, as: c, that: c.role == input.role}
        error: weft.workloads.CheckNotDeclared
      - name: startup-pending
        when: role != Startup
        when_subject: {predicate: state == Starting}
        error: weft.workloads.StartupPending
      - name: ready-reached
        when:
          all: [role == Ready, passed == true]
        when_subject:
          predicate:
            all:
              - state == Running
              - health: [Starting, NotReady]
              - exists:
                  in: processes
                  as: p
                  that:
                    all:
                      - p.name == input.process
                      - exists:
                          in: p.checks
                          as: c
                          that:
                            all: [c.role == Ready, input.consecutive >= c.success_threshold]
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          health: Ready
          ready: true
        emits: [weft.workloads.CheckObserved, weft.workloads.InstanceReady]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
          weft.workloads.InstanceReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: ready-lost
        when:
          all: [role == Ready, passed == false]
        when_subject:
          predicate:
            all:
              - state == Running
              - health: [Starting, Ready]
              - exists:
                  in: processes
                  as: p
                  that:
                    all:
                      - p.name == input.process
                      - exists:
                          in: p.checks
                          as: c
                          that:
                            all: [c.role == Ready, input.consecutive >= c.failure_threshold]
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          health: NotReady
          ready: false
        emits: [weft.workloads.CheckObserved, weft.workloads.InstanceNotReady]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
          weft.workloads.InstanceNotReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      # Section 14 R9 (line 593): past its threshold under `never` the node restarts nothing and
      # reports the instance failed (RecordProcessRestarted refuses `never`).
      - name: alive-failed-no-restart
        when:
          all: [role == Alive, passed == false]
        when_subject:
          predicate:
            all:
              - state == Running
              - restart_policy.mode == Never
              - exists:
                  in: processes
                  as: p
                  that:
                    all:
                      - p.name == input.process
                      - exists:
                          in: p.checks
                          as: c
                          that:
                            all: [c.role == Alive, input.consecutive >= c.failure_threshold]
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.CheckObserved, weft.workloads.AliveCheckFailed]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
          weft.workloads.AliveCheckFailed:
            instance_id: input.instance_id
            process: input.process
            consecutive_failures: input.consecutive
            node_id: input.node_id
            workload_id: {subject: workload_id}
            restart: false
      - name: alive-failed
        when:
          all: [role == Alive, passed == false]
        when_subject:
          predicate:
            all:
              - state == Running
              - exists:
                  in: processes
                  as: p
                  that:
                    all:
                      - p.name == input.process
                      - exists:
                          in: p.checks
                          as: c
                          that:
                            all: [c.role == Alive, input.consecutive >= c.failure_threshold]
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.CheckObserved, weft.workloads.AliveCheckFailed]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
          weft.workloads.AliveCheckFailed:
            instance_id: input.instance_id
            process: input.process
            consecutive_failures: input.consecutive
            node_id: input.node_id
            workload_id: {subject: workload_id}
            restart: true
      - name: startup-failed
        when:
          all: [role == Startup, passed == false]
        when_subject:
          predicate:
            all:
              - state == Starting
              - exists:
                  in: processes
                  as: p
                  that:
                    all:
                      - p.name == input.process
                      - exists:
                          in: p.checks
                          as: c
                          that:
                            all: [c.role == Startup, input.consecutive >= c.failure_threshold]
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.CheckObserved, weft.workloads.StartupCheckFailed]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
          weft.workloads.StartupCheckFailed:
            instance_id: input.instance_id
            process: input.process
            consecutive_failures: input.consecutive
      - name: observed
        when_subject: {predicate: {state: [Starting, Running]}}
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.CheckObserved]
        payload:
          weft.workloads.CheckObserved:
            instance_id: input.instance_id
            process: input.process
            role: input.role
            passed: input.passed
      - name: other-state
        error: weft.workloads.StateConflict

  # Section 4 "Inside one instance" (`alive`: "restart when it fails"; RestartPolicy "with a
  # backoff"), section 14 R9 ("alive check failed past its threshold -> process restart
  # (node-local, recorded)") and section 15 "Health" ("Restart backoff: exponential with a cap;
  # past N restarts in a window the instance is `backing-off`"). The node applies the policy and
  # reports each restart with the wait it took (`backoff_seconds`) and its count of restarts in
  # the policy's window (`restarts_in_window`, this one included). The control plane checks the
  # wait against the policy's bounds and the count against its limit. A restart takes the
  # instance out of traffic: health Starting, or BackingOff once the count passes the limit.
  # OPEN: whether a restart of a `sidecar` process takes the whole instance out of traffic.
  # Smallest answer: yes, as a Kubernetes Pod is unready while any container restarts.
  # OPEN: the backoff's exact value for the n-th restart (initial * 2^(n-1), capped) is not
  # checked here: the guard language has no power function. Only its bounds are.
  - name: weft.workloads.RecordProcessRestarted
    naming:
      display: Record a process restart
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: process, type: weft.shared.ProcessName}
      - {name: restarts, type: Integer}
      - {name: reason, type: weft.workloads.RestartReason}
      - {name: restarts_in_window, type: Integer}
      - {name: backoff_seconds, type: Integer}
    outcomes:
      - name: invalid-count
        when: {any: [restarts_in_window < 1, restarts < 1]}
        error: weft.workloads.InvalidCount
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: no-such-process
        when_subject:
          predicate:
            not:
              exists: {in: processes, as: p, that: p.name == input.process}
        error: weft.workloads.ProcessNotDeclared
      - name: restart-never
        when_subject: {predicate: restart_policy.mode == Never}
        error: weft.workloads.RestartNotAllowed
      - name: count-above-total
        when_subject: {predicate: input.restarts_in_window > input.restarts}
        error: weft.workloads.InvalidCount
      - name: backoff-out-of-range
        when_subject:
          predicate:
            any:
              - input.backoff_seconds < restart_policy.backoff_initial_seconds
              - input.backoff_seconds > restart_policy.backoff_max_seconds
        error: weft.workloads.BackoffOutOfRange
      # Past N restarts in the window: the instance enters BackingOff (CrashLoopBackOff).
      - name: backing-off
        when_subject:
          predicate:
            all:
              - state: [Starting, Running]
              - health: {none_of: [BackingOff]}
              - input.restarts_in_window > restart_policy.backoff_limit
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          restarts: {expr: "max(subject.restarts, input.restarts)"}
          restarts_in_window: input.restarts_in_window
          backoff_seconds: input.backoff_seconds
          health: BackingOff
          ready: false
        emits: [weft.workloads.ProcessRestarted, weft.workloads.InstanceBackingOff]
        payload:
          weft.workloads.ProcessRestarted:
            instance_id: input.instance_id
            process: input.process
            reason: input.reason
            restarts: {expr: "max(subject.restarts, input.restarts)"}
            restarts_in_window: input.restarts_in_window
            backoff_seconds: input.backoff_seconds
          weft.workloads.InstanceBackingOff:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
            process: input.process
            restarts_in_window: input.restarts_in_window
            backoff_seconds: input.backoff_seconds
      # Already backing off: the restart is recorded; health stays BackingOff.
      - name: restarted-backing-off
        when_subject:
          predicate:
            all:
              - state: [Starting, Running]
              - health == BackingOff
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          restarts: {expr: "max(subject.restarts, input.restarts)"}
          restarts_in_window: input.restarts_in_window
          backoff_seconds: input.backoff_seconds
          ready: false
        emits: [weft.workloads.ProcessRestarted]
        payload:
          weft.workloads.ProcessRestarted:
            instance_id: input.instance_id
            process: input.process
            reason: input.reason
            restarts: {expr: "max(subject.restarts, input.restarts)"}
            restarts_in_window: input.restarts_in_window
            backoff_seconds: input.backoff_seconds
      - name: restarted
        when_subject: {predicate: {state: [Starting, Running]}}
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          restarts: {expr: "max(subject.restarts, input.restarts)"}
          restarts_in_window: input.restarts_in_window
          backoff_seconds: input.backoff_seconds
          health: Starting
          ready: false
        emits: [weft.workloads.ProcessRestarted, weft.workloads.InstanceHealthStarting]
        payload:
          weft.workloads.ProcessRestarted:
            instance_id: input.instance_id
            process: input.process
            reason: input.reason
            restarts: {expr: "max(subject.restarts, input.restarts)"}
            restarts_in_window: input.restarts_in_window
            backoff_seconds: input.backoff_seconds
          weft.workloads.InstanceHealthStarting:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: other-state
        error: weft.workloads.StateConflict

  # Section 15 "Health": "past N restarts in a window the instance is `backing-off` ... leaving
  # it on a successful start". The node reports a restarted process started: its startup check
  # passed, or it has none. A backing-off instance leaves BackingOff (InstanceBackoffEnded). In
  # a Running instance whose processes declare no `ready` check, health goes straight to Ready
  # (nothing else would make it ready); otherwise the ready check moves it (RecordCheckResult).
  - name: weft.workloads.RecordProcessStarted
    naming:
      display: Record a restarted process started
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: process, type: weft.shared.ProcessName}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: no-such-process
        when_subject:
          predicate:
            not:
              exists: {in: processes, as: p, that: p.name == input.process}
        error: weft.workloads.ProcessNotDeclared
      - name: backoff-ended-ready
        when_subject:
          predicate:
            all:
              - state == Running
              - health == BackingOff
              - not:
                  exists:
                    in: processes
                    as: p
                    that:
                      exists: {in: p.checks, as: c, that: c.role == Ready}
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          health: Ready
          ready: true
        emits: [weft.workloads.InstanceBackoffEnded, weft.workloads.InstanceReady]
        payload:
          weft.workloads.InstanceBackoffEnded:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
            process: input.process
          weft.workloads.InstanceReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: backoff-ended
        when_subject:
          predicate:
            all:
              - state: [Starting, Running]
              - health == BackingOff
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          health: Starting
        emits: [weft.workloads.InstanceBackoffEnded]
        payload:
          weft.workloads.InstanceBackoffEnded:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
            process: input.process
      - name: started-ready
        when_subject:
          predicate:
            all:
              - state == Running
              - health == Starting
              - not:
                  exists:
                    in: processes
                    as: p
                    that:
                      exists: {in: p.checks, as: c, that: c.role == Ready}
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          health: Ready
          ready: true
        emits: [weft.workloads.ProcessStarted, weft.workloads.InstanceReady]
        payload:
          weft.workloads.ProcessStarted:
            instance_id: input.instance_id
            process: input.process
          weft.workloads.InstanceReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: started
        when_subject: {predicate: {state: [Starting, Running]}}
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.ProcessStarted]
        payload:
          weft.workloads.ProcessStarted:
            instance_id: input.instance_id
            process: input.process
      - name: other-state
        error: weft.workloads.StateConflict

  # Section 11 line 466 `Pause`; the node reports the instance paused. Section 15 "Health": a
  # paused instance gets no traffic, so its health is NotReady (InstanceNotReady, no process).
  - name: weft.workloads.RecordInstancePaused
    naming:
      display: Record an instance paused
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      - name: paused
        moves: weft.workloads.Instance.pause
        instance: instance_id
        sets:
          ready: false
          health: NotReady
        emits: [weft.workloads.InstancePaused, weft.workloads.InstanceNotReady]
        payload:
          weft.workloads.InstancePaused:
            instance_id: input.instance_id
          weft.workloads.InstanceNotReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.RecordInstanceResumed
    naming:
      display: Record an instance resumed
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      # Section 15 "Health": a resumed instance with no `ready` check is Ready at once; any other
      # is Starting until its ready check reaches its threshold.
      - name: resumed-ready
        when_subject:
          predicate:
            all:
              - state == Paused
              - not:
                  exists:
                    in: processes
                    as: p
                    that:
                      exists: {in: p.checks, as: c, that: c.role == Ready}
        moves: weft.workloads.Instance.resume
        instance: instance_id
        sets:
          health: Ready
          ready: true
        emits: [weft.workloads.InstanceResumed, weft.workloads.InstanceReady]
        payload:
          weft.workloads.InstanceResumed:
            instance_id: input.instance_id
          weft.workloads.InstanceReady:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: resumed
        moves: weft.workloads.Instance.resume
        instance: instance_id
        sets:
          health: Starting
        emits: [weft.workloads.InstanceResumed, weft.workloads.InstanceHealthStarting]
        payload:
          weft.workloads.InstanceResumed:
            instance_id: input.instance_id
          weft.workloads.InstanceHealthStarting:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # The instance's processes ended. A zero exit, or an exit the owner asked for, is Exited; the
  # node reports any other end as RecordInstanceFailed.
  - name: weft.workloads.RecordInstanceExited
    naming:
      display: Record an instance exited
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: exit_code, type: Integer}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      # Section 4 line 269 and section 14 R2: `always` restarts an exit the owner did not ask for.
      - name: exited-restart
        when_subject:
          predicate:
            all: [restart_policy.mode == Always, desired != Stop]
        moves: weft.workloads.Instance.exit
        instance: instance_id
        sets:
          exit_code: input.exit_code
          ready: false
          health: Unknown
        emits: [weft.workloads.InstanceExited]
        payload:
          weft.workloads.InstanceExited:
            instance_id: input.instance_id
            exit_code: input.exit_code
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
            restart: true
      - name: exited
        moves: weft.workloads.Instance.exit
        instance: instance_id
        sets:
          exit_code: input.exit_code
          ready: false
          health: Unknown
        emits: [weft.workloads.InstanceExited]
        payload:
          weft.workloads.InstanceExited:
            instance_id: input.instance_id
            exit_code: input.exit_code
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
            restart: false
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  - name: weft.workloads.RecordInstanceFailed
    naming:
      display: Record an instance failed
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: exit_code, type: Optional<Integer>}
      - {name: reason, type: String}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: wrong-node
        when_subject: {predicate: {any: [not defined(node_id), node_id != input.node_id]}}
        error: weft.workloads.WrongNode
      # Section 4 line 269 and section 14 R2: `on-failure` and `always` restart a failure the owner
      # did not ask for.
      - name: failed-restart
        when_subject:
          predicate:
            all: [restart_policy.mode != Never, desired != Stop]
        moves: weft.workloads.Instance.fail
        instance: instance_id
        sets:
          exit_code: input.exit_code
          failure_reason: input.reason
          ready: false
          health: Unknown
        emits: [weft.workloads.InstanceFailed]
        payload:
          weft.workloads.InstanceFailed:
            instance_id: input.instance_id
            reason: input.reason
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
            restart: true
      - name: failed
        moves: weft.workloads.Instance.fail
        instance: instance_id
        sets:
          exit_code: input.exit_code
          failure_reason: input.reason
          ready: false
          health: Unknown
        emits: [weft.workloads.InstanceFailed]
        payload:
          weft.workloads.InstanceFailed:
            instance_id: input.instance_id
            reason: input.reason
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
            restart: false
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Section 10 line 454 (preemption), section 9 line 444 (draining), section 11 line 471 (a lost
  # node's instances). A drain respects the workload's DisruptionBudget (sketch lines 299-300);
  # the count of replicas already down is the scheduler's to read.
  - name: weft.workloads.EvictInstance
    naming:
      display: Evict an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: reason, type: weft.workloads.EvictionReason}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      # Kept external: the replicas of the workload down at once, counted against the stored
      # DisruptionBudget; a row-set count compares only with a literal (docs/ess-gaps.md 6).
      - name: over-budget
        external: >-
          a drain would take more replicas of the workload down at once than its DisruptionBudget
          allows
        when_subject: {predicate: state != Pending}
        error: weft.workloads.DisruptionBudgetExceeded
      - name: evicted
        moves: weft.workloads.Instance.evict
        instance: instance_id
        sets:
          eviction_reason: input.reason
          ready: false
          health: Unknown
        emits: [weft.workloads.InstanceEvicted]
        payload:
          weft.workloads.InstanceEvicted:
            instance_id: input.instance_id
            reason: input.reason
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
      - name: wrong-state
        wrong_state: true
        error: weft.workloads.StateConflict

  # Section 11 line 466 `Stop`; actor list line 106. A pending instance no node holds is withdrawn
  # at once; any other live instance is asked to stop and the node reports its exit.
  # OPEN (isolation pass 2): not tied to the caller's account. Scheduler sends it too and declares no
  # caller attributes, so a caller read is refused (ESS-COMMAND-004). Split the tenant path into
  # a command of its own, or give those actors an account?
  - name: weft.workloads.StopInstance
    naming:
      display: Stop an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      - name: withdrawn
        when_subject_state: Pending
        moves: weft.workloads.Instance.withdraw
        instance: instance_id
        sets:
          desired: Stop
        emits: [weft.workloads.InstanceWithdrawn]
        payload:
          weft.workloads.InstanceWithdrawn:
            instance_id: input.instance_id
            workload_id: {subject: workload_id}
            service_id: {subject: service_id}
            replica_index: {subject: replica_index}
      - name: stop-asked
        when_subject_state: [Scheduled, Starting, Running, Paused]
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          desired: Stop
        emits: [weft.workloads.InstanceDesiredSet]
        payload:
          weft.workloads.InstanceDesiredSet:
            instance_id: input.instance_id
            desired: Stop
      - name: ended
        error: weft.workloads.StateConflict

  # Section 14 R6 (line 590, "account closed -> ... instances stopped"), many-rows form (lines
  # 603-604): one command whose outcome moves every matching row, invoked by one binding on
  # weft.accounts.AccountClosed (scope_id -> scope_id). Every live instance of the account,
  # pending ones included, is asked to stop (desired Stop), as StopInstance does for one; a node
  # stops its running ones and reports each end (R2 edge). A pending instance no node holds is
  # withdrawn by the level step on PendingStopsToWithdraw (StopInstance per row): an outcome over
  # a set of rows carries no second effect (ESS-COMMAND-009), so the move to Exited cannot sit
  # here beside the update. Refused while the account is open: closing is the accounts domain's
  # decision (deny by default).
  # OPEN: the account's boxes, sessions, jobs, schedules, triggers, warm pools and workloads keep
  # their own states; whether the closing also destroys, closes, cancels, deletes or retires them
  # is not said, and CreateInstance does not refuse a closed account. Smallest answer: their
  # instances stop here and the services retire (RetireAccountServices); the records stay as
  # history.
  - name: weft.workloads.StopAccountInstances
    naming:
      display: Stop every instance of a closed account
    input:
      - {name: scope_id, type: weft.shared.ScopeId}
    outcomes:
      - name: no-account
        when_related: {via: input.scope_id, exists: false}
        error: weft.workloads.NotFound
      - name: account-open
        when_related: {via: input.scope_id, predicate: state != Closed}
        error: weft.workloads.ScopeNotClosed
      - name: stopped
        updates: weft.workloads.Instance
        instances:
          where:
            all:
              - scope_id == input.scope_id
              - any: [state == Pending, state == Scheduled, state == Starting, state == Running, state == Paused]
        sets:
          desired: Stop
        emits: [weft.workloads.AccountInstancesStopped]
        payload:
          weft.workloads.AccountInstancesStopped:
            scope_id: input.scope_id
            stopped: {count: changed}

  # Section 11 line 466 `Pause`.
  - name: weft.workloads.PauseInstance
    naming:
      display: Pause an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the instance's own account acts on it; another account's instance
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.workloads.NotFound
      - name: pause-asked
        when_subject_state: Running
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          desired: Pause
        emits: [weft.workloads.InstanceDesiredSet]
        payload:
          weft.workloads.InstanceDesiredSet:
            instance_id: input.instance_id
            desired: Pause
      - name: not-running
        error: weft.workloads.StateConflict

  - name: weft.workloads.ResumeInstance
    naming:
      display: Resume an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the instance's own account acts on it; another account's instance
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.workloads.NotFound
      - name: resume-asked
        when_subject_state: Paused
        updates: weft.workloads.Instance
        instance: instance_id
        sets:
          desired: Run
        emits: [weft.workloads.InstanceDesiredSet]
        payload:
          weft.workloads.InstanceDesiredSet:
            instance_id: input.instance_id
            desired: Run
      - name: not-paused
        error: weft.workloads.StateConflict

  # Actor list line 106 "execs"; sketch lines 250-251 (a Box is exec'd into). The exec stream is
  # protocols/exec-channel.yaml; this command authorizes it and writes the audit record.
  # OPEN: whether an exec needs its own role beyond Deployer (it reaches the workload's secrets
  # in memory). Smallest safe answer: Deployer only, on a running instance only.
  - name: weft.workloads.OpenExec
    naming:
      display: Open an exec into an instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      # hardening pass 1 D2: the principal who opens the exec is the caller, not a request input.
      - {name: command, type: List<String>}
    outcomes:
      - name: no-such-instance
        unknown_instance: true
        error: weft.workloads.NotFound
      # hardening pass 1 D3: only the instance's own account acts on it; another account's instance
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: scope_id != caller.scope_id}
        error: weft.workloads.NotFound
      - name: opened
        when_subject_state: Running
        updates: weft.workloads.Instance
        instance: instance_id
        emits: [weft.workloads.ExecOpened]
        payload:
          weft.workloads.ExecOpened:
            instance_id: input.instance_id
            principal_id: {caller: principal_id}
            command: input.command
      - name: not-running
        error: weft.workloads.StateConflict

  # Sketch line 260 "restore an instance"; lines 284-285 a wake restores the snapshot. A new
  # instance of the same workload starts from it; another workload is refused by name. Restoring
  # past a quota is refused by name (outcome group `quota`).
  - name: weft.workloads.RestoreSnapshot
    naming:
      display: Restore a snapshot
    input:
      - {name: snapshot_id, type: weft.shared.SnapshotId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      # Isolation pass 2: the account the request acts in, so the workload can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing workload (an input guard answers ahead of every row check).
      - name: not-callers-account
        when: scope_id != caller.scope_id
        error: weft.workloads.WorkloadNotFound
      - name: no-snapshot
        when_related: {via: input.snapshot_id, exists: false}
        error: weft.workloads.NotFound
      - name: no-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.workloads.WorkloadNotFound
      # Isolation pass 2: a workload of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: workload-of-other-account
        when_related: {via: input.workload_id, predicate: scope_id != input.scope_id}
        error: weft.workloads.WorkloadNotFound
      # hardening pass 1 disclosure: a snapshot of another account than the workload's answers
      # like a missing one, and before its state is read.
      - name: snapshot-foreign
        when_related:
          entity: weft.workloads.Snapshot
          where:
            all:
              - snapshot_id == input.snapshot_id
              - not:
                  exists:
                    as: w
                    in: {entity: weft.workloads.Workload}
                    that: {all: [{w.scope_id: {eq: {fact: scope_id}}}, w.workload_id == input.workload_id]}
          exists: true
        error: weft.workloads.NotFound
      # hardening pass 1 disclosure: the ownership refusal answers before the snapshot's state.
      - name: other-workload
        when_related: {via: input.snapshot_id, predicate: workload_id != input.workload_id}
        error: weft.workloads.SnapshotOtherWorkload
      - name: not-ready
        when_related: {via: input.snapshot_id, predicate: state != Ready}
        error: weft.workloads.SnapshotNotReady
      - name: workload-retired
        when_related: {via: input.workload_id, predicate: state == Retired}
        error: weft.workloads.WorkloadIsRetired
      - name: restored
        creates: weft.workloads.Instance
        instance: instance_id
        sets:
          workload_id: input.workload_id
          scope_id: {related: {via: input.workload_id, field: scope_id}}
          artifact_digest: {related: {via: input.workload_id, field: artifact_digest}}
          minimum_isolation: {related: {via: input.workload_id, field: isolation}}
          restored_from: input.snapshot_id
          desired: Run
          ready: false
          health: Unknown
          processes: {related: {via: input.workload_id, field: processes}}
          restart_policy: {related: {via: input.workload_id, field: restart_policy}}
          restarts: 0
          restarts_in_window: 0
        emits: [weft.workloads.SnapshotRestored]
        payload:
          weft.workloads.SnapshotRestored:
            snapshot_id: input.snapshot_id
            instance_id: {generated: true}

views:
  # Sketch line 259: the instances of one workload.
  - name: weft.workloads.InstanceList
    source: weft.workloads.Instance
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter: workload_id == param.workload_id
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: isolation, type: Optional<weft.shared.IsolationLevel>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: desired, type: weft.workloads.DesiredRun}
      - {name: ready, type: Boolean}
      - {name: health, type: weft.workloads.InstanceHealth}
      - {name: restarts, type: Integer}
      - {name: state, type: weft.workloads.Instance.State}

  # Sketch line 259: one instance.
  - name: weft.workloads.InstanceDetail
    source: weft.workloads.Instance
    consistency: read_your_writes
    params:
      - {name: instance_id, type: weft.shared.InstanceId}
    filter: instance_id == param.instance_id
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: minimum_isolation, type: weft.shared.IsolationLevel}
      - {name: isolation, type: Optional<weft.shared.IsolationLevel>}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: job_id, type: Optional<weft.shared.JobId>}
      - {name: task_index, type: Optional<Integer>}
      - {name: invocation_id, type: Optional<weft.shared.InvocationId>}
      - {name: box_id, type: Optional<weft.shared.BoxId>}
      - {name: session_id, type: Optional<weft.shared.SessionId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_counted_out, type: Boolean}
      - {name: warm_pool_id, type: Optional<weft.shared.WarmPoolId>}
      - {name: restored_from, type: Optional<weft.shared.SnapshotId>}
      - {name: desired, type: weft.workloads.DesiredRun}
      - {name: ready, type: Boolean}
      - {name: health, type: weft.workloads.InstanceHealth}
      - {name: processes, type: List<weft.workloads.Process>}
      - {name: restart_policy, type: weft.workloads.RestartPolicy}
      - {name: restarts, type: Integer}
      - {name: restarts_in_window, type: Integer}
      - {name: backoff_seconds, type: Optional<Integer>}
      - {name: exit_code, type: Optional<Integer>}
      - {name: failure_reason, type: Optional<String>}
      - {name: eviction_reason, type: Optional<weft.workloads.EvictionReason>}
      - {name: state, type: weft.workloads.Instance.State}

  # Section 11 lines 466-470: what a node runs. The node agent reads its assignments from here.
  - name: weft.workloads.NodeInstances
    source: weft.workloads.Instance
    consistency: read_your_writes
    params:
      - {name: node_id, type: weft.shared.NodeId}
    filter: node_id == param.node_id
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: isolation, type: Optional<weft.shared.IsolationLevel>}
      - {name: desired, type: weft.workloads.DesiredRun}
      - {name: state, type: weft.workloads.Instance.State}

  # The invariants read restarts and restarts_in_window; the isolation guard reads
  # minimum_isolation and node_id; the health guards read health, processes and restart_policy:
  # this view holds every instance in every state.
  - name: weft.workloads.Instances
    source: weft.workloads.Instance
    consistency: read_your_writes
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: service_id, type: Optional<weft.shared.ServiceId>}
      - {name: replica_index, type: Optional<Integer>}
      - {name: replica_counted_out, type: Boolean}
      - {name: desired, type: weft.workloads.DesiredRun}
      - {name: minimum_isolation, type: weft.shared.IsolationLevel}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: artifact_digest, type: weft.shared.ArtifactDigest}
      - {name: restarts, type: Integer}
      - {name: restarts_in_window, type: Integer}
      - {name: health, type: weft.workloads.InstanceHealth}
      - {name: processes, type: List<weft.workloads.Process>}
      - {name: restart_policy, type: weft.workloads.RestartPolicy}
      - {name: state, type: weft.workloads.Instance.State}

  # Section 14 R6 (line 590), level form: pending instances asked to stop (StopAccountInstances);
  # no node holds them, so the controller withdraws each with StopInstance.
  # OPEN: which actor runs it. Smallest answer: Scheduler, which holds StopInstance's level step
  # for ServicesAboveScale too.
  - name: weft.workloads.PendingStopsToWithdraw
    source: weft.workloads.Instance
    consistency: read_your_writes
    filter:
      all:
        - state == Pending
        - desired == Stop
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: desired, type: weft.workloads.DesiredRun}
      - {name: state, type: weft.workloads.Instance.State}

  # Section 15 "Health": "Readiness gates traffic: an edge route, a link and a service binding
  # forward only to ready instances. A rollout step waits for the new instances to be ready
  # before it ends the old ones." The ready instances of one workload (a Service's workload, the
  # new workload of a rollout step): running and Ready. The edge, links, service bindings and the
  # deployments domain read this view; this domain only provides it.
  - name: weft.workloads.ReadyInstances
    source: weft.workloads.Instance
    consistency: read_your_writes
    params:
      - {name: workload_id, type: weft.shared.WorkloadId}
    filter:
      all:
        - workload_id == param.workload_id
        - state == Running
        - health == Ready
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: replica_index, type: Optional<Integer>}

  # Section 15 "Health", read by component: an edge route and a link name a component of a
  # formation in an environment (section 3), not a workload. The ready instances of every
  # workload of that component, through the instance's workload (one hop).
  # story:cloud-blocks-layer-refactor-pin (cloudspec layer rule): the workload names no formation
  # or environment; the component of one environment of one formation is named by the
  # component-level workload identity, which the workload holds.
  - name: weft.workloads.ComponentReadyInstances
    source: weft.workloads.Instance
    consistency: read_your_writes
    params:
      - {name: identity, type: weft.shared.WorkloadIdentity}
    filter:
      all:
        - workload_id.identity == param.identity
        - state == Running
        - health == Ready
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: replica_index, type: Optional<Integer>}
      - name: component
        type: Optional<weft.shared.ComponentName>
        field: {related: {via: workload_id, field: component}}

outcome_groups: