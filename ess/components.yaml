# Components and reconciliation bindings of weft. docs/domain-sketch.md § Structure "Planes"
# (lines 59-68), "Components" (lines 70-78), "Channels" (lines 93-101) and § 14 "Reconciliation"
# (lines 569-618).
#
# ESS gives every command one handler, the component that owns its domain (ESS-COMPONENT-004), and
# refuses a component that owns, accepts and publishes nothing (ESS-COMPONENT-007). So a domain
# sits with exactly one component, and that component accepts every command and publishes every
# event of it.
#
# Rule used to place a domain (the sketch names planes, not domains):
#   - weft-control: every domain with a command the node agent sends over its session (line 96,
#     "weft-node -> weft-control") or one of weft-control's own actors issues (Scheduler,
#     ReleaseController, ControlPlane; lines 63 and 73: "state store, scheduler, translators,
#     identity issuer, secret delivery"), as granted in ess/9-actors/actors.yaml.
#   - weft-api: every other domain. Line 61 names "Tenants, accounts, formations"; access is
#     weft-api's own (ManagementApi, line 122). The Translator writes formation rows as a client of
#     weft-api, the way a Deployer does.
#
# OPEN: the sketch's management plane also names "secrets, deploys" (line 62), while line 73 gives
# "secret delivery" and "translators" to weft-control. One domain has one owner, so `secrets` and
# `deployments` sit whole with weft-control here. Split them (custody and sources in weft-api;
# delivery, translation and releases in weft-control), or keep them whole in weft-control?
#
# OPEN: the user API (surfaces/http/weft-api.yaml, ess-http/1, line 83) routes the commands and
# views of one `reached_by: network` component. With this placement the user commands of the
# weft-control domains (DefineWorkload, CreateSecret, SubmitDeploymentSource, CreateVolume, ...)
# are served by weft-control, not weft-api: ESS has no gateway component that accepts a command
# on behalf of the owner of its domain. Either weft-control gets an HTTP binding of its own behind
# weft-api, or those domains move to weft-api and the node agent's reports then land on weft-api
# (against line 96). Which?
#
# UNMAPPED: weft-node (line 74, the node agent, worker plane) and weft-edge (line 75, the gateway
# in front of public endpoints, data plane) are not declared. No domain of the sketch is theirs:
# `nodes` is "the control plane's record of each node session" (line 47), a worker "holds no state
# the control plane does not know" (line 66), and endpoints, routes and the border are desired
# state of `formations`. ESS refuses a component that owns nothing ("`edge` owns nothing, accepts
# nothing and publishes nothing", ESS-COMPONENT-007, probed on ess 0.99.2). In the model the node
# agent is the actor weft.actors.NodeAgent, a client of weft-control as the CLI is of weft-api.
# Settled by a node-local domain (the process restart of R9, the local endpoint for identity and
# secrets of line 100) and an edge domain (the ready backends of each route, § 15 line 626).
#
# weft.shared (types only) and weft.actors (actors only) have no command and no event; no
# component owns them.

# Hardening pass 4 (2026-11-26): binding cluster-create-node-pool carries the cluster pool's id into
# the infrastructure pool it creates (`requested_for`), the one crossing below.
conversions:
  - from: weft.shared.ClusterNodePoolId
    to: Optional<Uuid>
    because: >-
      weft.infrastructure (layer 1) names no identifier of weft.cluster (layer 3), so it keeps the
      cluster pool a pool was made for as an opaque Uuid; only weft.cluster reads it back, to refuse
      an infrastructure pool made for another cluster pool.

