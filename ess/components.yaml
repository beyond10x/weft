    # D1: weft-api forwards the user commands of these domains here over an internal HTTP binding
    # (see the top). Line 96: the node's session also ends here.
    reached_by: network

  # Line 74: "the node agent (worker plane)"; line 65: "starts, observes and stops instances. Holds
  # no state the control plane does not know"; line 100: the instance's local endpoint.
  # Acts as NodeAgent (its own processes) and answers Instance (the local endpoint).
  # Consumes, as bindings below: workloads.AliveCheckFailed (R9), nodes.AssignmentEnded and
  # nodes.AssignmentReleased (R2, R3). The assignments themselves (R4) reach it over the node
  # channel (protocols/node-channel.yaml); StartProcess reads weft-control's record of them.
  # Publishes to weft-control: ProcessRestarted (r9-record-process-restarted).
  # Reached in process: the node dials out (line 96, "Workers open no inbound port"), and the local
  # endpoint is reachable from inside its instance only (line 100).
  - component: weft-node
    summary: >-
      The node agent: the processes of the instances assigned to its node, their restarts and
      backoff, and the local endpoint where an instance asks for its identity document and its
      secrets.
    owns:
      domains:
        - weft.node
    accepts:
      commands:
        - weft.node.CloseAssignmentEndpointSessions
        - weft.node.MarkRestartDue
        - weft.node.OpenLocalEndpointSession
        - weft.node.RequestIdentityDocument
        - weft.node.RequestSecret
        - weft.node.RestartProcess
        - weft.node.StartProcess
        - weft.node.StopAssignmentProcesses
        - weft.node.StopProcess
    publishes:
      events:
        - weft.node.IdentityDocumentRequested
        - weft.node.LocalEndpointSessionClosed
        - weft.node.LocalEndpointSessionOpened
        - weft.node.LocalProcessStarted
        - weft.node.LocalProcessStopped
        - weft.node.ProcessBackingOff
        - weft.node.ProcessRestartDue
        - weft.node.ProcessRestarted
        - weft.node.SecretRequested

  # Line 75: "the gateway in front of public endpoints (data plane)"; line 67: "traffic to
  # endpoints". Acts as EdgeGateway. Accepts no user command: its rows change through the bindings
  # below (formations route and endpoint events, workloads readiness events, its own
  # BackendSetChanged) and EdgeGateway's own commands.
  # Publishes: WakeRequested (r8-edge-wake, R8) and BackendSetChanged (r8-edge-forward).
  # OPEN: the public traffic it serves is no command of the model, so the component is reached in
  # process here; a request is the EdgeGateway's HoldRequest only when its service sleeps.
  - component: weft-edge
    summary: >-
      The edge gateway: the ready instances behind each route of a formation, the requests held
      while a sleeping service wakes, and the certificate of each public endpoint.
    owns:
      domains:
        - weft.edge
    accepts:
      commands:
        - weft.edge.DropRouteHeldRequests
        - weft.edge.ForwardHeldRequests
        - weft.edge.HoldRequest
        - weft.edge.MissHeldRequest
        - weft.edge.RecordBackendNotReady
        - weft.edge.RecordBackendReady
