# Components and reconciliation bindings of weft. docs/domain-sketch.md § Structure "Planes"
# (lines 59-68), "Components" (lines 70-78), "Channels" (lines 93-101) and § 14 "Reconciliation"
# (lines 569-618).
#
# ESS gives every command one handler, the component that owns its domain (ESS-COMPONENT-004), and
# refuses a component that owns, accepts and publishes nothing (ESS-COMPONENT-007). So a domain
# sits with exactly one component, and that component accepts every command and publishes every
# event of it.
#
# Rule used to place a domain (the sketch names planes, not domains):
#   - weft-control: every domain with a command the node agent sends over its session (line 96,
#     "weft-node -> weft-control") or one of weft-control's own actors issues (Scheduler,
#     ReleaseController, ControlPlane; lines 63 and 73: "state store, scheduler, translators,
#     identity issuer, secret delivery"), as granted in ess/9-actors/actors.yaml.
#   - weft-api: every other domain of the user's. Line 61 names "Tenants, accounts, formations";
#     access is weft-api's own (ManagementApi, line 122). The Translator writes formation rows as a
#     client of weft-api, the way a Deployer does.
#   - weft-node: weft.node, the node agent's records of its own node (line 74).
#   - weft-edge: weft.edge, the gateway's records in front of the public endpoints (line 75).
#
# D2 (the owner, 2026-11-26, design:components, "A: whole in weft-control"): the sketch's management
# plane also names "secrets, deploys" (line 62), while line 73 gives "secret delivery" and
# "translators" to weft-control. `secrets` and `deployments` stay whole in weft-control, no split;
# with D1 the user reaches them through weft-api.
#
# D1 (the owner, 2026-11-26, design:components, "A: weft-api forwards"): weft-api forwards the user
# commands of the weft-control domains (DefineWorkload, CreateSecret, SubmitDeploymentSource,
# CreateVolume, ...) to weft-control over an internal HTTP binding; the user sees one API, and each
# domain keeps one owner. Written here as weft-control `reached_by: network`: its accepted commands
# and the views of its domains get an HTTP surface of their own (ESS's derived routes), the one
# weft-api calls. Not taken: those domains moving to weft-api (the node agent's reports would land
# on weft-api, against line 96).
# OPEN (ESS): the forward itself has no form in ESS 0.99.2. A component accepts only the commands
# of the domains it owns (ESS-COMPONENT-004), `ess-http/1` binds each route to the component that
# accepts its command (its OpenAPI document is that component's), and nothing declares that
# weft-api presents, authorizes and relays a command another component accepts. So the user API
# is two surfaces in the model, weft-api's and weft-control's, behind one URL (sketch § 14 "the
# CLI reaches both through one URL"). ESS would need a component key such as `forwards:
# {commands, to}` that validate checks (the commands are accepted by `to`, `to` is reached by
# network) and that the OpenAPI projection merges into the forwarding component's document. No
# `ess-http/1` document is written: `surfaces/http/` does not exist in this repository yet, and a
# binding pins the specification's source digest, which no gate here holds.
#
# weft-node and weft-edge (design:components, step 1). Until 2026-11-26 neither was declared: no
# domain was theirs, and ESS refuses a component that owns nothing (ESS-COMPONENT-007, gap 1).
# weft.node (5-runtime/node.yaml) holds the process restarts of R9 and the local endpoint of line
# 100; weft.edge (5-runtime/edge.yaml) the ready backends of each route (§ 15), the requests held
# while a service wakes (R8) and the certificates of the public endpoints. A worker still "holds no
# state the control plane does not know" (line 66): every weft.node fact reaches weft-control by
# a binding below, which weft-control records (and stamps where a time is needed).
#
# weft.shared (types only) and weft.actors (actors only) have no command and no event; no
# component owns them.

# Hardening pass 4 (2026-11-26): binding cluster-create-node-pool carries the cluster pool's id into
# the infrastructure pool it creates (`requested_for`), the one crossing below.
conversions:
  - from: weft.shared.ClusterNodePoolId
    to: Optional<Uuid>
    because: >-
      weft.infrastructure (layer 1) names no identifier of weft.cluster (layer 3), so it keeps the
      cluster pool a pool was made for as an opaque Uuid; only weft.cluster reads it back, to refuse
      an infrastructure pool made for another cluster pool.
  # Hardening pass 5: a stamped instant is stored as a plain one. No conversion runs the other way
  # (tools/check-stamped-time.sh refuses one), so only a stamped value reaches a stamped input.
  - from: weft.shared.StampedAt
    to: Timestamp
    because: >-
      An instant weft-control stamped is an instant; the rows and events that keep it compare it
      with `now` like any other. The type marks the command input, where the caller would
      otherwise name its own time.
  - from: weft.shared.StampedAt
    to: Optional<Timestamp>
    because: >-
      As above, for a row field that is empty until weft-control first stamps it
      (identity.TrustDomain.rotation_ends_at, workloads.Schedule.last_fired_at).

