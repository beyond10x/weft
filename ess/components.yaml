# Reconciliation loops, § 14 lines 584-618, in the four forms of lines 594-606 (edge, level, time,
# many rows) the domains support since wave 4 (docs/open-questions.md, wave 4 sections; their
# decisions are taken as final here).
#
# Every edge step and every many-rows step is one binding below (lines 595-596 and 605-606).
# Level and time steps are not bindings: a controller actor reads a gap view and runs one command
# per row (lines 597-604). They are listed in the block at the top of `bindings:`, so all of R1-R9
# reads in one place.
#
# Every binding is `delivery: at_least_once`: an edge can be delivered twice, and a lost one is
# repaired by the level step of the same loop where one exists. `on_failure` names each refusal
# of the invoked command:
#   - `drop` only for a refusal named harmless at the binding, with the reason beside it (most
#     often: a repeated delivery, or the row already moved on by another step);
#   - `escalate` where the domain declares an escalation event (only deployments.DriftEscalated);
#   - `retry` for a transient refusal, for a refusal the event rules out ("cannot follow"), and
#     for a transport failure (the `except:` fallback).
#
# OPEN: apart from DriftEscalated no domain declares an escalation event, so a refusal that is
# neither harmless nor transient is retried unbounded, which is loud but never ends. Each is named
# at its binding with the event its domain would add.
#
# The node agent's Record* call is the one source of an observation (line 607): no binding below
# records an observation, and no binding invokes a NodeAgent command.

bindings:
  # ---------------------------------------------------------------------------------------------
  # Level and time steps (lines 597-604): gap view -> command -> actor. The actor reads the view
  # (granted in ess/9-actors/actors.yaml) and runs the command once per row; the command's guard
  # holds the rule, the actor's clock or read is the trigger.
  #
  #   R1 level  workloads.ServicesBelowScale      -> workloads.RequestReplica       -> Scheduler
  #             (the row's service_id; the replica index is the lowest index below `replicas` that
  #             workloads.InstanceList shows no live instance for)
  #   R1 level  workloads.ServicesAboveScale      -> workloads.StopInstance         -> Scheduler
  #             (scale-in and draining to sleep: the live instance of the highest replica index)
  #   R1 level  deployments.RunningRolloutSteps   -> deployments.CompleteRolloutStep -> ReleaseController
  #             (ready_replicas: the row count of workloads.ReadyInstances(workload_id))
  #   R2 level  nodes.StoppedActiveAssignments    -> nodes.EndAssignment            -> Scheduler
  #             (repairs a lost r2-end-assignment-on-stopped delivery)
  #   R2 time   workloads.ServiceBackoffsDue      -> workloads.EndReplicaBackoff    -> Scheduler
  #   R3 time   nodes.SilentNodeSessions          -> nodes.LoseNodeSession          -> ControlPlane
  #   R3 time   nodes.ExpiredLeases               -> nodes.ReleaseAssignment        -> ControlPlane
  #   R3 time   scheduling.OverdueUnassignedPlacements -> scheduling.ReleasePlacement -> Scheduler
  #             (a Bound placement no node took within 120 s; `released-unassigned` evicts its
  #             instance through r3-evict-on-unassigned-release; read-granted to the Scheduler)
  #   R4 level  scheduling.UnassignedPlacements   -> nodes.Assign                   -> Scheduler
  #             (repairs a lost or dropped r4-assign delivery, `assigned_at` from the
  #             Scheduler's clock; an `already-assigned` answer is followed by
  #             scheduling.RecordPlacementAssigned for the row)
  #   R6 level  workloads.PendingStopsToWithdraw  -> workloads.StopInstance         -> Scheduler
  #   R7 level  deployments.OpenDrifts            -> deployments.ReapplyDrift (row with step_id)
  #                                                  or deployments.EscalateDrift   -> ReleaseController
  #   R8 level  workloads.ServicesBelowScale (Waking rows) -> workloads.RequestReplica -> Scheduler
  #   R8 time   workloads.WakesOverdue            -> workloads.MissWake             -> Scheduler
  #   (§ 16)    observability.LogStreamsPastRetention -> observability.ExpireLogStream -> ControlPlane
  #   (clusters) cluster.UnlinkedClusterNodePools + infrastructure.TenantNodePools
  #                                               -> cluster.RecordClusterNodePoolReady (Requested rows)
  #                                                  or RecordRemovedClusterNodePool (Removed rows) -> ControlPlane
  #   (clusters) cluster.RemovedClusterNodePools  -> infrastructure.DrainNodePool    -> ControlPlane
  #   (clusters) infrastructure.DrainingPoolNodes -> infrastructure.DrainNode or RemoveNode -> ControlPlane
  #   (clusters) infrastructure.DrainingNodePools -> infrastructure.DeleteNodePool   -> ControlPlane
  #             (block "Tenant clusters" below, hardening pass 4)
  #
  # R9 (line 593) is node-local: workloads.AliveCheckFailed (`restart: true`) reaches weft-node,
  # which restarts the process and records it with workloads.RecordProcessRestarted (NodeAgent).
  # weft-node is no component here (see the top), so that step is neither a binding nor a level
  # step of weft-control; RecordProcessRestarted is the record line 593 asks for.
  #
  # OPEN: the time commands of system actors without a gap view, so the actor has no row to
  # read: access.ExpireLogin, access.ExpireApiToken (ManagementApi), identity.ExpireIdentityDocument
  # (ControlPlane), workloads.ExpireInvocation (Scheduler). None is a step of R1-R9.

  # ---------------------------------------------------------------------------------------------
  # R1 (line 585): rollout step started -> the workload's desired replica count set; the Scheduler
  # fills the gap.
  # Edge 1: a rollout step started sets the desired replica count of its workload's Service
  # (workloads.SetWorkloadReplicas, addressed by workload_id: a workload has at most one Service).
  # deployments.AddReleaseStep requires `replicas` on a rollout step and StartReleaseStep requires
  # `workload_id`, so a Rollout event carries both; the `defined` conjuncts keep the mapping total.
  - id: r1-set-workload-replicas
    summary: Set the desired replica count of the workload a rollout step started.
    when:
      event: weft.deployments.ReleaseStepStarted
      where: [event.kind == Rollout, defined(event.workload_id), defined(event.replicas)]
    invoke:
      command: weft.workloads.SetWorkloadReplicas
    mapping:
      workload_id: event.workload_id
      replicas: event.replicas
    delivery: at_least_once
    on_failure:
      # workload-retired: harmless; a retired workload's release was replaced by a newer
      # revision's, whose own rollout step sets its count (as r1-create-replica drops it).
      # not-a-service: harmless; only a Service holds a desired replica count. OPEN: a Rollout
      # step of another shape (a Daemon, deployments.yaml OPEN on ReleaseStep.replicas) reaches
      # its instances by no loop yet.
      drop: [workload-retired, not-a-service]
      # no-service and not-awake are transient: the Service is defined by its caller after the
      # workload (DefineService), and a draining or waking service returns to Awake. OPEN: an
      # Asleep service stays Asleep until a wake, so its rollout step is retried until then; and
      # below-bounds and above-bounds (the release's count outside the Service's ScaleRule) are
      # not transient and have no escalation event: workloads.yaml would add
      # `WorkloadReplicasRefused(workload_id, replicas)`, or deployments.AddReleaseStep would read
      # the bounds. negative-replicas cannot follow (AddReleaseStep refuses a negative count).
      # OPEN: no-workload is retried, unbounded if the step names a workload that never exists;
      # deployments.StartReleaseStep does not check the workload. A transport failure is retried.
      retry: {except: [workload-retired, not-a-service]}
  #
  # Level: ServicesBelowScale -> RequestReplica (block above). Edge: the requested replica becomes
  # an instance.
  - id: r1-create-replica
    summary: Create the instance of a replica the Scheduler requested.
    when:
      event: weft.workloads.ReplicaRequested
    invoke:
      command: weft.workloads.CreateInstance
    mapping:
      workload_id: event.workload_id
      service_id: event.service_id
      replica_index: event.replica_index
    delivery: at_least_once
    on_failure:
      # replica-live: harmless; a repeated delivery of this ReplicaRequested, whose first delivery
      # created the instance (workloads.yaml CreateInstance: "the binding drops this answer").
      # workload-retired: harmless; a retired workload takes no new instance, and its service is
      # retired with it or replaced by the new revision's.
      drop: [replica-live, workload-retired]
      # over-quota is transient (a quota raised or freed admits it). no-workload, no-service and
      # the foreign-* refusals cannot follow (RequestReplica read the service, which names the
      # workload); no-job, no-invocation, no-box, no-session and no-warm-pool read inputs this
      # binding leaves absent. A transport failure is retried.
      retry: {except: [replica-live, workload-retired]}

  # Edge: a created instance is submitted to the scheduler (line 596; scheduling.yaml
  # SubmitSchedulingRequest). A Job's instances are skipped: a gang member must carry its gang,
  # which workloads does not know (docs/open-questions.md "scheduling and claims", taken: skip until
  # gangs get their own loop); the control plane submits them with gang_id.
  # OPEN: a Job instance outside a gang is skipped too (the event cannot tell the two apart), so
  # it is submitted by the control plane like a gang member. Settled by the gang id on
  # workloads.Instance and InstanceCreated, or by a loop of its own for Job tasks.
  - id: r1-submit-scheduling-request
    summary: Ask the scheduler to place an instance as soon as it is created.
    when:
      event: weft.workloads.InstanceCreated
      where: [not defined(event.job_id)]
    invoke:
      command: weft.scheduling.SubmitSchedulingRequest
    mapping:
      instance_id: event.instance_id
      account_id: event.account_id
      formation_id: event.formation_id
      claims: event.claims
      min_isolation: event.minimum_isolation
      zones: event.zones
      priority: event.priority
    delivery: at_least_once
    on_failure:
      # already-requested: harmless; a repeated delivery of this InstanceCreated.
      drop: [already-requested]
      # unknown-priority and retired-priority are retried until the operator defines the class
      # (cluster.DefinePriorityClass); the workload references it (workloads.yaml
      # Workload.priority_class) but DefineWorkload does not check it (OPEN there). OPEN: no-claims (a workload defined with no claim) is not
      # transient and has no escalation event: scheduling.yaml would add
      # `SchedulingRequestRefused(instance_id, reason)`, or workloads.DefineWorkload would refuse
      # an empty claim list. unknown-account cannot follow (the workload names an existing
      # account); unknown-gang, gang-closed and gang-of-other-tenant read a gang_id this binding
      # leaves absent. A transport failure is retried.
      retry: {except: [already-requested]}
  # The Scheduler's choice of a node (scheduling.PlaceInstance) is a decision, not a reaction; it
  # stays a command the Scheduler runs for each pending request. R1 continues at R4.
  # The release goes live once its rollout steps saw ready instances: level step
  # RunningRolloutSteps -> CompleteRolloutStep (block above).

  # ---------------------------------------------------------------------------------------------
  # R4 (line 588): placement bound -> assignment sent to the node.
  # Edge 1: a placement the Scheduler made is bound (scheduling.yaml BindPlacement: "a single
  # instance's reservation is committed and its request answered").
  - id: r4-bind-placement
    summary: Bind a single instance's placement as soon as the Scheduler made it.
    when:
      event: weft.scheduling.InstancePlaced
    invoke:
      command: weft.scheduling.BindPlacement
    mapping:
      decision_id: event.decision_id
      request_id: event.request_id
    delivery: at_least_once
    on_failure:
      # gang-member: harmless; a gang member is bound only by BindGang with its whole gang (§ 10
      # line 458). wrong-state: harmless; the placement was already bound, or released or preempted
      # before the binding ran, and its request is answered by that move.
      drop: [gang-member, wrong-state]
      # no-such-placement and other-request cannot follow from this event (same decision, same
      # request); a transport failure is retried.
      retry: {except: [gang-member, wrong-state]}
  # OPEN: a gang's members get no PlacementBound (scheduling BindGang emits only GangBound;
  # docs/open-questions.md "nodes", TODO), so edges 2 and 3 do not reach them; the level step on
  # UnassignedPlacements does (block above), as their decisions are Bound and unassigned.

  # Edge 2: the bound placement becomes an assignment on its node (nodes.yaml Assign finds the
  # node's open session itself).
  - id: r4-assign
    summary: Send a bound placement to its node as an assignment.
    when:
      event: weft.scheduling.PlacementBound
    invoke:
      command: weft.nodes.Assign
    mapping:
      instance_id: event.instance_id
      node_id: event.node_id
      placement_decision_id: event.decision_id
      # The lease starts at the decision instant the Scheduler stamped (scheduling PlaceInstance
      # `decided_at`); a binding has no clock of its own, and a later delivery only shortens the
      # first lease (weft-sim full setup, 2026-11-26).
      assigned_at: event.decided_at
    delivery: at_least_once
    on_failure:
      # already-assigned: harmless; a repeated delivery, the first created the assignment.
      # placement-not-bound: harmless; the placement was released or preempted before the
      # assignment was sent, and that move answers its request.
      # no-open-session: PlaceInstance refuses a node with no open session (`node-not-connected`),
      # so this answer follows only a session lost between the placement and this delivery.
      # Retrying it ran without bound (weft-sim full setup, 2026-11-26: one PlaceInstance over
      # 250 s); dropped, the placement stays Bound and unassigned in
      # scheduling.UnassignedPlacements, whose level step assigns it once the node redials. A
      # node that never redials: the time step on scheduling.OverdueUnassignedPlacements releases
      # the placement 120 s after the decision, and r3-evict-on-unassigned-release evicts its
      # instance so R1 requests the replica again (weft-sim stuck-placement, 2026-11-26).
      drop: [already-assigned, placement-not-bound, no-open-session]
      # node-not-ready is transient (a cordon or drain ends; § 11). OPEN:
      # isolation-unavailable (the node no longer offers the placement's isolation) is not
      # transient and has no escalation event: nodes.yaml would add
      # `AssignmentRefused(placement_decision_id, reason)` for the Scheduler to release and
      # re-place. no-such-placement and placement-mismatch cannot follow (the event is the bound
      # decision); assigned-in-future cannot follow (decided_at was not after `now` when placed). A
      # transport failure is retried.
      retry: {except: [already-assigned, placement-not-bound, no-open-session]}

  # Edge 3: the instance records where it runs (workloads.yaml ScheduleInstance; it moves from
  # Pending to Scheduled, the state the node's first report starts from).
  - id: r4-schedule-instance
    summary: Record on the instance the node and isolation its placement chose.
    when:
      event: weft.scheduling.PlacementBound
    invoke:
      command: weft.workloads.ScheduleInstance
    mapping:
      instance_id: event.instance_id
      node_id: event.node_id
      isolation: event.isolation
    delivery: at_least_once
    on_failure:
      # wrong-state: harmless; a repeated delivery (already Scheduled), or the instance was
      # stopped and withdrawn while pending.
      drop: [wrong-state]
      # below-minimum-isolation cannot follow (PlaceInstance chose at least the request's minimum,
      # which is the instance's); no-such-instance cannot follow. A transport failure is retried.
      retry: {except: [wrong-state]}

  # Edge 4: the assignment exists; the decision leaves UnassignedPlacements (scheduling.yaml
  # RecordPlacementAssigned).
  - id: r4-record-placement-assigned
    summary: Mark a placement assigned once its node holds the assignment.
    when:
      event: weft.nodes.InstanceAssigned
    invoke:
      command: weft.scheduling.RecordPlacementAssigned
    mapping:
      decision_id: event.placement_decision_id
    delivery: at_least_once
    on_failure:
      # not-bound: harmless; the placement was released or preempted after the assignment was
      # made, and the assignment ends by R2 or R3.
      drop: [not-bound]
      # no-such-placement cannot follow (Assign checked the placement); a transport failure is
      # retried.
      retry: {except: [not-bound]}

  # ---------------------------------------------------------------------------------------------
  # R2 (line 586): instance exited or failed under a restart policy -> a new instance, with backoff.
  # The node records the end itself (workloads.RecordInstanceExited / RecordInstanceFailed,
  # NodeAgent; line 607). Edge 1: the node observed the instance stopped; its assignment ends
  # (nodes.yaml EndAssignment: "An assignment ends only once the node reported the instance
  # stopped"). Also serves R6 (an instance stopped) and a Job or Invocation that ran to completion.
  - id: r2-end-assignment-on-stopped
    summary: End an assignment once its node observed the instance stopped.
    when:
      event: weft.nodes.InstanceObservationRecorded
      where: [event.observed == Stopped]
    invoke:
      command: weft.nodes.EndAssignment
    mapping:
      assignment_id: event.assignment_id
    delivery: at_least_once
    on_failure:
      # not-active: harmless; the assignment already ended (a repeated observation) or was released
      # when its lease ended (R3), and either move freed it.
      drop: [not-active]
      # no-such-assignment and stop-not-observed cannot follow from this event (InstanceObserved
      # checked the assignment; the event is the stop observation); a transport failure is retried.
      retry: {except: [not-active]}

  # Edge 2: the ended assignment frees its placement's units (scheduling.yaml ReleasePlacement).
  - id: r2-release-placement-on-end
    summary: Release the placement of an assignment that ended.
    when:
      event: weft.nodes.AssignmentEnded
    invoke:
      command: weft.scheduling.ReleasePlacement
    mapping:
      decision_id: event.placement_decision_id
    delivery: at_least_once
    on_failure:
      # wrong-state: harmless; the placement was already released (a repeated delivery) or
      # preempted, and that move freed its units.
      drop: [wrong-state]
      # no-such-placement cannot follow (the assignment names its decision). assignment-pending
      # follows only while the delivery of r4-record-placement-assigned is outstanding, and is
      # transient (that delivery, or the decision's 120 s, ends it). A transport failure is
      # retried.
      retry: {except: [wrong-state]}

  # Edge 3: an ended replica leaves its service's live count (workloads.yaml RecordReplicaEnded);
  # the level step on ServicesBelowScale then requests its replacement once the backoff ended
  # (time step on ServiceBackoffsDue). An exit backs off when the restart policy restarts it
  # (`backoff: event.restart`).
  - id: r2-replica-ended-on-exit
    summary: Take an exited replica out of its service's live count.
    when:
      event: weft.workloads.InstanceExited
      where: [defined(event.service_id)]
    invoke:
      command: weft.workloads.RecordReplicaEnded
    mapping:
      service_id: event.service_id
      instance_id: event.instance_id
      backoff: event.restart
    delivery: at_least_once
    on_failure: &replica-ended-failure
      # already-counted: harmless; a repeated delivery, the instance is already counted out.
      drop: [already-counted]
      # no-such-service, no-instance, other-service and instance-live cannot follow (the event is
      # the end of this service's instance). OPEN: count-empty (the count is already 0) means the
      # count drifted from the live instances; it is not transient and workloads.yaml has no
      # escalation event (it would add `ReplicaCountDrifted(service_id)`). A transport failure is
      # retried.
      retry: {except: [already-counted]}

  # Edge 3 for a failure: every failure backs off, so a replica whose artifact the node rejected
  # does not loop without a wait (docs/open-questions.md "workloads loops", decided).
  - id: r2-replica-ended-on-failure
    summary: Take a failed replica out of its service's live count, with backoff.
    when:
      event: weft.workloads.InstanceFailed
      where: [defined(event.service_id)]
    invoke:
      command: weft.workloads.RecordReplicaEnded
    mapping:
      service_id: event.service_id
      instance_id: event.instance_id
      backoff: true
    delivery: at_least_once
    on_failure: *replica-ended-failure

  # ---------------------------------------------------------------------------------------------
  # R3 (line 587): node session lost, lease ended -> its instances evicted and rescheduled.
  # Time steps: SilentNodeSessions -> LoseNodeSession, ExpiredLeases -> ReleaseAssignment (block
  # above; ESS refuses `now` in an `affects:` filter, so each lease ends once per row).
  # Edge 1: an assignment released because its lease ended evicts its instance (§ 11 line 476:
  # "a lost node's instances are rescheduled after the lease ends"; ReleaseAssignment refuses while
  # the lease holds, so the reason is NodeLost).
  - id: r3-evict-on-lease-end
    summary: Evict the instance of an assignment released because its lease ended.
    when:
      event: weft.nodes.AssignmentReleased
    invoke:
      command: weft.workloads.EvictInstance
    mapping:
      instance_id: event.instance_id
      reason: NodeLost
    delivery: at_least_once
    on_failure:
      # wrong-state: harmless; the instance already left its live states (exited, failed, stopped
      # or evicted before the lease ended), so there is nothing to evict.
      drop: [wrong-state]
      # over-budget cannot follow: its check speaks of a drain, and a lost node is no voluntary
      # disruption (OPEN below). no-such-instance cannot follow (the assignment names an instance
      # workloads created). A transport failure is retried.
      retry: {except: [wrong-state]}
  # OPEN: EvictInstance's `over-budget` refusal does not name the reason; the bindings take it as
  # never answered for reason NodeLost (docs/open-questions.md "components and bindings", taken).
  # Should workloads.yaml guard it on `input.reason != NodeLost`?

  # Edge 2: the released assignment frees its placement's units.
  - id: r3-release-placement-on-lease-end
    summary: Release the placement of an assignment released because its lease ended.
    when:
      event: weft.nodes.AssignmentReleased
    invoke:
      command: weft.scheduling.ReleasePlacement
    mapping:
      decision_id: event.placement_decision_id
    delivery: at_least_once
    on_failure:
      # wrong-state: harmless; the placement was already released or preempted.
      drop: [wrong-state]
      # no-such-placement cannot follow; assignment-pending is transient (as at
      # r2-release-placement-on-end). A transport failure is retried.
      retry: {except: [wrong-state]}

  # Edge 1 for a placement no lease covers: a Bound placement its node never took was released
  # on time (scheduling.ReleasePlacement `released-unassigned`, time step on
  # OverdueUnassignedPlacements); its instance, Scheduled on that node, is evicted for NodeLost,
  # and edge 3 (r3-replica-ended-on-eviction) lets R1 request the replica again.
  - id: r3-evict-on-unassigned-release
    summary: Evict the instance of a placement released because its node never took it.
    when:
      event: weft.scheduling.UnassignedPlacementReleased
    invoke:
      command: weft.workloads.EvictInstance
    mapping:
      instance_id: event.instance_id
      reason: NodeLost
    delivery: at_least_once
    on_failure:
      # wrong-state: harmless; the instance already left its live states (stopped and withdrawn
      # while placed), so there is nothing to evict.
      drop: [wrong-state]
      # over-budget cannot follow for NodeLost (OPEN at r3-evict-on-lease-end); no-such-instance
      # cannot follow (the decision names an instance workloads created). A transport failure is
      # retried.
      retry: {except: [wrong-state]}

  # Edge 3, the reschedule: an evicted replica leaves its service's count without backoff, and R1
  # creates a new instance whose InstanceCreated is submitted to the scheduler
  # (docs/open-questions.md "workloads loops", decided). Also serves a preempted or drained replica.
  - id: r3-replica-ended-on-eviction
    summary: Take an evicted replica out of its service's live count.
    when:
      event: weft.workloads.InstanceEvicted
      where: [defined(event.service_id)]
    invoke:
      command: weft.workloads.RecordReplicaEnded
    mapping:
      service_id: event.service_id
      instance_id: event.instance_id
      backoff: false
    delivery: at_least_once
    on_failure: *replica-ended-failure

  # ---------------------------------------------------------------------------------------------
  # R5 (line 589): claim released -> its bindings released, devices wiped. Many rows: every
  # still-Reserved binding of the claim is released in one outcome (claims.yaml
  # ReleaseClaimBindings). Devices wiped: an Active binding's devices go to Wiping in
  # ReleaseBinding, which runs before a claim can be released, and the node reports the wipe
  # (inventory.ReportDeviceWiped, NodeAgent); a Reserved binding holds no device.
  - id: r5-release-claim-bindings
    summary: Release the bindings a released claim still reserves.
    when:
      event: weft.claims.ClaimReleased
    invoke:
      command: weft.claims.ReleaseClaimBindings
    mapping:
      claim_id: event.claim_id
    delivery: at_least_once
    # no-such-claim and claim-not-released cannot follow (the event is the claim's release); a
    # repeated delivery releases nothing and succeeds. A transport failure is retried.
    on_failure: retry
  # OPEN: ReleaseClaim on a Bound claim is refused (docs/open-questions.md "scheduling and claims",
  # taken), so R5 relies on ReleaseBinding having wiped the devices first (claims.yaml).

  # ---------------------------------------------------------------------------------------------
  # R6 (line 590): account closed -> its exports revoked, tokens expired, instances stopped. Many
  # rows: one command per domain and entity moves every matching row (ESS-COMMAND-009), each
  # invoked by one binding on accounts.AccountClosed (docs/open-questions.md "account close",
  # decided). Each command refuses while the account is open (deny by default); that refusal and
  # a missing account cannot follow from this event, so every binding retries only transport
  # failures, except the two observability bindings named below. A repeated delivery moves no row
  # and succeeds.
  - id: r6-revoke-account-exports
    summary: Revoke the exports from and to a closed account.
    when:
      event: weft.accounts.AccountClosed
    invoke:
      command: weft.formations.RevokeAccountExports
    mapping:
      account_id: event.account_id
    delivery: at_least_once
    on_failure: retry

  - id: r6-revoke-account-api-tokens
    summary: Revoke the live API tokens of a closed account.
    when:
      event: weft.accounts.AccountClosed
    invoke:
      command: weft.access.RevokeAccountApiTokens
    mapping:
      account_id: event.account_id
    delivery: at_least_once
    on_failure: retry

  # Instances stopped: every live instance is asked to stop; a node stops its running ones and
  # reports each end (R2), and a pending one no node holds is withdrawn by the level step on
  # PendingStopsToWithdraw (block above).
  - id: r6-stop-account-instances
    summary: Ask every live instance of a closed account to stop.
    when:
      event: weft.accounts.AccountClosed
    invoke:
      command: weft.workloads.StopAccountInstances
    mapping:
      account_id: event.account_id
    delivery: at_least_once
    on_failure: retry

  # With R1: the closed account's services retire, so the level step requests none of their
  # replicas again.
  - id: r6-retire-account-services
    summary: Retire every service of a closed account.
    when:
      event: weft.accounts.AccountClosed
    invoke:
      command: weft.workloads.RetireAccountServices
    mapping:
      account_id: event.account_id
    delivery: at_least_once
    on_failure: retry

  # A withdrawn replica (a pending one stopped before any node held it) leaves its service's count
  # like any other end (workloads.yaml RecordReplicaEnded: "InstanceWithdrawn ... `backoff: false`").
  - id: r6-replica-ended-on-withdrawal
    summary: Take a withdrawn replica out of its service's live count.
    when:
      event: weft.workloads.InstanceWithdrawn
      where: [defined(event.service_id)]
    invoke:
      command: weft.workloads.RecordReplicaEnded
    mapping:
      service_id: event.service_id
      instance_id: event.instance_id
      backoff: false
    delivery: at_least_once
    on_failure: *replica-ended-failure

  # Telemetry configuration of the closed account (§ 16; docs/open-questions.md "account close").
  - id: r6-delete-account-alert-rules
    summary: Delete the alert rules of a closed account.
    when:
      event: weft.accounts.AccountClosed
    invoke:
      command: weft.observability.DeleteAccountAlertRules
    mapping:
      account_id: event.account_id
    delivery: at_least_once
    on_failure: retry

  - id: r6-remove-account-telemetry-policies
    summary: Remove the telemetry policies of a closed account.
    when:
      event: weft.accounts.AccountClosed
    invoke:
      command: weft.observability.RemoveAccountTelemetryPolicies
    mapping:
      account_id: event.account_id
    delivery: at_least_once
    on_failure: retry

  # in-use: transient; a sink stays while a policy of the account names it, and
  # r6-remove-account-telemetry-policies removes those (docs/open-questions.md "account close":
  # "sinks and targets retry until policies and rules are gone").
  - id: r6-remove-account-telemetry-sinks
    summary: Remove the telemetry sinks of a closed account once no policy names them.
    when:
      event: weft.accounts.AccountClosed
    invoke:
      command: weft.observability.RemoveAccountTelemetrySinks
    mapping:
      account_id: event.account_id
    delivery: at_least_once
    on_failure: retry

  # in-use: transient; a target stays while an alert rule names it, and
  # r6-delete-account-alert-rules deletes those.
  - id: r6-remove-account-notification-targets
    summary: Remove the notification targets of a closed account once no rule names them.
    when:
      event: weft.accounts.AccountClosed
    invoke:
      command: weft.observability.RemoveAccountNotificationTargets
    mapping:
      account_id: event.account_id
    delivery: at_least_once
    on_failure: retry

  # A deleted rule's open alerts resolve (observability.yaml ResolveDeletedRuleAlerts). Serves a
  # rule deleted by hand as well as one deleted by the account cascade.
  - id: r6-resolve-deleted-rule-alerts
    summary: Resolve the open alerts of an alert rule that was deleted.
    when:
      event: weft.observability.AlertRuleDeleted
    invoke:
      command: weft.observability.ResolveDeletedRuleAlerts
    mapping:
      alert_rule_id: event.alert_rule_id
    delivery: at_least_once
    # no-such-rule and rule-active cannot follow (the event is the rule's deletion); a repeated
    # delivery resolves nothing and succeeds. A transport failure is retried.
    on_failure: retry
  # OPEN: tokens are revoked (RevokeAccountApiTokens), not expired as line 590 says; the CLI
  # logins of the account's principals and the account's boxes, sessions, jobs, schedules,
  # triggers and warm pools have no step (docs/open-questions.md "workloads loops", OPEN).

  # ---------------------------------------------------------------------------------------------
  # An ended instance's telemetry (§ 16; docs/open-questions.md "account close": "Instance ended
  # (InstanceExited/Failed/Evicted) -> CloseInstanceLogStreams, RetireInstanceMetricSeries").
  # Serves R2, R3 and R6. unknown-instance and instance-live cannot follow (the event is the end
  # of a known instance); a repeated delivery moves no row and succeeds. A transport failure is
  # retried.
  - id: telemetry-close-log-streams-on-exit
    summary: Close the log streams of an instance that exited.
    when:
      event: weft.workloads.InstanceExited
    invoke:
      command: weft.observability.CloseInstanceLogStreams
    mapping:
      instance_id: event.instance_id
    delivery: at_least_once
    on_failure: retry

  - id: telemetry-close-log-streams-on-failure
    summary: Close the log streams of an instance that failed.
    when:
      event: weft.workloads.InstanceFailed
    invoke:
      command: weft.observability.CloseInstanceLogStreams
    mapping:
      instance_id: event.instance_id
    delivery: at_least_once
    on_failure: retry

  - id: telemetry-close-log-streams-on-eviction
    summary: Close the log streams of an instance that was evicted.
    when:
      event: weft.workloads.InstanceEvicted
    invoke:
      command: weft.observability.CloseInstanceLogStreams
    mapping:
      instance_id: event.instance_id
    delivery: at_least_once
    on_failure: retry

  - id: telemetry-retire-series-on-exit
    summary: Retire the metric series of an instance that exited.
    when:
      event: weft.workloads.InstanceExited
    invoke:
      command: weft.observability.RetireInstanceMetricSeries
    mapping:
      instance_id: event.instance_id
    delivery: at_least_once
    on_failure: retry

  - id: telemetry-retire-series-on-failure
    summary: Retire the metric series of an instance that failed.
    when:
      event: weft.workloads.InstanceFailed
    invoke:
      command: weft.observability.RetireInstanceMetricSeries
    mapping:
      instance_id: event.instance_id
    delivery: at_least_once
    on_failure: retry

  - id: telemetry-retire-series-on-eviction
    summary: Retire the metric series of an instance that was evicted.
    when:
      event: weft.workloads.InstanceEvicted
    invoke:
      command: weft.observability.RetireInstanceMetricSeries
    mapping:
      instance_id: event.instance_id
    delivery: at_least_once
    on_failure: retry

  # ---------------------------------------------------------------------------------------------
  # R7 (line 591): drift recorded -> the release step re-applied or the drift escalated
  # (deployments.yaml ReapplyDrift, EscalateDrift). Edge 1: a drift with a step re-applies it; a
  # refusal that leaves the drift unrepaired is the escalation.
  - id: r7-reapply-drift
    summary: Re-apply the rollout step a drift names, or escalate the drift.
    when:
      event: weft.deployments.DriftDetected
      where: [defined(event.step_id)]
    invoke:
      command: weft.deployments.ReapplyDrift
    mapping:
      drift_id: event.drift_id
      release_id: event.release_id
      step_id: event.step_id
    delivery: at_least_once
    on_failure:
      # wrong-state: harmless; the drift is no longer Open (a repeated delivery, or the level step
      # acted on it first).
      drop: [wrong-state]
      # release-not-live and step-not-reappliable: the step cannot run again, so a person is told.
      # The missing-row and mismatch refusals cannot follow (the event names a recorded drift,
      # its release and its step) and would be a defect, so they escalate too.
      escalate:
        emits: weft.deployments.DriftEscalated
        outcomes:
          - release-not-live
          - step-not-reappliable
          - no-such-drift
          - no-such-release
          - no-such-step
          - drift-mismatch
      # A transport failure is retried.
      retry:
        except:
          - wrong-state
          - release-not-live
          - step-not-reappliable
          - no-such-drift
          - no-such-release
          - no-such-step
          - drift-mismatch

  # Edge 2: a drift no step covers is escalated at once.
  - id: r7-escalate-drift
    summary: Escalate a drift no release step covers.
    when:
      event: weft.deployments.DriftDetected
      where: [not defined(event.step_id)]
    invoke:
      command: weft.deployments.EscalateDrift
    mapping:
      drift_id: event.drift_id
      release_id: event.release_id
    delivery: at_least_once
    on_failure: &escalate-drift-failure
      # wrong-state: harmless; the drift is already escalated, reapplying or resolved.
      drop: [wrong-state]
      # no-such-drift and drift-mismatch cannot follow (the event names the drift and its
      # release); a transport failure is retried.
      retry: {except: [wrong-state]}

  # Edge 3: the escalation r7-reapply-drift emits moves no row (ESS's `escalate` emits an event and
  # invokes no command), so the drift would stay Open and the level step would re-apply it again.
  # This binding records the escalation on the drift; the DriftEscalated that EscalateDrift emits
  # in turn meets an Escalated drift and is dropped. Takes the smallest answer of the OPEN on
  # EscalateDrift in deployments.yaml.
  # OPEN: confirm that an escalated drift leaves OpenDrifts (this binding) rather than staying Open.
  - id: r7-record-drift-escalation
    summary: Record on the drift that it was escalated.
    when:
      event: weft.deployments.DriftEscalated
    invoke:
      command: weft.deployments.EscalateDrift
    mapping:
      drift_id: event.drift_id
      release_id: event.release_id
    delivery: at_least_once
    on_failure: *escalate-drift-failure

  # ---------------------------------------------------------------------------------------------
  # R8 (line 592): wake requested -> an instance scheduled; deadline missed -> named failure.
  # Edge: a recorded wake turns an asleep service into a waking one (workloads.yaml StartWaking:
  # "An asleep service starts waking; a service draining to sleep stays awake"). Then the level
  # step requests the replicas of the Waking service (ServicesBelowScale, block above) and R1 and
  # R4 schedule them; the time step on WakesOverdue gives a wake past its deadline the named
  # answer WakeMissed.
  - id: r8-start-waking
    summary: Start waking the service a wake request names.
    when:
      event: weft.workloads.WakeRequested
    invoke:
      command: weft.workloads.StartWaking
    mapping:
      service_id: event.service_id
    delivery: at_least_once
    on_failure:
      # retired, over-quota and cannot-run (a service whose bounds admit no replica): harmless
      # here; the service stays at its size and its held wakes miss their deadline with the named
      # answer WakeMissed (sketch lines 291-294: "past it, the request fails with a named answer,
      # never silence"; time step WakesOverdue -> MissWake).
      drop: [retired, over-quota, cannot-run]
      # no-such-service cannot follow (WakeService checked the service); a transport failure is
      # retried.
      retry: {except: [retired, over-quota, cannot-run]}
  # OPEN: which actor records the service awake (workloads.RecordServiceAwake): NodeAgent, as
  # granted, or Scheduler (docs/open-questions.md "actors", OPEN).

  # ---------------------------------------------------------------------------------------------
  # R9 (line 593): alive check failed past its threshold -> process restart (node-local,
  # recorded). No binding: see the block at the top of `bindings:`.

  # ---------------------------------------------------------------------------------------------
  # Tenant clusters (design:tenant-clusters step 2, integrator 2026-11-26): a dedicated pool an
  # account requests becomes an infrastructure node pool; a removed one is deleted. Tenants never
  # call weft.infrastructure commands.
  # Hardening pass 4 (2026-11-26), the lifecycle as loops (level steps of the ControlPlane, read
  # and invoke granted in ess/9-actors/actors.yaml):
  #   ready   cluster.UnlinkedClusterNodePools joined with infrastructure.TenantNodePools on
  #           cluster_node_pool_id == requested_for -> cluster.RecordClusterNodePoolReady (a
  #           Requested row) or cluster.RecordRemovedClusterNodePool (a row removed while
  #           Requested, so its pool is deleted too)
  #   drain   cluster.RemovedClusterNodePools     -> infrastructure.DrainNodePool
  #   nodes   infrastructure.DrainingPoolNodes    -> infrastructure.DrainNode (Ready, Cordoned)
  #                                                  or infrastructure.RemoveNode (Provisioning,
  #                                                  Joining, Draining)
  #   delete  infrastructure.DrainingNodePools    -> infrastructure.DeleteNodePool (pool-has-nodes
  #                                                  until the nodes step is done)
  # Each view empties when its step succeeds, so the loop converges (sim/experiments/
  # cluster-pool-lifecycle.yaml). No edge records Ready: NodePoolCreated carries requested_for
  # now, so one could; the level step alone is taken.
  # OPEN: RemoveNode answers not-empty while an instance is still assigned to the draining node
  # (`external:`); nothing here moves those instances, R3's lease end does (line 470).
  - id: cluster-create-node-pool
    summary: Create the infrastructure node pool for a dedicated pool a tenant cluster requested.
    when:
      event: weft.cluster.ClusterNodePoolRequested
    invoke:
      command: weft.infrastructure.CreateNodePool
    mapping:
      name: event.name
      zone: event.zone
      machine_type: event.machine_type
      image: event.image
      min_size: event.min_size
      max_size: event.max_size
      requested_for: event.cluster_node_pool_id
    delivery: at_least_once
    on_failure:
      # negative-size and min-above-max cannot follow: weft.cluster.AddClusterNodePool refuses
      # them. OPEN: unknown-zone and zone-retired (the zone retired between the request and this
      # step) have no escalation event; weft.cluster would add `ClusterNodePoolRefused`.
      drop: [unknown-zone, zone-retired, negative-size, min-above-max]
      retry: {except: [unknown-zone, zone-retired, negative-size, min-above-max]}
  - id: cluster-delete-node-pool
    summary: Delete the infrastructure node pool of a removed dedicated pool.
    when:
      event: weft.cluster.ClusterNodePoolRemoved
      where: [defined(event.node_pool_id)]
    invoke:
      command: weft.infrastructure.DeleteNodePool
    mapping:
      node_pool_id: event.node_pool_id
    delivery: at_least_once
    on_failure:
      # no-such-pool and wrong-state: harmless, already deleted. pool-has-nodes: the pool's
      # nodes do not go inside this step, so a retry here cannot succeed (hardening pass 4: 1126
      # unbounded retries from the full setup); the drain level step (above) drains the pool and
      # deletes it once empty. An empty pool is deleted here at once.
      drop: [no-such-pool, wrong-state, pool-has-nodes]
      retry: {except: [no-such-pool, wrong-state, pool-has-nodes]}
