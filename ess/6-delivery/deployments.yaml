# Deployments: what a user deploys, how weft translates it into a FormationRevision, and how a
# revision reaches an environment as a release. Source: docs/domain-sketch.md section
# "5. Deployments" (all of it), with "Goals, in order" items 2 to 5 and "Ecosystem formats".
#
# Goalpost (sketch, section 5, the owner, 2026-11-26): the Helm chart of a Kubernetes SaaS product
# deploys and runs on weft unchanged. The enum weft.deployments.KubernetesKind carries, per
# object kind the sketch lists, whether it maps, is refused or is OPEN, so a coverage report
# answers the goalpost per chart.
domain: weft.deployments


types:
  # Local identities. The sketch names these nouns only inside section 5; no other domain refers
  # to them, so they are not in weft.shared.

  # Section 5 "ReleaseStep: ordered steps of a release (pre-install job, rollout, post-install
  # job)" and "Helm hooks become ordered release steps". Hook names from Helm's hook list.
  - name: weft.deployments.StepKind
    kind: enum
    variants:
      - Rollout
      - PreInstall
      - PostInstall
      - PreUpgrade
      - PostUpgrade
      - PreRollback
      - PostRollback
      # OPEN: Helm `pre-delete`, `post-delete` and `test` hooks: the sketch has no release
      # deletion and no test run. Taken: a translator reports them as MappedWithLoss (dropped),
      # so they never become steps.

  # Section 5 "RolloutStrategy: replace, rolling (bounded by DisruptionBudget), blue-green".
  - name: weft.deployments.RolloutStrategy
    kind: enum
    variants: [Replace, Rolling, BlueGreen]

  # Section 5 "Drift: the difference between the live release and what the nodes report."
  # OPEN: the kinds of difference. Smallest answer taken: the axes of section 4 a node observes.
  - name: weft.deployments.DriftKind
    kind: enum
    variants:
      - MissingInstance       # the release says it runs; no node reports it
      - UnexpectedInstance    # a node reports an instance the release does not hold
      - ArtifactMismatch      # the instance runs another artifact digest
      - ReplicaMismatch       # replica count differs from the release
      - ClaimMismatch         # bound resources differ from the claims

entities:
  # Section 5 "Release: a FormationRevision applied to an Environment. Lifecycle: planned,
  # applying, live, superseded, rolled-back, failed." "Rollback: a new release of an earlier
  # revision" (rollback_of names the earlier release).
  - name: weft.deployments.Release
    naming:
      summary: One formation revision applied to one environment.
    identity:
      name: release_id
      type: weft.shared.ReleaseId
    fields:
      # Isolation pass 2: the plan's account, copied at apply.
      - name: scope_id
        type: weft.shared.ScopeId
      - name: formation_id
        type: weft.shared.FormationId
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: formation_revision_id
        type: weft.shared.FormationRevisionId
      - name: plan_id
        type: weft.shared.PlanId
      - name: strategy
        type: weft.deployments.RolloutStrategy
      - name: rollback_of
        type: Optional<weft.shared.ReleaseId>
      - name: created_by
        type: weft.shared.PrincipalId
      - name: created_at
        type: Timestamp
      - name: live_at
        type: Optional<Timestamp>
      - name: failure
        type: Optional<String>
    relations:
      - name: plan
        kind: references
        target: weft.deployments.Plan
        cardinality: one
        via: plan_id
      - name: restored_release
        kind: references
        target: weft.deployments.Release
        cardinality: one
        via: rollback_of
      - {name: account, kind: references, target: weft.scope.Scope, cardinality: one, via: scope_id}
      - {name: formation, kind: references, target: weft.architecture.Formation, cardinality: one, via: formation_id}
      - {name: environment, kind: references, target: weft.architecture.Environment, cardinality: one, via: environment_id}
      - {name: formation_revision, kind: references, target: weft.architecture.FormationRevision, cardinality: one, via: formation_revision_id}
      - {name: creator, kind: references, target: weft.accounts.Principal, cardinality: one, via: created_by}
      # "ReleaseStep: ordered steps of a release": a step has no meaning without its release.
      - name: steps
        kind: owns
        target: weft.deployments.ReleaseStep
        cardinality: many
        via: release_id
    # Sketch state words: planned, applying, live, superseded, rolled-back (RolledBack), failed.
    lifecycle:
      initial: Planned
      states: [Planned, Applying, Live, Superseded, RolledBack, Failed]
      terminal: [Superseded, RolledBack, Failed]
      transitions:
        - name: start
          from: [Planned]
          to: Applying
        - name: go_live
          from: [Applying]
          to: Live
        - name: fail
          from: [Applying]
          to: Failed
        - name: supersede
          from: [Live]
          to: Superseded
        - name: roll_back
          from: [Live]
          to: RolledBack

  # Section 5 "ReleaseStep: ordered steps of a release (pre-install job, rollout, post-install
  # job); a failed step stops the release." "Helm hooks become ordered release steps."
  - name: weft.deployments.ReleaseStep
    naming:
      summary: One ordered step of a release; a failed step stops the release.
    identity:
      name: step_id
      type: weft.shared.ReleaseStepId
    fields:
      - name: release_id
        type: weft.shared.ReleaseId
      # 1-based order inside the release; Helm hook weights become this order.
      - name: position
        type: Integer
      - name: kind
        type: weft.deployments.StepKind
      # The component a rollout step rolls out, or a hook step's job component.
      - name: component
        type: Optional<weft.shared.ComponentName>
      # A hook step runs a Job (section 4); known once the step starts.
      - name: job_id
        type: Optional<weft.shared.JobId>
      # Section 14 R1 ("release live -> instances requested for each component at its scale"), in
      # the level form: a rollout step names the workload it rolls out (known once it starts, like
      # job_id) and the replica count the component runs at in this environment (read from the
      # revision and the environment's ScaleSetting when the step is added). ReleaseStepStarted
      # carries both, so one binding sets the desired count that the Scheduler's gap view in
      # workloads reads. Absent on a hook step.
      # OPEN: a Daemon component runs one instance per eligible node, so its count is the node
      # count at plan time; does the rollout step of a Daemon carry that count, or no count and a
      # readiness rule of its own?
      - name: workload_id
        type: Optional<weft.shared.WorkloadId>
      - name: replicas
        type: Optional<Integer>
      # Section 15 "A rollout step waits for the new instances to be ready": the ready count the
      # ReleaseController read from weft.workloads.ReadyInstances when the step succeeded.
      - name: ready_replicas
        type: Optional<Integer>
      - name: failure
        type: Optional<String>
      - name: started_at
        type: Optional<Timestamp>
      - name: ended_at
        type: Optional<Timestamp>
    relations:
      - {name: job, kind: references, target: weft.workloads.Job, cardinality: one, via: job_id}
      - {name: workload, kind: references, target: weft.workloads.Workload, cardinality: one, via: workload_id}
    # OPEN: the sketch names no step states. Taken: Pending, Running, Succeeded, Failed, and
    # Skipped for the steps after a failed one. Section 14 R7 ("drift recorded -> the release step
    # re-applied"): a succeeded rollout step of a live release runs again (reapply, ReapplyDrift).
    lifecycle:
      initial: Pending
      states: [Pending, Running, Succeeded, Failed, Skipped]
      terminal: [Failed, Skipped]
      transitions:
        - name: start
          from: [Pending]
          to: Running
        - name: succeed
          from: [Running]
          to: Succeeded
        - name: fail
          from: [Running]
          to: Failed
        - name: skip
          from: [Pending]
          to: Skipped
        - name: reapply
          from: [Succeeded]
          to: Running

  # Section 5 "Drift: the difference between the live release and what the nodes report."
  # Section 14 R7 decides what weft does on drift: "drift recorded -> the release step re-applied
  # or the drift escalated". A drift names the rollout step whose effect drifted; one without a
  # step (an instance the release does not hold) cannot be re-applied and is escalated.
  - name: weft.deployments.Drift
    naming:
      summary: One difference between a live release and what the nodes report.
    identity:
      name: drift_id
      type: weft.shared.DriftId
    fields:
      - name: release_id
        type: weft.shared.ReleaseId
      - name: kind
        type: weft.deployments.DriftKind
      - name: component
        type: Optional<weft.shared.ComponentName>
      - name: instance_id
        type: Optional<weft.shared.InstanceId>
      - name: node_id
        type: Optional<weft.shared.NodeId>
      - name: detail
        type: String
      # Section 14 R7: the rollout step of this release whose effect drifted.
      - name: step_id
        type: Optional<weft.shared.ReleaseStepId>
      # Section 14 R7 "or the drift escalated": why it was handed to a person.
      - name: escalation
        type: Optional<String>
      - name: observed_at
        type: Timestamp
      - name: resolved_at
        type: Optional<Timestamp>
    relations:
      - name: release
        kind: references
        target: weft.deployments.Release
        cardinality: one
        via: release_id
      - name: step
        kind: references
        target: weft.deployments.ReleaseStep
        cardinality: one
        via: step_id
      - {name: instance, kind: references, target: weft.workloads.Instance, cardinality: one, via: instance_id}
      - {name: node, kind: references, target: weft.infrastructure.Node, cardinality: one, via: node_id}
    # Section 14 R7. Open until the ReleaseController acts; Reapplying while its step runs again;
    # Escalated when it cannot be re-applied; Resolved once the nodes report the release's state.
    # OPEN: whether an escalated drift is resolved by the nodes' next report (taken: yes,
    # ResolveDrift from Escalated) or only by a person.
    lifecycle:
      initial: Open
      states: [Open, Reapplying, Escalated, Resolved]
      terminal: [Resolved]
      transitions:
        - name: reapply
          from: [Open]
          to: Reapplying
        - name: escalate
          from: [Open, Reapplying]
          to: Escalated
        - name: resolve
          from: [Open, Reapplying, Escalated]
          to: Resolved

errors:
  - name: weft.deployments.ReleaseMismatch
    summary: The release's environment, formation or revision is not what the request names.
  - name: weft.deployments.NotARollbackTarget
    summary: >-
      The release never went live (planned, applying or failed) or is live now, so it is no
      earlier revision to roll back to.
  - name: weft.deployments.SimulationViolations
    summary: The plan's simulation named violations, so it is not applied.
  - name: weft.deployments.PlanNotReady
    summary: The plan's simulation has not passed, or the plan was discarded.
  - name: weft.deployments.PlanAlreadyApplied
    summary: The plan already has a release.
  - name: weft.deployments.ReleaseInProgress
    summary: Another release of this environment is applying.
  - name: weft.deployments.InvalidStepPosition
    summary: A step's position starts at 1.
  - name: weft.deployments.ReleaseNotPlanned
    summary: Steps are added to a release only while it is planned.
  - name: weft.deployments.StepPositionTaken
    summary: The release already has a step at this position.
  - name: weft.deployments.StepMismatch
    summary: The step does not belong to the named release, or sits at another position.
  - name: weft.deployments.ReleaseNotApplying
    summary: The release is not applying, so its steps do not run.
  - name: weft.deployments.PreviousStepIncomplete
    summary: An earlier step of the release has not succeeded, so this step does not start.
  - name: weft.deployments.StepsIncomplete
    summary: A step of the release has not succeeded, so the release does not go live.
  - name: weft.deployments.ReleaseNotLive
    summary: Drift is recorded against a live release only.
  - name: weft.deployments.IsARollback
    summary: The release is a rollback; it goes live through MarkRollbackLive.
  - name: weft.deployments.NotARollback
    summary: The release is no rollback; it goes live through MarkReleaseLive.
  - name: weft.deployments.RolloutNeedsReplicas
    summary: A rollout step names the replica count its component runs at; this one names none.
  - name: weft.deployments.InvalidReplicas
    summary: A replica count or ready count is below 0.
  - name: weft.deployments.RolloutNeedsWorkload
    summary: A rollout step starts only with the workload it rolls out named.
  - name: weft.deployments.NotARolloutStep
    summary: The step is no rollout step, so it neither waits for ready instances nor is re-applied.
  - name: weft.deployments.IsARolloutStep
    summary: >-
      The step is a rollout step; it succeeds only through CompleteRolloutStep, which checks that
      its new instances are ready.
  - name: weft.deployments.RolloutNotReady
    summary: >-
      Fewer instances of the rolled-out workload are ready than the step's replica count, so the
      step does not end yet.
  - name: weft.deployments.DriftMismatch
    summary: The drift belongs to another release or names another step than the request.
  - name: weft.deployments.StepNotReappliable
    summary: >-
      The drifted step has not succeeded (it runs, failed or was skipped), so it is not re-applied
      now.
  # hardening pass 1 D1.
  - name: weft.deployments.GateNotPassed
    summary: >-
      A deploy gate of the release's environment has no passed check for the release's plan, so
      the release does not start.
  # hardening pass 1 (CompleteTranslation, RecordDrift, StartReleaseStep).
  - name: weft.deployments.OutsideRelease
    summary: >-
      The instance, job or workload named belongs to another environment than the release, so it
      is not recorded against it.

events:
  - name: weft.deployments.RollbackPlanned
    fields:
      - {name: plan_id, type: weft.shared.PlanId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: formation_revision_id, type: weft.shared.FormationRevisionId}
      - {name: rollback_of, type: weft.shared.ReleaseId}
  - name: weft.deployments.ReleaseCreated
    fields:
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: plan_id, type: weft.shared.PlanId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: strategy, type: weft.deployments.RolloutStrategy}
  - name: weft.deployments.ReleaseStarted
    fields:
      - {name: release_id, type: weft.shared.ReleaseId}
  - name: weft.deployments.ReleaseStepAdded
    fields:
      - {name: step_id, type: weft.shared.ReleaseStepId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: position, type: Integer}
      - {name: kind, type: weft.deployments.StepKind}
  # Section 14 R1 (edge into the level form): a started rollout step carries the workload and
  # the replica count, so a binding filtered on `event.kind == Rollout` sets the desired count
  # the Scheduler's gap view in workloads reads.
  - name: weft.deployments.ReleaseStepStarted
    fields:
      - {name: step_id, type: weft.shared.ReleaseStepId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: position, type: Integer}
      - {name: kind, type: weft.deployments.StepKind}
      - {name: component, type: Optional<weft.shared.ComponentName>}
      - {name: job_id, type: Optional<weft.shared.JobId>}
      - {name: workload_id, type: Optional<weft.shared.WorkloadId>}
      - {name: replicas, type: Optional<Integer>}
  - name: weft.deployments.ReleaseStepSucceeded
    fields:
      - {name: step_id, type: weft.shared.ReleaseStepId}
  # Section 15 "A rollout step waits for the new instances to be ready before it ends the old
  # ones": a rollout step ended with its ready count. The old instances end from here.
  - name: weft.deployments.RolloutStepSucceeded
    fields:
      - {name: step_id, type: weft.shared.ReleaseStepId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: ready_replicas, type: Integer}
  - name: weft.deployments.ReleaseStepFailed
    fields:
      - {name: step_id, type: weft.shared.ReleaseStepId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: failure, type: String}
  - name: weft.deployments.ReleaseLive
    fields:
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
  # Section 14 R7: carries the step, so a binding filtered on `defined(event.step_id)` invokes
  # ReapplyDrift, and one filtered on `not defined(event.step_id)` invokes EscalateDrift.
  - name: weft.deployments.DriftDetected
    fields:
      - {name: drift_id, type: weft.shared.DriftId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: kind, type: weft.deployments.DriftKind}
      - {name: step_id, type: Optional<weft.shared.ReleaseStepId>}
      - {name: component, type: Optional<weft.shared.ComponentName>}
      - {name: instance_id, type: Optional<weft.shared.InstanceId>}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
  - name: weft.deployments.DriftResolved
    fields:
      - {name: drift_id, type: weft.shared.DriftId}
  # Section 14 R7 "the release step re-applied": the drift's rollout step runs again.
  - name: weft.deployments.DriftReapplying
    fields:
      - {name: drift_id, type: weft.shared.DriftId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: step_id, type: weft.shared.ReleaseStepId}
  # Section 14 R7 "or the drift escalated", and the record an `on_failure: escalate` of the R7
  # binding emits (its fields are ReapplyDrift's input minus the step). Emitted by EscalateDrift
  # too.
  - name: weft.deployments.DriftEscalated
    fields:
      - {name: drift_id, type: weft.shared.DriftId}
      - {name: release_id, type: weft.shared.ReleaseId}

commands:
  # Section 5 "Rollback: a new release of an earlier revision." A rollback is planned and
  # simulated like any revision, since the account's policy or the cluster may have changed.
  # OPEN: whether a rollback may skip simulation in an emergency. Taken: no.
  # The formation and revision are the earlier release's, copied from its row; the request names
  # the environment it rolls back, checked against the release.
  - name: weft.deployments.PlanRollback
    naming:
      display: Plan a rollback to an earlier release
    input:
      - {name: release_id, type: weft.shared.ReleaseId}
      # Isolation pass 2: the account the request acts in, so the release can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing release (an input guard answers ahead of every row check).
      - name: not-callers-account
        when: scope_id != caller.scope_id
        error: weft.deployments.NotFound
      - name: no-such-release
        when_related: {via: input.release_id, exists: false}
        error: weft.deployments.NotFound
      # Isolation pass 2: a release of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: release-of-other-account
        when_related: {via: input.release_id, predicate: scope_id != input.scope_id}
        error: weft.deployments.NotFound
      # hardening pass 1 disclosure (PlanRollback release_id): a release of another environment
      # answers like a missing one, before its state, so its existence is not disclosed.
      - name: release-mismatch
        when_related:
          via: input.release_id
          predicate:
            any:
              - environment_id != input.environment_id
        error: weft.deployments.NotFound
      - name: not-a-rollback-target
        when_related:
          via: input.release_id
          predicate:
            state: {not_in: [Superseded, RolledBack]}
        error: weft.deployments.NotARollbackTarget
      - name: created
        creates: weft.deployments.Plan
        instance: plan_id
        sets:
          scope_id: {related: {via: input.release_id, field: scope_id}}
          formation_id: {related: {via: input.release_id, field: formation_id}}
          environment_id: input.environment_id
          formation_revision_id: {related: {via: input.release_id, field: formation_revision_id}}
          # hardening pass 1 D2: the creator is the authenticated caller, not a request field.
          created_by: {caller: principal_id}
          created_at: {generated: true}
        emits: [weft.deployments.RollbackPlanned]
        payload:
          weft.deployments.RollbackPlanned:
            plan_id: {generated: true}
            environment_id: input.environment_id
            formation_revision_id: {related: {via: input.release_id, field: formation_revision_id}}
            # cloudspec D7 dropped Plan.rollback_of, so the plan row no longer names the release
            # it restores; the event still does, from the request.
            rollback_of: input.release_id

  # Section 5 "Release: a FormationRevision applied to an Environment"; the "apply" step of
  # `weft deploy`. A plan with violations, or not yet simulated, is never applied.
  # The environment is the plan's, read from its row: the command takes no environment input, so
  # no request can name another one (this replaces the refusal plan-mismatch, error PlanMismatch,
  # whose comparison with the input left the command without scenarios beside a row set in
  # ESS 0.99.2; see TranslateSource).
  - name: weft.deployments.ApplyPlan
    naming:
      display: Apply a plan as a release
    input:
      - {name: plan_id, type: weft.shared.PlanId}
      # Isolation pass 2: the account the request acts in, so the plan can be tied to the
      # caller (a related row is not compared with the caller directly).
      - {name: scope_id, type: weft.shared.ScopeId}
      - {name: strategy, type: weft.deployments.RolloutStrategy}
    outcomes:
      # Isolation pass 2: the account must be the one the request acts in; it reads no row and
      # answers like a missing plan (an input guard answers ahead of every row check).
      - name: not-callers-account
        when: scope_id != caller.scope_id
        error: weft.deployments.NotFound
      - name: no-such-plan
        when_related: {via: input.plan_id, exists: false}
        error: weft.deployments.NotFound
      # Isolation pass 2: a plan of another account answers like a missing one, after the
      # existence checks and before its state is read.
      - name: plan-of-other-account
        when_related: {via: input.plan_id, predicate: scope_id != input.scope_id}
        error: weft.deployments.NotFound
      - name: simulation-violations
        when_related: {via: input.plan_id, predicate: state == Blocked}
        error: weft.deployments.SimulationViolations
      - name: plan-not-ready
        when_related: {via: input.plan_id, predicate: state != Ready}
        error: weft.deployments.PlanNotReady
      # Both row-set checks of an apply are made when the release starts (StartRelease
      # already-applied, release-in-progress), on the row the release holds: one release of a plan
      # starts, and one release of an environment applies at a time. Beside a row set here, ESS
      # 0.99.2 synthesis arranged the plan without moving it to Ready, and its scenario failed on
      # the interpreted target; the environment's row set needs an equality with the input or the
      # subject, and the environment is the plan's.
      - name: created
        creates: weft.deployments.Release
        instance: release_id
        sets:
          scope_id: {related: {via: input.plan_id, field: scope_id}}
          formation_id: {related: {via: input.plan_id, field: formation_id}}
          environment_id: {related: {via: input.plan_id, field: environment_id}}
          formation_revision_id: {related: {via: input.plan_id, field: formation_revision_id}}
          plan_id: input.plan_id
          strategy: input.strategy
          # hardening pass 1 D2: the creator is the authenticated caller, not a request field.
          created_by: {caller: principal_id}
          created_at: {generated: true}
        emits: [weft.deployments.ReleaseCreated]
        payload:
          weft.deployments.ReleaseCreated:
            release_id: {generated: true}
            plan_id: input.plan_id
            environment_id: {related: {via: input.plan_id, field: environment_id}}
            strategy: input.strategy

  # Section 5 "Lifecycle: planned, applying ...". The control plane starts a planned release
  # once its steps are added.
  # UNMAPPED: no outcome of this command gets a scenario (ESS-SYNTH-001): ESS 0.99.2 synthesis
  # reads `plan_id == subject.plan_id` and `environment_id == subject.environment_id` as subject
  # fields "the steps leave undetermined" (written from a generated identity and a related read).
  # Every later state of a release (Applying, Live, Superseded, RolledBack, Failed) and every
  # command acting on one is unreached in the synthesized suite. A variant that reaches them
  # (environment input on ApplyPlan, Plan state Applied moved here, rollback marker read through
  # plan_id) validates, but its synthesis ran past 1200 s for this domain alone (403 s here).
  # Open question for ESS (synthesis cost of a reachable release chain) and for the owner.
  - name: weft.deployments.StartRelease
    naming:
      display: Start applying a release
    input:
      - {name: release_id, type: weft.shared.ReleaseId}
    outcomes:
      - name: no-such-release
        unknown_instance: true
        error: weft.deployments.NotFound
      # A plan has one release: another release of the same plan already started (this one is
      # Planned, so `state != Planned` leaves it out).
      - name: already-applied
        when_related:
          entity: weft.deployments.Release
          where:
            all:
              - plan_id == subject.plan_id
              - state != Planned
          exists: true
        error: weft.deployments.PlanAlreadyApplied
      # One release of an environment applies at a time; a planned release waits until the
      # applying one is live or failed.
      - name: release-in-progress
        when_related:
          entity: weft.deployments.Release
          where:
            all:
              - environment_id == subject.environment_id
              - state == Applying
          exists: true
        error: weft.deployments.ReleaseInProgress
      # hardening pass 1 D1: design ci-cd-support.md:58 "StartRelease refuses while a gate of the
      # target environment has no passed check for the plan". Read as: an active gate of the
      # release's environment for which no Passed weft.pipelines.GateCheck of the release's plan
      # exists, so a gate with only Waiting or Failed checks, or with none, refuses.
      - name: gate-not-passed
        when_related:
          entity: weft.pipelines.DeployGate
          where:
            all:
              - environment_id == subject.environment_id
              - state == Active
              - not:
                  exists:
                    in: {entity: weft.pipelines.GateCheck}
                    as: c
                    that: {all: [c.deploy_gate_id == deploy_gate_id, c.plan_id == subject.plan_id, c.state == Passed]}
          exists: true
        error: weft.deployments.GateNotPassed
      - name: started
        moves: weft.deployments.Release.start
        instance: release_id
        emits: [weft.deployments.ReleaseStarted]
        payload:
          weft.deployments.ReleaseStarted:
            release_id: input.release_id
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "ReleaseStep: ordered steps of a release (pre-install job, rollout, post-install
  # job)"; "Helm hooks become ordered release steps". The control plane adds the steps of a
  # planned release from its revision.
  - name: weft.deployments.AddReleaseStep
    naming:
      display: Add a step to a planned release
    input:
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: position, type: Integer}
      - {name: kind, type: weft.deployments.StepKind}
      - {name: component, type: Optional<weft.shared.ComponentName>}
      # Section 14 R1 "at its scale": the replica count the component runs at in this
      # environment, from the revision and the environment's weft.architecture.ScaleSetting.
      # Required on a rollout step.
      - {name: replicas, type: Optional<Integer>}
    outcomes:
      - name: invalid-position
        when: position < 1
        error: weft.deployments.InvalidStepPosition
      - name: rollout-needs-replicas
        when:
          all:
            - kind == Rollout
            - replicas: {defined: false}
        error: weft.deployments.RolloutNeedsReplicas
      - name: invalid-replicas
        when:
          all:
            - replicas: {defined: true}
            - replicas < 0
        error: weft.deployments.InvalidReplicas
      - name: no-such-release
        when_related: {via: input.release_id, exists: false}
        error: weft.deployments.NotFound
      - name: release-not-planned
        when_related: {via: input.release_id, predicate: state != Planned}
        error: weft.deployments.ReleaseNotPlanned
      - name: position-taken
        when_related:
          entity: weft.deployments.ReleaseStep
          where:
            all:
              - release_id == input.release_id
              - position == input.position
          exists: true
        error: weft.deployments.StepPositionTaken
      - name: added
        creates: weft.deployments.ReleaseStep
        instance: step_id
        sets:
          release_id: input.release_id
          position: input.position
          kind: input.kind
          component: input.component
          replicas: input.replicas
        emits: [weft.deployments.ReleaseStepAdded]
        payload:
          weft.deployments.ReleaseStepAdded:
            step_id: {generated: true}
            release_id: input.release_id
            position: input.position
            kind: input.kind

  # Section 5 "ordered steps": a step starts only after every earlier step succeeded, and only
  # while its release is applying. The step is the addressed record: its release and position
  # are its own stored fields (the request named them too, unchecked against the step, and their
  # guards beside the row set got no scenario in ESS 0.99.2).
  - name: weft.deployments.StartReleaseStep
    naming:
      display: Start a release step
    input:
      - {name: step_id, type: weft.shared.ReleaseStepId}
      - {name: job_id, type: Optional<weft.shared.JobId>}
      # Section 14 R1: the workload a rollout step rolls out (absent for a hook step).
      - {name: workload_id, type: Optional<weft.shared.WorkloadId>}
    outcomes:
      - name: no-such-step
        unknown_instance: true
        error: weft.deployments.NotFound
      - name: no-such-release
        when_related: {via: release_id, exists: false}
        error: weft.deployments.NotFound
      - name: release-not-applying
        when_related: {via: release_id, predicate: state != Applying}
        error: weft.deployments.ReleaseNotApplying
      # The addressed step read as a row set keyed by its identity: ESS 0.99.2 refuses a
      # when_subject guard beside a row set on one command.
      - name: rollout-needs-workload
        when_related:
          entity: weft.deployments.ReleaseStep
          where:
            all:
              - step_id == input.step_id
              - kind == Rollout
              - input.workload_id: {defined: false}
          exists: true
        error: weft.deployments.RolloutNeedsWorkload
      - name: previous-step-incomplete
        when_related:
          entity: weft.deployments.ReleaseStep
          where:
            all:
              - release_id == subject.release_id
              - position < subject.position
              - state != Succeeded
          exists: true
        error: weft.deployments.PreviousStepIncomplete
      # hardening pass 1 (StartReleaseStep job_id): a hook step's job runs a workload of the
      # release's own environment, never another formation's or account's.
      - name: job-outside-release
        when_related:
          entity: weft.workloads.Workload
          where:
            all:
              - exists:
                  in: {entity: weft.workloads.Job}
                  as: j
                  that: {all: [j.job_id == input.job_id, j.workload_id == workload_id]}
              - not:
                  exists:
                    in: {entity: weft.deployments.Release}
                    as: r
                    that: {all: [r.release_id == subject.release_id, r.environment_id == environment_id]}
          exists: true
        error: weft.deployments.OutsideRelease
      # hardening pass 1 (StartReleaseStep, same class as job_id): the workload a rollout step rolls
      # out is one of the release's environment; ReleaseStepStarted sets that workload's desired
      # count (section 14 R1), so another account's workload is never scaled from here.
      - name: workload-outside-release
        when_related:
          entity: weft.workloads.Workload
          where:
            all:
              - workload_id == input.workload_id
              - not:
                  exists:
                    in: {entity: weft.deployments.Release}
                    as: r
                    that: {all: [r.release_id == subject.release_id, r.environment_id == environment_id]}
          exists: true
        error: weft.deployments.OutsideRelease
      - name: started
        moves: weft.deployments.ReleaseStep.start
        instance: step_id
        sets:
          job_id: input.job_id
          workload_id: input.workload_id
          started_at: {generated: true}
        emits: [weft.deployments.ReleaseStepStarted]
        payload:
          weft.deployments.ReleaseStepStarted:
            step_id: input.step_id
            release_id: {related: {via: input.step_id, field: release_id}}
            position: {related: {via: input.step_id, field: position}}
            kind: {related: {via: input.step_id, field: kind}}
            component: {related: {via: input.step_id, field: component}}
            job_id: input.job_id
            workload_id: input.workload_id
            replicas: {related: {via: input.step_id, field: replicas}}
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "ReleaseStep" (a step that ran to its end). A hook step; a rollout step ends
  # through CompleteRolloutStep (section 15).
  - name: weft.deployments.CompleteReleaseStep
    naming:
      display: Record a release step succeeded
    input:
      - {name: step_id, type: weft.shared.ReleaseStepId}
    outcomes:
      - name: no-such-step
        unknown_instance: true
        error: weft.deployments.NotFound
      - name: is-a-rollout-step
        when_subject:
          predicate: kind == Rollout
        error: weft.deployments.IsARolloutStep
      - name: succeeded
        moves: weft.deployments.ReleaseStep.succeed
        instance: step_id
        sets:
          ended_at: {generated: true}
        emits: [weft.deployments.ReleaseStepSucceeded]
        payload:
          weft.deployments.ReleaseStepSucceeded:
            step_id: input.step_id
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 15 "A rollout step waits for the new instances to be ready before it ends the old
  # ones." Level form: the ReleaseController reads RunningRolloutSteps, and for each row reads
  # weft.workloads.ReadyInstances(workload_id) (running and health Ready) and passes the number of
  # rows as `ready_replicas`; the step succeeds only once that count reaches the step's replica
  # count, else it answers RolloutNotReady and the controller reads again. ESS counts rows only
  # against a literal, so the count is the controller's read and the guard compares it with the
  # stored count.
  # OPEN: the guard trusts the controller's count; a stored ready counter per workload in
  # 4-applications/workloads.yaml (kept by InstanceReady / InstanceNotReady and the instance's
  # end) would let this guard read the count itself (`when_related` on that row).
  # OPEN: "before it ends the old ones": which command ends the old release's instances
  # (RolloutStepSucceeded -> a workloads command that sets the old workload's desired count to 0)
  # is a workloads decision; this event carries the new workload only.
  - name: weft.deployments.CompleteRolloutStep
    naming:
      display: Record a rollout step's new instances ready
    input:
      - {name: step_id, type: weft.shared.ReleaseStepId}
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: ready_replicas, type: Integer}
    outcomes:
      - name: invalid-ready-count
        when: ready_replicas < 0
        error: weft.deployments.InvalidReplicas
      - name: no-such-step
        unknown_instance: true
        error: weft.deployments.NotFound
      - name: not-a-rollout-step
        when_subject:
          predicate: kind != Rollout
        error: weft.deployments.NotARolloutStep
      - name: step-mismatch
        when_subject:
          predicate: workload_id != input.workload_id
        error: weft.deployments.StepMismatch
      - name: not-ready
        when_subject:
          predicate: replicas > input.ready_replicas
        error: weft.deployments.RolloutNotReady
      - name: succeeded
        moves: weft.deployments.ReleaseStep.succeed
        instance: step_id
        sets:
          ready_replicas: input.ready_replicas
          ended_at: {generated: true}
        emits: [weft.deployments.ReleaseStepSucceeded, weft.deployments.RolloutStepSucceeded]
        payload:
          weft.deployments.ReleaseStepSucceeded:
            step_id: input.step_id
          weft.deployments.RolloutStepSucceeded:
            step_id: input.step_id
            workload_id: input.workload_id
            ready_replicas: input.ready_replicas
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "a failed step stops the release": the step fails, the release fails, and every
  # step still pending is skipped, in one outcome.
  - name: weft.deployments.FailReleaseStep
    naming:
      display: Record a release step failed
    input:
      - {name: step_id, type: weft.shared.ReleaseStepId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: failure, type: String}
    outcomes:
      - name: no-such-step
        unknown_instance: true
        error: weft.deployments.NotFound
      - name: step-mismatch
        when_subject:
          predicate: release_id != input.release_id
        error: weft.deployments.StepMismatch
      - name: failed
        moves: weft.deployments.ReleaseStep.fail
        instance: step_id
        sets:
          failure: input.failure
          ended_at: {generated: true}
        emits: [weft.deployments.ReleaseStepFailed]
        payload:
          weft.deployments.ReleaseStepFailed:
            step_id: input.step_id
            release_id: input.release_id
            failure: input.failure
        affects:
          - entity: weft.deployments.Release
            where: release_id == input.release_id
            moves: weft.deployments.Release.fail
          - entity: weft.deployments.ReleaseStep
            where:
              all:
                - release_id == input.release_id
                - state == Pending
            moves: weft.deployments.ReleaseStep.skip
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "Lifecycle: ... live, superseded". A release goes live when every step
  # succeeded; the environment's previous live release becomes superseded.
  # (Two commands, this one and MarkRollbackLive, because ESS 0.99.2 refuses a branch chosen by
  # a when_subject guard beside the row-set guard over the steps.)
  # The release is the addressed record (unknown_instance, wrong_state), so synthesis arranges it
  # Applying; its rollback marker is read as a row set keyed by its identity, beside the steps'
  # (ESS 0.99.2 refuses a when_subject guard beside a row set). Neither command gets a scenario
  # past wrong-state while no release reaches Applying (see StartRelease).
  # The environment is the release's own (subject.environment_id): neither command takes an
  # environment input, which replaces the refusal release-mismatch (error ReleaseMismatch) whose
  # comparison with the input left both commands without scenarios beside the row set over the
  # steps (ESS 0.99.2; see TranslateSource).
  - name: weft.deployments.MarkReleaseLive
    naming:
      display: Record a release live
    input:
      - {name: release_id, type: weft.shared.ReleaseId}
    outcomes:
      - name: no-such-release
        unknown_instance: true
        error: weft.deployments.NotFound
      - name: is-a-rollback
        when_related:
          entity: weft.deployments.Release
          where:
            all:
              - release_id == input.release_id
              - rollback_of: {defined: true}
          exists: true
        error: weft.deployments.IsARollback
      - name: steps-incomplete
        when_related:
          entity: weft.deployments.ReleaseStep
          where:
            all:
              - release_id == input.release_id
              - state != Succeeded
          exists: true
        error: weft.deployments.StepsIncomplete
      - name: live
        moves: weft.deployments.Release.go_live
        instance: release_id
        sets:
          live_at: {generated: true}
        emits: [weft.deployments.ReleaseLive]
        payload:
          weft.deployments.ReleaseLive:
            release_id: input.release_id
            environment_id: {related: {via: input.release_id, field: environment_id}}
        affects:
          - entity: weft.deployments.Release
            where:
              all:
                - environment_id == subject.environment_id
                - state == Live
            moves: weft.deployments.Release.supersede
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "Rollback: a new release of an earlier revision"; "Lifecycle: ... rolled-back".
  # A rollback release goes live when every step succeeded; the release it replaces becomes
  # rolled back.
  - name: weft.deployments.MarkRollbackLive
    naming:
      display: Record a rollback release live
    input:
      - {name: release_id, type: weft.shared.ReleaseId}
    outcomes:
      - name: no-such-release
        unknown_instance: true
        error: weft.deployments.NotFound
      - name: not-a-rollback
        when_related:
          entity: weft.deployments.Release
          where:
            all:
              - release_id == input.release_id
              - rollback_of: {defined: false}
          exists: true
        error: weft.deployments.NotARollback
      - name: steps-incomplete
        when_related:
          entity: weft.deployments.ReleaseStep
          where:
            all:
              - release_id == input.release_id
              - state != Succeeded
          exists: true
        error: weft.deployments.StepsIncomplete
      - name: live
        moves: weft.deployments.Release.go_live
        instance: release_id
        sets:
          live_at: {generated: true}
        emits: [weft.deployments.ReleaseLive]
        payload:
          weft.deployments.ReleaseLive:
            release_id: input.release_id
            environment_id: {related: {via: input.release_id, field: environment_id}}
        affects:
          - entity: weft.deployments.Release
            where:
              all:
                - environment_id == subject.environment_id
                - state == Live
            moves: weft.deployments.Release.roll_back
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 5 "Drift: the difference between the live release and what the nodes report."
  # The control plane compares the nodes' observations (section 11) with the live release.
  - name: weft.deployments.RecordDrift
    naming:
      display: Record drift of a live release
    input:
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: kind, type: weft.deployments.DriftKind}
      - {name: component, type: Optional<weft.shared.ComponentName>}
      - {name: instance_id, type: Optional<weft.shared.InstanceId>}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: detail, type: String}
      # Section 14 R7: the rollout step of this release whose effect drifted (the step of the
      # drift's component); absent when no step covers it (an instance the release does not hold).
      - {name: step_id, type: Optional<weft.shared.ReleaseStepId>}
    outcomes:
      - name: no-such-release
        when_related: {via: input.release_id, exists: false}
        error: weft.deployments.NotFound
      - name: no-such-step
        when_related: {via: input.step_id, exists: false}
        error: weft.deployments.NotFound
      - name: release-not-live
        when_related: {via: input.release_id, predicate: state != Live}
        error: weft.deployments.ReleaseNotLive
      - name: step-mismatch
        when_related:
          via: input.step_id
          predicate:
            any:
              - release_id != input.release_id
              - kind != Rollout
        error: weft.deployments.StepMismatch
      # hardening pass 1 (RecordDrift instance_id): the instance a drift names runs a workload of
      # the release's own environment, never another formation's or account's.
      - name: instance-outside-release
        when_related:
          entity: weft.workloads.Workload
          where:
            all:
              - exists:
                  in: {entity: weft.workloads.Instance}
                  as: i
                  that: {all: [i.instance_id == input.instance_id, i.workload_id == workload_id]}
              - not:
                  exists:
                    in: {entity: weft.deployments.Release}
                    as: r
                    that: {all: [r.release_id == input.release_id, r.environment_id == environment_id]}
          exists: true
        error: weft.deployments.OutsideRelease
      - name: detected
        creates: weft.deployments.Drift
        instance: drift_id
        sets:
          release_id: input.release_id
          kind: input.kind
          component: input.component
          instance_id: input.instance_id
          node_id: input.node_id
          detail: input.detail
          step_id: input.step_id
          observed_at: {generated: true}
        emits: [weft.deployments.DriftDetected]
        payload:
          weft.deployments.DriftDetected:
            drift_id: {generated: true}
            release_id: input.release_id
            kind: input.kind
            step_id: input.step_id
            component: input.component
            instance_id: input.instance_id
            node_id: input.node_id

  # Section 5 "Drift" (the nodes report the release's state again).
  - name: weft.deployments.ResolveDrift
    naming:
      display: Record drift resolved
    input:
      - {name: drift_id, type: weft.shared.DriftId}
    outcomes:
      - name: no-such-drift
        unknown_instance: true
        error: weft.deployments.NotFound
      - name: resolved
        moves: weft.deployments.Drift.resolve
        instance: drift_id
        sets:
          resolved_at: {generated: true}
        emits: [weft.deployments.DriftResolved]
        payload:
          weft.deployments.DriftResolved:
            drift_id: input.drift_id
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 14 R7 "drift recorded -> the release step re-applied". Edge form: a binding on
  # DriftDetected filtered on `defined(event.step_id)` maps drift_id, release_id and step_id.
  # The drift's succeeded rollout step runs again in the same outcome (ReleaseStep.reapply); the
  # ReleaseController then drives it as a started rollout step (RunningRolloutSteps,
  # CompleteRolloutStep), and ResolveDrift closes the drift once the nodes report the release.
  # A refusal of this command is the escalation: the binding's `on_failure: escalate` emits
  # DriftEscalated.
  # OPEN: a re-applied rollout step that fails: FailReleaseStep fails the step, and its release,
  # being Live, does not move to Failed. Should a failed re-application escalate the drift
  # (EscalateDrift) and leave the release Live, or end the release?
  - name: weft.deployments.ReapplyDrift
    naming:
      display: Re-apply the release step a drift names
    input:
      - {name: drift_id, type: weft.shared.DriftId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: step_id, type: weft.shared.ReleaseStepId}
    # UNMAPPED: `wrong-state` has no synthesized scenario (ESS-SYNTH-008: the drift is read as a
    # related row, and that strategy arranges no wrong state). Addressing the drift as the subject
    # (unknown_instance, when_subject) is refused by ESS 0.99.2 validation: with two or more
    # related rows the joint partition (related_guard.rs `partitioned`) counts the existence and
    # held-state branches as guarded, "select 2 branches: no-such-drift, drift-mismatch". Open
    # question for ESS.
    outcomes:
      - name: no-such-drift
        when_related: {via: input.drift_id, exists: false}
        error: weft.deployments.NotFound
      - name: no-such-release
        when_related: {via: input.release_id, exists: false}
        error: weft.deployments.NotFound
      - name: no-such-step
        when_related: {via: input.step_id, exists: false}
        error: weft.deployments.NotFound
      - name: drift-mismatch
        when_related:
          via: input.drift_id
          predicate:
            any:
              - release_id != input.release_id
              - step_id != input.step_id
        error: weft.deployments.DriftMismatch
      - name: release-not-live
        when_related: {via: input.release_id, predicate: state != Live}
        error: weft.deployments.ReleaseNotLive
      - name: step-not-reappliable
        when_related: {via: input.step_id, predicate: state != Succeeded}
        error: weft.deployments.StepNotReappliable
      - name: reapplying
        moves: weft.deployments.Drift.reapply
        instance: drift_id
        emits: [weft.deployments.DriftReapplying]
        payload:
          weft.deployments.DriftReapplying:
            drift_id: input.drift_id
            release_id: input.release_id
            step_id: input.step_id
        affects:
          - entity: weft.deployments.ReleaseStep
            where: step_id == input.step_id
            moves: weft.deployments.ReleaseStep.reapply
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

  # Section 14 R7 "or the drift escalated". Edge form for a drift no step covers: a binding on
  # DriftDetected filtered on `not defined(event.step_id)`. Also the ReleaseController's answer
  # to a drift whose re-application failed. Escalation hands the drift to a person; the event
  # records that it did.
  # OPEN: the R7 binding's `on_failure: escalate` emits DriftEscalated but moves no row (ESS's
  # escalate emits an event and invokes no command), so that drift stays Open. A second binding,
  # DriftEscalated -> EscalateDrift with `drop: [wrong-state]`, records it on the row; its own
  # DriftEscalated then meets an Escalated drift and is dropped. Take that, or leave the row Open?
  - name: weft.deployments.EscalateDrift
    naming:
      display: Escalate a drift
    input:
      - {name: drift_id, type: weft.shared.DriftId}
      - {name: release_id, type: weft.shared.ReleaseId}
    outcomes:
      - name: no-such-drift
        unknown_instance: true
        error: weft.deployments.NotFound
      - name: drift-mismatch
        when_subject:
          predicate: release_id != input.release_id
        error: weft.deployments.DriftMismatch
      - name: escalated
        moves: weft.deployments.Drift.escalate
        instance: drift_id
        sets:
          escalation: {related: {via: input.drift_id, field: detail}}
        emits: [weft.deployments.DriftEscalated]
        payload:
          weft.deployments.DriftEscalated:
            drift_id: input.drift_id
            release_id: input.release_id
      - name: wrong-state
        wrong_state: true
        error: weft.deployments.StateConflict

views:
  # Section 5 "Release: a FormationRevision applied to an Environment", per environment.
  - name: weft.deployments.Releases
    source: weft.deployments.Release
    consistency: read_your_writes
    params:
      - {name: environment_id, type: weft.shared.EnvironmentId}
    filter: environment_id == param.environment_id
    fields:
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: formation_revision_id, type: weft.shared.FormationRevisionId}
      - {name: plan_id, type: weft.shared.PlanId}
      - {name: strategy, type: weft.deployments.RolloutStrategy}
      - {name: rollback_of, type: Optional<weft.shared.ReleaseId>}
      - {name: created_by, type: weft.shared.PrincipalId}
      - {name: created_at, type: Timestamp}
      - {name: live_at, type: Optional<Timestamp>}
      - {name: failure, type: Optional<String>}
      - {name: state, type: weft.deployments.Release.State}

  # Section 5 "ReleaseStep: ordered steps of a release".
  - name: weft.deployments.ReleaseSteps
    source: weft.deployments.ReleaseStep
    consistency: read_your_writes
    params:
      - {name: release_id, type: weft.shared.ReleaseId}
    filter: release_id == param.release_id
    fields:
      - {name: step_id, type: weft.shared.ReleaseStepId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: position, type: Integer}
      - {name: kind, type: weft.deployments.StepKind}
      - {name: component, type: Optional<weft.shared.ComponentName>}
      - {name: job_id, type: Optional<weft.shared.JobId>}
      - {name: workload_id, type: Optional<weft.shared.WorkloadId>}
      - {name: replicas, type: Optional<Integer>}
      - {name: ready_replicas, type: Optional<Integer>}
      - {name: failure, type: Optional<String>}
      - {name: started_at, type: Optional<Timestamp>}
      - {name: ended_at, type: Optional<Timestamp>}
      - {name: state, type: weft.deployments.ReleaseStep.State}

  # Section 15 "A rollout step waits for the new instances to be ready", level form: every
  # running rollout step, across releases, with the workload and count the ReleaseController
  # checks against weft.workloads.ReadyInstances(workload_id) before CompleteRolloutStep. Also
  # lists a step ReapplyDrift set running again (section 14 R7).
  - name: weft.deployments.RunningRolloutSteps
    source: weft.deployments.ReleaseStep
    consistency: read_your_writes
    filter:
      all:
        - kind == Rollout
        - state == Running
    fields:
      - {name: step_id, type: weft.shared.ReleaseStepId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: position, type: Integer}
      - {name: component, type: Optional<weft.shared.ComponentName>}
      - {name: workload_id, type: Optional<weft.shared.WorkloadId>}
      - {name: replicas, type: Optional<Integer>}
      - {name: started_at, type: Optional<Timestamp>}

  # Section 5 "Drift: the difference between the live release and what the nodes report."
  - name: weft.deployments.DriftReport
    source: weft.deployments.Drift
    consistency: read_your_writes
    params:
      - {name: release_id, type: weft.shared.ReleaseId}
    filter: release_id == param.release_id
    fields:
      - {name: drift_id, type: weft.shared.DriftId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: kind, type: weft.deployments.DriftKind}
      - {name: component, type: Optional<weft.shared.ComponentName>}
      - {name: instance_id, type: Optional<weft.shared.InstanceId>}
      - {name: node_id, type: Optional<weft.shared.NodeId>}
      - {name: detail, type: String}
      - {name: step_id, type: Optional<weft.shared.ReleaseStepId>}
      - {name: escalation, type: Optional<String>}
      - {name: observed_at, type: Timestamp}
      - {name: resolved_at, type: Optional<Timestamp>}
      - {name: state, type: weft.deployments.Drift.State}

  # Section 14 R7, level form: every drift no controller has acted on yet (a missed
  # DriftDetected edge is repaired from here). A row with step_id goes to ReapplyDrift, one
  # without to EscalateDrift.
  - name: weft.deployments.OpenDrifts
    source: weft.deployments.Drift
    consistency: read_your_writes
    filter: state == Open
    fields:
      - {name: drift_id, type: weft.shared.DriftId}
      - {name: release_id, type: weft.shared.ReleaseId}
      - {name: kind, type: weft.deployments.DriftKind}
      - {name: step_id, type: Optional<weft.shared.ReleaseStepId>}
      - {name: component, type: Optional<weft.shared.ComponentName>}
      - {name: observed_at, type: Timestamp}
