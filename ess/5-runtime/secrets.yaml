# Secrets: custody, versions, grants, delivery. Source: docs/domain-sketch.md "7. Secrets"
# (lines 370-383), with "Channels" (line 92-93), "Actors" (lines 95-116), "8. Workload identity"
# (line 396) and "11. Node control" (line 430, `DeliverSecret`).
#
# By construction: the type `weft.secrets.SecretValue` appears in exactly one place, the input of
# `weft.secrets.AddSecretVersion`. No entity field, event field, error field, view field or command
# response carries it. Stored state holds `weft.secrets.SecretValueRef`, a reference into the
# backend (sketch line 378: "Cluster state holds references only").
domain: weft.secrets


entities:
  # Sketch line 382: "every delivery is an audit event (secret, version, instance, time)". Held as
  # a record so it can be read back; it carries no value.
  # OPEN: how long delivery records are kept.
  - name: weft.secrets.SecretDelivery
    naming:
      summary: The audit record of one secret version delivered to one instance at its start.
    identity:
      name: delivery_id
      type: weft.shared.SecretDeliveryId
    fields:
      - name: secret_id
        type: weft.shared.SecretId
      - name: version_id
        type: weft.shared.SecretVersionId
      - name: grant_id
        type: weft.shared.SecretGrantId
      - name: instance_id
        type: weft.shared.InstanceId
      - name: identity
        type: weft.shared.WorkloadIdentity
      # The identity document the instance showed (section 8).
      - name: identity_document_id
        type: weft.shared.IdentityDocumentId
      - name: delivered_at
        type: Timestamp
    relations:
      - name: secret
        kind: references
        target: weft.secrets.Secret
        cardinality: one
        via: secret_id
      - name: version
        kind: references
        target: weft.secrets.SecretVersion
        cardinality: one
        via: version_id
      - name: grant
        kind: references
        target: weft.secrets.SecretGrant
        cardinality: one
        via: grant_id
      - name: instance_id
        kind: references
        target: weft.workloads.Instance
        cardinality: one
        via: instance_id
      - name: identity_document
        kind: references
        target: weft.identity.IdentityDocument
        cardinality: one
        via: identity_document_id
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

errors:
  - name: weft.secrets.VersionOfOtherSecret
    summary: The version belongs to another secret, and nothing changed.
  - name: weft.secrets.NoGrant
    summary: No grant names this secret for this identity, and nothing was delivered.
  - name: weft.secrets.GrantRevoked
    summary: The grant is revoked, and nothing was delivered.
  - name: weft.secrets.VersionNotGranted
    summary: >-
      The version is not the one the grant allows (its pinned version, or the secret's latest), and
      nothing was delivered.
  - name: weft.secrets.NotAtStart
    summary: The instance is not starting; a value reaches an instance only at start.
  - name: weft.secrets.IdentityUnverified
    summary: >-
      The instance's identity document is unknown, of another instance, expired or revoked, does
      not verify or names another identity, and nothing was delivered.
  - name: weft.secrets.InstanceOutsideAccount
    summary: >-
      The instance's identity document names another account than the secret's, and nothing was
      delivered.

events:
  # Sketch line 382: the audit event (secret, version, instance, time).
  - name: weft.secrets.SecretDelivered
    fields:
      - {name: delivery_id, type: weft.shared.SecretDeliveryId}
      - {name: secret_id, type: weft.shared.SecretId}
      - {name: version_id, type: weft.shared.SecretVersionId}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: delivered_at, type: Timestamp}

commands:
  # Sketch lines 380-382: "a value reaches an instance only at start, only through a grant";
  # "every delivery is an audit event (secret, version, instance, time)". Section 11 line 430:
  # `DeliverSecret` from the control plane to the node agent; "Channels" lines 92-93: the instance
  # reads it from the node's local endpoint. This command is the control plane's decision and
  # its audit record. The value itself travels on the node channel (protocols/node-channel.yaml),
  # read from the backend by `value_ref`; nothing here carries it.
  - name: weft.secrets.DeliverSecret
    naming:
      display: Deliver a secret to a starting instance
    input:
      - {name: grant_id, type: weft.shared.SecretGrantId}
      - {name: secret_id, type: weft.shared.SecretId}
      - {name: version_id, type: weft.shared.SecretVersionId}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: identity, type: weft.shared.WorkloadIdentity}
      # Sketch line 92-93 and section 8: the instance shows its identity document at the node's
      # local endpoint; the node agent names the document it was shown.
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}
    outcomes:
      - name: no-grant
        when_related: {via: input.grant_id, exists: false}
        error: weft.secrets.NoGrant
      - name: no-such-version
        when_related: {via: input.version_id, exists: false}
        error: weft.secrets.NoSuchVersion
      # Sketch line 381 "only at start": an unknown instance is not starting.
      - name: no-such-instance
        when_related: {via: input.instance_id, exists: false}
        error: weft.secrets.NotAtStart
      # Section 8 (sketch lines 390-393): the document the instance showed must exist.
      - name: no-identity-document
        when_related: {via: input.identity_document_id, exists: false}
        error: weft.secrets.IdentityUnverified
      - name: grant-revoked
        when_related: {via: input.grant_id, predicate: state == Revoked}
        error: weft.secrets.GrantRevoked
      - name: grant-for-other-identity
        when_related: {via: input.grant_id, predicate: identity != input.identity}
        error: weft.secrets.NoGrant
      - name: grant-for-other-secret
        when_related: {via: input.grant_id, predicate: secret_id != input.secret_id}
        error: weft.secrets.NoGrant
      - name: version-of-other-secret
        when_related: {via: input.version_id, predicate: secret_id != input.secret_id}
        error: weft.secrets.VersionOfOtherSecret
      - name: version-disabled
        when_related: {via: input.version_id, predicate: state == Disabled}
        error: weft.secrets.VersionDisabled
      - name: not-the-pinned-version
        when_related:
          via: input.grant_id
          predicate: {all: [pin == Pinned, pinned_version_id != input.version_id]}
        error: weft.secrets.VersionNotGranted
      - name: not-the-latest-version
        when_related:
          entity: weft.secrets.SecretVersion
          where:
            all:
              - secret_id == input.secret_id
              - exists:
                  in: {entity: weft.secrets.SecretVersion}
                  as: d
                  that: {all: [d.secret_id == secret_id, d.version_id == input.version_id, d.created_at < created_at]}
              - exists:
                  in: {entity: weft.secrets.SecretGrant}
                  as: g
                  that: {all: [g.secret_id == secret_id, g.grant_id == input.grant_id, g.pin == Latest]}
          exists: true
        error: weft.secrets.VersionNotGranted
      # Sketch line 381 "only at start": the instance's own record says whether it is starting
      # (weft.workloads.Instance, moved to Starting by RecordArtifactVerified). An unknown instance
      # is not starting.
      # OPEN: whether a node may fetch the values while the instance is still Scheduled (before
      # the artifact is verified). Taken: no, Starting only.
      - name: not-at-start
        when_related: {via: input.instance_id, predicate: state != Starting}
        error: weft.secrets.NotAtStart
      # Section 8 (sketch lines 390-393): the document the instance showed must be a live one of
      # this instance (weft.identity.IdentityDocument).
      - name: identity-document-of-other-instance
        when_related: {via: input.identity_document_id, predicate: instance_id != input.instance_id}
        error: weft.secrets.IdentityUnverified
      - name: identity-document-not-live
        when_related: {via: input.identity_document_id, predicate: {any: [state == Expired, state == Revoked]}}
        error: weft.secrets.IdentityUnverified
      # Isolation: a value never reaches an instance of another account than the secret's. The
      # account is read from the instance's identity document (its issuer copies it from the
      # instance's record; weft.workloads.Instance.scope_id is copied from the workload, which
      # synthesis cannot arrange beside a secret).
      # OPEN: whether an account-scope secret may reach the instances of its sub-accounts. Taken:
      # no, the same account only.
      # Written as: the secret has no document of its own account with this id.
      - name: document-of-other-account
        when_related:
          entity: weft.secrets.Secret
          where:
            all:
              - secret_id == input.secret_id
              - not:
                  exists:
                    in: {entity: weft.identity.IdentityDocument}
                    as: d
                    that: {all: [d.scope_id == scope_id, d.identity_document_id == input.identity_document_id]}
          exists: true
        error: weft.secrets.InstanceOutsideAccount
      # hardening pass 1 D9: "a secret is delivered only to an instance of its own scope". A
      # Formation- or Environment-scope secret reaches only an instance whose identity document
      # names the secret's formation (and environment); both sides are stored, so this is a guard,
      # not an external. Written as: the secret has a formation (environment) and no document of
      # that formation (environment) with this id.
      - name: document-outside-formation-scope
        when_related:
          entity: weft.secrets.Secret
          where:
            all:
              - secret_id == input.secret_id
              - defined(formation_id)
              - not:
                  exists:
                    in: {entity: weft.identity.IdentityDocument}
                    as: d
                    that: {all: [d.formation_id == formation_id, d.identity_document_id == input.identity_document_id]}
          exists: true
        error: weft.secrets.IdentityOutsideScope
      - name: document-outside-environment-scope
        when_related:
          entity: weft.secrets.Secret
          where:
            all:
              - secret_id == input.secret_id
              - defined(environment_id)
              - not:
                  exists:
                    in: {entity: weft.identity.IdentityDocument}
                    as: d
                    that: {all: [d.environment_id == environment_id, d.identity_document_id == input.identity_document_id]}
          exists: true
        error: weft.secrets.IdentityOutsideScope
      # Kept external: the signature check is cryptography over the signed bytes, which weft does
      # not store; the document stores the instance-level path, not the component-level identity
      # a grant names, so the prefix match is a string rule over its segments; and a document past
      # its `expires_at` that ExpireIdentityDocument has not marked yet is refused here, because
      # the issuer generates that instant and synthesis arranges no clock value for a generated
      # one (a stored `expires_at <= now` guard leaves every outcome of the command unscenarioed).
      - name: identity-unverified
        external: the document's signature does not verify against its trust domain's keys, or it is past its expires_at, or its path without the instance segment is not input.identity
        error: weft.secrets.IdentityUnverified
      # Kept external: the backend store or vault holds the value; weft stores only its reference.
      - name: unavailable
        external: the secret's backend does not return the value for this version
        error: weft.secrets.BackendUnavailable
      - name: delivered
        creates: weft.secrets.SecretDelivery
        instance: delivery_id
        sets:
          secret_id: input.secret_id
          version_id: input.version_id
          grant_id: input.grant_id
          instance_id: input.instance_id
          identity: input.identity
          identity_document_id: input.identity_document_id
          delivered_at: {payload: weft.secrets.SecretDelivered.delivered_at}
        emits: [weft.secrets.SecretDelivered]
        payload:
          weft.secrets.SecretDelivered:
            delivery_id: {generated: true}
            secret_id: input.secret_id
            version_id: input.version_id
            instance_id: input.instance_id
            delivered_at: {generated: true}

# No view publishes a SecretValue (none exists in stored state) or a version's `value_ref`.
views:
  # Sketch line 382: the delivery audit of one secret.
  - name: weft.secrets.SecretDeliveries
    source: weft.secrets.SecretDelivery
    consistency: read_your_writes
    params:
      - {name: secret_id, type: weft.shared.SecretId}
    filter: secret_id == param.secret_id
    fields:
      - {name: delivery_id, type: weft.shared.SecretDeliveryId}
      - {name: secret_id, type: weft.shared.SecretId}
      - {name: version_id, type: weft.shared.SecretVersionId}
      - {name: grant_id, type: weft.shared.SecretGrantId}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: identity, type: weft.shared.WorkloadIdentity}
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}
      - {name: delivered_at, type: Timestamp}
