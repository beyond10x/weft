# Observability: log streams, metric series, alert rules and their alerts, notification targets,
# telemetry sinks and the telemetry policy of a formation or environment. Source:
# docs/domain-sketch.md "16. Observability (logs, metrics, traces)" (lines 613-641), with "15.
# Health" (lines 600-611: check results, restarts, backing-off) and "11. Node control" (lines
# 467-477: the node agent reports what it observed) as context.
#
# What this domain records and what it does not.
# - Rows are the metadata of telemetry: which streams, series, rules, alerts, sinks and policies
#   exist, who owns them and in which state they are. Log lines, metric samples and spans are not
#   rows: their volume belongs to a telemetry store, read through the exec channel's `Logs` kind
#   (protocols/exec-channel.yaml) and the store's query API.
#   OPEN: the telemetry store (which engine, where it runs, whether it is a weft-on-weft formation
#   like a catalog offering) and its query API are not decided by the sketch.
# - Kept apart from metering (line 615-617): no price, no usage record, no meter here. Metering
#   (layer 8) may meter the volume of telemetry ingested and stored; it reads this domain, never
#   the other way.
# - Isolation (line 638-639): every row of a tenant names its owner account; an account reads only
#   its own rows (every user view is filtered by `account_id == param.account_id`, the caller's
#   account bound by `weft.actors`). A node-level series names its node and no account; only the
#   ClusterOperator reads it. Every guard below that crosses an account refuses; there is no
#   fallback.
domain: weft.observability

summary: >-
  Logs, metrics, alerts and traces of instances, nodes and weft itself: which log streams, metric
  series, alert rules, alerts, notification targets, telemetry sinks and telemetry policies exist,
  who owns them, and where telemetry is forwarded. docs/domain-sketch.md § 16.

naming:
  wire: observability
  display: Observability

types:
  # Line 620-621: a stream carries "stdout and stderr of one process of one instance, plus weft's
  # own events about the instance". Process: one per process; Events: one per instance, weft's
  # own events (scheduled, started, check failed, restarted, evicted).
  # OPEN: whether stdout and stderr are one stream with a tag per line or two streams. Taken: one
  # stream per process, each line tagged by the store.
  - name: weft.observability.LogStreamKind
    kind: enum
    variants: [Process, Events]

  # Line 623 and 636-637: the three signals a sink takes and a policy routes.
  - name: weft.observability.Signal
    kind: enum
    variants: [Logs, Metrics, Traces]

  # Line 623: "forward to an outside receiver (OTLP, syslog, a bucket of the account)".
  - name: weft.observability.SinkProtocol
    kind: enum
    variants: [Otlp, Syslog, Bucket]

  # Line 626-629: system metrics come from the node agent; custom metrics are pushed by an
  # instance over OTLP.
  - name: weft.observability.SeriesSource
    kind: enum
    variants: [System, Custom]

  # Line 630: a series' name, e.g. `cpu_seconds`, `http_requests_total`.
  # OPEN: the naming rule (OpenTelemetry semantic conventions, Prometheus names). Not checked here.
  - name: weft.observability.MetricName
    kind: newtype
    of: String

  # Line 631: "a condition over a series and a window". The condition is the series aggregated
  # over the window, compared with a threshold.
  # OPEN: which aggregations. Taken: the four every metrics backend offers.
  - name: weft.observability.Aggregation
    kind: enum
    variants: [Average, Minimum, Maximum, Sum]

  - name: weft.observability.Comparison
    kind: enum
    variants: [Above, Below]

  # Line 632: "a NotificationTarget (webhook, email, a queue of the catalog)".
  - name: weft.observability.NotificationKind
    kind: enum
    variants: [Webhook, Email, CatalogQueue]

  # Why an alert ended.
  - name: weft.observability.AlertResolution
    kind: enum
    variants: [ConditionCleared, RuleDeleted]

entities:
  # Line 620-622: "`LogStream`: stdout and stderr of one process of one instance, plus weft's own
  # events about the instance"; "Retention per account, bounded by the plan".
  # The record is the stream, not its lines. Opened when its process starts (Process) or when the
  # instance is scheduled (Events); closed when the process or the instance ends; expired, with its
  # stored lines dropped, once its retention has passed.
  - name: weft.observability.LogStream
    naming:
      summary: >-
        The log of one process of one instance, or weft's own events about one instance, with the
        retention its stored lines are kept for.
    identity:
      name: log_stream_id
      type: weft.shared.LogStreamId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: instance_id
        type: weft.shared.InstanceId
      - name: node_id
        type: weft.shared.NodeId
      - name: kind
        type: weft.observability.LogStreamKind
      # The process's name in its workload (weft.workloads.Process.name); absent for Events.
      - name: process
        type: Optional<String>
      # Days the stored lines are kept after the stream closes. The opener takes it from the
      # telemetry policy of the instance's environment, else of its formation.
      # OPEN: the value when neither has a policy (a cluster default), and whether the sketch's
      # "retention per account" is a third, account-wide level. Taken: the opener's value, bounded
      # below.
      - name: retention_days
        type: Integer
      - name: opened_at
        type: Timestamp
      - name: closed_at
        type: Optional<Timestamp>
      # closed_at plus retention_days.
      - name: retained_until
        type: Optional<Timestamp>
    invariants:
      - retention_days >= 1
      - retention_days <= 365
    relations:
      - {name: account, kind: references, target: weft.accounts.Account, cardinality: one, via: account_id}
      - {name: instance, kind: references, target: weft.workloads.Instance, cardinality: one, via: instance_id}
      - {name: node, kind: references, target: weft.infrastructure.Node, cardinality: one, via: node_id}
    lifecycle:
      initial: Open
      states:
        - {name: Open, summary: Lines are appended and can be read live.}
        - {name: Closed, summary: "The process or instance ended; the stored lines are kept until retained_until."}
        - {name: Expired, summary: Past its retention; the stored lines are dropped.}
      terminal: [Expired]
      transitions:
        - {name: close, from: [Open], to: Closed}
        - {name: expire, from: [Closed], to: Expired}

  # Line 623: "`TelemetrySink`: forward to an outside receiver (OTLP, syslog, a bucket of the
  # account)"; line 636-637: a policy says "which signals go to which sink". A sink belongs to one
  # account and lists the signals it accepts; a policy routes each signal to at most one sink.
  # OPEN: how weft authenticates to an outside receiver (a header token, mutual TLS). A credential
  # would be a reference to a weft.secrets.Secret, never a value; the sketch names none, so no
  # field is written.
  # OPEN: whether forwarding to an outside endpoint passes the formation's egress rules (default
  # deny, section 4) or is weft's own egress. Taken: weft's own, from the control plane.
  - name: weft.observability.TelemetrySink
    naming:
      summary: >-
        An outside receiver of one account's telemetry: an OTLP endpoint, a syslog endpoint or a
        bucket of the account, for the signals it lists.
    identity:
      name: telemetry_sink_id
      type: weft.shared.TelemetrySinkId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: name
        type: String
      - name: protocol
        type: weft.observability.SinkProtocol
      # OTLP or syslog: the receiver's address (URL or host:port). Absent for Bucket.
      - name: endpoint
        type: Optional<String>
      # Bucket: a bucket of the same account. Absent otherwise.
      - name: bucket_id
        type: Optional<weft.shared.BucketId>
      - name: signals
        type: List<weft.observability.Signal>
      # The last delivery error, while Failing.
      - name: failure_reason
        type: Optional<String>
    invariants:
      - signals.count >= 1
      - any:
          - all: [protocol == Bucket, defined(bucket_id), not defined(endpoint)]
          - all: [protocol != Bucket, defined(endpoint), not defined(bucket_id)]
    relations:
      - {name: account, kind: references, target: weft.accounts.Account, cardinality: one, via: account_id}
      - {name: bucket, kind: references, target: weft.resources.Bucket, cardinality: one, via: bucket_id}
    # Brief: configured, active, failing, removed. Configured until the first delivery is
    # confirmed; a failed delivery makes it Failing and a later one Active again.
    # OPEN: whether telemetry is buffered while a sink fails, and for how long. Not decided here.
    lifecycle:
      initial: Configured
      states:
        - {name: Configured, summary: Written; no delivery confirmed yet.}
        - {name: Active, summary: The last delivery succeeded.}
        - {name: Failing, summary: "The last delivery failed; failure_reason says why."}
        - {name: Removed, summary: Takes no telemetry.}
      terminal: [Removed]
      transitions:
        - {name: deliver, from: [Configured, Failing], to: Active}
        - {name: fail, from: [Configured, Active], to: Failing}
        - {name: remove, from: [Configured, Active, Failing], to: Removed}

  # Line 632: "a `NotificationTarget` (webhook, email, a queue of the catalog)". Owned by one
  # account; an alert rule of the same account names it.
  - name: weft.observability.NotificationTarget
    naming:
      summary: "Where one account's alerts are sent: a webhook URL, an email address or a catalog queue."
    identity:
      name: notification_target_id
      type: weft.shared.NotificationTargetId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: name
        type: String
      - name: kind
        type: weft.observability.NotificationKind
      # A webhook URL, an email address, or a catalog queue's address.
      # OPEN: a catalog queue is a weft.catalog.ServiceInstance (layer 7), which this layer-5
      # domain cannot reference, so its address is kept as a value and whether it names a queue of
      # the same account is checked outside the model (an `external` refusal on
      # AddNotificationTarget). Moving the target, or its queue kind, into the catalog would make
      # that a checked relation.
      # OPEN: how a webhook call is authenticated (a signing secret) and how an email address is
      # confirmed. Not decided by the sketch.
      - name: address
        type: String
    relations:
      - {name: account, kind: references, target: weft.accounts.Account, cardinality: one, via: account_id}
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: Receives the alerts of the rules that name it.}
        - {name: Removed, summary: Receives nothing.}
      terminal: [Removed]
      transitions:
        - {name: remove, from: [Active], to: Removed}

  # Line 626-630: "System metrics per instance and node: CPU, memory, disk I/O, network in and
  # out, restarts, check results"; "Custom metrics: an instance pushes OTLP to the node-local
  # endpoint, authenticated by its workload identity"; "`MetricSeries` (name, labels, owner
  # account)". The record is the series, not its samples.
  # Isolation (line 638-639, brief): a series of an instance names the instance's account, taken
  # from the instance record, never from the caller; a node-level series names its node and no
  # account, and only the ClusterOperator reads it.
  # OPEN: series at the edge and links (requests, errors, latency, line 627) name a route or a
  # link of a formation, not an instance or a node. Not modelled until the edge's domain is
  # written; they would carry the formation's account and no instance.
  # OPEN: line 630 "`ScaleRule` and `SleepPolicy` read series". Both live in layer 4
  # (weft.workloads), which cannot reference this layer-5 entity; ScaleRule names a
  # weft.workloads.ScaleMetric enum instead. The scaler reads series by name and labels at run
  # time.
  - name: weft.observability.MetricSeries
    naming:
      summary: >-
        One metric series, a name with its labels, of one instance (owned by its account) or of
        one node (owned by no account); system series come from the node agent, custom ones from
        the instance.
    identity:
      name: metric_series_id
      type: weft.shared.MetricSeriesId
    fields:
      - name: name
        type: weft.observability.MetricName
      - name: labels
        type: Map<String, String>
      - name: source
        type: weft.observability.SeriesSource
      # The node that reports it: the subject of a node-level series, the instance's node
      # otherwise.
      - name: node_id
        type: weft.shared.NodeId
      # Present together: a series of an instance and its owner account.
      - name: instance_id
        type: Optional<weft.shared.InstanceId>
      - name: account_id
        type: Optional<weft.shared.AccountId>
      # Line 628-629 "authenticated by its workload identity": the identity document a custom
      # series was first pushed with, as RegisterInstanceSeries checked it; absent when the
      # registration named none (a System series). Kept so the check reads a declared relation.
      - name: identity_document_id
        type: Optional<weft.shared.IdentityDocumentId>
      - name: registered_at
        type: Timestamp
    invariants:
      - any:
          - all: [defined(account_id), defined(instance_id)]
          - all: [not defined(account_id), not defined(instance_id), source == System]
    relations:
      - {name: node, kind: references, target: weft.infrastructure.Node, cardinality: one, via: node_id}
      - {name: instance, kind: references, target: weft.workloads.Instance, cardinality: one, via: instance_id}
      - {name: account, kind: references, target: weft.accounts.Account, cardinality: one, via: account_id}
      - {name: identity_document, kind: references, target: weft.identity.IdentityDocument, cardinality: one, via: identity_document_id}
    # OPEN: when a series ends (its instance ended, no sample for a while, its retention passed).
    # Taken: retired by the control plane when its instance ends or its node is removed; its
    # samples stay for the metrics retention of the policy.
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: Takes samples.}
        - {name: Retired, summary: Takes no samples; stored samples stay readable until their retention ends.}
      terminal: [Retired]
      transitions:
        - {name: retire, from: [Active], to: Retired}

  # Line 631: "`AlertRule`: a condition over a series and a window". The condition is: the series
  # aggregated over the window is above (or below) the threshold. A rule belongs to one account
  # and reads only a series of that account.
  # OPEN: whether a rule selects one series (written here) or every series of a name and labels
  # across the instances of a component, which survives a restart; an instance series ends with
  # its instance.
  # OPEN: rules over node-level series for the ClusterOperator. Taken: none; a rule has an account.
  # OPEN: bounds of the window and a "for" duration before firing. Not written.
  - name: weft.observability.AlertRule
    naming:
      summary: >-
        A condition over one metric series of an account, aggregated over a window and compared
        with a threshold, and the target its alerts are sent to.
    identity:
      name: alert_rule_id
      type: weft.shared.AlertRuleId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: name
        type: String
      - name: metric_series_id
        type: weft.shared.MetricSeriesId
      - name: aggregation
        type: weft.observability.Aggregation
      - name: window
        type: Duration
      - name: comparison
        type: weft.observability.Comparison
      - name: threshold
        type: Binary64
      - name: notification_target_id
        type: weft.shared.NotificationTargetId
    relations:
      - {name: account, kind: references, target: weft.accounts.Account, cardinality: one, via: account_id}
      - {name: series, kind: references, target: weft.observability.MetricSeries, cardinality: one, via: metric_series_id}
      - {name: target, kind: references, target: weft.observability.NotificationTarget, cardinality: one, via: notification_target_id}
    # OPEN: silencing a rule for a while (disable, enable). Not written; delete and create again.
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: Evaluated over its series.}
        - {name: Deleted, summary: Not evaluated.}
      terminal: [Deleted]
      transitions:
        - {name: delete, from: [Active], to: Deleted}

  # Line 631-632: "`Alert` firing / resolved -> a `NotificationTarget`". One alert per firing of a
  # rule; at most one firing alert per rule. The rule's account and target are copied at fire, so
  # an alert reads the same after its rule is deleted.
  - name: weft.observability.Alert
    naming:
      summary: >-
        One firing of an alert rule, from the moment its condition held until it cleared, and
        whether its target was notified.
    identity:
      name: alert_id
      type: weft.shared.AlertId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: alert_rule_id
        type: weft.shared.AlertRuleId
      - name: notification_target_id
        type: weft.shared.NotificationTargetId
      # The aggregated value that met the condition.
      - name: value
        type: Binary64
      - name: fired_at
        type: Timestamp
      - name: resolved_at
        type: Optional<Timestamp>
      - name: resolution
        type: Optional<weft.observability.AlertResolution>
      # The last confirmed notification of the target (firing or resolved).
      - name: notified_at
        type: Optional<Timestamp>
      # The last failed notification's error; cleared by a later delivery.
      - name: notification_error
        type: Optional<String>
    relations:
      - {name: account, kind: references, target: weft.accounts.Account, cardinality: one, via: account_id}
      - {name: rule, kind: references, target: weft.observability.AlertRule, cardinality: one, via: alert_rule_id}
      - {name: target, kind: references, target: weft.observability.NotificationTarget, cardinality: one, via: notification_target_id}
    lifecycle:
      initial: Firing
      states:
        - {name: Firing, summary: The rule's condition holds.}
        - {name: Resolved, summary: "The condition cleared, or its rule was deleted."}
      terminal: [Resolved]
      transitions:
        - {name: resolve, from: [Firing], to: Resolved}

  # Line 636-637: "`TelemetryPolicy` per formation or environment: sampling (ratio, always on
  # error), retention, which signals go to which sink". Brief: retention per signal.
  # A policy without an environment covers the whole formation; one with an environment covers
  # that environment and wins over the formation's.
  # Line 622 "Retention per account, bounded by the plan": the plan is not a record of any layer
  # this domain may read (plans live in the catalog, layer 7, and metering, layer 8).
  # OPEN: where an account's plan bound on retention is recorded. Taken: a fixed bound of 1 to 365
  # days here, and an `external` refusal for the plan's bound.
  # OPEN: sampling of traces begins at the edge and links (line 635); whether an instance's own
  # spans obey the same ratio is not said.
  - name: weft.observability.TelemetryPolicy
    naming:
      summary: >-
        How the telemetry of one formation, or of one of its environments, is sampled, how long
        each signal is kept and which sink each signal is forwarded to.
    identity:
      name: telemetry_policy_id
      type: weft.shared.TelemetryPolicyId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: formation_id
        type: weft.shared.FormationId
      - name: environment_id
        type: Optional<weft.shared.EnvironmentId>
      # Share of traces kept, 0 to 1.
      - name: trace_sampling_ratio
        type: Binary64
      # "always on error": a trace with an error span is kept whatever the ratio.
      - name: keep_error_traces
        type: Boolean
      - name: logs_retention_days
        type: Integer
      - name: metrics_retention_days
        type: Integer
      - name: traces_retention_days
        type: Integer
      # Absent: the signal is kept in weft and forwarded nowhere.
      - name: logs_sink_id
        type: Optional<weft.shared.TelemetrySinkId>
      - name: metrics_sink_id
        type: Optional<weft.shared.TelemetrySinkId>
      - name: traces_sink_id
        type: Optional<weft.shared.TelemetrySinkId>
    invariants:
      - trace_sampling_ratio >= 0.0
      - trace_sampling_ratio <= 1.0
      - logs_retention_days >= 1
      - logs_retention_days <= 365
      - metrics_retention_days >= 1
      - metrics_retention_days <= 365
      - traces_retention_days >= 1
      - traces_retention_days <= 365
    relations:
      - {name: account, kind: references, target: weft.accounts.Account, cardinality: one, via: account_id}
      - {name: formation, kind: references, target: weft.formations.Formation, cardinality: one, via: formation_id}
      - {name: environment, kind: references, target: weft.formations.Environment, cardinality: one, via: environment_id}
      - {name: logs_sink, kind: references, target: weft.observability.TelemetrySink, cardinality: one, via: logs_sink_id}
      - {name: metrics_sink, kind: references, target: weft.observability.TelemetrySink, cardinality: one, via: metrics_sink_id}
      - {name: traces_sink, kind: references, target: weft.observability.TelemetrySink, cardinality: one, via: traces_sink_id}
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: In force for its formation or environment.}
        - {name: Removed, summary: "Not in force; the formation's policy, or the default, applies."}
      terminal: [Removed]
      transitions:
        - {name: remove, from: [Active], to: Removed}

errors:
  - name: weft.observability.NotFound
    summary: The addressed record does not exist, and nothing changed.
  - name: weft.observability.StateConflict
    summary: The addressed record is not in a state this command acts from, and nothing changed.
  - name: weft.observability.RetentionOutOfBounds
    summary: A retention is outside 1 to 365 days, and nothing changed.
  - name: weft.observability.UnknownInstance
    summary: No instance has this identity, and nothing changed.
  - name: weft.observability.ForeignInstance
    summary: The instance belongs to another account, and nothing changed.
  - name: weft.observability.InstanceNotOnNode
    summary: The instance does not run on the calling node, and nothing changed.
  - name: weft.observability.InvalidStreamSource
    summary: >-
      A process stream names no process, or an events stream names one, so no stream was opened.
  - name: weft.observability.LogStreamExists
    summary: The instance already has an open stream for this source, so no second one was opened.
  - name: weft.observability.NotYetExpired
    summary: The stream's retention has not passed, so its lines were not dropped.
  - name: weft.observability.InvalidSinkTarget
    summary: >-
      A bucket sink names no bucket or an endpoint, or an OTLP or syslog sink names no endpoint or
      a bucket, so no sink was written.
  - name: weft.observability.EmptySignals
    summary: The sink lists no signal, and a sink that takes nothing is not written.
  - name: weft.observability.UnknownBucket
    summary: No bucket has this identity, so no sink was written.
  - name: weft.observability.BucketNotAvailable
    summary: The bucket is not available, so no sink was written.
  - name: weft.observability.SinkInUse
    summary: An active telemetry policy routes a signal to this sink, so it was not removed.
  - name: weft.observability.QueueNotInAccount
    summary: The address names no queue of the account in the catalog, so no target was written.
  - name: weft.observability.TargetInUse
    summary: An active alert rule names this target, so it was not removed.
  - name: weft.observability.IdentityNotValid
    summary: >-
      The identity document is unknown, belongs to another instance, or is expired or revoked, so
      the pushed series was not registered.
  - name: weft.observability.SeriesExists
    summary: An active series with this name and these labels already exists, so no second one was registered.
  - name: weft.observability.UnknownSeries
    summary: No metric series has this identity, so no rule was written.
  - name: weft.observability.SeriesNotActive
    summary: The series is retired, so no rule was written.
  - name: weft.observability.UnknownTarget
    summary: No notification target has this identity, and nothing changed.
  - name: weft.observability.TargetRemoved
    summary: The notification target is removed, and nothing changed.
  - name: weft.observability.UnknownRule
    summary: No alert rule has this identity, so no alert fired.
  - name: weft.observability.RuleNotActive
    summary: The alert rule is deleted, so no alert fired.
  - name: weft.observability.ConditionNotMet
    summary: The value does not meet the rule's condition, so no alert fired.
  - name: weft.observability.AlertAlreadyFiring
    summary: The rule already has a firing alert, so no second one fired.
  - name: weft.observability.InvalidSamplingRatio
    summary: The trace sampling ratio is outside 0 to 1, so no policy was written.
  - name: weft.observability.RetentionOverPlan
    summary: A retention exceeds the bound of the account's plan, so no policy was written.
  - name: weft.observability.UnknownFormation
    summary: No formation has this identity, so no policy was written.
  - name: weft.observability.FormationRetired
    summary: The formation is retired, so no policy was written.
  - name: weft.observability.UnknownEnvironment
    summary: No environment has this identity, so no policy was written.
  - name: weft.observability.EnvironmentNotInFormation
    summary: The environment belongs to another formation, so no policy was written.
  - name: weft.observability.TelemetryPolicyExists
    summary: >-
      An active policy already covers this formation or environment, so no second one was written.
  - name: weft.observability.UnknownSink
    summary: No telemetry sink has this identity, so the policy was not written.
  - name: weft.observability.SinkRemoved
    summary: The telemetry sink is removed, so the policy was not written.
  - name: weft.observability.SinkSignalMismatch
    summary: The telemetry sink does not list the signal routed to it, so the policy was not written.
  - name: weft.observability.AccountNotClosed
    summary: The account does not exist or is still open, so none of its telemetry config was removed.
  - name: weft.observability.InstanceNotEnded
    summary: The instance has not exited, failed or been evicted, so its streams and series stay open.
  - name: weft.observability.RuleNotDeleted
    summary: The alert rule is active; its alerts are resolved by the evaluator, and nothing changed.

events:
  - name: weft.observability.LogStreamOpened
    fields:
      - {name: log_stream_id, type: weft.shared.LogStreamId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: kind, type: weft.observability.LogStreamKind}

  - name: weft.observability.LogStreamClosed
    fields:
      - {name: log_stream_id, type: weft.shared.LogStreamId}

  - name: weft.observability.LogStreamExpired
    fields:
      - {name: log_stream_id, type: weft.shared.LogStreamId}

  # Carries no endpoint or bucket: an address is configuration, not an event.
  - name: weft.observability.TelemetrySinkConfigured
    fields:
      - {name: telemetry_sink_id, type: weft.shared.TelemetrySinkId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: protocol, type: weft.observability.SinkProtocol}
      - {name: signals, type: List<weft.observability.Signal>}

  - name: weft.observability.TelemetrySinkDelivered
    fields:
      - {name: telemetry_sink_id, type: weft.shared.TelemetrySinkId}

  - name: weft.observability.TelemetrySinkFailing
    fields:
      - {name: telemetry_sink_id, type: weft.shared.TelemetrySinkId}
      - {name: failure_reason, type: String}

  - name: weft.observability.TelemetrySinkRemoved
    fields:
      - {name: telemetry_sink_id, type: weft.shared.TelemetrySinkId}

  - name: weft.observability.NotificationTargetAdded
    fields:
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: kind, type: weft.observability.NotificationKind}

  - name: weft.observability.NotificationTargetRemoved
    fields:
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}

  - name: weft.observability.MetricSeriesRegistered
    fields:
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}
      - {name: name, type: weft.observability.MetricName}
      - {name: source, type: weft.observability.SeriesSource}
      - {name: node_id, type: weft.shared.NodeId}

  - name: weft.observability.MetricSeriesRetired
    fields:
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}

  - name: weft.observability.AlertRuleCreated
    fields:
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}

  - name: weft.observability.AlertRuleDeleted
    fields:
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}

  # The notifier reacts to AlertFired and AlertResolved (a binding of ess/components.yaml) and
  # reports with RecordAlertNotification.
  - name: weft.observability.AlertFired
    fields:
      - {name: alert_id, type: weft.shared.AlertId}
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}
      - {name: value, type: Binary64}

  - name: weft.observability.AlertResolved
    fields:
      - {name: alert_id, type: weft.shared.AlertId}
      - {name: resolution, type: weft.observability.AlertResolution}

  - name: weft.observability.AlertNotified
    fields:
      - {name: alert_id, type: weft.shared.AlertId}

  - name: weft.observability.AlertNotificationFailed
    fields:
      - {name: alert_id, type: weft.shared.AlertId}
      - {name: error, type: String}

  - name: weft.observability.TelemetryPolicySet
    fields:
      - {name: telemetry_policy_id, type: weft.shared.TelemetryPolicyId}
      - {name: formation_id, type: weft.shared.FormationId}

  - name: weft.observability.TelemetryPolicyRemoved
    fields:
      - {name: telemetry_policy_id, type: weft.shared.TelemetryPolicyId}

  # R6 and instance end (§ 14 line 590): one event per many-rows command, with the number of rows
  # it moved. Each row moved also gets its own event (TelemetryPolicyRemoved, ...).
  - name: weft.observability.AccountTelemetryPoliciesRemoved
    fields:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: removed, type: Integer}

  - name: weft.observability.AccountTelemetrySinksRemoved
    fields:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: removed, type: Integer}

  - name: weft.observability.AccountAlertRulesDeleted
    fields:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: deleted, type: Integer}

  - name: weft.observability.AccountNotificationTargetsRemoved
    fields:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: removed, type: Integer}

  - name: weft.observability.InstanceLogStreamsClosed
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: closed, type: Integer}

  - name: weft.observability.InstanceMetricSeriesRetired
    fields:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: retired, type: Integer}

commands:
  # Line 620-621. The node agent opens a Process stream when it starts the process; the control
  # plane opens the Events stream when the instance is scheduled.
  # OPEN: the actors (NodeAgent for Process, ControlPlane for Events) are the integrator's.
  - name: weft.observability.OpenLogStream
    naming:
      display: Open a log stream
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: kind, type: weft.observability.LogStreamKind}
      - {name: process, type: Optional<String>}
      - {name: retention_days, type: Integer}
    outcomes:
      - name: invalid-source
        when:
          any:
            - all: [kind == Process, not defined(input.process)]
            - all: [kind == Events, defined(input.process)]
        error: weft.observability.InvalidStreamSource
      - name: retention-out-of-bounds
        when: {any: [retention_days < 1, retention_days > 365]}
        error: weft.observability.RetentionOutOfBounds
      - name: unknown-instance
        when_related:
          via: input.instance_id
          exists: false
        error: weft.observability.UnknownInstance
      # Default deny: a stream is filed under the instance's own account, never the caller's word.
      - name: foreign-instance
        when_related:
          via: input.instance_id
          predicate: account_id != input.account_id
        error: weft.observability.ForeignInstance
      - name: instance-not-on-node
        when_related:
          via: input.instance_id
          predicate: node_id != input.node_id
        error: weft.observability.InstanceNotOnNode
      # Two guards: `process == input.process` is unknown when both are absent, so the one Events
      # stream of an instance needs its own selector, or a second one would open.
      - name: already-open
        when_related:
          entity: weft.observability.LogStream
          where:
            all:
              - defined(instance_id)
              - instance_id == input.instance_id
              - kind == input.kind
              - process == input.process
              - state == Open
          count: {gte: 1}
        error: weft.observability.LogStreamExists
      - name: events-already-open
        when_related:
          entity: weft.observability.LogStream
          where:
            all:
              - defined(instance_id)
              - instance_id == input.instance_id
              - kind == Events
              - input.kind == Events
              - state == Open
          count: {gte: 1}
        error: weft.observability.LogStreamExists
      - name: opened
        creates: weft.observability.LogStream
        instance: log_stream_id
        sets:
          account_id: input.account_id
          instance_id: input.instance_id
          node_id: input.node_id
          kind: input.kind
          process: input.process
          retention_days: input.retention_days
          opened_at: {generated: true}
        emits: [weft.observability.LogStreamOpened]
        payload:
          weft.observability.LogStreamOpened:
            log_stream_id: {generated: true}
            account_id: input.account_id
            instance_id: input.instance_id
            kind: input.kind

  # Line 620-621: the process exited or the instance ended (exited, failed, evicted).
  - name: weft.observability.CloseLogStream
    naming:
      display: Close a log stream
    input:
      - {name: log_stream_id, type: weft.shared.LogStreamId}
    outcomes:
      - name: no-such-stream
        unknown_instance: true
        error: weft.observability.NotFound
      - name: closed
        moves: weft.observability.LogStream.close
        instance: log_stream_id
        sets:
          closed_at: {generated: true, present: true}
          # closed_at plus retention_days.
          retained_until: {generated: true, present: true}
        emits: [weft.observability.LogStreamClosed]
        payload:
          weft.observability.LogStreamClosed:
            log_stream_id: input.log_stream_id
      - name: wrong-state
        wrong_state: true
        error: weft.observability.StateConflict

  # Line 622 "Retention": the stored lines are dropped once retained_until has passed.
  # Synthesis gap (ess 0.99.2, 2026-11-26): `not-yet-expired` and `expired` get no scenario
  # (ESS-SYNTH-001): retained_until is minted by the closer (closed_at plus retention_days), never
  # set from an input, so no row can be arranged on either side of `now`. The guard stays: taking
  # retained_until from the caller would let the caller shorten the retention.
  - name: weft.observability.ExpireLogStream
    naming:
      display: Expire a log stream
    input:
      - {name: log_stream_id, type: weft.shared.LogStreamId}
    outcomes:
      - name: no-such-stream
        unknown_instance: true
        error: weft.observability.NotFound
      - name: not-yet-expired
        when_subject:
          predicate: retained_until > now
        error: weft.observability.NotYetExpired
      - name: expired
        moves: weft.observability.LogStream.expire
        instance: log_stream_id
        emits: [weft.observability.LogStreamExpired]
        payload:
          weft.observability.LogStreamExpired:
            log_stream_id: input.log_stream_id
      - name: wrong-state
        wrong_state: true
        error: weft.observability.StateConflict

  # Line 623, an OTLP or syslog receiver outside weft. An account's admin writes a sink; it is
  # Configured until the forwarder confirms a delivery.
  # OPEN: which roles may write a sink. Taken: account admins (it sends the account's telemetry
  # out of weft).
  - name: weft.observability.ConfigureTelemetrySink
    naming:
      display: Configure a telemetry sink
    input:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: name, type: String}
      - {name: protocol, type: weft.observability.SinkProtocol}
      - {name: endpoint, type: String}
      - {name: signals, type: List<weft.observability.Signal>}
    outcomes:
      # hardening pass 1 D3: the sink is written in the caller's account; another account answers
      # like a missing one.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.observability.NotFound
      # Synthesis gap (ess 0.99.2, 2026-11-26): no scenario (ESS-SYNTH-003, "no candidate
      # satisfies `signals.count == 0`"). The entity invariant `signals.count >= 1` keeps synthesis
      # from trying an empty list for this input; a two-command probe without the invariant gets
      # the scenario. Guard and invariant both stay.
      - name: no-signals
        when: signals.count == 0
        error: weft.observability.EmptySignals
      # A bucket sink is written with ConfigureBucketSink, which checks the bucket.
      - name: bucket-protocol
        when: protocol == Bucket
        error: weft.observability.InvalidSinkTarget
      - name: configured
        creates: weft.observability.TelemetrySink
        instance: telemetry_sink_id
        sets:
          account_id: input.account_id
          name: input.name
          protocol: input.protocol
          endpoint: input.endpoint
          signals: input.signals
        emits: [weft.observability.TelemetrySinkConfigured]
        payload:
          weft.observability.TelemetrySinkConfigured:
            telemetry_sink_id: {generated: true}
            account_id: input.account_id
            protocol: input.protocol
            signals: input.signals

  # Line 623, "a bucket of the account". Default deny: a sink writes only into an available
  # bucket of its own account.
  - name: weft.observability.ConfigureBucketSink
    naming:
      display: Configure a bucket as a telemetry sink
    input:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: name, type: String}
      - {name: bucket_id, type: weft.shared.BucketId}
      - {name: signals, type: List<weft.observability.Signal>}
    outcomes:
      # hardening pass 1 D3: the sink is written in the caller's account; another account answers
      # like a missing one.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.observability.NotFound
      - name: no-signals
        when: signals.count == 0
        error: weft.observability.EmptySignals
      - name: unknown-bucket
        when_related:
          via: input.bucket_id
          exists: false
        error: weft.observability.UnknownBucket
      # hardening pass 1 disclosure (ConfigureBucketSink bucket_id): another account's bucket
      # answers like a missing one, before its state is read.
      - name: foreign-bucket
        when_related:
          via: input.bucket_id
          predicate: account_id != input.account_id
        error: weft.observability.UnknownBucket
      - name: bucket-not-available
        when_related:
          via: input.bucket_id
          predicate: state != Available
        error: weft.observability.BucketNotAvailable
      - name: configured
        creates: weft.observability.TelemetrySink
        instance: telemetry_sink_id
        sets:
          account_id: input.account_id
          name: input.name
          protocol: Bucket
          bucket_id: input.bucket_id
          signals: input.signals
        emits: [weft.observability.TelemetrySinkConfigured]
        payload:
          weft.observability.TelemetrySinkConfigured:
            telemetry_sink_id: {generated: true}
            account_id: input.account_id
            protocol: Bucket
            signals: input.signals

  # Line 623. The forwarder reports what it observed: a delivery that succeeded.
  # OPEN: the forwarder's actor (a part of weft-control). The integrator names it.
  - name: weft.observability.RecordSinkDelivered
    naming:
      display: Record a telemetry sink delivery
    input:
      - {name: telemetry_sink_id, type: weft.shared.TelemetrySinkId}
    outcomes:
      - name: no-such-sink
        unknown_instance: true
        error: weft.observability.NotFound
      - name: delivered
        moves: weft.observability.TelemetrySink.deliver
        instance: telemetry_sink_id
        sets:
          failure_reason: {cleared: true}
        emits: [weft.observability.TelemetrySinkDelivered]
        payload:
          weft.observability.TelemetrySinkDelivered:
            telemetry_sink_id: input.telemetry_sink_id
      - name: wrong-state
        wrong_state: true
        error: weft.observability.StateConflict

  # Line 623. The forwarder reports a delivery that failed; the sink's owner sees why.
  - name: weft.observability.RecordSinkFailing
    naming:
      display: Record a telemetry sink failure
    input:
      - {name: telemetry_sink_id, type: weft.shared.TelemetrySinkId}
      - {name: failure_reason, type: String}
    outcomes:
      - name: no-such-sink
        unknown_instance: true
        error: weft.observability.NotFound
      - name: failing
        moves: weft.observability.TelemetrySink.fail
        instance: telemetry_sink_id
        sets:
          failure_reason: input.failure_reason
        emits: [weft.observability.TelemetrySinkFailing]
        payload:
          weft.observability.TelemetrySinkFailing:
            telemetry_sink_id: input.telemetry_sink_id
            failure_reason: input.failure_reason
      - name: wrong-state
        wrong_state: true
        error: weft.observability.StateConflict

  # Line 623. A sink an active policy still routes to is not removed: the policy is changed first,
  # so no signal is silently dropped.
  - name: weft.observability.RemoveTelemetrySink
    naming:
      display: Remove a telemetry sink
    input:
      - {name: telemetry_sink_id, type: weft.shared.TelemetrySinkId}
    outcomes:
      - name: no-such-sink
        unknown_instance: true
        error: weft.observability.NotFound
      # OPEN (hardening pass 1 D3): no caller tie here. ESS refuses a `when_subject` guard beside
      # the row-set guards below (ESS-COMMAND-009, "one command reads one kind of related row in
      # this cut"), so the sink's account is checked against the caller only by weft-api.
      # One guard per routed signal: a selector of one equality per guard is one synthesis can
      # arrange rows on both sides of; an `any:` of three is not (ESS-SYNTH-001).
      - name: in-use
        when_related:
          entity: weft.observability.TelemetryPolicy
          where:
            all:
              - logs_sink_id == input.telemetry_sink_id
              - state == Active
          count: {gte: 1}
        error: weft.observability.SinkInUse
      - name: in-use-metrics
        when_related:
          entity: weft.observability.TelemetryPolicy
          where:
            all:
              - metrics_sink_id == input.telemetry_sink_id
              - state == Active
          count: {gte: 1}
        error: weft.observability.SinkInUse
      - name: in-use-traces
        when_related:
          entity: weft.observability.TelemetryPolicy
          where:
            all:
              - traces_sink_id == input.telemetry_sink_id
              - state == Active
          count: {gte: 1}
        error: weft.observability.SinkInUse
      - name: removed
        moves: weft.observability.TelemetrySink.remove
        instance: telemetry_sink_id
        emits: [weft.observability.TelemetrySinkRemoved]
        payload:
          weft.observability.TelemetrySinkRemoved:
            telemetry_sink_id: input.telemetry_sink_id
      - name: wrong-state
        wrong_state: true
        error: weft.observability.StateConflict

  # Line 632.
  - name: weft.observability.AddNotificationTarget
    naming:
      display: Add a notification target
    input:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: name, type: String}
      - {name: kind, type: weft.observability.NotificationKind}
      - {name: address, type: String}
    outcomes:
      # hardening pass 1 D3: the target is written in the caller's account; another account
      # answers like a missing one.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.observability.NotFound
      # The catalog (layer 7) is above this domain; default deny until it confirms the queue is
      # one of the account's. Answers for kind CatalogQueue only.
      - name: queue-not-in-account
        external: the target is a catalog queue and its address names no queue of the account
        before_row: true
        error: weft.observability.QueueNotInAccount
      - name: added
        creates: weft.observability.NotificationTarget
        instance: notification_target_id
        sets:
          account_id: input.account_id
          name: input.name
          kind: input.kind
          address: input.address
        emits: [weft.observability.NotificationTargetAdded]
        payload:
          weft.observability.NotificationTargetAdded:
            notification_target_id: {generated: true}
            account_id: input.account_id
            kind: input.kind

  # Line 632. A target an active alert rule names is not removed: its alerts would go nowhere.
  - name: weft.observability.RemoveNotificationTarget
    naming:
      display: Remove a notification target
    input:
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}
    outcomes:
      - name: no-such-target
        unknown_instance: true
        error: weft.observability.NotFound
      # OPEN (hardening pass 1 D3): no caller tie here. ESS refuses a `when_subject` guard beside
      # the row-set guard below (ESS-COMMAND-009, "one command reads one kind of related row in
      # this cut"), so the target's account is checked against the caller only by weft-api.
      - name: in-use
        when_related:
          entity: weft.observability.AlertRule
          where:
            all:
              - notification_target_id == input.notification_target_id
              - state == Active
          count: {gte: 1}
        error: weft.observability.TargetInUse
      - name: removed
        moves: weft.observability.NotificationTarget.remove
        instance: notification_target_id
        emits: [weft.observability.NotificationTargetRemoved]
        payload:
          weft.observability.NotificationTargetRemoved:
            notification_target_id: input.notification_target_id
      - name: wrong-state
        wrong_state: true
        error: weft.observability.StateConflict

  # Line 626: "System metrics per instance and node". The node agent registers a series of its
  # own node when it first reports it. The series names no account: only the ClusterOperator
  # reads it.
  # OPEN: the actor (NodeAgent) is the integrator's. The node must be the calling node; the node
  # session that proves it lives in `nodes` and its protocol.
  - name: weft.observability.RegisterNodeSeries
    naming:
      display: Register a node metric series
    input:
      - {name: node_id, type: weft.shared.NodeId}
      - {name: name, type: weft.observability.MetricName}
      - {name: labels, type: "Map<String, String>"}
    outcomes:
      # One active series per owner, name and labels. ESS admits no `==` over a Map, so the model
      # cannot compare the labels; the implementation refuses a duplicate.
      - name: exists
        external: an active series of this node with this name and these labels exists
        error: weft.observability.SeriesExists
      - name: registered
        creates: weft.observability.MetricSeries
        instance: metric_series_id
        sets:
          name: input.name
          labels: input.labels
          source: System
          node_id: input.node_id
          registered_at: {generated: true}
        emits: [weft.observability.MetricSeriesRegistered]
        payload:
          weft.observability.MetricSeriesRegistered:
            metric_series_id: {generated: true}
            name: input.name
            source: System
            node_id: input.node_id

  # Line 626-627 (system series of an instance: CPU, memory, disk I/O, network, restarts, check
  # results) and 628-629 (custom series an instance pushes). Both reach the control plane through
  # the node agent of the instance's node. The account is the instance's own, read from its record;
  # the caller never names it.
  # A custom series is registered only for a push the instance made with its own live identity
  # document (line 628-629, "authenticated by its workload identity"; weft.identity). The node
  # agent passes the document it verified on the node-local endpoint; the model checks that the
  # document is live and is the instance's.
  # OPEN: whether a custom series may be named like a system series (a custom `cpu_seconds`).
  # Not refused here.
  - name: weft.observability.RegisterInstanceSeries
    naming:
      display: Register an instance metric series
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: source, type: weft.observability.SeriesSource}
      # Required for a Custom series; ignored for a System one.
      - {name: identity_document_id, type: Optional<weft.shared.IdentityDocumentId>}
      - {name: name, type: weft.observability.MetricName}
      - {name: labels, type: "Map<String, String>"}
    outcomes:
      - name: custom-without-identity
        when: {all: [source == Custom, not defined(input.identity_document_id)]}
        error: weft.observability.IdentityNotValid
      - name: unknown-instance
        when_related:
          via: input.instance_id
          exists: false
        error: weft.observability.UnknownInstance
      - name: unknown-identity
        when_related:
          via: input.identity_document_id
          exists: false
        error: weft.observability.IdentityNotValid
      - name: instance-not-on-node
        when_related:
          via: input.instance_id
          predicate: node_id != input.node_id
        error: weft.observability.InstanceNotOnNode
      - name: identity-not-valid
        when_related:
          via: input.identity_document_id
          predicate:
            any:
              - instance_id != input.instance_id
              - state == Expired
              - state == Revoked
              - expires_at <= now
        error: weft.observability.IdentityNotValid
      # As in RegisterNodeSeries: no `==` over a Map in ESS, so the implementation refuses it.
      - name: exists
        external: an active series of this instance with this name and these labels exists
        error: weft.observability.SeriesExists
      - name: registered
        creates: weft.observability.MetricSeries
        instance: metric_series_id
        sets:
          name: input.name
          labels: input.labels
          source: input.source
          node_id: input.node_id
          instance_id: input.instance_id
          account_id: {related: {via: input.instance_id, field: account_id}}
          identity_document_id: input.identity_document_id
          registered_at: {generated: true}
        emits: [weft.observability.MetricSeriesRegistered]
        payload:
          weft.observability.MetricSeriesRegistered:
            metric_series_id: {generated: true}
            name: input.name
            source: input.source
            node_id: input.node_id

  # Lifecycle of MetricSeries (OPEN above): the control plane retires a series when its instance
  # ends or its node is removed.
  - name: weft.observability.RetireMetricSeries
    naming:
      display: Retire a metric series
    input:
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}
    outcomes:
      - name: no-such-series
        unknown_instance: true
        error: weft.observability.NotFound
      - name: retired
        moves: weft.observability.MetricSeries.retire
        instance: metric_series_id
        emits: [weft.observability.MetricSeriesRetired]
        payload:
          weft.observability.MetricSeriesRetired:
            metric_series_id: input.metric_series_id
      - name: wrong-state
        wrong_state: true
        error: weft.observability.StateConflict

  # Line 631. Default deny: a rule reads only an active series of its own account and sends only
  # to an active target of its own account.
  # OPEN: which roles may write a rule. Taken: deployers and admins of the account.
  - name: weft.observability.CreateAlertRule
    naming:
      display: Create an alert rule
    input:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: name, type: String}
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}
      - {name: aggregation, type: weft.observability.Aggregation}
      - {name: window, type: Duration}
      - {name: comparison, type: weft.observability.Comparison}
      - {name: threshold, type: Binary64}
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}
    outcomes:
      # hardening pass 1 D3: the rule is written in the caller's account; another account answers
      # like a missing one.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.observability.NotFound
      - name: unknown-series
        when_related:
          via: input.metric_series_id
          exists: false
        error: weft.observability.UnknownSeries
      - name: unknown-target
        when_related:
          via: input.notification_target_id
          exists: false
        error: weft.observability.UnknownTarget
      # hardening pass 1 disclosure (CreateAlertRule metric_series_id): a node-level series or a
      # series of another account answers like a missing one, right after the existence checks
      # (ESS answers every existence check first) and before its state is read.
      # A node-level series has no account; no tenant reads it.
      - name: node-series
        when_related:
          via: input.metric_series_id
          predicate: not defined(account_id)
        error: weft.observability.UnknownSeries
      - name: foreign-series
        when_related:
          via: input.metric_series_id
          predicate: account_id != input.account_id
        error: weft.observability.UnknownSeries
      # hardening pass 1 disclosure (CreateAlertRule notification_target_id): another account's
      # target answers like a missing one, before its state is read.
      - name: foreign-target
        when_related:
          via: input.notification_target_id
          predicate: account_id != input.account_id
        error: weft.observability.UnknownTarget
      - name: series-retired
        when_related:
          via: input.metric_series_id
          predicate: state == Retired
        error: weft.observability.SeriesNotActive
      - name: target-removed
        when_related:
          via: input.notification_target_id
          predicate: state == Removed
        error: weft.observability.TargetRemoved
      - name: created
        creates: weft.observability.AlertRule
        instance: alert_rule_id
        sets:
          account_id: input.account_id
          name: input.name
          metric_series_id: input.metric_series_id
          aggregation: input.aggregation
          window: input.window
          comparison: input.comparison
          threshold: input.threshold
          notification_target_id: input.notification_target_id
        emits: [weft.observability.AlertRuleCreated]
        payload:
          weft.observability.AlertRuleCreated:
            alert_rule_id: {generated: true}
            account_id: input.account_id
            metric_series_id: input.metric_series_id
            notification_target_id: input.notification_target_id

  # Line 631. A firing alert of a deleted rule is resolved with resolution RuleDeleted by
  # ResolveDeletedRuleAlerts, keyed by the rule, so a binding on AlertRuleDeleted (alert_rule_id)
  # invokes it. The integrator wires it in ess/components.yaml.
  - name: weft.observability.DeleteAlertRule
    naming:
      display: Delete an alert rule
    input:
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}
    outcomes:
      - name: no-such-rule
        unknown_instance: true
        error: weft.observability.NotFound
      # hardening pass 1 D3: only the rule's own account deletes it; another account's rule
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.observability.NotFound
      - name: deleted
        moves: weft.observability.AlertRule.delete
        instance: alert_rule_id
        emits: [weft.observability.AlertRuleDeleted]
        payload:
          weft.observability.AlertRuleDeleted:
            alert_rule_id: input.alert_rule_id
      - name: wrong-state
        wrong_state: true
        error: weft.observability.StateConflict

  # Line 631-632: "`Alert` firing". The evaluator aggregates the series over the rule's window and
  # fires when the value meets the condition; the model checks the value against the rule's
  # comparison and threshold, so no alert fires on a value that does not meet it.
  # OPEN: the evaluator's actor and its period (ESS has no timer, sketch line 595-596). The
  # integrator names it.
  - name: weft.observability.FireAlert
    naming:
      display: Fire an alert
    input:
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}
      - {name: value, type: Binary64}
    outcomes:
      - name: unknown-rule
        when_related:
          via: input.alert_rule_id
          exists: false
        error: weft.observability.UnknownRule
      - name: rule-deleted
        when_related:
          via: input.alert_rule_id
          predicate: state == Deleted
        error: weft.observability.RuleNotActive
      - name: condition-not-met
        when_related:
          via: input.alert_rule_id
          predicate:
            any:
              - all: [comparison == Above, input.value <= threshold]
              - all: [comparison == Below, input.value >= threshold]
        error: weft.observability.ConditionNotMet
      - name: already-firing
        when_related:
          entity: weft.observability.Alert
          where:
            all:
              - alert_rule_id == input.alert_rule_id
              - state == Firing
          count: {gte: 1}
        error: weft.observability.AlertAlreadyFiring
      - name: fired
        creates: weft.observability.Alert
        instance: alert_id
        sets:
          account_id: {related: {via: input.alert_rule_id, field: account_id}}
          alert_rule_id: input.alert_rule_id
          notification_target_id: {related: {via: input.alert_rule_id, field: notification_target_id}}
          value: input.value
          fired_at: {generated: true}
        emits: [weft.observability.AlertFired]
        payload:
          weft.observability.AlertFired:
            alert_id: {generated: true}
            alert_rule_id: input.alert_rule_id
            value: input.value

  # Line 631-632: "`Alert` ... resolved". The evaluator resolves when the condition cleared, or
  # when the rule was deleted.
  - name: weft.observability.ResolveAlert
    naming:
      display: Resolve an alert
    input:
      - {name: alert_id, type: weft.shared.AlertId}
      - {name: resolution, type: weft.observability.AlertResolution}
    outcomes:
      - name: no-such-alert
        unknown_instance: true
        error: weft.observability.NotFound
      - name: resolved
        moves: weft.observability.Alert.resolve
        instance: alert_id
        sets:
          resolved_at: {generated: true, present: true}
          resolution: input.resolution
        emits: [weft.observability.AlertResolved]
        payload:
          weft.observability.AlertResolved:
            alert_id: input.alert_id
            resolution: input.resolution
      - name: wrong-state
        wrong_state: true
        error: weft.observability.StateConflict

  # Line 632: "-> a `NotificationTarget`". The notifier sends each firing and each resolution to
  # the alert's target and reports what happened: no error is a delivery, an error a failure the
  # alert's owner sees. A failure is recorded, never dropped (sketch line 582-583).
  # OPEN: retries of a failed notification (count, backoff). Taken: the binding's bounded retry.
  - name: weft.observability.RecordAlertNotification
    naming:
      display: Record an alert notification
    input:
      - {name: alert_id, type: weft.shared.AlertId}
      - {name: error, type: Optional<String>}
    outcomes:
      - name: no-such-alert
        unknown_instance: true
        error: weft.observability.NotFound
      - name: failed
        when: defined(input.error)
        updates: weft.observability.Alert
        instance: alert_id
        sets:
          notification_error: input.error
        emits: [weft.observability.AlertNotificationFailed]
        payload:
          weft.observability.AlertNotificationFailed:
            alert_id: input.alert_id
            error: input.error
      - name: delivered
        updates: weft.observability.Alert
        instance: alert_id
        sets:
          notified_at: {generated: true, present: true}
          notification_error: {cleared: true}
        emits: [weft.observability.AlertNotified]
        payload:
          weft.observability.AlertNotified:
            alert_id: input.alert_id

  # Line 636-637. One active policy per formation (no environment) and one per environment.
  # Default deny: the formation, the environment and every sink are the account's own, and each
  # sink lists the signal routed to it.
  # OPEN: which roles may write a policy. Taken: deployers and admins of the account.
  - name: weft.observability.SetTelemetryPolicy
    naming:
      display: Set a telemetry policy
    input:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: Optional<weft.shared.EnvironmentId>}
      - {name: trace_sampling_ratio, type: Binary64}
      - {name: keep_error_traces, type: Boolean}
      - {name: logs_retention_days, type: Integer}
      - {name: metrics_retention_days, type: Integer}
      - {name: traces_retention_days, type: Integer}
      - {name: logs_sink_id, type: Optional<weft.shared.TelemetrySinkId>}
      - {name: metrics_sink_id, type: Optional<weft.shared.TelemetrySinkId>}
      - {name: traces_sink_id, type: Optional<weft.shared.TelemetrySinkId>}
    outcomes:
      # hardening pass 1 D3: the policy is written in the caller's account; another account
      # answers like a missing one.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.observability.NotFound
      - name: ratio-out-of-bounds
        when: {any: [trace_sampling_ratio < 0.0, trace_sampling_ratio > 1.0]}
        error: weft.observability.InvalidSamplingRatio
      - name: retention-out-of-bounds
        when:
          any:
            - logs_retention_days < 1
            - logs_retention_days > 365
            - metrics_retention_days < 1
            - metrics_retention_days > 365
            - traces_retention_days < 1
            - traces_retention_days > 365
        error: weft.observability.RetentionOutOfBounds
      - name: unknown-formation
        when_related:
          via: input.formation_id
          exists: false
        error: weft.observability.UnknownFormation
      - name: unknown-environment
        when_related:
          via: input.environment_id
          exists: false
        error: weft.observability.UnknownEnvironment
      - name: unknown-logs-sink
        when_related:
          via: input.logs_sink_id
          exists: false
        error: weft.observability.UnknownSink
      - name: unknown-metrics-sink
        when_related:
          via: input.metrics_sink_id
          exists: false
        error: weft.observability.UnknownSink
      - name: unknown-traces-sink
        when_related:
          via: input.traces_sink_id
          exists: false
        error: weft.observability.UnknownSink
      # hardening pass 1 disclosure (SetTelemetryPolicy formation_id, environment_id, logs_sink_id,
      # metrics_sink_id, traces_sink_id): each row of another account answers like a missing one,
      # right after the existence checks (ESS answers every existence check first) and before any
      # state of the row is read.
      - name: foreign-formation
        when_related:
          via: input.formation_id
          predicate: account_id != input.account_id
        error: weft.observability.UnknownFormation
      # hardening pass 1 disclosure (SetTelemetryPolicy environment_id): an environment carries no
      # account, so it is tied through its formation; an environment of another account's
      # formation answers like a missing one. One of the account's own other formations still
      # answers EnvironmentNotInFormation below.
      - name: foreign-environment
        when_related:
          entity: weft.formations.Environment
          where:
            all:
              - environment_id == input.environment_id
              - not:
                  exists:
                    as: f
                    in: {entity: weft.formations.Formation}
                    that: {all: [{f.formation_id: {eq: {fact: formation_id}}}, f.account_id == input.account_id]}
          exists: true
        error: weft.observability.UnknownEnvironment
      - name: foreign-logs-sink
        when_related:
          via: input.logs_sink_id
          predicate: account_id != input.account_id
        error: weft.observability.UnknownSink
      - name: foreign-metrics-sink
        when_related:
          via: input.metrics_sink_id
          predicate: account_id != input.account_id
        error: weft.observability.UnknownSink
      - name: foreign-traces-sink
        when_related:
          via: input.traces_sink_id
          predicate: account_id != input.account_id
        error: weft.observability.UnknownSink
      - name: formation-retired
        when_related:
          via: input.formation_id
          predicate: state == Retired
        error: weft.observability.FormationRetired
      - name: environment-not-in-formation
        when_related:
          via: input.environment_id
          predicate: formation_id != input.formation_id
        error: weft.observability.EnvironmentNotInFormation
      - name: logs-sink-removed
        when_related:
          via: input.logs_sink_id
          predicate: state == Removed
        error: weft.observability.SinkRemoved
      - name: logs-sink-mismatch
        when_related:
          via: input.logs_sink_id
          predicate:
            not:
              exists: {in: signals, as: s, that: s == Logs}
        error: weft.observability.SinkSignalMismatch
      - name: metrics-sink-removed
        when_related:
          via: input.metrics_sink_id
          predicate: state == Removed
        error: weft.observability.SinkRemoved
      - name: metrics-sink-mismatch
        when_related:
          via: input.metrics_sink_id
          predicate:
            not:
              exists: {in: signals, as: s, that: s == Metrics}
        error: weft.observability.SinkSignalMismatch
      - name: traces-sink-removed
        when_related:
          via: input.traces_sink_id
          predicate: state == Removed
        error: weft.observability.SinkRemoved
      - name: traces-sink-mismatch
        when_related:
          via: input.traces_sink_id
          predicate:
            not:
              exists: {in: signals, as: s, that: s == Traces}
        error: weft.observability.SinkSignalMismatch
      - name: exists
        when_related:
          entity: weft.observability.TelemetryPolicy
          where:
            all:
              - formation_id == input.formation_id
              - environment_id == input.environment_id
              - state == Active
          count: {gte: 1}
        error: weft.observability.TelemetryPolicyExists
      # `environment_id == input.environment_id` is unknown when both are absent, so the one
      # formation-wide policy needs its own selector, or a second one would be written.
      - name: formation-policy-exists
        when_related:
          entity: weft.observability.TelemetryPolicy
          where:
            all:
              - formation_id == input.formation_id
              - not defined(environment_id)
              - not defined(input.environment_id)
              - state == Active
          count: {gte: 1}
        error: weft.observability.TelemetryPolicyExists
      # Line 622 "bounded by the plan": the plan is above this layer (OPEN on the entity).
      - name: retention-over-plan
        external: a retention exceeds the bound of the account's plan
        error: weft.observability.RetentionOverPlan
      - name: set
        creates: weft.observability.TelemetryPolicy
        instance: telemetry_policy_id
        sets:
          account_id: input.account_id
          formation_id: input.formation_id
          environment_id: input.environment_id
          trace_sampling_ratio: input.trace_sampling_ratio
          keep_error_traces: input.keep_error_traces
          logs_retention_days: input.logs_retention_days
          metrics_retention_days: input.metrics_retention_days
          traces_retention_days: input.traces_retention_days
          logs_sink_id: input.logs_sink_id
          metrics_sink_id: input.metrics_sink_id
          traces_sink_id: input.traces_sink_id
        emits: [weft.observability.TelemetryPolicySet]
        payload:
          weft.observability.TelemetryPolicySet:
            telemetry_policy_id: {generated: true}
            formation_id: input.formation_id

  # Line 636-637. A policy is changed by removing it and setting a new one; while none is active
  # the formation's policy, or the default, applies.
  # OPEN: whether an in-place update is needed (no gap between remove and set). Not written.
  - name: weft.observability.RemoveTelemetryPolicy
    naming:
      display: Remove a telemetry policy
    input:
      - {name: telemetry_policy_id, type: weft.shared.TelemetryPolicyId}
    outcomes:
      - name: no-such-policy
        unknown_instance: true
        error: weft.observability.NotFound
      # hardening pass 1 D3: only the policy's own account removes it; another account's policy
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject: {predicate: account_id != caller.account_id}
        error: weft.observability.NotFound
      - name: removed
        moves: weft.observability.TelemetryPolicy.remove
        instance: telemetry_policy_id
        emits: [weft.observability.TelemetryPolicyRemoved]
        payload:
          weft.observability.TelemetryPolicyRemoved:
            telemetry_policy_id: input.telemetry_policy_id
      - name: wrong-state
        wrong_state: true
        error: weft.observability.StateConflict

  # Sketch § 14 line 590, R6 (account closed), with lines 623, 631-632 and 636-637: a closed
  # account's telemetry config is removed, so nothing of it is forwarded, evaluated or notified any
  # more. One many-rows command per entity, each bound to weft.accounts.AccountClosed
  # (account_id): ESS refuses `affects:` beside `instances:` (ESS-COMMAND-009, "a secondary effect
  # is admitted beside one subject in this cut"), and this domain holds no row of the account that
  # could be the one subject. Four bindings: policies, rules, then sinks and targets, which wait
  # (refuse, retried) until the policies and rules that name them are gone, as RemoveTelemetrySink
  # and RemoveNotificationTarget do for one row. The account's firing alerts follow each deleted
  # rule (ResolveDeletedRuleAlerts on AlertRuleDeleted).
  # Its log streams and metric series are not touched here: each ends with its instance
  # (CloseInstanceLogStreams, RetireInstanceMetricSeries), and R6 stops the account's instances.
  # Every one of them is guarded on the account being closed, and a repeated delivery finds
  # nothing left to move and changes nothing.

  # Line 636-637, R6: every active telemetry policy of a closed account is removed.
  - name: weft.observability.RemoveAccountTelemetryPolicies
    naming:
      display: Remove every telemetry policy of a closed account
    input:
      - {name: account_id, type: weft.shared.AccountId}
    outcomes:
      - name: no-such-account
        when_related: {via: input.account_id, exists: false}
        error: weft.observability.AccountNotClosed
      - name: account-open
        when_related: {via: input.account_id, predicate: state != Closed}
        error: weft.observability.AccountNotClosed
      - name: removed
        moves: weft.observability.TelemetryPolicy.remove
        instances:
          where:
            all:
              - account_id == input.account_id
              - state == Active
        emits:
          - weft.observability.AccountTelemetryPoliciesRemoved
          - {event: weft.observability.TelemetryPolicyRemoved, each: changed}
        payload:
          weft.observability.AccountTelemetryPoliciesRemoved:
            account_id: input.account_id
            removed: {count: changed}
          weft.observability.TelemetryPolicyRemoved:
            telemetry_policy_id: {changed: telemetry_policy_id}

  # Line 623, R6: every telemetry sink of a closed account is removed, once no active policy of the
  # account routes to it (a policy names only sinks of its own account, SetTelemetryPolicy
  # ForeignSink). Until RemoveAccountTelemetryPolicies ran, it answers SinkInUse, and the binding
  # retries.
  - name: weft.observability.RemoveAccountTelemetrySinks
    naming:
      display: Remove every telemetry sink of a closed account
    input:
      - {name: account_id, type: weft.shared.AccountId}
    outcomes:
      - name: no-such-account
        when_related: {via: input.account_id, exists: false}
        error: weft.observability.AccountNotClosed
      - name: account-open
        when_related: {via: input.account_id, predicate: state != Closed}
        error: weft.observability.AccountNotClosed
      - name: in-use
        when_related:
          entity: weft.observability.TelemetryPolicy
          where:
            all:
              - account_id == input.account_id
              - state == Active
          exists: true
        error: weft.observability.SinkInUse
      - name: removed
        moves: weft.observability.TelemetrySink.remove
        instances:
          where:
            all:
              - account_id == input.account_id
              - state != Removed
        emits:
          - weft.observability.AccountTelemetrySinksRemoved
          - {event: weft.observability.TelemetrySinkRemoved, each: changed}
        payload:
          weft.observability.AccountTelemetrySinksRemoved:
            account_id: input.account_id
            removed: {count: changed}
          weft.observability.TelemetrySinkRemoved:
            telemetry_sink_id: {changed: telemetry_sink_id}

  # Line 631, R6: every active alert rule of a closed account is deleted. Each deleted rule's
  # AlertRuleDeleted resolves its firing alert (ResolveDeletedRuleAlerts).
  - name: weft.observability.DeleteAccountAlertRules
    naming:
      display: Delete every alert rule of a closed account
    input:
      - {name: account_id, type: weft.shared.AccountId}
    outcomes:
      - name: no-such-account
        when_related: {via: input.account_id, exists: false}
        error: weft.observability.AccountNotClosed
      - name: account-open
        when_related: {via: input.account_id, predicate: state != Closed}
        error: weft.observability.AccountNotClosed
      - name: deleted
        moves: weft.observability.AlertRule.delete
        instances:
          where:
            all:
              - account_id == input.account_id
              - state == Active
        emits:
          - weft.observability.AccountAlertRulesDeleted
          - {event: weft.observability.AlertRuleDeleted, each: changed}
        payload:
          weft.observability.AccountAlertRulesDeleted:
            account_id: input.account_id
            deleted: {count: changed}
          weft.observability.AlertRuleDeleted:
            alert_rule_id: {changed: alert_rule_id}

  # Line 632, R6: every notification target of a closed account is removed, once no active rule of
  # the account names it (a rule names only targets of its own account, CreateAlertRule
  # ForeignTarget). Until DeleteAccountAlertRules ran, it answers TargetInUse, and the binding
  # retries.
  - name: weft.observability.RemoveAccountNotificationTargets
    naming:
      display: Remove every notification target of a closed account
    input:
      - {name: account_id, type: weft.shared.AccountId}
    outcomes:
      - name: no-such-account
        when_related: {via: input.account_id, exists: false}
        error: weft.observability.AccountNotClosed
      - name: account-open
        when_related: {via: input.account_id, predicate: state != Closed}
        error: weft.observability.AccountNotClosed
      - name: in-use
        when_related:
          entity: weft.observability.AlertRule
          where:
            all:
              - account_id == input.account_id
              - state == Active
          exists: true
        error: weft.observability.TargetInUse
      - name: removed
        moves: weft.observability.NotificationTarget.remove
        instances:
          where:
            all:
              - account_id == input.account_id
              - state == Active
        emits:
          - weft.observability.AccountNotificationTargetsRemoved
          - {event: weft.observability.NotificationTargetRemoved, each: changed}
        payload:
          weft.observability.AccountNotificationTargetsRemoved:
            account_id: input.account_id
            removed: {count: changed}
          weft.observability.NotificationTargetRemoved:
            notification_target_id: {changed: notification_target_id}

  # Line 631-632, and DeleteAlertRule's comment ("a firing alert of a deleted rule is resolved
  # with resolution RuleDeleted"). Keyed by the rule, so one binding on AlertRuleDeleted
  # (alert_rule_id) serves DeleteAlertRule and DeleteAccountAlertRules alike. Refused while the
  # rule is active: an active rule's alert is resolved by the evaluator (ResolveAlert,
  # ConditionCleared).
  - name: weft.observability.ResolveDeletedRuleAlerts
    naming:
      display: Resolve the firing alerts of a deleted alert rule
    input:
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}
    outcomes:
      - name: no-such-rule
        when_related: {via: input.alert_rule_id, exists: false}
        error: weft.observability.UnknownRule
      - name: rule-active
        when_related: {via: input.alert_rule_id, predicate: state == Active}
        error: weft.observability.RuleNotDeleted
      - name: resolved
        moves: weft.observability.Alert.resolve
        instances:
          where:
            all:
              - alert_rule_id == input.alert_rule_id
              - state == Firing
        sets:
          resolved_at: {generated: true, present: true}
          resolution: RuleDeleted
        emits:
          - {event: weft.observability.AlertResolved, each: changed}
        payload:
          weft.observability.AlertResolved:
            alert_id: {changed: alert_id}
            resolution: RuleDeleted

  # Line 620-621 ("closed when the process or the instance ends"). CloseLogStream takes one
  # stream's id, which no instance event carries; this form takes the instance, so one binding per
  # ending event (weft.workloads.InstanceExited, InstanceFailed, InstanceEvicted: each carries
  # `instance_id`) closes every open stream of the instance. Refused while the instance is in a
  # live state. A repeated delivery finds nothing open and changes nothing.
  - name: weft.observability.CloseInstanceLogStreams
    naming:
      display: Close every log stream of an ended instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: unknown-instance
        when_related: {via: input.instance_id, exists: false}
        error: weft.observability.UnknownInstance
      - name: instance-live
        when_related:
          via: input.instance_id
          predicate:
            all:
              - state != Exited
              - state != Failed
              - state != Evicted
        error: weft.observability.InstanceNotEnded
      - name: closed
        moves: weft.observability.LogStream.close
        instances:
          where:
            all:
              - defined(instance_id)
              - instance_id == input.instance_id
              - state == Open
        sets:
          closed_at: {generated: true, present: true}
          # closed_at plus retention_days.
          retained_until: {generated: true, present: true}
        emits:
          - weft.observability.InstanceLogStreamsClosed
          - {event: weft.observability.LogStreamClosed, each: changed}
        payload:
          weft.observability.InstanceLogStreamsClosed:
            instance_id: input.instance_id
            closed: {count: changed}
          weft.observability.LogStreamClosed:
            log_stream_id: {changed: log_stream_id}

  # MetricSeries lifecycle above ("retired by the control plane when its instance ends").
  # RetireMetricSeries takes one series' id, which no instance event carries; this form takes the
  # instance, bound like CloseInstanceLogStreams. A separate command: ESS refuses `affects:` beside
  # `instances:`.
  - name: weft.observability.RetireInstanceMetricSeries
    naming:
      display: Retire every metric series of an ended instance
    input:
      - {name: instance_id, type: weft.shared.InstanceId}
    outcomes:
      - name: unknown-instance
        when_related: {via: input.instance_id, exists: false}
        error: weft.observability.UnknownInstance
      - name: instance-live
        when_related:
          via: input.instance_id
          predicate:
            all:
              - state != Exited
              - state != Failed
              - state != Evicted
        error: weft.observability.InstanceNotEnded
      - name: retired
        moves: weft.observability.MetricSeries.retire
        instances:
          where:
            all:
              - defined(instance_id)
              - instance_id == input.instance_id
              - state == Active
        emits:
          - weft.observability.InstanceMetricSeriesRetired
          - {event: weft.observability.MetricSeriesRetired, each: changed}
        payload:
          weft.observability.InstanceMetricSeriesRetired:
            instance_id: input.instance_id
            retired: {count: changed}
          weft.observability.MetricSeriesRetired:
            metric_series_id: {changed: metric_series_id}

views:
  # Line 624 "`weft logs` reads a stream live through the exec channel's `Logs` kind and the
  # stored tail". This view answers which streams an instance has and whether their lines are
  # still kept; the lines themselves come from the exec channel (live) and the telemetry store
  # (tail), filtered by the same account.
  - name: weft.observability.InstanceLogStreams
    source: weft.observability.LogStream
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: instance_id, type: weft.shared.InstanceId}
    filter:
      all:
        - account_id == param.account_id
        - instance_id == param.instance_id
    fields:
      - {name: log_stream_id, type: weft.shared.LogStreamId}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: kind, type: weft.observability.LogStreamKind}
      - {name: process, type: Optional<String>}
      - {name: retention_days, type: Integer}
      - {name: opened_at, type: Timestamp}
      - {name: closed_at, type: Optional<Timestamp>}
      - {name: retained_until, type: Optional<Timestamp>}
      - {name: state, type: weft.observability.LogStream.State}

  # Line 622 "Retention": the closed streams whose retention has passed, for the step that expires
  # them (ExpireLogStream). Publishes no line and no process name.
  # OPEN: the actor of that step (a part of weft-control). The integrator names it.
  - name: weft.observability.LogStreamsPastRetention
    source: weft.observability.LogStream
    consistency: read_your_writes
    filter:
      all:
        - state == Closed
        - retained_until <= now
    fields:
      - {name: log_stream_id, type: weft.shared.LogStreamId}
      - {name: retained_until, type: Optional<Timestamp>}
      - {name: state, type: weft.observability.LogStream.State}

  # Line 630 and `weft metrics`: an account's series, the instance series of its instances.
  - name: weft.observability.AccountMetricSeries
    source: weft.observability.MetricSeries
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    # `defined(account_id)` says outright that a node-level series (no account) is never a row.
    filter:
      all:
        - defined(account_id)
        - account_id == param.account_id
    fields:
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}
      - {name: name, type: weft.observability.MetricName}
      - {name: labels, type: "Map<String, String>"}
      - {name: source, type: weft.observability.SeriesSource}
      - {name: instance_id, type: Optional<weft.shared.InstanceId>}
      - {name: account_id, type: Optional<weft.shared.AccountId>}
      - {name: registered_at, type: Timestamp}
      - {name: state, type: weft.observability.MetricSeries.State}

  # Line 626 and 638-639: "The ClusterOperator reads node metrics". The series of one node that
  # carry no account; no instance series appears here.
  - name: weft.observability.NodeMetricSeries
    source: weft.observability.MetricSeries
    consistency: read_your_writes
    params:
      - {name: node_id, type: weft.shared.NodeId}
    filter:
      all:
        - node_id == param.node_id
        - not defined(account_id)
    fields:
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}
      - {name: name, type: weft.observability.MetricName}
      - {name: labels, type: "Map<String, String>"}
      - {name: source, type: weft.observability.SeriesSource}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: registered_at, type: Timestamp}
      - {name: state, type: weft.observability.MetricSeries.State}

  # Line 631 and `weft alerts`: an account's rules.
  - name: weft.observability.AlertRules
    source: weft.observability.AlertRule
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter: account_id == param.account_id
    fields:
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: name, type: String}
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}
      - {name: aggregation, type: weft.observability.Aggregation}
      - {name: window, type: Duration}
      - {name: comparison, type: weft.observability.Comparison}
      - {name: threshold, type: Binary64}
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}
      - {name: state, type: weft.observability.AlertRule.State}

  # Line 631: the active rules of every account, for the evaluator that fires and resolves
  # alerts. A system read; no user role is granted it.
  - name: weft.observability.ActiveAlertRules
    source: weft.observability.AlertRule
    consistency: read_your_writes
    filter: state == Active
    fields:
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}
      - {name: aggregation, type: weft.observability.Aggregation}
      - {name: window, type: Duration}
      - {name: comparison, type: weft.observability.Comparison}
      - {name: threshold, type: Binary64}
      - {name: state, type: weft.observability.AlertRule.State}

  # Line 631-632 and `weft alerts`: an account's alerts, firing and resolved, with their
  # notification state.
  - name: weft.observability.Alerts
    source: weft.observability.Alert
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter: account_id == param.account_id
    fields:
      - {name: alert_id, type: weft.shared.AlertId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}
      - {name: value, type: Binary64}
      - {name: fired_at, type: Timestamp}
      - {name: resolved_at, type: Optional<Timestamp>}
      - {name: resolution, type: Optional<weft.observability.AlertResolution>}
      - {name: notified_at, type: Optional<Timestamp>}
      - {name: notification_error, type: Optional<String>}
      - {name: state, type: weft.observability.Alert.State}

  # Line 632: an account's notification targets.
  - name: weft.observability.NotificationTargets
    source: weft.observability.NotificationTarget
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter: account_id == param.account_id
    fields:
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: name, type: String}
      - {name: kind, type: weft.observability.NotificationKind}
      - {name: address, type: String}
      - {name: state, type: weft.observability.NotificationTarget.State}

  # Line 623: an account's sinks and whether delivery to them works.
  - name: weft.observability.TelemetrySinks
    source: weft.observability.TelemetrySink
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter: account_id == param.account_id
    fields:
      - {name: telemetry_sink_id, type: weft.shared.TelemetrySinkId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: name, type: String}
      - {name: protocol, type: weft.observability.SinkProtocol}
      - {name: endpoint, type: Optional<String>}
      - {name: bucket_id, type: Optional<weft.shared.BucketId>}
      - {name: signals, type: List<weft.observability.Signal>}
      - {name: failure_reason, type: Optional<String>}
      - {name: state, type: weft.observability.TelemetrySink.State}

  # Line 636-637: an account's telemetry policies.
  - name: weft.observability.TelemetryPolicies
    source: weft.observability.TelemetryPolicy
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter: account_id == param.account_id
    fields:
      - {name: telemetry_policy_id, type: weft.shared.TelemetryPolicyId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: Optional<weft.shared.EnvironmentId>}
      - {name: trace_sampling_ratio, type: Binary64}
      - {name: keep_error_traces, type: Boolean}
      - {name: logs_retention_days, type: Integer}
      - {name: metrics_retention_days, type: Integer}
      - {name: traces_retention_days, type: Integer}
      - {name: logs_sink_id, type: Optional<weft.shared.TelemetrySinkId>}
      - {name: metrics_sink_id, type: Optional<weft.shared.TelemetrySinkId>}
      - {name: traces_sink_id, type: Optional<weft.shared.TelemetrySinkId>}
      - {name: state, type: weft.observability.TelemetryPolicy.State}

  # System indexes: every row of an entity with its state, across accounts, for the control-plane
  # loops of this domain (sketch § 14 line 590, R6, and the loops named per view). Each is also
  # where a many-rows command (RemoveAccount*, DeleteAccountAlertRules, CloseInstanceLogStreams,
  # RetireInstanceMetricSeries, ResolveDeletedRuleAlerts) is read back.
  # Isolation (line 638-639): no user role reads them. OPEN: which system actor reads each.
  # Taken: none of the human actors; the integrator's actor table grants each to the loop named.

  # Line 620-622: every log stream, for the log store and the step that expires streams. Publishes
  # no process name and no line.
  - name: weft.observability.LogStreamIndex
    source: weft.observability.LogStream
    consistency: read_your_writes
    fields:
      - {name: log_stream_id, type: weft.shared.LogStreamId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: kind, type: weft.observability.LogStreamKind}
      - {name: retention_days, type: Integer}
      - {name: opened_at, type: Timestamp}
      - {name: closed_at, type: Optional<Timestamp>}
      - {name: retained_until, type: Optional<Timestamp>}
      - {name: state, type: weft.observability.LogStream.State}

  # Line 623: every telemetry sink, for the forwarder that delivers to it.
  - name: weft.observability.TelemetrySinkIndex
    source: weft.observability.TelemetrySink
    consistency: read_your_writes
    fields:
      - {name: telemetry_sink_id, type: weft.shared.TelemetrySinkId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: protocol, type: weft.observability.SinkProtocol}
      - {name: endpoint, type: Optional<String>}
      - {name: bucket_id, type: Optional<weft.shared.BucketId>}
      - {name: signals, type: List<weft.observability.Signal>}
      - {name: failure_reason, type: Optional<String>}
      - {name: state, type: weft.observability.TelemetrySink.State}

  # Line 636-637: every telemetry policy, for the forwarder and the node agents that sample and
  # route by it.
  - name: weft.observability.TelemetryPolicyIndex
    source: weft.observability.TelemetryPolicy
    consistency: read_your_writes
    fields:
      - {name: telemetry_policy_id, type: weft.shared.TelemetryPolicyId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: Optional<weft.shared.EnvironmentId>}
      - {name: trace_sampling_ratio, type: Binary64}
      - {name: keep_error_traces, type: Boolean}
      - {name: logs_retention_days, type: Integer}
      - {name: metrics_retention_days, type: Integer}
      - {name: traces_retention_days, type: Integer}
      - {name: logs_sink_id, type: Optional<weft.shared.TelemetrySinkId>}
      - {name: metrics_sink_id, type: Optional<weft.shared.TelemetrySinkId>}
      - {name: traces_sink_id, type: Optional<weft.shared.TelemetrySinkId>}
      - {name: state, type: weft.observability.TelemetryPolicy.State}

  # Line 630 ("`ScaleRule` and `SleepPolicy` read series"): every metric series, for the scaler
  # and the evaluator, which read series by name and labels.
  - name: weft.observability.MetricSeriesIndex
    source: weft.observability.MetricSeries
    consistency: read_your_writes
    fields:
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}
      - {name: name, type: weft.observability.MetricName}
      - {name: labels, type: "Map<String, String>"}
      - {name: source, type: weft.observability.SeriesSource}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: instance_id, type: Optional<weft.shared.InstanceId>}
      - {name: account_id, type: Optional<weft.shared.AccountId>}
      - {name: state, type: weft.observability.MetricSeries.State}

  # Line 631: every alert rule, active or deleted, for the evaluator (ActiveAlertRules holds the
  # active ones only).
  - name: weft.observability.AlertRuleIndex
    source: weft.observability.AlertRule
    consistency: read_your_writes
    fields:
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: metric_series_id, type: weft.shared.MetricSeriesId}
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}
      - {name: state, type: weft.observability.AlertRule.State}

  # Line 631-632: every alert, for the notifier that sends it to its target.
  - name: weft.observability.AlertIndex
    source: weft.observability.Alert
    consistency: read_your_writes
    fields:
      - {name: alert_id, type: weft.shared.AlertId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: alert_rule_id, type: weft.shared.AlertRuleId}
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}
      - {name: value, type: Binary64}
      - {name: fired_at, type: Timestamp}
      - {name: resolved_at, type: Optional<Timestamp>}
      - {name: resolution, type: Optional<weft.observability.AlertResolution>}
      - {name: notified_at, type: Optional<Timestamp>}
      - {name: notification_error, type: Optional<String>}
      - {name: state, type: weft.observability.Alert.State}

  # Line 632: every notification target, for the notifier that calls its address.
  - name: weft.observability.NotificationTargetIndex
    source: weft.observability.NotificationTarget
    consistency: read_your_writes
    fields:
      - {name: notification_target_id, type: weft.shared.NotificationTargetId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: kind, type: weft.observability.NotificationKind}
      - {name: address, type: String}
      - {name: state, type: weft.observability.NotificationTarget.State}
