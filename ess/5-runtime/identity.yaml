# Identity: workload identity documents, the trust domain that signs them, and the exchange of an
# identity for a scoped token of an outside service. Source: docs/domain-sketch.md "8. Workload
# identity" (lines 388-402), "Channels" (lines 95-96, instance -> weft-node local endpoint),
# "Components" (line 68, the identity issuer in weft-control) and "11. Node control" (line 433,
# `IssueIdentity`).
#
# Standards. The sketch names three and says it did not check them (line 400). Nothing below was
# checked against the standard texts either; each comment that leans on one says so with
# "(unverified)".
# - SPIFFE: an ID `spiffe://<trust-domain>/<path>`, a trust domain with its signing keys, and an
#   SVID (X.509-SVID, JWT-SVID) as the signed document that carries the ID (unverified).
# - IETF WIMSE working group drafts: workload identity tokens and workload-to-workload
#   authentication (unverified; no draft name or section is cited here).
# - OAuth 2.0 Token Exchange, RFC 8693: a `subject_token` exchanged at a token endpoint for a new
#   token, narrowed by `audience`, `resource` and `scope` (unverified).
domain: weft.identity


types:
  # Entity identifiers of this domain. AGENTS.md puts every entity identifier in
  # ess/domains/shared.yaml; they are declared here until the integrator moves them (reported).

errors:
  - name: weft.identity.InstanceNotOnNode
    summary: >-
      The instance does not exist or is not assigned to the named node, so the node gets no
      identity for it and nothing changed.
commands:
views: