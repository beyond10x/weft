# Identity: workload identity documents, the trust domain that signs them, and the exchange of an
# identity for a scoped token of an outside service. Source: docs/domain-sketch.md "8. Workload
# identity" (lines 388-402), "Channels" (lines 95-96, instance -> weft-node local endpoint),
# "Components" (line 68, the identity issuer in weft-control) and "11. Node control" (line 433,
# `IssueIdentity`).
#
# Standards. The sketch names three and says it did not check them (line 400). Nothing below was
# checked against the standard texts either; each comment that leans on one says so with
# "(unverified)".
# - SPIFFE: an ID `spiffe://<trust-domain>/<path>`, a trust domain with its signing keys, and an
#   SVID (X.509-SVID, JWT-SVID) as the signed document that carries the ID (unverified).
# - IETF WIMSE working group drafts: workload identity tokens and workload-to-workload
#   authentication (unverified; no draft name or section is cited here).
# - OAuth 2.0 Token Exchange, RFC 8693: a `subject_token` exchanged at a token endpoint for a new
#   token, narrowed by `audience`, `resource` and `scope` (unverified).
domain: weft.identity

summary: >-
  Workload identity in weft: each instance gets a short-lived identity document at start, signed by
  its cluster's trust domain, renewed by the node agent before it expires and revoked when the
  instance ends; an identity document is exchanged for a scoped token of an outside service only
  where an explicit exchange policy allows it.

naming:
  wire: weft
  display: Identity

types:
  # Entity identifiers of this domain. AGENTS.md puts every entity identifier in
  # ess/domains/shared.yaml; they are declared here until the integrator moves them (reported).

  # SPIFFE trust domain name, the host part of a SPIFFE ID (unverified).
  # OPEN: how a trust domain name is chosen (the cluster's name, a DNS name the operator owns).
  - name: weft.identity.TrustDomainName
    kind: newtype
    of: String

  # A reference to the signing key in key custody, never key material. Same rule as section 7's
  # SecretBackend: cluster state holds references only (sketch line 381).
  - name: weft.identity.SigningKeyRef
    kind: newtype
    of: String

  # Sketch line 393: "No long-lived key in the instance". The two document formats of SPIFFE
  # (unverified): an X.509 certificate for mutual TLS between components (line 395), and a signed
  # JWT for presenting to a token endpoint as an RFC 8693 `subject_token` (line 397).
  # OPEN: whether every instance gets both formats at start, or a JWT only on request.
  - name: weft.identity.DocumentFormat
    kind: enum
    variants: [X509Svid, JwtSvid]

  # Why a document was revoked. Sketch: revoked when the instance ends (brief). The other reasons
  # are the smallest set the cluster operator needs.
  - name: weft.identity.RevocationReason
    kind: enum
    variants: [InstanceEnded, KeyCompromised, TrustDomainRetired, OperatorAction]

  # RFC 8693 `audience`: the logical name of the outside service the token is for (unverified).
  - name: weft.identity.Audience
    kind: newtype
    of: String

  # RFC 8693 / OAuth `scope`: one scope value (unverified).
  - name: weft.identity.Scope
    kind: newtype
    of: String

entities:
  # Sketch line 392 "signed by the cluster"; "9. Cluster" line 406. One trust domain per cluster.
  - name: weft.identity.TrustDomain
    naming:
      summary: >-
        A cluster's trust domain: the name every workload identity of the cluster lives under, and
        the key that signs its identity documents.
    identity:
      name: trust_domain_id
      type: weft.shared.TrustDomainId
    fields:
      - name: cloud_id
        type: weft.shared.CloudId
      - name: name
        type: weft.identity.TrustDomainName
      - name: signing_key_ref
        type: weft.identity.SigningKeyRef
      # The key before the last rotation. Peers keep accepting documents it signed until the last
      # of them has expired; then FinishKeyRotation drops it.
      - name: previous_signing_key_ref
        type: Optional<weft.identity.SigningKeyRef>
      # When the overlap of a rotation ends: rotation start plus the longest document lifetime.
      - name: rotation_ends_at
        type: Optional<Timestamp>
      # The key the operator asked to rotate to (RequestKeyRotation); weft-control's issuer
      # rotates to it with its own clock (RotateSigningKey). Hardening pass 5.
      - name: requested_signing_key_ref
        type: Optional<weft.identity.SigningKeyRef>
      # Lifetime of each identity document this trust domain signs. Sketch line 392
      # "short-lived".
      # OPEN: the bounds. Taken: 60 s to 3600 s. SPIRE's default X.509-SVID lifetime is 1 h
      # (unverified).
      - name: document_ttl_seconds
        type: Integer
    invariants:
      - document_ttl_seconds >= 60
      - document_ttl_seconds <= 3600
    # OPEN: how peers get the trust bundle (the public keys of current and previous signing key);
    # SPIFFE calls this the trust bundle and distributes it to workloads (unverified). Taken: the
    # node agent receives it on the node channel; this domain records only the key references.
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: Signs documents with signing_key_ref.}
        - {name: RotationRequested, summary: "Signs with signing_key_ref; the operator asked for a rotation that weft-control's issuer has not started."}
        - {name: Rotating, summary: "Signs with the new key; documents signed by the previous key are still accepted."}
        - {name: Retired, summary: "Signs nothing; documents it signed are no longer accepted."}
      terminal: [Retired]
      transitions:
        - name: request_rotation
          from: [Active]
          to: RotationRequested
        - name: rotate
          from: [RotationRequested]
          to: Rotating
        - name: finish_rotation
          from: [Rotating]
          to: Active
        - name: retire
          from: [Active]
          to: Retired

  # Sketch lines 390-393: "Every instance gets an identity at start", "IdentityDocument:
  # short-lived, signed by the cluster, renewed by the node agent before it expires". "11. Node
  # control" line 433: the control plane hands it to the node agent with `IssueIdentity`.
  # "Channels" lines 95-96: the instance reads it from a local endpoint of weft-node that only that
  # instance reaches.
  # The record holds what the issuer decided, not the signed bytes: the certificate or JWT travels
  # on the node channel (protocols/node-channel.yaml) and the private key never leaves the node.
  # OPEN: where the key pair is made. Taken: weft-node makes it per document and sends only a
  # signing request, as a SPIRE agent does (unverified).
  - name: weft.identity.IdentityDocument
    naming:
      summary: >-
        A short-lived signed document that carries one instance's workload identity, renewed by
        its node agent before it expires and revoked when the instance ends.
    identity:
      name: identity_document_id
      type: weft.shared.IdentityDocumentId
    fields:
      - name: trust_domain_id
        type: weft.shared.TrustDomainId
      # Sketch line 391: `tenant/account/formation/environment/component/instance`. As a SPIFFE ID
      # this is the path after `spiffe://<trust domain name>/` (unverified).
      # OPEN: whether each segment is the entity's name (readable, changes on rename) or its id
      # (stable). Taken: the issuer writes it; the segments are also stored below by id.
      - name: identity
        type: weft.shared.WorkloadIdentity
      - name: tenant_id
        type: weft.shared.TenantId
      - name: account_id
        type: weft.shared.AccountId
      - name: formation_id
        type: weft.shared.FormationId
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: component
        type: weft.shared.ComponentName
      - name: instance_id
        type: weft.shared.InstanceId
      # The instance's workload, checked against the path segments at issue.
      - name: workload_id
        type: weft.shared.WorkloadId
      # The node the instance runs on; only its agent renews the document.
      - name: node_id
        type: weft.shared.NodeId
      - name: format
        type: weft.identity.DocumentFormat
      # The X.509 serial number or the JWT `jti` of the current signed document (unverified);
      # a renewal signs a new document and changes it.
      - name: serial
        type: String
      # The trust domain key that signed the current document.
      - name: signed_with
        type: weft.identity.SigningKeyRef
      - name: issued_at
        type: Timestamp
      - name: renewed_at
        type: Optional<Timestamp>
      - name: expires_at
        type: Timestamp
      - name: revocation_reason
        type: Optional<weft.identity.RevocationReason>
      - name: revoked_at
        type: Optional<Timestamp>
    # UNMAPPED: the sketch says a document is "signed by the cluster" and nothing about what
    # happens to documents when the trust domain record goes away. No command here deletes either
    # record, so `references` decides nothing yet; whether the trust domain owns its documents is
    # open for the owner.
    relations:
      - name: trust_domain
        kind: references
        target: weft.identity.TrustDomain
        cardinality: one
        via: trust_domain_id
      # The path segments and the node (sketch line 391). A document names them; none of them
      # stands or falls with it.
      - {name: tenant_id, kind: references, target: weft.accounts.Tenant, cardinality: one, via: tenant_id}
      - {name: account_id, kind: references, target: weft.accounts.Account, cardinality: one, via: account_id}
      - {name: formation_id, kind: references, target: weft.formations.Formation, cardinality: one, via: formation_id}
      - {name: environment_id, kind: references, target: weft.formations.Environment, cardinality: one, via: environment_id}
      - {name: instance_id, kind: references, target: weft.workloads.Instance, cardinality: one, via: instance_id}
      - {name: workload_id, kind: references, target: weft.workloads.Workload, cardinality: one, via: workload_id}
      - {name: node_id, kind: references, target: weft.infrastructure.Node, cardinality: one, via: node_id}
    lifecycle:
      initial: Issued
      states:
        - {name: Issued, summary: Signed at instance start and not yet renewed.}
        - {name: Renewed, summary: Signed again by the node agent's renewal before it expired.}
        - {name: Expired, summary: Past expires_at without a renewal; no peer accepts it.}
        - {name: Revoked, summary: "Ended before its expiry, because the instance ended or for a named reason."}
      terminal: [Expired, Revoked]
      transitions:
        - name: renew
          from: [Issued, Renewed]
          to: Renewed
        - name: expire
          from: [Issued, Renewed]
          to: Expired
        - name: revoke
          from: [Issued, Renewed]
          to: Revoked

  # Sketch line 397 "calls to outside services: exchange the identity for a scoped token of that
  # service". The sketch does not say what allows an exchange; brief: only an explicit policy, so
  # an identity with no policy gets no token (default deny, AGENTS.md).
  # A policy names one component in one environment of one formation, one audience and the scopes
  # it may receive. The match is on the path segments, so every replica of the component is
  # covered and no single instance is named (line 399 says the same of SecretGrant).
  - name: weft.identity.ExchangePolicy
    naming:
      summary: >-
        Allows one component of one formation environment to exchange its identity document for a
        token of one outside audience, with at most the listed scopes.
    identity:
      name: exchange_policy_id
      type: weft.shared.ExchangePolicyId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: formation_id
        type: weft.shared.FormationId
      - name: environment_id
        type: weft.shared.EnvironmentId
      - name: component
        type: weft.shared.ComponentName
      - name: audience
        type: weft.identity.Audience
      - name: allowed_scopes
        type: List<weft.identity.Scope>
      # OPEN: the bounds of a token's lifetime. Taken: 60 s to 3600 s, like the documents.
      - name: max_token_ttl_seconds
        type: Integer
      # The outside service's token endpoint, which takes the identity document as an RFC 8693
      # `subject_token` (unverified).
      # OPEN: whether the outside service mints the token from weft's document (weft-control calls
      # its endpoint), or weft-control mints a token the outside service trusts by federation
      # (weft as the token issuer). Taken: the outside service mints it.
      - name: token_endpoint
        type: String
    invariants:
      - max_token_ttl_seconds >= 60
      - max_token_ttl_seconds <= 3600
    # The account, formation and environment a policy is written for. A policy names them; none
    # of them stands or falls with it.
    relations:
      - {name: account_id, kind: references, target: weft.accounts.Account, cardinality: one, via: account_id}
      - {name: formation_id, kind: references, target: weft.formations.Formation, cardinality: one, via: formation_id}
      - {name: environment_id, kind: references, target: weft.formations.Environment, cardinality: one, via: environment_id}
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: Allows the exchange it names.}
        - {name: Withdrawn, summary: Allows nothing.}
      terminal: [Withdrawn]
      transitions:
        - name: withdraw
          from: [Active]
          to: Withdrawn

  # Sketch line 397. The record of one granted exchange, for audit. The token itself is never
  # stored: it is answered once to the instance and appears in no view or event (the same rule as
  # secret values, section 7 line 386).
  # A refused exchange is answered with its named error and leaves no record.
  # OPEN: whether refused exchanges are audited too. Taken: no record, as the sketch asks audit
  # only of secret deliveries (line 385).
  - name: weft.identity.TokenExchange
    naming:
      summary: >-
        One granted exchange of an identity document for a scoped token of an outside audience,
        under one exchange policy.
    identity:
      name: token_exchange_id
      type: weft.shared.TokenExchangeId
    fields:
      - name: identity_document_id
        type: weft.shared.IdentityDocumentId
      - name: exchange_policy_id
        type: weft.shared.ExchangePolicyId
      - name: audience
        type: weft.identity.Audience
      - name: scopes
        type: List<weft.identity.Scope>
      - name: issued_at
        type: Timestamp
      - name: expires_at
        type: Timestamp
    # UNMAPPED: the sketch names no record of an exchange, so whether it belongs to its document or
    # its policy (owns) or only names them (references) is not read from any source. No command
    # deletes any of the three; `references` is written so the links are checkable. Open for the
    # owner.
    relations:
      - name: identity_document
        kind: references
        target: weft.identity.IdentityDocument
        cardinality: one
        via: identity_document_id
      - name: exchange_policy
        kind: references
        target: weft.identity.ExchangePolicy
        cardinality: one
        via: exchange_policy_id
    lifecycle:
      initial: Granted
      states:
        - {name: Granted, summary: The token was handed to the instance; it ends at expires_at.}
      terminal: [Granted]

errors:
  - name: weft.identity.NotFound
    summary: The addressed record does not exist, and nothing changed.
  - name: weft.identity.StateConflict
    summary: The addressed record is not in a state this command acts from, and nothing changed.
  - name: weft.identity.TtlOutOfBounds
    summary: A lifetime is outside the allowed bounds, and nothing changed.
  - name: weft.identity.TrustDomainExists
    summary: The cluster already has a trust domain that is not retired, and nothing changed.
  - name: weft.identity.SameSigningKey
    summary: The new signing key is the key in use, so nothing was rotated.
  - name: weft.identity.RotationOverlapNotOver
    summary: >-
      Documents signed by the previous key may still be live, so the previous key is still
      accepted and nothing changed.
  - name: weft.identity.RotationEndNotAhead
    summary: >-
      The end of the overlap is not after the control plane's own decision instant, so the
      previous key would be dropped at once; nothing changed.
  - name: weft.identity.KeyNotRequested
    summary: >-
      The key is not the one the operator asked to rotate to, so nothing was rotated.
  - name: weft.identity.TrustDomainInUse
    summary: Identity documents of this trust domain are still live, so it was not retired.
  - name: weft.identity.UnknownTrustDomain
    summary: No trust domain has this identity, so no document was issued.
  - name: weft.identity.TrustDomainNotActive
    summary: The trust domain is retired and signs nothing, so no document was issued.
  - name: weft.identity.InstanceNotOnNode
    summary: >-
      The instance does not exist or is not assigned to the named node, so the node gets no
      identity for it and nothing changed.
  - name: weft.identity.IdentityPathMismatch
    summary: >-
      The tenant, account, formation, environment or component named differs from the instance's
      own record, so no document was issued.
  - name: weft.identity.DocumentAlreadyLive
    summary: The instance already holds a live document of this format, so no second one was issued.
  - name: weft.identity.NotIssuingNode
    summary: The document belongs to an instance on another node, so this node cannot renew it.
  - name: weft.identity.DocumentExpired
    summary: The document is past its expiry, so it cannot be renewed; the instance needs a new one.
  - name: weft.identity.NotYetExpired
    summary: The document has not reached its expiry, so it was not marked expired.
  - name: weft.identity.EmptyScopes
    summary: The policy lists no scope, and a policy that allows nothing is not written.
  - name: weft.identity.FormationNotInAccount
    summary: >-
      The formation or the environment does not exist, the formation does not belong to the named
      account or the environment not to the formation, so no policy was written.
  - name: weft.identity.DuplicateExchangePolicy
    summary: >-
      An active policy already names this component, environment and audience, so no second one
      was written.
  - name: weft.identity.NotOwnDocument
    summary: The caller is not the instance the document was issued to, so no token was issued.
  - name: weft.identity.UnknownIdentityDocument
    summary: No identity document has this identity, so no token was issued.
  - name: weft.identity.IdentityDocumentNotValid
    summary: The identity document is expired or revoked, so no token was issued.
  - name: weft.identity.NoExchangePolicy
    summary: No active exchange policy has this identity, so no token was issued.
  - name: weft.identity.PolicyNotForIdentity
    summary: >-
      The policy or the document names another formation, environment or component than the
      request, so no token was issued.
  - name: weft.identity.AudienceNotAllowed
    summary: The policy names another audience, so no token was issued.
  - name: weft.identity.ScopeNotAllowed
    summary: >-
      The request names no scope, or a scope the policy does not list, so no token was issued.
  - name: weft.identity.OutsideServiceRefused
    summary: The outside service's token endpoint refused the exchange, so no token was issued.

events:
  - name: weft.identity.TrustDomainCreated
    fields:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
      - {name: cloud_id, type: weft.shared.CloudId}
      - {name: name, type: weft.identity.TrustDomainName}
      - {name: signing_key_ref, type: weft.identity.SigningKeyRef}

  - name: weft.identity.KeyRotationRequested
    fields:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
      - {name: signing_key_ref, type: weft.identity.SigningKeyRef}

  - name: weft.identity.SigningKeyRotated
    fields:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
      - {name: signing_key_ref, type: weft.identity.SigningKeyRef}
      - {name: previous_signing_key_ref, type: weft.identity.SigningKeyRef}

  - name: weft.identity.KeyRotationFinished
    fields:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}

  - name: weft.identity.TrustDomainRetired
    fields:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}

  # The events carry the identity and the key reference, never the signed document or a key.
  - name: weft.identity.IdentityDocumentIssued
    fields:
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}
      - {name: identity, type: weft.shared.WorkloadIdentity}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      - {name: format, type: weft.identity.DocumentFormat}

  - name: weft.identity.IdentityDocumentRenewed
    fields:
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}

  - name: weft.identity.IdentityDocumentExpired
    fields:
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}

  - name: weft.identity.IdentityDocumentRevoked
    fields:
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}
      - {name: reason, type: weft.identity.RevocationReason}

  - name: weft.identity.ExchangePolicyCreated
    fields:
      - {name: exchange_policy_id, type: weft.shared.ExchangePolicyId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: audience, type: weft.identity.Audience}
      - {name: allowed_scopes, type: List<weft.identity.Scope>}

  - name: weft.identity.ExchangePolicyWithdrawn
    fields:
      - {name: exchange_policy_id, type: weft.shared.ExchangePolicyId}

  # Never carries the token.
  - name: weft.identity.TokenExchanged
    fields:
      - {name: token_exchange_id, type: weft.shared.TokenExchangeId}
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}
      - {name: exchange_policy_id, type: weft.shared.ExchangePolicyId}
      - {name: audience, type: weft.identity.Audience}
      - {name: scopes, type: List<weft.identity.Scope>}

commands:
  # Sketch line 392 "signed by the cluster", "9. Cluster" line 406. Called when a cluster is set
  # up. The key itself is made and held by key custody; the command names its reference only.
  - name: weft.identity.CreateTrustDomain
    naming:
      display: Create a trust domain
    input:
      - {name: cloud_id, type: weft.shared.CloudId}
      - {name: name, type: weft.identity.TrustDomainName}
      - {name: signing_key_ref, type: weft.identity.SigningKeyRef}
      - {name: document_ttl_seconds, type: Integer}
    outcomes:
      - name: ttl-out-of-bounds
        when: {any: [document_ttl_seconds < 60, document_ttl_seconds > 3600]}
        error: weft.identity.TtlOutOfBounds
      - name: cluster-has-trust-domain
        when_related:
          entity: weft.identity.TrustDomain
          where:
            all:
              - cloud_id == input.cloud_id
              - {state: [Active, RotationRequested, Rotating]}
          count: {gte: 1}
        error: weft.identity.TrustDomainExists
      - name: created
        creates: weft.identity.TrustDomain
        instance: trust_domain_id
        sets:
          cloud_id: input.cloud_id
          name: input.name
          signing_key_ref: input.signing_key_ref
          document_ttl_seconds: input.document_ttl_seconds
        emits: [weft.identity.TrustDomainCreated]
        payload:
          weft.identity.TrustDomainCreated:
            trust_domain_id: {generated: true}
            cloud_id: input.cloud_id
            name: input.name
            signing_key_ref: input.signing_key_ref

  # Brief: "TrustDomain of a cluster with its signing key reference and rotation". The sketch
  # names no rotation; the smallest safe rotation keeps the previous key accepted until every
  # document it signed has expired. Documents move to the new key at their next renewal.
  # OPEN: who starts a rotation and how often (on a schedule, by the operator only). Taken: the
  # operator, by hand.
  # Hardening pass 5 (2026-11-26): the operator asks for the rotation and names the key; the end
  # of the overlap is weft-control's clock plus document_ttl_seconds, so the operator's request
  # carries no time and weft-control's issuer (ControlPlane) rotates with its own clock
  # (RotateSigningKey, level step on RequestedKeyRotations, ess/components.yaml). Before, the
  # operator named rotation_ends_at and could end the overlap before documents signed by the
  # previous key expired.
  - name: weft.identity.RequestKeyRotation
    naming:
      display: Ask for a trust domain's signing key rotation
    input:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
      - {name: new_signing_key_ref, type: weft.identity.SigningKeyRef}
    outcomes:
      - name: no-such-trust-domain
        unknown_instance: true
        error: weft.identity.NotFound
      - name: same-key
        when_subject:
          predicate: signing_key_ref == input.new_signing_key_ref
        error: weft.identity.SameSigningKey
      - name: requested
        moves: weft.identity.TrustDomain.request_rotation
        instance: trust_domain_id
        sets:
          requested_signing_key_ref: input.new_signing_key_ref
        emits: [weft.identity.KeyRotationRequested]
        payload:
          weft.identity.KeyRotationRequested:
            trust_domain_id: input.trust_domain_id
            signing_key_ref: input.new_signing_key_ref
      - name: wrong-state
        wrong_state: true
        error: weft.identity.StateConflict

  # weft-control's issuer starts a requested rotation. new_signing_key_ref is the row's
  # requested_signing_key_ref, checked against it.
  - name: weft.identity.RotateSigningKey
    naming:
      display: Rotate a trust domain's signing key
    input:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
      - {name: new_signing_key_ref, type: weft.identity.SigningKeyRef}
      # hardening pass 3: when the overlap ends, stamped by weft-control's issuer as its clock
      # plus document_ttl_seconds (was minted, a fixed 2020 instant in the interpreter, so every
      # rotation was over at once). ESS 0.99.2 refuses `now` plus a field in `sets:`.
      - {name: rotation_ends_at, type: weft.shared.StampedAt}
    outcomes:
      - name: end-not-ahead
        when: rotation_ends_at <= now
        error: weft.identity.RotationEndNotAhead
      - name: no-such-trust-domain
        unknown_instance: true
        error: weft.identity.NotFound
      # `defined` first, as in FinishKeyRotation: a trust domain with no request is decided by
      # wrong-state, not read as Unknown.
      - name: key-not-requested
        when_subject:
          predicate:
            all:
              - defined(requested_signing_key_ref)
              - requested_signing_key_ref != input.new_signing_key_ref
        error: weft.identity.KeyNotRequested
      - name: rotated
        moves: weft.identity.TrustDomain.rotate
        instance: trust_domain_id
        sets:
          previous_signing_key_ref: {subject: signing_key_ref}
          signing_key_ref: input.new_signing_key_ref
          requested_signing_key_ref: {cleared: true}
          rotation_ends_at: input.rotation_ends_at
        emits: [weft.identity.SigningKeyRotated]
        payload:
          weft.identity.SigningKeyRotated:
            trust_domain_id: input.trust_domain_id
            signing_key_ref: input.new_signing_key_ref
            previous_signing_key_ref: {subject: signing_key_ref}
      - name: wrong-state
        wrong_state: true
        error: weft.identity.StateConflict

  # Ends the overlap of a rotation: the previous key is no longer accepted.
  - name: weft.identity.FinishKeyRotation
    naming:
      display: Finish a key rotation
    input:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
    outcomes:
      - name: no-such-trust-domain
        unknown_instance: true
        error: weft.identity.NotFound
      # hardening pass 3: `defined` first, so a trust domain not rotating (no end set) is decided
      # here and answers wrong-state; ESS 0.99.2 reads `>` over an absent Optional as Unknown.
      - name: overlap-not-over
        when_subject:
          predicate:
            all:
              - defined(rotation_ends_at)
              - rotation_ends_at > now
        error: weft.identity.RotationOverlapNotOver
      - name: finished
        moves: weft.identity.TrustDomain.finish_rotation
        instance: trust_domain_id
        sets:
          previous_signing_key_ref: {cleared: true}
          rotation_ends_at: {cleared: true}
        emits: [weft.identity.KeyRotationFinished]
        payload:
          weft.identity.KeyRotationFinished:
            trust_domain_id: input.trust_domain_id
      - name: wrong-state
        wrong_state: true
        error: weft.identity.StateConflict

  # "9. Cluster" line 406: a trust domain ends with its cluster.
  - name: weft.identity.RetireTrustDomain
    naming:
      display: Retire a trust domain
    input:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
    outcomes:
      - name: no-such-trust-domain
        unknown_instance: true
        error: weft.identity.NotFound
      # A live document stays verifiable until it ends; so a live document's trust domain is
      # never retired, and renewal needs no check of the trust domain's state.
      - name: in-use
        when_related:
          entity: weft.identity.IdentityDocument
          where:
            all:
              - trust_domain_id == input.trust_domain_id
              - {state: [Issued, Renewed]}
          count: {gte: 1}
        error: weft.identity.TrustDomainInUse
      - name: retired
        moves: weft.identity.TrustDomain.retire
        instance: trust_domain_id
        emits: [weft.identity.TrustDomainRetired]
        payload:
          weft.identity.TrustDomainRetired:
            trust_domain_id: input.trust_domain_id
      - name: wrong-state
        wrong_state: true
        error: weft.identity.StateConflict

  # Sketch line 390 "Every instance gets an identity at start"; "11. Node control" line 433
  # `IssueIdentity`. The issuer in weft-control (line 68) signs; the node agent of the instance's
  # node asks for it when it starts the instance.
  # OPEN: the sketch's Actors list has no identity issuer. Taken: the NodeAgent calls it for an
  # instance assigned to its node, and the issuer refuses any other instance.
  - name: weft.identity.IssueIdentityDocument
    naming:
      display: Issue an identity document
    input:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
      - {name: instance_id, type: weft.shared.InstanceId}
      - {name: node_id, type: weft.shared.NodeId}
      # The instance's workload: the record that names its formation, environment and component.
      - {name: workload_id, type: weft.shared.WorkloadId}
      - {name: tenant_id, type: weft.shared.TenantId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: format, type: weft.identity.DocumentFormat}
    outcomes:
      # Every segment of the path is checked against the stored records: the instance
      # (weft.workloads.Instance: its node and its workload), the workload (account, formation,
      # environment, component) and the account (tenant). An identity is never widened by what
      # the caller sends; an unknown record refuses like a mismatch.
      - name: unknown-trust-domain
        when_related:
          via: input.trust_domain_id
          exists: false
        error: weft.identity.UnknownTrustDomain
      - name: no-such-instance
        when_related: {via: input.instance_id, exists: false}
        error: weft.identity.InstanceNotOnNode
      - name: no-such-workload
        when_related: {via: input.workload_id, exists: false}
        error: weft.identity.IdentityPathMismatch
      - name: no-such-account
        when_related: {via: input.account_id, exists: false}
        error: weft.identity.IdentityPathMismatch
      # hardening pass 1 D10: the formation and environment are read below (W1); a missing one
      # refuses like a mismatch.
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.identity.IdentityPathMismatch
      - name: no-such-environment
        when_related: {via: input.environment_id, exists: false}
        error: weft.identity.IdentityPathMismatch
      # The instance's node is set when it is scheduled (weft.workloads.Instance.node_id); an
      # instance with no node yet is on no node.
      - name: instance-not-on-node
        when_related:
          via: input.instance_id
          predicate: {any: [{node_id: {defined: false}}, node_id != input.node_id]}
        error: weft.identity.InstanceNotOnNode
      - name: instance-of-other-workload
        when_related: {via: input.instance_id, predicate: workload_id != input.workload_id}
        error: weft.identity.IdentityPathMismatch
      - name: path-mismatch
        when_related:
          via: input.workload_id
          predicate:
            any:
              - account_id != input.account_id
              - formation_id != input.formation_id
              - environment_id != input.environment_id
              - component != input.component
        error: weft.identity.IdentityPathMismatch
      - name: account-of-other-tenant
        when_related: {via: input.account_id, predicate: tenant_id != input.tenant_id}
        error: weft.identity.IdentityPathMismatch
      # hardening pass 1 D10: the workload's path is not proof that its formation is the account's
      # (W1); check the formation record itself, so a workload filed under another account's
      # formation gets no identity in that formation.
      - name: formation-of-other-account
        when_related: {via: input.formation_id, predicate: account_id != input.account_id}
        error: weft.identity.IdentityPathMismatch
      # hardening pass 1 D10: an environment of another formation would put the identity in it.
      - name: environment-of-other-formation
        when_related: {via: input.environment_id, predicate: formation_id != input.formation_id}
        error: weft.identity.IdentityPathMismatch
      - name: trust-domain-retired
        when_related:
          via: input.trust_domain_id
          predicate: state == Retired
        error: weft.identity.TrustDomainNotActive
      - name: already-live
        when_related:
          entity: weft.identity.IdentityDocument
          where:
            all:
              - instance_id == input.instance_id
              - format == input.format
              - {state: [Issued, Renewed]}
          count: {gte: 1}
        error: weft.identity.DocumentAlreadyLive
      - name: issued
        creates: weft.identity.IdentityDocument
        instance: identity_document_id
        sets:
          trust_domain_id: input.trust_domain_id
          # The issuer joins the path segments (line 391).
          identity: {generated: true}
          tenant_id: input.tenant_id
          account_id: input.account_id
          formation_id: input.formation_id
          environment_id: input.environment_id
          component: input.component
          instance_id: input.instance_id
          workload_id: input.workload_id
          node_id: input.node_id
          format: input.format
          serial: {generated: true}
          # The trust domain's signing_key_ref at this instant.
          signed_with: {generated: true}
          issued_at: {generated: true}
          # issued_at plus the trust domain's document_ttl_seconds.
          expires_at: {generated: true}
        emits: [weft.identity.IdentityDocumentIssued]
        payload:
          weft.identity.IdentityDocumentIssued:
            identity_document_id: {generated: true}
            identity: {generated: true}
            instance_id: input.instance_id
            node_id: input.node_id
            format: input.format

  # Sketch line 392-393 "renewed by the node agent before it expires". A renewal signs a new
  # document with the trust domain's current key, so a key rotation reaches every live document
  # within one lifetime.
  # OPEN: when the node agent renews (the renewal window). Taken: any time before expiry; SPIRE
  # renews at half the lifetime (unverified).
  - name: weft.identity.RenewIdentityDocument
    naming:
      display: Renew an identity document
    input:
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}
      - {name: node_id, type: weft.shared.NodeId}
    outcomes:
      - name: no-such-document
        unknown_instance: true
        error: weft.identity.NotFound
      - name: not-issuing-node
        when_subject:
          predicate: node_id != input.node_id
        error: weft.identity.NotIssuingNode
      - name: past-expiry
        when_subject:
          predicate: expires_at <= now
        error: weft.identity.DocumentExpired
      - name: renewed
        moves: weft.identity.IdentityDocument.renew
        instance: identity_document_id
        sets:
          serial: {generated: true}
          signed_with: {generated: true}
          renewed_at: {generated: true, present: true}
          expires_at: {generated: true}
        emits: [weft.identity.IdentityDocumentRenewed]
        payload:
          weft.identity.IdentityDocumentRenewed:
            identity_document_id: input.identity_document_id
      - name: wrong-state
        wrong_state: true
        error: weft.identity.StateConflict

  # Sketch line 392 "short-lived": a document not renewed in time ends at its expiry.
  # OPEN: the sketch's Actors list has no identity issuer, which is what notices the expiry.
  # Taken: a step of weft-control; the integrator names its actor.
  - name: weft.identity.ExpireIdentityDocument
    naming:
      display: Mark an identity document expired
    input:
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}
    outcomes:
      - name: no-such-document
        unknown_instance: true
        error: weft.identity.NotFound
      - name: not-yet-expired
        when_subject:
          predicate: expires_at > now
        error: weft.identity.NotYetExpired
      - name: expired
        moves: weft.identity.IdentityDocument.expire
        instance: identity_document_id
        emits: [weft.identity.IdentityDocumentExpired]
        payload:
          weft.identity.IdentityDocumentExpired:
            identity_document_id: input.identity_document_id
      - name: wrong-state
        wrong_state: true
        error: weft.identity.StateConflict

  # Brief: "revoked when the instance ends". The instance's end is observed by its node agent
  # ("11. Node control" line 434 `InstanceObserved`); the operator revokes for a compromise.
  # OPEN: how peers learn of a revocation before the document expires. SPIFFE relies on short
  # lifetimes rather than revocation lists (unverified). Taken: weft-node's mutual TLS check reads
  # the revoked serials it receives on the node channel.
  - name: weft.identity.RevokeIdentityDocument
    naming:
      display: Revoke an identity document
    input:
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}
      - {name: reason, type: weft.identity.RevocationReason}
    outcomes:
      - name: no-such-document
        unknown_instance: true
        error: weft.identity.NotFound
      - name: revoked
        moves: weft.identity.IdentityDocument.revoke
        instance: identity_document_id
        sets:
          revocation_reason: input.reason
          revoked_at: {generated: true, present: true}
        emits: [weft.identity.IdentityDocumentRevoked]
        payload:
          weft.identity.IdentityDocumentRevoked:
            identity_document_id: input.identity_document_id
            reason: input.reason
      - name: wrong-state
        wrong_state: true
        error: weft.identity.StateConflict

  # Sketch line 397 and the brief: an exchange is allowed only by an explicit policy. Writing one
  # widens what an identity may reach, so every bound has a named refusal.
  # OPEN: which roles may write a policy. Taken: account admins and tenant owners, not deployers.
  - name: weft.identity.CreateExchangePolicy
    naming:
      display: Create an exchange policy
    input:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: audience, type: weft.identity.Audience}
      - {name: allowed_scopes, type: List<weft.identity.Scope>}
      - {name: max_token_ttl_seconds, type: Integer}
      - {name: token_endpoint, type: String}
    outcomes:
      # hardening pass 1 D3: the policy is written only in the account the caller acts in; answered
      # before any formation or environment is read, as not found, so another account's records
      # are not disclosed.
      - name: not-callers-account
        when: account_id != caller.account_id
        error: weft.identity.NotFound
      - name: ttl-out-of-bounds
        when: {any: [max_token_ttl_seconds < 60, max_token_ttl_seconds > 3600]}
        error: weft.identity.TtlOutOfBounds
      - name: no-scopes
        when: allowed_scopes.count < 1
        error: weft.identity.EmptyScopes
      # The formation and its environments live in `formations` (weft.formations.Formation,
      # Environment); deny unless both exist and belong to the named account. A policy never
      # reaches into another account.
      - name: no-such-formation
        when_related: {via: input.formation_id, exists: false}
        error: weft.identity.FormationNotInAccount
      - name: no-such-environment
        when_related: {via: input.environment_id, exists: false}
        error: weft.identity.FormationNotInAccount
      - name: formation-not-in-account
        when_related: {via: input.formation_id, predicate: account_id != input.account_id}
        error: weft.identity.FormationNotInAccount
      - name: environment-not-in-formation
        when_related: {via: input.environment_id, predicate: formation_id != input.formation_id}
        error: weft.identity.FormationNotInAccount
      - name: duplicate
        when_related:
          entity: weft.identity.ExchangePolicy
          where:
            all:
              - formation_id == input.formation_id
              - environment_id == input.environment_id
              - component == input.component
              - audience == input.audience
              - state == Active
          count: {gte: 1}
        error: weft.identity.DuplicateExchangePolicy
      - name: created
        creates: weft.identity.ExchangePolicy
        instance: exchange_policy_id
        sets:
          account_id: input.account_id
          formation_id: input.formation_id
          environment_id: input.environment_id
          component: input.component
          audience: input.audience
          allowed_scopes: input.allowed_scopes
          max_token_ttl_seconds: input.max_token_ttl_seconds
          token_endpoint: input.token_endpoint
        emits: [weft.identity.ExchangePolicyCreated]
        payload:
          weft.identity.ExchangePolicyCreated:
            exchange_policy_id: {generated: true}
            formation_id: input.formation_id
            environment_id: input.environment_id
            component: input.component
            audience: input.audience
            allowed_scopes: input.allowed_scopes

  # Sketch line 397. Withdrawing narrows access; tokens already handed out live until their own
  # expiry (at most max_token_ttl_seconds).
  # OPEN: whether withdrawing must also revoke tokens already issued at the outside service.
  - name: weft.identity.WithdrawExchangePolicy
    naming:
      display: Withdraw an exchange policy
    input:
      - {name: exchange_policy_id, type: weft.shared.ExchangePolicyId}
    outcomes:
      - name: no-such-policy
        unknown_instance: true
        error: weft.identity.NotFound
      # hardening pass 1 D3: only the policy's own account withdraws it; another account's policy
      # answers like a missing one, before its state is read.
      - name: not-callers-account
        when_subject:
          predicate: account_id != caller.account_id
        error: weft.identity.NotFound
      - name: withdrawn
        moves: weft.identity.ExchangePolicy.withdraw
        instance: exchange_policy_id
        emits: [weft.identity.ExchangePolicyWithdrawn]
        payload:
          weft.identity.ExchangePolicyWithdrawn:
            exchange_policy_id: input.exchange_policy_id
      - name: wrong-state
        wrong_state: true
        error: weft.identity.StateConflict

  # Sketch line 397 "exchange the identity for a scoped token of that service"; "Channels" lines
  # 95-96: the instance asks through its local endpoint of weft-node, which passes the request to
  # weft-control. The shape follows RFC 8693 (unverified): the document is the `subject_token`,
  # `audience` and `scope` narrow the token.
  # The request names the formation, environment and component; the document and the policy must
  # both name the same, so a policy covers only the identity it was written for. Every check
  # refuses by name; there is no fallback to a broader token.
  - name: weft.identity.ExchangeToken
    naming:
      display: Exchange an identity document for a token
    input:
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}
      - {name: exchange_policy_id, type: weft.shared.ExchangePolicyId}
      - {name: formation_id, type: weft.shared.FormationId}
      - {name: environment_id, type: weft.shared.EnvironmentId}
      - {name: component, type: weft.shared.ComponentName}
      - {name: audience, type: weft.identity.Audience}
      - {name: scopes, type: List<weft.identity.Scope>}
    response:
      - {name: token_exchange_id, type: weft.shared.TokenExchangeId}
      - {name: token, type: String}
      - {name: expires_at, type: Timestamp}
    outcomes:
      # weft-node knows which instance reached its local endpoint (lines 95-96); deny unless that
      # instance holds the document. Answered before any record is read.
      - name: not-own-document
        external: the calling instance is not the instance the document was issued to
        before_row: true
        error: weft.identity.NotOwnDocument
      - name: no-scope-requested
        when: scopes.count < 1
        error: weft.identity.ScopeNotAllowed
      - name: unknown-document
        when_related:
          via: input.identity_document_id
          exists: false
        error: weft.identity.UnknownIdentityDocument
      - name: no-policy
        when_related:
          via: input.exchange_policy_id
          exists: false
        error: weft.identity.NoExchangePolicy
      - name: document-not-valid
        when_related:
          via: input.identity_document_id
          predicate: {any: [state == Expired, state == Revoked, expires_at <= now]}
        error: weft.identity.IdentityDocumentNotValid
      - name: document-not-for-identity
        when_related:
          via: input.identity_document_id
          predicate:
            any:
              - formation_id != input.formation_id
              - environment_id != input.environment_id
              - component != input.component
        error: weft.identity.PolicyNotForIdentity
      - name: policy-withdrawn
        when_related:
          via: input.exchange_policy_id
          predicate: state == Withdrawn
        error: weft.identity.NoExchangePolicy
      - name: policy-not-for-identity
        when_related:
          via: input.exchange_policy_id
          predicate:
            any:
              - formation_id != input.formation_id
              - environment_id != input.environment_id
              - component != input.component
        error: weft.identity.PolicyNotForIdentity
      # hardening pass 1 D10: the policy is matched by formation, environment and component only;
      # its account must also be the document's, so a document whose path names another account's
      # formation (W1) gets none of that account's tokens.
      - name: policy-of-other-account
        when_related:
          entity: weft.identity.ExchangePolicy
          where:
            all:
              - exchange_policy_id == input.exchange_policy_id
              - not:
                  exists:
                    as: d
                    in: {entity: weft.identity.IdentityDocument}
                    that: {all: [{d.account_id: {eq: {fact: account_id}}}, d.identity_document_id == input.identity_document_id]}
          exists: true
        error: weft.identity.PolicyNotForIdentity
      - name: audience-not-allowed
        when_related:
          via: input.exchange_policy_id
          predicate: audience != input.audience
        error: weft.identity.AudienceNotAllowed
      - name: scope-not-allowed
        when_related:
          via: input.exchange_policy_id
          predicate:
            not:
              forall:
                in: input.scopes
                as: s
                that:
                  exists: {in: allowed_scopes, as: a, that: a == s}
        error: weft.identity.ScopeNotAllowed
      # Kept external: the answer of an outside service's token endpoint.
      - name: outside-service-refused
        external: the outside service's token endpoint refused the exchange
        error: weft.identity.OutsideServiceRefused
      - name: exchanged
        creates: weft.identity.TokenExchange
        instance: token_exchange_id
        returns: true
        one_time_response: [token]
        sets:
          identity_document_id: input.identity_document_id
          exchange_policy_id: input.exchange_policy_id
          audience: input.audience
          scopes: input.scopes
          issued_at: {generated: true}
          # The token's expiry as the outside service set it, and the same value as the response's
          # expires_at; at most issued_at plus the policy's max_token_ttl_seconds.
          # UNMAPPED: ESS admits a response source only in event payloads, so the model cannot
          # say that the stored and the answered expiry are one value.
          expires_at: {generated: true}
        emits: [weft.identity.TokenExchanged]
        payload:
          weft.identity.TokenExchanged:
            token_exchange_id: {response: token_exchange_id}
            identity_document_id: input.identity_document_id
            exchange_policy_id: input.exchange_policy_id
            audience: input.audience
            scopes: input.scopes

  # Sketch line 395-396 "calls between components: mutual TLS with identity certificates; a Link
  # is checked against both identities". Not modelled here as a command or a record: the check is
  # a decision per connection, made in the data plane (weft-node, weft-edge) from the two X.509
  # documents and the formation's Links, and it changes no state of this domain. Its rule, for
  # the integrator and the data-plane specification: both documents live and signed by the trust
  # domain's current or (during a rotation) previous key; both in the same formation and
  # environment; a Link from the caller's component to the callee's; else the connection is
  # refused. A refused connection may become an audit event of the data plane; the sketch does
  # not say (OPEN: whether a refused connection is recorded, and where).
  # Line 399 "a SecretGrant names identities, not instances" and the ServiceBinding of "13.
  # Catalog" line 472 ("Authenticated by the component's workload identity") use weft.shared.
  # WorkloadIdentity in their own domains; nothing here.

views:
  # Sketch line 392 and "9. Cluster" line 406: the operator's list of trust domains. It publishes
  # key references only, never key material.
  - name: weft.identity.TrustDomains
    source: weft.identity.TrustDomain
    consistency: read_your_writes
    fields:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
      - {name: cloud_id, type: weft.shared.CloudId}
      - {name: name, type: weft.identity.TrustDomainName}
      - {name: signing_key_ref, type: weft.identity.SigningKeyRef}
      - {name: previous_signing_key_ref, type: Optional<weft.identity.SigningKeyRef>}
      - {name: rotation_ends_at, type: Optional<Timestamp>}
      - {name: requested_signing_key_ref, type: Optional<weft.identity.SigningKeyRef>}
      - {name: document_ttl_seconds, type: Integer}
      - {name: state, type: weft.identity.TrustDomain.State}

  # Hardening pass 5: the gap view of the rotation's level step. weft-control's issuer
  # (ControlPlane) reads it and runs RotateSigningKey per row with requested_signing_key_ref and
  # its clock plus document_ttl_seconds.
  - name: weft.identity.RequestedKeyRotations
    source: weft.identity.TrustDomain
    consistency: read_your_writes
    filter: state == RotationRequested
    fields:
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
      - {name: requested_signing_key_ref, type: Optional<weft.identity.SigningKeyRef>}
      - {name: document_ttl_seconds, type: Integer}

  # Sketch lines 390-393. Every document with its state, for the operator and for audit. It shows
  # what the issuer decided, never the signed bytes or a key.
  - name: weft.identity.IdentityDocuments
    source: weft.identity.IdentityDocument
    consistency: read_your_writes
    fields:
      - {name: identity_document_id, type: weft.shared.IdentityDocumentId}
      - {name: trust_domain_id, type: weft.shared.TrustDomainId}
      - {name: identity, type: weft.shared.WorkloadIdentity}
      - {name: tenant_id, type: weft.shared.TenantId}
