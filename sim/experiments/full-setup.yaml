format: weft-sim-experiment/1
name: full-setup
summary: >-
  A virtual full setup built from the specification: a cloud with two zones, a shared node pool
  for the default cluster, and tenant acme's cluster with three dedicated pools as the groups of
  its topology; tenants acme and globex with accounts and quotas; acme's formations shop (FanIn)
  and etl (Pipeline) in acme's cluster, globex's formation site in the default cluster; their
  services' replicas requested, placed by a scheduler that tries every node and isolation level
  from the weakest, assigned, started and running. Traffic on the formation links counts the
  topology links each message crosses. Fault: a node of acme's hub group goes silent and is
  cordoned.
seed: 3

vars:
  zone_a: z1
  zone_b: z2
  per_pool: 2
  replicas: 1
  rate: 12
  kind: Star
  role_0: Hub
  role_1: Spoke
  role_2: Spoke
  shop_c_0: web
  shop_c_1: mobile
  shop_c_2: api
  etl_c_0: ingest
  etl_c_1: transform
  etl_c_2: load
  isolation_facts: {kvm_present: true, cgroups_delegated: true, egress_denied: true, gpu_passthrough: false, levels: [Container, MicroVm]}
  capacity: [{resource_class: cpu, amount: 32}]
  claims: [{name: cpu, class: cpu, amount: 1, selector: {}}]
  processes: [{name: main, role: Main, command: [run], environment: {}, checks: []}]
  restart_policy: {mode: Always, backoff_initial_seconds: 1, backoff_max_seconds: 60, backoff_limit: 5, backoff_window_seconds: 600}
  scale_rule: {min_replicas: 1, max_replicas: 6, metric: Requests, target: 10}

chain:
  - weft.infrastructure.CreateCloud
  - weft.infrastructure.DeclareZone
  - weft.infrastructure.CreateNodePool
  - weft.infrastructure.ProvisionPoolNode
  - weft.infrastructure.JoinNode
  - weft.infrastructure.RecordNodeObservation
  - weft.nodes.OpenNodeSession
  - weft.cluster.CreateDefaultCluster
  - weft.accounts.CreateTenant
  - weft.accounts.CreateAccount
  - weft.accounts.GrantTopQuota
  - weft.cluster.CreateCluster
  - weft.cluster.AddClusterNodePool
  - weft.cluster.RecordClusterNodePoolReady
  - weft.cluster.CreateClusterTopology
  - weft.cluster.AddTopologyGroup
  - weft.formations.CreateFormation
  - weft.formations.AddComponent
  - weft.formations.AddLink
  - weft.formations.CommitRevision
  - weft.formations.CreateEnvironment
  - weft.artifacts.RegisterArtifact
  - weft.workloads.DefineWorkload
  - weft.workloads.DefineService
  - weft.workloads.RequestReplica
  - weft.workloads.CreateInstance
  - weft.scheduling.SubmitSchedulingRequest
  - weft.scheduling.PlaceInstance
  - weft.scheduling.BindPlacement
  - weft.nodes.Assign
  - weft.workloads.ScheduleInstance
  - weft.workloads.RecordArtifactVerified
  - weft.workloads.RecordInstanceRunning

setup:
  # ---- the cloud, its zones and the shared pool of the default cluster
  - label: create-cloud
    command: weft.infrastructure.CreateCloud
    actor: weft.actors.ClusterOperator
    input: {name: sim, placement: Hosts, access_mode: Federated, policy: {minimum_isolation: Container}, control_plane: {replicas: 3}}
    expect: created
    bind: {cloud_id: cloud_id}
  - label: declare-zone-a
    command: weft.infrastructure.DeclareZone
    actor: weft.actors.ClusterOperator
    input: {zone: "${zone_a}", cloud_id: "${cloud_id}"}
    expect: declared
  - label: declare-zone-b
    command: weft.infrastructure.DeclareZone
    actor: weft.actors.ClusterOperator
    input: {zone: "${zone_b}", cloud_id: "${cloud_id}"}
    expect: declared
  - label: define-priority
    command: weft.infrastructure.DefinePriorityClass
    actor: weft.actors.ClusterOperator
    input: {name: standard, value: 100, preempts: false, preemptible: true, grace_seconds: 30}
    expect: defined
  - label: register-runtime
    command: weft.workloads.RegisterRuntime
    actor: weft.actors.ClusterOperator
    input: {name: oci, version: "1", package_kinds: [Image], minimum_isolation: Container}
    expect: registered
    bind: {runtime_id: runtime_id}
  - label: create-shared-pool
    command: weft.infrastructure.CreateNodePool
    actor: weft.actors.ClusterOperator
    input: {name: shared, zone: "${zone_a}", machine_type: m1, image: weft-node, min_size: 0, max_size: 8}
    expect: created
    bind: {shared_pool: node_pool_id}
  - label: provision-shared
    repeat: "${per_pool}"
    command: weft.infrastructure.ProvisionPoolNode
    actor: weft.actors.ClusterOperator
    input: {node_pool_id: "${shared_pool}", join_token_expires_at: "2026-01-01T06:00:00Z"}
    expect: provisioned
    bind: {"node_s_${i}": node_id, "token_s_${i}": join_token}
  - label: join-shared
    repeat: "${per_pool}"
    command: weft.infrastructure.JoinNode
    actor: weft.actors.NodeAgent
    input: {node_id: "${node_s_${i}}", join_token: "${token_s_${i}}"}
    expect: joined
  - label: observe-shared
    repeat: "${per_pool}"
    command: weft.infrastructure.RecordNodeObservation
    actor: weft.actors.NodeAgent
    input: {node_id: "${node_s_${i}}", capacity: "${capacity}", isolation_facts: "${isolation_facts}", observed_at: "${now}"}
    expect: ready
  - label: session-shared
    repeat: "${per_pool}"
    command: weft.nodes.OpenNodeSession
    actor: weft.actors.NodeAgent
    input: {node_id: "${node_s_${i}}", agent_version: "1.0", received_at: "${now}"}
    expect: opened
  - label: create-default-cluster
    command: weft.cluster.CreateDefaultCluster
    actor: weft.actors.ClusterOperator
    input: {cloud_id: "${cloud_id}", name: default, min_isolation: Container, zones: ["${zone_a}", "${zone_b}"]}
    expect: created
    bind: {default_cluster: cluster_id}

  # ---- tenants, accounts, quotas
  - label: create-tenant-acme
    command: weft.accounts.CreateTenant
    actor: weft.actors.ClusterOperator
    input: {name: acme}
    expect: created
    bind: {tenant_a: tenant_id}
  - label: create-tenant-globex
    command: weft.accounts.CreateTenant
    actor: weft.actors.ClusterOperator
    input: {name: globex}
    expect: created
    bind: {tenant_b: tenant_id}
  - label: create-account-acme
    command: weft.accounts.CreateAccount
    actor: weft.actors.TenantOwner
    caller: {tenant_id: "${tenant_a}"}
    input: {tenant_id: "${tenant_a}", name: prod}
    expect: created
    bind: {account_a: account_id}
  - label: create-account-globex
    command: weft.accounts.CreateAccount
    actor: weft.actors.TenantOwner
    caller: {tenant_id: "${tenant_b}"}
    input: {tenant_id: "${tenant_b}", name: prod}
    expect: created
    bind: {account_b: account_id}
  - label: grant-quota-acme
    command: weft.accounts.GrantTopQuota
    actor: weft.actors.ClusterOperator
    input: {account_id: "${account_a}", resource_class: cpu, limit: 64}
    expect: granted
    bind: {quota_a: quota_id}
  - label: grant-quota-globex
    command: weft.accounts.GrantTopQuota
    actor: weft.actors.ClusterOperator
    input: {account_id: "${account_b}", resource_class: cpu, limit: 16}
    expect: granted
    bind: {quota_b: quota_id}
  - label: create-sub-account-acme
    command: weft.accounts.CreateSubAccount
    actor: weft.actors.TenantOwner
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {parent_account_id: "${account_a}", name: team}
    expect: created
    bind: {sub_a: account_id}
  - label: allocate-quota-acme
    command: weft.accounts.AllocateQuota
    actor: weft.actors.TenantOwner
    caller: {tenant_id: "${tenant_a}", account_id: "${sub_a}"}
    input: {account_id: "${sub_a}", parent_account_id: "${account_a}", parent_quota_id: "${quota_a}", resource_class: cpu}
    expect: allocated
    bind: {sub_quota_a: quota_id}
  - label: draw-quota-acme
    command: weft.accounts.DrawQuota
    actor: weft.actors.TenantOwner
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {parent_quota_id: "${quota_a}", quota_id: "${sub_quota_a}", limit: 8}
    expect: drawn

  # ---- acme's cluster: three dedicated pools, each a group of the topology
  - label: create-cluster-acme
    command: weft.cluster.CreateCluster
    actor: weft.actors.TenantOwner
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {account_id: "${account_a}", cloud_id: "${cloud_id}", name: acme-main, control_plane: Shared, min_isolation: Container, zones: ["${zone_a}", "${zone_b}"]}
    expect: created
    bind: {cluster_a: cluster_id}
  - label: add-cluster-pool
    repeat: 3
    command: weft.cluster.AddClusterNodePool
    actor: weft.actors.TenantOwner
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {account_id: "${account_a}", cluster_id: "${cluster_a}", name: "acme-g${i}", zone: "${zone_a}", machine_type: m1, image: weft-node, min_size: 0, max_size: 8}
    expect: requested
    bind: {"cnp_${i}": cluster_node_pool_id, "pool_${i}": NodePoolCreated.node_pool_id}
  - label: cluster-pool-ready
    repeat: 3
    command: weft.cluster.RecordClusterNodePoolReady
    actor: weft.actors.ControlPlane
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {cluster_node_pool_id: "${cnp_${i}}", node_pool_id: "${pool_${i}}"}
    expect: ready
  - label: provision-g0
    repeat: "${per_pool}"
    command: weft.infrastructure.ProvisionPoolNode
    actor: weft.actors.ClusterOperator
    input: {node_pool_id: "${pool_0}", join_token_expires_at: "2026-01-01T06:00:00Z"}
    expect: provisioned
    bind: {"node_g0_${i}": node_id, "token_g0_${i}": join_token}
  - label: provision-g1
    repeat: "${per_pool}"
    command: weft.infrastructure.ProvisionPoolNode
    actor: weft.actors.ClusterOperator
    input: {node_pool_id: "${pool_1}", join_token_expires_at: "2026-01-01T06:00:00Z"}
    expect: provisioned
    bind: {"node_g1_${i}": node_id, "token_g1_${i}": join_token}
  - label: provision-g2
    repeat: "${per_pool}"
    command: weft.infrastructure.ProvisionPoolNode
    actor: weft.actors.ClusterOperator
    input: {node_pool_id: "${pool_2}", join_token_expires_at: "2026-01-01T06:00:00Z"}
    expect: provisioned
    bind: {"node_g2_${i}": node_id, "token_g2_${i}": join_token}
  - {label: join-g0, repeat: "${per_pool}", command: weft.infrastructure.JoinNode, actor: weft.actors.NodeAgent, input: {node_id: "${node_g0_${i}}", join_token: "${token_g0_${i}}"}, expect: joined}
  - {label: join-g1, repeat: "${per_pool}", command: weft.infrastructure.JoinNode, actor: weft.actors.NodeAgent, input: {node_id: "${node_g1_${i}}", join_token: "${token_g1_${i}}"}, expect: joined}
  - {label: join-g2, repeat: "${per_pool}", command: weft.infrastructure.JoinNode, actor: weft.actors.NodeAgent, input: {node_id: "${node_g2_${i}}", join_token: "${token_g2_${i}}"}, expect: joined}
  - {label: observe-g0, repeat: "${per_pool}", command: weft.infrastructure.RecordNodeObservation, actor: weft.actors.NodeAgent, input: {node_id: "${node_g0_${i}}", capacity: "${capacity}", isolation_facts: "${isolation_facts}", observed_at: "${now}"}, expect: ready}
  - {label: observe-g1, repeat: "${per_pool}", command: weft.infrastructure.RecordNodeObservation, actor: weft.actors.NodeAgent, input: {node_id: "${node_g1_${i}}", capacity: "${capacity}", isolation_facts: "${isolation_facts}", observed_at: "${now}"}, expect: ready}
  - {label: observe-g2, repeat: "${per_pool}", command: weft.infrastructure.RecordNodeObservation, actor: weft.actors.NodeAgent, input: {node_id: "${node_g2_${i}}", capacity: "${capacity}", isolation_facts: "${isolation_facts}", observed_at: "${now}"}, expect: ready}
  - {label: session-g0, repeat: "${per_pool}", command: weft.nodes.OpenNodeSession, actor: weft.actors.NodeAgent, input: {node_id: "${node_g0_${i}}", agent_version: "1.0", received_at: "${now}"}, expect: opened}
  - {label: session-g1, repeat: "${per_pool}", command: weft.nodes.OpenNodeSession, actor: weft.actors.NodeAgent, input: {node_id: "${node_g1_${i}}", agent_version: "1.0", received_at: "${now}"}, expect: opened}
  - {label: session-g2, repeat: "${per_pool}", command: weft.nodes.OpenNodeSession, actor: weft.actors.NodeAgent, input: {node_id: "${node_g2_${i}}", agent_version: "1.0", received_at: "${now}"}, expect: opened}
  - label: create-topology
    command: weft.cluster.CreateClusterTopology
    actor: weft.actors.TenantOwner
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {account_id: "${account_a}", cluster_id: "${cluster_a}", kind: "${kind}"}
    expect: created
    bind: {topology_a: topology_id}
  - label: add-topology-group
    repeat: 3
    command: weft.cluster.AddTopologyGroup
    actor: weft.actors.TenantOwner
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {account_id: "${account_a}", cluster_id: "${cluster_a}", topology_id: "${topology_a}", name: "g${i}", node_pools: ["${cnp_${i}}"], role: "${role_${i}}", position: "${i}", parent_group_id: null}
    expect: added

  # ---- formations: acme's shop (FanIn: web and mobile call api) and etl (Pipeline: ingest ->
  # transform -> load) in acme's cluster; globex's site in the default cluster
  - label: create-formation-shop
    command: weft.formations.CreateFormation
    actor: weft.actors.AccountAdmin
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {account_id: "${account_a}", name: shop, zones: ["${zone_a}", "${zone_b}"], cluster_id: "${cluster_a}"}
    expect: created
    bind: {formation_shop: formation_id}
  - label: create-formation-etl
    command: weft.formations.CreateFormation
    actor: weft.actors.AccountAdmin
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {account_id: "${account_a}", name: etl, zones: ["${zone_a}", "${zone_b}"], cluster_id: "${cluster_a}"}
    expect: created
    bind: {formation_etl: formation_id}
  - label: create-formation-site
    command: weft.formations.CreateFormation
    actor: weft.actors.AccountAdmin
    caller: {tenant_id: "${tenant_b}", account_id: "${account_b}"}
    input: {account_id: "${account_b}", name: site, zones: ["${zone_a}", "${zone_b}"], cluster_id: "${default_cluster}"}
    expect: created
    bind: {formation_site: formation_id}
  - label: add-component-shop
    repeat: 3
    command: weft.formations.AddComponent
    actor: weft.actors.Deployer
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {formation_id: "${formation_shop}", name: "${shop_c_${i}}"}
    expect: added
    bind: {"shop_comp_${i}": component_id}
  - label: add-component-etl
    repeat: 3
    command: weft.formations.AddComponent
    actor: weft.actors.Deployer
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {formation_id: "${formation_etl}", name: "${etl_c_${i}}"}
    expect: added
    bind: {"etl_comp_${i}": component_id}
  - label: add-component-site
    command: weft.formations.AddComponent
    actor: weft.actors.Deployer
    caller: {tenant_id: "${tenant_b}", account_id: "${account_b}"}
    input: {formation_id: "${formation_site}", name: site}
    expect: added
  - label: link-shop-web-api
    command: weft.formations.AddLink
    actor: weft.actors.Deployer
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {formation_id: "${formation_shop}", caller_component_id: "${shop_comp_0}", target_component_id: "${shop_comp_2}", protocol: Http, port: 8080}
    expect: added
  - label: link-shop-mobile-api
    command: weft.formations.AddLink
    actor: weft.actors.Deployer
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {formation_id: "${formation_shop}", caller_component_id: "${shop_comp_1}", target_component_id: "${shop_comp_2}", protocol: Http, port: 8080}
    expect: added
  - label: link-etl-ingest-transform
    command: weft.formations.AddLink
    actor: weft.actors.Deployer
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {formation_id: "${formation_etl}", caller_component_id: "${etl_comp_0}", target_component_id: "${etl_comp_1}", protocol: Grpc, port: 9000}
    expect: added
  - label: link-etl-transform-load
    command: weft.formations.AddLink
    actor: weft.actors.Deployer
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {formation_id: "${formation_etl}", caller_component_id: "${etl_comp_1}", target_component_id: "${etl_comp_2}", protocol: Grpc, port: 9000}
    expect: added
  - {label: commit-shop, command: weft.formations.CommitRevision, actor: weft.actors.Deployer, caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}, input: {formation_id: "${formation_shop}"}, expect: committed, bind: {rev_shop: revision_id}}
  - {label: commit-etl, command: weft.formations.CommitRevision, actor: weft.actors.Deployer, caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}, input: {formation_id: "${formation_etl}"}, expect: committed, bind: {rev_etl: revision_id}}
  - {label: commit-site, command: weft.formations.CommitRevision, actor: weft.actors.Deployer, caller: {tenant_id: "${tenant_b}", account_id: "${account_b}"}, input: {formation_id: "${formation_site}"}, expect: committed, bind: {rev_site: revision_id}}
  - {label: env-shop, command: weft.formations.CreateEnvironment, actor: weft.actors.AccountAdmin, caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}, input: {formation_id: "${formation_shop}", name: prod, protected: false}, expect: created, bind: {env_shop: environment_id}}
  - {label: env-etl, command: weft.formations.CreateEnvironment, actor: weft.actors.AccountAdmin, caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}, input: {formation_id: "${formation_etl}", name: prod, protected: false}, expect: created, bind: {env_etl: environment_id}}
  - {label: env-site, command: weft.formations.CreateEnvironment, actor: weft.actors.AccountAdmin, caller: {tenant_id: "${tenant_b}", account_id: "${account_b}"}, input: {formation_id: "${formation_site}", name: prod, protected: false}, expect: created, bind: {env_site: environment_id}}
  - {label: artifact-acme, command: weft.artifacts.RegisterArtifact, actor: weft.actors.Deployer, caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}, input: {artifact_digest: "sha256:acme", account_id: "${account_a}", kind: Image, size_bytes: 1000, signature: sig, signer_key_id: k1, built_from: null}, expect: registered}
  - {label: artifact-globex, command: weft.artifacts.RegisterArtifact, actor: weft.actors.Deployer, caller: {tenant_id: "${tenant_b}", account_id: "${account_b}"}, input: {artifact_digest: "sha256:globex", account_id: "${account_b}", kind: Image, size_bytes: 1000, signature: sig, signer_key_id: k1, built_from: null}, expect: registered}

  # ---- workloads and services, one per component
  - label: workload-shop
    repeat: 3
    command: weft.workloads.DefineWorkload
    actor: weft.actors.Deployer
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {account_id: "${account_a}", formation_id: "${formation_shop}", formation_revision_id: "${rev_shop}", environment_id: "${env_shop}", component: "${shop_c_${i}}", package_kind: Image, artifact_digest: "sha256:acme", runtime_id: "${runtime_id}", isolation: Container, shape: Service, settings: {shape: service, value: {stateful: false}}, claims: "${claims}", processes: "${processes}", restart_policy: "${restart_policy}", priority: standard}
    expect: defined
    bind: {"shop_w_${i}": workload_id}
  - label: workload-etl
    repeat: 3
    command: weft.workloads.DefineWorkload
    actor: weft.actors.Deployer
    caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}
    input: {account_id: "${account_a}", formation_id: "${formation_etl}", formation_revision_id: "${rev_etl}", environment_id: "${env_etl}", component: "${etl_c_${i}}", package_kind: Image, artifact_digest: "sha256:acme", runtime_id: "${runtime_id}", isolation: Container, shape: Service, settings: {shape: service, value: {stateful: false}}, claims: "${claims}", processes: "${processes}", restart_policy: "${restart_policy}", priority: standard}
    expect: defined
    bind: {"etl_w_${i}": workload_id}
  - label: workload-site
    command: weft.workloads.DefineWorkload
    actor: weft.actors.Deployer
    caller: {tenant_id: "${tenant_b}", account_id: "${account_b}"}
    input: {account_id: "${account_b}", formation_id: "${formation_site}", formation_revision_id: "${rev_site}", environment_id: "${env_site}", component: site, package_kind: Image, artifact_digest: "sha256:globex", runtime_id: "${runtime_id}", isolation: Container, shape: Service, settings: {shape: service, value: {stateful: false}}, claims: "${claims}", processes: "${processes}", restart_policy: "${restart_policy}", priority: standard}
    expect: defined
    bind: {site_w: workload_id}
  - {label: service-shop, repeat: 3, command: weft.workloads.DefineService, actor: weft.actors.Deployer, caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}, input: {workload_id: "${shop_w_${i}}", replicas: "${replicas}", scale_rule: "${scale_rule}", disruption_budget: null, sleep_policy: null, wake_deadline: null}, expect: defined, bind: {"shop_s_${i}": service_id}}
  - {label: service-etl, repeat: 3, command: weft.workloads.DefineService, actor: weft.actors.Deployer, caller: {tenant_id: "${tenant_a}", account_id: "${account_a}"}, input: {workload_id: "${etl_w_${i}}", replicas: "${replicas}", scale_rule: "${scale_rule}", disruption_budget: null, sleep_policy: null, wake_deadline: null}, expect: defined, bind: {"etl_s_${i}": service_id}}
  - {label: service-site, command: weft.workloads.DefineService, actor: weft.actors.Deployer, caller: {tenant_id: "${tenant_b}", account_id: "${account_b}"}, input: {workload_id: "${site_w}", replicas: "${replicas}", scale_rule: "${scale_rule}", disruption_budget: null, sleep_policy: null, wake_deadline: null}, expect: defined, bind: {site_s: service_id}}

ticks: 6

traffic:
  - name: shop-fan-in
    formation: "${formation_shop}"
    account: "${account_a}"
    pattern: FanIn
    rate: "${rate}"
    step:
      label: autoscale-shop-api
      command: weft.workloads.AutoscaleService
      actor: weft.actors.Scheduler
      input: {service_id: "${shop_s_2}", replicas: "${replicas}", metric_value: "${rate}"}
  - name: etl-pipeline
    formation: "${formation_etl}"
    account: "${account_a}"
    pattern: Pipeline
    rate: "${rate}"
    step:
      label: autoscale-etl-transform
      command: weft.workloads.AutoscaleService
      actor: weft.actors.Scheduler
      input: {service_id: "${etl_s_1}", replicas: "${replicas}", metric_value: "${rate}"}

faults:
  - at: 3
    kind: node_loss
    silence: ["${node_g0_0}"]
    steps:
      - label: cordon-g0-0
        command: weft.infrastructure.CordonNode
        actor: weft.actors.ClusterOperator
        input: {node_id: "${node_g0_0}"}

controllers:
  - name: node-heartbeats
    steady: true
    limit: 64
    view: weft.nodes.NodeSessions
    filter: {state: Open}
    command: weft.nodes.Heartbeat
    actor: weft.actors.NodeAgent
    input: {session_id: row.session_id, node_id: row.node_id, received_at: "${now}"}
  - name: r3-lose-silent-sessions
    view: weft.nodes.SilentNodeSessions
    command: weft.nodes.LoseNodeSession
    actor: weft.actors.ControlPlane
    input: {session_id: row.session_id}
  - name: r3-release-expired-leases
    view: weft.nodes.ExpiredLeases
    command: weft.nodes.ReleaseAssignment
    actor: weft.actors.ControlPlane
    input: {assignment_id: row.assignment_id}
  - name: r1-request-replicas
    limit: 64
    rounds: 6
    view: weft.workloads.ServicesBelowScale
    command: weft.workloads.RequestReplica
    actor: weft.actors.Scheduler
    input: {service_id: row.service_id, replica_index: row.running_replicas}
  - name: scheduler-place
    limit: 64
    rounds: 2
    view: weft.scheduling.PendingRequests
    command: weft.scheduling.PlaceInstance
    actor: weft.actors.Scheduler
    input: {request_id: row.request_id, tenant_id: row.tenant_id, account_id: row.account_id, cluster_id: row.cluster_id, node_id: cand.node_id, node_pool_id: cand.node_pool_id, zone: cand.zone, isolation: vary.isolation, bindings: [], decided_at: "${now}"}
    each:
      view: weft.infrastructure.Nodes
      vary: {isolation: [Container, MicroVm]}
      spread: true
  - name: node-verify-artifact
    limit: 64
    view: weft.workloads.Instances
    filter: {state: Scheduled}
    command: weft.workloads.RecordArtifactVerified
    actor: weft.actors.NodeAgent
    input: {instance_id: row.instance_id, node_id: row.node_id, artifact_digest: row.artifact_digest}
  - name: node-report-running
    limit: 64
    view: weft.workloads.Instances
    filter: {state: Starting}
    command: weft.workloads.RecordInstanceRunning
    actor: weft.actors.NodeAgent
    input: {instance_id: row.instance_id, node_id: row.node_id}
  - name: lease-renewals
    steady: true
    limit: 64
    view: weft.nodes.Assignments
    filter: {state: Active}
    command: weft.nodes.RenewLease
    actor: weft.actors.NodeAgent
    input: {assignment_id: row.assignment_id, node_id: row.node_id, received_at: "${now}"}
converge_within: 4

invariants: [no-double-placement, quota-conservation, tenant-isolation]

mutations:
  - name: topology
    kind: vars
    point: topology
    values:
      - {kind: Star, role_0: Hub, role_1: Spoke, role_2: Spoke}
      - {kind: Ring, role_0: Member, role_1: Member, role_2: Member}
  - {name: replicas, kind: var, point: replicas, values: [1, 3]}
  - {name: nodes-per-pool, kind: var, point: per_pool, values: [2, 4]}

search:
  mode: exhaustive
  limit: 16
  weights: {link-crossings: -1, pattern-matches: -10, violations: -5, messages-unrouted: -1}

find:
  gaps: true
  patterns:
    - name: two-tenants-on-one-node-below-microvm
      rows:
        - {view: weft.nodes.Assignments, as: a, state: Active}
        - {view: weft.nodes.Assignments, as: b, state: Active}
        - {view: weft.scheduling.PlacementDecisions, as: da}
        - {view: weft.scheduling.PlacementDecisions, as: db}
      where:
        - a.node_id == b.node_id
        - a.placement_decision_id == da.decision_id
        - b.placement_decision_id == db.decision_id
        - da.tenant_id != db.tenant_id
        - da.isolation != MicroVm
    - name: placed-on-another-clusters-pool
      rows:
        - {view: weft.nodes.Assignments, as: a, state: Active}
        - {view: weft.scheduling.SchedulingRequests, as: r}
        - {view: weft.infrastructure.Nodes, as: n}
        - {view: weft.cluster.ClusterNodePools, params: {account_id: ["${account_a}", "${account_b}"]}, as: p}
      where:
        - a.instance_id == r.instance_id
        - a.node_id == n.node_id
        - n.node_pool_id == p.node_pool_id
        - p.cluster_id != r.cluster_id
    - name: placed-outside-dedicated-pools
      rows:
        - {view: weft.nodes.Assignments, as: a, state: Active}
        - {view: weft.scheduling.SchedulingRequests, as: r}
        - {view: weft.infrastructure.Nodes, as: n}
        - {view: weft.cluster.ClusterNodePools, params: {account_id: ["${account_a}", "${account_b}"]}, as: q, state_not: Removed}
        - {view: weft.cluster.ClusterNodePools, params: {account_id: ["${account_a}", "${account_b}"]}, as: p, absent: true}
      where:
        - a.instance_id == r.instance_id
        - a.node_id == n.node_id
        - q.cluster_id == r.cluster_id
        - p.cluster_id == r.cluster_id
        - p.node_pool_id == n.node_pool_id
    - name: quota-drawn-above-allocation
      rows:
        - {view: weft.accounts.QuotaIndex, as: parent}
        - {view: weft.accounts.QuotaIndex, as: child}
      where:
        - child.parent_quota_id == parent.quota_id
        - child.limit > parent.limit
    - name: quota-remaining-above-limit
      rows:
        - {view: weft.accounts.QuotaIndex, as: q}
      where:
        - q.remaining > q.limit
