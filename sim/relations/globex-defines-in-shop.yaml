# Steps appended to sim/experiments/full-setup.yaml for the non-interference relation
# (docs/hardening/pass-3.md, technique 5): globex's Deployer defines a workload in acme's formation
# shop with globex's account. Hardening pass 1 W1 refuses it (formation-foreign). Its label holds
# `globex`, so `--drop globex,site` leaves it out of the derived run with the rest of globex.
- label: globex-defines-workload-in-shop
  command: weft.workloads.DefineWorkload
  actor: weft.actors.Deployer
  caller: {tenant_id: "${tenant_b}", account_id: "${account_b}"}
  input: {account_id: "${account_b}", formation_id: "${formation_shop}", formation_revision_id: "${rev_shop}", environment_id: "${env_shop}", component: "${shop_c_2}", package_kind: Image, artifact_digest: "sha256:globex", runtime_id: "${runtime_id}", isolation: Container, shape: Service, settings: {shape: service, value: {stateful: false}}, claims: "${claims}", processes: "${processes}", restart_policy: "${restart_policy}", priority: standard}
  expect: formation-foreign
