format: ratchet/1
project: weft

subjects:
  specification:
    kind: codebase
    audiences: [developer, coding-agent]
  simulator:
    kind: codebase
    audiences: [developer, coding-agent]
  repository:
    kind: development-workflow
    audiences: [developer, coding-agent]
  docs-site:
    kind: documentation
    audiences: [reader, developer]

assessments:
  explore-from-setup:
    subject: specification
    assessor: weft-sim-report@1
    inputs: {report: sim/out/explore-from/result.json}
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      command: task sim-explore-from
      coverage: {executed: {min: 1024}, skipped: {max: 0}}
    measurements:
      outcomes-reached:
        kind: exact
        output: outcomes_reached
        scope: run
        identity: [outcome]
      invariant-violations:
        kind: exact
        output: violations
        scope: run
        identity: [kind, command]
      unsupported-answers:
        kind: exact
        output: unsupported_answers
        scope: run
        identity: [command]
      undeclared-refusals:
        kind: exact
        output: undeclared_refusals
        scope: run
        identity: [command]
      abstract-states:
        kind: exact
        output: abstract_states
        scope: run
      explore-time:
        kind: sampled
        output: elapsed
        scope: run

  experiment-cluster-pool-lifecycle:
    subject: specification
    assessor: weft-sim-report@1
    inputs: {report: sim/out/cluster-pool-lifecycle/result.json}
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      command: task sim-experiments
      coverage: {skipped: {max: 0}}
    measurements:
      invariant-violations:
        kind: exact
        output: violations
        scope: run
        identity: [kind, command]

  experiment-duplicate-delivery:
    subject: specification
    assessor: weft-sim-report@1
    inputs: {report: sim/out/duplicate-delivery/result.json}
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      command: task sim-experiments
      coverage: {skipped: {max: 0}}
    measurements:
      invariant-violations:
        kind: exact
        output: violations
        scope: run
        identity: [kind, command]

  experiment-full-setup:
    subject: specification
    assessor: weft-sim-report@1
    inputs: {report: sim/out/full-setup/result.json}
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      command: task sim-experiments
      coverage: {skipped: {max: 0}}
    measurements:
      invariant-violations:
        kind: exact
        output: violations
        scope: run
        identity: [kind, command]

  experiment-node-loss:
    subject: specification
    assessor: weft-sim-report@1
    inputs: {report: sim/out/node-loss/result.json}
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      command: task sim-experiments
      coverage: {skipped: {max: 0}}
    measurements:
      invariant-violations:
        kind: exact
        output: violations
        scope: run
        identity: [kind, command]

  experiment-stuck-placement:
    subject: specification
    assessor: weft-sim-report@1
    inputs: {report: sim/out/stuck-placement/result.json}
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      command: task sim-experiments
      coverage: {skipped: {max: 0}}
    measurements:
      invariant-violations:
        kind: exact
        output: violations
        scope: run
        identity: [kind, command]

  simulator-tests:
    subject: simulator
    assessor: command-timing@1
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      command: task sim-test
      coverage: {skipped: {max: 0}}
    measurements:
      test-time:
        kind: sampled
        output: duration
        scope: test

  repository-facts:
    subject: repository
    assessor: repo-facts@1
    target: {kind: revision, environments: [local]}
    observation:
      kind: snapshot
      command: task kpis
      conditions:
        all: {cache_profile: warm}
    measurements:
      gate-seconds:
        kind: sampled
        output: gate_seconds
        boundary: run_time
        scope: run
        unit: s
        better: lower
      test-step-seconds:
        kind: sampled
        output: test_step_seconds
        boundary: run_time
        scope: run
        unit: s
        better: lower
      slowest-test-seconds:
        kind: sampled
        output: slowest_test_seconds
        scope: run
        unit: s
        better: lower
      gate-budget-cases-failed:
        kind: exact
        output: gate_budget_cases_failed
        scope: run
        unit: cases
        better: lower
      test-binaries-per-crate:
        kind: exact
        output: test_binaries_per_crate
        scope: run
        unit: binaries
        better: lower
      python-files:
        kind: exact
        output: python_files
        scope: run
        unit: files
        better: lower
      toolchain-pins-disagree:
        kind: exact
        output: toolchain_pins_disagree
        scope: run
        unit: files
        better: lower
      cache-bypass:
        kind: exact
        output: cache_bypass
        scope: run
        unit: lines
        better: lower
      plan-validate-defects:
        kind: exact
        output: plan_validate_defects
        scope: run
        unit: defects
        better: lower

requirements:
  no-invariant-violations:
    assessment: explore-from-setup
    measurement: invariant-violations
    condition: {operator: lte, value: 0}
  no-violations-cluster-pool-lifecycle:
    assessment: experiment-cluster-pool-lifecycle
    measurement: invariant-violations
    condition: {operator: lte, value: 0}
  no-violations-duplicate-delivery:
    assessment: experiment-duplicate-delivery
    measurement: invariant-violations
    condition: {operator: lte, value: 0}
  no-violations-full-setup:
    assessment: experiment-full-setup
    measurement: invariant-violations
    condition: {operator: lte, value: 0}
  no-violations-node-loss:
    assessment: experiment-node-loss
    measurement: invariant-violations
    condition: {operator: lte, value: 0}
  no-violations-stuck-placement:
    assessment: experiment-stuck-placement
    measurement: invariant-violations
    condition: {operator: lte, value: 0}
  no-undeclared-refusals:
    assessment: explore-from-setup
    measurement: undeclared-refusals
    condition: {operator: lte, value: 0}
  no-new-unsupported-answers:
    assessment: explore-from-setup
    measurement: unsupported-answers
    condition: {operator: no_new_items}
    reference: {kind: accepted_value}
  no-lost-outcomes:
    assessment: explore-from-setup
    measurement: outcomes-reached
    condition: {operator: no_lost_items}
    reference: {kind: accepted_value}
  explore-within-budget:
    assessment: explore-from-setup
    measurement: explore-time
    condition: {operator: lte, value: 300, unit: s}
  test-within-budget:
    assessment: simulator-tests
    measurement: test-time
    condition: {operator: lte, value: 60, unit: s}
  repo-gate-time-not-worse:
    assessment: repository-facts
    measurement: gate-seconds
    condition: {operator: lte, value: 600, unit: s}
    reference:
      kind: accepted_value
      tolerance: {percent: 20, absolute: 10}
      adoption: {from: trusted_revision, runs: 5, aggregation: {kind: median}}
  repo-test-step-within-budget:
    assessment: repository-facts
    measurement: test-step-seconds
    condition: {operator: lte, value: 120, unit: s}
  repo-slowest-test-within-budget:
    assessment: repository-facts
    measurement: slowest-test-seconds
    condition: {operator: lte, value: 60, unit: s}
  repo-gate-budget-cases-pass:
    assessment: repository-facts
    measurement: gate-budget-cases-failed
    condition: {operator: lte, value: 0, unit: cases}
  repo-one-test-binary-per-crate:
    assessment: repository-facts
    measurement: test-binaries-per-crate
    condition: {operator: lte, value: 1, unit: binaries}
  repo-no-python-files:
    assessment: repository-facts
    measurement: python-files
    condition: {operator: lte, value: 0, unit: files}
  repo-toolchain-pins-agree:
    assessment: repository-facts
    measurement: toolchain-pins-disagree
    condition: {operator: lte, value: 0, unit: files}
  repo-no-cache-bypass:
    assessment: repository-facts
    measurement: cache-bypass
    condition: {operator: lte, value: 0, unit: lines}
  repo-plan-validates:
    assessment: repository-facts
    measurement: plan-validate-defects
    condition: {operator: lte, value: 0, unit: defects}

gates:
  merge:
    stage: pre-merge
    qualifying_environments: [local]
    requires:
      - no-invariant-violations
      - no-violations-cluster-pool-lifecycle
      - no-violations-duplicate-delivery
      - no-violations-full-setup
      - no-violations-node-loss
      - no-violations-stuck-placement
      - no-undeclared-refusals
      - no-new-unsupported-answers
      - no-lost-outcomes
      - explore-within-budget
      - test-within-budget
      - repo-gate-time-not-worse
      - repo-test-step-within-budget
      - repo-slowest-test-within-budget
      - repo-gate-budget-cases-pass
      - repo-one-test-binary-per-crate
      - repo-no-python-files
      - repo-toolchain-pins-agree
      - repo-no-cache-bypass
      - repo-plan-validates
