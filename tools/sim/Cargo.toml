[package]
name = "weft-sim"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "weft-sim"
path = "src/main.rs"
test = false

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
ess-conformance = { git = "https://github.com/beyond10x/ess", rev = "c0b5f560cb7cae0b04d845f27b06341d3013218e" }
ess-compiler = { git = "https://github.com/beyond10x/ess", rev = "c0b5f560cb7cae0b04d845f27b06341d3013218e" }
ess-domain = { git = "https://github.com/beyond10x/ess", rev = "c0b5f560cb7cae0b04d845f27b06341d3013218e" }
ess-primitives = { git = "https://github.com/beyond10x/ess", rev = "c0b5f560cb7cae0b04d845f27b06341d3013218e" }
ess-yaml = { git = "https://github.com/beyond10x/ess", rev = "c0b5f560cb7cae0b04d845f27b06341d3013218e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tiny_http = "0.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
