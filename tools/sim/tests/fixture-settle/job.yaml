domain: demo.job

summary: A job is placed with a ticket only its row shows (the view), then finished.

naming:
  wire: job
  display: Job

types:
  - name: demo.job.JobId
    kind: newtype
    of: Uuid

entities:
  - name: demo.job.Job
    identity:
      name: job_id
      type: demo.job.JobId
    fields:
      - name: ticket
        type: String
    lifecycle:
      initial: Queued
      states:
        - Queued
        - Placed
        - Done
      terminal: [Done]
      transitions:
        - name: place
          from: [Queued]
          to: Placed
        - name: finish
          from: [Placed]
          to: Done

commands:
  - name: demo.job.AddJob
    input: []
    outcomes:
      - name: added
        creates: demo.job.Job
        instance: job_id
        sets:
          ticket: {generated: true}
        emits: [demo.job.JobAdded]
        payload:
          demo.job.JobAdded:
            job_id: {generated: true}

  - name: demo.job.PlaceJob
    input:
      - {name: job_id, type: demo.job.JobId}
      - {name: ticket, type: String}
    outcomes:
      - name: no-such-job
        unknown_instance: true
        error: demo.job.NotFound
      - name: wrong-ticket
        when_subject:
          predicate: ticket != input.ticket
        error: demo.job.Refused
      - name: placed
        moves: demo.job.Job.place
        instance: job_id
        emits: [demo.job.JobMoved]
        payload:
          demo.job.JobMoved:
            job_id: input.job_id
      - name: not-queued
        wrong_state: true
        error: demo.job.Refused

  - name: demo.job.FinishJob
    input:
      - {name: job_id, type: demo.job.JobId}
    outcomes:
      - name: no-such-job
        unknown_instance: true
        error: demo.job.NotFound
      - name: finished
        moves: demo.job.Job.finish
        instance: job_id
        emits: [demo.job.JobMoved]
        payload:
          demo.job.JobMoved:
            job_id: input.job_id
      - name: not-placed
        wrong_state: true
        error: demo.job.Refused

events:
  - name: demo.job.JobAdded
    fields:
      - {name: job_id, type: demo.job.JobId}
  - name: demo.job.JobMoved
    fields:
      - {name: job_id, type: demo.job.JobId}

errors:
  - name: demo.job.NotFound
    summary: No job has this identifier.
  - name: demo.job.Refused
    summary: The job refuses.

views:
  - name: demo.job.Jobs
    source: demo.job.Job
    consistency: read_your_writes
    fields:
      - {name: job_id, type: demo.job.JobId}
      - {name: ticket, type: String}
      - {name: state, type: demo.job.Job.State}
