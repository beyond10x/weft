format: weft-sim-experiment/1
name: one-job
summary: One queued job; the placer controller places queued jobs with the ticket its view shows.
setup:
  - label: add-job
    command: demo.job.AddJob
    actor: demo.actors.Submitter
    input: {}
    expect: added
controllers:
  - name: placer
    view: demo.job.Jobs
    filter: {state: Queued}
    command: demo.job.PlaceJob
    actor: demo.actors.Placer
    input: {job_id: row.job_id, ticket: row.ticket}
