format: weft-sim-experiment/1
name: search-climb
summary: >-
  Opens a box `opens` times and closes the last one `closes` times. Fitness is the step count;
  a second close is refused not-open, a setup failure, so a point with more than one close is
  infeasible. The start point (1 open, 2 closes) is infeasible; the climb rises with the opens
  and stops at 4 opens and 1 close, where the round after finds no improvement.
seed: 7
converge_within: 0
vars:
  opens: 1
  closes: 0
setup:
  - label: open
    repeat: "${opens}"
    command: demo.box.OpenBox
    actor: demo.actors.Packer
    input: {label: a}
    expect: opened
    bind: {box: box_id}
  - label: close
    repeat: "${closes}"
    command: demo.box.CloseBox
    actor: demo.actors.Packer
    input: {box_id: "${box}"}
    expect: closed
mutations:
  - {name: opens, kind: var, point: opens, values: [1, 2, 3, 4]}
  - {name: closes, kind: var, point: closes, values: [2, 0, 1, 3]}
search:
  mode: fit
  limit: 16
  budget: 24
  weights: {steps: 1}
  gates: [setup-failures]
