domain: weft.actors

summary: The tenant who declares links and the Scheduler who places.

naming:
  wire: actors
  display: Actors

actors:
  - name: weft.actors.TenantOwner
    naming:
      wire: tenant-owner
      display: Tenant owner
    may:
      - weft.cluster.DeclareTopologyLink
  - name: weft.actors.Scheduler
    naming:
      wire: scheduler
      display: Scheduler
    may:
      - weft.scheduling.PlaceInstance
      - weft.scheduling.ReleasePlacement
