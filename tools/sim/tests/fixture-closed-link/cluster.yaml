domain: weft.cluster

summary: Declared links between topology groups of an account, crossable or closed.

naming:
  wire: cluster
  display: Cluster

entities:
  - name: weft.cluster.TopologyLink
    identity:
      name: topology_link_id
      type: weft.shared.TopologyLinkId
    fields:
      - name: account_id
        type: weft.shared.AccountId
      - name: from_group_id
        type: weft.shared.TopologyGroupId
      - name: to_group_id
        type: weft.shared.TopologyGroupId
      - name: crossable
        type: Boolean
    lifecycle:
      initial: Declared
      states:
        - Declared
      terminal: [Declared]
      transitions: []

commands:
  - name: weft.cluster.DeclareTopologyLink
    input:
      - {name: account_id, type: weft.shared.AccountId}
      - {name: from_group_id, type: weft.shared.TopologyGroupId}
      - {name: to_group_id, type: weft.shared.TopologyGroupId}
      - {name: crossable, type: Boolean}
    outcomes:
      - name: declared
        creates: weft.cluster.TopologyLink
        instance: topology_link_id
        sets:
          account_id: input.account_id
          from_group_id: input.from_group_id
          to_group_id: input.to_group_id
          crossable: input.crossable
        emits: [weft.cluster.TopologyLinkDeclared]
        payload:
          weft.cluster.TopologyLinkDeclared:
            topology_link_id: {generated: true}

events:
  - name: weft.cluster.TopologyLinkDeclared
    fields:
      - {name: topology_link_id, type: weft.shared.TopologyLinkId}

views:
  - name: weft.cluster.TopologyLinks
    source: weft.cluster.TopologyLink
    consistency: read_your_writes
    params:
      - {name: account_id, type: weft.shared.AccountId}
    filter: account_id == param.account_id
    fields:
      - {name: topology_link_id, type: weft.shared.TopologyLinkId}
      - {name: account_id, type: weft.shared.AccountId}
      - {name: from_group_id, type: weft.shared.TopologyGroupId}
      - {name: to_group_id, type: weft.shared.TopologyGroupId}
      - {name: crossable, type: Boolean}
      - {name: state, type: weft.cluster.TopologyLink.State}
