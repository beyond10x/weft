format: weft-sim-experiment/1
name: converges
summary: One instance, assigned by the binding; the releaser controller releases every active assignment, then has no work.
setup:
  - label: create-instance
    command: weft.nodes.CreateInstance
    actor: weft.actors.Operator
    input: {node_id: 00000000-0000-4000-8000-0000000000a1}
    expect: created
controllers:
  - name: releaser
    view: weft.nodes.Assignments
    filter: {state: Active}
    command: weft.nodes.Release
    actor: weft.actors.Scheduler
    input: {assignment_id: row.assignment_id}
