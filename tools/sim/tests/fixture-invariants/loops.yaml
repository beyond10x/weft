format: weft-sim-experiment/1
name: loops
summary: One instance, assigned by the binding; the reassigner controller assigns every active assignment's instance again, which Assign refuses, on every tick.
setup:
  - label: create-instance
    command: weft.nodes.CreateInstance
    actor: weft.actors.Operator
    input: {node_id: 00000000-0000-4000-8000-0000000000a1}
    expect: created
controllers:
  - name: reassigner
    view: weft.nodes.Assignments
    filter: {state: Active}
    command: weft.nodes.Assign
    actor: weft.actors.Scheduler
    input: {instance_id: row.instance_id, node_id: row.node_id}
