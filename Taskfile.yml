version: '3'

vars:
  CLOUDSPEC_REV: a485b7f459abd66261af25b558fb92df90570545
  CLOUDSPEC_SIM: target/cloudspec-sim/bin/cloudspec-sim

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: The gate, locally and in CI. Validate the ESS specification, hold its layers and its stamped time, test the CI path filter, check the docs claims, test the root workspace, self-test the test budget, then the hooks of tools/check.d.
    cmds:
      - task: spec
      - task: layers
      - task: stamped-time
      - task: ci-paths
      - task: docs-check
      - task: test
      - task: gate-budget
      - tools/run-hooks.sh tools/check.d

  test:
    desc: Test the root workspace. Makes the generated code (target/generated, synthesized or reused by its digest) that the test binaries build against, builds them; then tools/test-step.sh checks rustc and cargo-nextest against their pins, runs the hooks of tools/test-setup.d (the generated code again, a cache hit) and the tests (a test over 60 s is killed; setup and tests end at 120 s with exit 124), the hooks of tools/test-teardown.d, and prints the ten slowest tests.
    cmds:
      - tools/test-setup.d/10-generated.sh
      - cargo nextest run --workspace --no-run
      - tools/test-step.sh

  console:
    desc: The consoles of product/console alone, as task check runs them (tools/check.d/40-console.sh). Both ESS UI documents against the model, then type check, unit tests, one build and the Playwright run, killed at 120 s.
    cmds:
      - tools/check.d/40-console.sh

  gate-budget:
    desc: Self-test of the test budget on the fixture tools/budget-fixture, both sides of each limit, and the real limits read from the files.
    cmds:
      - tools/test-gate-budget.sh

  slow:
    desc: The slow lane, never part of check. Runs the hooks of tools/slow.d (regeneration that compares bytes).
    cmds:
      - tools/run-hooks.sh tools/slow.d

  kpis:
    desc: Print every KPI measured on this machine, one line each with its value, unit and command (tools/kpis.sh, the hooks of tools/kpis.d). Measures, so it runs without slot; never part of check.
    cmds:
      - tools/kpis.sh

  ci-paths:
    desc: Test the planning-only path filter of the CI gate on both sides.
    cmds:
      - tools/test-planning-only.sh

  docs-check:
    desc: Hold the docs claims KPIs at 0 (docs.dead-repo-links, docs.planned-without-banner, repo.agents-md-dead-paths, docs.status-claims-false). Self-tests the hooks of tools/docs-check.d on their fixture trees, then runs them on the tree (tools/check-docs.sh); no network, seconds.
    cmds:
      - tools/test-docs-check.sh
      - tools/check-docs.sh

  spec:
    desc: Validate the ESS domain model.
    cmds:
      - ess specify validate --path ess --strict-requires

  layers:
    desc: Fail when a domain refers to a domain of a higher layer (docs/layers.md).
    cmds:
      - tools/check-layers.sh

  stamped-time:
    desc: Fail when a command with a weft.shared.StampedAt input is granted outside tools/stamped-time-actors; then its negative case.
    cmds:
      - tools/check-stamped-time.sh
      - tools/check-stamped-time.sh --negative

  graph:
    desc: Print the domain reference graph with counts, then the layer check.
    cmds:
      - tools/check-layers.sh --graph

  domain:
    desc: Validate one domain with weft.shared only. Usage, task domain -- accounts
    cmds:
      - tools/check-domain.sh {{.CLI_ARGS}}

  sim-install:
    desc: Install cloudspec-sim, the in-memory explorer and simulator (crates/cloudspec-sim of beyond10x/cloudspec), at the revision CLOUDSPEC_REV into target/cloudspec-sim. Fetches from GitHub; never part of check. A second run with the same revision installs nothing.
    cmds:
      - cargo install --git https://github.com/beyond10x/cloudspec --rev {{.CLOUDSPEC_REV}} cloudspec-sim --locked --root target/cloudspec-sim

  sim-explore:
    desc: Explore the whole spec (measures; runs without slot). Usage, task sim-explore -- --serve
    deps: [sim-install]
    cmds:
      - '{{.CLOUDSPEC_SIM}} explore --spec ess --seed 1 --walks 2048 --steps 300 --threads 8 --out sim/out/explore {{.CLI_ARGS}}'

  sim-explore-from:
    desc: Explore with every walk starting from the full setup, settled by its controllers (measures; runs without slot).
    deps: [sim-install]
    cmds:
      - '{{.CLOUDSPEC_SIM}} explore --spec ess --seed 1 --walks 1024 --steps 300 --threads 8 --from sim/experiments/full-setup.yaml --settle 12 --out sim/out/explore-from {{.CLI_ARGS}}'

  sim-explore-ticks:
    desc: As sim-explore-from, with 1 step in 10 a tick of the setup's controllers; few walks, a tick costs about 1 s (measures; runs without slot).
    deps: [sim-install]
    cmds:
      - '{{.CLOUDSPEC_SIM}} explore --spec ess --seed 1 --walks 32 --steps 300 --threads 8 --from sim/experiments/full-setup.yaml --settle 12 --controller-share 0.1 --out sim/out/explore-ticks {{.CLI_ARGS}}'

  sim-experiments:
    desc: Run every experiment in sim/experiments (measures; runs without slot).
    deps: [sim-install]
    cmds:
      - for f in sim/experiments/*.yaml; do n=$(basename "$f" .yaml); {{.CLOUDSPEC_SIM}} simulate --spec ess --experiment "$f" --out "sim/out/$n" {{.CLI_ARGS}} || exit 1; done

  sim-relations:
    desc: Check the metamorphic relations of hardening pass 3 on the full setup (tools/sim-relations.sh; measures; runs without slot).
    deps: [sim-install]
    env:
      CLOUDSPEC_SIM: '{{.CLOUDSPEC_SIM}}'
    cmds:
      - tools/sim-relations.sh
