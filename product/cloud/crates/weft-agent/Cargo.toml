[package]
name = "weft-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
autobins = false
autotests = false

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "weft-agent"
path = "src/main.rs"
test = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
weft-client = { path = "../weft-client" }
weft-platform = { path = "../weft-platform" }

[dev-dependencies]
time = { version = "0.3", features = ["formatting", "parsing"] }
weft-impl = { path = "../weft-impl" }
weft-testkit = { path = "../weft-testkit" }
weft-types = { path = "../../../../target/generated/crates/weft-types" }

[lints]
workspace = true
