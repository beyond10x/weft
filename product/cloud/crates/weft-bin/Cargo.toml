[package]
name = "weft-bin"
version.workspace = true
edition.workspace = true
publish.workspace = true
autobins = false
autotests = false

[lib]
name = "weft_bin"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "weft"
path = "src/main.rs"
test = false

[[test]]
name = "main"
path = "tests/main.rs"

[features]
test-callers = []

[dependencies]
serde_json = "1"
weft-cloudspec = { path = "../weft-cloudspec" }
weft-controllers = { path = "../weft-controllers" }
weft-impl = { path = "../weft-impl" }
weft-server = { path = "../../../../target/generated/crates/weft-server" }
weft-system = { path = "../../../../target/generated/crates/weft-system" }
weft-types = { path = "../../../../target/generated/crates/weft-types" }

[lints]
workspace = true
