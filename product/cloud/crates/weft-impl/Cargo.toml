[package]
name = "weft-impl"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false
build = "build.rs"

[lib]
path = "src/lib.rs"
test = false
doctest = false

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
weft-api = { path = "../../../../target/generated/crates/weft-api" }
weft-control = { path = "../../../../target/generated/crates/weft-control" }
weft-edge = { path = "../../../../target/generated/crates/weft-edge" }
weft-node = { path = "../../../../target/generated/crates/weft-node" }
weft-system = { path = "../../../../target/generated/crates/weft-system" }
weft-types = { path = "../../../../target/generated/crates/weft-types" }

[lints]
workspace = true
